#172b3a" text-anchor="start">Field</text><text x="323.1" y="115.6" font-size="11.5" font-weight="700" fill="#172b3a" text-anchor="start">Entry</text><text x="45.0" y="138.6" font-size="11.5" font-weight="400" fill="#172b3a" text-anchor="start">TQ number</text><text x="323.1" y="138.6" font-size="11.5" font-weight="400" fill="#172b3a" text-anchor="start">B2-MVS-TQ-017</text><text x="45.0" y="161.6" font-size="11.5" font-weight="400" fill="#172b3a" text-anchor="start">Asset tags</text><text x="323.1" y="161.6" font-size="11.5" font-weight="400" fill="#172b3a" text-anchor="start">B2-MVS-01 suite</text><text x="45.0" y="184.6" font-size="11.5" font-weight="400" fill="#172b3a" text-anchor="start">Specification requirement</text><text x="323.1" y="184.6" font-size="11.5" font-weight="400" fill="#172b3a" text-anchor="start">busbar short-time withstand 31.5 kA for 1 s</text><text x="45.0" y="207.6" font-size="11.5" font-weight="400" fill="#172b3a" text-anchor="start">Proposed deviation</text><text x="323.1" y="207.6" font-size="11.5" font-weight="400" fill="#172b3a" text-anchor="start">busbar short-time withstand 31.5 kA for 3 s</text><text x="45.0" y="230.6" font-size="11.5" font-weight="400" fill="#172b3a" text-anchor="start">Reason</text><text x="323.1" y="230.6" font-size="11.5" font-weight="400" fill="#172b3a" text-anchor="start">manufacturing standard: type-tested design rated 3 s</text><text x="45.0" y="253.6" font-size="11.5" font-weight="400" fill="#172b3a" text-anchor="start">Effect on type tests</text><text x="323.1" y="253.6" font-size="11.5" font-weight="400" fill="#172b3a" text-anchor="start">covered by the type test certificate for 31.5 kA, 3 s</text><text x="45.0" y="276.6" font-size="11.5" font-weight="400" fill="#172b3a" text-anchor="start">Effect on FAT</text><text x="323.1" y="276.6" font-size="11.5" font-weight="400" fill="#172b3a" text-anchor="start">none; FAT procedure unchanged</text><text x="45.0" y="299.6" font-size="11.5" font-weight="400" fill="#172b3a" text-anchor="start">Effect on spares</text><text x="323.1" y="299.6" font-size="11.5" font-weight="400" fill="#172b3a" text-anchor="start">none; same busbar part numbers</text><text x="45.0" y="322.6" font-size="11.5" font-weight="400" fill="#172b3a" text-anchor="start">Effect on protection</text><text x="323.1" y="322.6" font-size="11.5" font-weight="400" fill="#172b3a" text-anchor="start">none; 3 s rating exceeds the duration and 25.0 kA</text><text x="45.0" y="345.6" font-size="11.5" font-weight="400" fill="#172b3a" text-anchor="start">Decision</text><text x="323.1" y="345.6" font-size="11.5" font-weight="400" fill="#172b3a" text-anchor="start">accepted within 4 working days</text><text x="45.0" y="368.6" font-size="11.5" font-weight="400" fill="#172b3a" text-anchor="start">Linked items</text><text x="323.1" y="368.6" font-size="11.5" font-weight="400" fill="#172b3a" text-anchor="start">FAT dossier of B2-MVS-01; submittal register entry</text><text x="45.0" y="415.6" font-size="11.5" font-weight="700" fill="#172b3a" text-anchor="start">Rating check</text><text x="401.1" y="415.6" font-size="11.5" font-weight="700" fill="#172b3a" text-anchor="start">Current</text><text x="549.5" y="415.6" font-size="11.5" font-weight="700" fill="#172b3a" text-anchor="start">Duration</text><text x="786.9" y="415.6" font-size="11.5" font-weight="700" fill="#172b3a" text-anchor="start">Result</text><text x="45.0" y="438.6" font-size="11.5" font-weight="400" fill="#172b3a" text-anchor="start">Specified</text><text x="401.1" y="438.6" font-size="11.5" font-weight="400" fill="#172b3a" text-anchor="start">31.5 kA</text><text x="549.5" y="438.6" font-size="11.5" font-weight="400" fill="#172b3a" text-anchor="start">1 s</text><text x="786.9" y="438.6" font-size="11.5" font-weight="400" fill="#172b3a" text-anchor="start">requirement</text><text x="45.0" y="461.6" font-size="11.5" font-weight="400" fill="#172b3a" text-anchor="start">Proposed (type-tested)</text><text x="401.1" y="461.6" font-size="11.5" font-weight="400" fill="#172b3a" text-anchor="start">31.5 kA</text><text x="549.5" y="461.6" font-size="11.5" font-weight="400" fill="#172b3a" text-anchor="start">3 s</text><text x="786.9" y="461.6" font-size="11.5" font-weight="400" fill="#172b3a" text-anchor="start">covers 1 s</text><text x="45.0" y="484.6" font-size="11.5" font-weight="400" fill="#172b3a" text-anchor="start">System: bus fault level, tie closed</text><text x="401.1" y="484.6" font-size="11.5" font-weight="400" fill="#172b3a" text-anchor="start">25.0 kA</text><text x="549.5" y="484.6" font-size="11.5" font-weight="400" fill="#172b3a" text-anchor="start">protection clearing time</text><text x="786.9" y="484.6" font-size="11.5" font-weight="400" fill="#172b3a" text-anchor="start">below 31.5 kA</text><text x="140.0" y="560.4" font-size="11.5" font-weight="700" fill="#334155" text-anchor="middle">Supplier</text><text x="140.0" y="573.2" font-size="9.5" font-weight="400" fill="#172b3a" text-anchor="middle">raises TQ before</text><text x="140.0" y="586.0" font-size="9.5" font-weight="400" fill="#172b3a" text-anchor="middle">manufacture</text><text x="380.0" y="560.4" font-size="11.5" font-weight="700" fill="#334155" text-anchor="middle">GC document control</text><text x="380.0" y="573.2" font-size="9.5" font-weight="400" fill="#172b3a" text-anchor="middle">registers, routes</text><text x="380.0" y="586.0" font-size="9.5" font-weight="400" fill="#172b3a" text-anchor="middle">to the designer</text><text x="620.0" y="560.4" font-size="11.5" font-weight="700" fill="#334155" text-anchor="middle">Designer of record</text><text x="620.0" y="573.2" font-size="9.5" font-weight="400" fill="#172b3a" text-anchor="middle">decides within</text><text x="620.0" y="586.0" font-size="9.5" font-weight="400" fill="#172b3a" text-anchor="middle">4 working days</text><text x="860.0" y="560.4" font-size="11.5" font-weight="700" fill="#334155" text-anchor="middle">FAT dossier</text><text x="860.0" y="573.2" font-size="9.5" font-weight="400" fill="#172b3a" text-anchor="middle">certificate filed;</text><text x="860.0" y="586.0" font-size="9.5" font-weight="400" fill="#172b3a" text-anchor="middle">FAT witness checks</text><text x="24.0" y="30.0" font-size="17" font-weight="700" fill="#172b3a" text-anchor="start">F32-14  TQ form as printed: B2-MVS-TQ-017, 20 kV switchgear busbar short-time rating</text><text x="24.0" y="48.0" font-size="10" font-weight="400" fill="#5b6b78" text-anchor="start">specified 31.5 kA for 1 s · proposed 31.5 kA for 3 s (manufacturer&#x27;s type-tested design) · maximum bus fault level 25.0 kA with the tie closed · accepted within 4 working</text><text x="24.0" y="61.0" font-size="10" font-weight="400" fill="#5b6b78" text-anchor="start">days · certificate filed in the FAT dossier</text><text x="32.0" y="646.0" font-size="10" font-weight="700" fill="#2d6a4f" text-anchor="start">WHAT TO PROVE</text><text x="32.0" y="662.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">• The proposed 3 s rating at 31.5 kA exceeds the specified 1 s, and 31.5 kA exceeds the 25.0 kA bus fault level, so protection settings do not change.</text><text x="32.0" y="677.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">• The decision is recorded within 4 working days, and the type test certificate goes into the FAT dossier of B2-MVS-01.</text><rect x="24" y="704" width="952" height="44" rx="0" fill="#f6f8fa" fill-opacity="1" stroke="#5b6b78" stroke-width="1"/><text x="32.0" y="718.0" font-size="11" font-weight="700" fill="#172b3a" text-anchor="start">F32-14  ·  TQ form as printed: B2-MVS-TQ-017, 20 kV switchgear busbar short-time rating</text><text x="968.0" y="718.0" font-size="10" font-weight="400" fill="#5b6b78" text-anchor="end">Chapter 32 · §32.2.2</text><text x="32.0" y="731.0" font-size="9" font-weight="400" fill="#5b6b78" text-anchor="start">Data Centre Commissioning Field Manual R01 EN · October 2026 · educational reference, not to scale · project and OEM documents govern</text><text x="32.0" y="743.0" font-size="9" font-weight="400" fill="#5b6b78" text-anchor="start">Symbols: QElectroTech EN 60617 and P&amp;ID collections, CC-BY 3.0, native geometry · instrument bubbles per ISA 5.1 · states per IEC 60617 / IEEE C37.2 practice</text></svg>