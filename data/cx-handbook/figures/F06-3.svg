<svg xmlns="http://www.w3.org/2000/svg" width="174mm" height="155.4mm" viewBox="0 0 1000 893" font-family="DejaVu Sans" role="img" aria-labelledby="t"><title id="t">F06-3 Structure of a method statement and risk assessment (MSRA)</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="context-stroke"/></marker><marker id="arrow-simple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#172b3a"/></marker></defs><rect width="1000" height="893" fill="#ffffff"/><rect x="4" y="4" width="992" height="885" fill="none" stroke="#172b3a" stroke-width="1.6"/><rect x="24" y="755.8999999999999" width="952" height="56" rx="4" fill="#f1f8f4" fill-opacity="1" stroke="#2d6a4f" stroke-width="1"/><rect x="80" y="110" width="840" height="44.3" rx="0" fill="#eef3f7" fill-opacity="1" stroke="#172b3a" stroke-width="1.4"/><rect x="80" y="158.3" width="840" height="44.3" rx="0" fill="#eef3f7" fill-opacity="1" stroke="#172b3a" stroke-width="1.4"/><rect x="80" y="206.60000000000002" width="840" height="44.3" rx="0" fill="#eef3f7" fill-opacity="1" stroke="#172b3a" stroke-width="1.4"/><rect x="80" y="254.90000000000003" width="840" height="44.3" rx="0" fill="#f4f8ee" fill-opacity="1" stroke="#172b3a" stroke-width="1.4"/><rect x="80" y="303.20000000000005" width="840" height="44.3" rx="0" fill="#fdf3e2" fill-opacity="1" stroke="#172b3a" stroke-width="1.4"/><rect x="80" y="351.50000000000006" width="840" height="44.3" rx="0" fill="#f4f8ee" fill-opacity="1" stroke="#172b3a" stroke-width="1.4"/><rect x="80" y="399.80000000000007" width="840" height="44.3" rx="0" fill="#fdf3e2" fill-opacity="1" stroke="#172b3a" stroke-width="1.4"/><rect x="80" y="448.1000000000001" width="840" height="44.3" rx="0" fill="#fbe9e9" fill-opacity="1" stroke="#172b3a" stroke-width="1.4"/><rect x="80" y="496.4000000000001" width="840" height="44.3" rx="0" fill="#fbe9e9" fill-opacity="1" stroke="#172b3a" stroke-width="1.4"/><rect x="80" y="544.7" width="840" height="44.3" rx="0" fill="#f4f8ee" fill-opacity="1" stroke="#172b3a" stroke-width="1.4"/><rect x="80" y="593.0" width="840" height="44.3" rx="0" fill="#eef3f7" fill-opacity="1" stroke="#172b3a" stroke-width="1.4"/><rect x="80" y="641.3" width="840" height="44.3" rx="0" fill="#eef3f7" fill-opacity="1" stroke="#172b3a" stroke-width="1.4"/><rect x="80" y="689.5999999999999" width="840" height="44.3" rx="0" fill="#eef3f7" fill-opacity="1" stroke="#172b3a" stroke-width="1.4"/><text x="500.0" y="123.8" font-size="12" font-weight="700" fill="#172b3a" text-anchor="middle">1 Document control</text><text x="500.0" y="137.3" font-size="10" font-weight="400" fill="#172b3a" text-anchor="middle">identifier MSC1-MSW-B2-00-MS-X-0004, revision, author, reviewer, approver</text><text x="500.0" y="172.1" font-size="12" font-weight="700" fill="#172b3a" text-anchor="middle">2 Scope</text><text x="500.0" y="185.6" font-size="10" font-weight="400" fill="#172b3a" text-anchor="middle">task, room B2-00-MV1, tags, start and end of the task</text><text x="500.0" y="220.4" font-size="12" font-weight="700" fill="#172b3a" text-anchor="middle">3 References</text><text x="500.0" y="233.9" font-size="10" font-weight="400" fill="#172b3a" text-anchor="middle">SLD C02, relay setting file C01, OEM manual, ITP, test scripts</text><text x="500.0" y="268.7" font-size="12" font-weight="700" fill="#172b3a" text-anchor="middle">4 Organisation and competence</text><text x="500.0" y="282.2" font-size="10" font-weight="400" fill="#172b3a" text-anchor="middle">authorised person, competent persons, CxM witness, certifications</text><text x="500.0" y="317.0" font-size="12" font-weight="700" fill="#172b3a" text-anchor="middle">5 Prerequisites</text><text x="500.0" y="330.5" font-size="10" font-weight="400" fill="#172b3a" text-anchor="middle">L2 signed, VLF and PD recorded, relays injected, earthing tested</text><text x="500.0" y="365.3" font-size="12" font-weight="700" fill="#172b3a" text-anchor="middle">6 Plant, tools, instruments</text><text x="500.0" y="378.8" font-size="10" font-weight="400" fill="#172b3a" text-anchor="middle">voltage detector 24 kV, phasing sticks, relay test set, certificates</text><text x="500.0" y="413.6" font-size="12" font-weight="700" fill="#172b3a" text-anchor="middle">7 Sequence of work</text><text x="500.0" y="427.1" font-size="10" font-weight="400" fill="#172b3a" text-anchor="middle">numbered steps with hold points H1 and H2</text><text x="500.0" y="461.9" font-size="12" font-weight="700" fill="#172b3a" text-anchor="middle">8 Risk assessment</text><text x="500.0" y="475.4" font-size="10" font-weight="400" fill="#172b3a" text-anchor="middle">hazard per step, score L x S before and after controls</text><text x="500.0" y="510.2" font-size="12" font-weight="700" fill="#172b3a" text-anchor="middle">9 Controls</text><text x="500.0" y="523.7" font-size="10" font-weight="400" fill="#172b3a" text-anchor="middle">permit, LOTO, exclusion zone, remote closing, arc-rated PPE</text><text x="500.0" y="558.5" font-size="12" font-weight="700" fill="#172b3a" text-anchor="middle">10 Emergency arrangements</text><text x="500.0" y="572.0" font-size="10" font-weight="400" fill="#172b3a" text-anchor="middle">rescue hook, insulated mat, first aider, radio channel</text><text x="500.0" y="606.8" font-size="12" font-weight="700" fill="#172b3a" text-anchor="middle">11 Environmental controls</text><text x="500.0" y="620.3" font-size="10" font-weight="400" fill="#172b3a" text-anchor="middle">waste, spills, noise</text><text x="500.0" y="655.1" font-size="12" font-weight="700" fill="#172b3a" text-anchor="middle">12 Inspection and records</text><text x="500.0" y="668.6" font-size="10" font-weight="400" fill="#172b3a" text-anchor="middle">energisation, phasing and relay status records</text><text x="500.0" y="703.4" font-size="12" font-weight="700" fill="#172b3a" text-anchor="middle">13 Briefing record</text><text x="500.0" y="716.9" font-size="10" font-weight="400" fill="#172b3a" text-anchor="middle">names and signatures on the day</text><text x="24.0" y="30.0" font-size="17" font-weight="700" fill="#172b3a" text-anchor="start">F06-3  Structure of a method statement and risk assessment (MSRA)</text><text x="24.0" y="48.0" font-size="11" font-weight="400" fill="#5b6b78" text-anchor="start">Thirteen sections · example: first energisation of 20 kV switchgear B2-MVS-01 · submitted 10 working days before the task, reviewed in 5</text><text x="32.0" y="769.9" font-size="10" font-weight="700" fill="#2d6a4f" text-anchor="start">WHAT TO PROVE</text><text x="32.0" y="785.9" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">• Every control listed in the risk assessment (section 8 and 9) appears as a numbered step in the sequence (section 7).</text><text x="32.0" y="800.9" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">• The MSRA is at code A or B and the briefing record is signed before the task starts.</text><rect x="24" y="833.8999999999999" width="952" height="44" rx="0" fill="#f6f8fa" fill-opacity="1" stroke="#5b6b78" stroke-width="1"/><text x="32.0" y="847.9" font-size="11" font-weight="700" fill="#172b3a" text-anchor="start">F06-3  ·  Structure of a method statement and risk assessment (MSRA)</text><text x="968.0" y="847.9" font-size="10" font-weight="400" fill="#5b6b78" text-anchor="end">Chapter 06 · §06.9</text><text x="32.0" y="860.9" font-size="9" font-weight="400" fill="#5b6b78" text-anchor="start">Data Centre Commissioning Field Manual R01 EN · October 2026 · educational reference, not to scale · project and OEM documents govern</text><text x="32.0" y="872.9" font-size="9" font-weight="400" fill="#5b6b78" text-anchor="start">Symbols: QElectroTech EN 60617 and P&amp;ID collections, CC-BY 3.0, native geometry · instrument bubbles per ISA 5.1 · states per IEC 60617 / IEEE C37.2 practice</text></svg>