<svg xmlns="http://www.w3.org/2000/svg" width="267mm" height="216.3mm" viewBox="0 0 1400 1134" font-family="DejaVu Sans" role="img" aria-labelledby="t"><title id="t">F29-3 Decision tree: BACnet device offline in the BMS (BACnet/IP and MS/TP)</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="context-stroke"/></marker><marker id="arrow-simple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#172b3a"/></marker><marker id="arrow-475569" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#475569"/></marker><marker id="arrow-b91c1c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#b91c1c"/></marker></defs><rect width="1400" height="1134" fill="#ffffff"/><rect x="4" y="4" width="1392" height="1126" fill="none" stroke="#172b3a" stroke-width="1.6"/><rect x="24" y="954" width="1352" height="56" rx="4" fill="#f1f8f4" fill-opacity="1" stroke="#2d6a4f" stroke-width="1"/><polyline points="340.0,180.0 340.0,214.0" fill="none" stroke="#475569" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#arrow-475569)"/><polyline points="620.0,244.0 760.0,244.0" fill="none" stroke="#b91c1c" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#arrow-b91c1c)"/><polyline points="340.0,274.0 340.0,308.0" fill="none" stroke="#475569" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#arrow-475569)"/><polyline points="620.0,338.0 760.0,338.0" fill="none" stroke="#b91c1c" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#arrow-b91c1c)"/><polyline points="340.0,368.0 340.0,402.0" fill="none" stroke="#475569" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#arrow-475569)"/><polyline points="620.0,432.0 760.0,432.0" fill="none" stroke="#b91c1c" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#arrow-b91c1c)"/><polyline points="340.0,462.0 340.0,496.0" fill="none" stroke="#475569" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#arrow-475569)"/><polyline points="620.0,526.0 760.0,526.0" fill="none" stroke="#b91c1c" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#arrow-b91c1c)"/><polyline points="340.0,556.0 340.0,590.0" fill="none" stroke="#475569" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#arrow-475569)"/><polyline points="620.0,620.0 760.0,620.0" fill="none" stroke="#b91c1c" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#arrow-b91c1c)"/><polyline points="340.0,650.0 340.0,684.0" fill="none" stroke="#475569" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#arrow-475569)"/><polyline points="620.0,714.0 760.0,714.0" fill="none" stroke="#b91c1c" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#arrow-b91c1c)"/><polyline points="340.0,744.0 340.0,778.0" fill="none" stroke="#475569" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#arrow-475569)"/><polyline points="620.0,808.0 760.0,808.0" fill="none" stroke="#b91c1c" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#arrow-b91c1c)"/><polyline points="340.0,838.0 340.0,872.0" fill="none" stroke="#475569" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#arrow-475569)"/><rect x="60" y="120" width="560" height="60" rx="0" fill="#ffffff" fill-opacity="1" stroke="#475569" stroke-width="1.4"/><rect x="60" y="214" width="560" height="60" rx="0" fill="#ffffff" fill-opacity="1" stroke="#475569" stroke-width="1.4"/><rect x="760" y="214" width="600" height="60" rx="0" fill="#ffffff" fill-opacity="1" stroke="#b91c1c" stroke-width="1.4"/><rect x="60" y="308" width="560" height="60" rx="0" fill="#ffffff" fill-opacity="1" stroke="#475569" stroke-width="1.4"/><rect x="760" y="308" width="600" height="60" rx="0" fill="#ffffff" fill-opacity="1" stroke="#b91c1c" stroke-width="1.4"/><rect x="60" y="402" width="560" height="60" rx="0" fill="#ffffff" fill-opacity="1" stroke="#475569" stroke-width="1.4"/><rect x="760" y="402" width="600" height="60" rx="0" fill="#ffffff" fill-opacity="1" stroke="#b91c1c" stroke-width="1.4"/><rect x="60" y="496" width="560" height="60" rx="0" fill="#ffffff" fill-opacity="1" stroke="#475569" stroke-width="1.4"/><rect x="760" y="496" width="600" height="60" rx="0" fill="#ffffff" fill-opacity="1" stroke="#b91c1c" stroke-width="1.4"/><rect x="60" y="590" width="560" height="60" rx="0" fill="#ffffff" fill-opacity="1" stroke="#475569" stroke-width="1.4"/><rect x="760" y="590" width="600" height="60" rx="0" fill="#ffffff" fill-opacity="1" stroke="#b91c1c" stroke-width="1.4"/><rect x="60" y="684" width="560" height="60" rx="0" fill="#ffffff" fill-opacity="1" stroke="#475569" stroke-width="1.4"/><rect x="760" y="684" width="600" height="60" rx="0" fill="#ffffff" fill-opacity="1" stroke="#b91c1c" stroke-width="1.4"/><rect x="60" y="778" width="560" height="60" rx="0" fill="#ffffff" fill-opacity="1" stroke="#475569" stroke-width="1.4"/><rect x="760" y="778" width="600" height="60" rx="0" fill="#ffffff" fill-opacity="1" stroke="#b91c1c" stroke-width="1.4"/><rect x="60" y="872" width="560" height="60" rx="8" fill="#ffffff" fill-opacity="1" stroke="#334155" stroke-width="1.4"/><text x="340.0" y="141.8" font-size="11.5" font-weight="700" fill="#475569" text-anchor="middle">1. Scope: one device, one trunk, one subnet</text><text x="340.0" y="154.6" font-size="9.5" font-weight="400" fill="#172b3a" text-anchor="middle">trunk: router; subnet: IP or BBMD</text><text x="340.0" y="242.2" font-size="11.5" font-weight="700" fill="#475569" text-anchor="middle">2. Power and status LED at the device</text><text x="1060.0" y="242.2" font-size="11.5" font-weight="700" fill="#b91c1c" text-anchor="middle">Restore supply; replace device</text><text x="340.0" y="329.8" font-size="11.5" font-weight="700" fill="#475569" text-anchor="middle">3. BACnet/IP: ping, then Who-Is</text><text x="340.0" y="342.6" font-size="9.5" font-weight="400" fill="#172b3a" text-anchor="middle">UDP 47808, network number, instance</text><text x="1060.0" y="336.2" font-size="11.5" font-weight="700" fill="#b91c1c" text-anchor="middle">Fix VLAN, firewall or BACnet port</text><text x="340.0" y="423.8" font-size="11.5" font-weight="700" fill="#475569" text-anchor="middle">4. MS/TP: MAC and instance unique</text><text x="340.0" y="436.6" font-size="9.5" font-weight="400" fill="#172b3a" text-anchor="middle">Who-Is scan sorted by instance</text><text x="1060.0" y="423.8" font-size="11.5" font-weight="700" fill="#b91c1c" text-anchor="middle">Set unique MAC and instance</text><text x="1060.0" y="436.6" font-size="9.5" font-weight="400" fill="#172b3a" text-anchor="middle">instance plan per building</text><text x="340.0" y="517.8" font-size="11.5" font-weight="700" fill="#475569" text-anchor="middle">5. Baud rate equal on the trunk</text><text x="340.0" y="530.6" font-size="9.5" font-weight="400" fill="#172b3a" text-anchor="middle">set by hand, not auto-baud</text><text x="1060.0" y="517.8" font-size="11.5" font-weight="700" fill="#b91c1c" text-anchor="middle">Set the trunk baud rate</text><text x="1060.0" y="530.6" font-size="9.5" font-weight="400" fill="#172b3a" text-anchor="middle">one device can stop the trunk</text><text x="340.0" y="611.8" font-size="11.5" font-weight="700" fill="#475569" text-anchor="middle">6. Max Master ≥ highest MAC</text><text x="340.0" y="624.6" font-size="9.5" font-weight="400" fill="#172b3a" text-anchor="middle">default 127 or 64 by product</text><text x="1060.0" y="618.2" font-size="11.5" font-weight="700" fill="#b91c1c" text-anchor="middle">Raise Max Master on all devices</text><text x="340.0" y="705.8" font-size="11.5" font-weight="700" fill="#475569" text-anchor="middle">7. Termination and biasing</text><text x="340.0" y="718.6" font-size="9.5" font-weight="400" fill="#172b3a" text-anchor="middle">about 60 Ω across pair, ends only</text><text x="1060.0" y="705.8" font-size="11.5" font-weight="700" fill="#b91c1c" text-anchor="middle">Fit terminators at the two ends</text><text x="1060.0" y="718.6" font-size="9.5" font-weight="400" fill="#172b3a" text-anchor="middle">bias at one point</text><text x="340.0" y="799.8" font-size="11.5" font-weight="700" fill="#475569" text-anchor="middle">8. Error counters on router</text><text x="340.0" y="812.6" font-size="9.5" font-weight="400" fill="#172b3a" text-anchor="middle">framing and CRC errors per device</text><text x="1060.0" y="799.8" font-size="11.5" font-weight="700" fill="#b91c1c" text-anchor="middle">Repair wiring, shield or device</text><text x="1060.0" y="812.6" font-size="9.5" font-weight="400" fill="#172b3a" text-anchor="middle">noise or baud mismatch</text><text x="340.0" y="893.8" font-size="11.5" font-weight="700" fill="#334155" text-anchor="middle">Retest: trunk online 24 h</text><text x="340.0" y="906.6" font-size="9.5" font-weight="400" fill="#172b3a" text-anchor="middle">no offline events; counters low</text><text x="760.0" y="892.0" font-size="11" font-weight="400" fill="#5b6b78" text-anchor="start">Arrow down: the check found nothing, go to the next check.</text><text x="760.0" y="912.0" font-size="11" font-weight="400" fill="#5b6b78" text-anchor="start">Arrow right: the check found the fault, apply the fix, then retest.</text><text x="24.0" y="30.0" font-size="17" font-weight="700" fill="#172b3a" text-anchor="start">F29-3  Decision tree: BACnet device offline in the BMS (BACnet/IP and MS/TP)</text><text x="24.0" y="48.0" font-size="11" font-weight="400" fill="#5b6b78" text-anchor="start">scope first: one device, one trunk or one subnet · MS/TP: same baud on the trunk, Max Master ≥ highest MAC, unique MAC, 120 Ω at the two ends only · BACnet/IP: ping, then Who-Is on UDP 47808 · retest 24 h</text><text x="32.0" y="968.0" font-size="10" font-weight="700" fill="#2d6a4f" text-anchor="start">WHAT TO PROVE</text><text x="32.0" y="984.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">• A device whose MAC is above the Max Master value of the other masters is never polled; Max Master is set at least equal to the highest MAC on the trunk.</text><text x="32.0" y="999.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">• Ping reply with no I-Am points to BACnet configuration (port, network number, instance); no ping reply points to the IP network.</text><text x="24.0" y="1034.0" font-size="10" font-weight="700" fill="#5b6b78" text-anchor="start">LEGEND</text><line x1="24" y1="1056" x2="50" y2="1056" stroke="#475569" stroke-width="3"/><text x="56.0" y="1060.0" font-size="10" font-weight="400" fill="#172b3a" text-anchor="start">signal / control</text><line x1="151.9671875" y1="1056" x2="177.9671875" y2="1056" stroke="#b91c1c" stroke-width="3"/><text x="184.0" y="1060.0" font-size="10" font-weight="400" fill="#172b3a" text-anchor="start">trip / protection</text><line x1="283.934375" y1="1056" x2="309.934375" y2="1056" stroke="#334155" stroke-width="3"/><text x="315.9" y="1060.0" font-size="10" font-weight="400" fill="#172b3a" text-anchor="start">data / network</text><rect x="24" y="1074" width="1352" height="44" rx="0" fill="#f6f8fa" fill-opacity="1" stroke="#5b6b78" stroke-width="1"/><text x="32.0" y="1088.0" font-size="11" font-weight="700" fill="#172b3a" text-anchor="start">F29-3  ·  Decision tree: BACnet device offline in the BMS (BACnet/IP and MS/TP)</text><text x="1368.0" y="1088.0" font-size="10" font-weight="400" fill="#5b6b78" text-anchor="end">Chapter 29 · §29.10</text><text x="32.0" y="1101.0" font-size="9" font-weight="400" fill="#5b6b78" text-anchor="start">Data Centre Commissioning Field Manual R01 EN · October 2026 · educational reference, not to scale · project and OEM documents govern</text><text x="32.0" y="1113.0" font-size="9" font-weight="400" fill="#5b6b78" text-anchor="start">Symbols: QElectroTech EN 60617 and P&amp;ID collections, CC-BY 3.0, native geometry · instrument bubbles per ISA 5.1 · states per IEC 60617 / IEEE C37.2 practice</text></svg>