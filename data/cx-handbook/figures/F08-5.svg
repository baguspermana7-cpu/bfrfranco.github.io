t-size="11" font-weight="400" fill="#172b3a" text-anchor="start">232.0 L/s</text><text x="1265.0" y="267.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">308.9 L/s</text><text x="1005.0" y="289.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">Flow per rack</text><text x="1165.0" y="289.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">139.2 L/min</text><text x="1265.0" y="289.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">185.3 L/min</text><text x="1005.0" y="311.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">Rack current 415 V</text><text x="1165.0" y="311.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">170.4 A</text><text x="1265.0" y="311.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">201.6 A</text><text x="1000.0" y="360.0" font-size="11.5" font-weight="400" fill="#172b3a" text-anchor="start">Markers on the plot: the contract point (120 kW, capture 0.8,</text><text x="1000.0" y="375.5" font-size="11.5" font-weight="400" fill="#172b3a" text-anchor="start">2.40 MW per zone) on the lower line and the changed point</text><text x="1000.0" y="391.0" font-size="11.5" font-weight="400" fill="#172b3a" text-anchor="start">(142 kW, capture 0.9, 3.195 MW per zone) on the upper line.</text><text x="1000.0" y="406.6" font-size="11.5" font-weight="400" fill="#172b3a" text-anchor="start">The dashed line at 3.0 MW is the most that four 1.0 MW CDUs</text><text x="1000.0" y="422.1" font-size="11.5" font-weight="400" fill="#172b3a" text-anchor="start">carry with one on standby.</text><circle cx="393.3" cy="376.0" r="4" fill="#b7791f"/><circle cx="694.0" cy="248.8" r="4" fill="#b7791f"/><text x="24.0" y="30.0" font-size="17" font-weight="700" fill="#172b3a" text-anchor="start">F08-5  Rack-density change: liquid heat per zone of 25 racks against installed CDU capacity</text><text x="24.0" y="48.0" font-size="11" font-weight="400" fill="#5b6b78" text-anchor="start">120 kW at capture 0.8 = 2.40 MW per zone · 142 kW at capture 0.9 = 3.195 MW per zone · CDU 1.0 MW · 4 installed per zone = N+1 at 2.4 MW, N+0 at 3.195 MW</text><text x="32.0" y="590.0" font-size="10" font-weight="700" fill="#2d6a4f" text-anchor="start">WHAT TO PROVE</text><text x="32.0" y="606.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">• At 142 kW and capture 0.9 the zone load is 3.195 MW, which needs 4 CDUs running; a fifth CDU keeps N+1.</text><text x="32.0" y="621.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">• Hall liquid heat rises from 9.6 MW to 12.78 MW and TCS flow from 232.0 L/s to 308.9 L/s at 24.17 L/s per MW.</text><rect x="24" y="654" width="1352" height="44" rx="0" fill="#f6f8fa" fill-opacity="1" stroke="#5b6b78" stroke-width="1"/><text x="32.0" y="668.0" font-size="11" font-weight="700" fill="#172b3a" text-anchor="start">F08-5  ·  Rack-density change: liquid heat per zone of 25 racks against installed CDU capacity</text><text x="1368.0" y="668.0" font-size="10" font-weight="400" fill="#5b6b78" text-anchor="end">Chapter 08 · §08.14</text><text x="32.0" y="681.0" font-size="9" font-weight="400" fill="#5b6b78" text-anchor="start">Data Centre Commissioning Field Manual R01 EN · October 2026 · educational reference, not to scale · project and OEM documents govern</text><text x="32.0" y="693.0" font-size="9" font-weight="400" fill="#5b6b78" text-anchor="start">Symbols: QElectroTech EN 60617 and P&amp;ID collections, CC-BY 3.0, native geometry · instrument bubbles per ISA 5.1 · states per IEC 60617 / IEEE C37.2 practice</text></svg>