<svg xmlns="http://www.w3.org/2000/svg" width="267mm" height="147.2mm" viewBox="0 0 1400 772" font-family="DejaVu Sans" role="img" aria-labelledby="t"><title id="t">F08-3 Decision tree: is a commissioning finding a defect or a change</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="context-stroke"/></marker><marker id="arrow-simple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#172b3a"/></marker><marker id="arrow-172b3a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#172b3a"/></marker><marker id="arrow-334155" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#334155"/></marker><marker id="arrow-475569" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#475569"/></marker><marker id="arrow-b91c1c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#b91c1c"/></marker></defs><rect width="1400" height="772" fill="#ffffff"/><rect x="4" y="4" width="1392" height="764" fill="none" stroke="#172b3a" stroke-width="1.6"/><rect x="24" y="592" width="1352" height="56" rx="4" fill="#f1f8f4" fill-opacity="1" stroke="#2d6a4f" stroke-width="1"/><polyline points="880.0,145.0 1040.0,145.0" fill="none" stroke="#b91c1c" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#arrow-b91c1c)"/><polyline points="700.0,180.0 700.0,240.0" fill="none" stroke="#475569" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#arrow-475569)"/><polyline points="880.0,275.0 1040.0,275.0" fill="none" stroke="#334155" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#arrow-334155)"/><polyline points="700.0,310.0 700.0,370.0" fill="none" stroke="#475569" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#arrow-475569)"/><polyline points="880.0,405.0 1040.0,405.0" fill="none" stroke="#b91c1c" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#arrow-b91c1c)"/><polyline points="700.0,440.0 700.0,500.0" fill="none" stroke="#475569" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#arrow-475569)"/><polyline points="880.0,535.0 1040.0,535.0" fill="none" stroke="#334155" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#arrow-334155)"/><polyline points="520.0,535.0 360.0,535.0" fill="none" stroke="#172b3a" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#arrow-172b3a)"/><rect x="520" y="110" width="360" height="70" rx="0" fill="#ffffff" fill-opacity="1" stroke="#475569" stroke-width="1.4"/><rect x="1040" y="110" width="300" height="70" rx="8" fill="#ffffff" fill-opacity="1" stroke="#b91c1c" stroke-width="1.4"/><rect x="520" y="240" width="360" height="70" rx="0" fill="#ffffff" fill-opacity="1" stroke="#475569" stroke-width="1.4"/><rect x="1040" y="240" width="300" height="70" rx="8" fill="#ffffff" fill-opacity="1" stroke="#334155" stroke-width="1.4"/><rect x="520" y="370" width="360" height="70" rx="0" fill="#ffffff" fill-opacity="1" stroke="#475569" stroke-width="1.4"/><rect x="1040" y="370" width="300" height="70" rx="8" fill="#ffffff" fill-opacity="1" stroke="#b91c1c" stroke-width="1.4"/><rect x="520" y="500" width="360" height="70" rx="0" fill="#ffffff" fill-opacity="1" stroke="#475569" stroke-width="1.4"/><rect x="1040" y="500" width="300" height="70" rx="8" fill="#ffffff" fill-opacity="1" stroke="#334155" stroke-width="1.4"/><rect x="60" y="500" width="300" height="70" rx="8" fill="#ffffff" fill-opacity="1" stroke="#172b3a" stroke-width="1.4"/><text x="700.0" y="136.7" font-size="12" font-weight="700" fill="#475569" text-anchor="middle">Work matches the approved</text><text x="700.0" y="150.2" font-size="10" font-weight="400" fill="#172b3a" text-anchor="middle">drawings, specification, submittals</text><text x="1190.0" y="129.9" font-size="12" font-weight="700" fill="#b91c1c" text-anchor="middle">DEFECT</text><text x="1190.0" y="143.4" font-size="10" font-weight="400" fill="#172b3a" text-anchor="middle">NCR, contractor corrects</text><text x="1190.0" y="156.9" font-size="10" font-weight="400" fill="#172b3a" text-anchor="middle">at its cost (chapter 09)</text><text x="700.0" y="266.7" font-size="12" font-weight="700" fill="#475569" text-anchor="middle">Documents conflict or</text><text x="700.0" y="280.2" font-size="10" font-weight="400" fill="#172b3a" text-anchor="middle">are unclear</text><text x="1190.0" y="259.9" font-size="12" font-weight="700" fill="#334155" text-anchor="middle">RFI</text><text x="1190.0" y="273.4" font-size="10" font-weight="400" fill="#172b3a" text-anchor="middle">Engineer applies order of</text><text x="1190.0" y="286.9" font-size="10" font-weight="400" fill="#172b3a" text-anchor="middle">precedence, then re-enter</text><text x="700.0" y="396.7" font-size="12" font-weight="700" fill="#475569" text-anchor="middle">Contractor designed the</text><text x="700.0" y="410.2" font-size="10" font-weight="400" fill="#172b3a" text-anchor="middle">item (design-build scope)</text><text x="1190.0" y="396.7" font-size="12" font-weight="700" fill="#b91c1c" text-anchor="middle">DEFECT</text><text x="1190.0" y="410.2" font-size="10" font-weight="400" fill="#172b3a" text-anchor="middle">contractor design liability</text><text x="700.0" y="526.6" font-size="12" font-weight="700" fill="#475569" text-anchor="middle">Owner designer error, or owner</text><text x="700.0" y="540.1" font-size="10" font-weight="400" fill="#172b3a" text-anchor="middle">changed the OPR or instruction</text><text x="1190.0" y="519.9" font-size="12" font-weight="700" fill="#334155" text-anchor="middle">CHANGE</text><text x="1190.0" y="533.4" font-size="10" font-weight="400" fill="#172b3a" text-anchor="middle">PCO, notice, valuation,</text><text x="1190.0" y="546.9" font-size="10" font-weight="400" fill="#172b3a" text-anchor="middle">variation or change order</text><text x="210.0" y="519.9" font-size="12" font-weight="700" fill="#172b3a" text-anchor="middle">No change, no defect</text><text x="210.0" y="533.4" font-size="10" font-weight="400" fill="#172b3a" text-anchor="middle">record as issue closed or</text><text x="210.0" y="546.9" font-size="10" font-weight="400" fill="#172b3a" text-anchor="middle">operating note</text><text x="905.0" y="132.0" font-size="11" font-weight="700" fill="#172b3a" text-anchor="start">no</text><text x="905.0" y="262.0" font-size="11" font-weight="700" fill="#172b3a" text-anchor="start">yes</text><text x="905.0" y="392.0" font-size="11" font-weight="700" fill="#172b3a" text-anchor="start">yes</text><text x="905.0" y="522.0" font-size="11" font-weight="700" fill="#172b3a" text-anchor="start">yes</text><text x="712.0" y="205.0" font-size="11" font-weight="700" fill="#172b3a" text-anchor="start">no</text><text x="712.0" y="335.0" font-size="11" font-weight="700" fill="#172b3a" text-anchor="start">no</text><text x="712.0" y="465.0" font-size="11" font-weight="700" fill="#172b3a" text-anchor="start">no</text><text x="490.0" y="522.0" font-size="11" font-weight="700" fill="#172b3a" text-anchor="end">no</text><text x="24.0" y="30.0" font-size="17" font-weight="700" fill="#172b3a" text-anchor="start">F08-3  Decision tree: is a commissioning finding a defect or a change</text><text x="24.0" y="48.0" font-size="11" font-weight="400" fill="#5b6b78" text-anchor="start">defect: work does not conform, or the contractor designed it · change: the owner designed it, the owner changed the requirement, or the Engineer resolves a conflict in the owner&#x27;s documents against the installed work</text><text x="32.0" y="606.0" font-size="10" font-weight="700" fill="#2d6a4f" text-anchor="start">WHAT TO PROVE</text><text x="32.0" y="622.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">• A finding where the work matches the documents and the owner&#x27;s designer made the error is a change: it is valued and may give time.</text><text x="32.0" y="637.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">• In the CT ratio example, blocks 01 to 06 were a document conflict resolved by RFI without price change; blocks 07 and 08 became variation VO-B2-023 because the Engineer had approved the shop drawing.</text><text x="24.0" y="672.0" font-size="10" font-weight="700" fill="#5b6b78" text-anchor="start">LEGEND</text><line x1="24" y1="694" x2="50" y2="694" stroke="#475569" stroke-width="3"/><text x="56.0" y="698.0" font-size="10" font-weight="400" fill="#172b3a" text-anchor="start">signal / control</text><line x1="151.9671875" y1="694" x2="177.9671875" y2="694" stroke="#b91c1c" stroke-width="3"/><text x="184.0" y="698.0" font-size="10" font-weight="400" fill="#172b3a" text-anchor="start">trip / protection</text><line x1="283.934375" y1="694" x2="309.934375" y2="694" stroke="#334155" stroke-width="3"/><text x="315.9" y="698.0" font-size="10" font-weight="400" fill="#172b3a" text-anchor="start">data / network</text><rect x="24" y="712" width="1352" height="44" rx="0" fill="#f6f8fa" fill-opacity="1" stroke="#5b6b78" stroke-width="1"/><text x="32.0" y="726.0" font-size="11" font-weight="700" fill="#172b3a" text-anchor="start">F08-3  ·  Decision tree: is a commissioning finding a defect or a change</text><text x="1368.0" y="726.0" font-size="10" font-weight="400" fill="#5b6b78" text-anchor="end">Chapter 08 · §08.12</text><text x="32.0" y="739.0" font-size="9" font-weight="400" fill="#5b6b78" text-anchor="start">Data Centre Commissioning Field Manual R01 EN · October 2026 · educational reference, not to scale · project and OEM documents govern</text><text x="32.0" y="751.0" font-size="9" font-weight="400" fill="#5b6b78" text-anchor="start">Symbols: QElectroTech EN 60617 and P&amp;ID collections, CC-BY 3.0, native geometry · instrument bubbles per ISA 5.1 · states per IEC 60617 / IEEE C37.2 practice</text></svg>