62.26" width="250" height="24.380000000000003" rx="0" fill="#ffffff" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><rect x="40" y="286.64" width="200" height="24.380000000000003" rx="0" fill="#e9f0f4" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><rect x="240" y="286.64" width="190" height="24.380000000000003" rx="0" fill="#ffffff" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><rect x="430" y="286.64" width="280" height="24.380000000000003" rx="0" fill="#ffffff" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><rect x="710" y="286.64" width="250" height="24.380000000000003" rx="0" fill="#ffffff" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><rect x="40" y="311.02" width="200" height="39.56" rx="0" fill="#e9f0f4" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><rect x="240" y="311.02" width="190" height="39.56" rx="0" fill="#ffffff" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><rect x="430" y="311.02" width="280" height="39.56" rx="0" fill="#ffffff" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><rect x="710" y="311.02" width="250" height="39.56" rx="0" fill="#ffffff" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><rect x="40" y="374.58000000000004" width="920" height="60.3" rx="4" fill="#fffbe6" fill-opacity="1" stroke="#b7791f" stroke-width="1.2"/><text x="335.0" y="126.4" font-size="10.5" font-weight="700" fill="#172b3a" text-anchor="middle">Test list</text><text x="570.0" y="126.4" font-size="10.5" font-weight="700" fill="#172b3a" text-anchor="middle">Method</text><text x="835.0" y="126.4" font-size="10.5" font-weight="700" fill="#172b3a" text-anchor="middle">Example acceptance value</text><text x="46.0" y="150.8" font-size="11.5" font-weight="400" fill="#172b3a" text-anchor="start">20 kV cable</text><text x="335.0" y="150.8" font-size="11.5" font-weight="700" fill="#172b3a" text-anchor="middle">NETA ATS-2025 7.3</text><text x="570.0" y="150.8" font-size="11.5" font-weight="700" fill="#172b3a" text-anchor="middle">IEEE 400.2-2024 VLF; IEEE 400.3-2022 PD</text><text x="835.0" y="150.8" font-size="11.5" font-weight="700" fill="#172b3a" text-anchor="middle">26 kV rms 0.1 Hz, 30 min</text><text x="46.0" y="182.8" font-size="11.5" font-weight="400" fill="#172b3a" text-anchor="start">20 kV switchgear</text><text x="335.0" y="182.8" font-size="11.5" font-weight="700" fill="#172b3a" text-anchor="middle">NETA ATS-2025 7.1</text><text x="570.0" y="175.2" font-size="11.5" font-weight="700" fill="#172b3a" text-anchor="middle">IEC 62271-200:2021 FAT; IEC 60270:2025</text><text x="570.0" y="190.4" font-size="11.5" font-weight="700" fill="#172b3a" text-anchor="middle">PD</text><text x="835.0" y="175.2" font-size="11.5" font-weight="700" fill="#172b3a" text-anchor="middle">≥ 10,000 MΩ at 5,000 V DC (Table</text><text x="835.0" y="190.4" font-size="11.5" font-weight="700" fill="#172b3a" text-anchor="middle">100.1)</text><text x="46.0" y="222.4" font-size="11.5" font-weight="400" fill="#172b3a" text-anchor="start">Liquid-filled transformer</text><text x="335.0" y="222.4" font-size="11.5" font-weight="700" fill="#172b3a" text-anchor="middle">NETA ATS-2025 7.2</text><text x="570.0" y="222.4" font-size="11.5" font-weight="700" fill="#172b3a" text-anchor="middle">IEEE C57.152-2025</text><text x="835.0" y="214.8" font-size="11.5" font-weight="700" fill="#172b3a" text-anchor="middle">turns ratio within ±0.5 % of</text><text x="835.0" y="229.9" font-size="11.5" font-weight="700" fill="#172b3a" text-anchor="middle">nameplate</text><text x="46.0" y="254.3" font-size="11.5" font-weight="400" fill="#172b3a" text-anchor="start">400 V switchboard</text><text x="335.0" y="254.3" font-size="11.5" font-weight="700" fill="#172b3a" text-anchor="middle">NETA ATS-2025 7.1</text><text x="570.0" y="254.3" font-size="11.5" font-weight="700" fill="#172b3a" text-anchor="middle">IEC 61439-2:2020 FAT; IEC 60364-6:2016</text><text x="835.0" y="254.3" font-size="11.5" font-weight="700" fill="#172b3a" text-anchor="middle">≥ 100 MΩ at 1,000 V DC; 1 MΩ floor</text><text x="46.0" y="278.7" font-size="11.5" font-weight="400" fill="#172b3a" text-anchor="start">VRLA battery</text><text x="335.0" y="278.7" font-size="11.5" font-weight="700" fill="#172b3a" text-anchor="middle">NETA ATS-2025 7.18</text><text x="570.0" y="278.7" font-size="11.5" font-weight="700" fill="#172b3a" text-anchor="middle">IEEE 1188-2025 capacity test</text><text x="835.0" y="278.7" font-size="11.5" font-weight="700" fill="#172b3a" text-anchor="middle">≥ 100 % capacity at acceptance</text><text x="46.0" y="303.1" font-size="11.5" font-weight="400" fill="#172b3a" text-anchor="start">UPS module</text><text x="335.0" y="303.1" font-size="11.5" font-weight="700" fill="#172b3a" text-anchor="middle">NETA ATS-2025 7.22</text><text x="570.0" y="303.1" font-size="11.5" font-weight="700" fill="#172b3a" text-anchor="middle">IEC 62040-3:2021</text><text x="835.0" y="303.1" font-size="11.5" font-weight="700" fill="#172b3a" text-anchor="middle">class 1 curve, VFI-SS-111</text><text x="46.0" y="335.1" font-size="11.5" font-weight="400" fill="#172b3a" text-anchor="start">Generator set</text><text x="335.0" y="335.1" font-size="11.5" font-weight="700" fill="#172b3a" text-anchor="middle">specification 26 32 13</text><text x="570.0" y="335.1" font-size="11.5" font-weight="700" fill="#172b3a" text-anchor="middle">ISO 8528-6:2023; NFPA 110-2025</text><text x="835.0" y="327.5" font-size="11.5" font-weight="700" fill="#172b3a" text-anchor="middle">G3: frequency dip ≤ 7 %, recovery ≤</text><text x="835.0" y="342.6" font-size="11.5" font-weight="700" fill="#172b3a" text-anchor="middle">3 s</text><text x="50.0" y="388.4" font-size="11.5" font-weight="700" fill="#b7791f" text-anchor="start">Where the value is not in the list above</text><text x="50.0" y="404.5" font-size="11.5" font-weight="400" fill="#172b3a" text-anchor="start">Copy the value from the specification clause first, then from the standard table it calls up, then from the approved OEM document; write the source in the</text><text x="50.0" y="420.0" font-size="11.5" font-weight="400" fill="#172b3a" text-anchor="start">script source column.</text><text x="24.0" y="30.0" font-size="17" font-weight="700" fill="#172b3a" text-anchor="start">F01-8  Electrical tests: which document gives the method and the value</text><text x="24.0" y="48.0" font-size="10" font-weight="400" fill="#5b6b78" text-anchor="start">NETA ATS-2025 gives the test list and most values · IEEE and IEC give methods · ISO 8528-5:2022 and IEC 62040-3:2021 give performance classes · the specification</text><text x="24.0" y="61.0" font-size="10" font-weight="400" fill="#5b6b78" text-anchor="start">names the edition</text><text x="32.0" y="470.9" font-size="10" font-weight="700" fill="#2d6a4f" text-anchor="start">WHAT TO PROVE</text><text x="32.0" y="486.9" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">• A 400 V switchboard is tested at 1,000 V DC with 100 MΩ minimum (NETA ATS-2025 Table 100.1); the installation circuits keep the 1 MΩ floor of IEC 60364-6.</text><text x="32.0" y="501.9" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">• The 20 kV cable VLF withstand is 26 kV rms at 0.1 Hz for 30 min (IEEE 400.2-2024, 20 kV row).</text><rect x="24" y="534.8800000000001" width="952" height="44" rx="0" fill="#f6f8fa" fill-opacity="1" stroke="#5b6b78" stroke-width="1"/><text x="32.0" y="548.9" font-size="11" font-weight="700" fill="#172b3a" text-anchor="start">F01-8  ·  Electrical tests: which document gives the method and the value</text><text x="968.0" y="548.9" font-size="10" font-weight="400" fill="#5b6b78" text-anchor="end">Chapter 01 · §01.5.1</text><text x="32.0" y="561.9" font-size="9" font-weight="400" fill="#5b6b78" text-anchor="start">Data Centre Commissioning Field Manual R01 EN · October 2026 · educational reference, not to scale · project and OEM documents govern</text><text x="32.0" y="573.9" font-size="9" font-weight="400" fill="#5b6b78" text-anchor="start">Symbols: QElectroTech EN 60617 and P&amp;ID collections, CC-BY 3.0, native geometry · instrument bubbles per ISA 5.1 · states per IEC 60617 / IEEE C37.2 practice</text></svg>