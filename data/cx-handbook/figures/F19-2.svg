"400" fill="#172b3a" text-anchor="start">7 × 6 = 42 points</text><text x="581.7" y="677.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">5 lines below 762 mm, 6 to 914 mm, 7 above</text><text x="45.0" y="699.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">Minimum points</text><text x="275.0" y="699.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">25</text><text x="581.7" y="699.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">Fluke summary of ASHRAE 111</text><text x="45.0" y="721.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">Air density</text><text x="275.0" y="721.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">1.16 kg/m³ at 32 °C, 1,010 hPa</text><text x="581.7" y="721.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">v = √(2 × Pv / ρ)</text><text x="45.0" y="743.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">Mean velocity</text><text x="275.0" y="743.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">6.42 m/s</text><text x="581.7" y="743.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">average of the 42 velocities</text><text x="45.0" y="765.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">Flow / design</text><text x="275.0" y="765.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">6.16 / 6.00 m³/s (+2.7 %)</text><text x="581.7" y="765.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">specification ±10 %</text><text x="24.0" y="30.0" font-size="17" font-weight="700" fill="#172b3a" text-anchor="start">F19-2  Pitot-tube traverse of duct B2-MAU-01: 42 log-Tchebycheff points on a 1,200 × 800 mm section</text><text x="24.0" y="48.0" font-size="10" font-weight="400" fill="#5b6b78" text-anchor="start">7 lines on the 1,200 mm side (above 914 mm) · 6 lines on the 800 mm side (762 to 914 mm) · mean velocity 6.42 m/s · area 0.96 m² · 6.16 m³/s against 6.00 m³/s design:</text><text x="24.0" y="61.0" font-size="10" font-weight="400" fill="#5b6b78" text-anchor="start">+2.7 %, inside ±10 %</text><text x="32.0" y="808.0" font-size="10" font-weight="700" fill="#2d6a4f" text-anchor="start">WHAT TO PROVE</text><text x="32.0" y="824.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">• Point positions on the 1,200 mm side: 64, 244, 439, 600, 761, 956 and 1,136 mm from the inner wall (fractions 0.053 to 0.947).</text><text x="32.0" y="839.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">• Point positions on the 800 mm side: 49, 188, 350, 450, 612 and 751 mm (fractions 0.061 to 0.939); flow = mean of the 42 velocities × 0.96 m².</text><rect x="24" y="872.0" width="952" height="44" rx="0" fill="#f6f8fa" fill-opacity="1" stroke="#5b6b78" stroke-width="1"/><text x="32.0" y="886.0" font-size="11" font-weight="700" fill="#172b3a" text-anchor="start">F19-2  ·  Pitot-tube traverse of duct B2-MAU-01: 42 log-Tchebycheff points on a 1,200 × 800 mm section</text><text x="968.0" y="886.0" font-size="10" font-weight="400" fill="#5b6b78" text-anchor="end">Chapter 19 · §19.4</text><text x="32.0" y="899.0" font-size="9" font-weight="400" fill="#5b6b78" text-anchor="start">Data Centre Commissioning Field Manual R01 EN · October 2026 · educational reference, not to scale · project and OEM documents govern</text><text x="32.0" y="911.0" font-size="9" font-weight="400" fill="#5b6b78" text-anchor="start">Symbols: QElectroTech EN 60617 and P&amp;ID collections, CC-BY 3.0, native geometry · instrument bubbles per ISA 5.1 · states per IEC 60617 / IEEE C37.2 practice</text></svg>