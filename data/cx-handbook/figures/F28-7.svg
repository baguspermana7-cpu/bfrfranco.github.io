xt-anchor="start">IST day 1</text><text x="45.0" y="399.0" font-size="11" font-weight="700" fill="#172b3a" text-anchor="start">Step</text><text x="282.9" y="399.0" font-size="11" font-weight="700" fill="#172b3a" text-anchor="start">Working day</text><text x="457.4" y="399.0" font-size="11" font-weight="700" fill="#172b3a" text-anchor="start">Owner</text><text x="711.2" y="399.0" font-size="11" font-weight="700" fill="#172b3a" text-anchor="start">Record</text><text x="45.0" y="421.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">Script Rev A drafted</text><text x="282.9" y="421.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">T−30</text><text x="457.4" y="421.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">CxA</text><text x="711.2" y="421.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">draft script</text><text x="45.0" y="443.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">Review and comments</text><text x="282.9" y="443.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">T−30 to T−20</text><text x="457.4" y="443.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">designer, contractors, owner</text><text x="711.2" y="443.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">comment sheet</text><text x="45.0" y="465.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">Rev B issued</text><text x="282.9" y="465.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">by T−15</text><text x="457.4" y="465.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">CxA</text><text x="711.2" y="465.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">script Rev B</text><text x="45.0" y="487.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">Gate pack issued</text><text x="282.9" y="487.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">T−12</text><text x="457.4" y="487.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">CxA</text><text x="711.2" y="487.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">prerequisite list, 16 rows</text><text x="45.0" y="509.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">Gate review meeting</text><text x="282.9" y="509.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">T−10</text><text x="457.4" y="509.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">commissioning manager</text><text x="711.2" y="509.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">meeting minutes</text><text x="45.0" y="531.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">Dry run walk-through</text><text x="282.9" y="531.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">T−5</text><text x="457.4" y="531.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">test director</text><text x="711.2" y="531.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">corrected script</text><text x="45.0" y="553.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">Rev C approved</text><text x="282.9" y="553.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">T−3</text><text x="457.4" y="553.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">approval sheet signers</text><text x="711.2" y="553.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">signed approval sheet</text><text x="45.0" y="575.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">Final check</text><text x="282.9" y="575.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">T−1</text><text x="457.4" y="575.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">CxA</text><text x="711.2" y="575.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">certificate IST-GATE-B2-DH3</text><text x="24.0" y="30.0" font-size="17" font-weight="700" fill="#172b3a" text-anchor="start">F28-7  Road to IST day 1: script approval and entry gate in working days</text><text x="24.0" y="48.0" font-size="10" font-weight="400" fill="#5b6b78" text-anchor="start">script draft at T−30 · review 10 WD · Rev B by T−15 · gate pack at T−12 · gate review at T−10 · dry run at T−5 · Rev C approved at T−3 · final check at T−1 · IST day 1 at</text><text x="24.0" y="61.0" font-size="10" font-weight="400" fill="#5b6b78" text-anchor="start">T0 (WD = working day)</text><text x="32.0" y="618.0" font-size="10" font-weight="700" fill="#2d6a4f" text-anchor="start">WHAT TO PROVE</text><text x="32.0" y="634.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">• The gate pack goes out 12 working days before IST, two days before the review meeting, so each lead can check the rows of his system first.</text><text x="32.0" y="649.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">• Rev C is approved 3 working days before IST; any later change needs a script change note signed by the test director.</text><text x="32.0" y="664.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">• If a &quot;blocks IST&quot; row is still open at the final check (T−1), IST is postponed and the owner is told in writing the same day.</text><rect x="24" y="697.0" width="952" height="44" rx="0" fill="#f6f8fa" fill-opacity="1" stroke="#5b6b78" stroke-width="1"/><text x="32.0" y="711.0" font-size="11" font-weight="700" fill="#172b3a" text-anchor="start">F28-7  ·  Road to IST day 1: script approval and entry gate in working days</text><text x="968.0" y="711.0" font-size="10" font-weight="400" fill="#5b6b78" text-anchor="end">Chapter 28 · §28.2.2</text><text x="32.0" y="724.0" font-size="9" font-weight="400" fill="#5b6b78" text-anchor="start">Data Centre Commissioning Field Manual R01 EN · October 2026 · educational reference, not to scale · project and OEM documents govern</text><text x="32.0" y="736.0" font-size="9" font-weight="400" fill="#5b6b78" text-anchor="start">Symbols: QElectroTech EN 60617 and P&amp;ID collections, CC-BY 3.0, native geometry · instrument bubbles per ISA 5.1 · states per IEC 60617 / IEEE C37.2 practice</text></svg>