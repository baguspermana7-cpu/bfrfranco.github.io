ty="1" stroke="#9fb0bb" stroke-width="0.8"/><rect x="776.4705882352941" y="252.0" width="183.52941176470586" height="22.0" rx="0" fill="#ffffff" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><rect x="480" y="274.0" width="70.58823529411764" height="22.0" rx="0" fill="#ffffff" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><rect x="550.5882352941177" y="274.0" width="225.88235294117644" height="22.0" rx="0" fill="#ffffff" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><rect x="776.4705882352941" y="274.0" width="183.52941176470586" height="22.0" rx="0" fill="#ffffff" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><rect x="480" y="296.0" width="70.58823529411764" height="22.0" rx="0" fill="#ffffff" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><rect x="550.5882352941177" y="296.0" width="225.88235294117644" height="22.0" rx="0" fill="#ffffff" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><rect x="776.4705882352941" y="296.0" width="183.52941176470586" height="22.0" rx="0" fill="#ffffff" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><text x="240.0" y="140.8" font-size="11.5" font-weight="700" fill="#475569" text-anchor="middle">1  Notify the AHJ</text><text x="240.0" y="153.6" font-size="9.5" font-weight="400" fill="#172b3a" text-anchor="middle">NFPA 110 7.13.3, before the test day</text><text x="240.0" y="216.8" font-size="11.5" font-weight="700" fill="#475569" text-anchor="middle">2  Cold start, normal supply opened</text><text x="240.0" y="229.6" font-size="9.5" font-weight="400" fill="#172b3a" text-anchor="middle">7.13.4.1; time to power at the load</text><text x="240.0" y="292.8" font-size="11.5" font-weight="700" fill="#475569" text-anchor="middle">3  Load pick-up</text><text x="240.0" y="305.6" font-size="9.5" font-weight="400" fill="#172b3a" text-anchor="middle">voltage, frequency and current recorded</text><text x="240.0" y="368.8" font-size="11.5" font-weight="700" fill="#475569" text-anchor="middle">4  Return to normal</text><text x="240.0" y="381.6" font-size="9.5" font-weight="400" fill="#172b3a" text-anchor="middle">transfer back timed</text><text x="240.0" y="444.8" font-size="11.5" font-weight="700" fill="#475569" text-anchor="middle">5  Cool-down</text><text x="240.0" y="457.6" font-size="9.5" font-weight="400" fill="#172b3a" text-anchor="middle">at least 5 min before the load test</text><text x="240.0" y="520.8" font-size="11.5" font-weight="700" fill="#475569" text-anchor="middle">6  Load test of each set</text><text x="240.0" y="533.6" font-size="9.5" font-weight="400" fill="#172b3a" text-anchor="middle">7.13.4.3, 2 h at load</text><text x="240.0" y="596.8" font-size="11.5" font-weight="700" fill="#475569" text-anchor="middle">7  Crank-cycle test</text><text x="240.0" y="609.6" font-size="9.5" font-weight="400" fill="#172b3a" text-anchor="middle">programmed cycle, overcrank alarm</text><text x="240.0" y="672.8" font-size="11.5" font-weight="700" fill="#475569" text-anchor="middle">8  Records</text><text x="240.0" y="685.6" font-size="9.5" font-weight="400" fill="#172b3a" text-anchor="middle">results kept on site</text><text x="485.0" y="135.0" font-size="11" font-weight="700" fill="#172b3a" text-anchor="start">Step</text><text x="555.6" y="135.0" font-size="11" font-weight="700" fill="#172b3a" text-anchor="start">MSC-1 record</text><text x="781.5" y="135.0" font-size="11" font-weight="700" fill="#172b3a" text-anchor="start">Result (example)</text><text x="485.0" y="157.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">1</text><text x="555.6" y="157.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">AHJ notice letter</text><text x="781.5" y="157.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">sent 5 days before</text><text x="485.0" y="179.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">2</text><text x="555.6" y="179.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">start-time record 15.9.1</text><text x="781.5" y="179.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">bus live 7.15 s</text><text x="485.0" y="201.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">3</text><text x="555.6" y="201.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">PQ analyser file</text><text x="781.5" y="201.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">G3 limits met</text><text x="485.0" y="223.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">4</text><text x="555.6" y="223.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">transfer record 15.10.6</text><text x="781.5" y="223.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">overlap timed</text><text x="485.0" y="245.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">5</text><text x="555.6" y="245.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">controller event log</text><text x="781.5" y="245.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">5 min</text><text x="485.0" y="267.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">6</text><text x="555.6" y="267.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">ELE-L4-GEN-nn (15.7)</text><text x="781.5" y="267.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">4 h at 100 %</text><text x="485.0" y="289.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">7</text><text x="555.6" y="289.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">crank record 15.9.2</text><text x="781.5" y="289.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">overcrank alarm</text><text x="485.0" y="311.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">8</text><text x="555.6" y="311.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">ELE-L4-GEN-nn set</text><text x="781.5" y="311.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">filed on site</text><text x="24.0" y="30.0" font-size="17" font-weight="700" fill="#172b3a" text-anchor="start">F15-8  NFPA 110 installation acceptance sequence for the MSC-1 generator plant</text><text x="24.0" y="48.0" font-size="10" font-weight="400" fill="#5b6b78" text-anchor="start">NFPA 110 7.13 as summarised in public sources (confirm NFPA 110 7.13, adopted edition) · bus live 7.15 s against 10 s (Type 10) · cool-down at least 5 min · 2 h load test</text><text x="24.0" y="61.0" font-size="10" font-weight="400" fill="#5b6b78" text-anchor="start">per set covered by the 4 h test of 15.7</text><text x="32.0" y="746.0" font-size="10" font-weight="700" fill="#2d6a4f" text-anchor="start">WHAT TO PROVE</text><text x="32.0" y="762.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">• The cold-start step closes with the start-time record: bus live at 7.15 s, inside the 10 s of a Type 10 system.</text><text x="32.0" y="777.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">• The load test step is closed by the 4 h load bank record of each set (15.7), which covers the 2 h test.</text><text x="32.0" y="792.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">• The crank-cycle step is closed by the overcrank record of 15.9.2.</text><text x="24.0" y="827.0" font-size="10" font-weight="700" fill="#5b6b78" text-anchor="start">LEGEND</text><line x1="24" y1="849" x2="50" y2="849" stroke="#475569" stroke-width="3"/><text x="56.0" y="853.0" font-size="10" font-weight="400" fill="#172b3a" text-anchor="start">signal / control</text><rect x="24" y="867" width="952" height="44" rx="0" fill="#f6f8fa" fill-opacity="1" stroke="#5b6b78" stroke-width="1"/><text x="32.0" y="881.0" font-size="11" font-weight="700" fill="#172b3a" text-anchor="start">F15-8  ·  NFPA 110 installation acceptance sequence for the MSC-1 generator plant</text><text x="968.0" y="881.0" font-size="10" font-weight="400" fill="#5b6b78" text-anchor="end">Chapter 15 · §15.14.1</text><text x="32.0" y="894.0" font-size="9" font-weight="400" fill="#5b6b78" text-anchor="start">Data Centre Commissioning Field Manual R01 EN · October 2026 · educational reference, not to scale · project and OEM documents govern</text><text x="32.0" y="906.0" font-size="9" font-weight="400" fill="#5b6b78" text-anchor="start">Symbols: QElectroTech EN 60617 and P&amp;ID collections, CC-BY 3.0, native geometry · instrument bubbles per ISA 5.1 · states per IEC 60617 / IEEE C37.2 practice</text></svg>