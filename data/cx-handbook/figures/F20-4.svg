" font-size="10" font-weight="400" fill="#475569" text-anchor="start">doors released</text><text x="615.2" y="295.0" font-size="10" font-weight="400" fill="#475569" text-anchor="start">stopped at 43 s</text><text x="594.8" y="341.0" font-size="10" font-weight="400" fill="#172b3a" text-anchor="start">closed by 62 s</text><text x="887.2" y="387.0" font-size="10" font-weight="400" fill="#172b3a" text-anchor="start">discharge 10 s</text><text x="984.8" y="387.0" font-size="10" font-weight="400" fill="#172b3a" text-anchor="start">hold 10 min to 681 s</text><text x="236.0" y="433.0" font-size="10" font-weight="400" fill="#334155" text-anchor="start">alarm shown</text><text x="899.0" y="433.0" font-size="10" font-weight="400" fill="#334155" text-anchor="start">agent released</text><text x="45.0" y="515.0" font-size="11" font-weight="700" fill="#172b3a" text-anchor="start">Event</text><text x="631.7" y="515.0" font-size="11" font-weight="700" fill="#172b3a" text-anchor="start">Time (s)</text><text x="925.0" y="515.0" font-size="11" font-weight="700" fill="#172b3a" text-anchor="start">Acceptance</text><text x="45.0" y="537.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">Second detector to pre-discharge alarm</text><text x="631.7" y="537.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">1</text><text x="925.0" y="537.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">at most 2 s (example)</text><text x="45.0" y="559.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">Dampers closed</text><text x="631.7" y="559.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">22 after detector 2</text><text x="925.0" y="559.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">before release</text><text x="45.0" y="581.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">Countdown</text><text x="631.7" y="581.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">30</text><text x="925.0" y="581.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">set value ±1 s</text><text x="45.0" y="603.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">Discharge</text><text x="631.7" y="603.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">10</text><text x="925.0" y="603.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">at most 10 s (halocarbon)</text><text x="45.0" y="625.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">Hold</text><text x="631.7" y="625.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">600</text><text x="925.0" y="625.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">at least 10 min (NFPA 2001)</text><text x="24.0" y="30.0" font-size="17" font-weight="700" fill="#172b3a" text-anchor="start">F20-4  Clean agent release in MV room B2-ER-03: interface timing from first detector to start of hold</text><text x="24.0" y="48.0" font-size="11" font-weight="400" fill="#5b6b78" text-anchor="start">first detector 0 s · second detector 40 s · pre-discharge alarm and doors 41 s · AHU stop 43 s · last damper closed 62 s · release 71 s (30 s countdown) · discharge complete 81 s · hold 10 min to 681 s</text><text x="32.0" y="668.0" font-size="10" font-weight="700" fill="#2d6a4f" text-anchor="start">WHAT TO PROVE</text><text x="32.0" y="684.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">• The last damper closes 9 s before the release; any HVAC action that finishes after the release output is a failed row.</text><text x="32.0" y="699.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">• Halocarbon discharge completes within 10 s (71 to 81 s); the room integrity test predicts at least 10 min of hold at the protected height.</text><rect x="24" y="732.0" width="1352" height="44" rx="0" fill="#f6f8fa" fill-opacity="1" stroke="#5b6b78" s