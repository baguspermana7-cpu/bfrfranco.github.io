"1" stroke="#334155" stroke-width="1.4"/><rect x="1130" y="678" width="230" height="40" rx="0" fill="#ffffff" fill-opacity="1" stroke="#334155" stroke-width="1.4"/><rect x="440" y="772" width="160" height="60" rx="4" fill="#ffffff" fill-opacity="1" stroke="#b91c1c" stroke-width="1.6"/><rect x="620" y="772" width="160" height="60" rx="4" fill="#ffffff" fill-opacity="1" stroke="#b91c1c" stroke-width="1.6"/><rect x="790" y="772" width="160" height="60" rx="4" fill="#ffffff" fill-opacity="1" stroke="#b91c1c" stroke-width="1.6"/><rect x="1155" y="772" width="160" height="60" rx="4" fill="#ffffff" fill-opacity="1" stroke="#334155" stroke-width="1.6"/><text x="470.0" y="359.0" font-size="13" font-weight="700" fill="#334155" text-anchor="middle">EPMS</text><text x="470.0" y="373.9" font-size="11" font-weight="400" fill="#172b3a" text-anchor="middle">electrical monitoring</text><text x="470.0" y="388.7" font-size="11" font-weight="400" fill="#172b3a" text-anchor="middle">IF-001 to IF-024</text><text x="930.0" y="359.0" font-size="13" font-weight="700" fill="#334155" text-anchor="middle">BMS</text><text x="930.0" y="373.9" font-size="11" font-weight="400" fill="#172b3a" text-anchor="middle">mechanical control</text><text x="930.0" y="388.7" font-size="11" font-weight="400" fill="#172b3a" text-anchor="middle">IF-021 to IF-040</text><text x="700.0" y="136.7" font-size="12" font-weight="700" fill="#334155" text-anchor="middle">DCIM</text><text x="700.0" y="150.2" font-size="10" font-weight="400" fill="#172b3a" text-anchor="middle">capacity and assets</text><text x="420.0" y="136.7" font-size="12" font-weight="700" fill="#334155" text-anchor="middle">CMMS</text><text x="420.0" y="150.2" font-size="10" font-weight="400" fill="#172b3a" text-anchor="middle">work orders</text><text x="1245.0" y="136.7" font-size="12" font-weight="700" fill="#b91c1c" text-anchor="middle">Campus operations centre</text><text x="1245.0" y="150.2" font-size="10" font-weight="400" fill="#172b3a" text-anchor="middle">BACnet/SC</text><text x="155.0" y="228.4" font-size="12" font-weight="700" fill="#334155" text-anchor="middle">UPS systems</text><text x="155.0" y="280.4" font-size="12" font-weight="700" fill="#334155" text-anchor="middle">Generator controllers</text><text x="155.0" y="332.4" font-size="12" font-weight="700" fill="#334155" text-anchor="middle">Paralleling switchgear</text><text x="155.0" y="384.4" font-size="12" font-weight="700" fill="#334155" text-anchor="middle">ATS and STS</text><text x="155.0" y="436.4" font-size="12" font-weight="700" fill="#334155" text-anchor="middle">MV protection relays</text><text x="155.0" y="488.4" font-size="12" font-weight="700" fill="#334155" text-anchor="middle">LV trip units</text><text x="155.0" y="540.4" font-size="12" font-weight="700" fill="#334155" text-anchor="middle">Floor PDUs and RPPs</text><text x="155.0" y="592.4" font-size="12" font-weight="700" fill="#334155" text-anchor="middle">BESS controllers</text><text x="155.0" y="644.4" font-size="12" font-weight="700" fill="#334155" text-anchor="middle">150 kV substation RTU</text><text x="1245.0" y="228.4" font-size="12" font-weight="700" fill="#334155" text-anchor="middle">CDUs</text><text x="1245.0" y="280.4" font-size="12" font-weight="700" fill="#334155" text-anchor="middle">CRAHs</text><text x="1245.0" y="332.4" font-size="12" font-weight="700" fill="#334155" text-anchor="middle">Chiller plant PLC</text><text x="1245.0" y="384.4" font-size="12" font-weight="700" fill="#334155" text-anchor="middle">Pumps and VFDs</text><text x="1245.0" y="436.4" font-size="12" font-weight="700" fill="#334155" text-anchor="middle">Dry coolers</text><text x="1245.0" y="488.4" font-size="12" font-weight="700" fill="#334155" text-anchor="middle">Water treatment</text><text x="1245.0" y="540.4" font-size="12" font-weight="700" fill="#334155" text-anchor="middle">Leak detection</text><text x="1245.0" y="592.4" font-size="12" font-weight="700" fill="#334155" text-anchor="middle">Fuel system</text><text x="1245.0" y="644.4" font-size="12" font-weight="700" fill="#334155" text-anchor="middle">Weather station</text><text x="1245.0" y="696.4" font-size="12" font-weight="700" fill="#334155" text-anchor="middle">Lighting and lifts</text><text x="700.0" y="386.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="middle">source stable, IF-018</text><text x="520.0" y="793.6" font-size="12" font-weight="700" fill="#b91c1c" text-anchor="middle">Fire alarm panel</text><text x="520.0" y="807.1" font-size="10" font-weight="400" fill="#172b3a" text-anchor="middle">VESDA, clean agent</text><text x="700.0" y="793.6" font-size="12" font-weight="700" fill="#b91c1c" text-anchor="middle">EPO stations</text><text x="700.0" y="807.1" font-size="10" font-weight="400" fill="#172b3a" text-anchor="middle">status contacts</text><text x="870.0" y="793.6" font-size="12" font-weight="700" fill="#b91c1c" text-anchor="middle">Access control</text><text x="870.0" y="807.1" font-size="10" font-weight="400" fill="#172b3a" text-anchor="middle">and CCTV</text><text x="1235.0" y="793.6" font-size="12" font-weight="700" fill="#334155" text-anchor="middle">Time servers</text><text x="1235.0" y="807.1" font-size="10" font-weight="400" fill="#172b3a" text-anchor="middle">NTP and PTP</text><text x="40.0" y="860.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">Hardwired actions from the fire alarm panel to CRAH fan circuits, dampers, lifts and doors, and from EPO stations to UPS and switchgear trip circuits, are not drawn on this map; they are rows IF-042 to IF-053 and are tested from the real</text><text x="40.0" y="874.9" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">source (section 25.10).</text><text x="24.0" y="30.0" font-size="17" font-weight="700" fill="#172b3a" text-anchor="start">F25-1  Integration map of the MSC-1 campus: which system sends data to which</text><text x="24.0" y="48.0" font-size="11" font-weight="400" fill="#5b6b78" text-anchor="start">66 interfaces in the master interface list · electrical systems report to the EPMS · mechanical systems report to the BMS · fire, EPO and security send hardwired and read-only signals · DCIM and CMMS receive exports only</text><text x="32.0" y="913.5" font-size="10" font-weight="700" fill="#2d6a4f" text-anchor="start">WHAT TO PROVE</text><text x="32.0" y="929.5" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">• The EPMS to BMS link carries the source stable signal (IF-018) on BACnet/IP with a hardwired backup contact; loss of the link makes the signal FALSE at the BMS.</text><text x="32.0" y="944.5" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">• The fire alarm interface to the BMS is read only (IF-041); fan stops and damper closures are hardwired from the fire alarm panel (IF-042, IF-043).</text><text x="24.0" y="979.5" font-size="10" font-weight="700" fill="#5b6b78" text-anchor="start">LEGEND</text><line x1="24" y1="1001.49" x2="50" y2="1001.49" stroke="#334155" stroke-width="3"/><text x="56.0" y="1005.5" font-size="10" font-weight="400" fill="#172b3a" text-anchor="start">data / network</text><line x1="150.859375" y1="1001.49" x2="176.859375" y2="1001.49" stroke="#b91c1c" stroke-width="3"/><text x="182.9" y="1005.5" font-size="10" font-weight="400" fill="#172b3a" text-anchor="start">trip / protection</text><rect x="24" y="1019.49" width="1352" height="44" rx="0" fill="#f6f8fa" fill-opacity="1" stroke="#5b6b78" stroke-width="1"/><text x="32.0" y="1033.5" font-size="11" font-weight="700" fill="#172b3a" text-anchor="start">F25-1  ·  Integration map of the MSC-1 campus: which system sends data to which</text><text x="1368.0" y="1033.5" font-size="10" font-weight="400" fill="#5b6b78" text-anchor="end">Chapter 25 · §25.2</text><text x="32.0" y="1046.5" font-size="9" font-weight="400" fill="#5b6b78" text-anchor="start">Data Centre Commissioning Field Manual R01 EN · October 2026 · educational reference, not to scale · project and OEM documents govern</text><text x="32.0" y="1058.5" font-size="9" font-weight="400" fill="#5b6b78" text-anchor="start">Symbols: QElectroTech EN 60617 and P&amp;ID collections, CC-BY 3.0, native geometry · instrument bubbles per ISA 5.1 · states per IEC 60617 / IEEE C37.2 practice</text></svg>