ht="400" fill="#172b3a" text-anchor="start">2,030</text><text x="382.3" y="763.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">1,700</text><text x="566.3" y="763.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">70.8 %</text><text x="750.3" y="763.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">140</text><circle cx="656.7" cy="251.5" r="4" fill="#b7791f"/><circle cx="656.7" cy="203.3" r="4" fill="#b7791f"/><text x="24.0" y="30.0" font-size="17" font-weight="700" fill="#172b3a" text-anchor="start">F30-1  Dataset 1: building B2 L3 checklists, planned and actual (example data)</text><text x="24.0" y="48.0" font-size="11" font-weight="400" fill="#5b6b78" text-anchor="start">2,400 L3 checklists · week 12 planned 2,030 (84.6 %), actual 1,700 (70.8 %), gap 330 · last 4 weeks 160 per week · forecast completion week 16.4 against plan week 16</text><text x="32.0" y="806.0" font-size="10" font-weight="700" fill="#2d6a4f" text-anchor="start">WHAT TO PROVE</text><text x="32.0" y="822.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">• At week 12 the actual count is 1,700 of 2,400 (70.8 %) against 2,030 planned (84.6 %): a gap of 330 checklists or 13.8 percentage points.</text><text x="32.0" y="837.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">• At 160 checklists per week the remaining 700 need 4.4 weeks, so completion moves from week 16 to week 16.4 unless the rate rises to 175 per week.</text><rect x="24" y="870.0" width="952" height="44" rx="0" fill="#f6f8fa" fill-opacity="1" stroke="#5b6b78" stroke-width="1"/><text x="32.0" y="884.0" font-size="11" font-weight="700" fill="#172b3a" text-anchor="start">F30-1  ·  Dataset 1: building B2 L3 checklists, planned and actual (example data)</text><text x="968.0" y="884.0" font-size="10" font-weight="400" fill="#5b6b78" text-anchor="end">Chapter 30 · §30.4</text><text x="32.0" y="897.0" font-size="9" font-weight="400" fill="#5b6b78" text-anchor="start">Data Centre Commissioning Field Manual R01 EN · October 2026 · educational reference, not to scale · project and OEM documents govern</text><text x="32.0" y="909.0" font-size="9" font-weight="400" fill="#5b6b78" text-anchor="start">Symbols: QElectroTech EN 60617 and P&amp;ID collections, CC-BY 3.0, native geometry · instrument bubbles per ISA 5.1 · states per IEC 60617 / IEEE C37.2 practice</text></svg>