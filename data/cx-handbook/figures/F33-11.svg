weight="400" fill="#172b3a" text-anchor="middle">standby 24 h + 5 min alarm</text><text x="500.0" y="239.0" font-size="9" font-weight="400" fill="#172b3a" text-anchor="middle">15 min for voice evacuation</text><text x="500.0" y="251.2" font-size="9" font-weight="400" fill="#172b3a" text-anchor="middle">C&amp;E matrix drives outputs</text><text x="825.0" y="129.7" font-size="11" font-weight="700" fill="#b91c1c" text-anchor="middle">Clean agent release</text><text x="825.0" y="141.9" font-size="9" font-weight="400" fill="#172b3a" text-anchor="middle">coincidence detection</text><text x="825.0" y="154.0" font-size="9" font-weight="400" fill="#172b3a" text-anchor="middle">discharge ≤ 10 s to 95 %</text><text x="825.0" y="166.2" font-size="9" font-weight="400" fill="#172b3a" text-anchor="middle">hold time ≥ 10 min</text><text x="825.0" y="259.7" font-size="11" font-weight="700" fill="#b91c1c" text-anchor="middle">Pre-action valve</text><text x="825.0" y="271.9" font-size="9" font-weight="400" fill="#172b3a" text-anchor="middle">double interlock</text><text x="825.0" y="284.0" font-size="9" font-weight="400" fill="#172b3a" text-anchor="middle">water 60 s / 50 s (T8.2.4.3.2)</text><text x="825.0" y="296.2" font-size="9" font-weight="400" fill="#172b3a" text-anchor="middle">air restored in 30 min</text><text x="825.0" y="389.7" font-size="11" font-weight="700" fill="#b91c1c" text-anchor="middle">Notification and C&amp;E</text><text x="825.0" y="401.9" font-size="9" font-weight="400" fill="#172b3a" text-anchor="middle">sound ≥ ambient + 15 dB</text><text x="825.0" y="414.0" font-size="9" font-weight="400" fill="#172b3a" text-anchor="middle">dampers closed ≤ 30 s</text><text x="825.0" y="426.2" font-size="9" font-weight="400" fill="#172b3a" text-anchor="middle">doors released ≤ 2 s</text><text x="45.0" y="515.0" font-size="11" font-weight="700" fill="#172b3a" text-anchor="start">Term</text><text x="295.9" y="515.0" font-size="11" font-weight="700" fill="#172b3a" text-anchor="start">Acceptance value</text><text x="630.5" y="515.0" font-size="11" font-weight="700" fill="#172b3a" text-anchor="start">Source</text><text x="881.4" y="515.0" font-size="11" font-weight="700" fill="#172b3a" text-anchor="start">Sect.</text><text x="45.0" y="537.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">Transport time (VEWFD)</text><text x="295.9" y="537.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">≤ 60 s from the furthest hole</text><text x="630.5" y="537.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">NFPA 76 (Xtralis FAQ)</text><text x="881.4" y="537.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">20.4.2</text><text x="45.0" y="559.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">Secondary power</text><text x="295.9" y="559.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">24 h standby, then 5 min alarm</text><text x="630.5" y="559.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">NFPA 72 10.6.7.2.1</text><text x="881.4" y="559.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">20.2.3</text><text x="45.0" y="581.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">Audible alarm</text><text x="295.9" y="581.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">≥ ambient + 15 dB; ≤ 110 dBA</text><text x="630.5" y="581.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">NFPA 72 18.4</text><text x="881.4" y="581.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">20.5.1</text><text x="45.0" y="603.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">Halocarbon discharge</text><text x="295.9" y="603.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">≤ 10 s to 95 % of design conc.</text><text x="630.5" y="603.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">NFPA 2001</text><text x="881.4" y="603.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">20.6.1</text><text x="45.0" y="625.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">Hold time</text><text x="295.9" y="625.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">≥ 10 min at protected height</text><text x="630.5" y="625.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">NFPA 2001 Annex C</text><text x="881.4" y="625.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">20.6.3</text><text x="45.0" y="647.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">Fire pump at 150 % flow</text><text x="295.9" y="647.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">≥ 65 % rated; churn ≤ 140 %</text><text x="630.5" y="647.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">NFPA 20 6.2</text><text x="881.4" y="647.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">20.8.1</text><text x="24.0" y="30.0" font-size="17" font-weight="700" fill="#172b3a" text-anchor="start">F33-11  Fire detection and suppression terms on one signal path</text><text x="24.0" y="48.0" font-size="10" font-weight="400" fill="#5b6b78" text-anchor="start">VEWFD transport ≤ 60 s, hole ≤ 1.0 %/ft · FACP standby 24 h then 5 min alarm · halocarbon discharge ≤ 10 s · hold time ≥ 10 min · pre-action water 60 s light, 50 s</text><text x="24.0" y="61.0" font-size="10" font-weight="400" fill="#5b6b78" text-anchor="start">ordinary hazard (NFPA 13-2025 Table 8.2.4.3.2)</text><text x="32.0" y="690.0" font-size="10" font-weight="700" fill="#2d6a4f" text-anchor="start">WHAT TO PROVE</text><text x="32.0" y="706.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">• An aspirating detector in VEWFD service passes when smoke from the furthest hole reaches the detector in 60 s or less.</text><text x="32.0" y="721.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">• A clean-agent room passes the door fan test when the predicted hold time at the protected height is 10 minutes or more.</text><text x="24.0" y="756.0" font-size="10" font-weight="700" fill="#5b6b78" text-anchor="start">LEGEND</text><line x1="24" y1="778.0" x2="50" y2="778.0" stroke="#b91c1c" stroke-width="3"/><text x="56.0" y="782.0" font-size="10" font-weight="400" fill="#172b3a" text-anchor="start">fire water</text><line x1="126.0109375" y1="778.0" x2="152.0109375" y2="778.0" stroke="#475569" stroke-width="3"/><text x="158.0" y="782.0" font-size="10" font-weight="400" fill="#172b3a" text-anchor="start">signal / control</text><rect x="24" y="796.0" width="952" height="44" rx="0" fill="#f6f8fa" fill-opacity="1" stroke="#5b6b78" stroke-width="1"/><text x="32.0" y="810.0" font-size="11" font-weight="700" fill="#172b3a" text-anchor="start">F33-11  ·  Fire detection and suppression terms on one signal path</text><text x="968.0" y="810.0" font-size="10" font-weight="400" fill="#5b6b78" text-anchor="end">Chapter 33 · §33.6.2</text><text x="32.0" y="823.0" font-size="9" font-weight="400" fill="#5b6b78" text-anchor="start">Data Centre Commissioning Field Manual R01 EN · October 2026 · educational reference, not to scale · project and OEM documents govern</text><text x="32.0" y="835.0" font-size="9" font-weight="400" fill="#5b6b78" text-anchor="start">Symbols: QElectroTech EN 60617 and P&amp;ID collections, CC-BY 3.0, native geometry · instrument bubbles per ISA 5.1 · states per IEC 60617 / IEEE C37.2 practice</text></svg>