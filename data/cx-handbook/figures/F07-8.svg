1310 nm and 1.05 dB at 1550 nm and passes.</text><text x="32.0" y="571.9" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">• Fibre 18 reads 3.61 dB at 1310 nm, fails, shows core-zone contamination at the B-end port, and reads 1.18 dB after cleaning.</text><text x="24.0" y="606.9" font-size="10" font-weight="700" fill="#5b6b78" text-anchor="start">LEGEND</text><line x1="24" y1="628.88" x2="50" y2="628.88" stroke="#334155" stroke-width="3"/><text x="56.0" y="632.9" font-size="10" font-weight="400" fill="#172b3a" text-anchor="start">data / network</text><rect x="24" y="646.88" width="952" height="44" rx="0" fill="#f6f8fa" fill-opacity="1" stroke="#5b6b78" stroke-width="1"/><text x="32.0" y="660.9" font-size="11" font-weight="700" fill="#172b3a" text-anchor="start">F07-8  ·  Loss budget line 4.2 for link B2-MDA-01 to B2-DH3-IDA-01</text><text x="968.0" y="660.9" font-size="10" font-weight="400" fill="#5b6b78" text-anchor="end">Chapter 07 · §07.12.3</text><text x="32.0" y="673.9" font-size="9" font-weight="400" fill="#5b6b78" text-anchor="start">Data Centre Commissioning Field Manual R01 EN · October 2026 · educational reference, not to scale · project and OEM documents govern</text><text x="32.0" y="685.9" font-size="9" font-weight="400" fill="#5b6b78" text-anchor="start">Symbols: QElectroTech EN 60617 and P&amp;ID collections, CC-BY 3.0, native geometry · instrument bubbles per ISA 5.1 · states per IEC 60617 / IEEE C37.2 practice</text></svg>