eight="400" fill="#172b3a" text-anchor="start">• The systems manual starts in construction with a named champion and is accepted at handover.</text><rect x="24" y="662" width="1352" height="44" rx="0" fill="#f6f8fa" fill-opacity="1" stroke="#5b6b78" stroke-width="1"/><text x="32.0" y="676.0" font-size="11" font-weight="700" fill="#172b3a" text-anchor="start">F03-1  ·  Commissioning documents over the project phases: when each is written, used and closed</text><text x="1368.0" y="676.0" font-size="10" font-weight="400" fill="#5b6b78" text-anchor="end">Chapter 03 · §03.1</text><text x="32.0" y="689.0" font-size="9" font-weight="400" fill="#5b6b78" text-anchor="start">Data Centre Commissioning Field Manual R01 EN · October 2026 · educational reference, not to scale · project and OEM documents govern</text><text x="32.0" y="701.0" font-size="9" font-weight="400" fill="#5b6b78" text-anchor="start">Symbols: QElectroTech EN 60617 and P&amp;ID collections, CC-BY 3.0, native geometry · instrument bubbles per ISA 5.1 · states per IEC 60617 / IEEE C37.2 practice</text></svg>