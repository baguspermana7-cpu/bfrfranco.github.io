troke-width="1.2"/><text x="400.0" y="128.6" font-size="12" font-weight="700" fill="#172b3a" text-anchor="middle">S1 first aid</text><text x="600.0" y="128.6" font-size="12" font-weight="700" fill="#172b3a" text-anchor="middle">S2 medical</text><text x="800.0" y="128.6" font-size="12" font-weight="700" fill="#172b3a" text-anchor="middle">S3 lost time</text><text x="1000.0" y="128.6" font-size="12" font-weight="700" fill="#172b3a" text-anchor="middle">S4 major</text><text x="1200.0" y="128.6" font-size="12" font-weight="700" fill="#172b3a" text-anchor="middle">S5 fatality</text><text x="66.0" y="156.1" font-size="13" font-weight="400" fill="#172b3a" text-anchor="start">L5 almost certain</text><text x="400.0" y="156.1" font-size="13" font-weight="700" fill="#172b3a" text-anchor="middle">5</text><text x="600.0" y="156.1" font-size="13" font-weight="700" fill="#172b3a" text-anchor="middle">10</text><text x="800.0" y="156.1" font-size="13" font-weight="700" fill="#172b3a" text-anchor="middle">15</text><text x="1000.0" y="156.1" font-size="13" font-weight="700" fill="#172b3a" text-anchor="middle">20</text><text x="1200.0" y="156.1" font-size="13" font-weight="700" fill="#172b3a" text-anchor="middle">25</text><text x="66.0" y="183.7" font-size="13" font-weight="400" fill="#172b3a" text-anchor="start">L4 likely</text><text x="400.0" y="183.7" font-size="13" font-weight="700" fill="#172b3a" text-anchor="middle">4</text><text x="600.0" y="183.7" font-size="13" font-weight="700" fill="#172b3a" text-anchor="middle">8</text><text x="800.0" y="183.7" font-size="13" font-weight="700" fill="#172b3a" text-anchor="middle">12</text><text x="1000.0" y="183.7" font-size="13" font-weight="700" fill="#172b3a" text-anchor="middle">16</text><text x="1200.0" y="183.7" font-size="13" font-weight="700" fill="#172b3a" text-anchor="middle">20</text><text x="66.0" y="211.3" font-size="13" font-weight="400" fill="#172b3a" text-anchor="start">L3 possible</text><text x="400.0" y="211.3" font-size="13" font-weight="700" fill="#172b3a" text-anchor="middle">3</text><text x="600.0" y="211.3" font-size="13" font-weight="700" fill="#172b3a" text-anchor="middle">6</text><text x="800.0" y="211.3" font-size="13" font-weight="700" fill="#172b3a" text-anchor="middle">9</text><text x="1000.0" y="211.3" font-size="13" font-weight="700" fill="#172b3a" text-anchor="middle">12</text><text x="1200.0" y="211.3" font-size="13" font-weight="700" fill="#172b3a" text-anchor="middle">15</text><text x="66.0" y="238.8" font-size="13" font-weight="400" fill="#172b3a" text-anchor="start">L2 unlikely</text><text x="400.0" y="238.8" font-size="13" font-weight="700" fill="#172b3a" text-anchor="middle">2</text><text x="600.0" y="238.8" font-size="13" font-weight="700" fill="#172b3a" text-anchor="middle">4</text><text x="800.0" y="238.8" font-size="13" font-weight="700" fill="#172b3a" text-anchor="middle">6</text><text x="1000.0" y="238.8" font-size="13" font-weight="700" fill="#172b3a" text-anchor="middle">8</text><text x="1200.0" y="238.8" font-size="13" font-weight="700" fill="#172b3a" text-anchor="middle">10</text><text x="66.0" y="266.4" font-size="13" font-weight="400" fill="#172b3a" text-anchor="start">L1 rare</text><text x="400.0" y="266.4" font-size="13" font-weight="700" fill="#172b3a" text-anchor="middle">1</text><text x="600.0" y="266.4" font-size="13" font-weight="700" fill="#172b3a" text-anchor="middle">2</text><text x="800.0" y="266.4" font-size="13" font-weight="700" fill="#172b3a" text-anchor="middle">3</text><text x="1000.0" y="266.4" font-size="13" font-weight="700" fill="#172b3a" text-anchor="middle">4</text><text x="1200.0" y="266.4" font-size="13" font-weight="700" fill="#172b3a" text-anchor="middle">5</text><text x="70.0" y="319.8" font-size="12" font-weight="700" fill="#b7791f" text-anchor="start">Example from section 06.9.3</text><text x="70.0" y="336.6" font-size="12" font-weight="400" fill="#172b3a" text-anchor="start">Before controls: L3 x S5 = 15 (high). After remote closing, exclusion zone, VLF and PD results within limits: L1 x S5 = 5 (low).</text><text x="24.0" y="30.0" font-size="17" font-weight="700" fill="#172b3a" text-anchor="start">F06-6  Risk matrix used in the MSRA: likelihood by severity</text><text x="24.0" y="48.0" font-size="11" font-weight="400" fill="#5b6b78" text-anchor="start">Score = L x S · 15-25 high: task does not start · 8-12 medium: named controls and supervision · 1-6 low · example: closing the incomer 15 before controls, 5 after</text><text x="32.0" y="387.6" font-size="10" font-weight="700" fill="#2d6a4f" text-anchor="start">WHAT TO PROVE</text><text x="32.0" y="403.6" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">• First energisation of B2-MVS-01: likelihood 3, severity 5, score 15 before controls; likelihood 1, severity 5, score 5 after remote closing, exclusion zone and test results.</text><text x="32.0" y="418.6" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">• Each control that lowers the score must be a numbered step in the MSRA sequence.</text><rect x="24" y="451.56" width="1352" height="44" rx="0" fill="#f6f8fa" fill-opacity="1" stroke="#5b6b78" stroke-width="1"/><text x="32.0" y="465.6" font-size="11" font-weight="700" fill="#172b3a" text-anchor="start">F06-6  ·  Risk matrix used in the MSRA: likelihood by severity</text><text x="1368.0" y="465.6" font-size="10" font-weight="400" fill="#5b6b78" text-anchor="end">Chapter 06 · §06.9</text><text x="32.0" y="478.6" font-size="9" font-weight="400" fill="#5b6b78" text-anchor="start">Data Centre Commissioning Field Manual R01 EN · October 2026 · educational reference, not to scale · project and OEM documents govern</text><text x="32.0" y="490.6" font-size="9" font-weight="400" fill="#5b6b78" text-anchor="start">Symbols: QElectroTech EN 60617 and P&amp;ID collections, CC-BY 3.0, native geometry · instrument bubbles per ISA 5.1 · states per IEC 60617 / IEEE C37.2 practice</text></svg>