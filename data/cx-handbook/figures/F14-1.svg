t-anchor="start">per setting file, test points 3 x Ir etc.</text><text x="941.3" y="689.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">inside the OEM tolerance band</text><text x="45.0" y="711.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">TP5</text><text x="126.5" y="711.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">busway 2500 A</text><text x="354.6" y="711.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">joint resistance, IR</text><text x="615.4" y="711.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">DLRO 10 A or more; 1000 V DC</text><text x="941.3" y="711.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">joints within 50 % of the lowest; ≥ 1 MΩ OEM</text><text x="45.0" y="733.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">TP6</text><text x="126.5" y="733.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">RCDs 30 mA</text><text x="354.6" y="733.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">trip time at 1 x IΔn</text><text x="615.4" y="733.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">30 mA AC</text><text x="941.3" y="733.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">≤ 300 ms (S type 130 to 500 ms)</text><text x="24.0" y="30.0" font-size="17" font-weight="700" fill="#172b3a" text-anchor="start">F14-1  MSC-1 block LV system: 2.5 MVA transformer, 4000 A main ACB, switchboard and outgoing circuits with test points</text><text x="24.0" y="48.0" font-size="11" font-weight="400" fill="#5b6b78" text-anchor="start">20/0.415 kV 2.5 MVA, full load 3,478 A · main ACB 4000 A, Ir 3500 A · prospective fault at the LV bus about 58 kA with uk 6 % (example) · busway 2500 A to the UPS · MCCB 630 A to mechanical boards</text><text x="32.0" y="776.0" font-size="10" font-weight="700" fill="#2d6a4f" text-anchor="start">WHAT TO PROVE</text><text x="32.0" y="792.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">• Full-load current 2,500 kVA / (√3 x 0.415 kV) = 3,478 A: the main ACB 4000 A frame with Ir set to 3500 A carries it, and the LV switchboard short-circuit rating (Icw) must exceed the 58 kA prospective current.</text><text x="32.0" y="807.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">• The settings applied in test TP4 come from the approved protection setting file; the arc-flash label TP8 is printed only after the settings are verified.</text><text x="24.0" y="842.0" font-size="10" font-weight="700" fill="#5b6b78" text-anchor="start">LEGEND</text><g transform="translate(41.9 869.0) scale(0.12857142857142856)"><ellipse cx="-30.0" cy="-90.0" rx="30.0" ry="30.0" stroke="#172b3a" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/><line x1="-30" y1="-140" x2="-30" y2="-120" stroke="#172b3a" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/><ellipse cx="-30.0" cy="-50.0" rx="30.0" ry="30.0" stroke="#172b3a" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/><line x1="-30" y1="-20" x2="-30" y2="0" stroke="#172b3a" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/></g><text x="58.0" y="864.0" font-size="10" font-weight="400" fill="#172b3a" text-anchor="start">Transformer, two windings</text><g transform="translate(376.9 863.0) scale(0.3)"><line x1="0" y1="-20" x2="0" y2="-40" stroke="#172b3a" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/><line x1="0" y1="0" x2="0" y2="20" stroke="#172b3a" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/><line x1="0" y1="0" x2="-8" y2="-23" stroke="#172b3a" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/><line x1="-2" y1="-22" x2="2" y2="-18" stroke="#172b3a" stroke-width="1.8" fill="none" stroke-linecap="round" 