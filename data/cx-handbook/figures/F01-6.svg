e">Construction</text><text x="890.0" y="208.4" font-size="10.5" font-weight="700" fill="#172b3a" text-anchor="middle">Occupancy</text><text x="46.0" y="240.4" font-size="11.5" font-weight="400" fill="#172b3a" text-anchor="start">Owner project requirements (OPR)</text><text x="365.0" y="240.4" font-size="11.5" font-weight="700" fill="#172b3a" text-anchor="middle">write, owner signs</text><text x="540.0" y="240.4" font-size="11.5" font-weight="700" fill="#172b3a" text-anchor="middle">update</text><text x="725.0" y="240.4" font-size="11.5" font-weight="700" fill="#172b3a" text-anchor="middle">verify work against it</text><text x="890.0" y="232.8" font-size="11.5" font-weight="700" fill="#172b3a" text-anchor="middle">verify seasonal</text><text x="890.0" y="248.0" font-size="11.5" font-weight="700" fill="#172b3a" text-anchor="middle">tests</text><text x="46.0" y="280.0" font-size="11.5" font-weight="400" fill="#172b3a" text-anchor="start">Basis of design (BOD)</text><text x="540.0" y="280.0" font-size="11.5" font-weight="700" fill="#172b3a" text-anchor="middle">designer writes</text><text x="725.0" y="280.0" font-size="11.5" font-weight="700" fill="#172b3a" text-anchor="middle">update with changes</text><text x="890.0" y="272.4" font-size="11.5" font-weight="700" fill="#172b3a" text-anchor="middle">goes into systems</text><text x="890.0" y="287.6" font-size="11.5" font-weight="700" fill="#172b3a" text-anchor="middle">manual</text><text x="46.0" y="311.9" font-size="11.5" font-weight="400" fill="#172b3a" text-anchor="start">Cx plan</text><text x="365.0" y="311.9" font-size="11.5" font-weight="700" fill="#172b3a" text-anchor="middle">draft</text><text x="540.0" y="311.9" font-size="11.5" font-weight="700" fill="#172b3a" text-anchor="middle">update</text><text x="725.0" y="311.9" font-size="11.5" font-weight="700" fill="#172b3a" text-anchor="middle">update each level</text><text x="890.0" y="311.9" font-size="11.5" font-weight="700" fill="#172b3a" text-anchor="middle">final issue</text><text x="46.0" y="336.3" font-size="11.5" font-weight="400" fill="#172b3a" text-anchor="start">Design review</text><text x="540.0" y="336.3" font-size="11.5" font-weight="700" fill="#172b3a" text-anchor="middle">review against OPR</text><text x="725.0" y="336.3" font-size="11.5" font-weight="700" fill="#172b3a" text-anchor="middle">review submittals</text><text x="46.0" y="368.3" font-size="11.5" font-weight="400" fill="#172b3a" text-anchor="start">Cx specification</text><text x="540.0" y="360.7" font-size="11.5" font-weight="700" fill="#172b3a" text-anchor="middle">write 01 91 13 and</text><text x="540.0" y="375.9" font-size="11.5" font-weight="700" fill="#172b3a" text-anchor="middle">discipline sections</text><text x="725.0" y="368.3" font-size="11.5" font-weight="700" fill="#172b3a" text-anchor="middle">apply</text><text x="46.0" y="407.9" font-size="11.5" font-weight="400" fill="#172b3a" text-anchor="start">Checklists and test procedures</text><text x="540.0" y="407.9" font-size="11.5" font-weight="700" fill="#172b3a" text-anchor="middle">draft</text><text x="725.0" y="407.9" font-size="11.5" font-weight="700" fill="#172b3a" text-anchor="middle">execute and record</text><text x="890.0" y="400.3" font-size="11.5" font-weight="700" fill="#172b3a" text-anchor="middle">seasonal and</text><text x="890.0" y="415.4" font-size="11.5" font-weight="700" fill="#172b3a" text-anchor="middle">deferred tests</text><text x="46.0" y="439.8" font-size="11.5" font-weight="400" fill="#172b3a" text-anchor="start">Issues log</text><text x="365.0" y="439.8" font-size="11.5" font-weight="700" fill="#172b3a" text-anchor="middle">open</text><text x="540.0" y="439.8" font-size="11.5" font-weight="700" fill="#172b3a" text-anchor="middle">record design issues</text><text x="725.0" y="439.8" font-size="11.5" font-weight="700" fill="#172b3a" text-anchor="middle">record and resolve</text><text x="890.0" y="439.8" font-size="11.5" font-weight="700" fill="#172b3a" text-anchor="middle">close</text><text x="46.0" y="464.2" font-size="11.5" font-weight="400" fill="#172b3a" text-anchor="start">Training and systems manual</text><text x="540.0" y="464.2" font-size="11.5" font-weight="700" fill="#172b3a" text-anchor="middle">state requirements</text><text x="725.0" y="464.2" font-size="11.5" font-weight="700" fill="#172b3a" text-anchor="middle">verify plan and content</text><text x="890.0" y="464.2" font-size="11.5" font-weight="700" fill="#172b3a" text-anchor="middle">deliver and record</text><text x="46.0" y="496.2" font-size="11.5" font-weight="400" fill="#172b3a" text-anchor="start">Final Cx process report</text><text x="725.0" y="496.2" font-size="11.5" font-weight="700" fill="#172b3a" text-anchor="middle">interim reports</text><text x="890.0" y="488.6" font-size="11.5" font-weight="700" fill="#172b3a" text-anchor="middle">final report, lessons</text><text x="890.0" y="503.8" font-size="11.5" font-weight="700" fill="#172b3a" text-anchor="middle">learned</text><text x="50.0" y="549.5" font-size="11.5" font-weight="700" fill="#b7791f" text-anchor="start">Sampling rule used in this manual</text><text x="50.0" y="565.6" font-size="11.5" font-weight="400" fill="#172b3a" text-anchor="start">ASHRAE recommends verification by sampling, generally 5 % to 10 %, set by the commissioning provider.</text><text x="50.0" y="581.1" font-size="11.5" font-weight="400" fill="#172b3a" text-anchor="start">Uptime Institute states that representative testing is not acceptable for critical components; the OPR on MSC-1 requires 100 % testing of the critical path.</text><text x="24.0" y="30.0" font-size="17" font-weight="700" fill="#172b3a" text-anchor="start">F01-6  ASHRAE Guideline 0-2019: commissioning documents in each phase</text><text x="24.0" y="48.0" font-size="10" font-weight="400" fill="#5b6b78" text-anchor="start">four phases · nine documents or activities · CxM appointed before the 30 % design review · verification sampling 5 % to 10 % (ASHRAE) or 100 % of critical components</text><text x="24.0" y="61.0" font-size="10" font-weight="400" fill="#5b6b78" text-anchor="start">(Uptime)</text><text x="32.0" y="632.0" font-size="10" font-weight="700" fill="#2d6a4f" text-anchor="start">WHAT TO PROVE</text><text x="32.0" y="648.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">• The OPR is written in pre-design and every later verification is made against it.</text><text x="32.0" y="663.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">• The issues log opens in pre-design and closes in occupancy and operations with the final commissioning process report.</text><text x="32.0" y="678.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">• Sampling of 5 % to 10 % applies only where the Cx plan allows it; the critical power and cooling path is tested at 100 %.</text><text x="24.0" y="713.0" font-size="10" font-weight="700" fill="#5b6b78" text-anchor="start">LEGEND</text><line x1="24" y1="735.0" x2="50" y2="735.0" stroke="#475569" stroke-width="3"/><text x="56.0" y="739.0" font-size="10" font-weight="400" fill="#172b3a" text-anchor="start">signal / control</text><rect x="24" y="753.0" width="952" height="44" rx="0" fill="#f6f8fa" fill-opacity="1" stroke="#5b6b78" stroke-width="1"/><text x="32.0" y="767.0" font-size="11" font-weight="700" fill="#172b3a" text-anchor="start">F01-6  ·  ASHRAE Guideline 0-2019: commissioning documents in each phase</text><text x="968.0" y="767.0" font-size="10" font-weight="400" fill="#5b6b78" text-anchor="end">Chapter 01 · §01.3.2</text><text x="32.0" y="780.0" font-size="9" font-weight="400" fill="#5b6b78" text-anchor="start">Data Centre Commissioning Field Manual R01 EN · October 2026 · educational reference, not to scale · project and OEM documents govern</text><text x="32.0" y="792.0" font-size="9" font-weight="400" fill="#5b6b78" text-anchor="start">Symbols: QElectroTech EN 60617 and P&amp;ID collections, CC-BY 3.0, native geometry · instrument bubbles per ISA 5.1 · states per IEC 60617 / IEEE C37.2 practice</text></svg>