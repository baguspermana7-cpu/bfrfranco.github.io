.2" y="601.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">46</text><text x="451.2" y="601.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">44</text><text x="705.0" y="601.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">52</text><text x="925.0" y="601.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">49</text><text x="1145.0" y="601.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">pass</text><text x="45.0" y="623.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">4 first test</text><text x="214.2" y="623.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">47</text><text x="451.2" y="623.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">58</text><text x="705.0" y="623.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">55</text><text x="925.0" y="623.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">71</text><text x="1145.0" y="623.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">fail: end cap</text><text x="45.0" y="645.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">4 retest</text><text x="214.2" y="645.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">47</text><text x="451.2" y="645.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">46</text><text x="705.0" y="645.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">55</text><text x="925.0" y="645.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">54</text><text x="1145.0" y="645.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">pass</text><text x="24.0" y="30.0" font-size="17" font-weight="700" fill="#172b3a" text-anchor="start">F20-5  VESDA detector B2-DH3-ASD-02: four sampling pipes, predicted and measured transport time</text><text x="24.0" y="48.0" font-size="11" font-weight="400" fill="#5b6b78" text-anchor="start">4 pipes x 20 holes = 80 holes · Fire 1 at 0.0125 %/ft gives about 1.0 %/ft per hole (VEWFD limit 1.0 %/ft) · transport limit 60 s (NFPA 76 VEWFD) · pipe 4 first measured 71 s, 54 s after the end cap was replaced</text><text x="32.0" y="688.0" font-size="10" font-weight="700" fill="#2d6a4f" text-anchor="start">WHAT TO PROVE</text><text x="32.0" y="704.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">• Hole sensitivity is about detector sensitivity x number of holes: 0.0125 x 80 = 1.0 %/ft; the ASPIRE report value 0.98 %/ft passes.</text><text x="32.0" y="719.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">• A measured time far above the prediction (71 s against 55 s) points to a leak, a wrong end-cap hole or a blocked hole; fix and retest before the C&amp;E rows 1 to 4.</text><text x="24.0" y="754.0" font-size="10" font-weight="700" fill="#5b6b78" text-anchor="start">LEGEND</text><line x1="24" y1="776.0" x2="50" y2="776.0" stroke="#b91c1c" stroke-width="3"/><text x="56.0" y="780.0" font-size="10" font-weight="400" fill="#172b3a" text-anchor="start">fire water</text><line x1="126.0109375" y1="776.0" x2="152.0109375" y2="776.0" stroke="#0ea5e9" stroke-width="3"/><text x="158.0" y="780.0" font-size="10" font-weight="400" fill="#172b3a" text-anchor="start">air</text><rect x="24" y="794.0" width="1352" height="44" rx="0" fill="#f6f8fa" fill-opacity="1" stroke="#5b6b78" stroke-width="1"/><text x="32.0" y="808.0" font-size="11" font-weight="700" fill="#172b3a" text-anchor="start">F20-5  ·  VESDA detector B2-DH3-ASD-02: four sampling pipes, predicted and measured transport time</text><text x="1368.0" y="808.0" font-size="10" font-weight="400" fill="#5b6b78" text-anchor="end">Chapter 20 · §20.4</text><text x="32.0" y="821.0" font-size="9" font-weight="400" fill="#5b6b78" text-anchor="start">Data Centre Commissioning Field Manual R01 EN · October 2026 · educational reference, 