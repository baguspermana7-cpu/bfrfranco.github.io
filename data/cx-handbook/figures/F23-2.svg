 stroke="#1d4ed8" stroke-width="1.6"/><rect x="700" y="596" width="280" height="80" rx="4" fill="#ffffff" fill-opacity="1" stroke="#1d4ed8" stroke-width="1.6"/><rect x="1020" y="596" width="280" height="80" rx="4" fill="#ffffff" fill-opacity="1" stroke="#1d4ed8" stroke-width="1.6"/><text x="210.0" y="147.9" font-size="12" font-weight="700" fill="#334155" text-anchor="middle">Engineering Client</text><text x="210.0" y="161.4" font-size="10" font-weight="400" fill="#172b3a" text-anchor="middle">Management Console: sites, devices</text><text x="210.0" y="174.9" font-size="10" font-weight="400" fill="#172b3a" text-anchor="middle">Vista diagrams, Designer (ION logic)</text><text x="550.0" y="147.9" font-size="12" font-weight="700" fill="#334155" text-anchor="middle">Web Client (browser)</text><text x="550.0" y="161.4" font-size="10" font-weight="400" fill="#172b3a" text-anchor="middle">Dashboards, Diagrams, Trends</text><text x="550.0" y="174.9" font-size="10" font-weight="400" fill="#172b3a" text-anchor="middle">Alarms, Reports</text><text x="880.0" y="147.9" font-size="12" font-weight="700" fill="#334155" text-anchor="middle">OPC clients</text><text x="880.0" y="161.4" font-size="10" font-weight="400" fill="#172b3a" text-anchor="middle">DCIM, historian</text><text x="880.0" y="174.9" font-size="10" font-weight="400" fill="#172b3a" text-anchor="middle">OPC DA or OPC UA</text><text x="1200.0" y="147.9" font-size="12" font-weight="700" fill="#334155" text-anchor="middle">Notifications</text><text x="1200.0" y="161.4" font-size="10" font-weight="400" fill="#172b3a" text-anchor="middle">email, SMS, SNMP</text><text x="1200.0" y="174.9" font-size="10" font-weight="400" fill="#172b3a" text-anchor="middle">Event Notification Module</text><text x="185.0" y="299.4" font-size="11.5" font-weight="700" fill="#475569" text-anchor="middle">ION Site Service</text><text x="185.0" y="312.2" font-size="9.5" font-weight="400" fill="#172b3a" text-anchor="middle">device communication</text><text x="185.0" y="325.0" font-size="9.5" font-weight="400" fill="#172b3a" text-anchor="middle">Ethernet and gateway sites</text><text x="475.0" y="299.4" font-size="11.5" font-weight="700" fill="#475569" text-anchor="middle">ION Network Router</text><text x="475.0" y="312.2" font-size="9.5" font-weight="400" fill="#172b3a" text-anchor="middle">routes ION requests</text><text x="475.0" y="325.0" font-size="9.5" font-weight="400" fill="#172b3a" text-anchor="middle">between components</text><text x="765.0" y="299.4" font-size="11.5" font-weight="700" fill="#475569" text-anchor="middle">ION Real Time Data</text><text x="765.0" y="312.2" font-size="9.5" font-weight="400" fill="#172b3a" text-anchor="middle">live values to Vista,</text><text x="765.0" y="325.0" font-size="9.5" font-weight="400" fill="#172b3a" text-anchor="middle">Diagrams, Trends</text><text x="1055.0" y="299.4" font-size="11.5" font-weight="700" fill="#475569" text-anchor="middle">ION OPC DA / UA Server</text><text x="1055.0" y="312.2" font-size="9.5" font-weight="400" fill="#172b3a" text-anchor="middle">Data Exchange</text><text x="1055.0" y="325.0" font-size="9.5" font-weight="400" fill="#172b3a" text-anchor="middle">Module licence</text><text x="185.0" y="405.4" font-size="11.5" font-weight="700" fill="#475569" text-anchor="middle">Log Subsystem Router</text><text x="185.0" y="418.2" font-size="9.5" font-weight="400" fill="#172b3a" text-anchor="middle">moves device logs</text><text x="185.0" y="431.0" font-size="9.5" font-weight="400" fill="#172b3a" text-anchor="middle">to storage</text><text x="475.0" y="405.4" font-size="11.5" font-weight="700" fill="#475569" text-anchor="middle">ION Log Inserter</text><text x="475.0" y="418.2" font-size="9.5" font-weight="400" fill="#172b3a" text-anchor="middle">writes history</text><text x="475.0" y="431.0" font-size="9.5" font-weight="400" fill="#172b3a" text-anchor="middle">into ION_Data</text><text x="765.0" y="405.4" font-size="11.5" font-weight="700" fill="#475569" text-anchor="middle">ION Query Service</text><text x="765.0" y="418.2" font-size="9.5" font-weight="400" fill="#172b3a" text-anchor="middle">history to Trends,</text><text x="765.0" y="431.0" font-size="9.5" font-weight="400" fill="#172b3a" text-anchor="middle">Reports, Diagrams</text><text x="1055.0" y="405.4" font-size="11.5" font-weight="700" fill="#475569" text-anchor="middle">Virtual Processor</text><text x="1055.0" y="418.2" font-size="9.5" font-weight="400" fill="#172b3a" text-anchor="middle">NVIP.DEFAULT: virtual meters</text><text x="1055.0" y="431.0" font-size="9.5" font-weight="400" fill="#172b3a" text-anchor="middle">NVIP.PQADVISOR: PQ</text><text x="185.0" y="492.8" font-size="11.5" font-weight="700" fill="#475569" text-anchor="middle">Report Subscription</text><text x="185.0" y="505.6" font-size="9.5" font-weight="400" fill="#172b3a" text-anchor="middle">scheduled reports</text><text x="475.0" y="492.8" font-size="11.5" font-weight="700" fill="#475569" text-anchor="middle">Event Watcher</text><text x="475.0" y="505.6" font-size="9.5" font-weight="400" fill="#172b3a" text-anchor="middle">system event rules</text><text x="765.0" y="492.8" font-size="11.5" font-weight="700" fill="#475569" text-anchor="middle">Syslog Server Service</text><text x="765.0" y="505.6" font-size="9.5" font-weight="400" fill="#172b3a" text-anchor="middle">messages to SIEM</text><text x="1055.0" y="492.8" font-size="11.5" font-weight="700" fill="#475569" text-anchor="middle">PQDIF Exporter, Comtrade</text><text x="1055.0" y="505.6" font-size="9.5" font-weight="400" fill="#172b3a" text-anchor="middle">PQ data exchange</text><text x="200.0" y="620.9" font-size="12" font-weight="700" fill="#1d4ed8" text-anchor="middle">ION_Data</text><text x="200.0" y="634.4" font-size="10" font-weight="400" fill="#172b3a" text-anchor="middle">logged history, events,</text><text x="200.0" y="647.9" font-size="10" font-weight="400" fill="#172b3a" text-anchor="middle">waveforms</text><text x="520.0" y="620.9" font-size="12" font-weight="700" fill="#1d4ed8" text-anchor="middle">ION_Network</text><text x="520.0" y="634.4" font-size="10" font-weight="400" fill="#172b3a" text-anchor="middle">sites, devices,</text><text x="520.0" y="647.9" font-size="10" font-weight="400" fill="#172b3a" text-anchor="middle">configuration</text><text x="840.0" y="620.9" font-size="12" font-weight="700" fill="#1d4ed8" text-anchor="middle">ION_SystemLog</text><text x="840.0" y="634.4" font-size="10" font-weight="400" fill="#172b3a" text-anchor="middle">system events and</text><text x="840.0" y="647.9" font-size="10" font-weight="400" fill="#172b3a" text-anchor="middle">timestamps</text><text x="1160.0" y="620.9" font-size="12" font-weight="700" fill="#1d4ed8" text-anchor="middle">ApplicationModules</text><text x="1160.0" y="634.4" font-size="10" font-weight="400" fill="#172b3a" text-anchor="middle">web applications,</text><text x="1160.0" y="647.9" font-size="10" font-weight="400" fill="#172b3a" text-anchor="middle">hierarchies, reports</text><text x="1210.0" y="300.0" font-size="11" font-weight="700" fill="#5b6b78" text-anchor="start">Licensed</text><text x="1210.0" y="316.0" font-size="11" font-weight="700" fill="#5b6b78" text-anchor="start">modules:</text><text x="1210.0" y="336.0" font-size="10.5" font-weight="400" fill="#172b3a" text-anchor="start">Power Quality</text><text x="1210.0" y="350.2" font-size="10.5" font-weight="400" fill="#172b3a" text-anchor="start">Performance,</text><text x="1210.0" y="364.4" font-size="10.5" font-weight="400" fill="#172b3a" text-anchor="start">Breaker</text><text x="1210.0" y="378.5" font-size="10.5" font-weight="400" fill="#172b3a" text-anchor="start">Performance,</text><text x="1210.0" y="392.7" font-size="10.5" font-weight="400" fill="#172b3a" text-anchor="start">Capacity</text><text x="1210.0" y="406.9" font-size="10.5" font-weight="400" fill="#172b3a" text-anchor="start">Management,</text><text x="1210.0" y="421.1" font-size="10.5" font-weight="400" fill="#172b3a" text-anchor="start">Backup Power,</text><text x="1210.0" y="435.2" font-size="10.5" font-weight="400" fill="#172b3a" text-anchor="start">Energy Billing</text><path d="M233.0 560 A7 7 0 0 1 247.0 560" fill="none" stroke="#ffffff" stroke-width="7"/><path d="M233.0 560 A7 7 0 0 1 247.0 560" fill="none" stroke="#172b3a" stroke-width="2"/><path d="M613 552 A7 7 0 0 1 627 552" fill="none" stroke="#ffffff" stroke-width="7"/><path d="M613 552 A7 7 0 0 1 627 552" fill="none" stroke="#172b3a" stroke-width="2"/><text x="24.0" y="30.0" font-size="17" font-weight="700" fill="#172b3a" text-anchor="start">F23-2  PME server software: clients, Windows services and the four SQL Server databases</text><text x="24.0" y="48.0" font-size="11" font-weight="400" fill="#5b6b78" text-anchor="start">Engineering Client and Web Client · ION Network Router, ION Site Service, Log Inserter, Real Time Data, Query, Virtual Processor · ION_Data, ION_Network, ION_SystemLog, ApplicationModules</text><text x="32.0" y="732.0" font-size="10" font-weight="700" fill="#2d6a4f" text-anchor="start">WHAT TO PROVE</text><text x="32.0" y="748.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">• Real-time values reach Vista and Diagrams through the ION Real Time Data Service; historical values reach Trends and Reports through the ION Query Service from ION_Data.</text><text x="32.0" y="763.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">• OPC DA and OPC UA servers start only when the Data Exchange Module licence is active; the Virtual Processor (NVIP.DEFAULT) calculates virtual meters and logic.</text><text x="24.0" y="798.0" font-size="10" font-weight="700" fill="#5b6b78" text-anchor="start">LEGEND</text><line x1="24" y1="820" x2="50" y2="820" stroke="#334155" stroke-width="3"/><text x="56.0" y="824.0" font-size="10" font-weight="400" fill="#172b3a" text-anchor="start">data / network</text><line x1="150.859375" y1="820" x2="176.859375" y2="820" stroke="#475569" stroke-width="3"/><text x="182.9" y="824.0" font-size="10" font-weight="400" fill="#172b3a" text-anchor="start">signal / control</text><line x1="278.8265625" y1="820" x2="304.8265625" y2="820" stroke="#1d4ed8" stroke-width="3"/><text x="310.8" y="824.0" font-size="10" font-weight="400" fill="#172b3a" text-anchor="start">415 V</text><rect x="24" y="838" width="1352" height="44" rx="0" fill="#f6f8fa" fill-opacity="1" stroke="#5b6b78" stroke-width="1"/><text x="32.0" y="852.0" font-size="11" font-weight="700" fill="#172b3a" text-anchor="start">F23-2  ·  PME server software: clients, Windows services and the four SQL Server databases</text><text x="1368.0" y="852.0" font-size="10" font-weight="400" fill="#5b6b78" text-anchor="end">Chapter 23 · §23.3</text><text x="32.0" y="865.0" font-size="9" font-weight="400" fill="#5b6b78" text-anchor="start">Data Centre Commissioning Field Manual R01 EN · October 2026 · educational reference, not to scale · project and OEM documents govern</text><text x="32.0" y="877.0" font-size="9" font-weight="400" fill="#5b6b78" text-anchor="start">Symbols: QElectroTech EN 60617 and P&amp;ID collections, CC-BY 3.0, native geometry · instrument bubbles per ISA 5.1 · states per IEC 60617 / IEEE C37.2 practice</text></svg>