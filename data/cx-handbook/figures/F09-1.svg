" stroke-width="0.8"/><rect x="40" y="565.0" width="271.7647058823529" height="23.0" rx="0" fill="#ffffff" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><rect x="311.7647058823529" y="565.0" width="660.0" height="23.0" rx="0" fill="#ffffff" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><rect x="971.7647058823529" y="565.0" width="388.2352941176471" height="23.0" rx="0" fill="#ffffff" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><rect x="40" y="588.0" width="271.7647058823529" height="23.0" rx="0" fill="#ffffff" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><rect x="311.7647058823529" y="588.0" width="660.0" height="23.0" rx="0" fill="#ffffff" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><rect x="971.7647058823529" y="588.0" width="388.2352941176471" height="23.0" rx="0" fill="#ffffff" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><text x="155.0" y="149.9" font-size="12" font-weight="700" fill="#475569" text-anchor="middle">1 Raise NCR</text><text x="155.0" y="163.4" font-size="10" font-weight="400" fill="#172b3a" text-anchor="middle">finder</text><text x="155.0" y="176.9" font-size="10" font-weight="400" fill="#172b3a" text-anchor="middle">same working day</text><text x="427.0" y="149.9" font-size="12" font-weight="700" fill="#475569" text-anchor="middle">2 Register</text><text x="427.0" y="163.4" font-size="10" font-weight="400" fill="#172b3a" text-anchor="middle">QA/QC manager</text><text x="427.0" y="176.9" font-size="10" font-weight="400" fill="#172b3a" text-anchor="middle">notify within 1 day</text><text x="699.0" y="149.9" font-size="12" font-weight="700" fill="#475569" text-anchor="middle">3 Contain</text><text x="699.0" y="163.4" font-size="10" font-weight="400" fill="#172b3a" text-anchor="middle">subcontractor</text><text x="699.0" y="176.9" font-size="10" font-weight="400" fill="#172b3a" text-anchor="middle">within 1 day</text><text x="971.0" y="149.9" font-size="12" font-weight="700" fill="#475569" text-anchor="middle">4 Propose</text><text x="971.0" y="163.4" font-size="10" font-weight="400" fill="#172b3a" text-anchor="middle">subcontractor</text><text x="971.0" y="176.9" font-size="10" font-weight="400" fill="#172b3a" text-anchor="middle">disposition, 3 days</text><text x="1243.0" y="149.9" font-size="12" font-weight="700" fill="#475569" text-anchor="middle">5 Approve</text><text x="1243.0" y="163.4" font-size="10" font-weight="400" fill="#172b3a" text-anchor="middle">QA/QC manager or Engineer</text><text x="1243.0" y="176.9" font-size="10" font-weight="400" fill="#172b3a" text-anchor="middle">3 days</text><text x="155.0" y="329.9" font-size="12" font-weight="700" fill="#475569" text-anchor="middle">6 Correct</text><text x="155.0" y="343.4" font-size="10" font-weight="400" fill="#172b3a" text-anchor="middle">subcontractor</text><text x="155.0" y="356.9" font-size="10" font-weight="400" fill="#172b3a" text-anchor="middle">10 days major, 5 minor</text><text x="427.0" y="329.9" font-size="12" font-weight="700" fill="#475569" text-anchor="middle">7 Verify</text><text x="427.0" y="343.4" font-size="10" font-weight="400" fill="#172b3a" text-anchor="middle">re-inspection IR</text><text x="427.0" y="356.9" font-size="10" font-weight="400" fill="#172b3a" text-anchor="middle">retest witnessed</text><text x="699.0" y="329.9" font-size="12" font-weight="700" fill="#475569" text-anchor="middle">8 CAR if required</text><text x="699.0" y="343.4" font-size="10" font-weight="400" fill="#172b3a" text-anchor="middle">QA/QC manager</text><text x="699.0" y="356.9" font-size="10" font-weight="400" fill="#172b3a" text-anchor="middle">root cause, 8D</text><text x="971.0" y="329.9" font-size="12" font-weight="700" fill="#475569" text-anchor="middle">9 Close</text><text x="971.0" y="343.4" font-size="10" font-weight="400" fill="#172b3a" text-anchor="middle">QA/QC manager, Engineer</text><text x="971.0" y="356.9" font-size="10" font-weight="400" fill="#172b3a" text-anchor="middle">CxM confirms</text><text x="1245.0" y="329.9" font-size="12" font-weight="700" fill="#b91c1c" text-anchor="middle">Rejected proposal</text><text x="1245.0" y="343.4" font-size="10" font-weight="400" fill="#172b3a" text-anchor="middle">returned to step 4</text><text x="1245.0" y="356.9" font-size="10" font-weight="400" fill="#172b3a" text-anchor="middle">with reasons</text><text x="45.0" y="465.6" font-size="11.5" font-weight="700" fill="#172b3a" text-anchor="start">Status in register</text><text x="316.8" y="465.6" font-size="11.5" font-weight="700" fill="#172b3a" text-anchor="start">Set when</text><text x="976.8" y="465.6" font-size="11.5" font-weight="700" fill="#172b3a" text-anchor="start">Set by</text><text x="45.0" y="488.6" font-size="11.5" font-weight="400" fill="#172b3a" text-anchor="start">open</text><text x="316.8" y="488.6" font-size="11.5" font-weight="400" fill="#172b3a" text-anchor="start">NCR registered</text><text x="976.8" y="488.6" font-size="11.5" font-weight="400" fill="#172b3a" text-anchor="start">QA/QC manager</text><text x="45.0" y="511.6" font-size="11.5" font-weight="400" fill="#172b3a" text-anchor="start">contained</text><text x="316.8" y="511.6" font-size="11.5" font-weight="400" fill="#172b3a" text-anchor="start">containment recorded on the NCR</text><text x="976.8" y="511.6" font-size="11.5" font-weight="400" fill="#172b3a" text-anchor="start">subcontractor, checked by inspector</text><text x="45.0" y="534.6" font-size="11.5" font-weight="400" fill="#172b3a" text-anchor="start">disposition approved</text><text x="316.8" y="534.6" font-size="11.5" font-weight="400" fill="#172b3a" text-anchor="start">approval signed (designer agreement for use as is or repair)</text><text x="976.8" y="534.6" font-size="11.5" font-weight="400" fill="#172b3a" text-anchor="start">QA/QC manager or Engineer</text><text x="45.0" y="557.6" font-size="11.5" font-weight="400" fill="#172b3a" text-anchor="start">corrected</text><text x="316.8" y="557.6" font-size="11.5" font-weight="400" fill="#172b3a" text-anchor="start">correction complete, re-inspection IR raised</text><text x="976.8" y="557.6" font-size="11.5" font-weight="400" fill="#172b3a" text-anchor="start">subcontractor</text><text x="45.0" y="580.6" font-size="11.5" font-weight="400" fill="#172b3a" text-anchor="start">verified</text><text x="316.8" y="580.6" font-size="11.5" font-weight="400" fill="#172b3a" text-anchor="start">IR released, retest passed</text><text x="976.8" y="580.6" font-size="11.5" font-weight="400" fill="#172b3a" text-anchor="start">inspector</text><text x="45.0" y="603.6" font-size="11.5" font-weight="400" fill="#172b3a" text-anchor="start">closed</text><text x="316.8" y="603.6" font-size="11.5" font-weight="400" fill="#172b3a" text-anchor="start">closure package of 10 items complete</text><text x="976.8" y="603.6" font-size="11.5" font-weight="400" fill="#172b3a" text-anchor="start">QA/QC manager and Engineer</text><path d="M1236.0 232 A7 7 0 0 1 1250.0 232" fill="none" stroke="#ffffff" stroke-width="7"/><path d="M1236.0 232 A7 7 0 0 1 1250.0 232" fill="none" stroke="#172b3a" stroke-width="2"/><text x="24.0" y="30.0" font-size="17" font-weight="700" fill="#172b3a" text-anchor="start">F09-1  NCR workflow with roles and MSC-1 time limits in working days</text><text x="24.0" y="48.0" font-size="11" font-weight="400" fill="#5b6b78" text-anchor="start">raise same day · register and notify 1 · contain 1 · propose disposition 3 · review 3 · correct 10 (major) or 5 (minor) · verify by re-inspection IR · CAR for major, repeated and process NCRs</text><text x="32.0" y="647.0" font-size="10" font-weight="700" fill="#2d6a4f" text-anchor="start">WHAT TO PROVE</text><text x="32.0" y="663.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">• Containment within 1 working day stops the next trade from covering or energising the nonconforming item.</text><text x="32.0" y="678.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">• A use-as-is or repair disposition on a major NCR needs the designer&#x27;s written agreement before the Engineer approves it.</text><text x="24.0" y="713.0" font-size="10" font-weight="700" fill="#5b6b78" text-anchor="start">LEGEND</text><line x1="24" y1="735.0" x2="50" y2="735.0" stroke="#475569" stroke-width="3"/><text x="56.0" y="739.0" font-size="10" font-weight="400" fill="#172b3a" text-anchor="start">signal / control</text><line x1="151.9671875" y1="735.0" x2="177.9671875" y2="735.0" stroke="#b91c1c" stroke-width="3"/><text x="184.0" y="739.0" font-size="10" font-weight="400" fill="#172b3a" text-anchor="start">trip / protection</text><rect x="24" y="753.0" width="1352" height="44" rx="0" fill="#f6f8fa" fill-opacity="1" stroke="#5b6b78" stroke-width="1"/><text x="32.0" y="767.0" font-size="11" font-weight="700" fill="#172b3a" text-anchor="start">F09-1  ·  NCR workflow with roles and MSC-1 time limits in working days</text><text x="1368.0" y="767.0" font-size="10" font-weight="400" fill="#5b6b78" text-anchor="end">Chapter 09 · §09.5</text><text x="32.0" y="780.0" font-size="9" font-weight="400" fill="#5b6b78" text-anchor="start">Data Centre Commissioning Field Manual R01 EN · October 2026 · educational reference, not to scale · project and OEM documents govern</text><text x="32.0" y="792.0" font-size="9" font-weight="400" fill="#5b6b78" text-anchor="start">Symbols: QElectroTech EN 60617 and P&amp;ID collections, CC-BY 3.0, native geometry · instrument bubbles per ISA 5.1 · states per IEC 60617 / IEEE C37.2 practice</text></svg>