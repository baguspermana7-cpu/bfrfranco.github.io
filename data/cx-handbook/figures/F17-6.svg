l="#ffffff" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><text x="175.0" y="173.9" font-size="11.5" font-weight="700" fill="#1d4ed8" text-anchor="middle">Block switchboard</text><text x="175.0" y="186.8" font-size="9.5" font-weight="400" fill="#172b3a" text-anchor="middle">B2-DH3-MSB-A1</text><text x="175.0" y="199.6" font-size="9.5" font-weight="400" fill="#172b3a" text-anchor="middle">Type 1+2, 4-pole</text><text x="175.0" y="212.4" font-size="9.5" font-weight="400" fill="#172b3a" text-anchor="middle">Iimp 25 kA/pole, Up 1.5 kV</text><text x="500.0" y="173.9" font-size="11.5" font-weight="700" fill="#1d4ed8" text-anchor="middle">Sub-boards, UPS boards</text><text x="500.0" y="186.8" font-size="9.5" font-weight="400" fill="#172b3a" text-anchor="middle">mechanical and UPS</text><text x="500.0" y="199.6" font-size="9.5" font-weight="400" fill="#172b3a" text-anchor="middle">Type 2, In 20 kA</text><text x="500.0" y="212.4" font-size="9.5" font-weight="400" fill="#172b3a" text-anchor="middle">Uc 320 V</text><text x="825.0" y="173.9" font-size="11.5" font-weight="700" fill="#1d4ed8" text-anchor="middle">Equipment</text><text x="825.0" y="186.8" font-size="9.5" font-weight="400" fill="#172b3a" text-anchor="middle">controls, network</text><text x="825.0" y="199.6" font-size="9.5" font-weight="400" fill="#172b3a" text-anchor="middle">Type 3, Uoc per OEM</text><text x="825.0" y="212.4" font-size="9.5" font-weight="400" fill="#172b3a" text-anchor="middle">close to the load</text><text x="40.0" y="128.0" font-size="10.5" font-weight="400" fill="#5b6b78" text-anchor="start">Each SPD is earthed to the local PE bar of its board.</text><text x="45.0" y="400.0" font-size="11" font-weight="700" fill="#172b3a" text-anchor="start">Check</text><text x="305.4" y="400.0" font-size="11" font-weight="700" fill="#172b3a" text-anchor="start">Value</text><text x="652.5" y="400.0" font-size="11" font-weight="700" fill="#172b3a" text-anchor="start">Source</text><text x="45.0" y="422.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">Type 1 impulse current</text><text x="305.4" y="422.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">25 kA/pole LPL I; 12.5 kA/pole LPL III, IV</text><text x="652.5" y="422.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">Schneider guide on IEC 62305-2</text><text x="45.0" y="444.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">Uc for U0 = 240 V</text><text x="305.4" y="444.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">275 V or 320 V devices</text><text x="652.5" y="444.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">IEC 60364-5-53 Table 534.2</text><text x="45.0" y="466.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">Total lead length a + b</text><text x="305.4" y="466.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">≤ 0.5 m, never above 1 m</text><text x="652.5" y="466.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">Hager guide, IEC 60364-5-53</text><text x="45.0" y="488.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">Earth conductor, Type 1</text><text x="305.4" y="488.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">≥ 16 mm² copper</text><text x="652.5" y="488.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">Hager guide, IEC 60364-5-53</text><text x="45.0" y="510.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">Earth conductor, other SPDs</text><text x="305.4" y="510.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">≥ 4 mm² copper or OEM value</text><text x="652.5" y="510.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">Hager guide, IEC 60364-5-53</text><text x="45.0" y="532.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">Short-circuit rating</text><text x="305.4" y="532.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">≥ 58 kA at the block board</text><text x="652.5" y="532.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">section 14.1 example</text><text x="45.0" y="554.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">Remote alarm</text><text x="305.4" y="554.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">in EPMS within 5 s of module removal</text><text x="652.5" y="554.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">project value</text><text x="24.0" y="30.0" font-size="17" font-weight="700" fill="#172b3a" text-anchor="start">F17-6  Surge protection stages in one MSC-1 block: SPD type, rating and wiring limits</text><text x="24.0" y="48.0" font-size="10" font-weight="400" fill="#5b6b78" text-anchor="start">TN-S 230/400 V class system at 415 V · Type 1+2 at the block switchboard, Uc 320 V, Iimp 25 kA per pole (LPL I), Up 1.5 kV · Type 2 at sub-boards, In 20 kA · Type 3 near</text><text x="24.0" y="61.0" font-size="10" font-weight="400" fill="#5b6b78" text-anchor="start">sensitive equipment · total lead length ≤ 0.5 m, never above 1 m</text><text x="32.0" y="597.0" font-size="10" font-weight="700" fill="#2d6a4f" text-anchor="start">WHAT TO PROVE</text><text x="32.0" y="613.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">• Iimp 25 kA per pole matches LPL I; LPL III and IV use 12.5 kA per pole (Schneider guide, RF-17).</text><text x="32.0" y="628.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">• The measured total lead length at B2-DH3-MSB-A1 is 0.45 m after the earth connection was moved.</text><text x="32.0" y="643.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">• Type 1 earth conductors are at least 16 mm² copper; other SPD conductors at least 4 mm² copper.</text><text x="24.0" y="678.0" font-size="10" font-weight="700" fill="#5b6b78" text-anchor="start">LEGEND</text><g transform="translate(38.0 696.0) scale(0.42)"><line x1="-10" y1="0" x2="10" y2="0" stroke="#172b3a" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/><line x1="0" y1="-15" x2="0" y2="0" stroke="#172b3a" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/><line x1="-7" y1="5" x2="7" y2="5" stroke="#172b3a" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/><line x1="-4" y1="10" x2="4" y2="10" stroke="#172b3a" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/><line x1="0.5" y1="15" x2="-0.5" y2="15" stroke="#172b3a" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/></g><text x="58.0" y="700.0" font-size="10" font-weight="400" fill="#172b3a" text-anchor="start">Earth</text><line x1="24" y1="726.0" x2="50" y2="726.0" stroke="#1d4ed8" stroke-width="3"/><text x="56.0" y="730.0" font-size="10" font-weight="400" fill="#172b3a" text-anchor="start">415 V</text><rect x="24" y="744.0" width="952" height="44" rx="0" fill="#f6f8fa" fill-opacity="1" stroke="#5b6b78" stroke-width="1"/><text x="32.0" y="758.0" font-size="11" font-weight="700" fill="#172b3a" text-anchor="start">F17-6  ·  Surge protection stages in one MSC-1 block: SPD type, rating and wiring limits</text><text x="968.0" y="758.0" font-size="10" font-weight="400" fill="#5b6b78" text-anchor="end">Chapter 17 · §17.7.2</text><text x="32.0" y="771.0" font-size="9" font-weight="400" fill="#5b6b78" text-anchor="start">Data Centre Commissioning Field Manual R01 EN · October 2026 · educational reference, not to scale · project and OEM documents govern</text><text x="32.0" y="783.0" font-size="9" font-weight="400" fill="#5b6b78" text-anchor="start">Symbols: QElectroTech EN 60617 and P&amp;ID collections, CC-BY 3.0, native geometry · instrument bubbles per ISA 5.1 · states per IEC 60617 / IEEE C37.2 practice</text></svg>