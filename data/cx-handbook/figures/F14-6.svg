 font-size="11" font-weight="700" fill="#172b3a" text-anchor="start">Applied</text><text x="541.5" y="505.0" font-size="11" font-weight="700" fill="#172b3a" text-anchor="start">Reading (example)</text><text x="731.3" y="505.0" font-size="11" font-weight="700" fill="#172b3a" text-anchor="start">Minimum</text><text x="862.8" y="505.0" font-size="11" font-weight="700" fill="#172b3a" text-anchor="start">Result</text><text x="45.0" y="527.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">L1 to all others and PE</text><text x="337.1" y="527.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">1,000 V DC, 1 min</text><text x="541.5" y="527.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">3.1 GΩ</text><text x="731.3" y="527.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">100 MΩ</text><text x="862.8" y="527.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">pass</text><text x="45.0" y="549.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">L2 to all others and PE</text><text x="337.1" y="549.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">1,000 V DC, 1 min</text><text x="541.5" y="549.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">2.9 GΩ</text><text x="731.3" y="549.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">100 MΩ</text><text x="862.8" y="549.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">pass</text><text x="45.0" y="571.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">L3 to all others and PE</text><text x="337.1" y="571.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">1,000 V DC, 1 min</text><text x="541.5" y="571.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">3.0 GΩ</text><text x="731.3" y="571.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">100 MΩ</text><text x="862.8" y="571.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">pass</text><text x="45.0" y="593.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">N to all others and PE</text><text x="337.1" y="593.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">1,000 V DC, 1 min</text><text x="541.5" y="593.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">2.2 GΩ</text><text x="731.3" y="593.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">100 MΩ</text><text x="862.8" y="593.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">pass</text><text x="45.0" y="615.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">L1 to L2 (between phases)</text><text x="337.1" y="615.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">1,000 V DC, 1 min</text><text x="541.5" y="615.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">above 2 GΩ</text><text x="731.3" y="615.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">100 MΩ</text><text x="862.8" y="615.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">pass</text><text x="24.0" y="30.0" font-size="17" font-weight="700" fill="#172b3a" text-anchor="start">F14-6  Insulation resistance of a 415 V switchboard: connection and readings</text><text x="24.0" y="48.0" font-size="10" font-weight="400" fill="#5b6b78" text-anchor="start">B2-DH3-MSB-A1, 415 V, 4,000 A · 1,000 V DC for 1 min · conductor under test against all other conductors shorted to PE · project minimum 100 MΩ (NETA ATS Table 100.1,</text><text x="24.0" y="61.0" font-size="10" font-weight="400" fill="#5b6b78" text-anchor="start">600 V class) · statutory minimum 1 MΩ (IEC 60364-6)</text><text x="32.0" y="658.0" font-size="10" font-weight="700" fill="#2d6a4f" text-anchor="start">WHAT TO PROVE</text><text x="32.0" y="674.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">• Each of L1, L2, L3 and N reads at least 100 MΩ; the example readings are 2.2 to 3.1 GΩ.</text><text x="32.0" y="689.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">• A reading far below the other phases is investigated even when it is above 100 MΩ.</text><text x="32.0" y="704.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">• Every disconnected device is listed, reconnected after the test and ticked on the record.</text><text x="24.0" y="739.0" font-size="10" font-weight="700" fill="#5b6b78" text-anchor="start">LEGEND</text><line x1="24" y1="761.0" x2="50" y2="761.0" stroke="#1d4ed8" stroke-width="3"/><text x="56.0" y="765.0" font-size="10" font-weight="400" fill="#172b3a" text-anchor="start">415 V</text><rect x="24" y="779.0" width="952" height="44" rx="0" fill="#f6f8fa" fill-opacity="1" stroke="#5b6b78" stroke-width="1"/><text x="32.0" y="793.0" font-size="11" font-weight="700" fill="#172b3a" text-anchor="start">F14-6  ·  Insulation resistance of a 415 V switchboard: connection and readings</text><text x="968.0" y="793.0" font-size="10" font-weight="400" fill="#5b6b78" text-anchor="end">Chapter 14 · §14.4.4</text><text x="32.0" y="806.0" font-size="9" font-weight="400" fill="#5b6b78" text-anchor="start">Data Centre Commissioning Field Manual R01 EN · October 2026 · educational reference, not to scale · project and OEM documents govern</text><text x="32.0" y="818.0" font-size="9" font-weight="400" fill="#5b6b78" text-anchor="start">Symbols: QElectroTech EN 60617 and P&amp;ID collections, CC-BY 3.0, native geometry · instrument bubbles per ISA 5.1 · states per IEC 60617 / IEEE C37.2 practice</text></svg>