"156.7" font-size="12" font-weight="700" fill="#334155" text-anchor="middle">Sensor 13</text><text x="790.0" y="170.2" font-size="10" font-weight="400" fill="#172b3a" text-anchor="middle">MAC 13</text><text x="920.0" y="156.7" font-size="12" font-weight="700" fill="#334155" text-anchor="middle">120 Ω</text><text x="920.0" y="170.2" font-size="10" font-weight="400" fill="#172b3a" text-anchor="middle">end</text><text x="285.0" y="276.7" font-size="12" font-weight="700" fill="#475569" text-anchor="middle">Ohmmeter</text><text x="285.0" y="290.2" font-size="10" font-weight="400" fill="#172b3a" text-anchor="middle">+ to −: 61 Ω</text><text x="400.0" y="290.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">measured at the router end with all trunk devices unpowered</text><text x="45.0" y="375.0" font-size="11" font-weight="700" fill="#172b3a" text-anchor="start">Terminations fitted</text><text x="344.5" y="375.0" font-size="11" font-weight="700" fill="#172b3a" text-anchor="start">Expected reading</text><text x="622.7" y="375.0" font-size="11" font-weight="700" fill="#172b3a" text-anchor="start">Verdict</text><text x="45.0" y="397.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">none</text><text x="344.5" y="397.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">open circuit</text><text x="622.7" y="397.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">fail: fit both ends</text><text x="45.0" y="419.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">one</text><text x="344.5" y="419.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">about 120 Ω</text><text x="622.7" y="419.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">fail: one end missing</text><text x="45.0" y="441.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">two (design)</text><text x="344.5" y="441.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">about 60 Ω</text><text x="622.7" y="441.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">pass</text><text x="45.0" y="463.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">three</text><text x="344.5" y="463.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">about 40 Ω</text><text x="622.7" y="463.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">fail: remove the middle one</text><text x="45.0" y="485.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">Trunk 2302, measured</text><text x="344.5" y="485.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">61 Ω</text><text x="622.7" y="485.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">pass</text><text x="24.0" y="30.0" font-size="17" font-weight="700" fill="#172b3a" text-anchor="start">F22-6  RS-485 termination check on MS/TP trunk 2302</text><text x="24.0" y="48.0" font-size="11" font-weight="400" fill="#5b6b78" text-anchor="start">B2-DH3 network 2302 · 13 rack-row sensors · 120 Ω at each end · devices unpowered · reading across + and − at the router: 61 Ω</text><text x="32.0" y="528.0" font-size="10" font-weight="700" fill="#2d6a4f" text-anchor="start">WHAT TO PROVE</text><text x="32.0" y="544.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">• The reading of 61 Ω matches two 120 Ω terminations in parallel (60 Ω), so the trunk passes.</text><text x="32.0" y="559.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">• A reading of about 40 Ω shows a third termination on a middle device; about 120 Ω shows one end without termination.</text><text x="24.0" y="594.0" font-size="10" font-weight="700" fill="#5b6b78" text-anchor="start">LEGEND</text><line x1="24" y1="616.0" x2="50" y2="616.0" stroke="#334155" stroke-width="3"/><text x="56.0" y="620.0" font-size="10" font-weight="400" fill="#172b3a" text-anchor="start">data / network</text><line x1="150.859375" y1="616.0" x2="176.859375" y2="616.0" stroke="#475569" stroke-width="3"/><text x="182.9" y="620.0" font-size="10" font-weight="400" fill="#172b3a" text-anchor="start">signal / control</text><rect x="24" y="634.0" width="952" height="44" rx="0" fill="#f6f8fa" fill-opacity="1" stroke="#5b6b78" stroke-width="1"/><text x="32.0" y="648.0" font-size="11" font-weight="700" fill="#172b3a" text-anchor="start">F22-6  ·  RS-485 termination check on MS/TP trunk 2302</text><text x="968.0" y="648.0" font-size="10" font-weight="400" fill="#5b6b78" text-anchor="end">Chapter 22 · §22.4.3</text><text x="32.0" y="661.0" font-size="9" font-weight="400" fill="#5b6b78" text-anchor="start">Data Centre Commissioning Field Manual R01 EN · October 2026 · educational reference, not to scale · project and OEM documents govern</text><text x="32.0" y="673.0" font-size="9" font-weight="400" fill="#5b6b78" text-anchor="start">Symbols: QElectroTech EN 60617 and P&amp;ID collections, CC-BY 3.0, native geometry · instrument bubbles per ISA 5.1 · states per IEC 60617 / IEEE C37.2 practice</text></svg>