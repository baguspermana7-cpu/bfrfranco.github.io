a" text-anchor="middle">ACC</text><text x="615.0" y="150.8" font-size="11.5" font-weight="700" fill="#172b3a" text-anchor="middle">ACC, published to main CDE</text><text x="845.0" y="150.8" font-size="11.5" font-weight="700" fill="#172b3a" text-anchor="middle">at each design stage</text><text x="46.0" y="175.2" font-size="11.5" font-weight="400" fill="#172b3a" text-anchor="start">RFI log</text><text x="390.0" y="175.2" font-size="11.5" font-weight="700" fill="#172b3a" text-anchor="middle">Procore</text><text x="615.0" y="175.2" font-size="11.5" font-weight="700" fill="#172b3a" text-anchor="middle">Procore</text><text x="845.0" y="175.2" font-size="11.5" font-weight="700" fill="#172b3a" text-anchor="middle">weekly log export</text><text x="46.0" y="199.6" font-size="11.5" font-weight="400" fill="#172b3a" text-anchor="start">Submittal log</text><text x="390.0" y="199.6" font-size="11.5" font-weight="700" fill="#172b3a" text-anchor="middle">Procore</text><text x="615.0" y="199.6" font-size="11.5" font-weight="700" fill="#172b3a" text-anchor="middle">Procore</text><text x="845.0" y="199.6" font-size="11.5" font-weight="700" fill="#172b3a" text-anchor="middle">review code with the document</text><text x="46.0" y="224.0" font-size="11.5" font-weight="400" fill="#172b3a" text-anchor="start">Test script, draft comments</text><text x="390.0" y="224.0" font-size="11.5" font-weight="700" fill="#172b3a" text-anchor="middle">Bluebeam Studio session</text><text x="615.0" y="224.0" font-size="11.5" font-weight="700" fill="#172b3a" text-anchor="middle">main CDE (comment sheet)</text><text x="845.0" y="224.0" font-size="11.5" font-weight="700" fill="#172b3a" text-anchor="middle">session report</text><text x="46.0" y="248.3" font-size="11.5" font-weight="400" fill="#172b3a" text-anchor="start">Approved test script</text><text x="390.0" y="248.3" font-size="11.5" font-weight="700" fill="#172b3a" text-anchor="middle">main CDE workflow</text><text x="615.0" y="248.3" font-size="11.5" font-weight="700" fill="#172b3a" text-anchor="middle">main CDE, status A</text><text x="845.0" y="248.3" font-size="11.5" font-weight="700" fill="#172b3a" text-anchor="middle">not needed</text><text x="46.0" y="272.7" font-size="11.5" font-weight="400" fill="#172b3a" text-anchor="start">Executed checklists and tests</text><text x="390.0" y="272.7" font-size="11.5" font-weight="700" fill="#172b3a" text-anchor="middle">CxAlloy (offline in the field)</text><text x="615.0" y="272.7" font-size="11.5" font-weight="700" fill="#172b3a" text-anchor="middle">CxAlloy</text><text x="845.0" y="272.7" font-size="11.5" font-weight="700" fill="#172b3a" text-anchor="middle">PDF and native at each level</text><text x="46.0" y="297.1" font-size="11.5" font-weight="400" fill="#172b3a" text-anchor="start">Cx issues log</text><text x="390.0" y="297.1" font-size="11.5" font-weight="700" fill="#172b3a" text-anchor="middle">CxAlloy</text><text x="615.0" y="297.1" font-size="11.5" font-weight="700" fill="#172b3a" text-anchor="middle">CxAlloy</text><text x="845.0" y="297.1" font-size="11.5" font-weight="700" fill="#172b3a" text-anchor="middle">weekly export at S2</text><text x="46.0" y="321.5" font-size="11.5" font-weight="400" fill="#172b3a" text-anchor="start">Redline sessions</text><text x="390.0" y="321.5" font-size="11.5" font-weight="700" fill="#172b3a" text-anchor="middle">Bluebeam Studio session</text><text x="615.0" y="321.5" font-size="11.5" font-weight="700" fill="#172b3a" text-anchor="middle">master redline set</text><text x="845.0" y="321.5" font-size="11.5" font-weight="700" fill="#172b3a" text-anchor="middle">at each milestone</text><text x="46.0" y="345.9" font-size="11.5" font-weight="400" fill="#172b3a" text-anchor="start">Transmittals and letters</text><text x="390.0" y="345.9" font-size="11.5" font-weight="700" fill="#172b3a" text-anchor="middle">main CDE</text><text x="615.0" y="345.9" font-size="11.5" font-weight="700" fill="#172b3a" text-anchor="middle">main CDE</text><text x="845.0" y="345.9" font-size="11.5" font-weight="700" fill="#172b3a" text-anchor="middle">not needed</text><text x="46.0" y="370.2" font-size="11.5" font-weight="400" fill="#172b3a" text-anchor="start">As-built CR records</text><text x="390.0" y="370.2" font-size="11.5" font-weight="700" fill="#172b3a" text-anchor="middle">authoring tool</text><text x="615.0" y="370.2" font-size="11.5" font-weight="700" fill="#172b3a" text-anchor="middle">main CDE, status CR</text><text x="845.0" y="370.2" font-size="11.5" font-weight="700" fill="#172b3a" text-anchor="middle">transferred to operations CDE</text><text x="50.0" y="416.0" font-size="11.5" font-weight="700" fill="#b7791f" text-anchor="start">Integration rules (04.11.2)</text><text x="50.0" y="432.1" font-size="11.5" font-weight="400" fill="#172b3a" text-anchor="start">The seven-field identifier and the asset tag are the same in every tool. All tools use UTC+7 and one working-day calendar, so due dates match.</text><text x="24.0" y="30.0" font-size="17" font-weight="700" fill="#172b3a" text-anchor="start">F04-6  Which tool holds the record for each document class</text><text x="24.0" y="48.0" font-size="10" font-weight="400" fill="#5b6b78" text-anchor="start">example configuration: main CDE Oracle Aconex · RFIs and submittals in Procore · design in ACC · Cx records in CxAlloy · mark-up in Bluebeam Studio · exports at each Cx</text><text x="24.0" y="61.0" font-size="10" font-weight="400" fill="#5b6b78" text-anchor="start">level milestone</text><text x="32.0" y="483.0" font-size="10" font-weight="700" fill="#2d6a4f" text-anchor="start">WHAT TO PROVE</text><text x="32.0" y="499.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">• An approved test script and its review code live in the main CDE; the executed record lives in CxAlloy with a link to the script identifier and revision.</text><text x="32.0" y="514.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">• CxAlloy records are exported as PDF and native data at each Cx level milestone and uploaded to the main CDE under type RP and role CX.</text><rect x="24" y="546.9549999999999" width="952" height="44" rx="0" fill="#f6f8fa" fill-opacity="1" stroke="#5b6b78" stroke-width="1"/><text x="32.0" y="561.0" font-size="11" font-weight="700" fill="#172b3a" text-anchor="start">F04-6  ·  Which tool holds the record for each document class</text><text x="968.0" y="561.0" font-size="10" font-weight="400" fill="#5b6b78" text-anchor="end">Chapter 04 · §04.11.1</text><text x="32.0" y="574.0" font-size="9" font-weight="400" fill="#5b6b78" text-anchor="start">Data Centre Commissioning Field Manual R01 EN · October 2026 · educational reference, not to scale · project and OEM documents govern</text><text x="32.0" y="586.0" font-size="9" font-weight="400" fill="#5b6b78" text-anchor="start">Symbols: QElectroTech EN 60617 and P&amp;ID collections, CC-BY 3.0, native geometry · instrument bubbles per ISA 5.1 · states per IEC 60617 / IEEE C37.2 practice</text></svg>