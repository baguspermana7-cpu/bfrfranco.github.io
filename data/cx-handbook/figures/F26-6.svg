5.0" cy="395.8" r="4" fill="#b7791f"/><text x="24.0" y="30.0" font-size="17" font-weight="700" fill="#172b3a" text-anchor="start">F26-6  OTDR trace at 1550 nm of the 1.20 km OS2 link with 500 m launch and tail cords, and the event table</text><text x="24.0" y="48.0" font-size="11" font-weight="400" fill="#5b6b78" text-anchor="start">pulse 30 ns · range 5 km · averaging 30 s · events: E1 near-end connector 0.32 dB · E2 splice 0.06 dB · E3 splice reads -0.06 dB (gainer) · E4 bend 0.45 dB at 1550 nm, 0.12 dB at 1310 nm · E5 far-end connector 0.30 dB · ghost at 3.40 km</text><text x="32.0" y="587.0" font-size="10" font-weight="700" fill="#2d6a4f" text-anchor="start">WHAT TO PROVE</text><text x="32.0" y="603.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">• E3 reads -0.06 dB from end A and +0.18 dB from end B: the bidirectional average 0.06 dB is the splice loss, inside 0.3 dB.</text><text x="32.0" y="618.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">• E4 loses 0.45 dB at 1550 nm and 0.12 dB at 1310 nm: loss rising with wavelength means a bend; the fix is in the tray at 1.00 km of link (1.50 km on the trace), not a new splice.</text><rect x="24" y="651" width="1352" height="44" rx="0" fill="#f6f8fa" fill-opacity="1" stroke="#5b6b78" stroke-width="1"/><text x="32.0" y="665.0" font-size="11" font-weight="700" fill="#172b3a" text-anchor="start">F26-6  ·  OTDR trace at 1550 nm of the 1.20 km OS2 link with 500 m launch and tail cords, and the event table</text><text x="1368.0" y="665.0" font-size="10" font-weight="400" fill="#5b6b78" text-anchor="end">Chapter 26 · §26.9</text><text x="32.0" y="678.0" font-size="9" font-weight="400" fill="#5b6b78" text-anchor="start">Data Centre Commissioning Field Manual R01 EN · October 2026 · educational reference, not to scale · project and OEM documents govern</text><text x="32.0" y="690.0" font-size="9" font-weight="400" fill="#5b6b78" text-anchor="start">Symbols: QElectroTech EN 60617 and 