meeting; week 28 first-pass yield for tray earthing 97 %.</text><text x="24.0" y="30.0" font-size="17" font-weight="700" fill="#172b3a" text-anchor="start">F07-7  Weekly IR report, building B2 electrical, week 27 of 2026</text><text x="24.0" y="48.0" font-size="11" font-weight="400" fill="#5b6b78" text-anchor="start">138 IRs submitted · 6 cancelled late (4.3 %) · 132 inspected · 116 released at first inspection · first-pass yield 87.9 % against 90 %</text><text x="32.0" y="480.6" font-size="10" font-weight="700" fill="#2d6a4f" text-anchor="start">WHAT TO PROVE</text><text x="32.0" y="496.6" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">• First-pass yield = 116 / 132 = 87.9 %, below the 90 % target; the cancellation rate 4.3 % meets the 5 % limit.</text><text x="32.0" y="511.6" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">• 12 of the 16 rejections are on cable tray earth bonding; CAR-B2-ELE-0011 adds a bonding-jumper check, and tray earthing reaches 97 % in week 28.</text><text x="24.0" y="546.6" font-size="10" font-weight="700" fill="#5b6b78" text-anchor="start">LEGEND</text><line x1="24" y1="568.6" x2="50" y2="568.6" stroke="#334155" stroke-width="3"/><text x="56.0" y="572.6" font-size="10" font-weight="400" fill="#172b3a" text-anchor="start">data / network</text><rect x="24" y="586.6" width="952" height="44" rx="0" fill="#f6f8fa" fill-opacity="1" stroke="#5b6b78" stroke-width="1"/><text x="32.0" y="600.6" font-size="11" font-weight="700" fill="#172b3a" text-anchor="start">F07-7  ·  Weekly IR report, building B2 electrical, week 27 of 2026</text><text x="968.0" y="600.6" font-size="10" font-weight="400" fill="#5b6b78" text-anchor="end">Chapter 07 · §07.13.2</text><text x="32.0" y="613.6" font-size="9" font-weight="400" fill="#5b6b78" text-anchor="start">Data Centre Commissioning Field Manual R01 EN · October 2026 · educational reference, not to scale · project and OEM documents govern</text><text x="32.0" y="625.6" font-