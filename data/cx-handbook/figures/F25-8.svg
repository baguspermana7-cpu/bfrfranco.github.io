idth="230.0" height="22.0" rx="0" fill="#ffffff" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><rect x="270.0" y="402.0" width="300.7692307692308" height="22.0" rx="0" fill="#ffffff" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><rect x="570.7692307692307" y="402.0" width="389.2307692307693" height="22.0" rx="0" fill="#ffffff" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><rect x="40" y="424.0" width="230.0" height="22.0" rx="0" fill="#ffffff" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><rect x="270.0" y="424.0" width="300.7692307692308" height="22.0" rx="0" fill="#ffffff" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><rect x="570.7692307692307" y="424.0" width="389.2307692307693" height="22.0" rx="0" fill="#ffffff" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><rect x="40" y="446.0" width="230.0" height="22.0" rx="0" fill="#ffffff" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><rect x="270.0" y="446.0" width="300.7692307692308" height="22.0" rx="0" fill="#ffffff" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><rect x="570.7692307692307" y="446.0" width="389.2307692307693" height="22.0" rx="0" fill="#ffffff" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><rect x="40" y="468.0" width="230.0" height="22.0" rx="0" fill="#ffffff" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><rect x="270.0" y="468.0" width="300.7692307692308" height="22.0" rx="0" fill="#ffffff" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><rect x="570.7692307692307" y="468.0" width="389.2307692307693" height="22.0" rx="0" fill="#ffffff" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><rect x="40" y="490.0" width="230.0" height="22.0" rx="0" fill="#ffffff" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><rect x="270.0" y="490.0" width="300.7692307692308" height="22.0" rx="0" fill="#ffffff" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><rect x="570.7692307692307" y="490.0" width="389.2307692307693" height="22.0" rx="0" fill="#ffffff" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><rect x="40" y="512.0" width="230.0" height="22.0" rx="0" fill="#ffffff" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><rect x="270.0" y="512.0" width="300.7692307692308" height="22.0" rx="0" fill="#ffffff" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><rect x="570.7692307692307" y="512.0" width="389.2307692307693" height="22.0" rx="0" fill="#ffffff" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><text x="170.0" y="152.7" font-size="11" font-weight="700" fill="#b91c1c" text-anchor="middle">Detector in test mode</text><text x="170.0" y="164.8" font-size="9" font-weight="400" fill="#172b3a" text-anchor="middle">B2 loop 3, tester 1</text><text x="170.0" y="177.0" font-size="9" font-weight="400" fill="#172b3a" text-anchor="middle">operates the real device</text><text x="170.0" y="262.6" font-size="11" font-weight="700" fill="#475569" text-anchor="middle">OM-3-17</text><text x="170.0" y="274.8" font-size="9" font-weight="400" fill="#172b3a" text-anchor="middle">output module</text><text x="316.0" y="244.0" font-size="10" font-weight="400" fill="#5b6b78" text-anchor="start">NC, 2 A 30 V DC</text><text x="685.0" y="191.9" font-size="11" font-weight="700" fill="#b91c1c" text-anchor="middle">X2:21-22</text><text x="685.0" y="204.0" font-size="9" font-weight="400" fill="#172b3a" text-anchor="middle">boundary terminal</text><text x="424.0" y="222.0" font-size="10" font-weight="400" fill="#5b6b78" text-anchor="start">2-core cable, contact in series</text><text x="424.0" y="236.0" font-size="10" font-weight="400" fill="#5b6b78" text-anchor="start">with input X2:21-22</text><text x="470.0" y="192.0" font-size="11" font-weight="700" fill="#475569" text-anchor="middle">24.1 V DC</text><text x="870.0" y="162.7" font-size="11" font-weight="700" fill="#475569" text-anchor="middle">Fan stop logic</text><text x="870.0" y="174.8" font-size="9" font-weight="400" fill="#172b3a" text-anchor="middle">CRAH OEM</text><text x="870.0" y="187.0" font-size="9" font-weight="400" fill="#172b3a" text-anchor="middle">fans stop 2.4 s</text><text x="775.0" y="282.6" font-size="11" font-weight="700" fill="#334155" text-anchor="middle">Tester 2 at the receiver</text><text x="775.0" y="294.8" font-size="9" font-weight="400" fill="#172b3a" text-anchor="middle">records fan stop and its time</text><text x="775.0" y="306.9" font-size="9" font-weight="400" fill="#172b3a" text-anchor="middle">checks reset: FACP reset + BMS enable</text><text x="45.0" y="395.0" font-size="11" font-weight="700" fill="#172b3a" text-anchor="start">Step (25.10.1)</text><text x="275.0" y="395.0" font-size="11" font-weight="700" fill="#172b3a" text-anchor="start">Check</text><text x="575.8" y="395.0" font-size="11" font-weight="700" fill="#172b3a" text-anchor="start">Recorded value</text><text x="45.0" y="417.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">1 Contact rating</text><text x="275.0" y="417.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">circuit inside both ratings</text><text x="575.8" y="417.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">24.1 V DC; contact 2 A at 30 V DC</text><text x="45.0" y="439.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">2 Contact type</text><text x="275.0" y="439.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">NC, opens on alarm</text><text x="575.8" y="439.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">as ICD-25-042</text><text x="45.0" y="461.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">3 Operate at source</text><text x="275.0" y="461.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">detector in test mode</text><text x="575.8" y="461.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">no jumper at X2:21-22</text><text x="45.0" y="483.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">4 Observe at receiver</text><text x="275.0" y="483.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">fans stop</text><text x="575.8" y="483.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">2.4 s after the alarm</text><text x="45.0" y="505.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">5 Wire break</text><text x="275.0" y="505.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">fault shown where supervised</text><text x="575.8" y="505.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">recorded on the FACP</text><text x="45.0" y="527.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">6 Reset</text><text x="275.0" y="527.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">no restart before reset rule</text><text x="575.8" y="527.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">FACP reset, then BMS enable</text><rect x="328.931484375" y="172.0" width="22.13703125" height="14" rx="3" fill="#2d6a4f" fill-opacity="1" stroke="#2d6a4f" stroke-width="1.4"/><text x="340.0" y="182.5" font-size="9" font-weight="700" fill="#ffffff" text-anchor="middle">NC</text><text x="24.0" y="30.0" font-size="17" font-weight="700" fill="#172b3a" text-anchor="start">F25-8  Hardwired interface test of IF-042: FACP contact to the CRAH 11 fan stop</text><text x="24.0" y="48.0" font-size="10" font-weight="400" fill="#5b6b78" text-anchor="start">NC contact OM-3-17 rated 2 A at 30 V DC · circuit 24.1 V DC measured · fans stopped 2.4 s after the alarm · operate from the real source, no jumper at X2:21-22 · restart</text><text x="24.0" y="61.0" font-size="10" font-weight="400" fill="#5b6b78" text-anchor="start">only after FACP reset and BMS enable</text><text x="32.0" y="570.0" font-size="10" font-weight="700" fill="#2d6a4f" text-anchor="start">WHAT TO PROVE</text><text x="32.0" y="586.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">• The circuit voltage of 24.1 V DC is inside the 30 V DC contact rating and the receiving input rating, so step 1 passes.</text><text x="32.0" y="601.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">• The contact is normally closed and opens on alarm, so a broken wire also stops the fans, which is the safe state for this interface.</text><text x="32.0" y="616.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">• The fans stopped 2.4 s after the alarm and restarted only after the FACP reset and the BMS enable, as the cause-and-effect matrix requires.</text><text x="24.0" y="651.0" font-size="10" font-weight="700" fill="#5b6b78" text-anchor="start">LEGEND</text><g transform="translate(39.2 672.0) scale(0.3)"><line x1="0" y1="-20" x2="0" y2="-40" stroke="#172b3a" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/><line x1="0" y1="0" x2="0" y2="20" stroke="#172b3a" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/><line x1="0" y1="0" x2="-8" y2="-23" stroke="#172b3a" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/></g><text x="58.0" y="673.0" font-size="10" font-weight="400" fill="#172b3a" text-anchor="start">Contact / switch</text><line x1="24" y1="699.0" x2="50" y2="699.0" stroke="#475569" stroke-width="3"/><text x="56.0" y="703.0" font-size="10" font-weight="400" fill="#172b3a" text-anchor="start">signal / control</text><line x1="151.9671875" y1="699.0" x2="177.9671875" y2="699.0" stroke="#b91c1c" stroke-width="3"/><text x="184.0" y="703.0" font-size="10" font-weight="400" fill="#172b3a" text-anchor="start">trip / protection</text><line x1="283.934375" y1="699.0" x2="309.934375" y2="699.0" stroke="#334155" stroke-width="3"/><text x="315.9" y="703.0" font-size="10" font-weight="400" fill="#172b3a" text-anchor="start">data / network</text><rect x="24" y="713.0" width="22.13703125" height="14" rx="3" fill="#2d6a4f" fill-opacity="1" stroke="#2d6a4f" stroke-width="1.4"/><text x="35.1" y="723.5" font-size="9" font-weight="700" fill="#ffffff" text-anchor="middle">NC</text><text x="52.1" y="724.0" font-size="10" font-weight="400" fill="#172b3a" text-anchor="start">normally closed</text><rect x="24" y="739.0" width="952" height="44" rx="0" fill="#f6f8fa" fill-opacity="1" stroke="#5b6b78" stroke-width="1"/><text x="32.0" y="753.0" font-size="11" font-weight="700" fill="#172b3a" text-anchor="start">F25-8  ·  Hardwired interface test of IF-042: FACP contact to the CRAH 11 fan stop</text><text x="968.0" y="753.0" font-size="10" font-weight="400" fill="#5b6b78" text-anchor="end">Chapter 25 · §25.10</text><text x="32.0" y="766.0" font-size="9" font-weight="400" fill="#5b6b78" text-anchor="start">Data Centre Commissioning Field Manual R01 EN · October 2026 · educational reference, not to scale · project and OEM documents govern</text><text x="32.0" y="778.0" font-size="9" font-weight="400" fill="#5b6b78" text-anchor="start">Symbols: QElectroTech EN 60617 and P&amp;ID collections, CC-BY 3.0, native geometry · instrument bubbles per ISA 5.1 · states per IEC 60617 / IEEE C37.2 practice</text></svg>