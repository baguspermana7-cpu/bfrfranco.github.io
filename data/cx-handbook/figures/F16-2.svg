" font-weight="400" fill="#172b3a" text-anchor="start">Rated time</text><text x="1192.2" y="201.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">15.0 min</text><text x="1005.0" y="223.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">Test 1 time</text><text x="1192.2" y="223.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">14.1 min</text><text x="1005.0" y="245.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">Test 1 capacity</text><text x="1192.2" y="245.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">94 %</text><text x="1005.0" y="267.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">Test 2 time</text><text x="1192.2" y="267.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">15.4 min</text><text x="1005.0" y="289.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">Test 2 capacity</text><text x="1192.2" y="289.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">103 %</text><text x="1005.0" y="311.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">Cell temperature</text><text x="1192.2" y="311.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">25.0 °C</text><circle cx="790.1" cy="440.9" r="4" fill="#b7791f"/><circle cx="640.6" cy="440.9" r="4" fill="#b7791f"/><circle cx="852.8" cy="440.9" r="4" fill="#b7791f"/><text x="24.0" y="30.0" font-size="17" font-weight="700" fill="#172b3a" text-anchor="start">F16-2  VRLA capacity test of string B2-DH3-BAT-B1-S2: average cell voltage and the weak monobloc</text><text x="24.0" y="48.0" font-size="11" font-weight="400" fill="#5b6b78" text-anchor="start">240 cells, 283.2 kW constant power, rating 15 min to 1.67 V per cell at 25 °C · test 1: 14 min 6 s = 94 %, monobloc 23 at 1.67 V per cell at 11 min · test 2 after replacement: 15 min 24 s = 103 %</text><text x="32.0" y="642.0" font-size="10" font-weight="700" fill="#2d6a4f" text-anchor="start">WHAT TO PROVE</text><text x="32.0" y="658.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">• Capacity = actual time / rated time: 14.1 / 15.0 = 94 % (fail at acceptance), 15.4 / 15.0 = 103 % (pass).</text><text x="32.0" y="673.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">• String end voltage 1.67 V x 240 cells = 400.8 V; replace the battery in service when capacity falls to 80 % (IEEE 450 and IEEE 1188).</text><rect x="24" y="706" width="1352" height="44" rx="0" fill="#f6f8fa" fill-opacity="1" stroke="#5b6b78" stroke-width="1"/><text x="32.0" y="720.0" font-size="11" font-weight="700" fill="#172b3a" text-anchor="start">F16-2  ·  VRLA capacity test of string B2-DH3-BAT-B1-S2: average cell voltage and the weak monobloc</text><text x="1368.0" y="720.0" font-size="10" font-weight="400" fill="#5b6b78" text-anchor="end">Chapter 16 · §16.7</text><text x="32.0" y="733.0" font-size="9" font-weight="400" fill="#5b6b78" text-anchor="start">Data Centre Commissioning Field Manual R01 EN · October 2026 · educational reference, not to scale · project and OEM documents govern</text><text x="32.0" y="745.0" font-size="9" font-weight="400" fill="#5b6b78" text-anchor="start">Symbols: QElectroTech EN 60617 and P&amp;ID collections, CC-BY 3.0, native geometry · instrument bubbles per ISA 5.1 · states per IEC 60617 / IEEE C37.2 practice</text></svg>