troke-width="0.8"/><rect x="40" y="621.9000000000001" width="920" height="73.05000000000001" rx="4" fill="#fffbe6" fill-opacity="1" stroke="#b7791f" stroke-width="1.2"/><text x="180.0" y="113.8" font-size="12" font-weight="700" fill="#334155" text-anchor="middle">Device alarms</text><text x="180.0" y="127.3" font-size="10" font-weight="400" fill="#172b3a" text-anchor="middle">set in the meter, relay or trip unit</text><text x="180.0" y="140.8" font-size="10" font-weight="400" fill="#172b3a" text-anchor="middle">LV main trip, UPS on battery</text><text x="490.0" y="113.8" font-size="12" font-weight="700" fill="#334155" text-anchor="middle">PME software alarms</text><text x="490.0" y="127.3" font-size="10" font-weight="400" fill="#172b3a" text-anchor="middle">set in PME on real-time values</text><text x="490.0" y="140.8" font-size="10" font-weight="400" fill="#172b3a" text-anchor="middle">transformer above 90 % load</text><text x="800.0" y="113.8" font-size="12" font-weight="700" fill="#334155" text-anchor="middle">System alarms</text><text x="800.0" y="127.3" font-size="10" font-weight="400" fill="#172b3a" text-anchor="middle">EPMS health</text><text x="800.0" y="140.8" font-size="10" font-weight="400" fill="#172b3a" text-anchor="middle">device offline, service stopped</text><text x="490.0" y="225.6" font-size="12" font-weight="700" fill="#475569" text-anchor="middle">PME Alarms application: rules applied to every alarm</text><text x="490.0" y="239.1" font-size="10" font-weight="400" fill="#172b3a" text-anchor="middle">delay: 5 min on device communication loss; 0 s on trips</text><text x="490.0" y="252.6" font-size="10" font-weight="400" fill="#172b3a" text-anchor="middle">hysteresis: overload alarm on at 90 %, clears at 85 %</text><text x="490.0" y="266.1" font-size="10" font-weight="400" fill="#172b3a" text-anchor="middle">event clustering: one trip seen by three devices = one alarm</text><text x="490.0" y="279.6" font-size="10" font-weight="400" fill="#172b3a" text-anchor="middle">rate target: no more than 10 alarms in 10 min per operator</text><text x="122.0" y="360.4" font-size="12" font-weight="700" fill="#b91c1c" text-anchor="middle">1 Critical</text><text x="122.0" y="373.9" font-size="10" font-weight="400" fill="#172b3a" text-anchor="middle">loss of a power path</text><text x="122.0" y="387.4" font-size="10" font-weight="400" fill="#172b3a" text-anchor="middle">response: immediate</text><text x="122.0" y="400.9" font-size="10" font-weight="400" fill="#172b3a" text-anchor="middle">Alarms, BMS, SMS</text><text x="306.0" y="360.4" font-size="12" font-weight="700" fill="#475569" text-anchor="middle">2 High</text><text x="306.0" y="373.9" font-size="10" font-weight="400" fill="#172b3a" text-anchor="middle">redundancy reduced</text><text x="306.0" y="387.4" font-size="10" font-weight="400" fill="#172b3a" text-anchor="middle">response: 15 min</text><text x="306.0" y="400.9" font-size="10" font-weight="400" fill="#172b3a" text-anchor="middle">Alarms, BMS, email</text><text x="490.0" y="360.4" font-size="12" font-weight="700" fill="#475569" text-anchor="middle">3 Medium</text><text x="490.0" y="373.9" font-size="10" font-weight="400" fill="#172b3a" text-anchor="middle">needs attention</text><text x="490.0" y="387.4" font-size="10" font-weight="400" fill="#172b3a" text-anchor="middle">response: 4 h</text><text x="490.0" y="400.9" font-size="10" font-weight="400" fill="#172b3a" text-anchor="middle">Alarms, email</text><text x="674.0" y="360.4" font-size="12" font-weight="700" fill="#475569" text-anchor="middle">4 Low</text><text x="674.0" y="373.9" font-size="10" font-weight="400" fill="#172b3a" text-anchor="middle">information only</text><text x="674.0" y="387.4" font-size="10" font-weight="400" fill="#172b3a" text-anchor="middle">next working day</text><text x="674.0" y="400.9" font-size="10" font-weight="400" fill="#172b3a" text-anchor="middle">Alarms only</text><text x="858.0" y="360.4" font-size="12" font-weight="700" fill="#334155" text-anchor="middle">System</text><text x="858.0" y="373.9" font-size="10" font-weight="400" fill="#172b3a" text-anchor="middle">EPMS health</text><text x="858.0" y="387.4" font-size="10" font-weight="400" fill="#172b3a" text-anchor="middle">response: 1 h</text><text x="858.0" y="400.9" font-size="10" font-weight="400" fill="#172b3a" text-anchor="middle">email to EPMS admin</text><text x="45.0" y="462.9" font-size="11" font-weight="700" fill="#172b3a" text-anchor="start">Alarm field</text><text x="275.0" y="462.9" font-size="11" font-weight="700" fill="#172b3a" text-anchor="start">Filled value for alarm B2-EPMS-ALM-0142 (23.10.4)</text><text x="45.0" y="484.9" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">Device</text><text x="275.0" y="484.9" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">B2_ER2.LVMSB_A1_MAIN</text><text x="45.0" y="506.9" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">Condition</text><text x="275.0" y="506.9" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">breaker tripped (MicroLogic X trip cause)</text><text x="45.0" y="528.9" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">Priority and delay</text><text x="275.0" y="528.9" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">1, delay 0 s, no hysteresis</text><text x="45.0" y="550.9" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">Notification</text><text x="275.0" y="550.9" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">Alarms; BMS point B2.EPMS.LVMSB_A1.TRIP; SMS group B2-ELEC</text><text x="45.0" y="572.9" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">Operator action</text><text x="275.0" y="572.9" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">check the trip cause, follow EOP-ELEC-04</text><text x="45.0" y="594.9" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">Tested</text><text x="275.0" y="594.9" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">2026-11-18, record ATR-B2-0142</text><text x="50.0" y="635.1" font-size="11" font-weight="700" fill="#b7791f" text-anchor="start">Flood test result (chapter 24.9.1, building B2, simulated utility loss)</text><text x="50.0" y="650.5" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">412 events in 10 min: 24 priority 1 (block main transfers), 34 priority 2 (17 generator starts and 17 generator breaker closes), 120 priority 4 PQ sags and 234</text><text x="50.0" y="665.4" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">events logged without alarm.</text><text x="50.0" y="680.2" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">Event clustering turned the 120 PQ alarms into one PQ event with 120 device records; the 24 critical alarms fitted on one operator screen.</text><text x="24.0" y="30.0" font-size="17" font-weight="700" fill="#172b3a" text-anchor="start">F23-8  EPMS alarm path in PME: three sources, four rules, five priority classes</text><text x="24.0" y="48.0" font-size="10" font-weight="400" fill="#5b6b78" text-anchor="start">communication-loss delay 5 min, trips 0 s · overload on at 90 %, clear at 85 % · one alarm per trip by event clustering · response: immediate, 15 min, 4 h, next working</text><text x="24.0" y="61.0" font-size="10" font-weight="400" fill="#5b6b78" text-anchor="start">day, 1 h</text><text x="32.0" y="731.0" font-size="10" font-weight="700" fill="#2d6a4f" text-anchor="start">WHAT TO PROVE</text><text x="32.0" y="747.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">• A breaker trip seen by the trip unit, the relay and the meter gives one priority 1 alarm, because event clustering groups events from devices with synchronised</text><text x="32.0" y="762.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">clocks.</text><text x="32.0" y="777.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">• The 5-minute delay on communication loss is longer than the 640 ms worst ring recovery of chapter 26.13.2, so a ring failover raises no system alarm.</text><text x="32.0" y="792.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">• In the flood test of chapter 24.9.1, 412 events in 10 minutes gave 24 priority 1 alarms on one screen and one clustered PQ event.</text><text x="24.0" y="827.0" font-size="10" font-weight="700" fill="#5b6b78" text-anchor="start">LEGEND</text><line x1="24" y1="848.95" x2="50" y2="848.95" stroke="#334155" stroke-width="3"/><text x="56.0" y="853.0" font-size="10" font-weight="400" fill="#172b3a" text-anchor="start">data / network</text><line x1="150.859375" y1="848.95" x2="176.859375" y2="848.95" stroke="#475569" stroke-width="3"/><text x="182.9" y="853.0" font-size="10" font-weight="400" fill="#172b3a" text-anchor="start">signal / control</text><line x1="278.8265625" y1="848.95" x2="304.8265625" y2="848.95" stroke="#b91c1c" stroke-width="3"/><text x="310.8" y="853.0" font-size="10" font-weight="400" fill="#172b3a" text-anchor="start">trip / protection</text><rect x="24" y="866.95" width="952" height="44" rx="0" fill="#f6f8fa" fill-opacity="1" stroke="#5b6b78" stroke-width="1"/><text x="32.0" y="881.0" font-size="11" font-weight="700" fill="#172b3a" text-anchor="start">F23-8  ·  EPMS alarm path in PME: three sources, four rules, five priority classes</text><text x="968.0" y="881.0" font-size="10" font-weight="400" fill="#5b6b78" text-anchor="end">Chapter 23 · §23.10.1</text><text x="32.0" y="894.0" font-size="9" font-weight="400" fill="#5b6b78" text-anchor="start">Data Centre Commissioning Field Manual R01 EN · October 2026 · educational reference, not to scale · project and OEM documents govern</text><text x="32.0" y="906.0" font-size="9" font-weight="400" fill="#5b6b78" text-anchor="start">Symbols: QElectroTech EN 60617 and P&amp;ID collections, CC-BY 3.0, 