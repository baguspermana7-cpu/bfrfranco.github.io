 fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><rect x="406.6666666666667" y="536.0" width="476.66666666666674" height="22.0" rx="0" fill="#ffffff" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><rect x="883.3333333333335" y="536.0" width="476.66666666666674" height="22.0" rx="0" fill="#ffffff" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><rect x="60" y="558.0" width="346.6666666666667" height="22.0" rx="0" fill="#ffffff" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><rect x="406.6666666666667" y="558.0" width="476.66666666666674" height="22.0" rx="0" fill="#ffffff" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><rect x="883.3333333333335" y="558.0" width="476.66666666666674" height="22.0" rx="0" fill="#ffffff" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><text x="210.0" y="133.8" font-size="12" font-weight="700" fill="#172b3a" text-anchor="middle">Normal</text><text x="210.0" y="147.3" font-size="10" font-weight="400" fill="#172b3a" text-anchor="middle">primary active</text><text x="210.0" y="160.8" font-size="10" font-weight="400" fill="#172b3a" text-anchor="middle">standby synchronised</text><text x="660.0" y="133.8" font-size="12" font-weight="700" fill="#172b3a" text-anchor="middle">Primary failed</text><text x="660.0" y="147.3" font-size="10" font-weight="400" fill="#172b3a" text-anchor="middle">clients disconnected</text><text x="660.0" y="160.8" font-size="10" font-weight="400" fill="#172b3a" text-anchor="middle">controllers buffer</text><text x="1110.0" y="133.8" font-size="12" font-weight="700" fill="#172b3a" text-anchor="middle">Standby active</text><text x="1110.0" y="147.3" font-size="10" font-weight="400" fill="#172b3a" text-anchor="middle">clients reconnected</text><text x="1110.0" y="160.8" font-size="10" font-weight="400" fill="#172b3a" text-anchor="middle">buffers collected</text><text x="210.0" y="297.8" font-size="12" font-weight="700" fill="#172b3a" text-anchor="middle">Both servers lost</text><text x="210.0" y="311.3" font-size="10" font-weight="400" fill="#172b3a" text-anchor="middle">controllers run locally</text><text x="210.0" y="324.8" font-size="10" font-weight="400" fill="#172b3a" text-anchor="middle">P1 beacon path only</text><text x="660.0" y="297.8" font-size="12" font-weight="700" fill="#172b3a" text-anchor="middle">Normal again</text><text x="660.0" y="311.3" font-size="10" font-weight="400" fill="#172b3a" text-anchor="middle">primary active</text><text x="660.0" y="324.8" font-size="10" font-weight="400" fill="#172b3a" text-anchor="middle">test record signed</text><text x="1110.0" y="297.8" font-size="12" font-weight="700" fill="#172b3a" text-anchor="middle">Failback</text><text x="1110.0" y="311.3" font-size="10" font-weight="400" fill="#172b3a" text-anchor="middle">primary restored</text><text x="1110.0" y="324.8" font-size="10" font-weight="400" fill="#172b3a" text-anchor="middle">history merged</text><text x="65.0" y="485.0" font-size="11" font-weight="700" fill="#172b3a" text-anchor="start">Transition</text><text x="411.7" y="485.0" font-size="11" font-weight="700" fill="#172b3a" text-anchor="start">Test action</text><text x="888.3" y="485.0" font-size="11" font-weight="700" fill="#172b3a" text-anchor="start">Pass condition</text><text x="65.0" y="507.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">Normal → primary failed</text><text x="411.7" y="507.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">remove power or network from the primary host</text><text x="888.3" y="507.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">failure detected; P2 alarm from standby</text><text x="65.0" y="529.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">Primary failed → standby active</text><text x="411.7" y="529.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">wait; record client reconnection time</text><text x="888.3" y="529.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">≤ 60 s; 0 alarms lost; outputs unchanged</text><text x="65.0" y="551.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">Standby active → failback</text><text x="411.7" y="551.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">restore the primary</text><text x="888.3" y="551.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">no duplicate or lost historian data</text><text x="65.0" y="573.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">Any state → both servers lost</text><text x="411.7" y="573.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">shut down both servers (separate test)</text><text x="888.3" y="573.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">controllers keep running; beacon operates on a P1 alarm</text><text x="24.0" y="30.0" font-size="17" font-weight="700" fill="#172b3a" text-anchor="start">F22-5  BMS server failover test: states of the servers and of the controllers</text><text x="24.0" y="48.0" font-size="11" font-weight="400" fill="#5b6b78" text-anchor="start">client reconnection ≤ 60 s · alarms lost 0 · trend samples lost 0 (controller buffers) · no control output changed · independent P1 path operates with both servers lost</text><text x="32.0" y="616.0" font-size="10" font-weight="700" fill="#2d6a4f" text-anchor="start">WHAT TO PROVE</text><text x="32.0" y="632.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">• From &quot;primary failed&quot; the clients must reach &quot;standby active&quot; within 60 s with no alarm lost; the controller trend buffers are collected after reconnection.</text><text x="32.0" y="647.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">• In &quot;both servers lost&quot; the controllers keep running and the hardwired P1 beacon still operates; failback must not duplicate or lose historian data.</text><text x="24.0" y="682.0" font-size="10" font-weight="700" fill="#5b6b78" text-anchor="start">LEGEND</text><line x1="24" y1="704.0" x2="50" y2="704.0" stroke="#b91c1c" stroke-width="3"/><text x="56.0" y="708.0" font-size="10" font-weight="400" fill="#172b3a" text-anchor="start">trip / protection</text><line x1="155.9671875" y1="704.0" x2="181.9671875" y2="704.0" stroke="#475569" stroke-width="3"/><text x="188.0" y="708.0" font-size="10" font-weight="400" fill="#172b3a" text-anchor="start">signal / control</text><rect x="24" y="722.0" width="1352" height="44" rx="0" fill="#f6f8fa" fill-opacity="1" stroke="#5b6b78" stroke-width="1"/><text x="32.0" y="736.0" font-size="11" font-weight="700" fill="#172b3a" text-anchor="start">F22-5  ·  BMS server failover test: states of the servers and of the controllers</text><text x="1368.0" y="736.0" font-size="10" font-weight="400" fill="#5b6b78" text-anchor="end">Chapter 22 · §22.16</text><text x="32.0" y="749.0" font-size="9" font-weight="400" fill="#5b6b78" text-anchor="start">Data Centre Commissioning Field Manual R01 EN · October 2026 · educational reference, not to scale · project and OEM documents govern</text><text x="32.0" y="761.0" font-size="9" font-weight="400" fill="#5b6b78" text-anchor="start">Symbols: QElectroTech EN 60617 and P&amp;ID collections, CC-BY 3.0, native geometry · instrument bubbles per ISA 5.1 · states per IEC 60617 / IEEE C37.2 practice</text></svg>