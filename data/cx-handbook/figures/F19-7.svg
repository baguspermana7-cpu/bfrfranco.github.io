><text x="648.8" y="663.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">1.24</text><text x="821.2" y="663.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">16.40</text><text x="45.0" y="685.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">40</text><text x="188.8" y="685.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">1.08</text><text x="361.2" y="685.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">1.49</text><text x="505.0" y="685.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">150</text><text x="648.8" y="685.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">1.26</text><text x="821.2" y="685.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">23.80</text><text x="45.0" y="707.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">50</text><text x="188.8" y="707.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">1.11</text><text x="361.2" y="707.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">2.47</text><text x="505.0" y="707.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start"></text><text x="648.8" y="707.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start"></text><text x="821.2" y="707.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start"></text><circle cx="370.0" cy="296.7" r="4" fill="#b7791f"/><circle cx="620.0" cy="214.3" r="4" fill="#b7791f"/><text x="24.0" y="30.0" font-size="17" font-weight="700" fill="#172b3a" text-anchor="start">F19-7  Minimum flushing velocity and flow by pipe size for TCS pipework (BSRIA BG 29 via OCP)</text><text x="24.0" y="48.0" font-size="10" font-weight="400" fill="#5b6b78" text-anchor="start">values of BSRIA BG 29 amended 6th edition 2021 p. 50 as reproduced by the OCP TCS pre-commission guideline · DN100 header 1.21 m/s, 10.50 L/s · DN50 drop 1.11 m/s,</text><text x="24.0" y="61.0" font-size="10" font-weight="400" fill="#5b6b78" text-anchor="start">2.47 L/s · end point conductivity ≤ 60 µS/cm, turbidity &lt; 5 NTU</text><text x="32.0" y="750.0" font-size="10" font-weight="700" fill="#2d6a4f" text-anchor="start">WHAT TO PROVE</text><text x="32.0" y="766.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">• A skid of 10.5 L/s flushes the DN100 header, or 4 DN50 drops at a time (4 × 2.47 = 9.88 L/s).</text><text x="32.0" y="781.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">• The minimum velocity rises from 0.96 m/s at DN15 to 1.26 m/s at DN150 because the wall shear needed for cleaning increases with pipe size.</text><rect x="24" y="814.0" width="952" height="44" rx="0" fill="#f6f8fa" fill-opacity="1" stroke="#5b6b78" stroke-width="1"/><text x="32.0" y="828.0" font-size="11" font-weight="700" fill="#172b3a" text-anchor="start">F19-7  ·  Minimum flushing velocity and flow by pipe size for TCS pipework (BSRIA BG 29 via OCP)</text><text x="968.0" y="828.0" font-size="10" font-weight="400" fill="#5b6b78" text-anchor="end">Chapter 19 · §19.10</text><text x="32.0" y="841.0" font-size="9" font-weight="400" fill="#5b6b78" text-anchor="start">Data Centre Commissioning Field Manual R01 EN · October 2026 · educational reference, not to scale · project and OEM documents govern</text><text x="32.0" y="853.0" font-size="9" font-weight="400" fill="#5b6b78" text-anchor="start">Symbols: QElectroTech EN 60617 and P&amp;ID collections, CC-BY 3.0, native geometry · instrument bubbles per ISA 5.1 · states per IEC 60617 / IEEE C37.2 practice</text></svg>