"end">200</text><text x="114.0" y="124.0" font-size="10" font-weight="400" fill="#5b6b78" text-anchor="end">250</text><text x="530.0" y="590.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="middle">duration (ms), log scale</text><text transform="translate(76 340.0) rotate(-90)" font-size="11" text-anchor="middle" fill="#172b3a">voltage (% of nominal)</text><text x="148.0" y="608.0" font-size="10" font-weight="400" fill="#172b3a" text-anchor="start">upper limit: prohibited region above</text><text x="148.0" y="623.0" font-size="10" font-weight="400" fill="#172b3a" text-anchor="start">lower limit: no-damage region below</text><text x="523.8" y="404.4" font-size="10" font-weight="400" fill="#8a5a00" text-anchor="start">E1</text><text x="561.1" y="457.2" font-size="10" font-weight="400" fill="#8a5a00" text-anchor="start">E2</text><text x="578.1" y="356.9" font-size="10" font-weight="400" fill="#8a5a00" text-anchor="start">E3</text><text x="65.0" y="683.0" font-size="11" font-weight="700" fill="#172b3a" text-anchor="start">Event</text><text x="147.5" y="683.0" font-size="11" font-weight="700" fill="#172b3a" text-anchor="start">Magnitude, duration</text><text x="340.0" y="683.0" font-size="11" font-weight="700" fill="#172b3a" text-anchor="start">Position</text><text x="532.5" y="683.0" font-size="11" font-weight="700" fill="#172b3a" text-anchor="start">Action</text><text x="65.0" y="705.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">E1</text><text x="147.5" y="705.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">85 %, 80 ms</text><text x="340.0" y="705.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">inside</text><text x="532.5" y="705.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">record only</text><text x="65.0" y="727.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">E2</text><text x="147.5" y="727.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">55 %, 150 ms</text><text x="340.0" y="727.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">below lower line</text><text x="532.5" y="727.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">investigate: fault upstream, check UPS transfer log</text><text x="65.0" y="749.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">E3</text><text x="147.5" y="749.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">112 %, 0.2 s</text><text x="340.0" y="749.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">inside</text><text x="532.5" y="749.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">record; check load rejection event</text><circle cx="516.8" cy="410.4" r="4" fill="#b7791f"/><circle cx="554.1" cy="463.2" r="4" fill="#b7791f"/><circle cx="571.1" cy="362.9" r="4" fill="#b7791f"/><text x="24.0" y="30.0" font-size="17" font-weight="700" fill="#172b3a" text-anchor="start">F23-5  ITIC (CBEMA) voltage tolerance envelope with three recorded MSC-1 example events</text><text x="24.0" y="48.0" font-size="10" font-weight="400" fill="#5b6b78" text-anchor="start">steady state ±10 % · swell 120 % to 0.5 s · sag 70 % to 0.5 s and 80 % to 10 s · dropout 0 % to 20 ms · applies to 120 V 60 Hz ITE; used on 230/400 V 50 Hz as a reference</text><text x="24.0" y="61.0" font-size="10" font-weight="400" fill="#5b6b78" text-anchor="start">only</text><text x="32.0" y="792.0" font-size="10" font-weight="700" fill="#2d6a4f" text-anchor="start">WHAT TO PROVE</text><text x="32.0" y="808.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">• E1 (85 %, 80 ms) and E3 (112 %, 0.2 s) are inside the envelope.</text><text x="32.0" y="823.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">• E2 (55 %, 150 ms) is below the lower line; trace it to a fault clearance.</text><text x="32.0" y="838.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">• ITIC is for 120 V 60 Hz equipment; for 230 V servers use the PSU ride-through data and the OPR.</text><rect x="24" y="871.0" width="952" height="44" rx="0" fill="#f6f8fa" fill-opacity="1" stroke="#5b6b78" stroke-width="1"/><text x="32.0" y="885.0" font-size="11" font-weight="700" fill="#172b3a" text-anchor="start">F23-5  ·  ITIC (CBEMA) voltage tolerance envelope with three recorded MSC-1 example events</text><text x="968.0" y="885.0" font-size="10" font-weight="400" fill="#5b6b78" text-anchor="end">Chapter 23 · §23.8</text><text x="32.0" y="898.0" font-size="9" font-weight="400" fill="#5b6b78" text-anchor="start">Data Centre Commissioning Field Manual R01 EN · October 2026 · educational reference, not to scale · project and OEM documents govern</text><text x="32.0" y="910.0" font-size="9" font-weight="400" fill="#5b6b78" text-anchor="start">Symbols: QElectroTech EN 60617 and P&amp;ID collections, CC-BY 3.0, native geometry · instrument bubbles per ISA 5.1 · states per IEC 60617 / IEEE C37.2 practice</text></svg>