ht="700" fill="#172b3a" text-anchor="middle">NRV</text><text x="515.6" y="315.8" font-size="11" font-weight="700" fill="#b91c1c" text-anchor="middle">Pre-action valve PAV-01</text><text x="515.6" y="327.9" font-size="9" font-weight="400" fill="#172b3a" text-anchor="middle">solenoid release SV</text><text x="515.6" y="340.1" font-size="9" font-weight="400" fill="#172b3a" text-anchor="middle">clapper, priming water</text><text x="663.8" y="304.4" font-size="10.5" font-weight="700" fill="#172b3a" text-anchor="middle">V-ISO</text><text x="663.8" y="317.5" font-size="8.5" font-weight="400" fill="#5b6b78" text-anchor="middle">riser isolation</text><text x="852.0" y="315.8" font-size="11" font-weight="700" fill="#b91c1c" text-anchor="middle">Sprinkler pipework</text><text x="852.0" y="327.9" font-size="9" font-weight="400" fill="#172b3a" text-anchor="middle">closed sprinklers, 1,680 L</text><text x="852.0" y="340.1" font-size="9" font-weight="400" fill="#172b3a" text-anchor="middle">nitrogen 2.4 bar</text><text x="1122.0" y="321.9" font-size="11" font-weight="700" fill="#b91c1c" text-anchor="middle">Inspector test</text><text x="1122.0" y="334.0" font-size="9" font-weight="400" fill="#172b3a" text-anchor="middle">far end, one orifice</text><text x="720.6" y="489.9" font-size="11" font-weight="700" fill="#0ea5e9" text-anchor="middle">Nitrogen generator</text><text x="720.6" y="502.0" font-size="9" font-weight="400" fill="#172b3a" text-anchor="middle">air maintenance device</text><text x="515.6" y="149.9" font-size="11" font-weight="700" fill="#475569" text-anchor="middle">Release panel / FACP</text><text x="515.6" y="162.0" font-size="9" font-weight="400" fill="#172b3a" text-anchor="middle">C&amp;E rows 4 and 6</text><text x="525.6" y="230.0" font-size="10.5" font-weight="400" fill="#b91c1c" text-anchor="start">solenoid release</text><text x="857.0" y="204.0" font-size="10" font-weight="700" fill="#172b3a" text-anchor="middle">PSL</text><text x="917.0" y="204.0" font-size="10" font-weight="700" fill="#172b3a" text-anchor="middle">FS</text><text x="967.0" y="196.0" font-size="10.5" font-weight="400" fill="#475569" text-anchor="start">low air and flow to FACP</text><text x="45.0" y="595.0" font-size="11" font-weight="700" fill="#172b3a" text-anchor="start">Signal</text><text x="317.4" y="595.0" font-size="11" font-weight="700" fill="#172b3a" text-anchor="start">Instrument</text><text x="694.5" y="595.0" font-size="11" font-weight="700" fill="#172b3a" text-anchor="start">Set point (example)</text><text x="1029.8" y="595.0" font-size="11" font-weight="700" fill="#172b3a" text-anchor="start">C&amp;E row</text><text x="45.0" y="617.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">Main valve closed</text><text x="317.4" y="617.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">tamper switch ZS on MCV-01</text><text x="694.5" y="617.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">two turns of the handwheel</text><text x="1029.8" y="617.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">row 10, supervisory</text><text x="45.0" y="639.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">Low pipe pressure</text><text x="317.4" y="639.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">PSL</text><text x="694.5" y="639.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">1.7 bar falling</text><text x="1029.8" y="639.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">row 9, supervisory; interlock input</text><text x="45.0" y="661.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">Water flowing</text><text x="317.4" y="661.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">FS and alarm pressure switch</text><text x="694.5" y="661.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">30 s retard</text><text x="1029.8" y="661.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">row 8, alarm</text><text x="45.0" y="683.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">Release</text><text x="317.4" y="683.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">solenoid SV on PAV-01</text><text x="694.5" y="683.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">VESDA Fire 2 or two detectors</text><text x="1029.8" y="683.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">rows 4 and 6</text><text x="24.0" y="30.0" font-size="17" font-weight="700" fill="#172b3a" text-anchor="start">F20-3  Double-interlock pre-action valve set B2-DH3-PA-01 and its supervision</text><text x="24.0" y="48.0" font-size="11" font-weight="400" fill="#5b6b78" text-anchor="start">ordinary hazard group 1 · 1,680 L pipe volume · nitrogen at 2.4 bar normal · release needs detection (VESDA Fire 2 or two detectors) AND loss of pipe pressure · water delivery 46 s measured, 50 s limit (NFPA 13-2025 Table 8.2.4.3.2)</text><text x="32.0" y="726.0" font-size="10" font-weight="700" fill="#2d6a4f" text-anchor="start">WHAT TO PROVE</text><text x="32.0" y="742.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">• Trip test: detection only gives no water; air loss only gives a low-air supervisory; both give water at the inspector test connection in 46 s.</text><text x="32.0" y="757.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">• Tamper switch on the main control valve gives a supervisory signal within two revolutions of the handwheel or one-fifth of travel (NFPA 72-2025 17.19.1.2).</text><text x="24.0" y="792.0" font-size="10" font-weight="700" fill="#5b6b78" text-anchor="start">LEGEND</text><g transform="translate(38.0 810.0) scale(0.42)"><line x1="-11.31" y1="0" x2="-6.35" y2="0" stroke="#172b3a" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/><line x1="7.3" y1="0" x2="11.93" y