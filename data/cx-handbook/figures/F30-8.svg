ght="23.0" rx="0" fill="#ffffff" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><rect x="305.77777777777777" y="667.0" width="327.1111111111111" height="23.0" rx="0" fill="#ffffff" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><rect x="632.8888888888889" y="667.0" width="327.1111111111111" height="23.0" rx="0" fill="#ffffff" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><rect x="40" y="690.0" width="265.77777777777777" height="23.0" rx="0" fill="#ffffff" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><rect x="305.77777777777777" y="690.0" width="327.1111111111111" height="23.0" rx="0" fill="#ffffff" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><rect x="632.8888888888889" y="690.0" width="327.1111111111111" height="23.0" rx="0" fill="#ffffff" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><text x="250.0" y="126.2" font-size="12" font-weight="700" fill="#334155" text-anchor="middle">Checklist record (L2, L3)</text><text x="250.0" y="139.7" font-size="10" font-weight="400" fill="#172b3a" text-anchor="middle">ELE-L3-UPS-B2-DH3-A1</text><text x="250.0" y="153.2" font-size="10" font-weight="400" fill="#172b3a" text-anchor="middle">status, contractor and CxA dates</text><text x="250.0" y="166.7" font-size="10" font-weight="400" fill="#172b3a" text-anchor="middle">planned completion week 6</text><text x="760.0" y="126.2" font-size="12" font-weight="700" fill="#475569" text-anchor="middle">Checklist completion</text><text x="760.0" y="139.7" font-size="10" font-weight="400" fill="#172b3a" text-anchor="middle">verified / issued × 100</text><text x="760.0" y="153.2" font-size="10" font-weight="400" fill="#172b3a" text-anchor="middle">week 12: 1,700 / 2,400 = 70.8 %</text><text x="760.0" y="166.7" font-size="10" font-weight="400" fill="#172b3a" text-anchor="middle">plan 2,030; target per curve</text><text x="250.0" y="248.2" font-size="12" font-weight="700" fill="#334155" text-anchor="middle">Test record (L4, L5)</text><text x="250.0" y="261.6" font-size="10" font-weight="400" fill="#172b3a" text-anchor="middle">ELE-L4-UPS-B2-DH3-A1-T03</text><text x="250.0" y="275.1" font-size="10" font-weight="400" fill="#172b3a" text-anchor="middle">attempt number, result, reason code</text><text x="250.0" y="288.6" font-size="10" font-weight="400" fill="#172b3a" text-anchor="middle">linked issue ISS-B2-0398</text><text x="760.0" y="248.2" font-size="12" font-weight="700" fill="#475569" text-anchor="middle">First-pass yield, retest ratio</text><text x="760.0" y="261.6" font-size="10" font-weight="400" fill="#172b3a" text-anchor="middle">passed at attempt 1 / attempt 1 run</text><text x="760.0" y="275.1" font-size="10" font-weight="400" fill="#172b3a" text-anchor="middle">B2: 331 / 379 = 87.3 %</text><text x="760.0" y="288.6" font-size="10" font-weight="400" fill="#172b3a" text-anchor="middle">target 90 %; retest ratio 0.16</text><text x="250.0" y="370.2" font-size="12" font-weight="700" fill="#334155" text-anchor="middle">Issue record</text><text x="250.0" y="383.7" font-size="10" font-weight="400" fill="#172b3a" text-anchor="middle">ISS-B2-0412, category B</text><text x="250.0" y="397.2" font-size="10" font-weight="400" fill="#172b3a" text-anchor="middle">date raised, date closed</text><text x="250.0" y="410.7" font-size="10" font-weight="400" fill="#172b3a" text-anchor="middle">asset tag, responsible party</text><text x="760.0" y="370.2" font-size="12" font-weight="700" fill="#475569" text-anchor="middle">Issue ageing, defect density</text><text x="760.0" y="383.7" font-size="10" font-weight="400" fill="#172b3a" text-anchor="middle">limits A 1, B 7, C 30 working days</text><text x="760.0" y="397.2" font-size="10" font-weight="400" fill="#172b3a" text-anchor="middle">week 12: 180 open</text><text x="760.0" y="410.7" font-size="10" font-weight="400" fill="#172b3a" text-anchor="middle">past limit: A 1, B 9, C 22</text><text x="250.0" y="492.2" font-size="12" font-weight="700" fill="#334155" text-anchor="middle">RFI record</text><text x="250.0" y="505.7" font-size="10" font-weight="400" fill="#172b3a" text-anchor="middle">RFI-B2-ELE-0147, priority P2</text><text x="250.0" y="519.2" font-size="10" font-weight="400" fill="#172b3a" text-anchor="middle">issued, due, responded, accepted</text><text x="250.0" y="532.7" font-size="10" font-weight="400" fill="#172b3a" text-anchor="middle">ball in court: designer</text><text x="760.0" y="492.2" font-size="12" font-weight="700" fill="#475569" text-anchor="middle">RFI cycle time</text><text x="760.0" y="505.7" font-size="10" font-weight="400" fill="#172b3a" text-anchor="middle">date accepted − date issued</text><text x="760.0" y="519.2" font-size="10" font-weight="400" fill="#172b3a" text-anchor="middle">week 12: median 6 working days</text><text x="760.0" y="532.7" font-size="10" font-weight="400" fill="#172b3a" text-anchor="middle">90th percentile 12 working days</text><text x="45.0" y="613.6" font-size="11.5" font-weight="700" fill="#172b3a" text-anchor="start">KPI</text><text x="310.8" y="613.6" font-size="11.5" font-weight="700" fill="#172b3a" text-anchor="start">Fields used</text><text x="637.9" y="613.6" font-size="11.5" font-weight="700" fill="#172b3a" text-anchor="start">If a field is missing</text><text x="45.0" y="636.6" font-size="11.5" font-weight="400" fill="#172b3a" text-anchor="start">Checklist completion</text><text x="310.8" y="636.6" font-size="11.5" font-weight="400" fill="#172b3a" text-anchor="start">status, CxA verification date</text><text x="637.9" y="636.6" font-size="11.5" font-weight="400" fill="#172b3a" text-anchor="start">no curve over time</text><text x="45.0" y="659.6" font-size="11.5" font-weight="400" fill="#172b3a" text-anchor="start">First-pass yield</text><text x="310.8" y="659.6" font-size="11.5" font-weight="400" fill="#172b3a" text-anchor="start">attempt number, result</text><text x="637.9" y="659.6" font-size="11.5" font-weight="400" fill="#172b3a" text-anchor="start">retests counted as passes</text><text x="45.0" y="682.6" font-size="11.5" font-weight="400" fill="#172b3a" text-anchor="start">Issue ageing</text><text x="310.8" y="682.6" font-size="11.5" font-weight="400" fill="#172b3a" text-anchor="start">category, date raised</text><text x="637.9" y="682.6" font-size="11.5" font-weight="400" fill="#172b3a" text-anchor="start">no check against the limits</text><text x="45.0" y="705.6" font-size="11.5" font-weight="400" fill="#172b3a" text-anchor="start">RFI cycle time</text><text x="310.8" y="705.6" font-size="11.5" font-weight="400" fill="#172b3a" text-anchor="start">dates issued and accepted</text><text x="637.9" y="705.6" font-size="11.5" font-weight="400" fill="#172b3a" text-anchor="start">no median or 90th percentile</text><text x="24.0" y="30.0" font-size="17" font-weight="700" fill="#172b3a" text-anchor="start">F30-8  Four commissioning records and the KPIs calculated from them</text><text x="24.0" y="48.0" font-size="10" font-weight="400" fill="#5b6b78" text-anchor="start">checklist → completion 1,700 / 2,400 = 70.8 % · test → FPY 331 / 379 = 87.3 % · issue → 180 open, limits A 1, B 7, C 30 working days · RFI → median 6, P90 12 working</text><text x="24.0" y="61.0" font-size="10" font-weight="400" fill="#5b6b78" text-anchor="start">days (week 12, example data)</text><text x="32.0" y="749.0" font-size="10" font-weight="700" fill="#2d6a4f" text-anchor="start">WHAT TO PROVE</text><text x="32.0" y="765.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">• Checklist completion uses the CxA verification date: 1,700 verified of 2,400 issued is 70.8 % at week 12.</text><text x="32.0" y="780.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">• First-pass yield uses the attempt number: 331 of 379 tests passed at attempt 1, 87.3 % against the 90 % target.</text><text x="32.0" y="795.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">• Issue ageing needs the category and the date raised; RFI cycle time needs the dates issued and accepted.</text><rect x="24" y="822.0" width="952" height="44" rx="0" fill="#f6f8fa" fill-opacity="1" stroke="#5b6b78" stroke-width="1"/><text x="32.0" y="836.0" font-size="11" font-weight="700" fill="#172b3a" text-anchor="start">F30-8  ·  Four commissioning records and the KPIs calculated from them</text><text x="968.0" y="836.0" font-size="10" font-weight="400" fill="#5b6b78" text-anchor="end">Chapter 30 · §30.2.1</text><text x="32.0" y="849.0" font-size="9" font-weight="400" fill="#5b6b78" text-anchor="start">Data Centre Commissioning Field Manual R01 EN · October 2026 · educational reference, not to scale · project and OEM documents govern</text><text x="32.0" y="861.0" font-size="9" font-weight="400" fill="#5b6b78" text-anchor="start">Symbols: QElectroTech EN 60617 and P&amp;ID collections, CC-BY 3.0, native geometry · instrument bubbles per ISA 5.1 · states per IEC 60617 / IEEE C37.2 practice</text></svg>