="#ffffff" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><text x="120.0" y="524.0" font-size="10" font-weight="400" fill="#5b6b78" text-anchor="middle">0</text><text x="264.8" y="524.0" font-size="10" font-weight="400" fill="#5b6b78" text-anchor="middle">2</text><text x="409.5" y="524.0" font-size="10" font-weight="400" fill="#5b6b78" text-anchor="middle">4</text><text x="554.3" y="524.0" font-size="10" font-weight="400" fill="#5b6b78" text-anchor="middle">6</text><text x="699.0" y="524.0" font-size="10" font-weight="400" fill="#5b6b78" text-anchor="middle">8</text><text x="843.8" y="524.0" font-size="10" font-weight="400" fill="#5b6b78" text-anchor="middle">10</text><text x="114.0" y="514.0" font-size="10" font-weight="400" fill="#5b6b78" text-anchor="end">0</text><text x="114.0" y="408.4" font-size="10" font-weight="400" fill="#5b6b78" text-anchor="end">5000</text><text x="114.0" y="302.9" font-size="10" font-weight="400" fill="#5b6b78" text-anchor="end">10000</text><text x="114.0" y="197.3" font-size="10" font-weight="400" fill="#5b6b78" text-anchor="end">15000</text><text x="500.0" y="540.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="middle">time after voltage applied (min)</text><text transform="translate(76 320.0) rotate(-90)" font-size="11" text-anchor="middle" fill="#172b3a">insulation resistance (MΩ)</text><text x="148.0" y="558.0" font-size="10" font-weight="400" fill="#172b3a" text-anchor="start">dry winding, PI 2.5 (example)</text><text x="148.0" y="573.0" font-size="10" font-weight="400" fill="#172b3a" text-anchor="start">wet winding, PI 1.1 (example)</text><text x="199.4" y="373.1" font-size="10" font-weight="400" fill="#8a5a00" text-anchor="start">6,200 MΩ at 1 min</text><text x="836.8" y="176.8" font-size="10" font-weight="400" fill="#8a5a00" text-anchor="end">15,500 at 10 min</text><text x="836.8" y="455.4" font-size="10" font-weight="400" fill="#8a5a00" text-anchor="end">2,300 at 10 min</text><text x="945.0" y="145.0" font-size="11" font-weight="700" fill="#172b3a" text-anchor="start">Reading</text><text x="1117.9" y="145.0" font-size="11" font-weight="700" fill="#172b3a" text-anchor="start">Dry</text><text x="1241.5" y="145.0" font-size="11" font-weight="700" fill="#172b3a" text-anchor="start">Wet</text><text x="945.0" y="167.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">30 s</text><text x="1117.9" y="167.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">4,700</text><text x="1241.5" y="167.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">2,000</text><text x="945.0" y="189.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">1 min</text><text x="1117.9" y="189.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">6,200</text><text x="1241.5" y="189.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">2,100</text><text x="945.0" y="211.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">10 min</text><text x="1117.9" y="211.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">15,500</text><text x="1241.5" y="211.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">2,300</text><text x="945.0" y="233.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">DAR 60/30 s</text><text x="1117.9" y="233.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">1.32</text><text x="1241.5" y="233.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">1.05</text><text x="945.0" y="255.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">PI 10/1 min</text><text x="1117.9" y="255.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">2.50</text><text x="1241.5" y="255.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">1.10</text><text x="945.0" y="344.3" font-size="10.5" font-weight="700" fill="#172b3a" text-anchor="start">Index</text><text x="1029.0" y="344.3" font-size="10.5" font-weight="700" fill="#172b3a" text-anchor="start">Practice guide value</text><text x="945.0" y="365.3" font-size="10.5" font-weight="400" fill="#172b3a" text-anchor="start">PI</text><text x="1029.0" y="365.3" font-size="10.5" font-weight="400" fill="#172b3a" text-anchor="start">&lt; 1.0 investigate; ≥ 2.0 good (IEEE 43 for machines)</text><text x="945.0" y="386.3" font-size="10.5" font-weight="400" fill="#172b3a" text-anchor="start">DAR</text><text x="1029.0" y="386.3" font-size="10.5" font-weight="400" fill="#172b3a" text-anchor="start">≥ 1.25 commonly used as acceptable</text><text x="945.0" y="407.3" font-size="10.5" font-weight="400" fill="#172b3a" text-anchor="start">1 min</text><text x="1029.0" y="407.3" font-size="10.5" font-weight="400" fill="#172b3a" text-anchor="start">NETA Table 100.5: 5,000 MΩ liquid-filled at &gt; 5 kV</text><circle cx="192.4" cy="379.1" r="4" fill="#b7791f"/><circle cx="843.8" cy="182.8" r="4" fill="#b7791f"/><circle cx="843.8" cy="461.4" r="4" fill="#b7791f"/><text x="24.0" y="30.0" font-size="17" font-weight="700" fill="#172b3a" text-anchor="start">F13-3  Insulation resistance against time at 5000 V DC: polarisation index of two transformer windings (example)</text><text x="24.0" y="48.0" font-size="11" font-weight="400" fill="#5b6b78" text-anchor="start">TX-A 80 MVA, HV winding to LV winding and earth · readings at 30 s, 1 min and 10 min · winding temperature 30 °C · good insulation: 6,200 MΩ at 1 min rising to 15,500 MΩ at 10 min (PI 2.5) · wet insulation: 2,100 MΩ to 2,300 MΩ (PI 1.1)</text><text x="32.0" y="622.0" font-size="10" font-weight="700" fill="#2d6a4f" text-anchor="start">WHAT TO PROVE</text><text x="32.0" y="638.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">• PI = R(10 min) / R(1 min): 15,500 / 6,200 = 2.5 for the dry winding and 2,300 / 2,100 = 1.1 for the wet winding; DAR = R(60 s) / R(30 s) = 6,200 / 4,700 = 1.32 for the dry winding.</text><text x="32.0" y="653.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">• The 1-minute value is compared with ANSI/NETA ATS Table 100.5 after temperature correction to 20 °C; the PI is compared with the manufacturer value and with the other windings of the same transformer.</text><rect x="24" y="686" width="1352" height="44" rx="0" fill="#f6f8fa" fill-opacity="1" stroke="#5b6b78" stroke-width="1"/><text x="32.0" y="700.0" font-size="11" font-weight="700" fill="#172b3a" text-anchor="start">F13-3  ·  Insulation resistance against time at 5000 V DC: polarisation index of two transformer windings (example)</text><text x="1368.0" y="700.0" font-size="10" font-weight="400" fill="#5b6b78" text-anchor="end">Chapter 13 · §13.4</text><text x="32.0" y="713.0" font-size="9" font-weight="400" fill="#5b6b78" text-anchor="start">Data Centre Commissioning Field Manual R01 EN · October 2026 · educational reference, not to scale · project and OEM documents govern</text><text x="32.0" y="725.0" font-size="9" font-weight="400" fill="#5b6b78" text-anchor="start">Symbols: QElectroTech EN 60617 and P&amp;ID collections, CC-BY 3.0, native geometry · instrument bubbles per ISA 5.1 · states per IEC 60617 / IEEE C37.2 practice</text></svg>