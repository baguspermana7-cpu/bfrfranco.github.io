 stroke-width="0.8"/><rect x="40" y="242.5" width="330" height="26.5" rx="0" fill="#e9f0f4" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><rect x="370" y="242.5" width="130" height="26.5" rx="0" fill="#fde4b0" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><rect x="500" y="242.5" width="300" height="26.5" rx="0" fill="#ffffff" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><rect x="800" y="242.5" width="180" height="26.5" rx="0" fill="#ffffff" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><rect x="980" y="242.5" width="380" height="26.5" rx="0" fill="#ffffff" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><rect x="40" y="269.0" width="330" height="26.5" rx="0" fill="#e9f0f4" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><rect x="370" y="269.0" width="130" height="26.5" rx="0" fill="#e6f2e6" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><rect x="500" y="269.0" width="300" height="26.5" rx="0" fill="#ffffff" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><rect x="800" y="269.0" width="180" height="26.5" rx="0" fill="#ffffff" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><rect x="980" y="269.0" width="380" height="26.5" rx="0" fill="#ffffff" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><text x="435.0" y="127.9" font-size="11.5" font-weight="700" fill="#172b3a" text-anchor="middle">Category</text><text x="650.0" y="127.9" font-size="11.5" font-weight="700" fill="#172b3a" text-anchor="middle">Close before</text><text x="890.0" y="127.9" font-size="11.5" font-weight="700" fill="#172b3a" text-anchor="middle">Ageing limit</text><text x="1170.0" y="127.9" font-size="11.5" font-weight="700" fill="#172b3a" text-anchor="middle">Example</text><text x="46.0" y="154.4" font-size="12.5" font-weight="400" fill="#172b3a" text-anchor="start">Safety of people or equipment</text><text x="435.0" y="154.4" font-size="12.5" font-weight="700" fill="#172b3a" text-anchor="middle">A</text><text x="650.0" y="154.4" font-size="12.5" font-weight="700" fill="#172b3a" text-anchor="middle">next energisation, fill or level</text><text x="890.0" y="154.4" font-size="12.5" font-weight="700" fill="#172b3a" text-anchor="middle">1 working day</text><text x="1170.0" y="154.4" font-size="12.5" font-weight="700" fill="#172b3a" text-anchor="middle">cover missing on live busbar</text><text x="46.0" y="180.9" font-size="12.5" font-weight="400" fill="#172b3a" text-anchor="start">Prevents energisation or fill</text><text x="435.0" y="180.9" font-size="12.5" font-weight="700" fill="#172b3a" text-anchor="middle">A</text><text x="650.0" y="180.9" font-size="12.5" font-weight="700" fill="#172b3a" text-anchor="middle">next energisation or fill</text><text x="890.0" y="180.9" font-size="12.5" font-weight="700" fill="#172b3a" text-anchor="middle">1 working day</text><text x="1170.0" y="180.9" font-size="12.5" font-weight="700" fill="#172b3a" text-anchor="middle">open cable entry in MV panel</text><text x="46.0" y="207.4" font-size="12.5" font-weight="400" fill="#172b3a" text-anchor="start">Makes the next test invalid</text><text x="435.0" y="207.4" font-size="12.5" font-weight="700" fill="#172b3a" text-anchor="middle">A</text><text x="650.0" y="207.4" font-size="12.5" font-weight="700" fill="#172b3a" text-anchor="middle">the test concerned</text><text x="890.0" y="207.4" font-size="12.5" font-weight="700" fill="#172b3a" text-anchor="middle">1 working day</text><text x="1170.0" y="207.4" font-size="12.5" font-weight="700" fill="#172b3a" text-anchor="middle">CDU leak sensor not connected</text><text x="46.0" y="233.9" font-size="12.5" font-weight="400" fill="#172b3a" text-anchor="start">Affects operation or maintenance</text><text x="435.0" y="233.9" font-size="12.5" font-weight="700" fill="#172b3a" text-anchor="middle">B</text><text x="650.0" y="233.9" font-size="12.5" font-weight="700" fill="#172b3a" text-anchor="middle">handover or RFS</text><text x="890.0" y="233.9" font-size="12.5" font-weight="700" fill="#172b3a" text-anchor="middle">7 working days</text><text x="1170.0" y="233.9" font-size="12.5" font-weight="700" fill="#172b3a" text-anchor="middle">BMS graphic with wrong units</text><text x="46.0" y="260.4" font-size="12.5" font-weight="400" fill="#172b3a" text-anchor="start">Affects warranty or the record</text><text x="435.0" y="260.4" font-size="12.5" font-weight="700" fill="#172b3a" text-anchor="middle">B</text><text x="650.0" y="260.4" font-size="12.5" font-weight="700" fill="#172b3a" text-anchor="middle">handover or RFS</text><text x="890.0" y="260.4" font-size="12.5" font-weight="700" fill="#172b3a" text-anchor="middle">7 working days</text><text x="1170.0" y="260.4" font-size="12.5" font-weight="700" fill="#172b3a" text-anchor="middle">missing valve labels</text><text x="46.0" y="286.9" font-size="12.5" font-weight="400" fill="#172b3a" text-anchor="start">Appearance only</text><text x="435.0" y="286.9" font-size="12.5" font-weight="700" fill="#172b3a" text-anchor="middle">C</text><text x="650.0" y="286.9" font-size="12.5" font-weight="700" fill="#172b3a" text-anchor="middle">final completion, agreed date</text><text x="890.0" y="286.9" font-size="12.5" font-weight="700" fill="#172b3a" text-anchor="middle">30 working days</text><text x="1170.0" y="286.9" font-size="12.5" font-weight="700" fill="#172b3a" text-anchor="middle">scratched floor tile</text><text x="24.0" y="30.0" font-size="17" font-weight="700" fill="#172b3a" text-anchor="start">F09-3  Punch category matrix: effect of the item against the stage by which it must be closed</text><text x="24.0" y="48.0" font-size="11" font-weight="400" fill="#5b6b78" text-anchor="start">category A: 1 working day, closed before the next energisation, fill or commissioning level · category B: 7 working days, before handover or RFS · category C: 30 working days, may remain at handover with an agreed date</text><text x="32.0" y="331.5" font-size="10" font-weight="700" fill="#2d6a4f" text-anchor="start">WHAT TO PROVE</text><text x="32.0" y="347.5" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">• Any item that can injure a person or damage equipment at the next step is category A whatever its size.</text><text x="32.0" y="362.5" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">• Ageing limits come from the MSC-1 case ledger: A 1, B 7, C 30 working days.</text><rect x="24" y="395.5" width="1352" height="44" rx="0" fill="#f6f8fa" fill-opacity="1" stroke="#5b6b78" stroke-width="1"/><text x="32.0" y="409.5" font-size="11" font-weight="700" fill="#172b3a" text-anchor="start">F09-3  ·  Punch category matrix: effect of the item against the stage by which it must be closed</text><text x="1368.0" y="409.5" font-size="10" font-weight="400" fill="#5b6b78" text-anchor="end">Chapter 09 · §09.8</text><text x="32.0" y="422.5" font-size="9" font-weight="400" fill="#5b6b78" text-anchor="start">Data Centre Commissioning Field Manual R01 EN · October 2026 · educational reference, not to scale · project and OEM documents govern</text><text x="32.0" y="434.5" font-size="9" font-weight="400" fill="#5b6b78" text-anchor="start">Symbols: QElectroTech EN 60617 and P&amp;ID collections, CC-BY 3.0, native geometry · instrument bubbles per ISA 5.1 · states per IEC 60617 / IEEE C37.2 practice</text></svg>