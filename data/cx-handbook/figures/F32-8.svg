fill="none" stroke="#475569" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#arrow-475569)"/><polyline points="480.0,403.0 540.0,403.0" fill="none" stroke="#b91c1c" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#arrow-b91c1c)"/><polyline points="260.0,432.0 260.0,462.0" fill="none" stroke="#475569" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#arrow-475569)"/><polyline points="480.0,491.0 540.0,491.0" fill="none" stroke="#b91c1c" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#arrow-b91c1c)"/><polyline points="260.0,520.0 260.0,550.0" fill="none" stroke="#475569" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#arrow-475569)"/><polyline points="480.0,579.0 540.0,579.0" fill="none" stroke="#b91c1c" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#arrow-b91c1c)"/><polyline points="260.0,608.0 260.0,638.0" fill="none" stroke="#475569" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#arrow-475569)"/><rect x="40" y="110" width="440" height="58" rx="0" fill="#ffffff" fill-opacity="1" stroke="#475569" stroke-width="1.4"/><rect x="540" y="110" width="420" height="58" rx="0" fill="#ffffff" fill-opacity="1" stroke="#b91c1c" stroke-width="1.4"/><rect x="40" y="198" width="440" height="58" rx="0" fill="#ffffff" fill-opacity="1" stroke="#475569" stroke-width="1.4"/><rect x="540" y="198" width="420" height="58" rx="0" fill="#ffffff" fill-opacity="1" stroke="#b91c1c" stroke-width="1.4"/><rect x="40" y="286" width="440" height="58" rx="0" fill="#ffffff" fill-opacity="1" stroke="#475569" stroke-width="1.4"/><rect x="540" y="286" width="420" height="58" rx="0" fill="#ffffff" fill-opacity="1" stroke="#b91c1c" stroke-width="1.4"/><rect x="40" y="374" width="440" height="58" rx="0" fill="#ffffff" fill-opacity="1" stroke="#475569" stroke-width="1.4"/><rect x="540" y="374" width="420" height="58" rx="0" fill="#ffffff" fill-opacity="1" stroke="#b91c1c" stroke-width="1.4"/><rect x="40" y="462" width="440" height="58" rx="0" fill="#ffffff" fill-opacity="1" stroke="#475569" stroke-width="1.4"/><rect x="540" y="462" width="420" height="58" rx="0" fill="#ffffff" fill-opacity="1" stroke="#b91c1c" stroke-width="1.4"/><rect x="40" y="550" width="440" height="58" rx="0" fill="#ffffff" fill-opacity="1" stroke="#475569" stroke-width="1.4"/><rect x="540" y="550" width="420" height="58" rx="0" fill="#ffffff" fill-opacity="1" stroke="#b91c1c" stroke-width="1.4"/><rect x="40" y="638" width="440" height="58" rx="8" fill="#ffffff" fill-opacity="1" stroke="#334155" stroke-width="1.4"/><text x="260.0" y="130.8" font-size="11.5" font-weight="700" fill="#475569" text-anchor="middle">1. Work differs from approved documents</text><text x="260.0" y="143.6" font-size="9.5" font-weight="400" fill="#172b3a" text-anchor="middle">drawings, specification, submittals</text><text x="750.0" y="130.8" font-size="11.5" font-weight="700" fill="#b91c1c" text-anchor="middle">NCR (32.3.3); CAR if major or repeated</text><text x="750.0" y="143.6" font-size="9.5" font-weight="400" fill="#172b3a" text-anchor="middle">busway joint torque below OEM value</text><text x="260.0" y="218.8" font-size="11.5" font-weight="700" fill="#475569" text-anchor="middle">2. Documents wrong, contractor designed</text><text x="260.0" y="231.6" font-size="9.5" font-weight="400" fill="#172b3a" text-anchor="middle">design-build scope, OEM selection</text><text x="750.0" y="218.8" font-size="11.5" font-weight="700" fill="#b91c1c" text-anchor="middle">NCR: defect at the contractor&#x27;s cost</text><text x="750.0" y="231.6" font-size="9.5" font-weight="400" fill="#172b3a" text-anchor="middle">CDU pump trips at 100 % flow</text><text x="260.0" y="306.8" font-size="11.5" font-weight="700" fill="#475569" text-anchor="middle">3. Documents wrong, owner&#x27;s designer</text><text x="260.0" y="319.6" font-size="9.5" font-weight="400" fill="#172b3a" text-anchor="middle">or the owner changed the OPR</text><text x="750.0" y="306.8" font-size="11.5" font-weight="700" fill="#b91c1c" text-anchor="middle">Change: PCO in the change log (32.4.1)</text><text x="750.0" y="319.6" font-size="9.5" font-weight="400" fill="#172b3a" text-anchor="middle">rack density 120 to 142 kW, VO-B2-017</text><text x="260.0" y="394.8" font-size="11.5" font-weight="700" fill="#475569" text-anchor="middle">4. Documents conflict or are unclear</text><text x="260.0" y="407.6" font-size="9.5" font-weight="400" fill="#172b3a" text-anchor="middle">order of precedence needed</text><text x="750.0" y="394.8" font-size="11.5" font-weight="700" fill="#b91c1c" text-anchor="middle">RFI to the designer (32.2.1)</text><text x="750.0" y="407.6" font-size="9.5" font-weight="400" fill="#172b3a" text-anchor="middle">two CT ratios, RFI-B2-ELE-0388</text><text x="260.0" y="482.8" font-size="11.5" font-weight="700" fill="#475569" text-anchor="middle">5. Supplier deviation before manufacture</text><text x="260.0" y="495.6" font-size="9.5" font-weight="400" fill="#172b3a" text-anchor="middle">equipment under a purchase order</text><text x="750.0" y="482.8" font-size="11.5" font-weight="700" fill="#b91c1c" text-anchor="middle">TQ (32.2.2)</text><text x="750.0" y="495.6" font-size="9.5" font-weight="400" fill="#172b3a" text-anchor="middle">B2-MVS-TQ-017, 20 kV switchgear</text><text x="260.0" y="570.8" font-size="11.5" font-weight="700" fill="#475569" text-anchor="middle">6. Minor item, function not affected</text><text x="260.0" y="583.6" font-size="9.5" font-weight="400" fill="#172b3a" text-anchor="middle">label, graphic, cosmetic</text><text x="750.0" y="570.8" font-size="11.5" font-weight="700" fill="#b91c1c" text-anchor="middle">Punch list item (32.3.5)</text><text x="750.0" y="583.6" font-size="9.5" font-weight="400" fill="#172b3a" text-anchor="middle">BMS graphic shows wrong units</text><text x="260.0" y="658.8" font-size="11.5" font-weight="700" fill="#334155" text-anchor="middle">Record in the issue log</text><text x="260.0" y="671.6" font-size="9.5" font-weight="400" fill="#172b3a" text-anchor="middle">with the NCR, PCO, RFI or TQ number</text><text x="540.0" y="660.0" font-size="11" font-weight="400" fill="#5b6b78" text-anchor="start">Arrow down: answer is no, go to the next question.</text><text x="540.0" y="680.0" font-size="11" font-weight="400" fill="#5b6b78" text-anchor="start">Arrow right: answer is yes, raise this form.</text><text x="24.0" y="30.0" font-size="17" font-weight="700" fill="#172b3a" text-anchor="start">F32-8  Which form records a finding: NCR, change, RFI, TQ or punch item</text><text x="24.0" y="48.0" font-size="10" font-weight="400" fill="#5b6b78" text-anchor="start">order of questions from section 08.12.1 · defect: NCR at the contractor&#x27;s cost · owner&#x27;s design or changed OPR: PCO in the change log · conflict: RFI · supplier deviation</text><text x="24.0" y="61.0" font-size="10" font-weight="400" fill="#5b6b78" text-anchor="start">before manufacture: TQ · every commissioning finding also goes to the issue log</text><text x="32.0" y="732.0" font-size="10" font-weight="700" fill="#2d6a4f" text-anchor="start">WHAT TO PROVE</text><text x="32.0" y="748.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">• Installed work that differs from the approved documents is a defect and gets an NCR, whatever the cost of the correction.</text><text x="32.0" y="763.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">• An owner requirement change such as rack density 120 to 142 kW is a change (VO-B2-017); a document conflict such as two CT ratios is an RFI (RFI-B2-ELE-0388).</text><rect x="24" y="790" width="952" height="44" rx="0" fill="#f6f8fa" fill-opacity="1" stroke="#5b6b78" stroke-width="1"/><text x="32.0" y="804.0" font-size="11" font-weight="700" fill="#172b3a" text-anchor="start">F32-8  ·  Which form records a finding: NCR, change, RFI, TQ or punch item</text><text x="968.0" y="804.0" font-size="10" font-weight="400" fill="#5b6b78" text-anchor="end">Chapter 32 · §32.3.3</text><text x="32.0" y="817.0" font-size="9" font-weight="400" fill="#5b6b78" text-anchor="start">Data Centre Commissioning Field Manual R01 EN · October 2026 · educational reference, not to scale · project and OEM documents govern</text><text x="32.0" y="829.0" font-size="9" font-weight="400" fill="#5b6b78" text-anchor="start">Symbols: QElectroTech EN 60617 and P&amp;ID collections, CC-BY 3.0, native geometry · instrument bubbles per ISA 5.1 · states per IEC 60617 / IEEE C37.2 practice</text></svg>