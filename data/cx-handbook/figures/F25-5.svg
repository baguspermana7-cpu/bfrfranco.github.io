e="10" font-weight="700" fill="#2d6a4f" text-anchor="start">WHAT TO PROVE</text><text x="32.0" y="613.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">• The stage values add to 5.15 s, leaving 4.85 s against the 10 s requirement; the measured 3.8 s is below the budget.</text><text x="32.0" y="628.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">• The largest stages are the CDU input debounce (1.0 s), the 1 s Modbus poll, the forwarding to the operations centre (1.0 s) and the client refresh (1.0 s).</text><rect x="24" y="661" width="1352" height="44" rx="0" fill="#f6f8fa" fill-opacity="1" stroke="#5b6b78" stroke-width="1"/><text x="32.0" y="675.0" font-size="11" font-weight="700" fill="#172b3a" text-anchor="start">F25-5  ·  Latency budget: CDU leak tray alarm from the sensor to the campus operations centre</text><text x="1368.0" y="675.0" font-size="10" font-weight="400" fill="#5b6b78" text-anchor="end">Chapter 25 · §25.8</text><text x="32.0" y="688.0" font-size="9" font-weight="400" fill="#5b6b78" text-anchor="start">Data Centre Commissioning Field Manual R01 EN · October 2026 · educational reference, not to scale · project and OEM documents govern</text><text x="32.0" y="700.0" font-size="9" font-weight="400" fill="#5b6b78" text-anchor="start">Symbols: QElectroTech EN 60617 and P&amp;ID collections, CC-BY 3.0, native geometry · instrument bubbles per ISA 5.1 · states per IEC 60617 / IEEE C37.2 practice</text></svg>