760.0,432.0" fill="none" stroke="#b91c1c" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#arrow-b91c1c)"/><polyline points="340.0,462.0 340.0,496.0" fill="none" stroke="#475569" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#arrow-475569)"/><polyline points="620.0,526.0 760.0,526.0" fill="none" stroke="#b91c1c" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#arrow-b91c1c)"/><polyline points="340.0,556.0 340.0,590.0" fill="none" stroke="#475569" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#arrow-475569)"/><polyline points="620.0,620.0 760.0,620.0" fill="none" stroke="#b91c1c" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#arrow-b91c1c)"/><polyline points="340.0,650.0 340.0,684.0" fill="none" stroke="#475569" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#arrow-475569)"/><polyline points="620.0,714.0 760.0,714.0" fill="none" stroke="#b91c1c" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#arrow-b91c1c)"/><polyline points="340.0,744.0 340.0,778.0" fill="none" stroke="#475569" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#arrow-475569)"/><polyline points="620.0,808.0 760.0,808.0" fill="none" stroke="#b91c1c" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#arrow-b91c1c)"/><polyline points="340.0,838.0 340.0,872.0" fill="none" stroke="#475569" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#arrow-475569)"/><rect x="60" y="120" width="560" height="60" rx="0" fill="#ffffff" fill-opacity="1" stroke="#475569" stroke-width="1.4"/><rect x="60" y="214" width="560" height="60" rx="0" fill="#ffffff" fill-opacity="1" stroke="#475569" stroke-width="1.4"/><rect x="760" y="214" width="600" height="60" rx="0" fill="#ffffff" fill-opacity="1" stroke="#b91c1c" stroke-width="1.4"/><rect x="60" y="308" width="560" height="60" rx="0" fill="#ffffff" fill-opacity="1" stroke="#475569" stroke-width="1.4"/><rect x="760" y="308" width="600" height="60" rx="0" fill="#ffffff" fill-opacity="1" stroke="#b91c1c" stroke-width="1.4"/><rect x="60" y="402" width="560" height="60" rx="0" fill="#ffffff" fill-opacity="1" stroke="#475569" stroke-width="1.4"/><rect x="760" y="402" width="600" height="60" rx="0" fill="#ffffff" fill-opacity="1" stroke="#b91c1c" stroke-width="1.4"/><rect x="60" y="496" width="560" height="60" rx="0" fill="#ffffff" fill-opacity="1" stroke="#475569" stroke-width="1.4"/><rect x="760" y="496" width="600" height="60" rx="0" fill="#ffffff" fill-opacity="1" stroke="#b91c1c" stroke-width="1.4"/><rect x="60" y="590" width="560" height="60" rx="0" fill="#ffffff" fill-opacity="1" stroke="#475569" stroke-width="1.4"/><rect x="760" y="590" width="600" height="60" rx="0" fill="#ffffff" fill-opacity="1" stroke="#b91c1c" stroke-width="1.4"/><rect x="60" y="684" width="560" height="60" rx="0" fill="#ffffff" fill-opacity="1" stroke="#475569" stroke-width="1.4"/><rect x="760" y="684" width="600" height="60" rx="0" fill="#ffffff" fill-opacity="1" stroke="#b91c1c" stroke-width="1.4"/><rect x="60" y="778" width="560" height="60" rx="0" fill="#ffffff" fill-opacity="1" stroke="#475569" stroke-width="1.4"/><rect x="760" y="778" width="600" height="60" rx="0" fill="#ffffff" fill-opacity="1" stroke="#b91c1c" stroke-width="1.4"/><rect x="60" y="872" width="560" height="60" rx="8" fill="#ffffff" fill-opacity="1" stroke="#334155" stroke-width="1.4"/><text x="340.0" y="141.8" font-size="11.5" font-weight="700" fill="#475569" text-anchor="middle">1. Controller message</text><text x="340.0" y="154.6" font-size="9.5" font-weight="400" fill="#172b3a" text-anchor="middle">voltage, frequency or angle out of window</text><text x="340.0" y="235.8" font-size="11.5" font-weight="700" fill="#475569" text-anchor="middle">2. Phase rotation both sides</text><text x="340.0" y="248.6" font-size="9.5" font-weight="400" fill="#172b3a" text-anchor="middle">phase rotation meter</text><text x="1060.0" y="242.2" font-size="11.5" font-weight="700" fill="#b91c1c" text-anchor="middle">Correct cable phases (row ELV-08)</text><text x="340.0" y="329.8" font-size="11.5" font-weight="700" fill="#475569" text-anchor="middle">3. VT wiring and ratio</text><text x="340.0" y="342.6" font-size="9.5" font-weight="400" fill="#172b3a" text-anchor="middle">constant 30° or 120° error</text><text x="1060.0" y="336.2" font-size="11.5" font-weight="700" fill="#b91c1c" text-anchor="middle">Correct VT connection or ratio</text><text x="340.0" y="423.8" font-size="11.5" font-weight="700" fill="#475569" text-anchor="middle">4. Frequency source</text><text x="340.0" y="436.6" font-size="9.5" font-weight="400" fill="#172b3a" text-anchor="middle">VT signal or engine speed</text><text x="1060.0" y="430.2" font-size="11.5" font-weight="700" fill="#b91c1c" text-anchor="middle">Correct pole or teeth setting</text><text x="340.0" y="517.8" font-size="11.5" font-weight="700" fill="#475569" text-anchor="middle">5. Slip window and governor</text><text x="340.0" y="530.6" font-size="9.5" font-weight="400" fill="#172b3a" text-anchor="middle">angle never settles</text><text x="1060.0" y="524.2" font-size="11.5" font-weight="700" fill="#b91c1c" text-anchor="middle">Tune governor; window within limits</text><text x="340.0" y="611.8" font-size="11.5" font-weight="700" fill="#475569" text-anchor="middle">6. Voltage match</text><text x="340.0" y="624.6" font-size="9.5" font-weight="400" fill="#172b3a" text-anchor="middle">AVR set point, matching function</text><text x="1060.0" y="618.2" font-size="11.5" font-weight="700" fill="#b91c1c" text-anchor="middle">Correct AVR or matching</text><text x="340.0" y="705.8" font-size="11.5" font-weight="700" fill="#475569" text-anchor="middle">7. Breaker close time</text><text x="340.0" y="718.6" font-size="9.5" font-weight="400" fill="#172b3a" text-anchor="middle">timing test, enter value</text><text x="1060.0" y="712.2" font-size="11.5" font-weight="700" fill="#b91c1c" text-anchor="middle">Enter measured close time</text><text x="340.0" y="799.8" font-size="11.5" font-weight="700" fill="#475569" text-anchor="middle">8. Dead bus logic</text><text x="340.0" y="812.6" font-size="9.5" font-weight="400" fill="#172b3a" text-anchor="middle">first set on a dead bus</text><text x="1060.0" y="806.2" font-size="11.5" font-weight="700" fill="#b91c1c" text-anchor="middle">Correct dead bus threshold</text><text x="340.0" y="893.8" font-size="11.5" font-weight="700" fill="#334155" text-anchor="middle">Retest: 5 closes</text><text x="340.0" y="906.6" font-size="9.5" font-weight="400" fill="#172b3a" text-anchor="middle">record slip, angle, voltage</text><text x="760.0" y="892.0" font-size="11" font-weight="400" fill="#5b6b78" text-anchor="start">Arrow down: the check found nothing, go to the next check.</text><text x="760.0" y="912.0" font-size="11" font-weight="400" fill="#5b6b78" text-anchor="start">Arrow right: the check found the fault, apply the fix, then retest.</text><text x="24.0" y="30.0" font-size="17" font-weight="700" fill="#172b3a" text-anchor="start">F29-7  Decision tree: generator fails to synchronise to the 20 kV generator bus</text><text x="24.0" y="48.0" font-size="11" font-weight="400" fill="#5b6b78" text-anchor="start">sync check (ANSI 25) window, typical: angle about ±10°, slip about 0.1 to 0.2 Hz or less, voltage 2 to 5 % (project settings sheet governs) · worked case B2-GEN-07: fixed 30° angle from a wye/delta VT mismatch · 5 closes after fix at 2 to 6°</text><text x="32.0" y="968.0" font-size="10" font-weight="700" fill="#2d6a4f" text-anchor="start">WHAT TO PROVE</text><text x="32.0" y="984.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">• A fixed 30° error comes from one VT connected line-to-neutral and the other line-to-line; a fixed 120° error comes from a phase swap.</text><text x="32.0" y="999.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">• After the VT correction, 5 closes were recorded with angle 2 to 6° and slip 0.05 to 0.11 Hz.</text><text x="24.0" y="1034.0" font-size="10" font-weight="700" fill="#5b6b78" text-anchor="start">LEGEND</text><line x1="24" y1="1056" x2="50" y2="1056" stroke="#475569" stroke-width="3"/><text x="56.0" y="1060.0" font-size="10" font-weight="400" fill="#172b3a" text-anchor="start">signal / control</text><line x1="151.9671875" y1="1056" x2="177.9671875" y2="1056" stroke="#b91c1c" stroke-width="3"/><text x="184.0" y="1060.0" font-size="10" font-weight="400" fill="#172b3a" text-anchor="start">trip / protection</text><line x1="283.934375" y1="1056" x2="309.934375" y2="1056" stroke="#334155" stroke-width="3"/><text x="315.9" y="1060.0" font-size="10" font-weight="400" fill="#172b3a" text-anchor="start">data / network</text><rect x="24" y="1074" width="1352" height="44" rx="0" fill="#f6f8fa" fill-opacity="1" stroke="#5b6b78" stroke-width="1"/><text x="32.0" y="1088.0" font-size="11" font-weight="700" fill="#172b3a" text-anchor="start">F29-7  ·  Decision tree: generator fails to synchronise to the 20 kV generator bus</text><text x="1368.0" y="1088.0" font-size="10" font-weight="400" fill="#5b6b78" text-anchor="end">Chapter 29 · §29.4</text><text x="32.0" y="1101.0" font-size="9" font-weight="400" fill="#5b6b78" text-anchor="start">Data Centre Commissioning Field Manual R01 EN · October 2026 · educational reference, not to scale · project and OEM documents govern</text><text x="32.0" y="1113.0" font-size="9" font-weight="400" fill="#5b6b78" text-anchor="start">Symbols: QElectroTech EN 60617 and P&amp;ID collections, CC-BY 3.0, native geometry · instrument bubbles per ISA 5.1 · states per IEC 60617 / IEEE C37.2 practice</text></svg>