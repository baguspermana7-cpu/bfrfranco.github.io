te: 412. Closed: 286.</text><text x="1020.0" y="295.5" font-size="11.5" font-weight="400" fill="#172b3a" text-anchor="start">Oldest category B items: 4 BMS graphics (integrator), 2</text><text x="1020.0" y="311.0" font-size="11.5" font-weight="400" fill="#172b3a" text-anchor="start">labels (mechanical subcontractor).</text><text x="24.0" y="30.0" font-size="17" font-weight="700" fill="#172b3a" text-anchor="start">F09-5  Open punch items by category, data hall 3, weeks 30 to 41 of 2026</text><text x="24.0" y="48.0" font-size="11" font-weight="400" fill="#5b6b78" text-anchor="start">week 41: 412 items raised, 286 closed, 126 open · A 2 (1 past the 1-day limit) · B 49 (6 past 7 days, 12.2 %) · C 75 (2 past 30 days, 2.7 %)</text><text x="32.0" y="590.0" font-size="10" font-weight="700" fill="#2d6a4f" text-anchor="start">WHAT TO PROVE</text><text x="32.0" y="606.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">• The week 41 values match the worked example in 09.11.2: 2 A, 49 B and 75 C open.</text><text x="32.0" y="621.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">• Category B items past their limit are 6 of 49 (12.2 %), above the 5 % target, so the weekly Cx meeting assigns extra integrator resources.</text><rect x="24" y="654" width="1352" height="44" rx="0" fill="#f6f8fa" fill-opacity="1" stroke="#5b6b78" stroke-width="1"/><text x="32.0" y="668.0" font-size="11" font-weight="700" fill="#172b3a" text-anchor="start">F09-5  ·  Open punch items by category, data hall 3, weeks 30 to 41 of 2026</text><text x="1368.0" y="668.0" font-size="10" font-weight="400" fill="#5b6b78" text-anchor="end">Chapter 09 · §09.11</text><text x="32.0" y="681.0" font-size="9" font-weight="400" fill="#5b6b78" text-anchor="start">Data Centre Commissioning Field Manual R01 EN · October 2026 · educational reference, not to scale · project and OEM documents govern</text><text x="32.0" y="693.0" font-size="9" font-weight="400" fill="#5b6b78" text-anchor=