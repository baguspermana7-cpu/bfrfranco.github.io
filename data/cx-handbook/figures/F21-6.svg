le">BI:305 to ALARM</text><text x="771.0" y="133.8" font-size="12" font-weight="700" fill="#475569" text-anchor="middle">Notification class 1</text><text x="771.0" y="147.3" font-size="10" font-weight="400" fill="#172b3a" text-anchor="middle">priority 10</text><text x="771.0" y="160.8" font-size="10" font-weight="400" fill="#172b3a" text-anchor="middle">ack required</text><text x="983.0" y="133.8" font-size="12" font-weight="700" fill="#475569" text-anchor="middle">BMS server</text><text x="983.0" y="147.3" font-size="10" font-weight="400" fill="#172b3a" text-anchor="middle">alarm list, P1 colour</text><text x="983.0" y="160.8" font-size="10" font-weight="400" fill="#172b3a" text-anchor="middle">operator message</text><text x="1195.0" y="133.8" font-size="12" font-weight="700" fill="#475569" text-anchor="middle">Operator</text><text x="1195.0" y="147.3" font-size="10" font-weight="400" fill="#172b3a" text-anchor="middle">workstation and</text><text x="1195.0" y="160.8" font-size="10" font-weight="400" fill="#172b3a" text-anchor="middle">operations centre</text><text x="559.0" y="361.7" font-size="12" font-weight="700" fill="#b91c1c" text-anchor="middle">Summary relay in AS panel</text><text x="559.0" y="375.2" font-size="10" font-weight="400" fill="#172b3a" text-anchor="middle">any P1 in hall DH3</text><text x="969.0" y="361.7" font-size="12" font-weight="700" fill="#b91c1c" text-anchor="middle">Beacon and sounder</text><text x="969.0" y="375.2" font-size="10" font-weight="400" fill="#172b3a" text-anchor="middle">building control room</text><text x="571.0" y="272.0" font-size="11" font-weight="400" fill="#b91c1c" text-anchor="start">hardwired output from the automation server</text><text x="45.0" y="475.0" font-size="11" font-weight="700" fill="#172b3a" text-anchor="start">Class</text><text x="212.1" y="475.0" font-size="11" font-weight="700" fill="#172b3a" text-anchor="start">Example</text><text x="713.4" y="475.0" font-size="11" font-weight="700" fill="#172b3a" text-anchor="start">Acknowledge</text><text x="913.9" y="475.0" font-size="11" font-weight="700" fill="#172b3a" text-anchor="start">Action</text><text x="1164.5" y="475.0" font-size="11" font-weight="700" fill="#172b3a" text-anchor="start">Independent path</text><text x="45.0" y="497.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">P1 critical</text><text x="212.1" y="497.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">CDU leak tray, TCS supply above 49.0 °C, fire shutdown</text><text x="713.4" y="497.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">within 1 min</text><text x="913.9" y="497.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">on site within 5 min</text><text x="1164.5" y="497.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">yes</text><text x="45.0" y="519.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">P2 major</text><text x="212.1" y="519.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">pump fault with standby running, CRAH fan fail</text><text x="713.4" y="519.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">within 5 min</text><text x="913.9" y="519.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">within 30 min</text><text x="1164.5" y="519.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">no</text><text x="45.0" y="541.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">P3 minor</text><text x="212.1" y="541.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">valve deviation, humidity high</text><text x="713.4" y="541.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">within 30 min</text><text x="913.9" y="541.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">work order same shift</text><text x="1164.5" y="541.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">no</text><text x="45.0" y="563.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">P4 advisory</text><text x="212.1" y="563.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">filter trend, run hours</text><text x="713.4" y="563.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">next working day</text><text x="913.9" y="563.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">planned maintenance</text><text x="1164.5" y="563.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">no</text><text x="24.0" y="30.0" font-size="17" font-weight="700" fill="#172b3a" text-anchor="start">F21-6  Alarm flow from a CDU leak tray sensor to the operator, with the independent P1 path</text><text x="24.0" y="48.0" font-size="11" font-weight="400" fill="#5b6b78" text-anchor="start">P1 critical: acknowledge within 1 min, on site within 5 min · notification class 1 · event priority 10 (example mapping) · the beacon path works with both BMS servers lost</text><text x="32.0" y="606.0" font-size="10" font-weight="700" fill="#2d6a4f" text-anchor="start">WHAT TO PROVE</text><text x="32.0" y="622.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">• Every P1 alarm has a second path that does not depend on the BMS server; chapter 22 tests it with both servers shut down.</text><text x="32.0" y="637.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">• Each stage adds time: polling, evaluation, notification and display; chapter 25 adds them into a 10 s latency budget.</text><text x="24.0" y="672.0" font-size="10" font-weight="700" fill="#5b6b78" text-anchor="start">LEGEND</text><line x1="24" y1="694.0" x2="50" y2="694.0" stroke="#475569" stroke-width="3"/><text x="56.0" y="698.0" font-size="10" font-weight="400" fill="#172b3a" text-anchor="start">signal / control</text><line x1="151.9671875" y1="694.0" x2="177.9671875" y2="694.0" stroke="#b91c1c" stroke-width="3"/><text x="184.0" y="698.0" font-size="10" font-weight="400" fill="#172b3a" text-anchor="start">trip / protection</text><rect x="24" y="712.0" width="1352" height="44" rx="0" fill="#f6f8fa" fill-opacity="1" stroke="#5b6b78" stroke-width="1"/><text x="32.0" y="726.0" font-size="11" font-weight="700" fill="#172b3a" text-anchor="start">F21-6  ·  Alarm flow from a CDU leak tray sensor to the operator, with the independent P1 path</text><text x="1368.0" y="726.0" font-size="10" font-weight="400" fill="#5b6b78" text-anchor="end">Chapter 21 · §21.11</text><text x="32.0" y="739.0" font-size="9" font-weight="400" fill="#5b6b78" text-anchor="start">Data Centre Commissioning Field Manual R01 EN · October 2026 · educational reference, not to scale · project and OEM documents govern</text><text x="32.0" y="751.0" font-size="9" font-weight="400" fill="#5b6b78" text-anchor="start">Symbols: QElectroTech EN 60617 and P&amp;ID collections, CC-BY 3.0, native geometry · instrument bubbles per ISA 5.1 · states per IEC 60617 / IEEE C37.2 practice</text></svg>