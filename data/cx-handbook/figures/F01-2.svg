text><text x="460.0" y="178.0" font-size="12" font-weight="700" fill="#172b3a" text-anchor="middle">26 08 00</text><text x="830.0" y="178.0" font-size="12" font-weight="700" fill="#172b3a" text-anchor="middle">NETA ATS-2025 7.1, 7.4, 7.6, IEC 61439, IEC 60364-6</text><text x="1215.0" y="178.0" font-size="12" font-weight="700" fill="#172b3a" text-anchor="middle">PUIL 2020, Permenaker 12/2015</text><text x="46.0" y="203.5" font-size="12" font-weight="400" fill="#172b3a" text-anchor="start">Generators and fuel</text><text x="460.0" y="203.5" font-size="12" font-weight="700" fill="#172b3a" text-anchor="middle">26 08 00</text><text x="830.0" y="203.5" font-size="12" font-weight="700" fill="#172b3a" text-anchor="middle">ISO 8528-5, ISO 8528-6, NFPA 110</text><text x="1215.0" y="203.5" font-size="12" font-weight="700" fill="#172b3a" text-anchor="middle">generation SLO</text><text x="46.0" y="228.9" font-size="12" font-weight="400" fill="#172b3a" text-anchor="start">UPS and batteries</text><text x="460.0" y="228.9" font-size="12" font-weight="700" fill="#172b3a" text-anchor="middle">26 08 00</text><text x="830.0" y="228.9" font-size="12" font-weight="700" fill="#172b3a" text-anchor="middle">IEC 62040-3, IEEE 1188, IEEE 450, NETA 7.22</text><text x="1215.0" y="228.9" font-size="12" font-weight="700" fill="#172b3a" text-anchor="middle">NFPA 70E (DC arc flash)</text><text x="46.0" y="254.4" font-size="12" font-weight="400" fill="#172b3a" text-anchor="start">Chillers, pumps, dry coolers</text><text x="460.0" y="254.4" font-size="12" font-weight="700" fill="#172b3a" text-anchor="middle">Guideline 1.1, 23 08 00</text><text x="830.0" y="254.4" font-size="12" font-weight="700" fill="#172b3a" text-anchor="middle">AHRI 550/590, ASME B31.9, BG 29, CIBSE W</text><text x="1215.0" y="254.4" font-size="12" font-weight="700" fill="#172b3a" text-anchor="middle">refrigerant rules</text><text x="46.0" y="279.8" font-size="12" font-weight="400" fill="#172b3a" text-anchor="start">CRAH, fan walls, CDU</text><text x="460.0" y="279.8" font-size="12" font-weight="700" fill="#172b3a" text-anchor="middle">Guideline 1.1, 23 08 00</text><text x="830.0" y="279.8" font-size="12" font-weight="700" fill="#172b3a" text-anchor="middle">ASHRAE 111, NEBB, BG 49, TC 9.9, CDU OEM</text><text x="1215.0" y="279.8" font-size="12" font-weight="700" fill="#172b3a" text-anchor="middle">none</text><text x="46.0" y="305.2" font-size="12" font-weight="400" fill="#172b3a" text-anchor="start">Fire detection and suppression</text><text x="460.0" y="305.2" font-size="12" font-weight="700" fill="#172b3a" text-anchor="middle">28 08 00</text><text x="830.0" y="305.2" font-size="12" font-weight="700" fill="#172b3a" text-anchor="middle">NFPA 72, NFPA 2001, NFPA 13, NFPA 75</text><text x="1215.0" y="305.2" font-size="12" font-weight="700" fill="#172b3a" text-anchor="middle">Permen PU 26/2008, fire authority</text><text x="46.0" y="330.7" font-size="12" font-weight="400" fill="#172b3a" text-anchor="start">BMS</text><text x="460.0" y="330.7" font-size="12" font-weight="700" fill="#172b3a" text-anchor="middle">Guideline 13-2024</text><text x="830.0" y="330.7" font-size="12" font-weight="700" fill="#172b3a" text-anchor="middle">ASHRAE 135-2024, Guideline 36</text><text x="1215.0" y="330.7" font-size="12" font-weight="700" fill="#172b3a" text-anchor="middle">IEC 62443</text><text x="46.0" y="356.1" font-size="12" font-weight="400" fill="#172b3a" text-anchor="start">EPMS</text><text x="460.0" y="356.1" font-size="12" font-weight="700" fill="#172b3a" text-anchor="middle">26 08 00</text><text x="830.0" y="356.1" font-size="12" font-weight="700" fill="#172b3a" text-anchor="middle">IEC 61000-4-30, IEEE 1588, OEM manuals</text><text x="1215.0" y="356.1" font-size="12" font-weight="700" fill="#172b3a" text-anchor="middle">IEC 62443</text><text x="46.0" y="381.6" font-size="12" font-weight="400" fill="#172b3a" text-anchor="start">OT network and cabling</text><text x="460.0" y="381.6" font-size="12" font-weight="700" fill="#172b3a" text-anchor="middle">27 08 00</text><text x="830.0" y="381.6" font-size="12" font-weight="700" fill="#172b3a" text-anchor="middle">TIA-568.2-E, TIA-568.3-E, IEC 61300-3-35</text><text x="1215.0" y="381.6" font-size="12" font-weight="700" fill="#172b3a" text-anchor="middle">IEC 62443</text><text x="46.0" y="407.0" font-size="12" font-weight="400" fill="#172b3a" text-anchor="start">IST (L5)</text><text x="460.0" y="407.0" font-size="12" font-weight="700" fill="#172b3a" text-anchor="middle">Guideline 0, Uptime Topology</text><text x="830.0" y="407.0" font-size="12" font-weight="700" fill="#172b3a" text-anchor="middle">specification and OPR</text><text x="1215.0" y="407.0" font-size="12" font-weight="700" fill="#172b3a" text-anchor="middle">NFPA 70E, permit system</text><text x="24.0" y="30.0" font-size="17" font-weight="700" fill="#172b3a" text-anchor="start">F01-2  Reference documents by system: process, test values, and safety and law</text><text x="24.0" y="48.0" font-size="11" font-weight="400" fill="#5b6b78" text-anchor="start">eleven systems of a hyperscale building · each row names the first document to open · the specification section governs which standard applies</text><text x="32.0" y="451.3" font-size="10" font-weight="700" fill="#2d6a4f" text-anchor="start">WHAT TO PROVE</text><text x="32.0" y="467.3" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">• UPS acceptance values come from the specification and IEC 62040-3:2021; battery acceptance tests from IEEE 1188 or the lithium-ion OEM manual.</text><text x="32.0" y="482.3" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">• BMS tests use ANSI/ASHRAE 135-2024 and Guideline 13-2024; OT networks use TIA-568.2-E, TIA-568.3-E and IEC 62443-3-3.</text><rect x="24" y="515.28" width="1352" height="44" rx="0" fill="#f6f8fa" fill-opacity="1" stroke="#5b6b78" stroke-width="1"/><text x="32.0" y="529.3" font-size="11" font-weight="700" fill="#172b3a" text-anchor="start">F01-2  ·  Reference documents by system: process, test values, and safety and law</text><text x="1368.0" y="529.3" font-size="10" font-weight="400" fill="#5b6b78" text-anchor="end">Chapter 01 · §01.12</text><text x="32.0" y="542.3" font-size="9" font-weight="400" fill="#5b6b78" text-anchor="start">Data Centre Commissioning Field Manual R01 EN · October 2026 · educational reference, not to scale · project and OEM documents govern</text><text x="32.0" y="554.3" font-size="9" font-weight="400" fill="#5b6b78" text-anchor="start">Symbols: QElectroTech EN 60617 and P&amp;ID collections, CC-BY 3.0, native geometry · instrument bubbles per ISA 5.1 · states per IEC 60617 / IEEE C37.2 practice</text></svg>