<svg xmlns="http://www.w3.org/2000/svg" width="267mm" height="155.2mm" viewBox="0 0 1400 814" font-family="DejaVu Sans" role="img" aria-labelledby="t"><title id="t">F18-4 Heat-rejection modes and trim-chiller staging: states, conditions and timers</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="context-stroke"/></marker><marker id="arrow-simple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#172b3a"/></marker><marker id="arrow-475569" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#475569"/></marker><marker id="arrow-b91c1c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#b91c1c"/></marker></defs><rect width="1400" height="814" fill="#ffffff"/><rect x="4" y="4" width="1392" height="806" fill="none" stroke="#172b3a" stroke-width="1.6"/><rect x="24" y="634.0" width="1352" height="56" rx="4" fill="#f1f8f4" fill-opacity="1" stroke="#2d6a4f" stroke-width="1"/><polyline points="290.0,178.0 410.0,178.0" fill="none" stroke="#475569" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#arrow-475569)"/><polyline points="660.0,178.0 780.0,178.0" fill="none" stroke="#475569" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#arrow-475569)"/><polyline points="905.0,216.0 905.0,326.0" fill="none" stroke="#b91c1c" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#arrow-b91c1c)"/><polyline points="780.0,364.0 660.0,364.0" fill="none" stroke="#475569" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#arrow-475569)"/><rect x="40" y="140" width="250" height="76" rx="14" fill="#ffffff" fill-opacity="1" stroke="#172b3a" stroke-width="1.4"/><rect x="410" y="140" width="250" height="76" rx="14"