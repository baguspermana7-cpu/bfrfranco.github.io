pacity="1" stroke="#9fb0bb" stroke-width="0.8"/><rect x="1008.0" y="524.0" width="352.0" height="22.0" rx="0" fill="#ffffff" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><rect x="40" y="546.0" width="205.33333333333331" height="22.0" rx="0" fill="#ffffff" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><rect x="245.33333333333331" y="546.0" width="469.3333333333333" height="22.0" rx="0" fill="#ffffff" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><rect x="714.6666666666666" y="546.0" width="293.3333333333333" height="22.0" rx="0" fill="#ffffff" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><rect x="1008.0" y="546.0" width="352.0" height="22.0" rx="0" fill="#ffffff" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><rect x="40" y="568.0" width="205.33333333333331" height="22.0" rx="0" fill="#ffffff" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><rect x="245.33333333333331" y="568.0" width="469.3333333333333" height="22.0" rx="0" fill="#ffffff" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><rect x="714.6666666666666" y="568.0" width="293.3333333333333" height="22.0" rx="0" fill="#ffffff" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><rect x="1008.0" y="568.0" width="352.0" height="22.0" rx="0" fill="#ffffff" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><rect x="40" y="590.0" width="205.33333333333331" height="22.0" rx="0" fill="#ffffff" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><rect x="245.33333333333331" y="590.0" width="469.3333333333333" height="22.0" rx="0" fill="#ffffff" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><rect x="714.6666666666666" y="590.0" width="293.3333333333333" height="22.0" rx="0" fill="#ffffff" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><rect x="1008.0" y="590.0" width="352.0" height="22.0" rx="0" fill="#ffffff" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><text x="165.0" y="162.9" font-size="12" font-weight="700" fill="#172b3a" text-anchor="middle">M1 DRY COOLER ONLY</text><text x="165.0" y="176.4" font-size="10" font-weight="400" fill="#172b3a" text-anchor="middle">dry-bulb ≤ 27 °C</text><text x="165.0" y="189.9" font-size="10" font-weight="400" fill="#172b3a" text-anchor="middle">chillers off</text><text x="535.0" y="162.9" font-size="12" font-weight="700" fill="#172b3a" text-anchor="middle">M2 ADIABATIC</text><text x="535.0" y="176.4" font-size="10" font-weight="400" fill="#172b3a" text-anchor="middle">pads wetted</text><text x="535.0" y="189.9" font-size="10" font-weight="400" fill="#172b3a" text-anchor="middle">chillers off</text><text x="905.0" y="162.9" font-size="12" font-weight="700" fill="#172b3a" text-anchor="middle">M3 TRIM CHILLERS</text><text x="905.0" y="176.4" font-size="10" font-weight="400" fill="#172b3a" text-anchor="middle">N chillers running</text><text x="905.0" y="189.9" font-size="10" font-weight="400" fill="#172b3a" text-anchor="middle">staged by load</text><text x="535.0" y="348.9" font-size="12" font-weight="700" fill="#172b3a" text-anchor="middle">MAINTENANCE</text><text x="535.0" y="362.4" font-size="10" font-weight="400" fill="#172b3a" text-anchor="middle">unit isolated</text><text x="535.0" y="375.9" font-size="10" font-weight="400" fill="#172b3a" text-anchor="middle">removed from rotation</text><text x="905.0" y="348.9" font-size="12" font-weight="700" fill="#172b3a" text-anchor="middle">CHILLER FAULT</text><text x="905.0" y="362.4" font-size="10" font-weight="400" fill="#172b3a" text-anchor="middle">next chiller start</text><text x="905.0" y="375.9" font-size="10" font-weight="400" fill="#172b3a" text-anchor="middle">at once, ≤ 3 min</text><text x="915.0" y="258.0" font-size="10.5" font-weight="400" fill="#b91c1c" text-anchor="start">trip</text><text x="40.0" y="420.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">Forward arrows: M1 → M2 when dry-bulb &gt; 27 °C or FWS &gt; set point + 0.5 K for 5 min; M2 → M3 when FWS &gt; set point + 0.5 K for 5 min.</text><text x="40.0" y="442.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">Return: M3 → M2 when the last chiller stages off; M2 → M1 when dry-bulb ≤ 27 °C for 15 min and FWS supply ≤ set point. Faulted chiller goes to MAINTENANCE until reset.</text><text x="45.0" y="495.0" font-size="11" font-weight="700" fill="#172b3a" text-anchor="start">Rule</text><text x="250.3" y="495.0" font-size="11" font-weight="700" fill="#172b3a" text-anchor="start">Condition (example)</text><text x="719.7" y="495.0" font-size="11" font-weight="700" fill="#172b3a" text-anchor="start">Timer</text><text x="1013.0" y="495.0" font-size="11" font-weight="700" fill="#172b3a" text-anchor="start">Record field</text><text x="45.0" y="517.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">Stage up</text><text x="250.3" y="517.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">running chillers &gt; 90 % load, or FWS supply &gt; set point + 0.5 K</text><text x="719.7" y="517.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">10 min / 5 min</text><text x="1013.0" y="517.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">time, FWS supply, chillers running</text><text x="45.0" y="539.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">Stage down</text><text x="250.3" y="539.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">load can be carried by N − 1 chillers at &lt; 70 % load</text><text x="719.7" y="539.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">15 min</text><text x="1013.0" y="539.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">time, load, chillers running</text><text x="45.0" y="561.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">Minimum run and off time</text><text x="250.3" y="561.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">protects compressor from cycling</text><text x="719.7" y="561.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">15 min run, 10 min off or OEM anti-recycle</text><text x="1013.0" y="561.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">starts per hour</text><text x="45.0" y="583.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">Chiller fault</text><text x="250.3" y="583.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">next available chiller started without stage-up timer</text><text x="719.7" y="583.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">≤ 3 min to running (OEM value)</text><text x="1013.0" y="583.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">peak FWS supply against 38 °C alarm</text><text x="45.0" y="605.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">Power restoration</text><text x="250.3" y="605.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">timed restart to keep generator step load inside limit</text><text x="719.7" y="605.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">per sequence</text><text x="1013.0" y="605.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">restart times per chiller</text><text x="24.0" y="30.0" font-size="17" font-weight="700" fill="#172b3a" text-anchor="start">F18-4  Heat-rejection modes and trim-chiller staging: states, conditions and timers</text><text x="24.0" y="48.0" font-size="10" font-weight="400" fill="#5b6b78" text-anchor="start">M1 dry cooler only at dry-bulb ≤ 27 °C · M2 adiabatic · M3 trim chillers 1 to 8 duty + 1 standby · stage up &gt; 90 % load for 10 min or FWS &gt; set point + 0.5 K for 5 min · stage down when N − 1 &lt; 70 % for 15 min · next chiller ≤ 3 min after a</text><text x="24.0" y="61.0" font-size="10" font-weight="400" fill="#5b6b78" text-anchor="start">fault</text><text x="32.0" y="648.0" font-size="10" font-weight="700" fill="#2d6a4f" text-anchor="start">WHAT TO PROVE</text><text x="32.0" y="664.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">• The trim chillers are enabled only in M3, after FWS supply has stayed above set point + 0.5 K for 5 minutes in M2.</text><text x="32.0" y="679.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">• After a chiller fault the next available chiller is running within 3 minutes and the FWS supply stays below the 38 °C CDU alarm (36.9 °C peak in the test record).</text><text x="24.0" y="714.0" font-size="10" font-weight="700" fill="#5b6b78" text-anchor="start">LEGEND</text><line x1="24" y1="736.0" x2="50" y2="736.0" stroke="#475569" stroke-width="3"/><text x="56.0" y="740.0" font-size="10" font-weight="400" fill="#172b3a" text-anchor="start">signal / control</text><line x1="151.9671875" y1="736.0" x2="177.9671875" y2="736.0" stroke="#b91c1c" stroke-width="3"/><text x="184.0" y="740.0" font-size="10" font-weight="400" fill="#172b3a" text-anchor="start">trip / protection</text><rect x="24" y="754.0" width="1352" height="44" rx="0" fill="#f6f8fa" fill-opacity="1" stroke="#5b6b78" stroke-width="1"/><text x="32.0" y="768.0" font-size="11" font-weight="700" fill="#172b3a" text-anchor="start">F18-4  ·  Heat-rejection modes and trim-chiller staging: states, conditions and timers</text><text x="1368.0" y="768.0" font-size="10" font-weight="400" fill="#5b6b78" text-anchor="end">Chapter 18 · §18.8</text><text x="32.0" y="781.0" font-size="9" font-weight="400" fill="#5b6b78" text-anchor="start">Data Centre Commissioning Field Manual R01 EN · October 2026 · educational reference, not to scale · project and OEM documents govern</text><text x="32.0" y="793.0" font-size="9" font-weight="400" fill="#5b6b78" text-anchor="start">Symbols: QElectroTech EN 60617 and P&amp;ID collections, CC-BY 3.0, native geometry · instrument bubbles per ISA 5.1 · states per IEC 60617 / IEEE C37.2 practice</text></svg>