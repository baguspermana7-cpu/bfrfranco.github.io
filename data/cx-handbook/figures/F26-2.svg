eight="22.0" rx="0" fill="#ffffff" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><rect x="1083.7209302325582" y="526.0" width="276.27906976744185" height="22.0" rx="0" fill="#ffffff" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><rect x="40" y="548.0" width="153.48837209302326" height="22.0" rx="0" fill="#ffffff" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><rect x="193.48837209302326" y="548.0" width="276.27906976744185" height="22.0" rx="0" fill="#ffffff" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><rect x="469.7674418604651" y="548.0" width="399.0697674418605" height="22.0" rx="0" fill="#ffffff" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><rect x="868.8372093023256" y="548.0" width="214.88372093023253" height="22.0" rx="0" fill="#ffffff" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><rect x="1083.7209302325582" y="548.0" width="276.27906976744185" height="22.0" rx="0" fill="#ffffff" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><text x="48.0" y="152.0" font-size="11" font-weight="700" fill="#172b3a" text-anchor="start">Fibre cut</text><text x="48.0" y="208.0" font-size="11" font-weight="700" fill="#172b3a" text-anchor="start">RSTP ring, 8 switches</text><text x="48.0" y="264.0" font-size="11" font-weight="700" fill="#172b3a" text-anchor="start">MRP ring, 12 switches</text><text x="48.0" y="320.0" font-size="11" font-weight="700" fill="#172b3a" text-anchor="start">PRP pair</text><text x="48.0" y="376.0" font-size="11" font-weight="700" fill="#172b3a" text-anchor="start">Restore</text><text x="190.0" y="414.0" font-size="10" font-weight="400" fill="#5b6b78" text-anchor="middle">0 ms</text><text x="357.1" y="414.0" font-size="10" font-weight="400" fill="#5b6b78" text-anchor="middle">300 ms</text><text x="524.3" y="414.0" font-size="10" font-weight="400" fill="#5b6b78" text-anchor="middle">600 ms</text><text x="691.4" y="414.0" font-size="10" font-weight="400" fill="#5b6b78" text-anchor="middle">900 ms</text><text x="858.6" y="414.0" font-size="10" font-weight="400" fill="#5b6b78" text-anchor="middle">1200 ms</text><text x="1025.7" y="414.0" font-size="10" font-weight="400" fill="#5b6b78" text-anchor="middle">1500 ms</text><text x="1192.9" y="414.0" font-size="10" font-weight="400" fill="#5b6b78" text-anchor="middle">1800 ms</text><text x="1360.0" y="414.0" font-size="10" font-weight="400" fill="#5b6b78" text-anchor="middle">2100 ms</text><text x="197.0" y="152.0" font-size="10" font-weight="400" fill="#b91c1c" text-anchor="start">cut at t = 0</text><text x="195.0" y="208.0" font-size="10" font-weight="400" fill="#172b3a" text-anchor="start">640 ms no traffic</text><text x="208.8" y="264.0" font-size="10" font-weight="400" fill="#b45309" text-anchor="start">23 ms</text><text x="197.0" y="320.0" font-size="10" font-weight="400" fill="#334155" text-anchor="start">0 ms, no frame lost</text><text x="1032.7" y="376.0" font-size="10" font-weight="400" fill="#475569" text-anchor="start">link restored at 1,500 ms; MRP 0 lost, RSTP 2 lost</text><text x="45.0" y="475.0" font-size="11" font-weight="700" fill="#172b3a" text-anchor="start">Protocol</text><text x="198.5" y="475.0" font-size="11" font-weight="700" fill="#172b3a" text-anchor="start">Standard</text><text x="474.8" y="475.0" font-size="11" font-weight="700" fill="#172b3a" text-anchor="start">Worst-case recovery</text><text x="873.8" y="475.0" font-size="11" font-weight="700" fill="#172b3a" text-anchor="start">Measured (example)</text><text x="1088.7" y="475.0" font-size="11" font-weight="700" fill="#172b3a" text-anchor="start">Acceptance</text><text x="45.0" y="497.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">RSTP</text><text x="198.5" y="497.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">IEEE 802.1Q (formerly 802.1w)</text><text x="474.8" y="497.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">no fixed bound, depends on topology</text><text x="873.8" y="497.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">640 ms</text><text x="1088.7" y="497.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">project value, for example ≤ 1 s</text><text x="45.0" y="519.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">MRP</text><text x="198.5" y="519.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">IEC 62439-2</text><text x="474.8" y="519.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">500, 200 or 30 ms up to 50 switches; 10 ms up to 14</text><text x="873.8" y="519.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">23 ms</text><text x="1088.7" y="519.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">≤ configured profile</text><text x="45.0" y="541.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">PRP</text><text x="198.5" y="541.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">IEC 62439-3</text><text x="474.8" y="541.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">zero recovery time</text><text x="873.8" y="541.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">0 ms</text><text x="1088.7" y="541.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">0 lost frames</text><text x="45.0" y="563.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">HSR</text><text x="198.5" y="563.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">IEC 62439-3</text><text x="474.8" y="563.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">zero recovery time</text><text x="873.8" y="563.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">not used</text><text x="1088.7" y="563.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">0 lost frames</text><text x="24.0" y="30.0" font-size="17" font-weight="700" fill="#172b3a" text-anchor="start">F26-2  Ring failover test: traffic loss after a fibre cut for RSTP, MRP and PRP (example results)</text><text x="24.0" y="48.0" font-size="11" font-weight="400" fill="#5b6b78" text-anchor="start">test traffic: one frame every 1 ms between end devices · recovery time = lost frames x 1 ms · RSTP ring of 8 switches 640 ms · MRP ring of 12 switches 23 ms (200 ms profile) · PRP 0 ms · cut at t = 0</text><text x="32.0" y="606.0" font-size="10" font-weight="700" fill="#2d6a4f" text-anchor="start">WHAT TO PROVE</text><text x="32.0" y="622.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">• MRP: 23 lost frames at 1 ms spacing = 23 ms, inside the 200 ms worst case of the configured profile (IEC 62439-2); PRP: zero lost frames because the second LAN carries a copy.</text><text x="32.0" y="637.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">• RSTP: 640 ms measured; RSTP has no guaranteed bound, so the project specification sets the acceptance value and the test repeats at each ring position.</text><rect x="24" y="670.0" width="1352" height="44" rx="0" fill="#f6f8fa" fill-opacity="1" stroke="#5b6b78" stroke-width="1"/><text x="32.0" y="684.0" font-size="11" font-weight="700" fill="#172b3a" text-anchor="start">F26-2  ·  Ring failover test: traffic loss after a fibre cut for RSTP, MRP and PRP (example results)</text><text x="1368.0" y="684.0" font-size="10" font-weight="400" fill="#5b6b78" text-anchor="end">Chapter 26 · §26.2</text><text x="32.0" y="697.0" font-size="9" font-weight="400" fill="#5b6b78" text-anchor="start">Data Centre Commissioning Field Manual R01 EN · October 2026 · educational reference, not to scale · project and OEM documents govern</text><text x="32.0" y="709.0" font-size="9" font-weight="400" fill="#5b6b78" text-anchor="start">Symbols: QElectroTech EN 60617 and P&amp;ID collections, CC-BY 3.0, native geometry · instrument bubbles per ISA 5.1 · states per IEC 60617 / IEEE C37.2 practice</text></svg>