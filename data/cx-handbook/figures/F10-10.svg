8.0" font-size="11" font-weight="700" fill="#172b3a" text-anchor="start">Draft</text><text x="48.0" y="204.0" font-size="11" font-weight="700" fill="#172b3a" text-anchor="start">Check</text><text x="48.0" y="240.0" font-size="11" font-weight="700" fill="#172b3a" text-anchor="start">Approve, issue</text><text x="48.0" y="276.0" font-size="11" font-weight="700" fill="#172b3a" text-anchor="start">Trade notice</text><text x="48.0" y="312.0" font-size="11" font-weight="700" fill="#172b3a" text-anchor="start">Rehearsal</text><text x="48.0" y="348.0" font-size="11" font-weight="700" fill="#172b3a" text-anchor="start">Day of switching</text><text x="190.0" y="376.0" font-size="10" font-weight="400" fill="#5b6b78" text-anchor="middle">-10 WD</text><text x="260.0" y="376.0" font-size="10" font-weight="400" fill="#5b6b78" text-anchor="middle">-9 WD</text><text x="330.0" y="376.0" font-size="10" font-weight="400" fill="#5b6b78" text-anchor="middle">-8 WD</text><text x="400.0" y="376.0" font-size="10" font-weight="400" fill="#5b6b78" text-anchor="middle">-7 WD</text><text x="470.0" y="376.0" font-size="10" font-weight="400" fill="#5b6b78" text-anchor="middle">-6 WD</text><text x="540.0" y="376.0" font-size="10" font-weight="400" fill="#5b6b78" text-anchor="middle">-5 WD</text><text x="610.0" y="376.0" font-size="10" font-weight="400" fill="#5b6b78" text-anchor="middle">-4 WD</text><text x="680.0" y="376.0" font-size="10" font-weight="400" fill="#5b6b78" text-anchor="middle">-3 WD</text><text x="750.0" y="376.0" font-size="10" font-weight="400" fill="#5b6b78" text-anchor="middle">-2 WD</text><text x="820.0" y="376.0" font-size="10" font-weight="400" fill="#5b6b78" text-anchor="middle">-1 WD</text><text x="890.0" y="376.0" font-size="10" font-weight="400" fill="#5b6b78" text-anchor="middle">0 WD</text><text x="960.0" y="376.0" font-size="10" font-weight="400" fill="#5b6b78" text-anchor="middle">1 WD</text><text x="195.0" y="132.0" font-size="10" font-weight="400" fill="#172b3a" text-anchor="start">CxM or package manager</text><text x="405.0" y="168.0" font-size="10" font-weight="400" fill="#172b3a" text-anchor="start">SAP</text><text x="545.0" y="204.0" font-size="10" font-weight="400" fill="#172b3a" text-anchor="start">checker SAP, SLD, walk</text><text x="756.0" y="240.0" font-size="10" font-weight="400" fill="#b91c1c" text-anchor="start">control person</text><text x="826.0" y="276.0" font-size="10" font-weight="400" fill="#475569" text-anchor="start">PTW coordinator</text><text x="814.0" y="312.0" font-size="10" font-weight="400" fill="#475569" text-anchor="end">SAP and assistant</text><text x="884.0" y="348.0" font-size="10" font-weight="400" fill="#b91c1c" text-anchor="end">brief, switch, report</text><text x="40.0" y="416.0" font-size="12" font-weight="700" fill="#172b3a" text-anchor="start">Day of switching (10.4.4 steps 1 to 6)</text><text x="122.5" y="443.8" font-size="12" font-weight="700" fill="#475569" text-anchor="middle">1 Brief</text><text x="122.5" y="457.3" font-size="10" font-weight="400" fill="#172b3a" text-anchor="middle">SAP reads stop rule</text><text x="122.5" y="470.8" font-size="10" font-weight="400" fill="#172b3a" text-anchor="middle">all sign the sheet</text><text x="311.5" y="443.8" font-size="12" font-weight="700" fill="#475569" text-anchor="middle">2 Preconditions</text><text x="311.5" y="457.3" font-size="10" font-weight="400" fill="#172b3a" text-anchor="middle">permits cancelled</text><text x="311.5" y="470.8" font-size="10" font-weight="400" fill="#172b3a" text-anchor="middle">earths removed</text><text x="500.5" y="443.8" font-size="12" font-weight="700" fill="#475569" text-anchor="middle">3 Permission</text><text x="500.5" y="457.3" font-size="10" font-weight="400" fill="#172b3a" text-anchor="middle">control person</text><text x="500.5" y="470.8" font-size="10" font-weight="400" fill="#172b3a" text-anchor="middle">logs start time</text><text x="689.5" y="443.8" font-size="12" font-weight="700" fill="#475569" text-anchor="middle">4 Read, act</text><text x="689.5" y="457.3" font-size="10" font-weight="400" fill="#172b3a" text-anchor="middle">assistant reads,</text><text x="689.5" y="470.8" font-size="10" font-weight="400" fill="#172b3a" text-anchor="middle">SAP repeats, acts</text><text x="878.5" y="443.8" font-size="12" font-weight="700" fill="#475569" text-anchor="middle">6 Report</text><text x="878.5" y="457.3" font-size="10" font-weight="400" fill="#172b3a" text-anchor="middle">final network state</text><text x="878.5" y="470.8" font-size="10" font-weight="400" fill="#172b3a" text-anchor="middle">board and EPMS</text><text x="689.5" y="551.6" font-size="12" font-weight="700" fill="#b91c1c" text-anchor="middle">5 Stop on deviation</text><text x="689.5" y="565.1" font-size="10" font-weight="400" fill="#172b3a" text-anchor="middle">make safe, call control person</text><text x="689.5" y="578.6" font-size="10" font-weight="400" fill="#172b3a" text-anchor="middle">no step is improvised</text><text x="45.0" y="641.2" font-size="11.5" font-weight="700" fill="#172b3a" text-anchor="start">Role</text><text x="221.9" y="641.2" font-size="11.5" font-weight="700" fill="#172b3a" text-anchor="start">Duty on the day</text><text x="45.0" y="664.2" font-size="11.5" font-weight="400" fill="#172b3a" text-anchor="start">SAP</text><text x="221.9" y="664.2" font-size="11.5" font-weight="400" fill="#172b3a" text-anchor="start">repeats the tag and action, hand on device, operates, reads the indication</text><text x="45.0" y="687.2" font-size="11.5" font-weight="400" fill="#172b3a" text-anchor="start">Assistant</text><text x="221.9" y="687.2" font-size="11.5" font-weight="400" fill="#172b3a" text-anchor="start">reads each step aloud, writes the time and the actual indication</text><text x="45.0" y="710.2" font-size="11.5" font-weight="400" fill="#172b3a" text-anchor="start">Control person</text><text x="221.9" y="710.2" font-size="11.5" font-weight="400" fill="#172b3a" text-anchor="start">gives permission to start, keeps the network status board</text><text x="45.0" y="733.2" font-size="11.5" font-weight="400" fill="#172b3a" text-anchor="start">CxM</text><text x="221.9" y="733.2" font-size="11.5" font-weight="400" fill="#172b3a" text-anchor="start">confirms test scope and limits, witnesses energisation</text><text x="24.0" y="30.0" font-size="17" font-weight="700" fill="#172b3a" text-anchor="start">F10-10  Switching programme approval timeline and the day-of-switching sequence</text><text x="24.0" y="48.0" font-size="11" font-weight="400" fill="#5b6b78" text-anchor="start">working days before the day: request 10 · draft 7 · check 5 · approval 3 · trade notice 2 (48 h) · rehearsal 1 · briefing 30 min before step 1</text><text x="32.0" y="776.6" font-size="10" font-weight="700" fill="#2d6a4f" text-anchor="start">WHAT TO PROVE</text><text x="32.0" y="792.6" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">• The programme is approved and issued 3 working days before the day; all trades get 48 hours notice.</text><text x="32.0" y="807.6" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">• If an indication differs from the expected one, the SAP stops; a changed step needs a written revision.</text><text x="24.0" y="842.6" font-size="10" font-weight="700" fill="#5b6b78" text-anchor="start">LEGEND</text><line x1="24" y1="864.5999999999999" x2="50" y2="864.5999999999999" stroke="#475569" stroke-width="3"/><text x="56.0" y="868.6" font-size="10" font-weight="400" fill="#172b3a" text-anchor="start">signal / control</text><line x1="151.9671875" y1="864.5999999999999" x2="177.9671875" y2="864.5999999999999" stroke="#b91c1c" stroke-width="3"/><text x="184.0" y="868.6" font-size="10" font-weight="400" fill="#172b3a" text-anchor="start">trip / protection</text><rect x="24" y="882.5999999999999" width="952" height="44" rx="0" fill="#f6f8fa" fill-opacity="1" stroke="#5b6b78" stroke-width="1"/><text x="32.0" y="896.6" font-size="11" font-weight="700" fill="#172b3a" text-anchor="start">F10-10  ·  Switching programme approval timeline and the day-of-switching sequence</text><text x="968.0" y="896.6" font-size="10" font-weight="400" fill="#5b6b78" text-anchor="end">Chapter 10 · §10.4.4</text><text x="32.0" y="909.6" font-size="9" font-weight="400" fill="#5b6b78" text-anchor="start">Data Centre Commissioning Field Manual R01 EN · October 2026 · educational reference, not to scale · project and OEM documents govern</text><text x="32.0" y="921.6" font-size="9" font-weight="400" fill="#5b6b78" text-anchor="start">Symbols: QElectroTech EN 60617 and P&amp;ID collections, CC-BY 3.0, native geometry · instrument bubbles per ISA 5.1 · states per IEC 60617 / IEEE C37.2 practice</text></svg>