× 0.3 dB = 0.30 dB · limit 2.42 dB</text><text x="32.0" y="557.0" font-size="10" font-weight="700" fill="#2d6a4f" text-anchor="start">WHAT TO PROVE</text><text x="32.0" y="573.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">• 0.62 + 1.50 + 0.30 = 2.42 dB maximum link loss at 1310 nm.</text><text x="32.0" y="588.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">• Connectors take 1.50 of 2.42 dB, which is 62 % of the budget.</text><rect x="24" y="621" width="952" height="44" rx="0" fill="#f6f8fa" fill-opacity="1" stroke="#5b6b78" stroke-width="1"/><text x="32.0" y="635.0" font-size="11" font-weight="700" fill="#172b3a" text-anchor="start">F05-8  ·  OS2 backbone loss budget at 1310 nm, RFI-B2-ICT-0033</text><text x="968.0" y="635.0" font-size="10" font-weight="400" fill="#5b6b78" text-anchor="end">Chapter 05 · §05.12.5</text><text x="32.0" y="648.0" font-size="9" font-weight="400" fill="#5b6b78" text-anchor="start">Data Centre Commissioning Field Manual R01 EN · October 2026 · educational reference, not to scale · project and OEM documents govern</text><text x="32.0" y="660.0" font-size="9" font-weight="400" fill="#5b6b78" text-anchor="start">Symbols: QElectroTech EN 60617 and P&amp;ID collections, CC-BY 3.0, native geometry · instrument bubbles per ISA 5.1 · states per IEC 60617 / IEEE C37.2 practice</text></svg>