level and MSC-1 example (dark: levels 1 to 5, use and location; blue: 6 to 9)</text><text x="640.0" y="104.0" font-size="12" font-weight="700" fill="#172b3a" text-anchor="start">Held in the CMMS as</text><text x="52.0" y="131.7" font-size="12" font-weight="700" fill="#334155" text-anchor="start">1 Industry</text><text x="52.0" y="145.2" font-size="10" font-weight="400" fill="#172b3a" text-anchor="start">data centre</text><text x="800.0" y="138.0" font-size="11" font-weight="700" fill="#475569" text-anchor="middle">not held (implicit)</text><text x="52.0" y="195.7" font-size="12" font-weight="700" fill="#334155" text-anchor="start">2 Business category</text><text x="52.0" y="209.2" font-size="10" font-weight="400" fill="#172b3a" text-anchor="start">campus operations</text><text x="800.0" y="202.0" font-size="11" font-weight="700" fill="#475569" text-anchor="middle">site group</text><text x="52.0" y="259.7" font-size="12" font-weight="700" fill="#334155" text-anchor="start">3 Installation</text><text x="52.0" y="273.2" font-size="10" font-weight="400" fill="#172b3a" text-anchor="start">MSC-1</text><text x="800.0" y="265.9" font-size="11" font-weight="700" fill="#475569" text-anchor="middle">site record</text><text x="52.0" y="323.7" font-size="12" font-weight="700" fill="#334155" text-anchor="start">4 Plant or unit</text><text x="52.0" y="337.2" font-size="10" font-weight="400" fill="#172b3a" text-anchor="start">building B2</text><text x="800.0" y="329.9" font-size="11" font-weight="700" fill="#475569" text-anchor="middle">location record</text><text x="52.0" y="387.7" font-size="12" font-weight="700" fill="#334155" text-anchor="start">5 Section or system</text><text x="52.0" y="401.2" font-size="10" font-weight="400" fill="#172b3a" text-anchor="start">B2 low-voltage power</text><text x="800.0" y="393.9" font-size="11" font-weight="700" fill="#475569" text-anchor="middle">system code on each asset</text><text x="52.0" y="451.7" font-size="12" font-weight="700" fill="#1d4ed8" text-anchor="start">6 Equipment unit</text><text x="52.0" y="465.2" font-size="10" font-weight="400" fill="#172b3a" text-anchor="start">B2-UPS-A1, 2,500 kW</text><text x="800.0" y="457.9" font-size="11" font-weight="700" fill="#475569" text-anchor="middle">asset record, criticality A</text><text x="52.0" y="515.6" font-size="12" font-weight="700" fill="#1d4ed8" text-anchor="start">7 Subunit</text><text x="52.0" y="529.1" font-size="10" font-weight="400" fill="#172b3a" text-anchor="start">UPS module 3, battery string 2</text><text x="800.0" y="521.9" font-size="11" font-weight="700" fill="#475569" text-anchor="middle">child asset record with own PM</text><text x="52.0" y="579.6" font-size="12" font-weight="700" fill="#1d4ed8" text-anchor="start">8 Maintainable item</text><text x="52.0" y="593.1" font-size="10" font-weight="400" fill="#172b3a" text-anchor="start">DC capacitor bank, fan assembly</text><text x="800.0" y="585.9" font-size="11" font-weight="700" fill="#475569" text-anchor="middle">named in the PM task text</text><text x="52.0" y="643.6" font-size="12" font-weight="700" fill="#1d4ed8" text-anchor="start">9 Part</text><text x="52.0" y="657.1" font-size="10" font-weight="400" fill="#172b3a" text-anchor="start">fuse, filter element</text><text x="800.0" y="649.9" font-size="11" font-weight="700" fill="#475569" text-anchor="middle">spare parts list SP-UPS-A1</text><text x="45.0" y="717.0" font-size="11" font-weight="700" fill="#172b3a" text-anchor="start">Building B2 count (27.4.5)</text><text x="307.9" y="717.0" font-size="11" font-weight="700" fill="#172b3a" text-anchor="start">Records</text><text x="472.1" y="717.0" font-size="11" font-weight="700" fill="#172b3a" text-anchor="start">Basis</text><text x="45.0" y="739.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">Level 6 equipment units</text><text x="307.9" y="739.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">2,868</text><text x="472.1" y="739.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">17 generators to 1,900 fire, valve and sensor items</text><text x="45.0" y="761.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">Level 7 subunits</text><text x="307.9" y="761.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">202</text><text x="472.1" y="761.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">engines, alternators, UPS modules, battery strings</text><text x="45.0" y="783.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">Collection effort</text><text x="307.9" y="783.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">26 person-days</text><text x="472.1" y="783.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">3,070 records at 120 records per person-day</text><text x="24.0" y="30.0" font-size="17" font-weight="700" fill="#172b3a" text-anchor="start">F27-6  ISO 14224 levels for UPS B2-UPS-A1 and where each level sits in the CMMS</text><text x="24.0" y="48.0" font-size="10" font-weight="400" fill="#5b6b78" text-anchor="start">levels 1 to 5 use and location · levels 6 to 9 equipment subdivision · level 6 is the reporting level · building B2: 2,868 level 6 records, 202 level 7 records, 26 person-days at</text><text x="24.0" y="61.0" font-size="10" font-weight="400" fill="#5b6b78" text-anchor="start">120 records per day</text><text x="32.0" y="826.0" font-size="10" font-weight="700" fill="#2d6a4f" text-anchor="start">WHAT TO PROVE</text><text x="32.0" y="842.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">• B2-UPS-A1 is one level 6 record with criticality A; battery string 2 is a level 7 record because it has its own quarterly impedance test.</text><text x="32.0" y="857.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">• Fuses and filter elements (level 9) are not asset records; they sit in spare parts list SP-UPS-A1 linked to the asset.</text><text x="24.0" y="892.0" font-size="10" font-weight="700" fill="#5b6b78" text-anchor="start">LEGEND</text><line x1="24" y1="914.0" x2="50" y2="914.0" stroke="#334155" stroke-width="3"/><text x="56.0" y="918.0" font-size="10" font-weight="400" fill="#172b3a" text-anchor="start">data / network</text><line x1="150.859375" y1="914.0" x2="176.859375" y2="914.0" stroke="#475569" stroke-width="3"/><text x="182.9" y="918.0" font-size="10" font-weight="400" fill="#172b3a" text-anchor="start">signal / control</text><line x1="278.8265625" y1="914.0" x2="304.8265625" y2="914.0" stroke="#1d4ed8" stroke-width="3"/><text x="310.8" y="918.0" font-size="10" font-weight="400" fill="#172b3a" text-anchor="start">415 V</text><rect x="24" y="932.0" width="952" height="44" rx="0" fill="#f6f8fa" fill-opacity="1" stroke="#5b6b78" stroke-width="1"/><text x="32.0" y="946.0" font-size="11" font-weight="700" fill="#172b3a" text-anchor="start">F27-6  ·  ISO 14224 levels for UPS B2-UPS-A1 and where each level sits in the CMMS</text><text x="968.0" y="946.0" font-size="10" font-weight="400" fill="#5b6b78" text-anchor="end">Chapter 27 · §27.4.2</text><text x="32.0" y="959.0" font-size="9" font-weight="400" fill="#5b6b78" text-anchor="start">Data Centre Commissioning Field Manual R01 EN · October 2026 · educational reference, not to scale · project and OEM documents govern</text><text x="32.0" y="971.0" font-size="9" font-weight="400" fill="#5b6b78" text-anchor="start">Symbols: QElectroTech EN 60617 and P&amp;ID collections, CC-BY 3.0, native geometry · instrument bubbles per ISA 5.1 · states per IEC 60617 / IEEE C37.2 practice</text></svg>