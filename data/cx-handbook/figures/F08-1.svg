 font-size="11.5" font-weight="400" fill="#172b3a" text-anchor="start">3.7: 42 days agreement, 42 days determination</text><text x="45.0" y="511.6" font-size="11.5" font-weight="400" fill="#172b3a" text-anchor="start">NEC4 ECC</text><text x="233.6" y="511.6" font-size="11.5" font-weight="400" fill="#172b3a" text-anchor="start">61.3: 8 weeks after awareness</text><text x="552.7" y="511.6" font-size="11.5" font-weight="400" fill="#172b3a" text-anchor="start">62.3: 3 weeks after instruction to quote</text><text x="929.8" y="511.6" font-size="11.5" font-weight="400" fill="#172b3a" text-anchor="start">62.3: PM reply 2 weeks; 64 own assessment</text><text x="45.0" y="534.6" font-size="11.5" font-weight="400" fill="#172b3a" text-anchor="start">AIA A201-2017</text><text x="233.6" y="534.6" font-size="11.5" font-weight="400" fill="#172b3a" text-anchor="start">15.1.3.1: 21 days</text><text x="552.7" y="534.6" font-size="11.5" font-weight="400" fill="#172b3a" text-anchor="start">7.1.6: itemised proposal</text><text x="929.8" y="534.6" font-size="11.5" font-weight="400" fill="#172b3a" text-anchor="start">7.2 change order or 7.3 CCD</text><text x="45.0" y="557.6" font-size="11.5" font-weight="400" fill="#172b3a" text-anchor="start">Perpres 16/2018</text><text x="233.6" y="557.6" font-size="11.5" font-weight="400" fill="#172b3a" text-anchor="start">as the contract</text><text x="552.7" y="557.6" font-size="11.5" font-weight="400" fill="#172b3a" text-anchor="start">as the contract</text><text x="929.8" y="557.6" font-size="11.5" font-weight="400" fill="#172b3a" text-anchor="start">Pasal 54 addendum; added value up to 10 %</text><text x="24.0" y="30.0" font-size="17" font-weight="700" fill="#172b3a" text-anchor="start">F08-1  Change workflow from origin to closure with MSC-1 time limits in working days</text><text x="24.0" y="48.0" font-size="11" font-weight="400" fill="#5b6b78" text-anchor="start">PCO within 2 · contract notice target 10 (inside 28 days FIDIC, 8 weeks NEC4, 21 days AIA) · impact 5 · instruction 5 · proposal 10 · valuation 10 · DCN 10 · ITP and Cx script revision 10</text><text x="32.0" y="601.0" font-size="10" font-weight="700" fill="#2d6a4f" text-anchor="start">WHAT TO PROVE</text><text x="32.0" y="617.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">• The internal targets sit inside the contract limits so that no notice period is at risk: 10 working days against the 28-day FIDIC Notice of Claim period.</text><text x="32.0" y="632.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">• Steps 8 and 9 connect change control to chapter 07: the ITP and the commissioning scripts are revised before the changed work is inspected and tested.</text><text x="24.0" y="667.0" font-size="10" font-weight="700" fill="#5b6b78" text-anchor="start">LEGEND</text><line x1="24" y1="689.0" x2="50" y2="689.0" stroke="#475569" stroke-width="3"/><text x="56.0" y="693.0" font-size="10" font-weight="400" fill="#172b3a" text-anchor="start">signal / control</text><rect x="24" y="707.0" width="1352" height="44" rx="0" fill="#f6f8fa" fill-opacity="1" stroke="#5b6b78" stroke-width="1"/><text x="32.0" y="721.0" font-size="11" font-weight="700" fill="#172b3a" text-anchor="start">F08-1  ·  Change workflow from origin to closure with MSC-1 time limits in working days</text><text x="1368.0" y="721.0" font-size="10" font-weight="400" fill="#5b6b78" text-anchor="end">Chapter 08 · §08.9</text><text x="32.0" y="734.0" font-size="9" font-weight="400" fill="#5b6b78" text-anchor="start">Data Centre Commissioning Field Manual R01 EN · October 2026 · educational reference, not to scale · project and OEM documents govern</text><text x="32.0" y="746.0" font-size="9" font-weight="400" fill="#5b6b78" text-anchor="start">Symbols: QElectroTech EN 60617 and P&amp;ID collections, CC-BY 3.0, native geometry · instrument bubbles per ISA 5.1 · states per IEC 60617 / IEEE C37.2 practice</text></svg>