weight="700" fill="#172b3a" text-anchor="middle">R</text><text x="870.0" y="305.2" font-size="12" font-weight="700" fill="#172b3a" text-anchor="middle">C</text><text x="1070.0" y="305.2" font-size="12" font-weight="700" fill="#172b3a" text-anchor="middle">I</text><text x="1270.0" y="305.2" font-size="12" font-weight="700" fill="#172b3a" text-anchor="middle">A</text><text x="46.0" y="330.7" font-size="12" font-weight="400" fill="#172b3a" text-anchor="start">L4 function test</text><text x="470.0" y="330.7" font-size="12" font-weight="700" fill="#172b3a" text-anchor="middle">R</text><text x="670.0" y="330.7" font-size="12" font-weight="700" fill="#172b3a" text-anchor="middle">R</text><text x="870.0" y="330.7" font-size="12" font-weight="700" fill="#172b3a" text-anchor="middle">C</text><text x="1070.0" y="330.7" font-size="12" font-weight="700" fill="#172b3a" text-anchor="middle">C</text><text x="1270.0" y="330.7" font-size="12" font-weight="700" fill="#172b3a" text-anchor="middle">A</text><text x="46.0" y="356.1" font-size="12" font-weight="400" fill="#172b3a" text-anchor="start">L5 scenario test</text><text x="470.0" y="356.1" font-size="12" font-weight="700" fill="#172b3a" text-anchor="middle">C</text><text x="670.0" y="356.1" font-size="12" font-weight="700" fill="#172b3a" text-anchor="middle">C</text><text x="870.0" y="356.1" font-size="12" font-weight="700" fill="#172b3a" text-anchor="middle">C</text><text x="1070.0" y="356.1" font-size="12" font-weight="700" fill="#172b3a" text-anchor="middle">C</text><text x="1270.0" y="356.1" font-size="12" font-weight="700" fill="#172b3a" text-anchor="middle">R, A</text><text x="46.0" y="381.6" font-size="12" font-weight="400" fill="#172b3a" text-anchor="start">Change after freeze</text><text x="470.0" y="381.6" font-size="12" font-weight="700" fill="#172b3a" text-anchor="middle">R</text><text x="670.0" y="381.6" font-size="12" font-weight="700" fill="#172b3a" text-anchor="middle">C</text><text x="870.0" y="381.6" font-size="12" font-weight="700" fill="#172b3a" text-anchor="middle">C</text><text x="1070.0" y="381.6" font-size="12" font-weight="700" fill="#172b3a" text-anchor="middle">A</text><text x="1270.0" y="381.6" font-size="12" font-weight="700" fill="#172b3a" text-anchor="middle">A</text><text x="24.0" y="30.0" font-size="17" font-weight="700" fill="#172b3a" text-anchor="start">F25-2  Integration responsibility matrix: who does each step of an interface</text><text x="24.0" y="48.0" font-size="11" font-weight="400" fill="#5b6b78" text-anchor="start">R responsible · A accountable · C consulted · I informed · one interface manager per contractor signs the MIL rows and ICDs</text><text x="32.0" y="425.8" font-size="10" font-weight="700" fill="#2d6a4f" text-anchor="start">WHAT TO PROVE</text><text x="32.0" y="441.8" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">• The OEM of side A writes the data list and physical sections of the ICD and hands over the map; the integrator of side B writes polling and mapping and runs the L3 data test.</text><text x="32.0" y="456.8" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">• A change after the freeze is raised by the OEM, approved by the engineer of record, and its retest scope is set by the commissioning manager.</text><rect x="24" y="489.84000000000003" width="1352" height="44" rx="0" fill="#f6f8fa" fill-opacity="1" stroke="#5b6b78" stroke-width="1"/><text x="32.0" y="503.8" font-size="11" font-weight="700" fill="#172b3a" text-anchor="start">F25-2  ·  Integration responsibility matrix: who does each step of an interface</text><text x="1368.0" y="503.8" font-size="10" font-weight="400" fill="#5b6b78" text-anchor="end">Chapter 25 · §25.5</text><text x="32.0" y="516.8" font-size="9" font-weight="400" fill="#5b6b78" text-anchor="start">Data Centre Commissioning Field Manual R01 EN · October 2026 · educational reference, not to scale · project and OEM documents govern</text><text x="32.0" y="528.8" font-size="9" font-weight="400" fill="#5b6b78" text-anchor="start">Symbols: QElectroTech EN 60617 and P&amp;ID collections, CC-BY 3.0, native geometry · instrument bubbles per ISA 5.1 · states per IEC 60617 / IEEE C37.2 practice</text></svg>