000000000003" width="129.375" height="22.0" rx="0" fill="#ffffff" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><rect x="169.375" y="475.90000000000003" width="230.0" height="22.0" rx="0" fill="#ffffff" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><rect x="399.375" y="475.90000000000003" width="258.75" height="22.0" rx="0" fill="#ffffff" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><rect x="658.125" y="475.90000000000003" width="158.125" height="22.0" rx="0" fill="#ffffff" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><rect x="816.25" y="475.90000000000003" width="143.75" height="22.0" rx="0" fill="#ffffff" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><rect x="40" y="497.90000000000003" width="129.375" height="22.0" rx="0" fill="#ffffff" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><rect x="169.375" y="497.90000000000003" width="230.0" height="22.0" rx="0" fill="#ffffff" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><rect x="399.375" y="497.90000000000003" width="258.75" height="22.0" rx="0" fill="#ffffff" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><rect x="658.125" y="497.90000000000003" width="158.125" height="22.0" rx="0" fill="#ffffff" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><rect x="816.25" y="497.90000000000003" width="143.75" height="22.0" rx="0" fill="#ffffff" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><rect x="40" y="519.9000000000001" width="129.375" height="22.0" rx="0" fill="#ffffff" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><rect x="169.375" y="519.9000000000001" width="230.0" height="22.0" rx="0" fill="#ffffff" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><rect x="399.375" y="519.9000000000001" width="258.75" height="22.0" rx="0" fill="#ffffff" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><rect x="658.125" y="519.9000000000001" width="158.125" height="22.0" rx="0" fill="#ffffff" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><rect x="816.25" y="519.9000000000001" width="143.75" height="22.0" rx="0" fill="#ffffff" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><rect x="40" y="561.9000000000001" width="920" height="58.2" rx="4" fill="#fffbe6" fill-opacity="1" stroke="#b7791f" stroke-width="1.2"/><text x="40.0" y="102.0" font-size="12" font-weight="700" fill="#334155" text-anchor="start">IF-021 protocol</text><text x="175.0" y="123.8" font-size="12" font-weight="700" fill="#334155" text-anchor="middle">CDU-07 controller</text><text x="175.0" y="137.3" font-size="10" font-weight="400" fill="#172b3a" text-anchor="middle">owner: CDU OEM</text><text x="175.0" y="150.8" font-size="10" font-weight="400" fill="#172b3a" text-anchor="middle">map CDU1-MB-MAP v3.2</text><text x="175.0" y="164.3" font-size="10" font-weight="400" fill="#172b3a" text-anchor="middle">port ETH1</text><text x="500.0" y="123.8" font-size="12" font-weight="700" fill="#b91c1c" text-anchor="middle">Boundary: device port</text><text x="500.0" y="137.3" font-size="10" font-weight="400" fill="#172b3a" text-anchor="middle">hall OT switch A, VLAN 2310</text><text x="500.0" y="150.8" font-size="10" font-weight="400" fill="#172b3a" text-anchor="middle">network contractor</text><text x="500.0" y="164.3" font-size="10" font-weight="400" fill="#172b3a" text-anchor="middle">10.22.3.47, TCP 502</text><text x="825.0" y="123.8" font-size="12" font-weight="700" fill="#334155" text-anchor="middle">BMS automation server</text><text x="825.0" y="137.3" font-size="10" font-weight="400" fill="#172b3a" text-anchor="middle">owner: BMS controls contractor</text><text x="825.0" y="150.8" font-size="10" font-weight="400" fill="#172b3a" text-anchor="middle">polling, mapping, graphics</text><text x="825.0" y="164.3" font-size="10" font-weight="400" fill="#172b3a" text-anchor="middle">10.22.0.13</text><text x="40.0" y="223.3" font-size="12" font-weight="700" fill="#475569" text-anchor="start">IF-042 hardwired</text><text x="175.0" y="245.1" font-size="12" font-weight="700" fill="#475569" text-anchor="middle">FACP output OM-3-17</text><text x="175.0" y="258.6" font-size="10" font-weight="400" fill="#172b3a" text-anchor="middle">owner: fire contractor</text><text x="175.0" y="272.1" font-size="10" font-weight="400" fill="#172b3a" text-anchor="middle">NC contact, 2 A at 30 V DC</text><text x="175.0" y="285.6" font-size="10" font-weight="400" fill="#172b3a" text-anchor="middle">contact and cable</text><text x="500.0" y="245.1" font-size="12" font-weight="700" fill="#b91c1c" text-anchor="middle">Boundary: terminal</text><text x="500.0" y="258.6" font-size="10" font-weight="400" fill="#172b3a" text-anchor="middle">X2:21-22 in CRAH 11 panel</text><text x="500.0" y="272.1" font-size="10" font-weight="400" fill="#172b3a" text-anchor="middle">in the receiving panel</text><text x="500.0" y="285.6" font-size="10" font-weight="400" fill="#172b3a" text-anchor="middle">24 V DC circuit</text><text x="825.0" y="245.1" font-size="12" font-weight="700" fill="#475569" text-anchor="middle">CRAH 11 fan stop</text><text x="825.0" y="258.6" font-size="10" font-weight="400" fill="#172b3a" text-anchor="middle">owner: CRAH OEM</text><text x="825.0" y="272.1" font-size="10" font-weight="400" fill="#172b3a" text-anchor="middle">terminal and logic</text><text x="825.0" y="285.6" font-size="10" font-weight="400" fill="#172b3a" text-anchor="middle">behind X2:21-22</text><text x="40.0" y="344.6" font-size="12" font-weight="700" fill="#334155" text-anchor="start">IF-057 application</text><text x="175.0" y="366.4" font-size="12" font-weight="700" fill="#334155" text-anchor="middle">BMS alarm server</text><text x="175.0" y="379.9" font-size="10" font-weight="400" fill="#172b3a" text-anchor="middle">owner: BMS controls contractor</text><text x="175.0" y="393.4" font-size="10" font-weight="400" fill="#172b3a" text-anchor="middle">builds the API client</text><text x="175.0" y="406.9" font-size="10" font-weight="400" fill="#172b3a" text-anchor="middle">P2 alarm out</text><text x="500.0" y="366.4" font-size="12" font-weight="700" fill="#b91c1c" text-anchor="middle">Boundary: API endpoint</text><text x="500.0" y="379.9" font-size="10" font-weight="400" fill="#172b3a" text-anchor="middle">CMMS REST API</text><text x="500.0" y="393.4" font-size="10" font-weight="400" fill="#172b3a" text-anchor="middle">specification published by</text><text x="500.0" y="406.9" font-size="10" font-weight="400" fill="#172b3a" text-anchor="middle">the receiving owner</text><text x="825.0" y="366.4" font-size="12" font-weight="700" fill="#334155" text-anchor="middle">CMMS</text><text x="825.0" y="379.9" font-size="10" font-weight="400" fill="#172b3a" text-anchor="middle">owner: owner CMMS team</text><text x="825.0" y="393.4" font-size="10" font-weight="400" fill="#172b3a" text-anchor="middle">creates one work order</text><text x="825.0" y="406.9" font-size="10" font-weight="400" fill="#172b3a" text-anchor="middle">per P2 alarm</text><text x="45.0" y="468.9" font-size="11" font-weight="700" fill="#172b3a" text-anchor="start">MIL row</text><text x="174.4" y="468.9" font-size="11" font-weight="700" fill="#172b3a" text-anchor="start">Owner side A</text><text x="404.4" y="468.9" font-size="11" font-weight="700" fill="#172b3a" text-anchor="start">Owner side B</text><text x="663.1" y="468.9" font-size="11" font-weight="700" fill="#172b3a" text-anchor="start">ICD</text><text x="821.2" y="468.9" font-size="11" font-weight="700" fill="#172b3a" text-anchor="start">Test levels</text><text x="45.0" y="490.9" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">IF-021</text><text x="174.4" y="490.9" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">CDU OEM</text><text x="404.4" y="490.9" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">BMS controls contractor</text><text x="663.1" y="490.9" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">ICD-25-021</text><text x="821.2" y="490.9" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">L3, L4, L5</text><text x="45.0" y="512.9" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">IF-042</text><text x="174.4" y="512.9" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">fire contractor</text><text x="404.4" y="512.9" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">CRAH OEM / electrical</text><text x="663.1" y="512.9" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">ICD-25-042</text><text x="821.2" y="512.9" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">L4, L5</text><text x="45.0" y="534.9" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">IF-057</text><text x="174.4" y="534.9" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">BMS controls contractor</text><text x="404.4" y="534.9" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">owner CMMS team</text><text x="663.1" y="534.9" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">ICD-25-057</text><text x="821.2" y="534.9" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">L4</text><text x="50.0" y="575.1" font-size="11" font-weight="700" fill="#b7791f" text-anchor="start">Gateway rule (25.1.2, common error 1)</text><text x="50.0" y="590.5" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">A Modbus-to-BACnet gateway between two systems has one named owner for its hardware and one for its configuration. A gateway with no owner in the ICD is an</text><text x="50.0" y="605.4" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">open issue before L3.</text><text x="24.0" y="30.0" font-size="17" font-weight="700" fill="#172b3a" text-anchor="start">F25-7  Ownership boundary of three MIL rows: protocol, hardwired, application</text><text x="24.0" y="48.0" font-size="10" font-weight="400" fill="#5b6b78" text-anchor="start">IF-021 CDU to BMS (Modbus TCP, boundary = device port) · IF-042 FACP to CRAH fan stop (NC contact 2 A at 30 V DC, boundary = receiving terminal) · IF-057 BMS to CMMS</text><text x="24.0" y="61.0" font-size="10" font-weight="400" fill="#5b6b78" text-anchor="start">(boundary = API endpoint)</text><text x="32.0" y="656.1" font-size="10" font-weight="700" fill="#2d6a4f" text-anchor="start">WHAT TO PROVE</text><text x="32.0" y="672.1" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">• For IF-021 the CDU OEM owns the map and the communication card up to port ETH1; the network contractor owns the switch port and VLAN 2310; the BMS controls</text><text x="32.0" y="687.1" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">contractor owns polling, mapping and graphics.</text><text x="32.0" y="702.1" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">• For IF-042 the fire contractor supplies the contact and the cable up to terminal X2:21-22; the receiving panel and its logic belong to the CRAH side.</text><text x="32.0" y="717.1" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">• For IF-057 the owner CMMS team publishes the API specification and the BMS controls contractor builds the client.</text><text x="24.0" y="752.1" font-size="10" font-weight="700" fill="#5b6b78" text-anchor="start">LEGEND</text><line x1="24" y1="774.1000000000001" x2="50" y2="774.1000000000001" stroke="#334155" stroke-width="3"/><text x="56.0" y="778.1" font-size="10" font-weight="400" fill="#172b3a" text-anchor="start">data / network</text><line x1="150.859375" y1="774.1000000000001" x2="176.859375" y2="774.1000000000001" stroke="#b91c1c" stroke-width="3"/><text x="182.9" y="778.1" font-size="10" font-weight="400" fill="#172b3a" text-anchor="start">trip / protection</text><line x1="282.8265625" y1="774.1000000000001" x2="308.8265625" y2="774.1000000000001" stroke="#475569" stroke-width="3"/><text x="314.8" y="778.1" font-size="10" font-weight="400" fill="#172b3a" text-anchor="start">signal / control</text><rect x="24" y="792.1000000000001" width="952" height="44" rx="0" fill="#f6f8fa" fill-opacity="1" stroke="#5b6b78" stroke-width="1"/><text x="32.0" y="806.1" font-size="11" font-weight="700" fill="#172b3a" text-anchor="start">F25-7  ·  Ownership boundary of three MIL rows: protocol, hardwired, application</text><text x="968.0" y="806.1" font-size="10" font-weight="400" fill="#5b6b78" text-anchor="end">Chapter 25 · §25.2.4</text><text x="32.0" y="819.1" font-size="9" font-weight="400" fill="#5b6b78" text-anchor="start">Data Centre Commissioning Field Manual R01 EN · October 2026 · educational reference, not to scale · project and OEM documents govern</text><text x="32.0" y="831.1" font-size="9" font-weight="400" fill="#5b6b78" text-anchor="start">Symbols: QElectroTech EN 60617 and P&amp;ID collections, CC-BY 3.0, native geometry · instrument bubbles per ISA 5.1 · states per IEC 60617 / IEEE C37.2 practice</text></svg>