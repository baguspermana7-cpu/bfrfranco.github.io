.0" width="321.26984126984127" height="22.0" rx="0" fill="#ffffff" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><rect x="740.952380952381" y="626.0" width="219.04761904761904" height="22.0" rx="0" fill="#ffffff" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><text x="48.0" y="144.0" font-size="11" font-weight="700" fill="#172b3a" text-anchor="start">Energise TX-A</text><text x="48.0" y="184.0" font-size="11" font-weight="700" fill="#172b3a" text-anchor="start">Soak, no load</text><text x="48.0" y="224.0" font-size="11" font-weight="700" fill="#172b3a" text-anchor="start">VT and relay check</text><text x="48.0" y="264.0" font-size="11" font-weight="700" fill="#172b3a" text-anchor="start">First load</text><text x="48.0" y="304.0" font-size="11" font-weight="700" fill="#172b3a" text-anchor="start">DGA 24 h</text><text x="48.0" y="344.0" font-size="11" font-weight="700" fill="#172b3a" text-anchor="start">DGA later</text><text x="48.0" y="384.0" font-size="11" font-weight="700" fill="#172b3a" text-anchor="start">Online PD</text><text x="48.0" y="424.0" font-size="11" font-weight="700" fill="#172b3a" text-anchor="start">Thermography</text><text x="190.0" y="454.0" font-size="10" font-weight="400" fill="#5b6b78" text-anchor="middle">0 d</text><text x="300.0" y="454.0" font-size="10" font-weight="400" fill="#5b6b78" text-anchor="middle">5 d</text><text x="410.0" y="454.0" font-size="10" font-weight="400" fill="#5b6b78" text-anchor="middle">10 d</text><text x="520.0" y="454.0" font-size="10" font-weight="400" fill="#5b6b78" text-anchor="middle">15 d</text><text x="630.0" y="454.0" font-size="10" font-weight="400" fill="#5b6b78" text-anchor="middle">20 d</text><text x="740.0" y="454.0" font-size="10" font-weight="400" fill="#5b6b78" text-anchor="middle">25 d</text><text x="850.0" y="454.0" font-size="10" font-weight="400" fill="#5b6b78" text-anchor="middle">30 d</text><text x="960.0" y="454.0" font-size="10" font-weight="400" fill="#5b6b78" text-anchor="middle">35 d</text><text x="197.0" y="144.0" font-size="10" font-weight="400" fill="#b45309" text-anchor="start">switching programme, each step timed</text><text x="218.0" y="184.0" font-size="10" font-weight="400" fill="#b45309" text-anchor="start">soak 24 h, Buchholz and temperatures watched</text><text x="197.0" y="224.0" font-size="10" font-weight="400" fill="#475569" text-anchor="start">rotation; relay and EPMS values within 1 %</text><text x="219.0" y="264.0" font-size="10" font-weight="400" fill="#475569" text-anchor="start">87T differential near zero, bias = load</text><text x="219.0" y="304.0" font-size="10" font-weight="400" fill="#92400e" text-anchor="start">sample at 24 h</text><text x="351.0" y="344.0" font-size="10" font-weight="400" fill="#92400e" text-anchor="start">1 week</text><text x="857.0" y="344.0" font-size="10" font-weight="400" fill="#92400e" text-anchor="start">1 month</text><text x="195.0" y="384.0" font-size="10" font-weight="400" fill="#172b3a" text-anchor="start">survey window 14 days; MSC-1 survey day 7</text><text x="417.0" y="424.0" font-size="10" font-weight="400" fill="#c2410c" text-anchor="start">load at 40 % or more (example day 10)</text><text x="45.0" y="509.0" font-size="11" font-weight="700" fill="#172b3a" text-anchor="start">Check</text><text x="234.8" y="509.0" font-size="11" font-weight="700" fill="#172b3a" text-anchor="start">When</text><text x="424.7" y="509.0" font-size="11" font-weight="700" fill="#172b3a" text-anchor="start">Acceptance</text><text x="746.0" y="509.0" font-size="11" font-weight="700" fill="#172b3a" text-anchor="start">Record</text><text x="45.0" y="531.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">Soak at no load</text><text x="234.8" y="531.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">day 0 to day 1</text><text x="424.7" y="531.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">no Buchholz gas, temperatures stable</text><text x="746.0" y="531.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">switching programme</text><text x="45.0" y="553.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">Voltages and rotation</text><text x="234.8" y="553.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">day 0</text><text x="424.7" y="553.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">relay and EPMS values within 1 %</text><text x="746.0" y="553.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">energisation record</text><text x="45.0" y="575.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">Load check</text><text x="234.8" y="575.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">first load</text><text x="424.7" y="575.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">87T differential current near zero</text><text x="746.0" y="575.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">relay load check sheet</text><text x="45.0" y="597.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">Online PD</text><text x="234.8" y="597.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">within 14 days</text><text x="424.7" y="597.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">TEV near background (8 dBmV)</text><text x="746.0" y="597.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">PD survey sheet</text><text x="45.0" y="619.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">DGA</text><text x="234.8" y="619.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">24 h, 1 week, 1 month</text><text x="424.7" y="619.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">no acetylene, hydrogen not rising</text><text x="746.0" y="619.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">oil laboratory reports</text><text x="45.0" y="641.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">Thermography</text><text x="234.8" y="641.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">load 40 % or more</text><text x="424.7" y="641.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">NETA bands of section 14.13</text><text x="746.0" y="641.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">IR survey report</text><text x="24.0" y="30.0" font-size="17" font-weight="700" fill="#172b3a" text-anchor="start">F13-7  Energisation and post-energisation checks of one 20 kV section</text><text x="24.0" y="48.0" font-size="10" font-weight="400" fill="#5b6b78" text-anchor="start">day 0 = TX-A energised under the switching programme · soak 24 h at no load (example OEM value) · DGA at 24 h, 1 week and 1 month (13.7.7) · online PD survey within</text><text x="24.0" y="61.0" font-size="10" font-weight="400" fill="#5b6b78" text-anchor="start">14 days, MSC-1 survey on day 7 (13.9.5) · thermography at 40 % load or more</text><text x="32.0" y="684.0" font-size="10" font-weight="700" fill="#2d6a4f" text-anchor="start">WHAT TO PROVE</text><text x="32.0" y="700.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">• Load is applied only after the 24 h soak with no Buchholz gas and stable temperatures.</text><text x="32.0" y="715.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">• The 87T differential current is read when load is first applied and must be near zero.</text><text x="32.0" y="730.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">• The DGA samples at 24 h, 1 week and 1 month are compared with the baseline; any acetylene goes to the OEM.</text><rect x="24" y="763.0" width="952" height="44" rx="0" fill="#f6f8fa" fill-opacity="1" stroke="#5b6b78" stroke-width="1"/><text x="32.0" y="777.0" font-size="11" font-weight="700" fill="#172b3a" text-anchor="start">F13-7  ·  Energisation and post-energisation checks of one 20 kV section</text><text x="968.0" y="777.0" font-size="10" font-weight="400" fill="#5b6b78" text-anchor="end">Chapter 13 · §13.12</text><text x="32.0" y="790.0" font-size="9" font-weight="400" fill="#5b6b78" text-anchor="start">Data Centre Commissioning Field Manual R01 EN · October 2026 · educational reference, not to scale · project and OEM documents govern</text><text x="32.0" y="802.0" font-size="9" font-weight="400" fill="#5b6b78" text-anchor="start">Symbols: QElectroTech EN 60617 and P&amp;ID collections, CC-BY 3.0, native geometry · instrument bubbles per ISA 5.1 · states per IEC 60617 / IEEE C37.2 practice</text></svg>