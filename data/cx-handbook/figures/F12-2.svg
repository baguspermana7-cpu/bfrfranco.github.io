-size="11" font-weight="400" fill="#5b6b78" text-anchor="start">13 sections per system · 5 chillers of 2.5 MW, 5 pumps, 140 assets, 46 drawings, 13 manuals, 1,180 test records · status after first review: 7 accepted, 6 with gaps</text><text x="32.0" y="518.0" font-size="10" font-weight="700" fill="#2d6a4f" text-anchor="start">WHAT TO PROVE</text><text x="32.0" y="534.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">• Sections 3, 5 and 8 have rejected items and sections 6, 10 and 12 have missing items; the review sheet lists 7 actions with 10 working days.</text><text x="32.0" y="549.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">• The package is accepted only when all 13 sections are complete.</text><text x="24.0" y="584.0" font-size="10" font-weight="700" fill="#5b6b78" text-anchor="start">LEGEND</text><line x1="24" y1="606" x2="50" y2="606" stroke="#0e7490" stroke-width="3"/><text x="56.0" y="610.0" font-size="10" font-weight="400" fill="#172b3a" text-anchor="start">chilled water (FWS)</text><rect x="24" y="624" width="1352" height="44" rx="0" fill="#f6f8fa" fill-opacity="1" stroke="#5b6b78" stroke-width="1"/><text x="32.0" y="638.0" font-size="11" font-weight="700" fill="#172b3a" text-anchor="start">F12-2  ·  Turnover package tree for the chilled-water plant of building B1 (TP-B1-CHW-01)</text><text x="1368.0" y="638.0" font-size="10" font-weight="400" fill="#5b6b78" text-anchor="end">Chapter 12 · §12.3</text><text x="32.0" y="651.0" font-size="9" font-weight="400" fill="#5b6b78" text-anchor="start">Data Centre Commissioning Field Manual R01 EN · October 2026 · educational reference, not to scale · project and OEM documents govern</text><text x="32.0" y="663.0" font-size="9" font-weight="400" fill="#5b6b78" text-anchor="start">Symbols: QElectroTech EN 60617 and P&amp;ID collections, CC-BY 3.0, native geometry · instrument bubbles per ISA 5.1 · states per IEC 60617 / IEEE C37.2 practice</text></svg>