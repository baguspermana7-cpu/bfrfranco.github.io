 font-weight="400" fill="#5b6b78" text-anchor="start">10 RFS conditions · 8 met · 2 in progress (CMMS load, permit transfer) · operations readiness 55 of 64 items (85.9 %) · rule: every critical item complete at RFS</text><text x="32.0" y="404.5" font-size="10" font-weight="700" fill="#2d6a4f" text-anchor="start">WHAT TO PROVE</text><text x="32.0" y="420.5" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">• The two generator-failure EOPs are proved in the IST window and signed before RFS.</text><text x="32.0" y="435.5" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">• The CMMS production load waits for 100 % of asset rows passing the validation rules.</text><rect x="24" y="468.52" width="1352" height="44" rx="0" fill="#f6f8fa" fill-opacity="1" stroke="#5b6b78" stroke-width="1"/><text x="32.0" y="482.5" font-size="11" font-weight="700" fill="#172b3a" text-anchor="start">F12-6  ·  RFS conditions for data hall B1-DH1: status two weeks before RFS (example)</text><text x="1368.0" y="482.5" font-size="10" font-weight="400" fill="#5b6b78" text-anchor="end">Chapter 12 · §12.1</text><text x="32.0" y="495.5" font-size="9" font-weight="400" fill="#5b6b78" text-anchor="start">Data Centre Commissioning Field Manual R01 EN · October 2026 · educational reference, not to scale · project and OEM documents govern</text><text x="32.0" y="507.5" font-size="9" font-weight="400" fill="#5b6b78" text-anchor="start">Symbols: QElectroTech EN 60617 and P&amp;ID collections, CC-BY 3.0, native geometry · instrument bubbles per ISA 5.1 · states per IEC 60617 / IEEE C37.2 practice</text></svg>