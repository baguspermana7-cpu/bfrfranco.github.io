<svg xmlns="http://www.w3.org/2000/svg" width="267mm" height="142.8mm" viewBox="0 0 1400 749" font-family="DejaVu Sans" role="img" aria-labelledby="t"><title id="t">F09-4 Defect closure package for a major NCR: the ten items a reader can audit without asking</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="context-stroke"/></marker><marker id="arrow-simple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#172b3a"/></marker></defs><rect width="1400" height="749" fill="#ffffff"/><rect x="4" y="4" width="1392" height="741" fill="none" stroke="#172b3a" stroke-width="1.6"/><rect x="24" y="611.0" width="1352" height="56" rx="4" fill="#f1f8f4" fill-opacity="1" stroke="#2d6a4f" stroke-width="1"/><rect x="40" y="110" width="1320" height="44.3" rx="0" fill="#eef3f7" fill-opacity="1" stroke="#172b3a" stroke-width="1.4"/><rect x="40" y="158.3" width="1320" height="44.3" rx="0" fill="#eef3f7" fill-opacity="1" stroke="#172b3a" stroke-width="1.4"/><rect x="40" y="206.60000000000002" width="1320" height="44.3" rx="0" fill="#eef3f7" fill-opacity="1" stroke="#172b3a" stroke-width="1.4"/><rect x="40" y="254.90000000000003" width="1320" height="44.3" rx="0" fill="#eef3f7" fill-opacity="1" stroke="#172b3a" stroke-width="1.4"/><rect x="40" y="303.20000000000005" width="1320" height="44.3" rx="0" fill="#e6f2e6" fill-opacity="1" stroke="#172b3a" stroke-width="1.4"/><rect x="40" y="351.50000000000006" width="1320" height="44.3" rx="0" fill="#e6f2e6" fill-opacity="1" stroke="#172b3a" stroke-width="1.4"/><rect x="40" y="399.80000000000007" width="1320" height="44.3" rx="0" fill="#eef3f7" fill-opacity="1" stroke="#172b3a" stroke-width="1.4"/><rect x="40" y="448.1000000000001" width="1320" height="44.3" rx="0" fill="#fde4b0" fill-opacity="1" stroke="#172b3a" stroke-width="1.4"/><rect x="40" y="496.4000000000001" width="1320" height="44.3" rx="0" fill="#fde4b0" fill-opacity="1" stroke="#172b3a" stroke-width="1.4"/><rect x="40" y="544.7" width="1320" height="44.3" rx="0" fill="#eef3f7" fill-opacity="1" stroke="#172b3a" stroke-width="1.4"/><text x="700.0" y="123.8" font-size="12" font-weight="700" fill="#172b3a" text-anchor="middle">1 NCR form, four parts signed</text><text x="700.0" y="137.3" font-size="10" font-weight="400" fill="#172b3a" text-anchor="middle">identification, disposition, action and verification, closure</text><text x="700.0" y="172.1" font-size="12" font-weight="700" fill="#172b3a" text-anchor="middle">2 Photographs before and after</text><text x="700.0" y="185.6" font-size="10" font-weight="400" fill="#172b3a" text-anchor="middle">asset tag visible, dated: joints J01 to J48</text><text x="700.0" y="220.4" font-size="12" font-weight="700" fill="#172b3a" text-anchor="middle">3 Disposition approval</text><text x="700.0" y="233.9" font-size="10" font-weight="400" fill="#172b3a" text-anchor="middle">Engineer, 10 September 2026; concession only for use as is or repair</text><text x="700.0" y="268.7" font-size="12" font-weight="700" fill="#172b3a" text-anchor="middle">4 Correction method</text><text x="700.0" y="282.2" font-size="10" font-weight="400" fill="#172b3a" text-anchor="middle">MS-ELE-BW-002 rev 1 with torque marking and second-person check</text><text x="700.0" y="317.0" font-size="12" font-weight="700" fill="#172b3a" text-anchor="middle">5 Re-inspection IR</text><text x="700.0" y="330.5" font-size="10" font-weight="400" fill="#172b3a" text-anchor="middle">IR-B2-ELE-0711-R1 released, code A</text><text x="700.0" y="365.3" font-size="12" font-weight="700" fill="#172b3a" text-anchor="middle">6 Test records</text><text x="700.0" y="378.8" font-size="10" font-weight="400" fill="#172b3a" text-anchor="middle">torque record TQ-B2-DH2-BW-03; insulation resistance above 2,000 MΩ; thermography at 1.5 MW</text><text x="700.0" y="413.6" font-size="12" font-weight="700" fill="#172b3a" text-anchor="middle">7 Drawing and document updates</text><text x="700.0" y="427.1" font-size="10" font-weight="400" fill="#172b3a" text-anchor="middle">none needed for this NCR (recorded as &quot;not applicable&quot;)</text><text x="700.0" y="461.9" font-size="12" font-weight="700" fill="#172b3a" text-anchor="middle">8 CAR reference</text><text x="700.0" y="475.4" font-size="10" font-weight="400" fill="#172b3a" text-anchor="middle">CAR-B2-ELE-0014, 5-why recorded</text><text x="700.0" y="510.2" font-size="12" font-weight="700" fill="#172b3a" text-anchor="middle">9 Commissioning confirmation</text><text x="700.0" y="523.7" font-size="10" font-weight="400" fill="#172b3a" text-anchor="middle">CxM signature; issues log entry closed</text><text x="700.0" y="558.5" font-size="12" font-weight="700" fill="#172b3a" text-anchor="middle">10 Cost record</text><text x="700.0" y="572.0" font-size="10" font-weight="400" fill="#172b3a" text-anchor="middle">cost borne by the electrical subcontractor</text><text x="24.0" y="30.0" font-size="17" font-weight="700" fill="#172b3a" text-anchor="start">F09-4  Defect closure package for a major NCR: the ten items a reader can audit without asking</text><text x="24.0" y="48.0" font-size="11" font-weight="400" fill="#5b6b78" text-anchor="start">NCR-B2-ELE-0044 busway joint torque · closed 16 September 2026 · CAR-B2-ELE-0014 closed 27 October 2026 after 0 of 144 joints below torque</text><text x="32.0" y="625.0" font-size="10" font-weight="700" fill="#2d6a4f" text-anchor="start">WHAT TO PROVE</text><text x="32.0" y="641.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">• Items 5 and 6 (released re-inspection IR and retest records with instrument serial numbers) are the evidence that the correction worked.</text><text x="32.0" y="656.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">• Item 8 links the NCR to its CAR; item 9 is the CxM signature for systems in the commissioning plan.</text><rect x="24" y="689.0" width="1352" height="44" rx="0" fill="#f6f8fa" fill-opacity="1" stroke="#5b6b78" stroke-width="1"/><text x="32.0" y="703.0" font-size="11" font-weight="700" fill="#172b3a" text-anchor="start">F09-4  ·  Defect closure package for a major NCR: the ten items a reader can audit without asking</text><text x="1368.0" y="703.0" font-size="10" font-weight="400" fill="#5b6b78" text-anchor="end">Chapter 09 · §09.10</text><text x="32.0" y="716.0" font-size="9" font-weight="400" fill="#5b6b78" text-anchor="start">Data Centre Commissioning Field Manual R01 EN · October 2026 · educational reference, not to scale · project and OEM documents govern</text><text x="32.0" y="728.0" font-size="9" font-weight="400" fill="#5b6b78" text-anchor="start">Symbols: QElectroTech EN 60617 and P&amp;ID collections, CC-BY 3.0, native geometry · instrument bubbles per ISA 5.1 · states per IEC 60617 / IEEE C37.2 practice</text></svg>