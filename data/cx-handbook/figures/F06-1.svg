<svg xmlns="http://www.w3.org/2000/svg" width="267mm" height="154.9mm" viewBox="0 0 1400 812" font-family="DejaVu Sans" role="img" aria-labelledby="t"><title id="t">F06-1 Submittal review workflow with parallel commissioning review</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="context-stroke"/></marker><marker id="arrow-simple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#172b3a"/></marker><marker id="arrow-334155" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#334155"/></marker><marker id="arrow-475569" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#475569"/></marker><marker id="arrow-b91c1c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#b91c1c"/></marker></defs><rect width="1400" height="812" fill="#ffffff"/><rect x="4" y="4" width="1392" height="804" fill="none" stroke="#172b3a" stroke-width="1.6"/><rect x="40" y="100" width="1320" height="120" rx="6" fill="#fbfcfd" fill-opacity="1" stroke="#172b3a" stroke-width="1.2" stroke-dasharray="7 5"/><rect x="48" y="92" width="96.51609375" height="16" rx="3" fill="#ffffff" fill-opacity="1" stroke="#172b3a" stroke-width="1"/><text x="54.0" y="104.0" font-size="11" font-weight="700" fill="#172b3a" text-anchor="start">CONTRACTOR</text><rect x="40" y="230" width="1320" height="120" rx="6" fill="#f6f8fa" fill-opacity="1" stroke="#172b3a" stroke-width="1.2" stroke-dasharray="7 5"/><rect x="48" y="222" width="148.22640625" height="16" rx="3" fill="#ffffff" fill-opacity="1" stroke="#172b3a" stroke-width="1"/><text x="54.0" y="234.0" font-size="11" font-weight="700" fill="#172b3a" text-anchor="start">SUBMITTAL MANAGER</text><rect x="40" y="360" width="1320" height="120" rx="6" fill="#fbfcfd" fill-opacity="1" stroke="#172b3a" stroke-width="1.2" stroke-dasharray="7 5"/><rect x="48" y="352" width="188.98140625" height="16" rx="3" fill="#ffffff" fill-opacity="1" stroke="#172b3a" stroke-width="1"/><text x="54.0" y="364.0" font-size="11" font-weight="700" fill="#172b3a" text-anchor="start">LEAD REVIEWER (DESIGNER)</text><rect x="40" y="490" width="1320" height="120" rx="6" fill="#f6f8fa" fill-opacity="1" stroke="#172b3a" stroke-width="1.2" stroke-dasharray="7 5"/><rect x="48" y="482" width="99.0753125" height="16" rx="3" fill="#ffffff" fill-opacity="1" stroke="#172b3a" stroke-width="1"/><text x="54.0" y="494.0" font-size="11" font-weight="700" fill="#172b3a" text-anchor="start">CXM AND CXA</text><rect x="24" y="632" width="1352" height="56" rx="4" fill="#f1f8f4" fill-opacity="1" stroke="#2d6a4f" stroke-width="1"/><polyline points="228.0,170.0 291.0,170.0 291.0,264.0" fill="none" stroke="#334155" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#arrow-334155)"/><polyline points="410.0,300.0 513.0,300.0 513.0,394.0" fill="none" stroke="#334155" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#arrow-334155)"/><polyline points="592.0,430.0 695.0,430.0 695.0,524.0" fill="none" stroke="#475569" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#arrow-475569)"/><polyline points="774.0,560.0 877.0,560.0 877.0,466.0" fill="none" stroke="#475569" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#arrow-475569)"/><polyline points="956.0,430.0 980.0,430.0" fill="none" stroke="#334155" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#arrow-334155)"/><polyline points="1138.0,430.0 1241.0,430.0 1241.0,336.0" fill="none" stroke="#334155" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#arrow-334155)"/><polyline points="1241.0,264.0 1241.0,206.0" fill="none" stroke="#334155" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#arrow-334155)"/><polyline points="1241.0,134.0 1241.0,110.0 149.0,110.0 149.0,134.0" fill="none" stroke="#b91c1c" stroke-width="1.6" stroke-linejoin="round" stroke-dasharray="7 5" marker-end="url(#arrow-b91c1c)"/><rect x="70" y="134" width="158" height="72" rx="8" fill="#ffffff" fill-opacity="1" stroke="#334155" stroke-width="1.4"/><rect x="252" y="264" width="158" height="72" rx="8" fill="#ffffff" fill-opacity="1" stroke="#334155" stroke-width="1.4"/><rect x="434" y="394" width="158" height="72" rx="8" fill="#ffffff" fill-opacity="1" stroke="#334155" stroke-width="1.4"/><rect x="616" y="524" width="158" height="72" rx="8" fill="#ffffff" fill-opacity="1" stroke="#334155" stroke-width="1.4"/><rect x="798" y="394" width="158" height="72" rx="8" fill="#ffffff" fill-opacity="1" stroke="#334155" stroke-width="1.4"/><rect x="980" y="394" width="158" height="72" rx="8" fill="#ffffff" fill-opacity="1" stroke="#334155" stroke-width="1.4"/><rect x="1162" y="264" width="158" height="72" rx="8" fill="#ffffff" fill-opacity="1" stroke="#334155" stroke-width="1.4"/><rect x="1162" y="134" width="158" height="72" rx="8" fill="#ffffff" fill-opacity="1" stroke="#334155" stroke-width="1.4"/><text x="149.0" y="161.7" font-size="12" font-weight="700" fill="#334155" text-anchor="middle">Prepare, stamp</text><text x="149.0" y="175.2" font-size="10" font-weight="400" fill="#172b3a" text-anchor="middle">5 working days</text><text x="331.0" y="291.7" font-size="12" font-weight="700" fill="#334155" text-anchor="middle">Log, transmit</text><text x="331.0" y="305.2" font-size="10" font-weight="400" fill="#172b3a" text-anchor="middle">same day</text><text x="513.0" y="421.7" font-size="12" font-weight="700" fill="#334155" text-anchor="middle">Completeness</text><text x="513.0" y="435.2" font-size="10" font-weight="400" fill="#172b3a" text-anchor="middle">2 working days</text><text x="695.0" y="551.6" font-size="12" font-weight="700" fill="#334155" text-anchor="middle">Cx review</text><text x="695.0" y="565.1" font-size="10" font-weight="400" fill="#172b3a" text-anchor="middle">comments by day 7</text><text x="877.0" y="421.7" font-size="12" font-weight="700" fill="#334155" text-anchor="middle">Consolidate</text><text x="877.0" y="435.2" font-size="10" font-weight="400" fill="#172b3a" text-anchor="middle">day 9</text><text x="1059.0" y="421.7" font-size="12" font-weight="700" fill="#334155" text-anchor="middle">Apply code</text><text x="1059.0" y="435.2" font-size="10" font-weight="400" fill="#172b3a" text-anchor="middle">day 10</text><text x="1241.0" y="291.7" font-size="12" font-weight="700" fill="#334155" text-anchor="middle">Return, register</text><text x="1241.0" y="305.2" font-size="10" font-weight="400" fill="#172b3a" text-anchor="middle">ball to contractor</text><text x="1241.0" y="161.7" font-size="12" font-weight="700" fill="#334155" text-anchor="middle">Proceed or revise</text><text x="1241.0" y="175.2" font-size="10" font-weight="400" fill="#172b3a" text-anchor="middle">A, B proceed; C, D revise</text><text x="420.0" y="130.0" font-size="11" font-weight="400" fill="#b91c1c" text-anchor="start">Code C or D: revise and resubmit (same number, next revision)</text><text x="24.0" y="30.0" font-size="17" font-weight="700" fill="#172b3a" text-anchor="start">F06-1  Submittal review workflow with parallel commissioning review</text><text x="24.0" y="48.0" font-size="11" font-weight="400" fill="#5b6b78" text-anchor="start">10 working day review period · completeness check within 2 working days · CxM and CxA comments to the lead reviewer by day 7 · consolidation day 9 · code applied day 10</text><text x="32.0" y="646.0" font-size="10" font-weight="700" fill="#2d6a4f" text-anchor="start">WHAT TO PROVE</text><text x="32.0" y="662.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">• Commissioning comments reach the lead reviewer by day 7 of the 10-working-day period; a comment received after the code is applied cannot be added to that review.</text><text x="32.0" y="677.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">• Code A or B lets the contractor proceed; code C or D requires a resubmission with a comment response sheet.</text><text x="24.0" y="712.0" font-size="10" font-weight="700" fill="#5b6b78" text-anchor="start">LEGEND</text><line x1="24" y1="734" x2="50" y2="734" stroke="#334155" stroke-width="3"/><text x="56.0" y="738.0" font-size="10" font-weight="400" fill="#172b3a" text-anchor="start">data / network</text><line x1="150.859375" y1="734" x2="176.859375" y2="734" stroke="#475569" stroke-width="3"/><text x="182.9" y="738.0" font-size="10" font-weight="400" fill="#172b3a" text-anchor="start">signal / control</text><line x1="278.8265625" y1="734" x2="304.8265625" y2="734" stroke="#b91c1c" stroke-width="3"/><text x="310.8" y="738.0" font-size="10" font-weight="400" fill="#172b3a" text-anchor="start">trip / protection</text><rect x="24" y="752" width="1352" height="44" rx="0" fill="#f6f8fa" fill-opacity="1" stroke="#5b6b78" stroke-width="1"/><text x="32.0" y="766.0" font-size="11" font-weight="700" fill="#172b3a" text-anchor="start">F06-1  ·  Submittal review workflow with parallel commissioning review</text><text x="1368.0" y="766.0" font-size="10" font-weight="400" fill="#5b6b78" text-anchor="end">Chapter 06 · §06.4</text><text x="32.0" y="779.0" font-size="9" font-weight="400" fill="#5b6b78" text-anchor="start">Data Centre Commissioning Field Manual R01 EN · October 2026 · educational reference, not to scale · project and OEM documents govern</text><text x="32.0" y="791.0" font-size="9" font-weight="400" fill="#5b6b78" text-anchor="start">Symbols: QElectroTech EN 60617 and P&amp;ID collections, CC-BY 3.0, native geometry · instrument bubbles per ISA 5.1 · states per IEC 60617 / IEEE C37.2 practice</text></svg>