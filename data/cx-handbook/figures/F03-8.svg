stroke-width="0.8"/><rect x="720" y="513.14" width="240" height="24.380000000000003" rx="0" fill="#ffffff" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><rect x="40" y="537.52" width="160" height="24.380000000000003" rx="0" fill="#e9f0f4" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><rect x="200" y="537.52" width="520" height="24.380000000000003" rx="0" fill="#ffffff" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><rect x="720" y="537.52" width="240" height="24.380000000000003" rx="0" fill="#ffffff" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><rect x="40" y="561.9" width="160" height="24.380000000000003" rx="0" fill="#e9f0f4" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><rect x="200" y="561.9" width="520" height="24.380000000000003" rx="0" fill="#ffffff" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><rect x="720" y="561.9" width="240" height="24.380000000000003" rx="0" fill="#ffffff" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><text x="180.0" y="143.5" font-size="12.5" font-weight="700" fill="#475569" text-anchor="middle">Not started</text><text x="180.0" y="157.7" font-size="10.5" font-weight="400" fill="#172b3a" text-anchor="middle">script at rev 0, status A</text><text x="740.0" y="143.5" font-size="12.5" font-weight="700" fill="#475569" text-anchor="middle">Passed</text><text x="740.0" y="157.7" font-size="10.5" font-weight="400" fill="#172b3a" text-anchor="middle">every step pass</text><text x="460.0" y="323.5" font-size="12.5" font-weight="700" fill="#b91c1c" text-anchor="middle">Failed</text><text x="460.0" y="337.7" font-size="10.5" font-weight="400" fill="#172b3a" text-anchor="middle">one or more steps fail</text><text x="820.0" y="323.5" font-size="12.5" font-weight="700" fill="#334155" text-anchor="middle">Retest RT1, RT2</text><text x="820.0" y="337.7" font-size="10.5" font-weight="400" fill="#172b3a" text-anchor="middle">new record, failed steps</text><text x="330.0" y="140.0" font-size="11.5" font-weight="400" fill="#5b6b78" text-anchor="start">all steps pass</text><text x="196.0" y="262.0" font-size="11.5" font-weight="400" fill="#5b6b78" text-anchor="start">a step fails: issue within 1 WD</text><text x="590.0" y="395.0" font-size="11.5" font-weight="400" fill="#5b6b78" text-anchor="start">issue fixed, ready for verification</text><text x="460.0" y="456.4" font-size="10.5" font-weight="700" fill="#172b3a" text-anchor="middle">Event in the worked example of 03.17.3</text><text x="840.0" y="456.4" font-size="10.5" font-weight="700" fill="#172b3a" text-anchor="middle">Status</text><text x="46.0" y="480.8" font-size="11.5" font-weight="400" fill="#172b3a" text-anchor="start">2 to 3 Mar 2027</text><text x="460.0" y="480.8" font-size="11.5" font-weight="700" fill="#172b3a" text-anchor="middle">UPS-L4-B2-DH3-A1-01 executed; step 21 (maintenance bypass) fails</text><text x="840.0" y="480.8" font-size="11.5" font-weight="700" fill="#172b3a" text-anchor="middle">failed</text><text x="46.0" y="505.2" font-size="11.5" font-weight="400" fill="#172b3a" text-anchor="start">3 Mar</text><text x="460.0" y="505.2" font-size="11.5" font-weight="700" fill="#172b3a" text-anchor="middle">ISS-B2-1188 raised, category B</text><text x="840.0" y="505.2" font-size="11.5" font-weight="700" fill="#172b3a" text-anchor="middle">issue open</text><text x="46.0" y="529.6" font-size="11.5" font-weight="400" fill="#172b3a" text-anchor="start">8 Mar</text><text x="460.0" y="529.6" font-size="11.5" font-weight="700" fill="#172b3a" text-anchor="middle">CxM approves the record as executed</text><text x="840.0" y="529.6" font-size="11.5" font-weight="700" fill="#172b3a" text-anchor="middle">failed (record approved)</text><text x="46.0" y="554.0" font-size="11.5" font-weight="400" fill="#172b3a" text-anchor="start">10 Mar</text><text x="460.0" y="554.0" font-size="11.5" font-weight="700" fill="#172b3a" text-anchor="middle">OEM corrects the key interlock sequence and the procedure</text><text x="840.0" y="554.0" font-size="11.5" font-weight="700" fill="#172b3a" text-anchor="middle">issue ready for verification</text><text x="46.0" y="578.3" font-size="11.5" font-weight="400" fill="#172b3a" text-anchor="start">11 Mar</text><text x="460.0" y="578.3" font-size="11.5" font-weight="700" fill="#172b3a" text-anchor="middle">UPS-L4-B2-DH3-A1-01-RT1, steps 20 to 22, passes; issue closed</text><text x="840.0" y="578.3" font-size="11.5" font-weight="700" fill="#172b3a" text-anchor="middle">retest passed</text><text x="24.0" y="30.0" font-size="17" font-weight="700" fill="#172b3a" text-anchor="start">F03-8  Script status values and the retest path</text><text x="24.0" y="48.0" font-size="11" font-weight="400" fill="#5b6b78" text-anchor="start">script statuses: not started, passed, failed, retest · step results: pass, fail, not tested · no &quot;in progress&quot; status · retest ID = original ID + RT1</text><text x="32.0" y="622.3" font-size="10" font-weight="700" fill="#2d6a4f" text-anchor="start">WHAT TO PROVE</text><text x="32.0" y="638.3" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">• UPS-L4-B2-DH3-A1-01 stays &quot;failed&quot; in the script register; its retest UPS-L4-B2-DH3-A1-01-RT1 is &quot;passed&quot;.</text><text x="32.0" y="653.3" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">• Every failed step carries an issue ID raised within 1 working day of the test.</text><text x="24.0" y="688.3" font-size="10" font-weight="700" fill="#5b6b78" text-anchor="start">LEGEND</text><line x1="24" y1="710.28" x2="50" y2="710.28" stroke="#475569" stroke-width="3"/><text x="56.0" y="714.3" font-size="10" font-weight="400" fill="#172b3a" text-anchor="start">signal / control</text><line x1="151.9671875" y1="710.28" x2="177.9671875" y2="710.28" stroke="#b91c1c" stroke-width="3"/><text x="184.0" y="714.3" font-size="10" font-weight="400" fill="#172b3a" text-anchor="start">trip / protection</text><line x1="283.934375" y1="710.28" x2="309.934375" y2="710.28" stroke="#334155" stroke-width="3"/><text x="315.9" y="714.3" font-size="10" font-weight="400" fill="#172b3a" text-anchor="start">data / network</text><rect x="24" y="728.28" width="952" height="44" rx="0" fill="#f6f8fa" fill-opacity="1" stroke="#5b6b78" stroke-width="1"/><text x="32.0" y="742.3" font-size="11" font-weight="700" fill="#172b3a" text-anchor="start">F03-8  ·  Script status values and the retest path</text><text x="968.0" y="742.3" font-size="10" font-weight="400" fill="#5b6b78" text-anchor="end">Chapter 03 · §03.9.2</text><text x="32.0" y="755.3" font-size="9" font-weight="400" fill="#5b6b78" text-anchor="start">Data Centre Commissioning Field Manual R01 EN · October 2026 · educational reference, not to scale · project and OEM documents govern</text><text x="32.0" y="767.3" font-size="9" font-weight="400" fill="#5b6b78" text-anchor="start">Symbols: QElectroTech EN 60617 and P&amp;ID collections, CC-BY 3.0, native geometry · instrument bubbles per ISA 5.1 · states per IEC 60617 / IEEE C37.2 practice</text></svg>