" fill="#475569" text-anchor="middle">Pre-design</text><text x="160.0" y="139.8" font-size="11" font-weight="400" fill="#172b3a" text-anchor="middle">L0 starts</text><text x="160.0" y="154.7" font-size="11" font-weight="400" fill="#172b3a" text-anchor="middle">OPR, Cx plan draft</text><text x="430.0" y="125.0" font-size="13" font-weight="700" fill="#475569" text-anchor="middle">Design</text><text x="430.0" y="139.8" font-size="11" font-weight="400" fill="#172b3a" text-anchor="middle">L0</text><text x="430.0" y="154.7" font-size="11" font-weight="400" fill="#172b3a" text-anchor="middle">BOD review, Cx spec</text><text x="700.0" y="125.0" font-size="13" font-weight="700" fill="#475569" text-anchor="middle">Construction</text><text x="700.0" y="139.8" font-size="11" font-weight="400" fill="#172b3a" text-anchor="middle">L1, L2, L3</text><text x="700.0" y="154.7" font-size="11" font-weight="400" fill="#172b3a" text-anchor="middle">FAT, checklists</text><text x="970.0" y="125.0" font-size="13" font-weight="700" fill="#475569" text-anchor="middle">Acceptance</text><text x="970.0" y="139.8" font-size="11" font-weight="400" fill="#172b3a" text-anchor="middle">L4, L5</text><text x="970.0" y="154.7" font-size="11" font-weight="400" fill="#172b3a" text-anchor="middle">FPT, IST</text><text x="1240.0" y="125.0" font-size="13" font-weight="700" fill="#475569" text-anchor="middle">Occupancy</text><text x="1240.0" y="139.8" font-size="11" font-weight="400" fill="#172b3a" text-anchor="middle">L6</text><text x="1240.0" y="154.7" font-size="11" font-weight="400" fill="#172b3a" text-anchor="middle">seasonal tests, report</text><text x="45.0" y="276.3" font-size="12" font-weight="700" fill="#172b3a" text-anchor="start">Phase</text><text x="214.2" y="276.3" font-size="12" font-weight="700" fill="#172b3a" text-anchor="start">Deliverables at exit</text><text x="823.5" y="276.3" font-size="12" font-weight="700" fill="#172b3a" text-anchor="start">Owner of the phase</text><text x="1094.2" y="276.3" font-size="12" font-weight="700" fill="#172b3a" text-anchor="start">Blocks</text><text x="45.0" y="300.3" font-size="12" font-weight="400" fill="#172b3a" text-anchor="start">Pre-design</text><text x="214.2" y="300.3" font-size="12" font-weight="400" fill="#172b3a" text-anchor="start">accepted OPR rev 0; Cx plan rev 0; Cx scope and budget; Cx clauses in design contracts</text><text x="823.5" y="300.3" font-size="12" font-weight="400" fill="#172b3a" text-anchor="start">owner project director, CxM</text><text x="1094.2" y="300.3" font-size="12" font-weight="400" fill="#172b3a" text-anchor="start">start of design</text><text x="45.0" y="324.3" font-size="12" font-weight="400" fill="#172b3a" text-anchor="start">Design</text><text x="214.2" y="324.3" font-size="12" font-weight="400" fill="#172b3a" text-anchor="start">design review logs closed; Cx specification in tender; checklist and script templates; training requir</text><text x="823.5" y="324.3" font-size="12" font-weight="400" fill="#172b3a" text-anchor="start">CxM with EoR</text><text x="1094.2" y="324.3" font-size="12" font-weight="400" fill="#172b3a" text-anchor="start">tender and construction release</text><text x="45.0" y="348.3" font-size="12" font-weight="400" fill="#172b3a" text-anchor="start">Construction</text><text x="214.2" y="348.3" font-size="12" font-weight="400" fill="#172b3a" text-anchor="start">signed L1, L2 and L3 records; no open issue that blocks L4</text><text x="823.5" y="348.3" font-size="12" font-weight="400" fill="#172b3a" text-anchor="start">GC for work; CxM for verification</text><text x="1094.2" y="348.3" font-size="12" font-weight="400" fill="#172b3a" text-anchor="start">L4 per system</text><text x="45.0" y="372.3" font-size="12" font-weight="400" fill="#172b3a" text-anchor="start">Acceptance</text><text x="214.2" y="372.3" font-size="12" font-weight="400" fill="#172b3a" text-anchor="start">signed L4 scripts; L5 IST record; Cx report per hall; owner acceptance</text><text x="823.5" y="372.3" font-size="12" font-weight="400" fill="#172b3a" text-anchor="start">CxM</text><text x="1094.2" y="372.3" font-size="12" font-weight="400" fill="#172b3a" text-anchor="start">IT installation in the hall</text><text x="45.0" y="396.3" font-size="12" font-weight="400" fill="#172b3a" text-anchor="start">Occupancy</text><text x="214.2" y="396.3" font-size="12" font-weight="400" fill="#172b3a" text-anchor="start">deferred and seasonal tests; training verified; lessons learned; final Cx report</text><text x="823.5" y="396.3" font-size="12" font-weight="400" fill="#172b3a" text-anchor="start">CxM, then DCOps</text><text x="1094.2" y="396.3" font-size="12" font-weight="400" fill="#172b3a" text-anchor="start">release of retention</text><text x="24.0" y="30.0" font-size="17" font-weight="700" fill="#172b3a" text-anchor="start">F02-1  Project phases and the commissioning deliverables of each phase</text><text x="24.0" y="48.0" font-size="11" font-weight="400" fill="#5b6b78" text-anchor="start">Guideline 0-2019 phases pre-design, design, construction, occupancy and operations · acceptance shown on its own for L4 and L5 · OPR completed in pre-design and updated to the end</text><text x="32.0" y="440.0" font-size="10" font-weight="700" fill="#2d6a4f" text-anchor="start">WHAT TO PROVE</text><text x="32.0" y="456.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">• The OPR is completed in pre-design and the Cx plan is updated in every phase; the final Cx report is issued in occupancy.</text><text x="32.0" y="471.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">• Acceptance (L4 and L5) ends with the owner acceptance of the hall; ongoing commissioning runs to about one year after occupancy.</text><text x="24.0" y="506.0" font-size="10" font-weight="700" fill="#5b6b78" text-anchor="start">LEGEND</text><line x1="24" y1="528.0" x2="50" y2="528.0" stroke="#475569" stroke-width="3"/><text x="56.0" y="532.0" font-size="10" font-weight="400" fill="#172b3a" text-anchor="start">signal / control</text><rect x="24" y="546.0" width="1352" height="44" rx="0" fill="#f6f8fa" fill-opacity="1" stroke="#5b6b78" stroke-width="1"/><text x="32.0" y="560.0" font-size="11" font-weight="700" fill="#172b3a" text-anchor="start">F02-1  ·  Project phases and the commissioning deliverables of each phase</text><text x="1368.0" y="560.0" font-size="10" font-weight="400" fill="#5b6b78" text-anchor="end">Chapter 02 · §02.2</text><text x="32.0" y="573.0" font-size="9" font-weight="400" fill="#5b6b78" text-anchor="start">Data Centre Commissioning Field Manual R01 EN · October 2026 · educational reference, not to scale · project and OEM documents govern</text><text x="32.0" y="585.0" font-size="9" font-weight="400" fill="#5b6b78" text-anchor="start">Symbols: QElectroTech EN 60617 and P&amp;ID collections, CC-BY 3.0, native geometry · instrument bubbles per ISA 5.1 · states per IEC 60617 / IEEE C37.2 practice</text></svg>