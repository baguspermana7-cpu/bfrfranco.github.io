eight="39.56" rx="0" fill="#ffffff" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><rect x="40" y="292.62" width="200" height="39.56" rx="0" fill="#e9f0f4" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><rect x="240" y="292.62" width="190" height="39.56" rx="0" fill="#ffffff" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><rect x="430" y="292.62" width="180" height="39.56" rx="0" fill="#ffffff" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><rect x="610" y="292.62" width="190" height="39.56" rx="0" fill="#ffffff" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><rect x="800" y="292.62" width="160" height="39.56" rx="0" fill="#ffffff" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><rect x="40" y="356.18" width="920" height="60.3" rx="4" fill="#fffbe6" fill-opacity="1" stroke="#b7791f" stroke-width="1.2"/><text x="335.0" y="126.4" font-size="10.5" font-weight="700" fill="#172b3a" text-anchor="middle">FIDIC 2017</text><text x="520.0" y="126.4" font-size="10.5" font-weight="700" fill="#172b3a" text-anchor="middle">NEC4 ECC</text><text x="705.0" y="126.4" font-size="10.5" font-weight="700" fill="#172b3a" text-anchor="middle">Indonesian law</text><text x="880.0" y="126.4" font-size="10.5" font-weight="700" fill="#172b3a" text-anchor="middle">Record</text><text x="46.0" y="158.4" font-size="11.5" font-weight="400" fill="#172b3a" text-anchor="start">Before first energisation (L2, L3)</text><text x="335.0" y="158.4" font-size="11.5" font-weight="700" fill="#172b3a" text-anchor="middle">witness notice per contract</text><text x="520.0" y="150.8" font-size="11.5" font-weight="700" fill="#172b3a" text-anchor="middle">clause 40 tests and</text><text x="520.0" y="166.0" font-size="11.5" font-weight="700" fill="#172b3a" text-anchor="middle">inspections</text><text x="705.0" y="158.4" font-size="11.5" font-weight="700" fill="#172b3a" text-anchor="middle">LIT inspection; RLB</text><text x="880.0" y="158.4" font-size="11.5" font-weight="700" fill="#172b3a" text-anchor="middle">LIT report, RLB letter</text><text x="46.0" y="198.0" font-size="11.5" font-weight="400" fill="#172b3a" text-anchor="start">Functional tests (L4)</text><text x="335.0" y="190.4" font-size="11.5" font-weight="700" fill="#172b3a" text-anchor="middle">clause 9 Tests on</text><text x="335.0" y="205.6" font-size="11.5" font-weight="700" fill="#172b3a" text-anchor="middle">Completion</text><text x="520.0" y="198.0" font-size="11.5" font-weight="700" fill="#172b3a" text-anchor="middle">clause 40; early warnings</text><text x="705.0" y="190.4" font-size="11.5" font-weight="700" fill="#172b3a" text-anchor="middle">Ahli K3 Listrik signs safety</text><text x="705.0" y="205.6" font-size="11.5" font-weight="700" fill="#172b3a" text-anchor="middle">records</text><text x="880.0" y="198.0" font-size="11.5" font-weight="700" fill="#172b3a" text-anchor="middle">signed L4 scripts</text><text x="46.0" y="237.5" font-size="11.5" font-weight="400" fill="#172b3a" text-anchor="start">Integrated tests (L5)</text><text x="335.0" y="229.9" font-size="11.5" font-weight="700" fill="#172b3a" text-anchor="middle">clause 9 Tests on</text><text x="335.0" y="245.1" font-size="11.5" font-weight="700" fill="#172b3a" text-anchor="middle">Completion</text><text x="520.0" y="237.5" font-size="11.5" font-weight="700" fill="#172b3a" text-anchor="middle">clause 40</text><text x="705.0" y="237.5" font-size="11.5" font-weight="700" fill="#172b3a" text-anchor="middle">fire authority acceptance</text><text x="880.0" y="229.9" font-size="11.5" font-weight="700" fill="#172b3a" text-anchor="middle">IST report; authority</text><text x="880.0" y="245.1" font-size="11.5" font-weight="700" fill="#172b3a" text-anchor="middle">letter</text><text x="46.0" y="277.1" font-size="11.5" font-weight="400" fill="#172b3a" text-anchor="start">Handover (L6)</text><text x="335.0" y="277.1" font-size="11.5" font-weight="700" fill="#172b3a" text-anchor="middle">clause 10 Taking Over</text><text x="520.0" y="269.5" font-size="11.5" font-weight="700" fill="#172b3a" text-anchor="middle">completion; take over</text><text x="520.0" y="284.7" font-size="11.5" font-weight="700" fill="#172b3a" text-anchor="middle">(clause 35)</text><text x="705.0" y="277.1" font-size="11.5" font-weight="700" fill="#172b3a" text-anchor="middle">SLO before operation</text><text x="880.0" y="269.5" font-size="11.5" font-weight="700" fill="#172b3a" text-anchor="middle">taking-over certificate;</text><text x="880.0" y="284.7" font-size="11.5" font-weight="700" fill="#172b3a" text-anchor="middle">SLO</text><text x="46.0" y="316.7" font-size="11.5" font-weight="400" fill="#172b3a" text-anchor="start">Defects liability period</text><text x="335.0" y="309.1" font-size="11.5" font-weight="700" fill="#172b3a" text-anchor="middle">clause 11; Yellow Book</text><text x="335.0" y="324.2" font-size="11.5" font-weight="700" fill="#172b3a" text-anchor="middle">clause 12</text><text x="520.0" y="316.7" font-size="11.5" font-weight="700" fill="#172b3a" text-anchor="middle">defects date</text><text x="705.0" y="316.7" font-size="11.5" font-weight="700" fill="#172b3a" text-anchor="middle">SLO renewal dates</text><text x="880.0" y="309.1" font-size="11.5" font-weight="700" fill="#172b3a" text-anchor="middle">defects list, retest</text><text x="880.0" y="324.2" font-size="11.5" font-weight="700" fill="#172b3a" text-anchor="middle">records</text><text x="50.0" y="370.0" font-size="11.5" font-weight="700" fill="#b7791f" text-anchor="start">Planning values</text><text x="50.0" y="386.1" font-size="11.5" font-weight="400" fill="#172b3a" text-anchor="start">Book the fire authority inspection at least 15 working days before the planned date (planning value agreed with Dinas Gulkarmat DKI Jakarta).</text><text x="50.0" y="401.6" font-size="11.5" font-weight="400" fill="#172b3a" text-anchor="start">An installation without an SLO is not operated, whatever the contract says (rank 1 in the order of precedence, section 01.2).</text><text x="24.0" y="30.0" font-size="17" font-weight="700" fill="#172b3a" text-anchor="start">F01-10  Contract test clauses and Indonesian legal hold points by level</text><text x="24.0" y="48.0" font-size="10" font-weight="400" fill="#5b6b78" text-anchor="start">FIDIC 2017 clauses 9 to 12 · NEC4 clause 40 · LIT inspection, RLB and SLO (Permen ESDM 12/2021) · fire authority booked 15 working days ahead · SLO valid 10 years (HV,</text><text x="24.0" y="61.0" font-size="10" font-weight="400" fill="#5b6b78" text-anchor="start">MV) and 15 years (LV)</text><text x="32.0" y="452.5" font-size="10" font-weight="700" fill="#2d6a4f" text-anchor="start">WHAT TO PROVE</text><text x="32.0" y="468.5" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">• First energisation of a new MV installation needs the LIT inspection and the RLB; operation needs the SLO.</text><text x="32.0" y="483.5" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">• FIDIC Tests on Completion (clause 9) come before Taking Over (clause 10); defects after taking over fall under clause 11.</text><rect x="24" y="516.48" width="952" height="44" rx="0" fill="#f6f8fa" fill-opacity="1" stroke="#5b6b78" stroke-width="1"/><text x="32.0" y="530.5" font-size="11" font-weight="700" fill="#172b3a" text-anchor="start">F01-10  ·  Contract test clauses and Indonesian legal hold points by level</text><text x="968.0" y="530.5" font-size="10" font-weight="400" fill="#5b6b78" text-anchor="end">Chapter 01 · §01.9</text><text x="32.0" y="543.5" font-size="9" font-weight="400" fill="#5b6b78" text-anchor="start">Data Centre Commissioning Field Manual R01 EN · October 2026 · educational reference, not to scale · project and OEM documents govern</text><text x="32.0" y="555.5" font-size="9" font-weight="400" fill="#5b6b78" text-anchor="start">Symbols: QElectroTech EN 60617 and P&amp;ID collections, CC-BY 3.0, native geometry · instrument bubbles per ISA 5.1 · states per IEC 60617 / IEEE C37.2 practice</text></svg>