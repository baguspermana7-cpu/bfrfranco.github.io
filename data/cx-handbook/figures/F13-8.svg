y="1" stroke="#9fb0bb" stroke-width="0.8"/><rect x="760.6666666666667" y="418.0" width="199.33333333333334" height="22.0" rx="0" fill="#ffffff" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><rect x="40" y="440.0" width="214.66666666666666" height="22.0" rx="0" fill="#ffffff" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><rect x="254.66666666666666" y="440.0" width="199.33333333333334" height="22.0" rx="0" fill="#ffffff" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><rect x="454.0" y="440.0" width="306.6666666666667" height="22.0" rx="0" fill="#ffffff" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><rect x="760.6666666666667" y="440.0" width="199.33333333333334" height="22.0" rx="0" fill="#ffffff" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><rect x="40" y="462.0" width="214.66666666666666" height="22.0" rx="0" fill="#ffffff" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><rect x="254.66666666666666" y="462.0" width="199.33333333333334" height="22.0" rx="0" fill="#ffffff" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><rect x="454.0" y="462.0" width="306.6666666666667" height="22.0" rx="0" fill="#ffffff" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><rect x="760.6666666666667" y="462.0" width="199.33333333333334" height="22.0" rx="0" fill="#ffffff" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><rect x="40" y="484.0" width="214.66666666666666" height="22.0" rx="0" fill="#ffffff" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><rect x="254.66666666666666" y="484.0" width="199.33333333333334" height="22.0" rx="0" fill="#ffffff" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><rect x="454.0" y="484.0" width="306.6666666666667" height="22.0" rx="0" fill="#ffffff" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><rect x="760.6666666666667" y="484.0" width="199.33333333333334" height="22.0" rx="0" fill="#ffffff" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><text x="190.0" y="178.7" font-size="11" font-weight="700" fill="#b45309" text-anchor="middle">Near end: SS1 20 kV board, Q11</text><text x="190.0" y="190.8" font-size="9" font-weight="400" fill="#172b3a" text-anchor="middle">test set and operator</text><text x="190.0" y="203.0" font-size="9" font-weight="400" fill="#172b3a" text-anchor="middle">authorised person (HV)</text><text x="190.0" y="215.1" font-size="9" font-weight="400" fill="#172b3a" text-anchor="middle">barrier and sign</text><text x="190.0" y="227.2" font-size="9" font-weight="400" fill="#172b3a" text-anchor="middle">portable earth E1 removed for test</text><text x="810.0" y="178.7" font-size="11" font-weight="700" fill="#b45309" text-anchor="middle">Far end: B2 20 kV board</text><text x="810.0" y="190.8" font-size="9" font-weight="400" fill="#172b3a" text-anchor="middle">termination open, clearance kept</text><text x="810.0" y="203.0" font-size="9" font-weight="400" fill="#172b3a" text-anchor="middle">person with radio or room locked</text><text x="810.0" y="215.1" font-size="9" font-weight="400" fill="#172b3a" text-anchor="middle">barrier and sign</text><text x="810.0" y="227.2" font-size="9" font-weight="400" fill="#172b3a" text-anchor="middle">portable earth E2 removed for test</text><text x="500.0" y="195.0" font-size="10.5" font-weight="400" fill="#5b6b78" text-anchor="middle">cable B2-MV-C-011, 420 m</text><text x="500.0" y="228.0" font-size="10.5" font-weight="400" fill="#5b6b78" text-anchor="middle">three cores, screens earthed</text><text x="45.0" y="345.0" font-size="11" font-weight="700" fill="#172b3a" text-anchor="start">Step</text><text x="259.7" y="345.0" font-size="11" font-weight="700" fill="#172b3a" text-anchor="start">Who</text><text x="459.0" y="345.0" font-size="11" font-weight="700" fill="#172b3a" text-anchor="start">Value or rule</text><text x="765.7" y="345.0" font-size="11" font-weight="700" fill="#172b3a" text-anchor="start">Record</text><text x="45.0" y="367.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">Issue permit to test</text><text x="259.7" y="367.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">authorised person</text><text x="459.0" y="367.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">object, limits, earths E1 and E2</text><text x="765.7" y="367.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">permit to test</text><text x="45.0" y="389.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">Set barriers and signs</text><text x="259.7" y="389.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">testing contractor</text><text x="459.0" y="389.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">both ends, radio check</text><text x="765.7" y="389.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">permit checklist</text><text x="45.0" y="411.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">Remove earths</text><text x="259.7" y="411.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">authorised person</text><text x="459.0" y="411.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">only for the test duration</text><text x="765.7" y="411.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">earth log</text><text x="45.0" y="433.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">Apply test voltage</text><text x="259.7" y="433.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">testing contractor</text><text x="459.0" y="433.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">5,000 V DC, 1 min per core</text><text x="765.7" y="433.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">test record 13.3.3</text><text x="45.0" y="455.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">Discharge and earth</text><text x="259.7" y="455.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">testing contractor</text><text x="459.0" y="455.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">at least 4 × test time = 4 min</text><text x="765.7" y="455.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">test record</text><text x="45.0" y="477.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">Replace earths</text><text x="259.7" y="477.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">authorised person</text><text x="459.0" y="477.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">E1 and E2 counted back</text><text x="765.7" y="477.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">earth log signed</text><text x="45.0" y="499.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">Cancel permit</text><text x="259.7" y="499.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">authorised person</text><text x="459.0" y="499.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">barriers removed after earths on</text><text x="765.7" y="499.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">permit closed</text><text x="24.0" y="30.0" font-size="17" font-weight="700" fill="#172b3a" text-anchor="start">F13-8  Permit to test for a 20 kV cable: test area, barriers, earths and discharge</text><text x="24.0" y="48.0" font-size="10" font-weight="400" fill="#5b6b78" text-anchor="start">cable B2-MV-C-011, 420 m between the SS1 board and the B2 board · IR 5,000 V DC for 1 min, then earth for at least 4 min (four times the test time) · barriers and signs at</text><text x="24.0" y="61.0" font-size="10" font-weight="400" fill="#5b6b78" text-anchor="start">both ends · far end locked or attended with a radio · test postponed above 80 % RH (example limit)</text><text x="32.0" y="542.0" font-size="10" font-weight="700" fill="#2d6a4f" text-anchor="start">WHAT TO PROVE</text><text x="32.0" y="558.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">• Both cable ends are inside a barrier with a sign; the far end is locked or attended by a person with a radio.</text><text x="32.0" y="573.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">• After a 1 min DC test the cable is earthed for at least 4 min before any lead is moved.</text><text x="32.0" y="588.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">• Every earth removed for the test is listed on the permit and counted back in the earth log.</text><text x="24.0" y="623.0" font-size="10" font-weight="700" fill="#5b6b78" text-anchor="start">LEGEND</text><line x1="24" y1="645.0" x2="50" y2="645.0" stroke="#b45309" stroke-width="3"/><text x="56.0" y="649.0" font-size="10" font-weight="400" fill="#172b3a" text-anchor="start">20 kV</text><rect x="24" y="663.0" width="952" height="44" rx="0" fill="#f6f8fa" fill-opacity="1" stroke="#5b6b78" stroke-width="1"/><text x="32.0" y="677.0" font-size="11" font-weight="700" fill="#172b3a" text-anchor="start">F13-8  ·  Permit to test for a 20 kV cable: test area, barriers, earths and discharge</text><text x="968.0" y="677.0" font-size="10" font-weight="400" fill="#5b6b78" text-anchor="end">Chapter 13 · §13.3.2</text><text x="32.0" y="690.0" font-size="9" font-weight="400" fill="#5b6b78" text-anchor="start">Data Centre Commissioning Field Manual R01 EN · October 2026 · educational reference, not to scale · project and OEM documents govern</text><text x="32.0" y="702.0" font-size="9" font-weight="400" fill="#5b6b78" text-anchor="start">Symbols: QElectroTech EN 60617 and P&amp;ID collections, CC-BY 3.0, native geometry · instrument bubbles per ISA 5.1 · states per IEC 60617 / IEEE C37.2 practice</text></svg>