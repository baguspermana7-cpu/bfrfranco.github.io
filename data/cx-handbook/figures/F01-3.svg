<svg xmlns="http://www.w3.org/2000/svg" width="174mm" height="117.3mm" viewBox="0 0 1000 674" font-family="DejaVu Sans" role="img" aria-labelledby="t"><title id="t">F01-3 Order of precedence: contract, OPR, specification, drawings, standards, OEM documents, scripts</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="context-stroke"/></marker><marker id="arrow-simple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#172b3a"/></marker></defs><rect width="1000" height="674" fill="#ffffff"/><rect x="4" y="4" width="992" height="666" fill="none" stroke="#172b3a" stroke-width="1.6"/><rect x="24" y="536.4000000000001" width="952" height="56" rx="4" fill="#f1f8f4" fill-opacity="1" stroke="#2d6a4f" stroke-width="1"/><rect x="120" y="110" width="760" height="47.05" rx="0" fill="#f3dcdc" fill-opacity="1" stroke="#172b3a" stroke-width="1.4"/><rect x="120" y="161.05" width="760" height="47.05" rx="0" fill="#fdf1dc" fill-opacity="1" stroke="#172b3a" stroke-width="1.4"/><rect x="120" y="212.10000000000002" width="760" height="47.05" rx="0" fill="#fdf1dc" fill-opacity="1" stroke="#172b3a" stroke-width="1.4"/><rect x="120" y="263.15000000000003" width="760" height="47.05" rx="0" fill="#e7f1fa" fill-opacity="1" stroke="#172b3a" stroke-width="1.4"/><rect x="120" y="314.20000000000005" width="760" height="47.05" rx="0" fill="#e7f1fa" fill-opacity="1" stroke="#172b3a" stroke-width="1.4"/><rect x="120" y="365.25000000000006" width="760" height="47.05" rx="0" fill="#eaf4ea" fill-opacity="1" stroke="#172b3a" stroke-width="1.4"/><rect x="120" y="416.30000000000007" width="760" height="47.05" rx="0" fill="#eaf4ea" fill-opacity="1" stroke="#172b3a" stroke-width="1.4"/><rect x="120" y="467.3500000000001" width="760" height="47.05" rx="0" fill="#f1f1f1" fill-opacity="1" stroke="#172b3a" stroke-width="1.4"/><text x="500.0" y="125.0" font-size="13" font-weight="700" fill="#172b3a" text-anchor="middle">1  Laws and regulations</text><text x="500.0" y="139.8" font-size="11" font-weight="400" fill="#172b3a" text-anchor="middle">SLO by an accredited LIT; fire authority acceptance</text><text x="500.0" y="176.0" font-size="13" font-weight="700" fill="#172b3a" text-anchor="middle">2  Contract and conditions</text><text x="500.0" y="190.8" font-size="11" font-weight="400" fill="#172b3a" text-anchor="middle">test clauses, notice periods, retest cost</text><text x="500.0" y="227.1" font-size="13" font-weight="700" fill="#172b3a" text-anchor="middle">3  Owner project requirements (OPR)</text><text x="500.0" y="241.9" font-size="11" font-weight="400" fill="#172b3a" text-anchor="middle">for example 5 min UPS runtime at full load</text><text x="500.0" y="278.1" font-size="13" font-weight="700" fill="#172b3a" text-anchor="middle">4  Specifications</text><text x="500.0" y="293.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="middle">for example VLF 3 U0 for 60 min on 20 kV cable</text><text x="500.0" y="329.2" font-size="13" font-weight="700" fill="#172b3a" text-anchor="middle">5  Approved drawings and sequences</text><text x="500.0" y="344.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="middle">for example stage-up at 90 % load for 10 min</text><text x="500.0" y="380.2" font-size="13" font-weight="700" fill="#172b3a" text-anchor="middle">6  Standards called up by the specification</text><text x="500.0" y="395.1" font-size="11" font-weight="400" fill="#172b3a" text-anchor="middle">for example NETA ATS-2025 Table 100.1</text><text x="500.0" y="431.3" font-size="13" font-weight="700" fill="#172b3a" text-anchor="middle">7  Approved OEM documents and submittals</text><text x="500.0" y="446.1" font-size="11" font-weight="400" fill="#172b3a" text-anchor="middle">for example busway joint torque</text><text x="500.0" y="482.3" font-size="13" font-weight="700" fill="#172b3a" text-anchor="middle">8  Cx plan, scripts and checklists</text><text x="500.0" y="497.2" font-size="11" font-weight="400" fill="#172b3a" text-anchor="middle">copy values with their source; never relax them</text><text x="24.0" y="30.0" font-size="17" font-weight="700" fill="#172b3a" text-anchor="start">F01-3  Order of precedence: contract, OPR, specification, drawings, standards, OEM documents, scripts</text><text x="24.0" y="48.0" font-size="11" font-weight="400" fill="#5b6b78" text-anchor="start">rank 1 law to rank 8 Cx scripts · a lower document never relaxes a higher one · conflicts go to an RFI, answer within 5 working days</text><text x="32.0" y="550.4" font-size="10" font-weight="700" fill="#2d6a4f" text-anchor="start">WHAT TO PROVE</text><text x="32.0" y="566.4" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">• The OPR (rank 3) sits above the specification (rank 4): an OPR requirement for 100 % testing of the critical power path overrides a 10 % sampling clause.</text><text x="32.0" y="581.4" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">• An OEM limit (rank 7) protects a component: the component is disconnected during a higher-voltage test and this is recorded on the test sheet.</text><rect x="24" y="614.4000000000001" width="952" height="44" rx="0" fill="#f6f8fa" fill-opacity="1" stroke="#5b6b78" stroke-width="1"/><text x="32.0" y="628.4" font-size="11" font-weight="700" fill="#172b3a" text-anchor="start">F01-3  ·  Order of precedence: contract, OPR, specification, drawings, standards, OEM documents, scripts</text><text x="968.0" y="628.4" font-size="10" font-weight="400" fill="#5b6b78" text-anchor="end">Chapter 01 · §01.2</text><text x="32.0" y="641.4" font-size="9" font-weight="400" fill="#5b6b78" text-anchor="start">Data Centre Commissioning Field Manual R01 EN · October 2026 · educational reference, not to scale · project and OEM documents govern</text><text x="32.0" y="653.4" font-size="9" font-weight="400" fill="#5b6b78" text-anchor="start">Symbols: QElectroTech EN 60617 and P&amp;ID collections, CC-BY 3.0, native geometry · instrument bubbles per ISA 5.1 · states per IEC 60617 / IEEE C37.2 practice</text></svg>