<svg xmlns="http://www.w3.org/2000/svg" width="174mm" height="122.7mm" viewBox="0 0 1000 705" font-family="DejaVu Sans" role="img" aria-labelledby="t"><title id="t">F33-10 Abbreviations with two meanings and how to read them from the record</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="context-stroke"/></marker><marker id="arrow-simple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#172b3a"/></marker></defs><rect width="1000" height="705" fill="#ffffff"/><rect x="4" y="4" width="992" height="697" fill="none" stroke="#172b3a" stroke-width="1.6"/><rect x="24" y="525.05" width="952" height="56" rx="4" fill="#f1f8f4" fill-opacity="1" stroke="#2d6a4f" stroke-width="1"/><rect x="40" y="110" width="85.86666666666666" height="28" rx="0" fill="#e9f0f4" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><rect x="125.86666666666666" y="110" width="282.1333333333333" height="28" rx="0" fill="#e9f0f4" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><rect x="408.0" y="110" width="282.1333333333333" height="28" rx="0" fill="#e9f0f4" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><rect x="690.1333333333333" y="110" width="269.8666666666667" height="28" rx="0" fill="#e9f0f4" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><rect x="40" y="138" width="85.86666666666666" height="28" rx="0" fill="#ffffff" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><rect x="125.86666666666666" y="138" width="282.1333333333333" height="28" rx="0" fill="#ffffff" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><rect x="408.0" y="138" width="282.1333333333333" height="28" rx="0" fill="#ffffff" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><rect x="690.1333333333333" y="138" width="269.8666666666667" height="28" rx="0" fill="#ffffff" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><rect x="40" y="166" width="85.86666666666666" height="28" rx="0" fill="#ffffff" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><rect x="125.86666666666666" y="166" width="282.1333333333333" height="28" rx="0" fill="#ffffff" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><rect x="408.0" y="166" width="282.1333333333333" height="28" rx="0" fill="#ffffff" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><rect x="690.1333333333333" y="166" width="269.8666666666667" height="28" rx="0" fill="#ffffff" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><rect x="40" y="194" width="85.86666666666666" height="28" rx="0" fill="#ffffff" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><rect x="125.86666666666666" y="194" width="282.1333333333333" height="28" rx="0" fill="#ffffff" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><rect x="408.0" y="194" width="282.1333333333333" height="28" rx="0" fill="#ffffff" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><rect x="690.1333333333333" y="194" width="269.8666666666667" height="28" rx="0" fill="#ffffff" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><rect x="40" y="222" width="85.86666666666666" height="28" rx="0" fill="#ffffff" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><rect x="125.86666666666666" y="222" width="282.1333333333333" height="28" rx="0" fill="#ffffff" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><rect x="408.0" y="222" width="282.1333333333333" height="28" rx="0" fill="#ffffff" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><rect x="690.1333333333333" y="222" width="269.8666666666667" height="28" rx="0" fill="#ffffff" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><rect x="40" y="250" width="85.86666666666666" height="28" rx="0" fill="#ffffff" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><rect x="125.86666666666666" y="250" width="282.1333333333333" height="28" rx="0" fill="#ffffff" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><rect x="408.0" y="250" width="282.1333333333333" height="28" rx="0" fill="#ffffff" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><rect x="690.1333333333333" y="250" width="269.8666666666667" height="28" rx="0" fill="#ffffff" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><rect x="40" y="300" width="290" height="100" rx="0" fill="#ffffff" fill-opacity="1" stroke="#475569" stroke-width="1.4"/><path d="M316 300 v14 h14" fill="none" stroke="#475569" stroke-width="1.2"/><rect x="355" y="300" width="290" height="100" rx="0" fill="#ffffff" fill-opacity="1" stroke="#475569" stroke-width="1.4"/><path d="M631 300 v14 h14" fill="none" stroke="#475569" stroke-width="1.2"/><rect x="670" y="300" width="290" height="100" rx="0" fill="#ffffff" fill-opacity="1" stroke="#475569" stroke-width="1.4"/><path d="M946 300 v14 h14" fill="none" stroke="#475569" stroke-width="1.2"/><rect x="40" y="430" width="920" height="73.05000000000001" rx="4" fill="#fffbe6" fill-opacity="1" stroke="#b7791f" stroke-width="1.2"/><text x="45.0" y="129.0" font-size="11" font-weight="700" fill="#172b3a" text-anchor="start">Abbr.</text><text x="130.9" y="129.0" font-size="11" font-weight="700" fill="#172b3a" text-anchor="start">Meaning 1 (section)</text><text x="413.0" y="129.0" font-size="11" font-weight="700" fill="#172b3a" text-anchor="start">Meaning 2 (section)</text><text x="695.1" y="129.0" font-size="11" font-weight="700" fill="#172b3a" text-anchor="start">Clue in the record</text><text x="45.0" y="157.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">IR</text><text x="130.9" y="157.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">insulation resistance (13.4)</text><text x="413.0" y="157.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">inspection request (07.5)</text><text x="695.1" y="157.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">MΩ value or register number</text><text x="45.0" y="185.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">PRP</text><text x="130.9" y="185.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">prime rated power (15.2.1)</text><text x="413.0" y="185.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">Parallel Redundancy (26.2)</text><text x="695.1" y="185.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">kW rating or LAN A and B</text><text x="45.0" y="213.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">LPS</text><text x="130.9" y="213.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">lightning protection (17.6)</text><text x="413.0" y="213.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">Last Planner System (11.8)</text><text x="695.1" y="213.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">Ω reading or PPC in %</text><text x="45.0" y="241.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">DP</text><text x="130.9" y="241.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">differential pressure (18.11)</text><text x="413.0" y="241.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">dew point (19.2)</text><text x="695.1" y="241.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">kPa or bar, or °C</text><text x="45.0" y="269.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">A3</text><text x="130.9" y="269.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">ISO 19650 status code (04.3)</text><text x="413.0" y="269.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">A3 report on one sheet (09.7)</text><text x="695.1" y="269.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">CDE status or quality log</text><text x="185.0" y="329.7" font-size="11" font-weight="700" fill="#475569" text-anchor="middle">Electrical test record</text><text x="185.0" y="341.9" font-size="9" font-weight="400" fill="#172b3a" text-anchor="middle">ELE-L3-LVSB-B2-A1-01</text><text x="185.0" y="354.0" font-size="9" font-weight="400" fill="#172b3a" text-anchor="middle">field &quot;IR, MΩ at 1,000 V DC&quot;</text><text x="185.0" y="366.2" font-size="9" font-weight="400" fill="#172b3a" text-anchor="middle">meaning: insulation resistance</text><text x="500.0" y="329.7" font-size="11" font-weight="700" fill="#475569" text-anchor="middle">Quality register</text><text x="500.0" y="341.9" font-size="9" font-weight="400" fill="#172b3a" text-anchor="middle">inspection request log</text><text x="500.0" y="354.0" font-size="9" font-weight="400" fill="#172b3a" text-anchor="middle">&quot;IR raised 24 h before hold&quot;</text><text x="500.0" y="366.2" font-size="9" font-weight="400" fill="#172b3a" text-anchor="middle">meaning: inspection request</text><text x="815.0" y="329.7" font-size="11" font-weight="700" fill="#475569" text-anchor="middle">Generator data sheet</text><text x="815.0" y="341.9" font-size="9" font-weight="400" fill="#172b3a" text-anchor="middle">2.88 MW set, ISO 8528-1</text><text x="815.0" y="354.0" font-size="9" font-weight="400" fill="#172b3a" text-anchor="middle">&quot;ESP, PRP and COP ratings&quot;</text><text x="815.0" y="366.2" font-size="9" font-weight="400" fill="#172b3a" text-anchor="middle">meaning: prime rated power</text><text x="50.0" y="443.2" font-size="11" font-weight="700" fill="#b7791f" text-anchor="start">Rule for scripts and reports</text><text x="50.0" y="458.6" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">1. Write the full term at first use with the abbreviation in brackets, for example &quot;insulation resistance (IR)&quot;.</text><text x="50.0" y="473.4" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">2. Where a line could carry either meaning, write the full term again in that line.</text><text x="50.0" y="488.3" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">3. In a table header, write the unit beside the abbreviation (IR, MΩ) so the meaning follows from the unit.</text><text x="24.0" y="30.0" font-size="17" font-weight="700" fill="#172b3a" text-anchor="start">F33-10  Abbreviations with two meanings and how to read them from the record</text><text x="24.0" y="48.0" font-size="11" font-weight="400" fill="#5b6b78" text-anchor="start">IR, PRP, LPS, DP and A3 each have two meanings in this manual · the form code, the unit or the register beside the abbreviation shows which meaning applies</text><text x="32.0" y="539.0" font-size="10" font-weight="700" fill="#2d6a4f" text-anchor="start">WHAT TO PROVE</text><text x="32.0" y="555.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">• IR followed by a value in MΩ or GΩ is insulation resistance; IR with a register number in the quality log is an inspection request with 24 h notice.</text><text x="32.0" y="570.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">• PRP on a generator data sheet is prime rated power (ISO 8528-1); PRP in a network design is the Parallel Redundancy Protocol (IEC 62439-3).</text><text x="24.0" y="605.0" font-size="10" font-weight="700" fill="#5b6b78" text-anchor="start">LEGEND</text><line x1="24" y1="627.05" x2="50" y2="627.05" stroke="#475569" stroke-width="3"/><text x="56.0" y="631.0" font-size="10" font-weight="400" fill="#172b3a" text-anchor="start">signal / control</text><rect x="24" y="645.05" width="952" height="44" rx="0" fill="#f6f8fa" fill-opacity="1" stroke="#5b6b78" stroke-width="1"/><text x="32.0" y="659.0" font-size="11" font-weight="700" fill="#172b3a" text-anchor="start">F33-10  ·  Abbreviations with two meanings and how to read them from the record</text><text x="968.0" y="659.0" font-size="10" font-weight="400" fill="#5b6b78" text-anchor="end">Chapter 33 · §33.5.5</text><text x="32.0" y="672.0" font-size="9" font-weight="400" fill="#5b6b78" text-anchor="start">Data Centre Commissioning Field Manual R01 EN · October 2026 · educational reference, not to scale · project and OEM documents govern</text><text x="32.0" y="684.0" font-size="9" font-weight="400" fill="#5b6b78" text-anchor="start">Symbols: QElectroTech EN 60617 and P&amp;ID collections, CC-BY 3.0, native geometry · instrument bubbles per ISA 5.1 · states per IEC 60617 / IEEE C37.2 practice</text></svg>