troke-width="0.8"/><rect x="784.0" y="330.0" width="576.0" height="22.0" rx="0" fill="#e9f0f4" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><rect x="640" y="352.0" width="144.0" height="22.0" rx="0" fill="#ffffff" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><rect x="784.0" y="352.0" width="576.0" height="22.0" rx="0" fill="#ffffff" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><rect x="640" y="374.0" width="144.0" height="22.0" rx="0" fill="#ffffff" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><rect x="784.0" y="374.0" width="576.0" height="22.0" rx="0" fill="#ffffff" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><rect x="640" y="396.0" width="144.0" height="22.0" rx="0" fill="#ffffff" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><rect x="784.0" y="396.0" width="576.0" height="22.0" rx="0" fill="#ffffff" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><rect x="640" y="418.0" width="144.0" height="22.0" rx="0" fill="#ffffff" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><rect x="784.0" y="418.0" width="576.0" height="22.0" rx="0" fill="#ffffff" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><text x="330.0" y="228.5" font-size="11" font-weight="700" fill="#172b3a" text-anchor="middle">zone D: contact, to 250 µm</text><text x="480.0" y="340.0" font-size="11" font-weight="700" fill="#172b3a" text-anchor="start">zone C</text><text x="480.0" y="356.0" font-size="10.5" font-weight="400" fill="#5b6b78" text-anchor="start">110 to 135 µm</text><text x="480.0" y="410.0" font-size="11" font-weight="700" fill="#172b3a" text-anchor="start">zone B</text><text x="480.0" y="426.0" font-size="10.5" font-weight="400" fill="#5b6b78" text-anchor="start">25 to 110 µm</text><text x="330.0" y="541.5" font-size="11" font-weight="700" fill="#b42318" text-anchor="middle">zone A: core, 0 to 25 µm (centre)</text><text x="645.0" y="155.0" font-size="11" font-weight="700" fill="#172b3a" text-anchor="start">Zone</text><text x="765.0" y="155.0" font-size="11" font-weight="700" fill="#172b3a" text-anchor="start">Diameter (µm)</text><text x="897.0" y="155.0" font-size="11" font-weight="700" fill="#172b3a" text-anchor="start">Graded in 2022 edition</text><text x="1053.0" y="155.0" font-size="11" font-weight="700" fill="#172b3a" text-anchor="start">Action on contamination</text><text x="645.0" y="177.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">A core</text><text x="765.0" y="177.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">0 to 25</text><text x="897.0" y="177.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">yes, strictest limits</text><text x="1053.0" y="177.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">clean; scratch or pit: replace</text><text x="645.0" y="199.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">B cladding</text><text x="765.0" y="199.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">25 to 110</text><text x="897.0" y="199.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">yes</text><text x="1053.0" y="199.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">clean; defect over limit: replace</text><text x="645.0" y="221.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">C adhesive</text><text x="765.0" y="221.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">110 to 135</text><text x="897.0" y="221.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">no (removed)</text><text x="1053.0" y="221.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">clean loose debris</text><text x="645.0" y="243.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">D contact</text><text x="765.0" y="243.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">135 to 250</text><text x="897.0" y="243.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">no (removed)</text><text x="1053.0" y="243.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">clean loose debris before mating</text><text x="645.0" y="345.0" font-size="11" font-weight="700" fill="#172b3a" text-anchor="start">Step</text><text x="789.0" y="345.0" font-size="11" font-weight="700" fill="#172b3a" text-anchor="start">Instrument and setting</text><text x="645.0" y="367.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">1 Inspect</text><text x="789.0" y="367.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">video probe, small field of view ≥ 250 µm, detects 2 µm defects and 3 µm scratches</text><text x="645.0" y="389.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">2 Clean</text><text x="789.0" y="389.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">one-click cleaner for bulkheads, cassette wipe and solvent pen for cords</text><text x="645.0" y="411.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">3 Re-inspect</text><text x="789.0" y="411.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">automatic grading against the IEC 61300-3-35 profile; save image to the link record</text><text x="645.0" y="433.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">4 MPO</text><text x="789.0" y="433.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">large field of view ≥ 6.4 x 2.5 mm for the whole ferrule, then each fibre in zones A and B</text><text x="24.0" y="30.0" font-size="17" font-weight="700" fill="#172b3a" text-anchor="start">F26-5  Single-mode connector end face: inspection zones of IEC 61300-3-35 (2022) and the decision</text><text x="24.0" y="48.0" font-size="11" font-weight="400" fill="#5b6b78" text-anchor="start">zone A core 0 to 25 µm · zone B cladding 25 to 110 µm (115 µm in the 2015 edition) · zone C adhesive and zone D contact to 250 µm are cleaned and inspected but no longer graded · inspect, clean, re-inspect before every mating</text><text x="32.0" y="580.1" font-size="10" font-weight="700" fill="#2d6a4f" text-anchor="start">WHAT TO PROVE</text><text x="32.0" y="596.1" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">• Grade with the inspection probe set to the IEC 61300-3-35 single-mode UPC or APC profile; a FAIL in zone A or B means clean and re-inspect, then replace if the defect is a scratch or pit.</text><text x="32.0" y="611.1" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">• Visual inspection does not replace the loss and return-loss tests; a connector that passes inspection still has to pass the OLTS test.</text><rect x="24" y="644.14" width="1352" height="44" rx="0" fill="#f6f8fa" fill-opacity="1" stroke="#5b6b78" stroke-width="1"/><text x="32.0" y="658.1" font-size="11" font-weight="700" fill="#172b3a" text-anchor="start">F26-5  ·  Single-mode connector end face: inspection zones of IEC 61300-3-35 (2022) and the decision</text><text x="1368.0" y="658.1" font-size="10" font-weight="400" fill="#5b6b78" text-anchor="end">Chapter 26 · §26.7</text><text x="32.0" y="671.1" font-size="9" font-weight="400" fill="#5b6b78" text-anchor="start">Data Centre Commissioning Field Manual R01 EN · October 2026 · educational reference, not to scale · project and OEM documents govern</text><text x="32.0" y="683.1" font-size="9" font-weight="400" fill="#5b6b78" text-anchor="start">Symbols: QElectroTech EN 60617 and P&amp;ID collections, CC-BY 3.0, native geometry · instrument bubbles per ISA 5.1 · states per IEC 60617 / IEEE C37.2 practice</text></svg>