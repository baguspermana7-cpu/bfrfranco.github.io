" stroke-width="1.4"/><rect x="80" y="502" width="560" height="58" rx="0" fill="#ffffff" fill-opacity="1" stroke="#172b3a" stroke-width="1.4"/><rect x="860" y="502" width="420" height="58" rx="8" fill="#ffffff" fill-opacity="1" stroke="#475569" stroke-width="1.4"/><rect x="80" y="600" width="560" height="58" rx="8" fill="#ffffff" fill-opacity="1" stroke="#b91c1c" stroke-width="1.4"/><text x="360.0" y="137.6" font-size="12.5" font-weight="700" fill="#172b3a" text-anchor="middle">Installed work wrong against the documents</text><text x="1070.0" y="137.6" font-size="12.5" font-weight="700" fill="#b91c1c" text-anchor="middle">NCR (chapter 09)</text><text x="700.0" y="130.0" font-size="11.5" font-weight="700" fill="#b91c1c" text-anchor="start">yes</text><text x="360.0" y="235.6" font-size="12.5" font-weight="700" fill="#172b3a" text-anchor="middle">Asks approval of a product, drawing or method</text><text x="1070.0" y="235.6" font-size="12.5" font-weight="700" fill="#334155" text-anchor="middle">Submittal or MAR (chapter 06)</text><text x="700.0" y="228.0" font-size="11.5" font-weight="700" fill="#334155" text-anchor="start">yes</text><text x="370.0" y="190.0" font-size="11.5" font-weight="700" fill="#5b6b78" text-anchor="start">no</text><text x="360.0" y="333.6" font-size="12.5" font-weight="700" fill="#172b3a" text-anchor="middle">Asks to change scope, price or time</text><text x="1070.0" y="333.6" font-size="12.5" font-weight="700" fill="#b91c1c" text-anchor="middle">Change request or notice (chapter 08)</text><text x="700.0" y="326.0" font-size="11.5" font-weight="700" fill="#b91c1c" text-anchor="start">yes</text><text x="370.0" y="288.0" font-size="11.5" font-weight="700" fill="#5b6b78" text-anchor="start">no</text><text x="360.0" y="431.6" font-size="12.5" font-weight="700" fill="#172b3a" text-anchor="middle">Instruction already given orally</text><text x="1070.0" y="431.6" font-size="12.5" font-weight="700" fill="#475569" text-anchor="middle">CVI within the contract period</text><text x="700.0" y="424.0" font-size="11.5" font-weight="700" fill="#475569" text-anchor="start">yes</text><text x="370.0" y="386.0" font-size="11.5" font-weight="700" fill="#5b6b78" text-anchor="start">no</text><text x="360.0" y="529.6" font-size="12.5" font-weight="700" fill="#172b3a" text-anchor="middle">Meaning of documents, missing item, clash, field condition</text><text x="1070.0" y="529.6" font-size="12.5" font-weight="700" fill="#475569" text-anchor="middle">RFI (TQ if from a supplier)</text><text x="700.0" y="522.0" font-size="11.5" font-weight="700" fill="#475569" text-anchor="start">yes</text><text x="370.0" y="484.0" font-size="11.5" font-weight="700" fill="#5b6b78" text-anchor="start">no</text><text x="360.0" y="620.5" font-size="12.5" font-weight="700" fill="#b91c1c" text-anchor="middle">None of the above</text><text x="360.0" y="634.7" font-size="10.5" font-weight="400" fill="#172b3a" text-anchor="middle">return to sender within 2 working days</text><text x="370.0" y="582.0" font-size="11.5" font-weight="700" fill="#5b6b78" text-anchor="start">no</text><text x="24.0" y="30.0" font-size="17" font-weight="700" fill="#172b3a" text-anchor="start">F05-2  Decision tree: RFI, submittal, change request, CVI or NCR</text><text x="24.0" y="48.0" font-size="11" font-weight="400" fill="#5b6b78" text-anchor="start">Questions asked in order · an item that fits none of the five RFI triggers is returned within 2 working days with the correct instrument named</text><text x="32.0" y="694.0" font-size="10" font-weight="700" fill="#2d6a4f" text-anchor="start">WHAT TO PROVE</text><text x="32.0" y="710.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">• Approval of a product, drawing or method is a submittal or MAR; a request to change scope, price or time is a change request or notice.</text><text x="32.0" y="725.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">• Only questions about the meaning of the documents, missing items, clashes and field conditions are RFIs; a supplier question during engineering can be a TQ.</text><text x="24.0" y="760.0" font-size="10" font-weight="700" fill="#5b6b78" text-anchor="start">LEGEND</text><line x1="24" y1="782" x2="50" y2="782" stroke="#b91c1c" stroke-width="3"/><text x="56.0" y="786.0" font-size="10" font-weight="400" fill="#172b3a" text-anchor="start">trip / protection</text><line x1="155.9671875" y1="782" x2="181.9671875" y2="782" stroke="#334155" stroke-width="3"/><text x="188.0" y="786.0" font-size="10" font-weight="400" fill="#172b3a" text-anchor="start">data / network</text><line x1="282.8265625" y1="782" x2="308.8265625" y2="782" stroke="#475569" stroke-width="3"/><text x="314.8" y="786.0" font-size="10" font-weight="400" fill="#172b3a" text-anchor="start">signal / control</text><rect x="24" y="800" width="1352" height="44" rx="0" fill="#f6f8fa" fill-opacity="1" stroke="#5b6b78" stroke-width="1"/><text x="32.0" y="814.0" font-size="11" font-weight="700" fill="#172b3a" text-anchor="start">F05-2  ·  Decision tree: RFI, submittal, change request, CVI or NCR</text><text x="1368.0" y="814.0" font-size="10" font-weight="400" fill="#5b6b78" text-anchor="end">Chapter 05 · §05.2</text><text x="32.0" y="827.0" font-size="9" font-weight="400" fill="#5b6b78" text-anchor="start">Data Centre Commissioning Field Manual R01 EN · October 2026 · educational reference, not to scale · project and OEM documents govern</text><text x="32.0" y="839.0" font-size="9" font-weight="400" fill="#5b6b78" text-anchor="start">Symbols: QElectroTech EN 60617 and P&amp;ID collections, CC-BY 3.0, native geometry · instrument bubbles per ISA 5.1 · states per IEC 60617 / IEEE C37.2 practice</text></svg>