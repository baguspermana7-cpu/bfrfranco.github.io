 fill="#172b3a" text-anchor="start">6.0</text><text x="385.0" y="709.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">0 h 50 min</text><text x="745.0" y="709.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">23.8</text><text x="965.0" y="709.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">50.0</text><text x="1205.0" y="709.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">pass</text><text x="45.0" y="731.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">75 %</text><text x="205.0" y="731.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">9.0</text><text x="385.0" y="731.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">0 h 55 min</text><text x="745.0" y="731.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">24.3</text><text x="965.0" y="731.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">52.5</text><text x="1205.0" y="731.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">pass</text><text x="45.0" y="753.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">100 %</text><text x="205.0" y="753.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">12.0</text><text x="385.0" y="753.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">1 h 05 min, then 4 h hold</text><text x="745.0" y="753.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">24.9</text><text x="965.0" y="753.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">55.0</text><text x="1205.0" y="753.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">pass</text><circle cx="296.0" cy="161.0" r="4" fill="#b7791f"/><circle cx="482.0" cy="161.0" r="4" fill="#b7791f"/><circle cx="668.0" cy="161.0" r="4" fill="#b7791f"/><text x="24.0" y="30.0" font-size="17" font-weight="700" fill="#172b3a" text-anchor="start">F19-5  Hall B2-DH3 temperatures during the heat-load test steps 25, 50, 75 and 100 %</text><text x="24.0" y="48.0" font-size="11" font-weight="400" fill="#5b6b78" text-anchor="start">steps at 0, 1.5, 3.0 and 4.5 h · 100 % (12.0 MW) held 4 h · max rack inlet 23.4 to 24.9 °C · hot aisle 30.5 to 35.9 °C · TCS supply 45.0 to 45.2 °C, return 47.5 to 55.0 °C · FWS 35.0 to 35.2 °C</text><text x="32.0" y="796.0" font-size="10" font-weight="700" fill="#2d6a4f" text-anchor="start">WHAT TO PROVE</text><text x="32.0" y="812.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">• The maximum rack inlet of 24.9 °C at 100 % load stays inside the ASHRAE 18 to 27 °C recommended range.</text><text x="32.0" y="827.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">• The TCS return of 55.0 °C at 100 % equals the design return, which confirms the 10 K design rise at 139.2 L/min per rack.</text><rect x="24" y="860.0" width="1352" height="44" rx="0" fill="#f6f8fa" fill-opacity="1" stroke="#5b6b78" stroke-width="1"/><text x="32.0" y="874.0" font-size="11" font-weight="700" fill="#172b3a" text-anchor="start">F19-5  ·  Hall B2-DH3 temperatures during the heat-load test steps 25, 50, 75 and 100 %</text><text x="1368.0" y="874.0" font-size="10" font-weight="400" fill="#5b6b78" text-anchor="end">Chapter 19 · §19.14</text><text x="32.0" y="887.0" font-size="9" font-weight="400" fill="#5b6b78" text-anchor="start">Data Centre Commissioning Field Manual R01 EN · October 2026 · educational reference, not to scale · project and OEM documents govern</text><text x="32.0" y="899.0" font-size="9" font-weight="400" fill="#5b6b78" text-anchor="start">Symbols: QElectroTech EN 60617 and P&amp;ID collections, CC-BY 3.0, native geometry · instrument bubbles per ISA 5.1 · states per IEC 60617 / IEEE C37.2 practice</text></svg>