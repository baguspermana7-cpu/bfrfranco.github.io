ct x="322.8571428571429" y="454.0" width="612.8571428571429" height="22.0" rx="0" fill="#ffffff" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><rect x="935.7142857142858" y="454.0" width="424.28571428571433" height="22.0" rx="0" fill="#ffffff" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><rect x="40" y="476.0" width="282.8571428571429" height="22.0" rx="0" fill="#ffffff" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><rect x="322.8571428571429" y="476.0" width="612.8571428571429" height="22.0" rx="0" fill="#ffffff" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><rect x="935.7142857142858" y="476.0" width="424.28571428571433" height="22.0" rx="0" fill="#ffffff" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><rect x="40" y="498.0" width="282.8571428571429" height="22.0" rx="0" fill="#ffffff" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><rect x="322.8571428571429" y="498.0" width="612.8571428571429" height="22.0" rx="0" fill="#ffffff" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><rect x="935.7142857142858" y="498.0" width="424.28571428571433" height="22.0" rx="0" fill="#ffffff" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><rect x="40" y="520.0" width="282.8571428571429" height="22.0" rx="0" fill="#ffffff" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><rect x="322.8571428571429" y="520.0" width="612.8571428571429" height="22.0" rx="0" fill="#ffffff" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><rect x="935.7142857142858" y="520.0" width="424.28571428571433" height="22.0" rx="0" fill="#ffffff" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><rect x="40" y="542.0" width="282.8571428571429" height="22.0" rx="0" fill="#ffffff" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><rect x="322.8571428571429" y="542.0" width="612.8571428571429" height="22.0" rx="0" fill="#ffffff" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><rect x="935.7142857142858" y="542.0" width="424.28571428571433" height="22.0" rx="0" fill="#ffffff" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><text x="195.0" y="123.8" font-size="12" font-weight="700" fill="#475569" text-anchor="middle">L0 submittal review</text><text x="195.0" y="137.3" font-size="10" font-weight="400" fill="#172b3a" text-anchor="middle">10 days per cycle</text><text x="195.0" y="150.8" font-size="10" font-weight="400" fill="#172b3a" text-anchor="middle">comment log closed</text><text x="531.0" y="123.8" font-size="12" font-weight="700" fill="#475569" text-anchor="middle">L1 FAT</text><text x="531.0" y="137.3" font-size="10" font-weight="400" fill="#172b3a" text-anchor="middle">3 to 5 days</text><text x="531.0" y="150.8" font-size="10" font-weight="400" fill="#172b3a" text-anchor="middle">BMS-L1-FAT report</text><text x="867.0" y="123.8" font-size="12" font-weight="700" fill="#475569" text-anchor="middle">L2 installation</text><text x="867.0" y="137.3" font-size="10" font-weight="400" fill="#172b3a" text-anchor="middle">5 to 10 days</text><text x="867.0" y="150.8" font-size="10" font-weight="400" fill="#172b3a" text-anchor="middle">BMS-L2 checklists</text><text x="1203.0" y="123.8" font-size="12" font-weight="700" fill="#475569" text-anchor="middle">L3 network checkout</text><text x="1203.0" y="137.3" font-size="10" font-weight="400" fill="#172b3a" text-anchor="middle">2 to 3 days</text><text x="1203.0" y="150.8" font-size="10" font-weight="400" fill="#172b3a" text-anchor="middle">register match</text><text x="195.0" y="273.8" font-size="12" font-weight="700" fill="#475569" text-anchor="middle">L3 P2P and calibration</text><text x="195.0" y="287.3" font-size="10" font-weight="400" fill="#172b3a" text-anchor="middle">10 to 15 days</text><text x="195.0" y="300.8" font-size="10" font-weight="400" fill="#172b3a" text-anchor="middle">P2P sheets signed</text><text x="531.0" y="273.8" font-size="12" font-weight="700" fill="#475569" text-anchor="middle">L4 loop tuning</text><text x="531.0" y="287.3" font-size="10" font-weight="400" fill="#172b3a" text-anchor="middle">3 to 5 days</text><text x="531.0" y="300.8" font-size="10" font-weight="400" fill="#172b3a" text-anchor="middle">response records</text><text x="867.0" y="273.8" font-size="12" font-weight="700" fill="#475569" text-anchor="middle">L4 sequences and system tests</text><text x="867.0" y="287.3" font-size="10" font-weight="400" fill="#172b3a" text-anchor="middle">10 to 15 days</text><text x="867.0" y="300.8" font-size="10" font-weight="400" fill="#172b3a" text-anchor="middle">scripts signed</text><text x="1203.0" y="273.8" font-size="12" font-weight="700" fill="#475569" text-anchor="middle">L5 IST</text><text x="1203.0" y="287.3" font-size="10" font-weight="400" fill="#172b3a" text-anchor="middle">chapter 28</text><text x="1203.0" y="300.8" font-size="10" font-weight="400" fill="#172b3a" text-anchor="middle">IST record</text><text x="45.0" y="425.0" font-size="11" font-weight="700" fill="#172b3a" text-anchor="start">Gate before the step</text><text x="327.9" y="425.0" font-size="11" font-weight="700" fill="#172b3a" text-anchor="start">Blocks the step until</text><text x="940.7" y="425.0" font-size="11" font-weight="700" fill="#172b3a" text-anchor="start">Depends on</text><text x="45.0" y="447.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">FAT</text><text x="327.9" y="447.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">FAT procedure approved 10 working days before</text><text x="940.7" y="447.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">controls contractor, commissioning manager</text><text x="45.0" y="469.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">L2 installation</text><text x="327.9" y="469.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">panels installed, field wiring terminated</text><text x="940.7" y="469.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">electrical contractor</text><text x="45.0" y="491.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">Network checkout</text><text x="327.9" y="491.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">OT switches configured, VLANs and IP addresses issued</text><text x="940.7" y="491.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">network contractor (chapter 26)</text><text x="45.0" y="513.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">P2P</text><text x="327.9" y="513.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">OEM start-up of CDU and CRAH done; Modbus maps frozen</text><text x="940.7" y="513.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">CDU and CRAH OEMs (chapter 25)</text><text x="45.0" y="535.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">Loop tuning</text><text x="327.9" y="535.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">water flowing at design conditions; heater skids connected</text><text x="940.7" y="535.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">mechanical contractor, load bank supplier</text><text x="45.0" y="557.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">Sequence tests</text><text x="327.9" y="557.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">P2P closed with no open Category A issue</text><text x="940.7" y="557.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">controls contractor</text><text x="24.0" y="30.0" font-size="17" font-weight="700" fill="#172b3a" text-anchor="start">F22-1  BMS commissioning workflow for one MSC-1 hall: steps, durations and the record that closes each step</text><text x="24.0" y="48.0" font-size="11" font-weight="400" fill="#5b6b78" text-anchor="start">submittal review 10 working days per cycle · FAT 3–5 days · L2 5–10 days · network checkout 2–3 days · P2P and calibration 10–15 days for 1,480 points · tuning 3–5 days · sequences and system tests 10–15 days</text><text x="32.0" y="600.0" font-size="10" font-weight="700" fill="#2d6a4f" text-anchor="start">WHAT TO PROVE</text><text x="32.0" y="616.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">• P2P starts only after OEM start-up of each unit and the network checkout; loop tuning needs load from heater skids (9.6 MW liquid and 2.4 MW air per hall in the MSC-1 example).</text><text x="32.0" y="631.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">• Sequence tests start only with no open Category A issue from P2P; the BMS sign-off requires an empty override summary.</text><text x="24.0" y="666.0" font-size="10" font-weight="700" fill="#5b6b78" text-anchor="start">LEGEND</text><line x1="24" y1="688.0" x2="50" y2="688.0" stroke="#475569" stroke-width="3"/><text x="56.0" y="692.0" font-size="10" font-weight="400" fill="#172b3a" text-anchor="start">signal / control</text><rect x="24" y="706.0" width="1352" height="44" rx="0" fill="#f6f8fa" fill-opacity="1" stroke="#5b6b78" stroke-width="1"/><text x="32.0" y="720.0" font-size="11" font-weight="700" fill="#172b3a" text-anchor="start">F22-1  ·  BMS commissioning workflow for one MSC-1 hall: steps, durations and the record that closes each step</text><text x="1368.0" y="720.0" font-size="10" font-weight="400" fill="#5b6b78" text-anchor="end">Chapter 22 · §22.1</text><text x="32.0" y="733.0" font-size="9" font-weight="400" fill="#5b6b78" text-anchor="start">Data Centre Commissioning Field Manual R01 EN · October 2026 · educational reference, not to scale · project and OEM documents govern</text><text x="32.0" y="745.0" font-size="9" font-weight="400" fill="#5b6b78" text-anchor="start">Symbols: QElectroTech EN 60617 and P&amp;ID collections, CC-BY 3.0, native geometry · instrument bubbles per ISA 5.1 · states per IEC 60617 / IEEE C37.2 practice</text></svg>