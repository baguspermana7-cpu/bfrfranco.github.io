<text x="1160.8" y="233.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">L1-L2 deepest</text><text x="1015.0" y="255.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">Threshold</text><text x="1160.8" y="255.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">90 % Udin</text><text x="1015.0" y="277.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">Hysteresis</text><text x="1160.8" y="277.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">2 %</text><circle cx="358.7" cy="419.8" r="4" fill="#b7791f"/><circle cx="276.7" cy="351.7" r="4" fill="#b7791f"/><circle cx="604.7" cy="225.0" r="4" fill="#b7791f"/><text x="24.0" y="30.0" font-size="17" font-weight="700" fill="#172b3a" text-anchor="start">F17-5  RMS voltage of event E3 recorded at half-cycle resolution: depth, duration and recovery of a voltage dip</text><text x="24.0" y="48.0" font-size="11" font-weight="400" fill="#5b6b78" text-anchor="start">Class A meter, Udin 415 V phase to phase · dip threshold 90 % (373.5 V), hysteresis 2 % · residual voltage 257 V (62 %) on L1-L2 · duration 120 ms from the first half-cycle below 373.5 V to the first above 381.8 V</text><text x="32.0" y="637.0" font-size="10" font-weight="700" fill="#2d6a4f" text-anchor="start">WHAT TO PROVE</text><text x="32.0" y="653.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">• Residual voltage 257 V / 415 V = 62 %; duration 120 ms = 6 cycles at 50 Hz; this point is E3 on figure F17-4.</text><text x="32.0" y="668.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">• The dip is deepest on L1-L2 while L2-L3 stays near 92 %: a single-phase-to-earth fault on the 150 kV network, seen through the Dyn transformers.</text><rect x="24" y="701" width="1352" height="44" rx="0" fill="#f6f8fa" fill-opacity="1" stroke="#5b6b78" stroke-width="1"/><text x="32.0" y="715.0" font-size="11" font-weight="700" fill="#172b3a" text-anchor="start">F17-5  ·  RMS voltage of event E3 recorded at half-cycle resolution: depth, duration and recovery of a voltage dip</text><text x="1368.0" y="715.0" font-size="10" font-weight="400" fill="#5b6b78" text-anchor="end">Chapter 17 · §17.11</text><text x="32.0" y="728.0" font-size="9" font-weight="400" fill="#5b6b78" text-anchor="start">Data Centre Commissioning Field Manual R01 EN · October 2026 · educational reference, not to scale · project and OEM documents govern</text><text x="32.0" y="740.0" font-size="9" font-weight="400" fill="#5b6b78" text-anchor="start">Symbols: QElectroTech EN 60617 and P&amp;ID collections, CC-BY 3.0, native geometry · instrument bubbles per ISA 5.1 · states per IEC 60617 / IEEE C37.2 practice</text></svg>