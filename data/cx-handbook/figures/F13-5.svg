width="173.33333333333337" height="22.0" rx="0" fill="#ffffff" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><rect x="840" y="630.0" width="173.33333333333337" height="22.0" rx="0" fill="#ffffff" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><rect x="1013.3333333333334" y="630.0" width="173.33333333333337" height="22.0" rx="0" fill="#ffffff" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><rect x="1186.6666666666667" y="630.0" width="173.33333333333337" height="22.0" rx="0" fill="#ffffff" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><rect x="840" y="652.0" width="173.33333333333337" height="22.0" rx="0" fill="#ffffff" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><rect x="1013.3333333333334" y="652.0" width="173.33333333333337" height="22.0" rx="0" fill="#ffffff" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><rect x="1186.6666666666667" y="652.0" width="173.33333333333337" height="22.0" rx="0" fill="#ffffff" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><text x="250.0" y="143.9" font-size="11.5" font-weight="700" fill="#475569" text-anchor="middle">(a) Ratio and polarity</text><text x="250.0" y="156.8" font-size="9.5" font-weight="400" fill="#172b3a" text-anchor="middle">P1-P2 primary circuit</text><text x="250.0" y="169.6" font-size="9.5" font-weight="400" fill="#172b3a" text-anchor="middle">S1-S2 secondary read</text><text x="250.0" y="182.4" font-size="9.5" font-weight="400" fill="#172b3a" text-anchor="middle">polarity: S1 in phase with P1</text><text x="250.0" y="406.8" font-size="11.5" font-weight="700" fill="#b91c1c" text-anchor="middle">CT analyser</text><text x="250.0" y="419.6" font-size="9.5" font-weight="400" fill="#172b3a" text-anchor="middle">class 0.1 ratio</text><text x="700.0" y="143.9" font-size="11.5" font-weight="700" fill="#475569" text-anchor="middle">(b) Excitation curve</text><text x="700.0" y="156.8" font-size="9.5" font-weight="400" fill="#172b3a" text-anchor="middle">primary open</text><text x="700.0" y="169.6" font-size="9.5" font-weight="400" fill="#172b3a" text-anchor="middle">voltage on S1-S2, 0 to 300 V</text><text x="700.0" y="182.4" font-size="9.5" font-weight="400" fill="#172b3a" text-anchor="middle">record V and I to saturation</text><text x="700.0" y="406.8" font-size="11.5" font-weight="700" fill="#b91c1c" text-anchor="middle">CT analyser</text><text x="700.0" y="419.6" font-size="9.5" font-weight="400" fill="#172b3a" text-anchor="middle">class 0.1 ratio</text><text x="1150.0" y="143.9" font-size="11.5" font-weight="700" fill="#475569" text-anchor="middle">(c) Burden</text><text x="1150.0" y="156.8" font-size="9.5" font-weight="400" fill="#172b3a" text-anchor="middle">inject 1 A into the loop</text><text x="1150.0" y="169.6" font-size="9.5" font-weight="400" fill="#172b3a" text-anchor="middle">relay and wiring connected</text><text x="1150.0" y="182.4" font-size="9.5" font-weight="400" fill="#172b3a" text-anchor="middle">VA = V x I at 1 A</text><text x="1150.0" y="406.8" font-size="11.5" font-weight="700" fill="#b91c1c" text-anchor="middle">CT analyser</text><text x="1150.0" y="419.6" font-size="9.5" font-weight="400" fill="#172b3a" text-anchor="middle">class 0.1 ratio</text><text x="140.0" y="834.0" font-size="10" font-weight="400" fill="#5b6b78" text-anchor="middle">0.001</text><text x="340.0" y="834.0" font-size="10" font-weight="400" fill="#5b6b78" text-anchor="middle">0.01</text><text x="540.0" y="834.0" font-size="10" font-weight="400" fill="#5b6b78" text-anchor="middle">0.1</text><text x="740.0" y="834.0" font-size="10" font-weight="400" fill="#5b6b78" text-anchor="middle">1</text><text x="134.0" y="824.0" font-size="10" font-weight="400" fill="#5b6b78" text-anchor="end">0</text><text x="134.0" y="761.5" font-size="10" font-weight="400" fill="#5b6b78" text-anchor="end">50</text><text x="134.0" y="699.0" font-size="10" font-weight="400" fill="#5b6b78" text-anchor="end">100</text><text x="134.0" y="636.5" font-size="10" font-weight="400" fill="#5b6b78" text-anchor="end">150</text><text x="134.0" y="574.0" font-size="10" font-weight="400" fill="#5b6b78" text-anchor="end">200</text><text x="440.0" y="850.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="middle">exciting current (A, log)</text><text transform="translate(96 670.0) rotate(-90)" font-size="11" text-anchor="middle" fill="#172b3a">secondary voltage (V)</text><text x="168.0" y="868.0" font-size="10" font-weight="400" fill="#172b3a" text-anchor="start">excitation curve (example)</text><text x="442.4" y="586.5" font-size="10" font-weight="400" fill="#8a5a00" text-anchor="start">knee point 182 V at 0.030 A</text><text x="845.0" y="535.0" font-size="11" font-weight="700" fill="#172b3a" text-anchor="start">Result (example)</text><text x="1018.3" y="535.0" font-size="11" font-weight="700" fill="#172b3a" text-anchor="start">Value</text><text x="1191.7" y="535.0" font-size="11" font-weight="700" fill="#172b3a" text-anchor="start">Limit</text><text x="845.0" y="557.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">Ratio</text><text x="1018.3" y="557.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">1497.0 / 1</text><text x="1191.7" y="557.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">±1 % (5P)</text><text x="845.0" y="579.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">Polarity</text><text x="1018.3" y="579.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">S1 in phase with P1</text><text x="1191.7" y="579.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">correct</text><text x="845.0" y="601.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">Knee point</text><text x="1018.3" y="601.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">182 V</text><text x="1191.7" y="601.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">≥ 150 V from study</text><text x="845.0" y="623.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">Rct at 20 °C</text><text x="1018.3" y="623.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">4.52 Ω</text><text x="1191.7" y="623.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">OEM 4.5 Ω ±10 %</text><text x="845.0" y="645.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">Burden at 1 A</text><text x="1018.3" y="645.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">6.8 VA</text><text x="1191.7" y="645.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">≤ 15 VA rated</text><text x="845.0" y="667.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">Insulation S to earth</text><text x="1018.3" y="667.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">&gt; 500 MΩ at 500 V DC</text><text x="1191.7" y="667.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">≥ 1 MΩ practice</text><circle cx="435.4" cy="592.5" r="4" fill="#b7791f"/><text x="24.0" y="30.0" font-size="17" font-weight="700" fill="#172b3a" text-anchor="start">F13-5  Current transformer test connections: ratio and polarity, excitation (knee point) and secondary burden</text><text x="24.0" y="48.0" font-size="11" font-weight="400" fill="#5b6b78" text-anchor="start">CT 1500/1 A, 5P20, 15 VA, Rct 4.5 Ω · test set injects voltage on S1-S2 with P1-P2 open for excitation · knee point = 10 % more voltage gives 50 % more exciting current (IEC 61869-2) · burden = loop impedance from the CT terminals</text><text x="32.0" y="917.0" font-size="10" font-weight="700" fill="#2d6a4f" text-anchor="start">WHAT TO PROVE</text><text x="32.0" y="933.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">• Ratio error of a 5P CT at rated current is within ±1 %, phase error within ±60 minutes (IEC 61869-2 class 5P); a 1500/1 CT measuring 1497/1 has a ratio error of -0.2 %.</text><text x="32.0" y="948.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">• Measured burden 6.8 VA at 1 A against a rated 15 VA leaves margin; the knee point measured at 182 V must be above the value in the protection study.</text><text x="24.0" y="983.0" font-size="10" font-weight="700" fill="#5b6b78" text-anchor="start">LEGEND</text><g transform="translate(42.5 1010.0) scale(0.3)"><line x1="-30" y1="-60" x2="-30" y2="0" stroke="#172b3a" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/><line x1="-20" y1="-30" x2="10" y2="-30" stroke="#172b3a" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/><ellipse cx="-30.0" cy="-30.0" rx="10.0" ry="10.0" stroke="#172b3a" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/><line x1="-10" y1="-20" x2="0" y2="-40" stroke="#172b3a" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/><line x1="-5" y1="-20" x2="5" y2="-40" stroke="#172b3a" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/></g><text x="58.0" y="1005.0" font-size="10" font-weight="400" fill="#172b3a" text-anchor="start">Current transformer</text><line x1="24" y1="1031" x2="50" y2="1031" stroke="#475569" stroke-width="3"/><text x="56.0" y="1035.0" font-size="10" font-weight="400" fill="#172b3a" text-anchor="start">signal / control</text><line x1="151.9671875" y1="1031" x2="177.9671875" y2="1031" stroke="#b91c1c" stroke-width="3"/><text x="184.0" y="1035.0" font-size="10" font-weight="400" fill="#172b3a" text-anchor="start">trip / protection</text><rect x="24" y="1049" width="1352" height="44" rx="0" fill="#f6f8fa" fill-opacity="1" stroke="#5b6b78" stroke-width="1"/><text x="32.0" y="1063.0" font-size="11" font-weight="700" fill="#172b3a" text-anchor="start">F13-5  ·  Current transformer test connections: ratio and polarity, excitation (knee point) and secondary burden</text><text x="1368.0" y="1063.0" font-size="10" font-weight="400" fill="#5b6b78" text-anchor="end">Chapter 13 · §13.6</text><text x="32.0" y="1076.0" font-size="9" font-weight="400" fill="#5b6b78" text-anchor="start">Data Centre Commissioning Field Manual R01 EN · October 2026 · educational reference, not to scale · project and OEM documents govern</text><text x="32.0" y="1088.0" font-size="9" font-weight="400" fill="#5b6b78" text-anchor="start">Symbols: QElectroTech EN 60617 and P&amp;ID collections, CC-BY 3.0, native geometry · instrument bubbles per ISA 5.1 · states per IEC 60617 / IEEE C37.2 practice</text></svg>