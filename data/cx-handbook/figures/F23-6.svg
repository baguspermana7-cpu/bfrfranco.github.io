irtual Processor: PUE,</text><text x="530.0" y="350.4" font-size="10" font-weight="400" fill="#172b3a" text-anchor="middle">virtual meters</text><text x="530.0" y="363.9" font-size="10" font-weight="400" fill="#172b3a" text-anchor="middle">Reports, Alarms</text><text x="920.0" y="144.9" font-size="12" font-weight="700" fill="#334155" text-anchor="middle">Integration gateway</text><text x="920.0" y="158.4" font-size="10" font-weight="400" fill="#172b3a" text-anchor="middle">Modbus TCP or BACnet/IP</text><text x="920.0" y="171.9" font-size="10" font-weight="400" fill="#172b3a" text-anchor="middle">mapping per points list</text><text x="1240.0" y="144.9" font-size="12" font-weight="700" fill="#334155" text-anchor="middle">BMS</text><text x="1240.0" y="158.4" font-size="10" font-weight="400" fill="#172b3a" text-anchor="middle">alarms, source-stable</text><text x="1240.0" y="171.9" font-size="10" font-weight="400" fill="#172b3a" text-anchor="middle">permissive, trends</text><text x="920.0" y="311.7" font-size="12" font-weight="700" fill="#334155" text-anchor="middle">ION OPC UA Server</text><text x="920.0" y="325.2" font-size="10" font-weight="400" fill="#172b3a" text-anchor="middle">Data Exchange Module</text><text x="1240.0" y="304.9" font-size="12" font-weight="700" fill="#334155" text-anchor="middle">DCIM</text><text x="1240.0" y="318.4" font-size="10" font-weight="400" fill="#172b3a" text-anchor="middle">rack and PDU capacity</text><text x="1240.0" y="331.9" font-size="10" font-weight="400" fill="#172b3a" text-anchor="middle">power chain model</text><text x="920.0" y="464.9" font-size="12" font-weight="700" fill="#334155" text-anchor="middle">Report subscriptions</text><text x="920.0" y="478.4" font-size="10" font-weight="400" fill="#172b3a" text-anchor="middle">PDF or Excel by email</text><text x="920.0" y="491.9" font-size="10" font-weight="400" fill="#172b3a" text-anchor="middle">daily, monthly</text><text x="1240.0" y="464.9" font-size="12" font-weight="700" fill="#334155" text-anchor="middle">Operations team</text><text x="1240.0" y="478.4" font-size="10" font-weight="400" fill="#172b3a" text-anchor="middle">energy, PUE, capacity</text><text x="1240.0" y="491.9" font-size="10" font-weight="400" fill="#172b3a" text-anchor="middle">PQ event reports</text><text x="270.0" y="312.0" font-size="10.5" font-weight="400" fill="#334155" text-anchor="start">poll, logs, waveforms</text><text x="1085.0" y="100.0" font-size="10.5" font-weight="700" fill="#b91c1c" text-anchor="middle">read-only</text><text x="1085.0" y="262.0" font-size="10.5" font-weight="700" fill="#b91c1c" text-anchor="middle">read-only</text><text x="45.0" y="584.3" font-size="10.5" font-weight="700" fill="#172b3a" text-anchor="start">Interface</text><text x="254.3" y="584.3" font-size="10.5" font-weight="700" fill="#172b3a" text-anchor="start">Protocol</text><text x="624.5" y="584.3" font-size="10.5" font-weight="700" fill="#172b3a" text-anchor="start">Direction</text><text x="833.8" y="584.3" font-size="10.5" font-weight="700" fill="#172b3a" text-anchor="start">Typical rate</text><text x="1075.2" y="584.3" font-size="10.5" font-weight="700" fill="#172b3a" text-anchor="start">Owner of the points list</text><text x="45.0" y="605.3" font-size="10.5" font-weight="400" fill="#172b3a" text-anchor="start">Devices to PME</text><text x="254.3" y="605.3" font-size="10.5" font-weight="400" fill="#172b3a" text-anchor="start">ION, Modbus TCP, Modbus RTU via Link150</text><text x="624.5" y="605.3" font-size="10.5" font-weight="400" fill="#172b3a" text-anchor="start">device to PME</text><text x="833.8" y="605.3" font-size="10.5" font-weight="400" fill="#172b3a" text-anchor="start">real time 1 to 5 s; logs 15 min</text><text x="1075.2" y="605.3" font-size="10.5" font-weight="400" fill="#172b3a" text-anchor="start">EPMS contractor</text><text x="45.0" y="626.3" font-size="10.5" font-weight="400" fill="#172b3a" text-anchor="start">PME to BMS</text><text x="254.3" y="626.3" font-size="10.5" font-weight="400" fill="#172b3a" text-anchor="start">Modbus TCP or BACnet/IP via gateway</text><text x="624.5" y="626.3" font-size="10.5" font-weight="400" fill="#172b3a" text-anchor="start">PME to BMS only</text><text x="833.8" y="626.3" font-size="10.5" font-weight="400" fill="#172b3a" text-anchor="start">5 to 10 s</text><text x="1075.2" y="626.3" font-size="10.5" font-weight="400" fill="#172b3a" text-anchor="start">BMS contractor with EPMS contractor</text><text x="45.0" y="647.3" font-size="10.5" font-weight="400" fill="#172b3a" text-anchor="start">PME to DCIM</text><text x="254.3" y="647.3" font-size="10.5" font-weight="400" fill="#172b3a" text-anchor="start">OPC UA (Data Exchange Module) or Modbus TCP</text><text x="624.5" y="647.3" font-size="10.5" font-weight="400" fill="#172b3a" text-anchor="start">PME to DCIM only</text><text x="833.8" y="647.3" font-size="10.5" font-weight="400" fill="#172b3a" text-anchor="start">15 s to 1 min</text><text x="1075.2" y="647.3" font-size="10.5" font-weight="400" fill="#172b3a" text-anchor="start">DCIM integrator</text><text x="45.0" y="668.3" font-size="10.5" font-weight="400" fill="#172b3a" text-anchor="start">Reports</text><text x="254.3" y="668.3" font-size="10.5" font-weight="400" fill="#172b3a" text-anchor="start">email or file share</text><text x="624.5" y="668.3" font-size="10.5" font-weight="400" fill="#172b3a" text-anchor="start">PME to users</text><text x="833.8" y="668.3" font-size="10.5" font-weight="400" fill="#172b3a" text-anchor="start">scheduled</text><text x="1075.2" y="668.3" font-size="10.5" font-weight="400" fill="#172b3a" text-anchor="start">owner operations team</text><text x="24.0" y="30.0" font-size="17" font-weight="700" fill="#172b3a" text-anchor="start">F23-6  Data flow from EPMS devices to PME, the BMS and DCIM, with update rates and direction</text><text x="24.0" y="48.0" font-size="11" font-weight="400" fill="#5b6b78" text-anchor="start">device registers polled by ION Site Service · logs every 15 min for energy, 1 min for selected trends · real-time values to BMS by Modbus TCP or BACnet/IP gateway every 5 to 10 s · OPC UA to DCIM · no writes from BMS or DCIM</text><text x="32.0" y="711.0" font-size="10" font-weight="700" fill="#2d6a4f" text-anchor="start">WHAT TO PROVE</text><text x="32.0" y="727.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">• The BMS and DCIM receive EPMS values through PME or a gateway in read-only mode; any control request from them is refused at the firewall and by the PME user role.</text><text x="32.0" y="742.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">• Update rates shown (15 min energy logs, 1 min trends, 5 to 10 s real time) are typical project values that the interface control document fixes before testing.</text><text x="24.0" y="777.0" font-size="10" font-weight="700" fill="#5b6b78" text-anchor="start">LEGEND</text><line x1="24" y1="799.0" x2="50" y2="799.0" stroke="#b45309" stroke-width="3"/><text x="56.0" y="803.0" font-size="10" font-weight="400" fill="#172b3a" text-anchor="start">20 kV</text><line x1="106.534375" y1="799.0" x2="132.534375" y2="799.0" stroke="#475569" stroke-width="3"/><text x="138.5" y="803.0" font-size="10" font-weight="400" fill="#172b3a" text-anchor="start">signal / control</text><line x1="234.50156249999998" y1="799.0" x2="260.5015625" y2="799.0" stroke="#334155" stroke-width="3"/><text x="266.5" y="803.0" font-size="10" font-weight="400" fill="#172b3a" text-anchor="start">data / network</text><rect x="24" y="817.0" width="1352" height="44" rx="0" fill="#f6f8fa" fill-opacity="1" stroke="#5b6b78" stroke-width="1"/><text x="32.0" y="831.0" font-size="11" font-weight="700" fill="#172b3a" text-anchor="start">F23-6  ·  Data flow from EPMS devices to PME, the BMS and DCIM, with update rates and direction</text><text x="1368.0" y="831.0" font-size="10" font-weight="400" fill="#5b6b78" text-anchor="end">Chapter 23 · §23.14</text><text x="32.0" y="844.0" font-size="9" font-weight="400" fill="#5b6b78" text-anchor="start">Data Centre Commissioning Field Manual R01 EN · October 2026 · educational reference, not to scale · project and OEM documents govern</text><text x="32.0" y="856.0" font-size="9" font-weight="400" fill="#5b6b78" text-anchor="start">Symbols: QElectroTech EN 60617 and P&amp;ID collections, CC-BY 3.0, native geometry · instrument bubbles per ISA 5.1 · states per IEC 60617 / IEEE C37.2 practice</text></svg>