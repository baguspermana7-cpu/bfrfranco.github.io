" fill="#475569" text-anchor="start">review and resubmission 30 WD</text><text x="450.4" y="327.0" font-size="10" font-weight="400" fill="#172b3a" text-anchor="start">manufacture and delivery 36 weeks</text><text x="1299.9" y="385.0" font-size="10" font-weight="400" fill="#b91c1c" text-anchor="start">on site</text><text x="60.0" y="464.0" font-size="11.5" font-weight="400" fill="#5b6b78" text-anchor="start">Time axis in weeks before the required on-site date (0 = Thursday 15 April 2027).</text><text x="24.0" y="30.0" font-size="17" font-weight="700" fill="#172b3a" text-anchor="start">F06-5  Back-planning the latest submit date for the 20 kV switchgear shop drawings</text><text x="24.0" y="48.0" font-size="11" font-weight="400" fill="#5b6b78" text-anchor="start">Required on site 15 Apr 2027 · lead time 36 weeks (example value) · review 10 + internal 5 + one resubmission 15 working days · latest submit 25 Jun 2026 · planned 9 Jul 2026</text><text x="32.0" y="502.8" font-size="10" font-weight="700" fill="#2d6a4f" text-anchor="start">WHAT TO PROVE</text><text x="32.0" y="518.8" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">• 36 weeks before 15 April 2027 is 6 August 2026, the latest approval date; 30 working days before that is 25 June 2026, the latest submit date.</text><text x="32.0" y="533.8" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">• The general arrangement and single-line drawings go on 25 June to release long-lead breakers and CTs; the wiring diagrams follow on 9 July.</text><rect x="24" y="566.76" width="1352" height="44" rx="0" fill="#f6f8fa" fill-opacity="1" stroke="#5b6b78" stroke-width="1"/><text x="32.0" y="580.8" font-size="11" font-weight="700" fill="#172b3a" text-anchor="start">F06-5  ·  Back-planning the latest submit date for the 20 kV switchgear shop drawings</text><text x="1368.0" y="580.8" font-size="10" font-weight="400" fill="#5b6b78" text-anchor="end">Chapter 06 · §06.2</text><text x="32.0" y="593.8" font-size="9" font-weight="400" fill="#5b6b78" text-anchor="start">Data Centre Commissioning Field Manual R01 EN · October 2026 · educational reference, not to scale · project and OEM documents govern</text><text x="32.0" y="605.8" font-size="9" font-weight="400" fill="#5b6b78" text-anchor="start">Symbols: QElectroTech EN 60617 and P&amp;ID collections, CC-BY 3.0, native geometry · instrument bubbles per ISA 5.1 · states per IEC 60617 / IEEE C37.2 practice</text></svg>