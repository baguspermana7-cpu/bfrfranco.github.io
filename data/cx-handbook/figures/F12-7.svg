fffff" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><rect x="360.0" y="486.0" width="600.0" height="24.0" rx="0" fill="#ffffff" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><text x="124.0" y="131.9" font-size="12" font-weight="700" fill="#475569" text-anchor="middle">Draw sample</text><text x="124.0" y="145.4" font-size="10" font-weight="400" fill="#172b3a" text-anchor="middle">7 of 64 sheets</text><text x="124.0" y="158.9" font-size="10" font-weight="400" fill="#172b3a" text-anchor="middle">at least 5</text><text x="312.0" y="131.9" font-size="12" font-weight="700" fill="#475569" text-anchor="middle">Check points</text><text x="312.0" y="145.4" font-size="10" font-weight="400" fill="#172b3a" text-anchor="middle">5 per sheet</text><text x="312.0" y="158.9" font-size="10" font-weight="400" fill="#172b3a" text-anchor="middle">35 points</text><text x="500.0" y="131.9" font-size="12" font-weight="700" fill="#475569" text-anchor="middle">First result</text><text x="500.0" y="145.4" font-size="10" font-weight="400" fill="#172b3a" text-anchor="middle">33 correct, 2 wrong</text><text x="500.0" y="158.9" font-size="10" font-weight="400" fill="#172b3a" text-anchor="middle">set rejected</text><text x="688.0" y="131.9" font-size="12" font-weight="700" fill="#475569" text-anchor="middle">Correct, re-check</text><text x="688.0" y="145.4" font-size="10" font-weight="400" fill="#172b3a" text-anchor="middle">2 points fixed</text><text x="688.0" y="158.9" font-size="10" font-weight="400" fill="#172b3a" text-anchor="middle">all 64 sheets</text><text x="876.0" y="131.9" font-size="12" font-weight="700" fill="#475569" text-anchor="middle">Second sample</text><text x="876.0" y="145.4" font-size="10" font-weight="400" fill="#172b3a" text-anchor="middle">7 other sheets</text><text x="876.0" y="158.9" font-size="10" font-weight="400" fill="#172b3a" text-anchor="middle">35 of 35: accept</text><text x="45.0" y="246.3" font-size="12" font-weight="700" fill="#172b3a" text-anchor="start">Point checked</text><text x="425.7" y="246.3" font-size="12" font-weight="700" fill="#172b3a" text-anchor="start">Drawing</text><text x="616.0" y="246.3" font-size="12" font-weight="700" fill="#172b3a" text-anchor="start">Site</text><text x="806.4" y="246.3" font-size="12" font-weight="700" fill="#172b3a" text-anchor="start">Result</text><text x="45.0" y="270.3" font-size="12" font-weight="400" fill="#172b3a" text-anchor="start">RMU-03 tee-off breaker tag</text><text x="425.7" y="270.3" font-size="12" font-weight="400" fill="#172b3a" text-anchor="start">T1</text><text x="616.0" y="270.3" font-size="12" font-weight="400" fill="#172b3a" text-anchor="start">T2</text><text x="806.4" y="270.3" font-size="12" font-weight="400" fill="#172b3a" text-anchor="start">wrong</text><text x="45.0" y="294.3" font-size="12" font-weight="400" fill="#172b3a" text-anchor="start">LV feeder cable size</text><text x="425.7" y="294.3" font-size="12" font-weight="400" fill="#172b3a" text-anchor="start">240 mm²</text><text x="616.0" y="294.3" font-size="12" font-weight="400" fill="#172b3a" text-anchor="start">300 mm²</text><text x="806.4" y="294.3" font-size="12" font-weight="400" fill="#172b3a" text-anchor="start">wrong</text><text x="45.0" y="318.3" font-size="12" font-weight="400" fill="#172b3a" text-anchor="start">Other 33 points</text><text x="425.7" y="318.3" font-size="12" font-weight="400" fill="#172b3a" text-anchor="start">as site</text><text x="616.0" y="318.3" font-size="12" font-weight="400" fill="#172b3a" text-anchor="start">as drawing</text><text x="806.4" y="318.3" font-size="12" font-weight="400" fill="#172b3a" text-anchor="start">correct</text><text x="45.0" y="382.3" font-size="12" font-weight="700" fill="#172b3a" text-anchor="start">Points checked on each sheet</text><text x="365.0" y="382.3" font-size="12" font-weight="700" fill="#172b3a" text-anchor="start">Example</text><text x="45.0" y="406.3" font-size="12" font-weight="400" fill="#172b3a" text-anchor="start">Tags</text><text x="365.0" y="406.3" font-size="12" font-weight="400" fill="#172b3a" text-anchor="start">breaker and equipment tags agree with site labels</text><text x="45.0" y="430.3" font-size="12" font-weight="400" fill="#172b3a" text-anchor="start">Routes</text><text x="365.0" y="430.3" font-size="12" font-weight="400" fill="#172b3a" text-anchor="start">cable or pipe routes</text><text x="45.0" y="454.3" font-size="12" font-weight="400" fill="#172b3a" text-anchor="start">Device positions</text><text x="365.0" y="454.3" font-size="12" font-weight="400" fill="#172b3a" text-anchor="start">devices where the drawing shows them</text><text x="45.0" y="478.3" font-size="12" font-weight="400" fill="#172b3a" text-anchor="start">Terminal or valve numbers</text><text x="365.0" y="478.3" font-size="12" font-weight="400" fill="#172b3a" text-anchor="start">numbers agree with the labels</text><text x="45.0" y="502.3" font-size="12" font-weight="400" fill="#172b3a" text-anchor="start">Hidden services</text><text x="365.0" y="502.3" font-size="12" font-weight="400" fill="#172b3a" text-anchor="start">dimensions from fixed points</text><text x="40.0" y="550.0" font-size="12" font-weight="400" fill="#172b3a" text-anchor="start">Sampling rate of 10 % with at least 5 sheets is project practice; the specification may set another rate.</text><text x="24.0" y="30.0" font-size="17" font-weight="700" fill="#172b3a" text-anchor="start">F12-7  As-built verification by sampling: building B1 single-line diagrams</text><text x="24.0" y="48.0" font-size="11" font-weight="400" fill="#5b6b78" text-anchor="start">64 sheets · sample 7 sheets × 5 points = 35 points · 33 correct (94.3 %) · rule: no wrong point · second sample 35 of 35</text><text x="32.0" y="588.9" font-size="10" font-weight="700" fill="#2d6a4f" text-anchor="start">WHAT TO PROVE</text><text x="32.0" y="604.9" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">• The sample is 10 % of 64 sheets rounded up to 7, with 5 points per sheet, so 35 points are checked.</text><text x="32.0" y="619.9" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">• 2 wrong points (RMU-03 tee-off tag T1 against T2; LV feeder 240 mm² against 300 mm²) reject the set; the second sample of 7 different sheets finds 35 of 35</text><text x="32.0" y="634.9" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">correct.</text><text x="24.0" y="669.9" font-size="10" font-weight="700" fill="#5b6b78" text-anchor="start">LEGEND</text><line x1="24" y1="691.88" x2="50" y2="691.88" stroke="#475569" stroke-width="3"/><text x="56.0" y="695.9" font-size="10" font-weight="400" fill="#172b3a" text-anchor="start">signal / control</text><rect x="24" y="709.88" width="952" height="44" rx="0" fill="#f6f8fa" fill-opacity="1" stroke="#5b6b78" stroke-width="1"/><text x="32.0" y="723.9" font-size="11" font-weight="700" fill="#172b3a" text-anchor="start">F12-7  ·  As-built verification by sampling: building B1 single-line diagrams</text><text x="968.0" y="723.9" font-size="10" font-weight="400" fill="#5b6b78" text-anchor="end">Chapter 12 · §12.6.3</text><text x="32.0" y="736.9" font-size="9" font-weight="400" fill="#5b6b78" text-anchor="start">Data Centre Commissioning Field Manual R01 EN · October 2026 · educational reference, not to scale · project and OEM documents govern</text><text x="32.0" y="748.9" font-size="9" font-weight="400" fill="#5b6b78" text-anchor="start">Symbols: QElectroTech EN 60617 and P&amp;ID collections, CC-BY 3.0, native geometry · instrument bubbles per ISA 5.1 · states per IEC 60617 / IEEE C37.2 practice</text></svg>