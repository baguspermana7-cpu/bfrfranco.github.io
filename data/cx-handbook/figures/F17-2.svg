50.0" y="205.0" font-size="10.5" font-weight="400" fill="#5b6b78" text-anchor="middle">straight line, test leads apart</text><text x="140.0" y="654.0" font-size="10" font-weight="400" fill="#5b6b78" text-anchor="middle">0</text><text x="292.0" y="654.0" font-size="10" font-weight="400" fill="#5b6b78" text-anchor="middle">20</text><text x="444.0" y="654.0" font-size="10" font-weight="400" fill="#5b6b78" text-anchor="middle">40</text><text x="596.0" y="654.0" font-size="10" font-weight="400" fill="#5b6b78" text-anchor="middle">60</text><text x="748.0" y="654.0" font-size="10" font-weight="400" fill="#5b6b78" text-anchor="middle">80</text><text x="900.0" y="654.0" font-size="10" font-weight="400" fill="#5b6b78" text-anchor="middle">100</text><text x="134.0" y="644.0" font-size="10" font-weight="400" fill="#5b6b78" text-anchor="end">0</text><text x="134.0" y="559.0" font-size="10" font-weight="400" fill="#5b6b78" text-anchor="end">0.2</text><text x="134.0" y="474.0" font-size="10" font-weight="400" fill="#5b6b78" text-anchor="end">0.4</text><text x="134.0" y="389.0" font-size="10" font-weight="400" fill="#5b6b78" text-anchor="end">0.6</text><text x="134.0" y="304.0" font-size="10" font-weight="400" fill="#5b6b78" text-anchor="end">0.8</text><text x="520.0" y="670.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="middle">potential probe distance (% of E to C)</text><text transform="translate(96 470.0) rotate(-90)" font-size="11" text-anchor="middle" fill="#172b3a">measured resistance (Ω)</text><text x="168.0" y="688.0" font-size="10" font-weight="400" fill="#172b3a" text-anchor="start">measured (example)</text><text x="616.7" y="455.5" font-size="10" font-weight="400" fill="#8a5a00" text-anchor="start">0.42 Ω at 61.8 %</text><text x="965.0" y="315.0" font-size="11" font-weight="700" fill="#172b3a" text-anchor="start">P position</text><text x="1098.3" y="315.0" font-size="11" font-weight="700" fill="#172b3a" text-anchor="start">Distance</text><text x="1231.7" y="315.0" font-size="11" font-weight="700" fill="#172b3a" text-anchor="start">Reading</text><text x="965.0" y="337.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">52 %</text><text x="1098.3" y="337.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">208 m</text><text x="1231.7" y="337.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">0.40 Ω</text><text x="965.0" y="359.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">61.8 %</text><text x="1098.3" y="359.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">247 m</text><text x="1231.7" y="359.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">0.42 Ω</text><text x="965.0" y="381.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">72 %</text><text x="1098.3" y="381.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">288 m</text><text x="1231.7" y="381.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">0.44 Ω</text><text x="965.0" y="403.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">Spread</text><text x="1098.3" y="403.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start"></text><text x="1231.7" y="403.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">±4.8 %</text><text x="965.0" y="425.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">Result</text><text x="1098.3" y="425.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start"></text><text x="1231.7" y="425.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">accepted</text><circle cx="609.7" cy="461.5" r="4" fill="#b7791f"/><text x="24.0" y="30.0" font-size="17" font-weight="700" fill="#172b3a" text-anchor="start">F17-2  Fall-of-potential test of the substation earth grid: electrode positions and the resistance curve (example)</text><text x="24.0" y="48.0" font-size="11" font-weight="400" fill="#5b6b78" text-anchor="start">grid 60 x 40 m, diagonal 72 m · current electrode C at 400 m (5.5 x diagonal) · potential probe P moved from 10 % to 90 % of 400 m · reading at 61.8 % (247 m) = 0.42 Ω · plateau 52 % to 72 % within ±5 %</text><text x="32.0" y="737.0" font-size="10" font-weight="700" fill="#2d6a4f" text-anchor="start">WHAT TO PROVE</text><text x="32.0" y="753.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">• Readings at 52 %, 61.8 % and 72 % are 0.40, 0.42 and 0.44 Ω: within ±5 % of 0.42 Ω, so the plateau exists and the value is accepted.</text><text x="32.0" y="768.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">• If the three readings differ by more than about 5 %, C is moved further out (or the slope method is used) because the electrode zones overlap.</text><text x="24.0" y="803.0" font-size="10" font-weight="700" fill="#5b6b78" text-anchor="start">LEGEND</text><line x1="24" y1="825" x2="50" y2="825" stroke="#475569" stroke-width="3"/><text x="56.0" y="829.0" font-size="10" font-weight="400" fill="#172b3a" text-anchor="start">signal / control</text><rect x="24" y="843" width="1352" height="44" rx="0" fill="#f6f8fa" fill-opacity="1" stroke="#5b6b78" stroke-width="1"/><text x="32.0" y="857.0" font-size="11" font-weight="700" fill="#172b3a" text-anchor="start">F17-2  ·  Fall-of-potential test of the substation earth grid: electrode positions and the resistance curve (example)</text><text x="1368.0" y="857.0" font-size="10" font-weight="400" fill="#5b6b78" text-anchor="end">Chapter 17 · §17.3</text><text x="32.0" y="870.0" font-size="9" font-weight="400" fill="#5b6b78" text-anchor="start">Data Centre Commissioning Field Manual R01 EN · October 2026 · educational reference, not to scale · project and OEM documents govern</text><text x="32.0" y="882.0" font-size="9" font-weight="400" fill="#5b6b78" text-anchor="start">Symbols: QElectroTech EN 60617 and P&amp;ID collections, CC-BY 3.0, native 