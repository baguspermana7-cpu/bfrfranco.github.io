</text><text x="903.0" y="533.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">147</text><text x="1134.0" y="533.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">122 (83.0 %)</text><text x="24.0" y="30.0" font-size="17" font-weight="700" fill="#172b3a" text-anchor="start">F12-4  Defects notification period of Section B1-DH1 with an item extension for chiller B1-CHW-CH-02</text><text x="24.0" y="48.0" font-size="11" font-weight="400" fill="#5b6b78" text-anchor="start">TOC month 0 · DNP 12 months · chiller 2 out of service 11 weeks (VFD module, lead time 16 weeks) · item DNP extended by 11 weeks · Performance Certificate within 28 days after the last DNP ends</text><text x="32.0" y="576.0" font-size="10" font-weight="700" fill="#2d6a4f" text-anchor="start">WHAT TO PROVE</text><text x="32.0" y="592.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">• At month 6 the register holds 147 defects; 122 were corrected on time (83.0 %).</text><text x="32.0" y="607.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">• The last DNP ends at month 12 plus 11 weeks (about month 14.5); the Performance Certificate follows within 28 days, about month 15.4.</text><rect x="24" y="640.0" width="1352" height="44" rx="0" fill="#f6f8fa" fill-opacity="1" stroke="#5b6b78" stroke-width="1"/><text x="32.0" y="654.0" font-size="11" font-weight="700" fill="#172b3a" text-anchor="start">F12-4  ·  Defects notification period of Section B1-DH1 with an item extension for chiller B1-CHW-CH-02</text><text x="1368.0" y="654.0" font-size="10" font-weight="400" fill="#5b6b78" text-anchor="end">Chapter 12 · §12.11</text><text x="32.0" y="667.0" font-size="9" font-weight="400" fill="#5b6b78" text-anchor="start">Data Centre Commissioning Field Manual R01 EN · October 2026 · educational reference, not to scale · project and OEM documents govern</text><text x="32.0" y="679.0" font-size="9" font-weight="400" fill="#5b6b78" text-an