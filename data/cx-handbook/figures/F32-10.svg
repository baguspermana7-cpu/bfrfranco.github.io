t-anchor="middle">open</text><text x="840.0" y="229.0" font-size="9.5" font-weight="400" fill="#172b3a" text-anchor="middle">lock L-0412, 09:29</text><text x="840.0" y="343.4" font-size="11.5" font-weight="700" fill="#b91c1c" text-anchor="middle">MOB output isolator</text><text x="840.0" y="356.2" font-size="9.5" font-weight="400" fill="#172b3a" text-anchor="middle">open (back-feed from load bus)</text><text x="840.0" y="369.0" font-size="9.5" font-weight="400" fill="#172b3a" text-anchor="middle">lock L-0417, 09:26</text><text x="500.0" y="130.3" font-size="11.5" font-weight="700" fill="#b91c1c" text-anchor="middle">QF3 battery breaker</text><text x="500.0" y="143.2" font-size="9.5" font-weight="400" fill="#172b3a" text-anchor="middle">open</text><text x="500.0" y="156.0" font-size="9.5" font-weight="400" fill="#172b3a" text-anchor="middle">lock L-0415, 09:31</text><text x="500.0" y="420.4" font-size="11.5" font-weight="700" fill="#475569" text-anchor="middle">MBB maintenance bypass</text><text x="500.0" y="433.2" font-size="9.5" font-weight="400" fill="#172b3a" text-anchor="middle">closed by key K1</text><text x="500.0" y="446.0" font-size="9.5" font-weight="400" fill="#172b3a" text-anchor="middle">load 1.56 MW stays on the bypass</text><text x="45.0" y="525.6" font-size="11.5" font-weight="700" fill="#172b3a" text-anchor="start">Time</text><text x="239.6" y="525.6" font-size="11.5" font-weight="700" fill="#172b3a" text-anchor="start">Action</text><text x="628.8" y="525.6" font-size="11.5" font-weight="700" fill="#172b3a" text-anchor="start">Result or record</text><text x="45.0" y="548.6" font-size="11.5" font-weight="400" fill="#172b3a" text-anchor="start">09:26 to 09:31</text><text x="239.6" y="548.6" font-size="11.5" font-weight="400" fill="#172b3a" text-anchor="start">open and lock MOB, QF4, QF1, QF2, QF3, MIB</text><text x="628.8" y="548.6" font-size="11.5" font-weight="400" fill="#172b3a" text-anchor="start">locks L-0412 to L-0417</text><text x="45.0" y="571.6" font-size="11.5" font-weight="400" fill="#172b3a" text-anchor="start">09:31 to 09:41</text><text x="239.6" y="571.6" font-size="11.5" font-weight="400" fill="#172b3a" text-anchor="start">stored energy wait</text><text x="628.8" y="571.6" font-size="11.5" font-weight="400" fill="#172b3a" text-anchor="start">10 min against 5 min OEM label</text><text x="45.0" y="594.6" font-size="11.5" font-weight="400" fill="#172b3a" text-anchor="start">09:42</text><text x="239.6" y="594.6" font-size="11.5" font-weight="400" fill="#172b3a" text-anchor="start">prove detector on 400 V test unit</text><text x="628.8" y="594.6" font-size="11.5" font-weight="400" fill="#172b3a" text-anchor="start">VD-2210 indicated 400 V</text><text x="45.0" y="617.6" font-size="11.5" font-weight="400" fill="#172b3a" text-anchor="start">09:44 to 09:50</text><text x="239.6" y="617.6" font-size="11.5" font-weight="400" fill="#172b3a" text-anchor="start">test 9 AC combinations, DC poles</text><text x="628.8" y="617.6" font-size="11.5" font-weight="400" fill="#172b3a" text-anchor="start">0 V on all</text><text x="45.0" y="640.6" font-size="11.5" font-weight="400" fill="#172b3a" text-anchor="start">09:51</text><text x="239.6" y="640.6" font-size="11.5" font-weight="400" fill="#172b3a" text-anchor="start">re-prove detector</text><text x="628.8" y="640.6" font-size="11.5" font-weight="400" fill="#172b3a" text-anchor="start">indicated 400 V</text><text x="45.0" y="663.6" font-size="11.5" font-weight="400" fill="#172b3a" text-anchor="start">09:55</text><text x="239.6" y="663.6" font-size="11.5" font-weight="400" fill="#172b3a" text-anchor="start">keys in group lock box GLB-B2-03</text><text x="628.8" y="663.6" font-size="11.5" font-weight="400" fill="#172b3a" text-anchor="start">personal locks of 2 work parties</text><text x="45.0" y="686.6" font-size="11.5" font-weight="400" fill="#172b3a" text-anchor="start">16:20</text><text x="239.6" y="686.6" font-size="11.5" font-weight="400" fill="#172b3a" text-anchor="start">locks removed</text><text x="628.8" y="686.6" font-size="11.5" font-weight="400" fill="#172b3a" text-anchor="start">after PTW-B2-E-0901 and -0902 cancelled</text><text x="24.0" y="30.0" font-size="17" font-weight="700" fill="#172b3a" text-anchor="start">F32-10  Isolation certificate IC-B2-LV-0388: six isolation points of UPS B2-DH3-UPS-A1</text><text x="24.0" y="48.0" font-size="10" font-weight="400" fill="#5b6b78" text-anchor="start">load 1.56 MW on maintenance bypass MBB (key K1) · locks L-0412 to L-0417 applied 09:26 to 09:31 · DC link wait 10 min (OEM label 5 min) 09:31 to 09:41 · detector</text><text x="24.0" y="61.0" font-size="10" font-weight="400" fill="#5b6b78" text-anchor="start">proved 09:42, 9 AC combinations and DC poles 0 V 09:44 to 09:50, re-proved 09:51 · keys in group lock box GLB-B2-03 09:55</text><text x="32.0" y="730.0" font-size="10" font-weight="700" fill="#2d6a4f" text-anchor="start">WHAT TO PROVE</text><text x="32.0" y="746.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">• Six points are locked: MOB, QF4, QF1, QF2, QF3 and MIB, with locks L-0412 to L-0417; MBB stays closed and carries the load.</text><text x="32.0" y="761.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">• The 10 min wait starts at 09:31, after the last lock, and ends at 09:41 before the detector is proved at 09:42.</text><rect x="24" y="788.0" width="952" height="44" rx="0" fill="#f6f8fa" fill-opacity="1" stroke="#5b6b78" stroke-width="1"/><text x="32.0" y="802.0" font-size="11" font-weight="700" fill="#172b3a" text-anchor="start">F32-10  ·  Isolation certificate IC-B2-LV-0388: six isolation points of UPS B2-DH3-UPS-A1</text><text x="968.0" y="802.0" font-size="10" font-weight="400" fill="#5b6b78" text-anchor="end">Chapter 32 · §32.5.2</text><text x="32.0" y="815.0" font-size="9" font-weight="400" fill="#5b6b78" text-anchor="start">Data Centre Commissioning Field Manual R01 EN · October 2026 · educational reference, not to scale · project and OEM documents govern</text><text x="32.0" y="827.0" font-size="9" font-weight="400" fill="#5b6b78" text-anchor="start">Symbols: QElectroTech EN 60617 and P&amp;ID collections, CC-BY 3.0, native geometry · instrument bubbles per ISA 5.1 · states per IEC 60617 / IEEE C37.2 practice</text></svg>