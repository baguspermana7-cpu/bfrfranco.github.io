" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><rect x="281.3114754098361" y="670.0" width="105.57377049180329" height="22.0" rx="0" fill="#ffffff" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><rect x="386.88524590163934" y="670.0" width="301.6393442622951" height="22.0" rx="0" fill="#ffffff" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><rect x="688.5245901639344" y="670.0" width="271.4754098360656" height="22.0" rx="0" fill="#ffffff" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><text x="135.0" y="166.9" font-size="11" font-weight="700" fill="#1d4ed8" text-anchor="middle">Input and bypass supply</text><text x="135.0" y="179.0" font-size="9" font-weight="400" fill="#172b3a" text-anchor="middle">block LV board, 415 V</text><text x="135.0" y="285.8" font-size="11" font-weight="700" fill="#475569" text-anchor="middle">Input analyser</text><text x="135.0" y="297.9" font-size="9" font-weight="400" fill="#172b3a" text-anchor="middle">Class A, ±0.1 % kW</text><text x="135.0" y="310.1" font-size="9" font-weight="400" fill="#172b3a" text-anchor="middle">waveform 10 kHz</text><text x="470.0" y="170.3" font-size="11.5" font-weight="700" fill="#1d4ed8" text-anchor="middle">UPS B2-DH3-UPS-A1</text><text x="470.0" y="183.2" font-size="9.5" font-weight="400" fill="#172b3a" text-anchor="middle">2,500 kW, VFI-SS-111</text><text x="470.0" y="196.0" font-size="9.5" font-weight="400" fill="#172b3a" text-anchor="middle">rectifier, inverter, static bypass</text><text x="470.0" y="356.9" font-size="11" font-weight="700" fill="#6d28d9" text-anchor="middle">Battery, 4 LFP cabinets</text><text x="470.0" y="369.0" font-size="9" font-weight="400" fill="#172b3a" text-anchor="middle">DC shunt ±0.5 %, terminal voltage</text><text x="840.0" y="285.8" font-size="11" font-weight="700" fill="#475569" text-anchor="middle">Output analyser</text><text x="840.0" y="297.9" font-size="9" font-weight="400" fill="#172b3a" text-anchor="middle">Class A, ±0.1 % kW</text><text x="840.0" y="310.1" font-size="9" font-weight="400" fill="#172b3a" text-anchor="middle">half-cycle RMS</text><text x="840.0" y="170.3" font-size="11.5" font-weight="700" fill="#1d4ed8" text-anchor="middle">Load bank 2.5 MW</text><text x="840.0" y="183.2" font-size="9.5" font-weight="400" fill="#172b3a" text-anchor="middle">resistive, steps ≤ 5 %</text><text x="840.0" y="196.0" font-size="9.5" font-weight="400" fill="#172b3a" text-anchor="middle">contactor for 0 → 100 % step</text><text x="470.0" y="471.9" font-size="11" font-weight="700" fill="#475569" text-anchor="middle">Time source (GPS or PTP)</text><text x="470.0" y="484.0" font-size="9" font-weight="400" fill="#172b3a" text-anchor="middle">all recorders within 10 ms</text><text x="45.0" y="575.0" font-size="11" font-weight="700" fill="#172b3a" text-anchor="start">Test</text><text x="286.3" y="575.0" font-size="11" font-weight="700" fill="#172b3a" text-anchor="start">Section</text><text x="391.9" y="575.0" font-size="11" font-weight="700" fill="#172b3a" text-anchor="start">Instruments used</text><text x="693.5" y="575.0" font-size="11" font-weight="700" fill="#172b3a" text-anchor="start">Acceptance (example)</text><text x="45.0" y="597.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">Steady-state output</text><text x="286.3" y="597.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">16.6.2</text><text x="391.9" y="597.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">output analyser</text><text x="693.5" y="597.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">±1 % of 415 V, THD ≤ 2 %</text><text x="45.0" y="619.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">Step load 0 → 100 → 0 %</text><text x="286.3" y="619.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">16.6.3</text><text x="391.9" y="619.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">output analyser, load bank contactor</text><text x="693.5" y="619.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">class 1 curve; ±5 %, 50 ms</text><text x="45.0" y="641.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">Input failure and return</text><text x="286.3" y="641.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">16.6.4</text><text x="391.9" y="641.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">both analysers, DC shunt</text><text x="693.5" y="641.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">output inside class 1 curve</text><text x="45.0" y="663.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">Efficiency</text><text x="286.3" y="663.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">16.6.9</text><text x="391.9" y="663.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">both analysers at the same time</text><text x="693.5" y="663.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">≥ 97.0 % guarantee</text><text x="45.0" y="685.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">Battery autonomy</text><text x="286.3" y="685.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">16.6.10</text><text x="391.9" y="685.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">DC shunt, output analyser</text><text x="693.5" y="685.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">≥ 5 min at 2.5 MW</text><text x="24.0" y="30.0" font-size="17" font-weight="700" fill="#172b3a" text-anchor="start">F16-6  UPS Level 4 test set-up: load bank, two analysers and a common time source</text><text x="24.0" y="48.0" font-size="10" font-weight="400" fill="#5b6b78" text-anchor="start">B2-DH3-UPS-A1, 2,500 kW, 415 V · resistive load bank 2.5 MW in steps of 5 % or less · Class A analysers at input and output, ±0.1 % power accuracy · waveform at 10 kHz</text><text x="24.0" y="61.0" font-size="10" font-weight="400" fill="#5b6b78" text-anchor="start">or more · DC shunt ±0.5 % · all recorders within 10 ms of one time source</text><text x="32.0" y="728.0" font-size="10" font-weight="700" fill="#2d6a4f" text-anchor="start">WHAT TO PROVE</text><text x="32.0" y="744.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">• Input and output analysers are synchronised to the same time source within 10 ms before the first test.</text><text x="32.0" y="759.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">• The load bank switches 100 % in one step for the step test; its contactor time is recorded.</text><text x="32.0" y="774.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">• The battery is fully charged before the efficiency test, because charging power distorts the result.</text><text x="24.0" y="809.0" font-size="10" font-weight="700" fill="#5b6b78" text-anchor="start">LEGEND</text><line x1="24" y1="831.0" x2="50" y2="831.0" stroke="#1d4ed8" stroke-width="3"/><text x="56.0" y="835.0" font-size="10" font-weight="400" fill="#172b3a" text-anchor="start">415 V</text><line x1="107.10625" y1="831.0" x2="133.10625" y2="831.0" stroke="#475569" stroke-width="3"/><text x="139.1" y="835.0" font-size="10" font-weight="400" fill="#172b3a" text-anchor="start">signal / control</text><line x1="235.0734375" y1="831.0" x2="261.0734375" y2="831.0" stroke="#6d28d9" stroke-width="3"/><text x="267.1" y="835.0" font-size="10" font-weight="400" fill="#172b3a" text-anchor="start">DC</text><rect x="24" y="849.0" width="952" height="44" rx="0" fill="#f6f8fa" fill-opacity="1" stroke="#5b6b78" stroke-width="1"/><text x="32.0" y="863.0" font-size="11" font-weight="700" fill="#172b3a" text-anchor="start">F16-6  ·  UPS Level 4 test set-up: load bank, two analysers and a common time source</text><text x="968.0" y="863.0" font-size="10" font-weight="400" fill="#5b6b78" text-anchor="end">Chapter 16 · §16.6.1</text><text x="32.0" y="876.0" font-size="9" font-weight="400" fill="#5b6b78" text-anchor="start">Data Centre Commissioning Field Manual R01 EN · October 2026 · educational reference, not to scale · project and OEM documents govern</text><text x="32.0" y="888.0" font-size="9" font-weight="400" fill="#5b6b78" text-anchor="start">Symbols: QElectroTech EN 60617 and P&amp;ID collections, CC-BY 3.0, native geometry · instrument bubbles per ISA 5.1 · states per IEC 60617 / IEEE C37.2 practice</text></svg>