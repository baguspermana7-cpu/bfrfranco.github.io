<svg xmlns="http://www.w3.org/2000/svg" width="174mm" height="103.9mm" viewBox="0 0 1000 597" font-family="DejaVu Sans" role="img" aria-labelledby="t"><title id="t">F01-7 Data-centre rating systems and what commissioning must demonstrate</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="context-stroke"/></marker><marker id="arrow-simple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#172b3a"/></marker></defs><rect width="1000" height="597" fill="#ffffff"/><rect x="4" y="4" width="992" height="589" fill="none" stroke="#172b3a" stroke-width="1.6"/><rect x="24" y="459.64000000000004" width="952" height="56" rx="4" fill="#f1f8f4" fill-opacity="1" stroke="#2d6a4f" stroke-width="1"/><rect x="40" y="110" width="920" height="243.34000000000003" rx="0" fill="#ffffff" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><rect x="240" y="110" width="130" height="24.380000000000003" rx="0" fill="#e9f0f4" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><rect x="370" y="110" width="200" height="24.380000000000003" rx="0" fill="#e9f0f4" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><rect x="570" y="110" width="180" height="24.380000000000003" rx="0" fill="#e9f0f4" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><rect x="750" y="110" width="210" height="24.380000000000003" rx="0" fill="#e9f0f4" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><rect x="40" y="134.38" width="200" height="54.74000000000001" rx="0" fill="#e9f0f4" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><rect x="240" y="134.38" width="130" height="54.74000000000001" rx="0" fill="#ffffff" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><rect x="370" y="134.38" width="200" height="54.74000000000001" rx="0" fill="#ffffff" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><rect x="570" y="134.38" width="180" height="54.74000000000001" rx="0" fill="#ffffff" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><rect x="750" y="134.38" width="210" height="54.74000000000001" rx="0" fill="#ffffff" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><rect x="40" y="189.12" width="200" height="54.74000000000001" rx="0" fill="#e9f0f4" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><rect x="240" y="189.12" width="130" height="54.74000000000001" rx="0" fill="#ffffff" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><rect x="370" y="189.12" width="200" height="54.74000000000001" rx="0" fill="#ffffff" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><rect x="570" y="189.12" width="180" height="54.74000000000001" rx="0" fill="#ffffff" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><rect x="750" y="189.12" width="210" height="54.74000000000001" rx="0" fill="#ffffff" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><rect x="40" y="243.86" width="200" height="54.74000000000001" rx="0" fill="#e9f0f4" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><rect x="240" y="243.86" width="130" height="54.74000000000001" rx="0" fill="#ffffff" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><rect x="370" y="243.86" width="200" height="54.74000000000001" rx="0" fill="#ffffff" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><rect x="570" y="243.86" width="180" height="54.74000000000001" rx="0" fill="#ffffff" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><rect x="750" y="243.86" width="210" height="54.74000000000001" rx="0" fill="#ffffff" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><rect x="40" y="298.6" width="200" height="54.74000000000001" rx="0" fill="#e9f0f4" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><rect x="240" y="298.6" width="130" height="54.74000000000001" rx="0" fill="#ffffff" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><rect x="370" y="298.6" width="200" height="54.74000000000001" rx="0" fill="#ffffff" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><rect x="570" y="298.6" width="180" height="54.74000000000001" rx="0" fill="#ffffff" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><rect x="750" y="298.6" width="210" height="54.74000000000001" rx="0" fill="#ffffff" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><rect x="40" y="377.34000000000003" width="920" height="60.3" rx="4" fill="#fffbe6" fill-opacity="1" stroke="#b7791f" stroke-width="1.2"/><text x="305.0" y="126.4" font-size="10.5" font-weight="700" fill="#172b3a" text-anchor="middle">Levels</text><text x="470.0" y="126.4" font-size="10.5" font-weight="700" fill="#172b3a" text-anchor="middle">Basis of the level</text><text x="660.0" y="126.4" font-size="10.5" font-weight="700" fill="#172b3a" text-anchor="middle">Who certifies</text><text x="855.0" y="126.4" font-size="10.5" font-weight="700" fill="#172b3a" text-anchor="middle">What Cx must demonstrate</text><text x="46.0" y="158.4" font-size="11.5" font-weight="400" fill="#172b3a" text-anchor="start">Uptime Tier Standard: Topology</text><text x="46.0" y="173.6" font-size="11.5" font-weight="400" fill="#172b3a" text-anchor="start">(2018)</text><text x="305.0" y="166.0" font-size="11.5" font-weight="700" fill="#172b3a" text-anchor="middle">Tier I to Tier IV</text><text x="470.0" y="158.4" font-size="11.5" font-weight="700" fill="#172b3a" text-anchor="middle">redundant components and</text><text x="470.0" y="173.6" font-size="11.5" font-weight="700" fill="#172b3a" text-anchor="middle">distribution paths</text><text x="660.0" y="158.4" font-size="11.5" font-weight="700" fill="#172b3a" text-anchor="middle">Uptime Institute (TCDD,</text><text x="660.0" y="173.6" font-size="11.5" font-weight="700" fill="#172b3a" text-anchor="middle">TCCF)</text><text x="855.0" y="150.8" font-size="11.5" font-weight="700" fill="#172b3a" text-anchor="middle">Tier III concurrent</text><text x="855.0" y="166.0" font-size="11.5" font-weight="700" fill="#172b3a" text-anchor="middle">maintenance; Tier IV single</text><text x="855.0" y="181.2" font-size="11.5" font-weight="700" fill="#172b3a" text-anchor="middle">fault tolerance; 8 h load banks</text><text x="46.0" y="220.7" font-size="11.5" font-weight="400" fill="#172b3a" text-anchor="start">ANSI/TIA-942-C (May 2024)</text><text x="305.0" y="220.7" font-size="11.5" font-weight="700" fill="#172b3a" text-anchor="middle">Rated 1 to Rated 4</text><text x="470.0" y="213.2" font-size="11.5" font-weight="700" fill="#172b3a" text-anchor="middle">telecom, power, cooling, fire,</text><text x="470.0" y="228.3" font-size="11.5" font-weight="700" fill="#172b3a" text-anchor="middle">security criteria</text><text x="660.0" y="213.2" font-size="11.5" font-weight="700" fill="#172b3a" text-anchor="middle">conformity assessment</text><text x="660.0" y="228.3" font-size="11.5" font-weight="700" fill="#172b3a" text-anchor="middle">bodies</text><text x="855.0" y="205.6" font-size="11.5" font-weight="700" fill="#172b3a" text-anchor="middle">cabling topology, spaces and</text><text x="855.0" y="220.7" font-size="11.5" font-weight="700" fill="#172b3a" text-anchor="middle">Rated criteria; separate from</text><text x="855.0" y="235.9" font-size="11.5" font-weight="700" fill="#172b3a" text-anchor="middle">Uptime Tiers</text><text x="46.0" y="275.5" font-size="11.5" font-weight="400" fill="#172b3a" text-anchor="start">ANSI/BICSI 002-2024</text><text x="305.0" y="275.5" font-size="11.5" font-weight="700" fill="#172b3a" text-anchor="middle">Class F0 to F4</text><text x="470.0" y="267.9" font-size="11.5" font-weight="700" fill="#172b3a" text-anchor="middle">availability, independent of</text><text x="470.0" y="283.1" font-size="11.5" font-weight="700" fill="#172b3a" text-anchor="middle">one electrical topology</text><text x="660.0" y="267.9" font-size="11.5" font-weight="700" fill="#172b3a" text-anchor="middle">no certificate; design</text><text x="660.0" y="283.1" font-size="11.5" font-weight="700" fill="#172b3a" text-anchor="middle">practice</text><text x="855.0" y="260.3" font-size="11.5" font-weight="700" fill="#172b3a" text-anchor="middle">commissioning chapter of</text><text x="855.0" y="275.5" font-size="11.5" font-weight="700" fill="#172b3a" text-anchor="middle">BICSI 002 applied by the</text><text x="855.0" y="290.7" font-size="11.5" font-weight="700" fill="#172b3a" text-anchor="middle">specification</text><text x="46.0" y="322.6" font-size="11.5" font-weight="400" fill="#172b3a" text-anchor="start">EN 50600 and ISO/IEC</text><text x="46.0" y="337.8" font-size="11.5" font-weight="400" fill="#172b3a" text-anchor="start">22237-1:2021</text><text x="305.0" y="322.6" font-size="11.5" font-weight="700" fill="#172b3a" text-anchor="middle">availability</text><text x="305.0" y="337.8" font-size="11.5" font-weight="700" fill="#172b3a" text-anchor="middle">classes 1 to 4</text><text x="470.0" y="322.6" font-size="11.5" font-weight="700" fill="#172b3a" text-anchor="middle">per infrastructure: power,</text><text x="470.0" y="337.8" font-size="11.5" font-weight="700" fill="#172b3a" text-anchor="middle">environment, cabling</text><text x="660.0" y="322.6" font-size="11.5" font-weight="700" fill="#172b3a" text-anchor="middle">national certification</text><text x="660.0" y="337.8" font-size="11.5" font-weight="700" fill="#172b3a" text-anchor="middle">schemes</text><text x="855.0" y="315.0" font-size="11.5" font-weight="700" fill="#172b3a" text-anchor="middle">part 7 management</text><text x="855.0" y="330.2" font-size="11.5" font-weight="700" fill="#172b3a" text-anchor="middle">information, including</text><text x="855.0" y="345.4" font-size="11.5" font-weight="700" fill="#172b3a" text-anchor="middle">acceptance tests</text><text x="50.0" y="391.1" font-size="11.5" font-weight="700" fill="#b7791f" text-anchor="start">Rule for the commissioning plan</text><text x="50.0" y="407.2" font-size="11.5" font-weight="400" fill="#172b3a" text-anchor="start">Commissioning rigour does not depend on the level: a Tier III hall gets the same five levels of commissioning as a Tier IV hall (Uptime Institute).</text><text x="50.0" y="422.8" font-size="11.5" font-weight="400" fill="#172b3a" text-anchor="start">The IST scenario list in chapter 28 is built from the Topology demonstrations: every capacity component and path removed once for maintenance.</text><text x="24.0" y="30.0" font-size="17" font-weight="700" fill="#172b3a" text-anchor="start">F01-7  Data-centre rating systems and what commissioning must demonstrate</text><text x="24.0" y="48.0" font-size="11" font-weight="400" fill="#5b6b78" text-anchor="start">Uptime Tier I to IV · TIA-942-C Rated 1 to 4 · BICSI 002-2024 Class F0 to F4 · EN 50600 and ISO/IEC 22237 classes 1 to 4 · load banks 8 h</text><text x="32.0" y="473.6" font-size="10" font-weight="700" fill="#2d6a4f" text-anchor="start">WHAT TO PROVE</text><text x="32.0" y="489.6" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">• A &quot;Tier III&quot; claim is checked by asking whether it is an Uptime Tier certificate or a TIA-942 Rated 3 statement.</text><text x="32.0" y="504.6" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">• Uptime TCCF needs the commissioning results and a site visit of 3 to 5 days; load bank tests run at least 8 h.</text><rect x="24" y="537.6400000000001" width="952" height="44" rx="0" fill="#f6f8fa" fill-opacity="1" stroke="#5b6b78" stroke-width="1"/><text x="32.0" y="551.6" font-size="11" font-weight="700" fill="#172b3a" text-anchor="start">F01-7  ·  Data-centre rating systems and what commissioning must demonstrate</text><text x="968.0" y="551.6" font-size="10" font-weight="400" fill="#5b6b78" text-anchor="end">Chapter 01 · §01.4.1</text><text x="32.0" y="564.6" font-size="9" font-weight="400" fill="#5b6b78" text-anchor="start">Data Centre Commissioning Field Manual R01 EN · October 2026 · educational reference, not to scale · project and OEM documents govern</text><text x="32.0" y="576.6" font-size="9" font-weight="400" fill="#5b6b78" text-anchor="start">Symbols: QElectroTech EN 60617 and P&amp;ID collections, CC-BY 3.0, native geometry · instrument bubbles per ISA 5.1 · states per IEC 60617 / IEEE C37.2 practice</text></svg>