size="11" font-weight="400" fill="#172b3a" text-anchor="start">sensor type and lead compensation configured</text><text x="952.5" y="479.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">PT1000, 4-wire</text><text x="45.0" y="501.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">Modbus register and BACnet object</text><text x="333.7" y="501.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">scaling × 0.1, units °C, Status_Flags normal</text><text x="952.5" y="501.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">raw 452 → 45.2 °C</text><text x="45.0" y="523.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">Graphic</text><text x="333.7" y="523.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">value, units and quality marker</text><text x="952.5" y="523.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">45.2 °C, difference 0.08 K</text><text x="45.0" y="545.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">Alarm list</text><text x="333.7" y="545.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">class, text, delay, recipients</text><text x="952.5" y="545.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">P2, &quot;CDU 07 TCS supply above 47 °C&quot;, 31 s</text><text x="45.0" y="567.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">Trend and restore</text><text x="333.7" y="567.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">step visible with time stamps; forced value released</text><text x="952.5" y="567.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">override summary empty</text><text x="24.0" y="30.0" font-size="17" font-weight="700" fill="#172b3a" text-anchor="start">F22-2  Point-to-point test of one analog input: every stage from the pipe to the graphic, alarm and trend</text><text x="24.0" y="48.0" font-size="11" font-weight="400" fill="#5b6b78" text-anchor="start">CDU 07 TCS supply temperature · reference probe TC-REF-04 in the test well · tolerance ±0.3 K · alarm high 47.0 °C after 30 s · trend 10 s</text><text x="32.0" y="610.0" font-size="10" font-weight="700" fill="#2d6a4f" text-anchor="start">WHAT TO PROVE</text><text x="32.0" y="626.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">• The reference probe reads 45.12 °C and the graphic 45.2 °C: difference 0.08 K, inside ±0.3 K.</text><text x="32.0" y="641.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">• The simulated high alarm at 47.1 °C reaches the workstation as P2 after 31 s against a 30 s delay; the forced value is released and the override summary is empty.</text><text x="24.0" y="676.0" font-size="10" font-weight="700" fill="#5b6b78" text-anchor="start">LEGEND</text><circle cx="38" cy="698.0" r="8" fill="#ffffff" stroke="#172b3a" stroke-width="1.2"/><text x="58.0" y="702.0" font-size="10" font-weight="400" fill="#172b3a" text-anchor="start">instrument bubble (ISA 5.1): letters = measured variable + function</text><line x1="24" y1="720.0" x2="50" y2="720.0" stroke="#475569" stroke-width="3"/><text x="56.0" y="724.0" font-size="10" font-weight="400" fill="#172b3a" text-anchor="start">signal / control</text><line x1="151.9671875" y1="720.0" x2="177.9671875" y2="720.0" stroke="#0f766e" stroke-width="3"/><text x="184.0" y="724.0" font-size="10" font-weight="400" fill="#172b3a" text-anchor="start">coolant (TCS)</text><line x1="272.7015625" y1="720.0" x2="298.7015625" y2="720.0" stroke="#334155" stroke-width="3"/><text x="304.7" y="724.0" font-size="10" font-weight="400" fill="#172b3a" text-anchor="start">data / network</text><rect x="24" y="738.0" width="1352" height="44" rx="0" fill="#f6f8fa" fill-opacity="1" stroke="#5b6b78" stroke-width="1"/><text x="32.0" y="752.0" font-size="11" font-weight="700" fill="#172b3a" text-anchor="start">F22-2  ·  Point-to-