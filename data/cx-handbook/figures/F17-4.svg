<text x="1082.7" y="167.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">motor start</text><text x="1263.4" y="167.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">yes</text><text x="1015.0" y="189.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">E2</text><text x="1082.7" y="189.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">capacitor switching</text><text x="1263.4" y="189.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">yes</text><text x="1015.0" y="211.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">E3</text><text x="1082.7" y="211.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">150 kV line fault</text><text x="1263.4" y="211.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">no</text><text x="1015.0" y="233.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">E4</text><text x="1082.7" y="233.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">transformer energising</text><text x="1263.4" y="233.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">yes</text><text x="1015.0" y="255.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">E5</text><text x="1082.7" y="255.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">transfer test</text><text x="1263.4" y="255.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">no, planned</text><circle cx="495.6" cy="370.0" r="4" fill="#b7791f"/><circle cx="508.9" cy="337.3" r="4" fill="#b7791f"/><circle cx="560.8" cy="417.3" r="4" fill="#b7791f"/><circle cx="727.8" cy="375.5" r="4" fill="#b7791f"/><circle cx="768.9" cy="524.5" r="4" fill="#b7791f"/><text x="24.0" y="30.0" font-size="17" font-weight="700" fill="#172b3a" text-anchor="start">F17-4  Voltage events from the PQ survey placed on the ITIC curve (example events at a 415 V UPS input board)</text><text x="24.0" y="48.0" font-size="11" font-weight="400" fill="#5b6b78" text-anchor="start">ITIC envelope: 0 % for 20 ms, 70 % to 0.5 s, 80 % to 10 s, 90 % steady · 200 % to 1 ms, 140 % to 3 ms, 120 % to 0.5 s, 110 % steady · events E1 to E5 from a 14-day survey with a Class A meter</text><text x="32.0" y="642.0" font-size="10" font-weight="700" fill="#2d6a4f" text-anchor="start">WHAT TO PROVE</text><text x="32.0" y="658.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">• E3, a sag to 62 % for 120 ms during a 150 kV fault, lies below the 70 % edge and is outside the envelope; the UPS rode through it on battery for 120 ms.</text><text x="32.0" y="673.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">• E1 (88 % for 40 ms) and E2 (106 % for 50 ms) lie inside the envelope; E5 (0 % for 4 s) is the planned generator transfer test.</text><rect x="24" y="706" width="1352" height="44" rx="0" fill="#f6f8fa" fill-opacity="1" stroke="#5b6b78" stroke-width="1"/><text x="32.0" y="720.0" font-size="11" font-weight="700" fill="#172b3a" text-anchor="start">F17-4  ·  Voltage events from the PQ survey placed on the ITIC curve (example events at a 415 V UPS input board)</text><text x="1368.0" y="720.0" font-size="10" font-weight="400" fill="#5b6b78" text-anchor="end">Chapter 17 · §17.11</text><text x="32.0" y="733.0" font-size="9" font-weight="400" fill="#5b6b78" text-anchor="start">Data Centre Commissioning Field Manual R01 EN · October 2026 · educational reference, not to scale · project and OEM documents govern</text><text x="32.0" y="745.0" font-size="9" font-weight="400" fill="#5b6b78" text-anchor="start">Symbols: QElectroTech EN 60617 and P&amp;ID collections, CC-BY 3.0, native geometry · instrument bubbles per ISA 5.1 · states per IEC 60617 / IEEE C37.2 practice</text></svg>