<svg xmlns="http://www.w3.org/2000/svg" width="267mm" height="141.3mm" viewBox="0 0 1400 741" font-family="DejaVu Sans" role="img" aria-labelledby="t"><title id="t">F06-2 Review stamp states and what each allows</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="context-stroke"/></marker><marker id="arrow-simple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#172b3a"/></marker><marker id="arrow-475569" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#475569"/></marker><marker id="arrow-b91c1c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#b91c1c"/></marker></defs><rect width="1400" height="741" fill="#ffffff"/><rect x="4" y="4" width="1392" height="733" fill="none" stroke="#172b3a" stroke-width="1.6"/><rect x="24" y="561.2800000000001" width="1352" height="56" rx="4" fill="#f1f8f4" fill-opacity="1" stroke="#2d6a4f" stroke-width="1"/><polyline points="320.0,162.0 390.0,162.0" fill="none" stroke="#475569" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#arrow-475569)"/><polyline points="650.0,162.0 720.0,162.0" fill="none" stroke="#475569" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#arrow-475569)"/><polyline points="980.0,162.0 1050.0,162.0" fill="none" stroke="#475569" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#arrow-475569)"/><polyline points="520.0,204.0 520.0,250.0" fill="none" stroke="#475569" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#arrow-475569)"/><polyline points="850.0,250.0 850.0,204.0" fill="none" stroke="#475569" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#arrow-475569)"/><polyline points="520.0,334.0 520.0,380.0" fill="none" stroke="#b91c1c" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#arrow-b91c1c)"/><polyline points="390.0,422.0 320.0,422.0" fill="none" stroke="#b91c1c" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#arrow-b91c1c)"/><polyline points="190.0,380.0 190.0,204.0" fill="none" stroke="#b91c1c" stroke-width="1.6" stroke-linejoin="round" stroke-dasharray="7 5" marker-end="url(#arrow-b91c1c)"/><polyline points="720.0,422.0 650.0,422.0" fill="none" stroke="#b91c1c" stroke-width="1.6" stroke-linejoin="round" stroke-dasharray="7 5" marker-end="url(#arrow-b91c1c)"/><rect x="60" y="120" width="260" height="84" rx="14" fill="#ffffff" fill-opacity="1" stroke="#172b3a" stroke-width="1.4"/><rect x="390" y="120" width="260" height="84" rx="14" fill="#ffffff" fill-opacity="1" stroke="#172b3a" stroke-width="1.4"/><rect x="720" y="120" width="260" height="84" rx="14" fill="#ffffff" fill-opacity="1" stroke="#172b3a" stroke-width="1.4"/><rect x="1050" y="120" width="260" height="84" rx="14" fill="#ffffff" fill-opacity="1" stroke="#172b3a" stroke-width="1.4"/><rect x="390" y="250" width="260" height="84" rx="14" fill="#ffffff" fill-opacity="1" stroke="#172b3a" stroke-width="1.4"/><rect x="720" y="250" width="260" height="84" rx="14" fill="#ffffff" fill-opacity="1" stroke="#172b3a" stroke-width="1.4"/><rect x="60" y="380" width="260" height="84" rx="14" fill="#ffffff" fill-opacity="1" stroke="#172b3a" stroke-width="1.4"/><rect x="390" y="380" width="260" height="84" rx="14" fill="#ffffff" fill-opacity="1" stroke="#172b3a" stroke-width="1.4"/><rect x="720" y="380" width="260" height="84" rx="14" fill="#ffffff" fill-opacity="1" stroke="#172b3a" stroke-width="1.4"/><rect x="1050" y="380" width="260" height="84" rx="14" fill="#ffffff" fill-opacity="1" stroke="#172b3a" stroke-width="1.4"/><text x="190.0" y="153.5" font-size="12.5" font-weight="700" fill="#172b3a" text-anchor="middle">Submitted</text><text x="190.0" y="167.7" font-size="10.5" font-weight="400" fill="#172b3a" text-anchor="middle">stamped by contractor</text><text x="520.0" y="153.5" font-size="12.5" font-weight="700" fill="#172b3a" text-anchor="middle">Under review</text><text x="520.0" y="167.7" font-size="10.5" font-weight="400" fill="#172b3a" text-anchor="middle">10 working days</text><text x="850.0" y="153.5" font-size="12.5" font-weight="700" fill="#172b3a" text-anchor="middle">A approved</text><text x="850.0" y="167.7" font-size="10.5" font-weight="400" fill="#172b3a" text-anchor="middle">proceed</text><text x="1180.0" y="153.5" font-size="12.5" font-weight="700" fill="#172b3a" text-anchor="middle">Closed</text><text x="1180.0" y="167.7" font-size="10.5" font-weight="400" fill="#172b3a" text-anchor="middle">comments confirmed</text><text x="520.0" y="283.5" font-size="12.5" font-weight="700" fill="#172b3a" text-anchor="middle">NR not reviewed</text><text x="520.0" y="297.7" font-size="10.5" font-weight="400" fill="#172b3a" text-anchor="middle">incomplete</text><text x="850.0" y="283.5" font-size="12.5" font-weight="700" fill="#172b3a" text-anchor="middle">B approved with comments</text><text x="850.0" y="297.7" font-size="10.5" font-weight="400" fill="#172b3a" text-anchor="middle">proceed, incorporate</text><text x="190.0" y="413.5" font-size="12.5" font-weight="700" fill="#172b3a" text-anchor="middle">Resubmitted</text><text x="190.0" y="427.7" font-size="10.5" font-weight="400" fill="#172b3a" text-anchor="middle">next revision</text><text x="520.0" y="413.5" font-size="12.5" font-weight="700" fill="#172b3a" text-anchor="middle">C revise and resubmit</text><text x="520.0" y="427.7" font-size="10.5" font-weight="400" fill="#172b3a" text-anchor="middle">affected items stop</text><text x="850.0" y="413.5" font-size="12.5" font-weight="700" fill="#172b3a" text-anchor="middle">D rejected</text><text x="850.0" y="427.7" font-size="10.5" font-weight="400" fill="#172b3a" text-anchor="middle">new proposal</text><text x="1180.0" y="413.5" font-size="12.5" font-weight="700" fill="#172b3a" text-anchor="middle">RA receipt acknowledged</text><text x="1180.0" y="427.7" font-size="10.5" font-weight="400" fill="#172b3a" text-anchor="middle">informational</text><text x="60.0" y="504.0" font-size="12" font-weight="400" fill="#172b3a" text-anchor="start">Review result per document: A, B, C, D or NR. A to Closed after any code B comments are confirmed in writing.</text><text x="60.0" y="520.2" font-size="12" font-weight="400" fill="#172b3a" text-anchor="start">NR and C go back to the contractor as a resubmission; D needs a new proposal; RA closes an informational submittal.</text><text x="60.0" y="536.4" font-size="12" font-weight="400" fill="#172b3a" text-anchor="start">Mapping to UFGS 01 33 00: A = A, B = AN, C and D = RR, NR = NR, RA = RA.</text><text x="24.0" y="30.0" font-size="17" font-weight="700" fill="#172b3a" text-anchor="start">F06-2  Review stamp states and what each allows</text><text x="24.0" y="48.0" font-size="11" font-weight="400" fill="#5b6b78" text-anchor="start">Codes A, B, C, D, NR and RA · UFGS equivalents A, AN, RR, NR, RA · one code per document named on the stamp</text><text x="32.0" y="575.3" font-size="10" font-weight="700" fill="#2d6a4f" text-anchor="start">WHAT TO PROVE</text><text x="32.0" y="591.3" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">• Code B allows the contractor to proceed only when every comment is incorporated; code C stops fabrication and installation of the affected items.</text><text x="32.0" y="606.3" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">• A code applies only to the documents named on the stamp; unlisted deviations are not approved by any code.</text><text x="24.0" y="641.3" font-size="10" font-weight="700" fill="#5b6b78" text-anchor="start">LEGEND</text><line x1="24" y1="663.2800000000001" x2="50" y2="663.2800000000001" stroke="#475569" stroke-width="3"/><text x="56.0" y="667.3" font-size="10" font-weight="400" fill="#172b3a" text-anchor="start">signal / control</text><line x1="151.9671875" y1="663.2800000000001" x2="177.9671875" y2="663.2800000000001" stroke="#b91c1c" stroke-width="3"/><text x="184.0" y="667.3" font-size="10" font-weight="400" fill="#172b3a" text-anchor="start">trip / protection</text><rect x="24" y="681.2800000000001" width="1352" height="44" rx="0" fill="#f6f8fa" fill-opacity="1" stroke="#5b6b78" stroke-width="1"/><text x="32.0" y="695.3" font-size="11" font-weight="700" fill="#172b3a" text-anchor="start">F06-2  ·  Review stamp states and what each allows</text><text x="1368.0" y="695.3" font-size="10" font-weight="400" fill="#5b6b78" text-anchor="end">Chapter 06 · §06.5</text><text x="32.0" y="708.3" font-size="9" font-weight="400" fill="#5b6b78" text-anchor="start">Data Centre Commissioning Field Manual R01 EN · October 2026 · educational reference, not to scale · project and OEM documents govern</text><text x="32.0" y="720.3" font-size="9" font-weight="400" fill="#5b6b78" text-anchor="start">Symbols: QElectroTech EN 60617 and P&amp;ID collections, CC-BY 3.0, native geometry · instrument bubbles per ISA 5.1 · states per IEC 60617 / IEEE C37.2 practice</text></svg>