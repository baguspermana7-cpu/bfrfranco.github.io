iddle">L2 passed</text><text x="430.0" y="154.7" font-size="11" font-weight="400" fill="#172b3a" text-anchor="middle">energise under permit</text><text x="700.0" y="125.0" font-size="13" font-weight="700" fill="#475569" text-anchor="middle">Green tag</text><text x="700.0" y="139.8" font-size="11" font-weight="400" fill="#172b3a" text-anchor="middle">L3 passed</text><text x="700.0" y="154.7" font-size="11" font-weight="400" fill="#172b3a" text-anchor="middle">ready for L4</text><text x="970.0" y="125.0" font-size="13" font-weight="700" fill="#475569" text-anchor="middle">Blue tag</text><text x="970.0" y="139.8" font-size="11" font-weight="400" fill="#172b3a" text-anchor="middle">L4 passed</text><text x="970.0" y="154.7" font-size="11" font-weight="400" fill="#172b3a" text-anchor="middle">ready for IST</text><text x="1240.0" y="125.0" font-size="13" font-weight="700" fill="#475569" text-anchor="middle">White tag</text><text x="1240.0" y="139.8" font-size="11" font-weight="400" fill="#172b3a" text-anchor="middle">L5 passed</text><text x="1240.0" y="154.7" font-size="11" font-weight="400" fill="#172b3a" text-anchor="middle">ready for acceptance</text><text x="45.0" y="266.3" font-size="12" font-weight="700" fill="#172b3a" text-anchor="start">Tag</text><text x="210.0" y="266.3" font-size="12" font-weight="700" fill="#172b3a" text-anchor="start">Hung by</text><text x="540.0" y="266.3" font-size="12" font-weight="700" fill="#172b3a" text-anchor="start">Removed by</text><text x="870.0" y="266.3" font-size="12" font-weight="700" fill="#172b3a" text-anchor="start">Gate record that allows the change</text><text x="45.0" y="290.3" font-size="12" font-weight="400" fill="#172b3a" text-anchor="start">Red</text><text x="210.0" y="290.3" font-size="12" font-weight="400" fill="#172b3a" text-anchor="start">GC QA/QC on delivery</text><text x="540.0" y="290.3" font-size="12" font-weight="400" fill="#172b3a" text-anchor="start">CxA after L2 gate</text><text x="870.0" y="290.3" font-size="12" font-weight="400" fill="#172b3a" text-anchor="start">FAT report and shipping release</text><text x="45.0" y="314.3" font-size="12" font-weight="400" fill="#172b3a" text-anchor="start">Yellow</text><text x="210.0" y="314.3" font-size="12" font-weight="400" fill="#172b3a" text-anchor="start">CxA</text><text x="540.0" y="314.3" font-size="12" font-weight="400" fill="#172b3a" text-anchor="start">CxA after L3 gate</text><text x="870.0" y="314.3" font-size="12" font-weight="400" fill="#172b3a" text-anchor="start">GATE-L2 record</text><text x="45.0" y="338.3" font-size="12" font-weight="400" fill="#172b3a" text-anchor="start">Green</text><text x="210.0" y="338.3" font-size="12" font-weight="400" fill="#172b3a" text-anchor="start">CxA</text><text x="540.0" y="338.3" font-size="12" font-weight="400" fill="#172b3a" text-anchor="start">CxA after L4 gate</text><text x="870.0" y="338.3" font-size="12" font-weight="400" fill="#172b3a" text-anchor="start">GATE-L3 record</text><text x="45.0" y="362.3" font-size="12" font-weight="400" fill="#172b3a" text-anchor="start">Blue</text><text x="210.0" y="362.3" font-size="12" font-weight="400" fill="#172b3a" text-anchor="start">CxA</text><text x="540.0" y="362.3" font-size="12" font-weight="400" fill="#172b3a" text-anchor="start">CxM after L5 gate</text><text x="870.0" y="362.3" font-size="12" font-weight="400" fill="#172b3a" text-anchor="start">GATE-L4 record</text><text x="45.0" y="386.3" font-size="12" font-weight="400" fill="#172b3a" text-anchor="start">White</text><text x="210.0" y="386.3" font-size="12" font-weight="400" fill="#172b3a" text-anchor="start">CxM</text><text x="540.0" y="386.3" font-size="12" font-weight="400" fill="#172b3a" text-anchor="start">DCOps at handover</text><text x="870.0" y="386.3" font-size="12" font-weight="400" fill="#172b3a" text-anchor="start">GATE-L5 record</text><text x="40.0" y="470.0" font-size="12" font-weight="400" fill="#172b3a" text-anchor="start">Failed retest: if a component is replaced after its gate (for example a CDU controller board), the tag returns to the level that must be repeated; for CDU-07 that is yellow, and L3 is repeated for 30 points.</text><text x="24.0" y="30.0" font-size="17" font-weight="700" fill="#172b3a" text-anchor="start">F02-4  Colour tag flow: red, yellow, green, blue and white tags and the gate that changes each</text><text x="24.0" y="48.0" font-size="11" font-weight="400" fill="#5b6b78" text-anchor="start">tag changes only after the gate record is signed · a failed retest moves the tag back · weekly sample of 20 tags, target 100 % match</text><text x="32.0" y="508.9" font-size="10" font-weight="700" fill="#2d6a4f" text-anchor="start">WHAT TO PROVE</text><text x="32.0" y="524.9" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">• In the hall B2-DH3 walk-down 18 of 20 tags matched the gate records (90 %); CRAH-14 went back to green and CDU-07 back to yellow.</text><text x="32.0" y="539.9" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">• The CxA hangs yellow, green and blue tags; the CxM hangs the white tag after the L5 gate; DCOps removes it at handover.</text><text x="24.0" y="574.9" font-size="10" font-weight="700" fill="#5b6b78" text-anchor="start">LEGEND</text><line x1="24" y1="596.88" x2="50" y2="596.88" stroke="#475569" stroke-width="3"/><text x="56.0" y="600.9" font-size="10" font-weight="400" fill="#172b3a" text-anchor="start">signal / control</text><rect x="24" y="614.88" width="1352" height="44" rx="0" fill="#f6f8fa" fill-opacity="1" stroke="#5b6b78" stroke-width="1"/><text x="32.0" y="628.9" font-size="11" font-weight="700" fill="#172b3a" text-anchor="start">F02-4  ·  Colour tag flow: red, yellow, green, blue and white tags and the gate that changes each</text><text x="1368.0" y="628.9" font-size="10" font-weight="400" fill="#5b6b78" text-anchor="end">Chapter 02 · §02.6</text><text x="32.0" y="641.9" font-size="9" font-weight="400" fill="#5b6b78" text-anchor="start">Data Centre Commissioning Field Manual R01 EN · October 2026 · educational reference, not to scale · project and OEM documents govern</text><text x="32.0" y="653.9" font-size="9" font-weight="400" fill="#5b6b78" text-anchor="start">Symbols: QElectroTech EN 60617 and P&amp;ID collections, CC-BY 3.0, native geometry · instrument bubbles per ISA 5.1 · states per IEC 60617 / IEEE C37.2 practice</text></svg>