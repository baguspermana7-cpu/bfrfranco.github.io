ize="11.5" font-weight="400" fill="#172b3a" text-anchor="start">171.0</text><text x="493.0" y="296.6" font-size="11.5" font-weight="400" fill="#172b3a" text-anchor="start">228.0</text><text x="40.0" y="330.0" font-size="10.5" font-weight="400" fill="#5b6b78" text-anchor="start">flow in L/s at the stated velocity</text><text x="720.0" y="534.0" font-size="10" font-weight="400" fill="#5b6b78" text-anchor="middle">0</text><text x="875.0" y="534.0" font-size="10" font-weight="400" fill="#5b6b78" text-anchor="middle">100</text><text x="1030.0" y="534.0" font-size="10" font-weight="400" fill="#5b6b78" text-anchor="middle">200</text><text x="1185.0" y="534.0" font-size="10" font-weight="400" fill="#5b6b78" text-anchor="middle">300</text><text x="1340.0" y="534.0" font-size="10" font-weight="400" fill="#5b6b78" text-anchor="middle">400</text><text x="714.0" y="524.0" font-size="10" font-weight="400" fill="#5b6b78" text-anchor="end">0</text><text x="714.0" y="440.7" font-size="10" font-weight="400" fill="#5b6b78" text-anchor="end">50</text><text x="714.0" y="357.3" font-size="10" font-weight="400" fill="#5b6b78" text-anchor="end">100</text><text x="714.0" y="274.0" font-size="10" font-weight="400" fill="#5b6b78" text-anchor="end">150</text><text x="714.0" y="190.7" font-size="10" font-weight="400" fill="#5b6b78" text-anchor="end">200</text><text x="1030.0" y="550.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="middle">inside diameter (mm)</text><text transform="translate(676 320.0) rotate(-90)" font-size="11" text-anchor="middle" fill="#172b3a">flow (L/s)</text><text x="766.0" y="136.0" font-size="10" font-weight="400" fill="#172b3a" text-anchor="start">1.0 m/s</text><text x="766.0" y="151.0" font-size="10" font-weight="400" fill="#172b3a" text-anchor="start">1.5 m/s</text><text x="766.0" y="166.0" font-size="10" font-weight="400" fill="#172b3a" text-anchor="start">2.0 m/s</text><text x="1303.5" y="127.3" font-size="10" font-weight="400" fill="#8a5a00" text-anchor="end">DN400 232</text><text x="50.0" y="463.2" font-size="11" font-weight="700" fill="#b7791f" text-anchor="start">What to prove</text><text x="50.0" y="478.6" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">Equipment heat exchangers are bypassed during the dynamic flush.</text><text x="50.0" y="493.4" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">The measured flushing flow gives a velocity above design and at least the BG 29 value for the</text><text x="50.0" y="508.3" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">size.</text><text x="50.0" y="523.1" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">Every strainer basket was opened and its debris recorded at each flush stage.</text><circle cx="1310.5" cy="133.3" r="4" fill="#b7791f"/><text x="24.0" y="30.0" font-size="17" font-weight="700" fill="#172b3a" text-anchor="start">F18-3  Flushing velocity: flow needed to reach 1.0, 1.5 and 2.0 m/s in Schedule 40 steel pipe</text><text x="24.0" y="48.0" font-size="10" font-weight="400" fill="#5b6b78" text-anchor="start">Q (L/s) = v × π × d² ÷ 4 × 1,000 · BG 29/2021 minimum for 150 mm: 1.26 m/s · DN150 CDU branch: design 24.2 L/s = 1.30 m/s, BG 29 minimum needs 23.5 L/s · DN400 hall main: design 232 L/s = 2.0 m/s · 16 branches at 23.5 L/s = 376 L/s</text><text x="24.0" y="61.0" font-size="10" font-weight="400" fill="#5b6b78" text-anchor="start">exceed the 348 L/s of 3 pumps</text><text x="32.0" y="590.0" font-size="10" font-weight="700" fill="#2d6a4f" text-anchor="start">WHAT TO PROVE</text><text x="32.0" y="606.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">• A DN150 branch at its design flow of 24.2 L/s runs at 1.30 m/s, just above the BG 29 minimum of 1.26 m/s; all 16 branches together would need 376 L/s, so they are flushed in two groups of eight (188 L/s on the main).</text><text x="32.0" y="621.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">• The flushing flow and the pipe size are recorded for every section, and the velocity is compared with the BG 29 value for that size.</text><rect x="24" y="654" width="1352" height="44" rx="0" fill="#f6f8fa" fill-opacity="1" stroke="#5b6b78" stroke-width="1"/><text x="32.0" y="668.0" font-size="11" font-weight="700" fill="#172b3a" text-anchor="start">F18-3  ·  Flushing velocity: flow needed to reach 1.0, 1.5 and 2.0 m/s in Schedule 40 steel pipe</text><text x="1368.0" y="668.0" font-size="10" font-weight="400" fill="#5b6b78" text-anchor="end">Chapter 18 · §18.4</text><text x="32.0" y="681.0" font-size="9" font-weight="400" fill="#5b6b78" text-anchor="start">Data Centre Commissioning Field Manual R01 EN · October 2026 · educational reference, not to scale · project and OEM documents govern</text><text x="32.0" y="693.0" font-size="9" font-weight="400" fill="#5b6b78" text-anchor="start">Symbols: QElectroTech EN 60617 and P&amp;ID collections, CC-BY 3.0, native geometry · instrument bubbles per ISA 5.1 · states per IEC 60617 / IEEE C37.2 practice</text></svg>