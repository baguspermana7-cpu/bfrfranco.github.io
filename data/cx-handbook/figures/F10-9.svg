" fill="#ffffff" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><rect x="520" y="321.0" width="200.66666666666666" height="23.0" rx="0" fill="#ffffff" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><rect x="720.6666666666666" y="321.0" width="114.66666666666667" height="23.0" rx="0" fill="#ffffff" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><rect x="835.3333333333333" y="321.0" width="114.66666666666667" height="23.0" rx="0" fill="#ffffff" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><rect x="520" y="344.0" width="200.66666666666666" height="23.0" rx="0" fill="#ffffff" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><rect x="720.6666666666666" y="344.0" width="114.66666666666667" height="23.0" rx="0" fill="#ffffff" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><rect x="835.3333333333333" y="344.0" width="114.66666666666667" height="23.0" rx="0" fill="#ffffff" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><rect x="520" y="367.0" width="200.66666666666666" height="23.0" rx="0" fill="#ffffff" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><rect x="720.6666666666666" y="367.0" width="114.66666666666667" height="23.0" rx="0" fill="#ffffff" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><rect x="835.3333333333333" y="367.0" width="114.66666666666667" height="23.0" rx="0" fill="#ffffff" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><text x="260.0" y="126.8" font-size="11.5" font-weight="700" fill="#475569" text-anchor="middle">1 Continuity of protective conductors</text><text x="260.0" y="139.6" font-size="9.5" font-weight="400" fill="#172b3a" text-anchor="middle">low-resistance ohmmeter, at least 0.2 A</text><text x="260.0" y="194.8" font-size="11.5" font-weight="700" fill="#475569" text-anchor="middle">2 Insulation resistance</text><text x="260.0" y="207.6" font-size="9.5" font-weight="400" fill="#172b3a" text-anchor="middle">test voltage and minimum from Table 6.1</text><text x="260.0" y="262.8" font-size="11.5" font-weight="700" fill="#475569" text-anchor="middle">3 SELV, PELV, electrical separation</text><text x="260.0" y="275.6" font-size="9.5" font-weight="400" fill="#172b3a" text-anchor="middle">separation of circuits</text><text x="260.0" y="330.8" font-size="11.5" font-weight="700" fill="#475569" text-anchor="middle">4 Automatic disconnection of supply</text><text x="260.0" y="343.6" font-size="9.5" font-weight="400" fill="#172b3a" text-anchor="middle">loop impedance against device maximum</text><text x="260.0" y="398.8" font-size="11.5" font-weight="700" fill="#475569" text-anchor="middle">5 Additional protection</text><text x="260.0" y="411.6" font-size="9.5" font-weight="400" fill="#172b3a" text-anchor="middle">RCD trip time at rated residual current</text><text x="260.0" y="466.8" font-size="11.5" font-weight="700" fill="#475569" text-anchor="middle">6 Polarity and phase sequence</text><text x="260.0" y="479.6" font-size="9.5" font-weight="400" fill="#172b3a" text-anchor="middle">switch in line conductor, L1-L2-L3</text><text x="260.0" y="534.8" font-size="11.5" font-weight="700" fill="#475569" text-anchor="middle">7 Functional tests</text><text x="260.0" y="547.6" font-size="9.5" font-weight="400" fill="#172b3a" text-anchor="middle">switchgear, interlocks, controls</text><text x="260.0" y="602.8" font-size="11.5" font-weight="700" fill="#475569" text-anchor="middle">8 Voltage drop</text><text x="260.0" y="615.6" font-size="9.5" font-weight="400" fill="#172b3a" text-anchor="middle">where the design asks for it</text><text x="525.0" y="125.6" font-size="11.5" font-weight="700" fill="#172b3a" text-anchor="start">Circuit voltage</text><text x="725.0" y="125.6" font-size="11.5" font-weight="700" fill="#172b3a" text-anchor="start">Test V DC</text><text x="845.0" y="125.6" font-size="11.5" font-weight="700" fill="#172b3a" text-anchor="start">Minimum</text><text x="525.0" y="148.6" font-size="11.5" font-weight="400" fill="#172b3a" text-anchor="start">SELV and PELV</text><text x="725.0" y="148.6" font-size="11.5" font-weight="400" fill="#172b3a" text-anchor="start">250 V</text><text x="845.0" y="148.6" font-size="11.5" font-weight="400" fill="#172b3a" text-anchor="start">0.5 MΩ</text><text x="525.0" y="171.6" font-size="11.5" font-weight="400" fill="#172b3a" text-anchor="start">up to 500 V</text><text x="725.0" y="171.6" font-size="11.5" font-weight="400" fill="#172b3a" text-anchor="start">500 V</text><text x="845.0" y="171.6" font-size="11.5" font-weight="400" fill="#172b3a" text-anchor="start">1 MΩ</text><text x="525.0" y="194.6" font-size="11.5" font-weight="400" fill="#172b3a" text-anchor="start">above 500 V</text><text x="725.0" y="194.6" font-size="11.5" font-weight="400" fill="#172b3a" text-anchor="start">1,000 V</text><text x="845.0" y="194.6" font-size="11.5" font-weight="400" fill="#172b3a" text-anchor="start">1 MΩ</text><text x="520.0" y="226.0" font-size="10.5" font-weight="400" fill="#172b3a" text-anchor="start">Table 6.1 values as quoted in vendor guides</text><text x="525.0" y="267.6" font-size="11.5" font-weight="700" fill="#172b3a" text-anchor="start">Pair tested</text><text x="725.7" y="267.6" font-size="11.5" font-weight="700" fill="#172b3a" text-anchor="start">Reading</text><text x="840.3" y="267.6" font-size="11.5" font-weight="700" fill="#172b3a" text-anchor="start">Result</text><text x="525.0" y="290.6" font-size="11.5" font-weight="400" fill="#172b3a" text-anchor="start">L1+L2+L3+N to PE</text><text x="725.7" y="290.6" font-size="11.5" font-weight="400" fill="#172b3a" text-anchor="start">2,400 MΩ</text><text x="840.3" y="290.6" font-size="11.5" font-weight="400" fill="#172b3a" text-anchor="start">pass</text><text x="525.0" y="313.6" font-size="11.5" font-weight="400" fill="#172b3a" text-anchor="start">L1-L2</text><text x="725.7" y="313.6" font-size="11.5" font-weight="400" fill="#172b3a" text-anchor="start">1,850 MΩ</text><text x="840.3" y="313.6" font-size="11.5" font-weight="400" fill="#172b3a" text-anchor="start">pass</text><text x="525.0" y="336.6" font-size="11.5" font-weight="400" fill="#172b3a" text-anchor="start">L2-L3</text><text x="725.7" y="336.6" font-size="11.5" font-weight="400" fill="#172b3a" text-anchor="start">1,920 MΩ</text><text x="840.3" y="336.6" font-size="11.5" font-weight="400" fill="#172b3a" text-anchor="start">pass</text><text x="525.0" y="359.6" font-size="11.5" font-weight="400" fill="#172b3a" text-anchor="start">L3-L1</text><text x="725.7" y="359.6" font-size="11.5" font-weight="400" fill="#172b3a" text-anchor="start">1,770 MΩ</text><text x="840.3" y="359.6" font-size="11.5" font-weight="400" fill="#172b3a" text-anchor="start">pass, lowest</text><text x="525.0" y="382.6" font-size="11.5" font-weight="400" fill="#172b3a" text-anchor="start">L1-N</text><text x="725.7" y="382.6" font-size="11.5" font-weight="400" fill="#172b3a" text-anchor="start">2,050 MΩ</text><text x="840.3" y="382.6" font-size="11.5" font-weight="400" fill="#172b3a" text-anchor="start">pass</text><text x="520.0" y="418.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">Set-up: 500 V DC for 60 s; SPD and RPP meter supply disconnected; L1, L2,</text><text x="520.0" y="432.9" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">L3 and N linked at the far end for the test to PE.</text><text x="520.0" y="447.7" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">Observation level: 100 MΩ on new cable (project practice).</text><text x="24.0" y="30.0" font-size="17" font-weight="700" fill="#172b3a" text-anchor="start">F10-9  Initial verification of a 415 V circuit: test order and insulation resistance record</text><text x="24.0" y="48.0" font-size="11" font-weight="400" fill="#5b6b78" text-anchor="start">IEC 60364-6:2016 order, 8 tests · Table 6.1: 500 V DC, minimum 1 MΩ up to 500 V · B2-DH3-RPP-A1-07, 95 mm² Cu, 64 m · lowest reading 1,770 MΩ</text><text x="32.0" y="672.0" font-size="10" font-weight="700" fill="#2d6a4f" text-anchor="start">WHAT TO PROVE</text><text x="32.0" y="688.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">• The insulation test is made at 500 V DC for 60 s with the surge protective device and the meter supply disconnected.</text><text x="32.0" y="703.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">• All five readings (1,770 MΩ to 2,400 MΩ) are above both the 1 MΩ minimum and the 100 MΩ observation level; the record is ELE-L2-RPP-07.</text><text x="24.0" y="738.0" font-size="10" font-weight="700" fill="#5b6b78" text-anchor="start">LEGEND</text><line x1="24" y1="760" x2="50" y2="760" stroke="#475569" stroke-width="3"/><text x="56.0" y="764.0" font-size="10" font-weight="400" fill="#172b3a" text-anchor="start">signal / control</text><rect x="24" y="778" width="952" height="44" rx="0" fill="#f6f8fa" fill-opacity="1" stroke="#5b6b78" stroke-width="1"/><text x="32.0" y="792.0" font-size="11" font-weight="700" fill="#172b3a" text-anchor="start">F10-9  ·  Initial verification of a 415 V circuit: test order and insulation resistance record</text><text x="968.0" y="792.0" font-size="10" font-weight="400" fill="#5b6b78" text-anchor="end">Chapter 10 · §10.7.5</text><text x="32.0" y="805.0" font-size="9" font-weight="400" fill="#5b6b78" text-anchor="start">Data Centre Commissioning Field Manual R01 EN · October 2026 · educational reference, not to scale · project and OEM documents govern</text><text x="32.0" y="817.0" font-size="9" font-weight="400" fill="#5b6b78" text-anchor="start">Symbols: QElectroTech EN 60617 and P&amp;ID collections, CC-BY 3.0, native geometry · instrument bubbles per ISA 5.1 · states per IEC 60617 / IEEE C37.2 practice</text></svg>