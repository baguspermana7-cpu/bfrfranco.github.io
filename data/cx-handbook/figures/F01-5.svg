5" y="413.0" font-size="10" font-weight="400" fill="#7c3aed" text-anchor="start">ASHRAE 135-2024, Guideline 13, IEC 62443-3-3</text><text x="1061.5" y="447.0" font-size="10" font-weight="400" fill="#7c3aed" text-anchor="end">TIA-568.2-E, TIA-568.3-E, IEC 61300-3-35</text><text x="1159.0" y="481.0" font-size="10" font-weight="400" fill="#475569" text-anchor="end">ISO 19650-2, chapter 04</text><text x="1256.5" y="515.0" font-size="10" font-weight="400" fill="#334155" text-anchor="end">BG 54/2018, Guideline 1.4, Uptime OS</text><text x="24.0" y="30.0" font-size="17" font-weight="700" fill="#172b3a" text-anchor="start">F01-5  Twelve-week reading plan for a Jakarta hyperscale campus</text><text x="24.0" y="48.0" font-size="11" font-weight="400" fill="#5b6b78" text-anchor="start">6 hours of reading per week · project documents in week 1 · law and SLO in week 4 · electrical tests weeks 5 and 6 · cooling week 7 · fire week 8 · controls and network weeks 9 and 10 · handover week 12</text><text x="32.0" y="584.0" font-size="10" font-weight="700" fill="#2d6a4f" text-anchor="start">WHAT TO PROVE</text><text x="32.0" y="600.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">• The contract, the OPR and section 01 91 13 are read before any standard, because they decide which standard applies.</text><text x="32.0" y="615.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">• The LIT and the fire authority are met in weeks 4 and 8 to confirm inspection steps and lead times.</text><rect x="24" y="648" width="1352" height="44" rx="0" fill="#f6f8fa" fill-opacity="1" stroke="#5b6b78" stroke-width="1"/><text x="32.0" y="662.0" font-size="11" font-weight="700" fill="#172b3a" text-anchor="start">F01-5  ·  Twelve-week reading plan for a Jakarta hyperscale campus</text><text x="1368.0" y="662.0" font-size="10" font-weight="400" fill="#5b6b78" text-anchor="end">Chapter 01 · §01.15</text><text x="32.0" y="675.0" font-size="9" font-weight="400" fill="#5b6b78" text-anchor="start">Data Centre Commissioning Field Manual R01 EN · October 2026 · educational reference, not to scale · project and OEM documents govern</text><text x="32.0" y="687.0" font-size="9" font-weight="400" fill="#5b6b78" text-anchor="start">Symbols: QElectroTech EN 60617 and P&amp;ID collections, CC-BY 3.0, native geometry · instrument bubbles per ISA 5.1 · states per IEC 60617 / IEEE C37.2 practice</text></svg>