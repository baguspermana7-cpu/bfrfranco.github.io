"#5b6b78" text-anchor="middle">500</text><text x="776.7" y="504.0" font-size="10" font-weight="400" fill="#5b6b78" text-anchor="middle">600</text><text x="887.8" y="504.0" font-size="10" font-weight="400" fill="#5b6b78" text-anchor="middle">700</text><text x="998.9" y="504.0" font-size="10" font-weight="400" fill="#5b6b78" text-anchor="middle">800</text><text x="1110.0" y="504.0" font-size="10" font-weight="400" fill="#5b6b78" text-anchor="middle">900</text><text x="104.0" y="494.0" font-size="10" font-weight="400" fill="#5b6b78" text-anchor="end">44.8</text><text x="104.0" y="456.0" font-size="10" font-weight="400" fill="#5b6b78" text-anchor="end">45</text><text x="104.0" y="418.0" font-size="10" font-weight="400" fill="#5b6b78" text-anchor="end">45.2</text><text x="104.0" y="380.0" font-size="10" font-weight="400" fill="#5b6b78" text-anchor="end">45.4</text><text x="104.0" y="342.0" font-size="10" font-weight="400" fill="#5b6b78" text-anchor="end">45.6</text><text x="104.0" y="304.0" font-size="10" font-weight="400" fill="#5b6b78" text-anchor="end">45.8</text><text x="104.0" y="266.0" font-size="10" font-weight="400" fill="#5b6b78" text-anchor="end">46</text><text x="104.0" y="228.0" font-size="10" font-weight="400" fill="#5b6b78" text-anchor="end">46.2</text><text x="104.0" y="190.0" font-size="10" font-weight="400" fill="#5b6b78" text-anchor="end">46.4</text><text x="104.0" y="152.0" font-size="10" font-weight="400" fill="#5b6b78" text-anchor="end">46.6</text><text x="104.0" y="114.0" font-size="10" font-weight="400" fill="#5b6b78" text-anchor="end">46.8</text><text x="610.0" y="520.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="middle">time (s)</text><text transform="translate(66 300.0) rotate(-90)" font-size="11" text-anchor="middle" fill="#172b3a">TCS supply temperature (°C)</text><text x="138.0" y="538.0" font-size="10" font-weight="400" fill="#172b3a" text-anchor="start">setpoint</text><text x="138.0" y="553.0" font-size="10" font-weight="400" fill="#172b3a" text-anchor="start">first parameter set</text><text x="138.0" y="568.0" font-size="10" font-weight="400" fill="#172b3a" text-anchor="start">final parameter set</text><text x="138.0" y="583.0" font-size="10" font-weight="400" fill="#172b3a" text-anchor="start">±0.1 K band (45.9 to 46.1 °C)</text><text x="301.4" y="138.2" font-size="10" font-weight="400" fill="#8a5a00" text-anchor="start">peak 46.62 °C</text><text x="344.8" y="225.6" font-size="10" font-weight="400" fill="#8a5a00" text-anchor="start">peak 46.16 °C</text><text x="1155.0" y="125.0" font-size="11" font-weight="700" fill="#172b3a" text-anchor="start">Quantity</text><text x="1279.3" y="125.0" font-size="11" font-weight="700" fill="#172b3a" text-anchor="start">Final</text><text x="1155.0" y="147.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">overshoot</text><text x="1279.3" y="147.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">0.16 K</text><text x="1155.0" y="169.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">settling</text><text x="1279.3" y="169.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">189 s</text><text x="1155.0" y="191.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">rise 90 %</text><text x="1279.3" y="191.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">86 s</text><text x="1155.0" y="213.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">result</text><text x="1279.3" y="213.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">pass</text><text x="110.0" y="618.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">Time on the axis is from the start of the trend; the step is at 60 s, so &quot;189 s after the step&quot; is 249 s on the axis. The response curves are a second-order model fitted to the worked example, used to show how the acceptance</text><text x="110.0" y="632.9" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">values are read from a trend.</text><circle cx="294.4" cy="144.2" r="4" fill="#b7791f"/><circle cx="337.8" cy="231.6" r="4" fill="#b7791f"/><text x="24.0" y="30.0" font-size="17" font-weight="700" fill="#172b3a" text-anchor="start">F22-3  CDU 07 supply temperature loop: response to a 1 K setpoint step before and after tuning</text><text x="24.0" y="48.0" font-size="11" font-weight="400" fill="#5b6b78" text-anchor="start">setpoint 45.0 → 46.0 °C at t = 60 s · first set gain 4.0 %/K, integral 40 s · final set gain 2.0 %/K, integral 90 s · acceptance: overshoot ≤ 0.3 K, inside ±0.1 K within 300 s</text><text x="32.0" y="671.5" font-size="10" font-weight="700" fill="#2d6a4f" text-anchor="start">WHAT TO PROVE</text><text x="32.0" y="687.5" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">• First set: overshoot 0.62 K at 106 s after the step, inside ±0.1 K only after 453 s: fail.</text><text x="32.0" y="702.5" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">• Final set: overshoot 0.16 K at 145 s after the step, inside ±0.1 K after 189 s: pass; parameters spot-checked on CDU 02 and CDU 13.</text><rect x="24" y="735.49" width="1352" height="44" rx="0" fill="#f6f8fa" fill-opacity="1" stroke="#5b6b78" stroke-width="1"/><text x="32.0" y="749.5" font-size="11" font-weight="700" fill="#172b3a" text-anchor="start">F22-3  ·  CDU 07 supply temperature loop: response to a 1 K setpoint step before and after tuning</text><text x="1368.0" y="749.5" font-size="10" font-weight="400" fill="#5b6b78" text-anchor="end">Chapter 22 · §22.9</text><text x="32.0" y="762.5" font-size="9" font-weight="400" fill="#5b6b78" text-anchor="start">Data Centre Commissioning Field Manual R01 EN · October 2026 · educational reference, not to scale · project and OEM documents govern</text><text x="32.0" y="774.5" font-size="9" font-weight="400" fill="#5b6b78" text-anchor="start">Symbols: QElectroTech EN 60617 and P&amp;ID collections, CC-BY 3.0, native geometry · instrument bubbles per ISA 5.1 · states per IEC 60617 / IEEE C37.2 practice</text></svg>