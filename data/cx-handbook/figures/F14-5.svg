rt">1.02 x Is</text><text x="1275.0" y="223.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">+2 %</text><circle cx="315.8" cy="329.7" r="4" fill="#b7791f"/><circle cx="548.3" cy="407.4" r="4" fill="#b7791f"/><circle cx="724.2" cy="440.7" r="4" fill="#b7791f"/><text x="24.0" y="30.0" font-size="17" font-weight="700" fill="#172b3a" text-anchor="start">F14-5  Secondary injection of an IEC standard inverse (51) element: curve, test points and tolerance</text><text x="24.0" y="48.0" font-size="11" font-weight="400" fill="#5b6b78" text-anchor="start">IEC 60255-151 standard inverse t = TMS x 0.14 / ((I/Is)^0.02 - 1) · Is 1.0 x In, TMS 0.10 · test points 2, 5 and 10 x Is · tolerance example ±5 % or ±30 ms, whichever is greater (relay manual value)</text><text x="32.0" y="667.0" font-size="10" font-weight="700" fill="#2d6a4f" text-anchor="start">WHAT TO PROVE</text><text x="32.0" y="683.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">• At 2 x Is: t = 0.1 x 0.14 / (2^0.02 - 1) = 1.003 s; at 5 x Is: 0.428 s; at 10 x Is: 0.297 s.</text><text x="32.0" y="698.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">• A measured 1.07 s at 2 x Is is 6.7 % slow: outside ±5 %, so the setting file and the test set curve type are checked before the relay is rejected.</text><rect x="24" y="731" width="1352" height="44" rx="0" fill="#f6f8fa" fill-opacity="1" stroke="#5b6b78" stroke-width="1"/><text x="32.0" y="745.0" font-size="11" font-weight="700" fill="#172b3a" text-anchor="start">F14-5  ·  Secondary injection of an IEC standard inverse (51) element: curve, test points and tolerance</text><text x="1368.0" y="745.0" font-size="10" font-weight="400" fill="#5b6b78" text-anchor="end">Chapter 14 · §14.9</text><text x="32.0" y="758.0" font-size="9" font-weight="400" fill="#5b6b78" text-anchor="start">Data Centre Commissioning Field Manual R01 EN · October 2026 · educational reference, not to scale · project and OEM documents govern</text><text x="32.0" y="770.0" font-size="9" font-weight="400" fill="#5b6b78" text-anchor="start">Symbols: QElectroTech EN 60617 and P&amp;ID collections, CC-BY 3.0, native geometry · instrument bubbles per ISA 5.1 · states per IEC 60617 / IEEE C37.2 practice</text></svg>