p the poll cycle short.</text><rect x="24" y="429.42" width="1352" height="44" rx="0" fill="#f6f8fa" fill-opacity="1" stroke="#5b6b78" stroke-width="1"/><text x="32.0" y="443.4" font-size="11" font-weight="700" fill="#172b3a" text-anchor="start">F23-7  ·  MSC-1 worked example: EPMS device count for one building by switchboard type and protocol</text><text x="1368.0" y="443.4" font-size="10" font-weight="400" fill="#5b6b78" text-anchor="end">Chapter 23 · §23.15</text><text x="32.0" y="456.4" font-size="9" font-weight="400" fill="#5b6b78" text-anchor="start">Data Centre Commissioning Field Manual R01 EN · October 2026 · educational reference, not to scale · project and OEM documents govern</text><text x="32.0" y="468.4" font-size="9" font-weight="400" fill="#5b6b78" text-anchor="start">Symbols: QElectroTech EN 60617 and P&amp;ID collections, CC-BY 3.0, native geometry · instrument bubbles per ISA 5.1 · states per IEC 60617 / IEEE C37.2 practice</text></svg>