="0.8"/><rect x="40" y="317.0" width="180" height="39.56" rx="0" fill="#e9f0f4" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><rect x="220" y="317.0" width="370" height="39.56" rx="0" fill="#ffffff" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><rect x="590" y="317.0" width="240" height="39.56" rx="0" fill="#ffffff" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><rect x="830" y="317.0" width="130" height="39.56" rx="0" fill="#ffffff" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><rect x="40" y="380.56" width="920" height="44.775" rx="4" fill="#fffbe6" fill-opacity="1" stroke="#b7791f" stroke-width="1.2"/><text x="405.0" y="126.4" font-size="10.5" font-weight="700" fill="#172b3a" text-anchor="middle">Sections completed or updated</text><text x="710.0" y="126.4" font-size="10.5" font-weight="700" fill="#172b3a" text-anchor="middle">Inputs</text><text x="895.0" y="126.4" font-size="10.5" font-weight="700" fill="#172b3a" text-anchor="middle">Approver</text><text x="46.0" y="150.8" font-size="11.5" font-weight="400" fill="#172b3a" text-anchor="start">Pre-design (rev 0)</text><text x="405.0" y="150.8" font-size="11.5" font-weight="700" fill="#172b3a" text-anchor="middle">1 to 9 complete; 10 to 29 in outline</text><text x="710.0" y="150.8" font-size="11.5" font-weight="700" fill="#172b3a" text-anchor="middle">OPR rev 0, campus phases</text><text x="895.0" y="150.8" font-size="11.5" font-weight="700" fill="#172b3a" text-anchor="middle">owner</text><text x="46.0" y="182.8" font-size="11.5" font-weight="400" fill="#172b3a" text-anchor="start">Each design stage</text><text x="405.0" y="175.2" font-size="11.5" font-weight="700" fill="#172b3a" text-anchor="middle">5 references, 12 design process, 13 submittals, 23</text><text x="405.0" y="190.4" font-size="11.5" font-weight="700" fill="#172b3a" text-anchor="middle">schedule</text><text x="710.0" y="182.8" font-size="11.5" font-weight="700" fill="#172b3a" text-anchor="middle">BOD revision, design review log</text><text x="895.0" y="182.8" font-size="11.5" font-weight="700" fill="#172b3a" text-anchor="middle">owner</text><text x="46.0" y="222.4" font-size="11.5" font-weight="400" fill="#172b3a" text-anchor="start">Contract award</text><text x="405.0" y="214.8" font-size="11.5" font-weight="700" fill="#172b3a" text-anchor="middle">6 team names, 14 FAT list, 21 safety, 23 schedule</text><text x="405.0" y="229.9" font-size="11.5" font-weight="700" fill="#172b3a" text-anchor="middle">linked to programme</text><text x="710.0" y="222.4" font-size="11.5" font-weight="700" fill="#172b3a" text-anchor="middle">contractor programme, OEM list</text><text x="895.0" y="222.4" font-size="11.5" font-weight="700" fill="#172b3a" text-anchor="middle">owner</text><text x="46.0" y="261.9" font-size="11.5" font-weight="400" fill="#172b3a" text-anchor="start">Before L4</text><text x="405.0" y="254.3" font-size="11.5" font-weight="700" fill="#172b3a" text-anchor="middle">17 script list, load bank plan, instrument list, witness</text><text x="405.0" y="269.5" font-size="11.5" font-weight="700" fill="#172b3a" text-anchor="middle">notices</text><text x="710.0" y="261.9" font-size="11.5" font-weight="700" fill="#172b3a" text-anchor="middle">approved sequences, submittals</text><text x="895.0" y="261.9" font-size="11.5" font-weight="700" fill="#172b3a" text-anchor="middle">owner</text><text x="46.0" y="301.5" font-size="11.5" font-weight="400" fill="#172b3a" text-anchor="start">Before L5</text><text x="405.0" y="293.9" font-size="11.5" font-weight="700" fill="#172b3a" text-anchor="middle">18 scenario list, readiness review, observers, abort</text><text x="405.0" y="309.1" font-size="11.5" font-weight="700" fill="#172b3a" text-anchor="middle">criteria</text><text x="710.0" y="301.5" font-size="11.5" font-weight="700" fill="#172b3a" text-anchor="middle">L4 results, BOD failure narratives</text><text x="895.0" y="301.5" font-size="11.5" font-weight="700" fill="#172b3a" text-anchor="middle">owner and CxM</text><text x="46.0" y="341.0" font-size="11.5" font-weight="400" fill="#172b3a" text-anchor="start">Handover</text><text x="405.0" y="333.4" font-size="11.5" font-weight="700" fill="#172b3a" text-anchor="middle">26 acceptance criteria, record set, deferred tests; 28</text><text x="405.0" y="348.6" font-size="11.5" font-weight="700" fill="#172b3a" text-anchor="middle">lessons</text><text x="710.0" y="341.0" font-size="11.5" font-weight="700" fill="#172b3a" text-anchor="middle">issues log, Cx records</text><text x="895.0" y="341.0" font-size="11.5" font-weight="700" fill="#172b3a" text-anchor="middle">owner</text><text x="50.0" y="394.4" font-size="11.5" font-weight="700" fill="#b7791f" text-anchor="start">Check at every revision</text><text x="50.0" y="410.5" font-size="11.5" font-weight="400" fill="#172b3a" text-anchor="start">The plan revision matches the project phase; the level definitions, the sampling rule (section 9) and the retest rule (section 20) are present.</text><text x="24.0" y="30.0" font-size="17" font-weight="700" fill="#172b3a" text-anchor="start">F03-6  Cx plan revisions: what triggers each revision and what changes</text><text x="24.0" y="48.0" font-size="11" font-weight="400" fill="#5b6b78" text-anchor="start">rev 0 in pre-design · one revision per design stage · contract award · before L4 · before L5 · 29 sections (03.4.2) · owner approves each revision</text><text x="32.0" y="461.3" font-size="10" font-weight="700" fill="#2d6a4f" text-anchor="start">WHAT TO PROVE</text><text x="32.0" y="477.3" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">• Revision 0 is issued in pre-design and names the scope, the team, the levels and the sampling rules.</text><text x="32.0" y="492.3" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">• The plan revision issued before L5 carries the IST scenario list, the readiness review and the abort criteria (section 18).</text><rect x="24" y="525.335" width="952" height="44" rx="0" fill="#f6f8fa" fill-opacity="1" stroke="#5b6b78" stroke-width="1"/><text x="32.0" y="539.3" font-size="11" font-weight="700" fill="#172b3a" text-anchor="start">F03-6  ·  Cx plan revisions: what triggers each revision and what changes</text><text x="968.0" y="539.3" font-size="10" font-weight="400" fill="#5b6b78" text-anchor="end">Chapter 03 · §03.4.3</text><text x="32.0" y="552.3" font-size="9" font-weight="400" fill="#5b6b78" text-anchor="start">Data Centre Commissioning Field Manual R01 EN · October 2026 · educational reference, not to scale · project and OEM documents govern</text><text x="32.0" y="564.3" font-size="9" font-weight="400" fill="#5b6b78" text-anchor="start">Symbols: QElectroTech EN 60617 and P&amp;ID collections, CC-BY 3.0, native geometry · instrument bubbles per ISA 5.1 · states per IEC 60617 / IEEE C37.2 practice</text></svg>