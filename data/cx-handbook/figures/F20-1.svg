6666666" height="22.0" rx="0" fill="#ffffff" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><text x="700.0" y="130.8" font-size="11" font-weight="700" fill="#b91c1c" text-anchor="middle">Main FACP, fire control room</text><text x="700.0" y="143.0" font-size="9" font-weight="400" fill="#172b3a" text-anchor="middle">graphics workstation</text><text x="700.0" y="155.1" font-size="9" font-weight="400" fill="#172b3a" text-anchor="middle">monitoring station dialler</text><text x="240.0" y="267.8" font-size="11" font-weight="700" fill="#b91c1c" text-anchor="middle">B2-FACP-01</text><text x="240.0" y="279.9" font-size="9" font-weight="400" fill="#172b3a" text-anchor="middle">4 loops, Class X</text><text x="240.0" y="292.1" font-size="9" font-weight="400" fill="#172b3a" text-anchor="middle">battery 2 x 12 V 100 Ah</text><text x="700.0" y="267.8" font-size="11" font-weight="700" fill="#b91c1c" text-anchor="middle">B2-FACP-02</text><text x="700.0" y="279.9" font-size="9" font-weight="400" fill="#172b3a" text-anchor="middle">4 loops, Class X</text><text x="700.0" y="292.1" font-size="9" font-weight="400" fill="#172b3a" text-anchor="middle">battery 2 x 12 V 100 Ah</text><text x="1160.0" y="267.8" font-size="11" font-weight="700" fill="#b91c1c" text-anchor="middle">B2-FACP-03</text><text x="1160.0" y="279.9" font-size="9" font-weight="400" fill="#172b3a" text-anchor="middle">4 loops, Class X</text><text x="1160.0" y="292.1" font-size="9" font-weight="400" fill="#172b3a" text-anchor="middle">battery 2 x 12 V 100 Ah</text><text x="860.0" y="226.0" font-size="10.5" font-weight="400" fill="#b91c1c" text-anchor="start">panel network ring (fire-rated cable)</text><text x="190.0" y="411.9" font-size="11" font-weight="700" fill="#b91c1c" text-anchor="middle">Detectors and call points</text><text x="190.0" y="424.0" font-size="9" font-weight="400" fill="#172b3a" text-anchor="middle">smoke, heat, flame, MCP</text><text x="530.0" y="411.9" font-size="11" font-weight="700" fill="#b91c1c" text-anchor="middle">VESDA detectors</text><text x="530.0" y="424.0" font-size="9" font-weight="400" fill="#172b3a" text-anchor="middle">Alert, Action, Fire 1, Fire 2</text><text x="870.0" y="411.9" font-size="11" font-weight="700" fill="#b91c1c" text-anchor="middle">Release panels</text><text x="870.0" y="424.0" font-size="9" font-weight="400" fill="#172b3a" text-anchor="middle">clean agent rooms, pre-action</text><text x="1210.0" y="411.9" font-size="11" font-weight="700" fill="#b91c1c" text-anchor="middle">Monitored inputs</text><text x="1210.0" y="424.0" font-size="9" font-weight="400" fill="#172b3a" text-anchor="middle">flow, tamper, pump, tank</text><text x="700.0" y="500.0" font-size="11" font-weight="700" fill="#b91c1c" text-anchor="middle">Output modules (hardwired, within 1 m of the controlled equipment)</text><text x="125.0" y="552.7" font-size="10.5" font-weight="700" fill="#b91c1c" text-anchor="middle">CRAH, AHU, fan walls</text><text x="315.0" y="552.7" font-size="10.5" font-weight="700" fill="#b91c1c" text-anchor="middle">Fire and smoke dampers</text><text x="505.0" y="552.7" font-size="10.5" font-weight="700" fill="#b91c1c" text-anchor="middle">Access-controlled doors</text><text x="695.0" y="552.7" font-size="10.5" font-weight="700" fill="#b91c1c" text-anchor="middle">Lifts</text><text x="885.0" y="552.7" font-size="10.5" font-weight="700" fill="#b91c1c" text-anchor="middle">Stair pressurisation</text><text x="1075.5" y="552.7" font-size="10.5" font-weight="700" fill="#b91c1c" text-anchor="middle">Li-ion battery contactors</text><text x="1265.0" y="552.7" font-size="10.5" font-weight="700" fill="#b91c1c" text-anchor="middle">Fuel transfer pumps</text><text x="1220.0" y="139.9" font-size="11" font-weight="700" fill="#334155" text-anchor="middle">BMS and EPMS gateway</text><text x="1220.0" y="152.0" font-size="9" font-weight="400" fill="#172b3a" text-anchor="middle">read-only, display only</text><text x="45.0" y="645.0" font-size="11" font-weight="700" fill="#172b3a" text-anchor="start">Item</text><text x="387.2" y="645.0" font-size="11" font-weight="700" fill="#172b3a" text-anchor="start">Value</text><text x="778.3" y="645.0" font-size="11" font-weight="700" fill="#172b3a" text-anchor="start">Test</text><text x="45.0" y="667.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">Addressable devices in B2</text><text x="387.2" y="667.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">4,850</text><text x="778.3" y="667.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">100 % tested, 8.4 working days with 3 pairs</text><text x="45.0" y="689.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">Loop class</text><text x="387.2" y="689.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">Class X with isolators</text><text x="778.3" y="689.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">open circuit and short between isolators</text><text x="45.0" y="711.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">Battery FACP-03</text><text x="387.2" y="711.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">81.6 Ah needed, 100 Ah installed</text><text x="778.3" y="711.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">measured 2.80 A standby, 9.60 A alarm</text><text x="45.0" y="733.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">High-level interface</text><text x="387.2" y="733.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">BACnet or Modbus, read-only</text><text x="778.3" y="733.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">every event type appears at the BMS</text><text x="24.0" y="30.0" font-size="17" font-weight="700" fill="#172b3a" text-anchor="start">F20-1  Fire alarm system of building B2: networked panels, loops, release panels and hardwired interfaces</text><text x="24.0" y="48.0" font-size="11" font-weight="400" fill="#5b6b78" text-anchor="start">3 networked FACP plus the main panel in the fire control room · 4,850 addressable devices · Class X loops with isolators · battery 24 h standby + 5 min alarm (81.6 Ah on FACP-03) · BMS gateway read-only</text><text x="32.0" y="776.0" font-size="10" font-weight="700" fill="#2d6a4f" text-anchor="start">WHAT TO PROVE</text><text x="32.0" y="792.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">• Every C&amp;E effect that stops plant, closes dampers, releases doors, homes lifts or opens battery contactors is a hardwired output module, tested end to end.</text><text x="32.0" y="807.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">• Opening the panel network ring leaves each panel running its own C&amp;E rows (degraded mode test in 20.11.2).</text><text x="24.0" y="842.0" font-size="10" font-weight="700" fill="#5b6b78" text-anchor="start">LEGEND</text><line x1="24" y1="864.0" x2="50" y2="864.0" stroke="#b91c1c" stroke-width="3"/><text x="56.0" y="868.0" font-size="10" font-weight="400" fill="#172b3a" text-anchor="start">fire water</text><line x1="126.0109375" y1="864.0" x2="152.0109375" y2="864.0" stroke="#b91c1c" stroke-width="3"/><text x="158.0" y="868.0" font-size="10" font-weight="400" fill="#172b3a" text-anchor="start">trip / protection</text><line x1="257.978125" y1="864.0" x2="283.978125" y2="864.0" stroke="#334155" stroke-width="3"/><text x="290.0" y="868.0" font-size="10" font-weight="400" fill="#172b3a" text-anchor="start">data / network</text><rect x="24" y="882.0" width="1352" height="44" rx="0" fill="#f6f8fa" fill-opacity="1" stroke="#5b6b78" stroke-width="1"/><text x="32.0" y="896.0" font-size="11" font-weight="700" fill="#172b3a" text-anchor="start">F20-1  ·  Fire alarm system of building B2: networked panels, loops, release panels and hardwired interfaces</text><text x="1368.0" y="896.0" font-size="10" font-weight="400" fill="#5b6b78" text-anchor="end">Chapter 20 · §20.2</text><text x="32.0" y="909.0" font-size="9" font-weight="400" fill="#5b6b78" text-anchor="start">Data Centre Commissioning Field Manual R01 EN · October 2026 · educational reference, not to scale · project and OEM documents govern</text><text x="32.0" y="921.0" font-size="9" font-weight="400" fill="#5b6b78" text-anchor="start">Symbols: QElectroTech EN 60617 and P&amp;ID collections, CC-BY 3.0, native geometry · instrument bubbles per ISA 5.1 · states per IEC 60617 / IEEE C37.2 practice</text></svg>