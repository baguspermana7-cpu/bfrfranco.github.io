 260.0,311.0" fill="none" stroke="#475569" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#arrow-475569)"/><polyline points="1140.0,167.0 1112.5,167.0 1112.5,311.0 1085.0,311.0" fill="none" stroke="#475569" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#arrow-475569)"/><polyline points="40.0,311.0 30.0,311.0 30.0,207.0 70.0,207.0 70.0,194.0" fill="none" stroke="#475569" stroke-width="1.6" stroke-linejoin="round" stroke-dasharray="7 5" marker-end="url(#arrow-475569)"/><rect x="40" y="140" width="220" height="54" rx="14" fill="#ffffff" fill-opacity="1" stroke="#172b3a" stroke-width="1.4"/><rect x="315" y="140" width="220" height="54" rx="14" fill="#ffffff" fill-opacity="1" stroke="#172b3a" stroke-width="1.4"/><rect x="590" y="140" width="220" height="54" rx="14" fill="#ffffff" fill-opacity="1" stroke="#172b3a" stroke-width="1.4"/><rect x="865" y="140" width="220" height="54" rx="14" fill="#ffffff" fill-opacity="1" stroke="#172b3a" stroke-width="1.4"/><rect x="1140" y="140" width="220" height="54" rx="14" fill="#ffffff" fill-opacity="1" stroke="#172b3a" stroke-width="1.4"/><rect x="40" y="284" width="220" height="54" rx="14" fill="#ffffff" fill-opacity="1" stroke="#172b3a" stroke-width="1.4"/><rect x="315" y="284" width="220" height="54" rx="14" fill="#ffffff" fill-opacity="1" stroke="#172b3a" stroke-width="1.4"/><rect x="590" y="284" width="220" height="54" rx="14" fill="#ffffff" fill-opacity="1" stroke="#172b3a" stroke-width="1.4"/><rect x="865" y="284" width="220" height="54" rx="14" fill="#ffffff" fill-opacity="1" stroke="#172b3a" stroke-width="1.4"/><rect x="40" y="430.0" width="352.0" height="22.0" rx="0" fill="#e9f0f4" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><rect x="392.0" y="430.0" width="396.0" height="22.0" rx="0" fill="#e9f0f4" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><rect x="788.0" y="430.0" width="572.0" height="22.0" rx="0" fill="#e9f0f4" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><rect x="40" y="452.0" width="352.0" height="22.0" rx="0" fill="#ffffff" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><rect x="392.0" y="452.0" width="396.0" height="22.0" rx="0" fill="#ffffff" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><rect x="788.0" y="452.0" width="572.0" height="22.0" rx="0" fill="#ffffff" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><rect x="40" y="474.0" width="352.0" height="22.0" rx="0" fill="#ffffff" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><rect x="392.0" y="474.0" width="396.0" height="22.0" rx="0" fill="#ffffff" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><rect x="788.0" y="474.0" width="572.0" height="22.0" rx="0" fill="#ffffff" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><rect x="40" y="496.0" width="352.0" height="22.0" rx="0" fill="#ffffff" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><rect x="392.0" y="496.0" width="396.0" height="22.0" rx="0" fill="#ffffff" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><rect x="788.0" y="496.0" width="572.0" height="22.0" rx="0" fill="#ffffff" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><rect x="40" y="518.0" width="352.0" height="22.0" rx="0" fill="#ffffff" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><rect x="392.0" y="518.0" width="396.0" height="22.0" rx="0" fill="#ffffff" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><rect x="788.0" y="518.0" width="572.0" height="22.0" rx="0" fill="#ffffff" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><rect x="40" y="540.0" width="352.0" height="22.0" rx="0" fill="#ffffff" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><rect x="392.0" y="540.0" width="396.0" height="22.0" rx="0" fill="#ffffff" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><rect x="788.0" y="540.0" width="572.0" height="22.0" rx="0" fill="#ffffff" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><text x="150.0" y="158.9" font-size="11" font-weight="700" fill="#172b3a" text-anchor="middle">STANDBY</text><text x="150.0" y="171.0" font-size="9" font-weight="400" fill="#172b3a" text-anchor="middle">auto, heaters on</text><text x="425.0" y="152.8" font-size="11" font-weight="700" fill="#172b3a" text-anchor="middle">START</text><text x="425.0" y="165.0" font-size="9" font-weight="400" fill="#172b3a" text-anchor="middle">utility lost &gt; 1.0 s</text><text x="425.0" y="177.1" font-size="9" font-weight="400" fill="#172b3a" text-anchor="middle">crank, fire, speed</text><text x="700.0" y="152.8" font-size="11" font-weight="700" fill="#172b3a" text-anchor="middle">DEAD-BUS CLOSE</text><text x="700.0" y="165.0" font-size="9" font-weight="400" fill="#172b3a" text-anchor="middle">first-up set only</text><text x="700.0" y="177.1" font-size="9" font-weight="400" fill="#172b3a" text-anchor="middle">bus below 10 %</text><text x="975.0" y="152.8" font-size="11" font-weight="700" fill="#172b3a" text-anchor="middle">SYNCHRONISE</text><text x="975.0" y="165.0" font-size="9" font-weight="400" fill="#172b3a" text-anchor="middle">0.1 Hz, 3 %, 10°</text><text x="975.0" y="177.1" font-size="9" font-weight="400" fill="#172b3a" text-anchor="middle">advance angle</text><text x="1250.0" y="152.8" font-size="11" font-weight="700" fill="#172b3a" text-anchor="middle">ON BUS, SHARE</text><text x="1250.0" y="165.0" font-size="9" font-weight="400" fill="#172b3a" text-anchor="middle">kW and kvar sharing</text><text x="1250.0" y="177.1" font-size="9" font-weight="400" fill="#172b3a" text-anchor="middle">load added in steps</text><text x="150.0" y="296.8" font-size="11" font-weight="700" fill="#172b3a" text-anchor="middle">COOL-DOWN</text><text x="150.0" y="308.9" font-size="9" font-weight="400" fill="#172b3a" text-anchor="middle">5 min unloaded</text><text x="150.0" y="321.1" font-size="9" font-weight="400" fill="#172b3a" text-anchor="middle">then stop</text><text x="425.0" y="296.8" font-size="11" font-weight="700" fill="#172b3a" text-anchor="middle">CLOSED TRANSITION</text><text x="425.0" y="308.9" font-size="9" font-weight="400" fill="#172b3a" text-anchor="middle">both closed</text><text x="425.0" y="321.1" font-size="9" font-weight="400" fill="#172b3a" text-anchor="middle">overlap at most 100 ms</text><text x="700.0" y="296.8" font-size="11" font-weight="700" fill="#172b3a" text-anchor="middle">SYNC TO UTILITY</text><text x="700.0" y="308.9" font-size="9" font-weight="400" fill="#172b3a" text-anchor="middle">match utility</text><text x="700.0" y="321.1" font-size="9" font-weight="400" fill="#172b3a" text-anchor="middle">phase and slip</text><text x="975.0" y="302.9" font-size="11" font-weight="700" fill="#172b3a" text-anchor="middle">UTILITY STABLE</text><text x="975.0" y="315.0" font-size="9" font-weight="400" fill="#172b3a" text-anchor="middle">timer 5 min</text><text x="45.0" y="445.0" font-size="11" font-weight="700" fill="#172b3a" text-anchor="start">Transition</text><text x="397.0" y="445.0" font-size="11" font-weight="700" fill="#172b3a" text-anchor="start">Condition</text><text x="793.0" y="445.0" font-size="11" font-weight="700" fill="#172b3a" text-anchor="start">Test that proves it</text><text x="45.0" y="467.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">STANDBY to START</text><text x="397.0" y="467.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">utility below 80 % for 1.0 s</text><text x="793.0" y="467.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">open utility incomer, record start signal time</text><text x="45.0" y="489.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">START to DEAD-BUS CLOSE</text><text x="397.0" y="489.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">first set at rated V and Hz, bus dead</text><text x="793.0" y="489.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">bus live at 7.15 s in the B2 example</text><text x="45.0" y="511.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">DEAD-BUS CLOSE to SYNCHRONISE</text><text x="397.0" y="511.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">bus live; other sets match it</text><text x="793.0" y="511.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">device 25 injection and live close per set</text><text x="45.0" y="533.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">ON BUS to UTILITY STABLE</text><text x="397.0" y="533.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">utility healthy</text><text x="793.0" y="533.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">restore utility, record timer</text><text x="45.0" y="555.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">CLOSED TRANSITION to COOL-DOWN</text><text x="397.0" y="555.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">generator breaker open within overlap</text><text x="793.0" y="555.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">measure overlap; block 52G to test the overlap trip</text><text x="24.0" y="30.0" font-size="17" font-weight="700" fill="#172b3a" text-anchor="start">F15-4  Plant control states: from standby through dead-bus close and synchronising to closed-transition return</text><text x="24.0" y="48.0" font-size="11" font-weight="400" fill="#5b6b78" text-anchor="start">start after 1.0 s utility-loss confirmation · first-up closes on dead bus, others synchronise at 0.1 Hz / 3 % / 10° · utility stable 5 min before return · closed-transition overlap at or below 100 ms · cool-down 5 min</text><text x="32.0" y="598.0" font-size="10" font-weight="700" fill="#2d6a4f" text-anchor="start">WHAT TO PROVE</text><text x="32.0" y="614.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">• Only one set may hold the dead-bus permission: the test opens the load-sharing communication line and repeats the start.</text><text x="32.0" y="629.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">• The overlap timer trips the agreed breaker when the generator breaker fails to open within the overlap limit.</text><text x="24.0" y="664.0" font-size="10" font-weight="700" fill="#5b6b78" text-anchor="start">LEGEND</text><line x1="24" y1="686.0" x2="50" y2="686.0" stroke="#475569" stroke-width="3"/><text x="56.0" y="690.0" font-size="10" font-weight="400" fill="#172b3a" text-anchor="start">signal / control</text><rect x="24" y="704.0" width="1352" height="44" rx="0" fill="#f6f8fa" fill-opacity="1" stroke="#5b6b78" stroke-width="1"/><text x="32.0" y="718.0" font-size="11" font-weight="700" fill="#172b3a" text-anchor="start">F15-4  ·  Plant control states: from standby through dead-bus close and synchronising to closed-transition return</text><text x="1368.0" y="718.0" font-size="10" font-weight="400" fill="#5b6b78" text-anchor="end">Chapter 15 · §15.10</text><text x="32.0" y="731.0" font-size="9" font-weight="400" fill="#5b6b78" text-anchor="start">Data Centre Commissioning Field Manual R01 EN · October 2026 · educational reference, not to scale · project and OEM documents govern</text><text x="32.0" y="743.0" font-size="9" font-weight="400" fill="#5b6b78" text-anchor="start">Symbols: QElectroTech EN 60617 and P&amp;ID collections, CC-BY 3.0, native geometry · instrument bubbles per ISA 5.1 · states per IEC 60617 / IEEE C37.2 practice</text></svg>