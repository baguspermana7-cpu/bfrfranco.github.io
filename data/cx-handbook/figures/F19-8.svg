 text-anchor="start">rise ≤ 2 K</text><text x="870.3" y="711.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">pass</text><text x="45.0" y="733.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">160 s</text><text x="139.7" y="733.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">TCS supply recovered</text><text x="383.2" y="733.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">45.3 °C</text><text x="626.8" y="733.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">45 ± 0.5 °C within 180 s</text><text x="870.3" y="733.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">pass</text><circle cx="397.0" cy="319.0" r="4" fill="#b7791f"/><circle cx="766.0" cy="418.0" r="4" fill="#b7791f"/><text x="24.0" y="30.0" font-size="17" font-weight="700" fill="#172b3a" text-anchor="start">F19-8  CDU stop test in zone Z2: TCS supply temperature at the farthest rack</text><text x="24.0" y="48.0" font-size="10" font-weight="400" fill="#5b6b78" text-anchor="start">100 % liquid load 2,400 kW · CDU-03 of 4 stopped at t = 0 · other 3 CDUs 14.5 → 19.4 L/s at 22 s (zone 58.2 L/s) · TCS supply 45.0 °C → peak 46.4 °C at 70 s → 45.3 °C at</text><text x="24.0" y="61.0" font-size="10" font-weight="400" fill="#5b6b78" text-anchor="start">160 s</text><text x="32.0" y="776.0" font-size="10" font-weight="700" fill="#2d6a4f" text-anchor="start">WHAT TO PROVE</text><text x="32.0" y="792.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">• The zone flow of 3 × 19.4 = 58.2 L/s is reached at 22 s, inside the 30 s limit for 58.0 L/s.</text><text x="32.0" y="807.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">• The peak rise is 1.4 K against the 2 K limit, and the supply is back to 45.3 °C (inside 45 ± 0.5 °C) at 160 s, before the 180 s limit.</text><rect x="24" y="840.0" width="952" height="44" rx="0" fill="#f6f8fa" fill-opacity="1" stroke="#5b6b78" stroke-width="1"/><text x="32.0" y="854.0" font-size="11" font-weight="700" fill="#172b3a" text-anchor="start">F19-8  ·  CDU stop test in zone Z2: TCS supply temperature at the farthest rack</text><text x="968.0" y="854.0" font-size="10" font-weight="400" fill="#5b6b78" text-anchor="end">Chapter 19 · §19.13</text><text x="32.0" y="867.0" font-size="9" font-weight="400" fill="#5b6b78" text-anchor="start">Data Centre Commissioning Field Manual R01 EN · October 2026 · educational reference, not to scale · project and OEM documents govern</text><text x="32.0" y="879.0" font-size="9" font-weight="400" fill="#5b6b78" text-anchor="start">Symbols: QElectroTech EN 60617 and P&amp;ID collections, CC-BY 3.0, native geometry · instrument bubbles per ISA 5.1 · states per IEC 60617 / IEEE C37.2 practice</text></svg>