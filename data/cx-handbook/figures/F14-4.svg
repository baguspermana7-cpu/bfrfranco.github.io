y="1" stroke="#9fb0bb" stroke-width="0.8"/><rect x="431.1111111111111" y="386.0" width="537.7777777777778" height="22.0" rx="0" fill="#ffffff" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><rect x="968.8888888888889" y="386.0" width="391.1111111111111" height="22.0" rx="0" fill="#ffffff" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><rect x="40" y="408.0" width="391.1111111111111" height="22.0" rx="0" fill="#ffffff" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><rect x="431.1111111111111" y="408.0" width="537.7777777777778" height="22.0" rx="0" fill="#ffffff" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><rect x="968.8888888888889" y="408.0" width="391.1111111111111" height="22.0" rx="0" fill="#ffffff" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><rect x="40" y="430.0" width="391.1111111111111" height="22.0" rx="0" fill="#ffffff" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><rect x="431.1111111111111" y="430.0" width="537.7777777777778" height="22.0" rx="0" fill="#ffffff" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><rect x="968.8888888888889" y="430.0" width="391.1111111111111" height="22.0" rx="0" fill="#ffffff" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><rect x="40" y="452.0" width="391.1111111111111" height="22.0" rx="0" fill="#ffffff" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><rect x="431.1111111111111" y="452.0" width="537.7777777777778" height="22.0" rx="0" fill="#ffffff" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><rect x="968.8888888888889" y="452.0" width="391.1111111111111" height="22.0" rx="0" fill="#ffffff" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><rect x="40" y="474.0" width="391.1111111111111" height="22.0" rx="0" fill="#ffffff" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><rect x="431.1111111111111" y="474.0" width="537.7777777777778" height="22.0" rx="0" fill="#ffffff" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><rect x="968.8888888888889" y="474.0" width="391.1111111111111" height="22.0" rx="0" fill="#ffffff" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><text x="140.0" y="143.2" font-size="11.5" font-weight="700" fill="#475569" text-anchor="middle">1 Study approved</text><text x="140.0" y="156.0" font-size="9.5" font-weight="400" fill="#172b3a" text-anchor="middle">short-circuit, coordination</text><text x="140.0" y="168.9" font-size="9.5" font-weight="400" fill="#172b3a" text-anchor="middle">arc flash, revision C</text><text x="364.0" y="143.2" font-size="11.5" font-weight="700" fill="#475569" text-anchor="middle">2 Setting files</text><text x="364.0" y="156.0" font-size="9.5" font-weight="400" fill="#172b3a" text-anchor="middle">one per device</text><text x="364.0" y="168.9" font-size="9.5" font-weight="400" fill="#172b3a" text-anchor="middle">name, revision, checksum</text><text x="588.0" y="143.2" font-size="11.5" font-weight="700" fill="#475569" text-anchor="middle">3 Load to device</text><text x="588.0" y="156.0" font-size="9.5" font-weight="400" fill="#172b3a" text-anchor="middle">OEM software</text><text x="588.0" y="168.9" font-size="9.5" font-weight="400" fill="#172b3a" text-anchor="middle">as-found file saved</text><text x="812.0" y="143.2" font-size="11.5" font-weight="700" fill="#475569" text-anchor="middle">4 Injection test</text><text x="812.0" y="156.0" font-size="9.5" font-weight="400" fill="#172b3a" text-anchor="middle">secondary and primary</text><text x="812.0" y="168.9" font-size="9.5" font-weight="400" fill="#172b3a" text-anchor="middle">test points from study</text><text x="1036.0" y="143.2" font-size="11.5" font-weight="700" fill="#475569" text-anchor="middle">5 As-left compare</text><text x="1036.0" y="156.0" font-size="9.5" font-weight="400" fill="#172b3a" text-anchor="middle">software diff</text><text x="1036.0" y="168.9" font-size="9.5" font-weight="400" fill="#172b3a" text-anchor="middle">zero differences</text><text x="1260.0" y="143.2" font-size="11.5" font-weight="700" fill="#475569" text-anchor="middle">6 Lock and record</text><text x="1260.0" y="156.0" font-size="9.5" font-weight="400" fill="#172b3a" text-anchor="middle">password, seal</text><text x="1260.0" y="168.9" font-size="9.5" font-weight="400" fill="#172b3a" text-anchor="middle">register updated</text><text x="45.0" y="335.0" font-size="11" font-weight="700" fill="#172b3a" text-anchor="start">Field in the setting register</text><text x="436.1" y="335.0" font-size="11" font-weight="700" fill="#172b3a" text-anchor="start">Example value</text><text x="973.9" y="335.0" font-size="11" font-weight="700" fill="#172b3a" text-anchor="start">Who fills it</text><text x="45.0" y="357.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">Device tag</text><text x="436.1" y="357.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">B2-DH3-MSB-A1-QA1</text><text x="973.9" y="357.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">protection engineer</text><text x="45.0" y="379.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">Study reference and revision</text><text x="436.1" y="379.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">MSC1-B2-PS-STU-001 rev C</text><text x="973.9" y="379.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">protection engineer</text><text x="45.0" y="401.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">Setting file name</text><text x="436.1" y="401.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">B2-DH3-QA1_revC.set</text><text x="973.9" y="401.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">protection engineer</text><text x="45.0" y="423.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">Checksum or OEM file ID</text><text x="436.1" y="423.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">SHA-256 first 8 characters 4F2A91C0</text><text x="973.9" y="423.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">testing contractor</text><text x="45.0" y="445.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">Firmware version</text><text x="436.1" y="445.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">trip unit 2.1.x (record actual)</text><text x="973.9" y="445.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">testing contractor</text><text x="45.0" y="467.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">As-found and as-left status</text><text x="436.1" y="467.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">as-left = approved, 0 differences</text><text x="973.9" y="467.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">testing contractor, witnessed by CxA</text><text x="45.0" y="489.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">Lock status</text><text x="436.1" y="489.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">password changed, cover sealed S-0412</text><text x="973.9" y="489.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">operations representative</text><text x="24.0" y="30.0" font-size="17" font-weight="700" fill="#172b3a" text-anchor="start">F14-4  Protection setting verification workflow: from the approved study to the as-left setting file</text><text x="24.0" y="48.0" font-size="11" font-weight="400" fill="#5b6b78" text-anchor="start">one setting file per device, with revision and checksum · study approved before any setting is applied · as-found and as-left files compared by software · witness test records the file name and revision · any change goes back to step 1</text><text x="32.0" y="532.0" font-size="10" font-weight="700" fill="#2d6a4f" text-anchor="start">WHAT TO PROVE</text><text x="32.0" y="548.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">• The as-left file read from the device after testing matches the approved file revision byte for byte (or the OEM comparison report shows zero differences).</text><text x="32.0" y="563.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">• A setting changed during testing without a new study revision is a non-conformance: the file is restored or the study is revised and re-approved.</text><text x="24.0" y="598.0" font-size="10" font-weight="700" fill="#5b6b78" text-anchor="start">LEGEND</text><line x1="24" y1="620.0" x2="50" y2="620.0" stroke="#475569" stroke-width="3"/><text x="56.0" y="624.0" font-size="10" font-weight="400" fill="#172b3a" text-anchor="start">signal / control</text><rect x="24" y="638.0" width="1352" height="44" rx="0" fill="#f6f8fa" fill-opacity="1" stroke="#5b6b78" stroke-width="1"/><text x="32.0" y="652.0" font-size="11" font-weight="700" fill="#172b3a" text-anchor="start">F14-4  ·  Protection setting verification workflow: from the approved study to the as-left setting file</text><text x="1368.0" y="652.0" font-size="10" font-weight="400" fill="#5b6b78" text-anchor="end">Chapter 14 · §14.11</text><text x="32.0" y="665.0" font-size="9" font-weight="400" fill="#5b6b78" text-anchor="start">Data Centre Commissioning Field Manual R01 EN · October 2026 · educational reference, not to scale · project and OEM documents govern</text><text x="32.0" y="677.0" font-size="9" font-weight="400" fill="#5b6b78" text-anchor="start">Symbols: QElectroTech EN 60617 and P&amp;ID collections, CC-BY 3.0, native geometry · instrument bubbles per ISA 5.1 · states per IEC 60617 / IEEE C37.2 practice</text></svg>