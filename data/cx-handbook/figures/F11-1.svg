00" fill="#172b3a" text-anchor="start">category, owner and due date per new issue</text><text x="45.0" y="545.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">TRR</text><text x="330.4" y="545.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">CxM</text><text x="580.1" y="545.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">30 to 60 min</text><text x="758.5" y="545.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">go or no-go decision record</text><text x="24.0" y="30.0" font-size="17" font-weight="700" fill="#172b3a" text-anchor="start">F11-1  Weekly commissioning meeting calendar on a campus in the commissioning phase</text><text x="24.0" y="48.0" font-size="11" font-weight="400" fill="#5b6b78" text-anchor="start">daily huddle 07:00 for 15 min · SIMOPS review 07:15 · weekly coordination Monday 13:30 for 90 min · ERB Tuesday 10:00 · look-ahead Wednesday 13:30 · weekly report issued Friday 17:00</text><text x="32.0" y="588.0" font-size="10" font-weight="700" fill="#2d6a4f" text-anchor="start">WHAT TO PROVE</text><text x="32.0" y="604.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">• Every meeting in the calendar has one chair, one minute-taker and minutes issued within 1 working day.</text><text x="32.0" y="619.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">• The weekly report cut-off is Friday 12:00 and the report is issued by Friday 17:00 from the same registers used in the daily reports.</text><rect x="24" y="652.0" width="1352" height="44" rx="0" fill="#f6f8fa" fill-opacity="1" stroke="#5b6b78" stroke-width="1"/><text x="32.0" y="666.0" font-size="11" font-weight="700" fill="#172b3a" text-anchor="start">F11-1  ·  Weekly commissioning meeting calendar on a campus in the commissioning phase</text><text x="1368.0" y="666.0" font-size="10" font-weight="400" fill="#5b6b78" text-anchor="end">Chapter 11 · §11.1</text><text x="32.0" y="679.0" font-size="9" font-weight="400" fill="#5b6b78" text-anchor="start">Data Centre Commissioning Field Manual R01 EN · October 2026 · educational reference, not to scale · project and OEM documents govern</text><text x="32.0" y="691.0" font-size="9" font-weight="400" fill="#5b6b78" text-anchor="start">Symbols: QElectroTech EN 60617 and P&amp;ID collections, CC-BY 3.0, native geometry · instrument bubbles per ISA 5.1 · states per IEC 60617 / IEEE C37.2 practice</text></svg>