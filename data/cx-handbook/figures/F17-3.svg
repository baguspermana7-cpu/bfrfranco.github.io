72b3a" text-anchor="start">1,335 A</text><text x="1015.0" y="211.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">ISC/IL</text><text x="1190.0" y="211.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">9.9</text><text x="1015.0" y="233.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">TDD measured</text><text x="1190.0" y="233.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">4.6 %</text><text x="1015.0" y="255.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">TDD limit</text><text x="1190.0" y="255.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">5.0 %</text><text x="1015.0" y="277.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">THDv 95th pct</text><text x="1190.0" y="277.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">1.8 % (limit 5 %)</text><text x="1015.0" y="299.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">Result</text><text x="1190.0" y="299.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">h11 exceeds</text><circle cx="388.5" cy="335.2" r="4" fill="#b7791f"/><text x="24.0" y="30.0" font-size="17" font-weight="700" fill="#172b3a" text-anchor="start">F17-3  Current harmonic spectrum at the 20 kV incomer TX-A (internal check point) against IEEE 519-2022 limits</text><text x="24.0" y="48.0" font-size="10" font-weight="400" fill="#5b6b78" text-anchor="start">MSC-1 incomer TX-A, IL = 1,335 A maximum demand · ISC = 13.2 kA · ISC/IL = 9.9, so the row &quot;&lt; 20&quot; of IEEE 519 Table 2 applies: h 3 to 9 4.0 %, h 11 to 15 2.0 %, h 17 to 21 1.5 %, h 23 to 33 0.6 %, TDD 5.0 % · weekly 95th percentile of 10-min</text><text x="24.0" y="61.0" font-size="10" font-weight="400" fill="#5b6b78" text-anchor="start">values</text><text x="32.0" y="622.0" font-size="10" font-weight="700" fill="#2d6a4f" text-anchor="start">WHAT TO PROVE</text><text x="32.0" y="638.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">• h11 = 2.3 % exceeds the 2.0 % limit; h5 3.1 % and h7 2.4 % are inside 4.0 %; TDD = 4.6 % is inside 5.0 %.</text><text x="32.0" y="653.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">• Odd harmonics 5, 7, 11, 13 come from six-pulse rectifiers and power supplies; an h11 exceedance with TDD inside the limit is reported to the designer with the measured ISC/IL before any filter is proposed.</text><rect x="24" y="686" width="1352" height="44" rx="0" fill="#f6f8fa" fill-opacity="1" stroke="#5b6b78" stroke-width="1"/><text x="32.0" y="700.0" font-size="11" font-weight="700" fill="#172b3a" text-anchor="start">F17-3  ·  Current harmonic spectrum at the 20 kV incomer TX-A (internal check point) against IEEE 519-2022 limits</text><text x="1368.0" y="700.0" font-size="10" font-weight="400" fill="#5b6b78" text-anchor="end">Chapter 17 · §17.10</text><text x="32.0" y="713.0" font-size="9" font-weight="400" fill="#5b6b78" text-anchor="start">Data Centre Commissioning Field Manual R01 EN · October 2026 · educational reference, not to scale · project and OEM documents govern</text><text x="32.0" y="725.0" font-size="9" font-weight="400" fill="#5b6b78" text-anchor="start">Symbols: QElectroTech EN 60617 and P&amp;ID collections, CC-BY 3.0, native geometry · instrument bubbles per ISA 5.1 · states per IEC 60617 / IEEE C37.2 practice</text></svg>