acity="1" stroke="#9fb0bb" stroke-width="0.8"/><rect x="888.5714285714287" y="684.0" width="471.42857142857144" height="22.0" rx="0" fill="#ffffff" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><rect x="40" y="706.0" width="518.5714285714287" height="22.0" rx="0" fill="#ffffff" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><rect x="558.5714285714287" y="706.0" width="330.0" height="22.0" rx="0" fill="#ffffff" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><rect x="888.5714285714287" y="706.0" width="471.42857142857144" height="22.0" rx="0" fill="#ffffff" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><rect x="40" y="728.0" width="518.5714285714287" height="22.0" rx="0" fill="#ffffff" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><rect x="558.5714285714287" y="728.0" width="330.0" height="22.0" rx="0" fill="#ffffff" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><rect x="888.5714285714287" y="728.0" width="471.42857142857144" height="22.0" rx="0" fill="#ffffff" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><text x="48.0" y="304.0" font-size="13" font-weight="700" fill="#172b3a" text-anchor="end">+</text><text x="48.0" y="344.0" font-size="13" font-weight="700" fill="#172b3a" text-anchor="end">−</text><text x="180.0" y="143.2" font-size="12" font-weight="700" fill="#475569" text-anchor="middle">Router port, AS-DH3</text><text x="180.0" y="156.7" font-size="10" font-weight="400" fill="#172b3a" text-anchor="middle">network 2302, MAC 0</text><text x="180.0" y="170.2" font-size="10" font-weight="400" fill="#172b3a" text-anchor="middle">bias resistors ON</text><text x="180.0" y="183.7" font-size="10" font-weight="400" fill="#172b3a" text-anchor="middle">termination 120 Ω ON</text><text x="420.0" y="439.7" font-size="12" font-weight="700" fill="#475569" text-anchor="middle">Sensor 1</text><text x="420.0" y="453.2" font-size="10" font-weight="400" fill="#172b3a" text-anchor="middle">MAC 1</text><text x="620.0" y="439.7" font-size="12" font-weight="700" fill="#475569" text-anchor="middle">Sensor 2</text><text x="620.0" y="453.2" font-size="10" font-weight="400" fill="#172b3a" text-anchor="middle">MAC 2</text><text x="820.0" y="439.7" font-size="12" font-weight="700" fill="#475569" text-anchor="middle">Sensors 3 to 11</text><text x="820.0" y="453.2" font-size="10" font-weight="400" fill="#172b3a" text-anchor="middle">MAC 3 to 11</text><text x="1020.0" y="439.7" font-size="12" font-weight="700" fill="#475569" text-anchor="middle">Sensor 12</text><text x="1020.0" y="453.2" font-size="10" font-weight="400" fill="#172b3a" text-anchor="middle">MAC 12</text><text x="1220.0" y="439.7" font-size="12" font-weight="700" fill="#475569" text-anchor="middle">Sensor 13 (end)</text><text x="1220.0" y="453.2" font-size="10" font-weight="400" fill="#172b3a" text-anchor="middle">MAC 13 · 120 Ω ON</text><text x="1340.0" y="530.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="end">shield, joined through every device</text><text x="137.0" y="572.0" font-size="12" font-weight="700" fill="#172b3a" text-anchor="start">PE</text><text x="137.0" y="587.0" font-size="10" font-weight="400" fill="#5b6b78" text-anchor="start">shield earth at router panel only</text><text x="45.0" y="655.0" font-size="11" font-weight="700" fill="#172b3a" text-anchor="start">Check at L2 inspection</text><text x="563.6" y="655.0" font-size="11" font-weight="700" fill="#172b3a" text-anchor="start">Instrument</text><text x="893.6" y="655.0" font-size="11" font-weight="700" fill="#172b3a" text-anchor="start">Acceptance</text><text x="45.0" y="677.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">Resistance across + and − with devices unpowered</text><text x="563.6" y="677.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">multimeter</text><text x="893.6" y="677.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">about 60 Ω (two terminations)</text><text x="45.0" y="699.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">Shield continuity from router to sensor 13</text><text x="563.6" y="699.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">multimeter</text><text x="893.6" y="699.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">continuous; earth at one point only</text><text x="45.0" y="721.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">Topology</text><text x="563.6" y="721.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">visual, as-built drawing</text><text x="893.6" y="721.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">daisy chain; no T connections or stars</text><text x="45.0" y="743.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">Baud rate and Max_Master on every device</text><text x="563.6" y="743.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">BACnet tool read of Device object</text><text x="893.6" y="743.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">38,400 bit/s and 13 on all 14 devices</text><text x="24.0" y="30.0" font-size="17" font-weight="700" fill="#172b3a" text-anchor="start">F21-3  BACnet MS/TP trunk 2302: daisy chain, terminations at the two ends, bias at one point, shield earthed once</text><text x="24.0" y="48.0" font-size="11" font-weight="400" fill="#5b6b78" text-anchor="start">13 sensors, MAC 1 to 13, Max_Master 13, 38,400 bit/s · trunk length 180 m (limit 1,200 m up to 76,800 bit/s) · 120 Ω at the router and at sensor 13 · 32 unit loads per segment</text><text x="32.0" y="786.0" font-size="10" font-weight="700" fill="#2d6a4f" text-anchor="start">WHAT TO PROVE</text><text x="32.0" y="802.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">• With power off, the resistance across + and − at the router end reads about 60 Ω (two 120 Ω terminations in parallel); about 40 Ω shows a third termination.</text><text x="32.0" y="817.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">• Max_Master is 13 (the highest master MAC) on every device; the default 127 makes the token holder poll 114 empty addresses, each with a time-out.</text><text x="24.0" y="852.0" font-size="10" font-weight="700" fill="#5b6b78" text-anchor="start">LEGEND</text><g transform="translate(38.0 870.0) scale(0.42)"><line x1="-10" y1="0" x2="10" y2="0" stroke="#172b3a" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/><line x1="0" y1="-15" x2="0" y2="0" stroke="#172b3a" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/><line x1="-7" y1="5" x2="7" y2="5" stroke="#172b3a" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/><line x1="-4" y1="10" x2="4" y2="10" stroke="#172b3a" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/><line x1="0.5" y1="15" x2="-0.5" y2="15" stroke="#172b3a" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/></g><text x="58.0" y="874.0" font-size="10" font-weight="400" fill="#172b3a" text-anchor="start">Earth</text><line x1="24" y1="900.0" x2="50" y2="900.0" stroke="#475569" stroke-width="3"/><text x="56.0" y="904.0" font-size="10" font-weight="400" fill="#172b3a" text-anchor="start">signal / control</text><rect x="24" y="918.0" width="1352" height="44" rx="0" fill="#f6f8fa" fill-opacity="1" stroke="#5b6b78" stroke-width="1"/><text x="32.0" y="932.0" font-size="11" font-weight="700" fill="#172b3a" text-anchor="start">F21-3  ·  BACnet MS/TP trunk 2302: daisy chain, terminations at the two ends, bias at one point, shield earthed once</text><text x="1368.0" y="932.0" font-size="10" font-weight="400" fill="#5b6b78" text-anchor="end">Chapter 21 · §21.5</text><text x="32.0" y="945.0" font-size="9" font-weight="400" fill="#5b6b78" text-anchor="start">Data Centre Commissioning Field Manual R01 EN · October 2026 · educ