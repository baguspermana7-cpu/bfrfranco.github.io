ke="#475569" stroke-width="1.6"/><text x="146.0" y="154.0" font-size="20" font-weight="700" fill="#334155" text-anchor="middle">MSC1</text><text x="146.0" y="270.4" font-size="12.5" font-weight="700" fill="#172b3a" text-anchor="middle">Project</text><text x="146.0" y="284.6" font-size="10.5" font-weight="400" fill="#172b3a" text-anchor="middle">2-6 characters</text><text x="146.0" y="298.8" font-size="10.5" font-weight="400" fill="#172b3a" text-anchor="middle">set by owner</text><text x="332.0" y="154.0" font-size="20" font-weight="700" fill="#334155" text-anchor="middle">EDC</text><text x="332.0" y="270.4" font-size="12.5" font-weight="700" fill="#172b3a" text-anchor="middle">Originator</text><text x="332.0" y="284.6" font-size="10.5" font-weight="400" fill="#172b3a" text-anchor="middle">2-6 characters</text><text x="332.0" y="298.8" font-size="10.5" font-weight="400" fill="#172b3a" text-anchor="middle">electrical designer</text><text x="518.0" y="154.0" font-size="20" font-weight="700" fill="#334155" text-anchor="middle">B2</text><text x="518.0" y="270.4" font-size="12.5" font-weight="700" fill="#172b3a" text-anchor="middle">Volume or system</text><text x="518.0" y="284.6" font-size="10.5" font-weight="400" fill="#172b3a" text-anchor="middle">2 characters</text><text x="518.0" y="298.8" font-size="10.5" font-weight="400" fill="#172b3a" text-anchor="middle">building 2</text><text x="704.0" y="154.0" font-size="20" font-weight="700" fill="#334155" text-anchor="middle">00</text><text x="704.0" y="270.4" font-size="12.5" font-weight="700" fill="#172b3a" text-anchor="middle">Level or location</text><text x="704.0" y="284.6" font-size="10.5" font-weight="400" fill="#172b3a" text-anchor="middle">2 characters</text><text x="704.0" y="298.8" font-size="10.5" font-weight="400" fill="#172b3a" text-anchor="middle">ground floor</text><text x="890.0" y="154.0" font-size="20" font-weight="700" fill="#334155" text-anchor="middle">DR</text><text x="890.0" y="270.4" font-size="12.5" font-weight="700" fill="#172b3a" text-anchor="middle">Type</text><text x="890.0" y="284.6" font-size="10.5" font-weight="400" fill="#172b3a" text-anchor="middle">2 characters</text><text x="890.0" y="298.8" font-size="10.5" font-weight="400" fill="#172b3a" text-anchor="middle">drawing rendition</text><text x="1076.0" y="154.0" font-size="20" font-weight="700" fill="#334155" text-anchor="middle">E</text><text x="1076.0" y="270.4" font-size="12.5" font-weight="700" fill="#172b3a" text-anchor="middle">Role</text><text x="1076.0" y="284.6" font-size="10.5" font-weight="400" fill="#172b3a" text-anchor="middle">1-2 characters</text><text x="1076.0" y="298.8" font-size="10.5" font-weight="400" fill="#172b3a" text-anchor="middle">electrical</text><text x="1262.0" y="154.0" font-size="20" font-weight="700" fill="#334155" text-anchor="middle">2101</text><text x="1262.0" y="270.4" font-size="12.5" font-weight="700" fill="#172b3a" text-anchor="middle">Number</text><text x="1262.0" y="284.6" font-size="10.5" font-weight="400" fill="#172b3a" text-anchor="middle">4-6 digits</text><text x="1262.0" y="298.8" font-size="10.5" font-weight="400" fill="#172b3a" text-anchor="middle">from the MIDP</text><text x="60.0" y="104.0" font-size="11.5" font-weight="700" fill="#5b6b78" text-anchor="start">Identifier as printed in the title block and used as the file name</text><text x="360.0" y="403.4" font-size="12.5" font-weight="700" fill="#475569" text-anchor="middle">Metadata held by the CDE</text><text x="360.0" y="417.5" font-size="10.5" font-weight="400" fill="#172b3a" text-anchor="middle">revision C02 (contractual)</text><text x="360.0" y="431.7" font-size="10.5" font-weight="400" fill="#172b3a" text-anchor="middle">status A3 (authorised at milestone 3)</text><text x="360.0" y="445.9" font-size="10.5" font-weight="400" fill="#172b3a" text-anchor="middle">asset tags B2-MVS-01, B2-MVS-02</text><text x="1030.0" y="403.4" font-size="12.5" font-weight="700" fill="#475569" text-anchor="middle">Other MSC-1 examples</text><text x="1030.0" y="417.5" font-size="10.5" font-weight="400" fill="#172b3a" text-anchor="middle">MSC1-EDC-ZZ-XX-SP-E-0001 campus specification</text><text x="1030.0" y="431.7" font-size="10.5" font-weight="400" fill="#172b3a" text-anchor="middle">MSC1-CXA-B2-01-RP-CX-3051 L3 checklist</text><text x="1030.0" y="445.9" font-size="10.5" font-weight="400" fill="#172b3a" text-anchor="middle">MSC1-GCX-B2-XX-RI-W-0142 RFI</text><text x="24.0" y="30.0" font-size="17" font-weight="700" fill="#172b3a" text-anchor="start">F04-2  Anatomy of an information container identifier on the MSC-1 campus</text><text x="24.0" y="48.0" font-size="11" font-weight="400" fill="#5b6b78" text-anchor="start">Seven fields in fixed order, separated by hyphens · MSC1-EDC-B2-00-DR-E-2101 · revision C02 and status A3 held as metadata</text><text x="32.0" y="508.0" font-size="10" font-weight="700" fill="#2d6a4f" text-anchor="start">WHAT TO PROVE</text><text x="32.0" y="524.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">• Field lengths: project 2-6, originator 2-6, volume 2, level 2, type 2, role 1-2, number 4-6 characters.</text><text x="32.0" y="539.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">• ZZ means all volumes or multiple locations and XX means none; revision and status are not part of the file name.</text><text x="24.0" y="574.0" font-size="10" font-weight="700" fill="#5b6b78" text-anchor="start">LEGEND</text><line x1="24" y1="596" x2="50" y2="596" stroke="#334155" stroke-width="3"/><text x="56.0" y="600.0" font-size="10" font-weight="400" fill="#172b3a" text-anchor="start">data / network</text><line x1="150.859375" y1="596" x2="176.859375" y2="596" stroke="#475569" stroke-width="3"/><text x="182.9" y="600.0" font-size="10" font-weight="400" fill="#172b3a" text-anchor="start">signal / control</text><rect x="24" y="614" width="1352" height="44" rx="0" fill="#f6f8fa" fill-opacity="1" stroke="#5b6b78" stroke-width="1"/><text x="32.0" y="628.0" font-size="11" font-weight="700" fill="#172b3a" text-anchor="start">F04-2  ·  Anatomy of an information container identifier on the MSC-1 campus</text><text x="1368.0" y="628.0" font-size="10" font-weight="400" fill="#5b6b78" text-anchor="end">Chapter 04 · §04.4</text><text x="32.0" y="641.0" font-size="9" font-weight="400" fill="#5b6b78" text-anchor="start">Data Centre Commissioning Field Manual R01 EN · October 2026 · educational reference, not to scale · project and OEM documents govern</text><text x="32.0" y="653.0" font-size="9" font-weight="400" fill="#5b6b78" text-anchor="start">Symbols: QElectroTech EN 60617 and P&amp;ID collections, CC-BY 3.0, native geometry · instrument bubbles per ISA 5.1 · states per IEC 60617 / IEEE C37.2 practice</text></svg>