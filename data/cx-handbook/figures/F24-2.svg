0" width="461.99999999999994" height="22.0" rx="0" fill="#ffffff" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><rect x="40" y="646.0" width="297.0" height="22.0" rx="0" fill="#ffffff" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><rect x="337.0" y="646.0" width="264.0" height="22.0" rx="0" fill="#ffffff" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><rect x="601.0" y="646.0" width="297.0" height="22.0" rx="0" fill="#ffffff" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><rect x="898.0" y="646.0" width="461.99999999999994" height="22.0" rx="0" fill="#ffffff" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><rect x="40" y="668.0" width="297.0" height="22.0" rx="0" fill="#ffffff" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><rect x="337.0" y="668.0" width="264.0" height="22.0" rx="0" fill="#ffffff" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><rect x="601.0" y="668.0" width="297.0" height="22.0" rx="0" fill="#ffffff" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><rect x="898.0" y="668.0" width="461.99999999999994" height="22.0" rx="0" fill="#ffffff" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><rect x="40" y="690.0" width="297.0" height="22.0" rx="0" fill="#ffffff" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><rect x="337.0" y="690.0" width="264.0" height="22.0" rx="0" fill="#ffffff" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><rect x="601.0" y="690.0" width="297.0" height="22.0" rx="0" fill="#ffffff" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><rect x="898.0" y="690.0" width="461.99999999999994" height="22.0" rx="0" fill="#ffffff" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><text x="330.0" y="112.0" font-size="12" font-weight="700" fill="#172b3a" text-anchor="middle">CORRECT WIRING</text><text x="524.0" y="326.0" font-size="12" font-weight="700" fill="#1d4ed8" text-anchor="start">V1</text><text x="454.0" y="381.5" font-size="12" font-weight="700" fill="#b91c1c" text-anchor="start">I1</text><text x="226.0" y="501.9" font-size="12" font-weight="700" fill="#1d4ed8" text-anchor="end">V2</text><text x="230.5" y="424.0" font-size="12" font-weight="700" fill="#b91c1c" text-anchor="end">I2</text><text x="226.0" y="170.1" font-size="12" font-weight="700" fill="#1d4ed8" text-anchor="end">V3</text><text x="295.5" y="206.5" font-size="12" font-weight="700" fill="#b91c1c" text-anchor="end">I3</text><text x="1010.0" y="112.0" font-size="12" font-weight="700" fill="#172b3a" text-anchor="middle">CT2 REVERSED (S1 AND S2 SWAPPED)</text><text x="1204.0" y="326.0" font-size="12" font-weight="700" fill="#1d4ed8" text-anchor="start">V1</text><text x="1134.0" y="381.5" font-size="12" font-weight="700" fill="#b91c1c" text-anchor="start">I1</text><text x="906.0" y="501.9" font-size="12" font-weight="700" fill="#1d4ed8" text-anchor="end">V2</text><text x="1109.5" y="244.0" font-size="12" font-weight="700" fill="#b91c1c" text-anchor="start">I2</text><text x="906.0" y="170.1" font-size="12" font-weight="700" fill="#1d4ed8" text-anchor="end">V3</text><text x="975.5" y="206.5" font-size="12" font-weight="700" fill="#b91c1c" text-anchor="end">I3</text><text x="330.0" y="540.0" font-size="11" font-weight="400" fill="#5b6b78" text-anchor="middle">each I lags its V by 18.2° (PF 0.95)</text><text x="1010.0" y="540.0" font-size="11" font-weight="400" fill="#5b6b78" text-anchor="middle">I2 leads V2 by 161.8°: phase 2 power negative</text><text x="45.0" y="595.0" font-size="11" font-weight="700" fill="#172b3a" text-anchor="start">Reading on the meter</text><text x="342.0" y="595.0" font-size="11" font-weight="700" fill="#172b3a" text-anchor="start">Correct</text><text x="606.0" y="595.0" font-size="11" font-weight="700" fill="#172b3a" text-anchor="start">CT2 reversed</text><text x="903.0" y="595.0" font-size="11" font-weight="700" fill="#172b3a" text-anchor="start">How to see it on site</text><text x="45.0" y="617.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">P1 / P2 / P3 (kW)</text><text x="342.0" y="617.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">682.9 / 682.9 / 682.9</text><text x="606.0" y="617.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">682.9 / -682.9 / 682.9</text><text x="903.0" y="617.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">one phase negative on the meter display or ION Setup</text><text x="45.0" y="639.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">Total P (kW)</text><text x="342.0" y="639.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">2,048.7</text><text x="606.0" y="639.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">682.9</text><text x="903.0" y="639.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">total is one third of the reference clamp reading</text><text x="45.0" y="661.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">PF per phase</text><text x="342.0" y="661.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">0.95 / 0.95 / 0.95</text><text x="606.0" y="661.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">0.95 / -0.95 / 0.95</text><text x="903.0" y="661.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">sign of PF2 reversed</text><text x="45.0" y="683.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">Phase angle I to V</text><text x="342.0" y="683.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">-18.2° each</text><text x="606.0" y="683.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">-18.2° / +161.8° / -18.2°</text><text x="903.0" y="683.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">phasor screen of the meter</text><text x="45.0" y="705.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">Neutral current calculated (A)</text><text x="342.0" y="705.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">close to 0</text><text x="606.0" y="705.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">about 6,000 A</text><text x="903.0" y="705.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">I4 calculated far above the measured neutral</text><text x="24.0" y="30.0" font-size="17" font-weight="700" fill="#172b3a" text-anchor="start">F24-2  Phasor diagrams at the PM8000 on a block LV main: correct wiring and CT2 reversed</text><text x="24.0" y="48.0" font-size="11" font-weight="400" fill="#5b6b78" text-anchor="start">415 V, 239.6 V line to neutral · 3,000 A per phase · power factor 0.95 lagging (current 18.2° behind voltage) · correct total 2,048.7 kW · CT2 reversed: I2 turned 180°, phase 2 reads -682.9 kW, total 682.9 kW</text><text x="32.0" y="748.0" font-size="10" font-weight="700" fill="#2d6a4f" text-anchor="start">WHAT TO PROVE</text><text x="32.0" y="764.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">• Correct wiring: I1, I2, I3 each lag V1, V2, V3 by 18.2° and all three phase powers are positive and equal within 2 %.</text><text x="32.0" y="779.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">• CT2 reversed: I2 leads V2 by 161.8°, phase 2 power is negative and the total falls to one third (2,048.7 to 682.9 kW); the cure is to swap S1 and S2 of CT2 at the test block with the CT shorted.</text><rect x="24" y="812.0" width="1352" height="44" rx="0" fill="#f6f8fa" fill-opacity="1" stroke="#5b6b78" stroke-width="1"/><text x="32.0" y="826.0" font-size="11" font-weight="700" fill="#172b3a" text-anchor="start">F24-2  ·  Phasor diagrams at the PM8000 on a block LV main: correct wiring and CT2 reversed</text><text x="1368.0" y="826.0" font-size="10" font-weight="400" fill="#5b6b78" text-anchor="end">Chapter 24 · §24.4</text><text x="32.0" y="839.0" font-size="9" font-weight="400" fill="#5b6b78" text-anchor="start">Data Centre Commissioning Field Manual R01 EN · October 2026 · educational reference, not to scale · project and OEM documents govern</text><text x="32.0" y="851.0" font-size="9" font-weight="400" fill="#5b6b78" text-anchor="start">Symbols: QElectroTech EN 60617 and P&amp;ID collections, CC-BY 3.0, native geometry · instrument bubbles per ISA 5.1 · states per IEC 60617 / IEEE C37.2 practice</text></svg>