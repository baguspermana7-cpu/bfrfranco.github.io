ity="1" stroke="#1d4ed8" stroke-width="1.4"/><rect x="680" y="240" width="620" height="100" rx="0" fill="#ffffff" fill-opacity="1" stroke="#1d4ed8" stroke-width="1.4"/><rect x="340" y="390" width="240" height="80" rx="0" fill="#ffffff" fill-opacity="1" stroke="#0e7490" stroke-width="1.4"/><rect x="680" y="380" width="620" height="100" rx="0" fill="#ffffff" fill-opacity="1" stroke="#0e7490" stroke-width="1.4"/><rect x="340" y="530" width="240" height="80" rx="0" fill="#ffffff" fill-opacity="1" stroke="#334155" stroke-width="1.4"/><rect x="680" y="520" width="620" height="100" rx="0" fill="#ffffff" fill-opacity="1" stroke="#334155" stroke-width="1.4"/><rect x="340" y="670" width="240" height="80" rx="0" fill="#ffffff" fill-opacity="1" stroke="#b91c1c" stroke-width="1.4"/><rect x="680" y="660" width="620" height="100" rx="0" fill="#ffffff" fill-opacity="1" stroke="#b91c1c" stroke-width="1.4"/><text x="140.0" y="409.9" font-size="12" font-weight="700" fill="#475569" text-anchor="middle">S00 baseline</text><text x="140.0" y="423.4" font-size="10" font-weight="400" fill="#172b3a" text-anchor="middle">12.0 MW for 4 h</text><text x="140.0" y="436.9" font-size="10" font-weight="400" fill="#172b3a" text-anchor="middle">steady state</text><text x="460.0" y="141.7" font-size="12" font-weight="700" fill="#b45309" text-anchor="middle">S01 utility loss</text><text x="460.0" y="155.2" font-size="10" font-weight="400" fill="#172b3a" text-anchor="middle">both 20 kV incomers</text><text x="990.0" y="129.7" font-size="11" font-weight="700" fill="#b45309" text-anchor="middle">next scenarios in this group</text><text x="990.0" y="141.9" font-size="9" font-weight="400" fill="#172b3a" text-anchor="middle">S02 return to utility, S03 generator fails to start</text><text x="990.0" y="154.0" font-size="9" font-weight="400" fill="#172b3a" text-anchor="middle">S04 generator trip, S20 cooling ride-through</text><text x="990.0" y="166.2" font-size="9" font-weight="400" fill="#172b3a" text-anchor="middle">S29 BMS and EPMS lost, S30 black start</text><text x="460.0" y="281.7" font-size="12" font-weight="700" fill="#1d4ed8" text-anchor="middle">S05 UPS module fail</text><text x="460.0" y="295.2" font-size="10" font-weight="400" fill="#172b3a" text-anchor="middle">block A3</text><text x="990.0" y="269.7" font-size="11" font-weight="700" fill="#1d4ed8" text-anchor="middle">next scenarios in this group</text><text x="990.0" y="281.9" font-size="9" font-weight="400" fill="#172b3a" text-anchor="middle">S06 block fail, S07 static bypass, S08 maintenance bypass</text><text x="990.0" y="294.0" font-size="9" font-weight="400" fill="#172b3a" text-anchor="middle">S09 battery autonomy, S10 LV board loss</text><text x="990.0" y="306.2" font-size="9" font-weight="400" fill="#172b3a" text-anchor="middle">S13 and S14 maintenance modes A and B</text><text x="460.0" y="421.7" font-size="12" font-weight="700" fill="#0e7490" text-anchor="middle">S15 CHW pump trip</text><text x="460.0" y="435.2" font-size="10" font-weight="400" fill="#172b3a" text-anchor="middle">P-CHW-02</text><text x="990.0" y="409.7" font-size="11" font-weight="700" fill="#0e7490" text-anchor="middle">next scenarios in this group</text><text x="990.0" y="421.9" font-size="9" font-weight="400" fill="#172b3a" text-anchor="middle">S16 CDU failover, S17 chiller fail</text><text x="990.0" y="434.0" font-size="9" font-weight="400" fill="#172b3a" text-anchor="middle">S18 dry cooler fans, S19 fan wall fail</text><text x="990.0" y="446.2" font-size="9" font-weight="400" fill="#172b3a" text-anchor="middle">S21 leak, S22 TCS low pressure</text><text x="460.0" y="561.6" font-size="12" font-weight="700" fill="#334155" text-anchor="middle">S23 BMS server fail</text><text x="460.0" y="575.1" font-size="10" font-weight="400" fill="#172b3a" text-anchor="middle">primary server off</text><text x="990.0" y="549.7" font-size="11" font-weight="700" fill="#334155" text-anchor="middle">next scenarios in this group</text><text x="990.0" y="561.9" font-size="9" font-weight="400" fill="#172b3a" text-anchor="middle">S24 EPMS server fail</text><text x="990.0" y="574.0" font-size="9" font-weight="400" fill="#172b3a" text-anchor="middle">S25 network ring break</text><text x="990.0" y="586.2" font-size="9" font-weight="400" fill="#172b3a" text-anchor="middle">S26 controller fail</text><text x="460.0" y="701.6" font-size="12" font-weight="700" fill="#b91c1c" text-anchor="middle">S27 fire alarm</text><text x="460.0" y="715.1" font-size="10" font-weight="400" fill="#172b3a" text-anchor="middle">one detector</text><text x="990.0" y="689.7" font-size="11" font-weight="700" fill="#b91c1c" text-anchor="middle">next scenarios in this group</text><text x="990.0" y="701.9" font-size="9" font-weight="400" fill="#172b3a" text-anchor="middle">S28 pre-action release</text><text x="990.0" y="714.0" font-size="9" font-weight="400" fill="#172b3a" text-anchor="middle">S12 EPO (day 5, load banks only)</text><text x="990.0" y="726.2" font-size="9" font-weight="400" fill="#172b3a" text-anchor="middle">S11 MV ring fault</text><text x="40.0" y="840.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">Order on MSC-1: day 1 S00, S21, S22 · day 2 S01, S02, S20, S03, S04 · day 3 S05 to S10, S13, S14 · day 4 S15 to S19, S23 to S26, S29 · day 5 S11, S12, S27, S28, S30 and repeats.</text><text x="24.0" y="30.0" font-size="17" font-weight="700" fill="#172b3a" text-anchor="start">F28-2  Scenario dependency map: which IST scenarios need which earlier scenario to pass</text><text x="24.0" y="48.0" font-size="11" font-weight="400" fill="#5b6b78" text-anchor="start">31 scenarios S00 to S30 · S00 baseline at 12.0 MW for 4 h comes first · five groups: utility and generator, UPS, cooling, controls, fire · a failed head scenario stops only its own group</text><text x="32.0" y="878.6" font-size="10" font-weight="700" fill="#2d6a4f" text-anchor="start">WHAT TO PROVE</text><text x="32.0" y="894.6" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">• S01 utility loss must pass before S02, S03, S04, S20, S29 and S30, because each of them uses the generator plant on load.</text><text x="32.0" y="909.6" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">• S27 single-detector alarm must pass before S28 pre-action release; S12 EPO is run last on day 5 with load banks only.</text><text x="24.0" y="944.6" font-size="10" font-weight="700" fill="#5b6b78" text-anchor="start">LEGEND</text><line x1="24" y1="966.64" x2="50" y2="966.64" stroke="#475569" stroke-width="3"/><text x="56.0" y="970.6" font-size="10" font-weight="400" fill="#172b3a" text-anchor="start">signal / control</text><line x1="151.9671875" y1="966.64" x2="177.9671875" y2="966.64" stroke="#b45309" stroke-width="3"/><text x="184.0" y="970.6" font-size="10" font-weight="400" fill="#172b3a" text-anchor="start">20 kV</text><line x1="234.50156249999998" y1="966.64" x2="260.5015625" y2="966.64" stroke="#1d4ed8" stroke-width="3"/><text x="266.5" y="970.6" font-size="10" font-weight="400" fill="#172b3a" text-anchor="start">415 V</text><line x1="317.60781249999997" y1="966.64" x2="343.60781249999997" y2="966.64" stroke="#0e7490" stroke-width="3"/><text x="349.6" y="970.6" font-size="10" font-weight="400" fill="#172b3a" text-anchor="start">chilled water (FWS)</text><line x1="468.91718749999995" y1="966.64" x2="494.91718749999995" y2="966.64" stroke="#334155" stroke-width="3"/><text x="500.9" y="970.6" font-size="10" font-weight="400" fill="#172b3a" text-anchor="start">data / network</text><line x1="595.7765625" y1="966.64" x2="621.7765625" y2="966.64" stroke="#b91c1c" stroke-width="3"/><text x="627.8" y="970.6" font-size="10" font-weight="400" fill="#172b3a" text-anchor="start">fire water</text><rect x="24" y="984.64" width="1352" height="44" rx="0" fill="#f6f8fa" fill-opacity="1" stroke="#5b6b78" stroke-width="1"/><text x="32.0" y="998.6" font-size="11" font-weight="700" fill="#172b3a" text-anchor="start">F28-2  