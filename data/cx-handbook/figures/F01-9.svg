8"/><rect x="770" y="294.32" width="190" height="24.380000000000003" rx="0" fill="#ffffff" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><rect x="40" y="318.7" width="180" height="24.380000000000003" rx="0" fill="#e9f0f4" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><rect x="220" y="318.7" width="300" height="24.380000000000003" rx="0" fill="#ffffff" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><rect x="520" y="318.7" width="250" height="24.380000000000003" rx="0" fill="#ffffff" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><rect x="770" y="318.7" width="190" height="24.380000000000003" rx="0" fill="#ffffff" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><text x="152.0" y="132.5" font-size="12.5" font-weight="700" fill="#0e7490" text-anchor="middle">1 Flush and clean</text><text x="152.0" y="146.7" font-size="10.5" font-weight="400" fill="#172b3a" text-anchor="middle">BG 29/2021</text><text x="384.0" y="132.5" font-size="12.5" font-weight="700" fill="#0e7490" text-anchor="middle">2 Pressure test</text><text x="384.0" y="146.7" font-size="10.5" font-weight="400" fill="#172b3a" text-anchor="middle">ASME B31.9-2025</text><text x="616.0" y="132.5" font-size="12.5" font-weight="700" fill="#0e7490" text-anchor="middle">3 Chiller FAT</text><text x="616.0" y="146.7" font-size="10.5" font-weight="400" fill="#172b3a" text-anchor="middle">AHRI 550/590</text><text x="848.0" y="132.5" font-size="12.5" font-weight="700" fill="#0e7490" text-anchor="middle">4 Balance (TAB)</text><text x="848.0" y="146.7" font-size="10.5" font-weight="400" fill="#172b3a" text-anchor="middle">NEBB, AABC</text><text x="370.0" y="222.4" font-size="10.5" font-weight="700" fill="#172b3a" text-anchor="middle">Applied value</text><text x="645.0" y="222.4" font-size="10.5" font-weight="700" fill="#172b3a" text-anchor="middle">Record</text><text x="865.0" y="222.4" font-size="10.5" font-weight="700" fill="#172b3a" text-anchor="middle">Releases</text><text x="46.0" y="254.4" font-size="11.5" font-weight="400" fill="#172b3a" text-anchor="start">1 Flush and clean</text><text x="370.0" y="254.4" font-size="11.5" font-weight="700" fill="#172b3a" text-anchor="middle">≥ 1.26 m/s at 150 mm; CDU filter 25 µm</text><text x="645.0" y="246.8" font-size="11.5" font-weight="700" fill="#172b3a" text-anchor="middle">L2 flushing record with water</text><text x="645.0" y="262.0" font-size="11.5" font-weight="700" fill="#172b3a" text-anchor="middle">samples</text><text x="865.0" y="254.4" font-size="11.5" font-weight="700" fill="#172b3a" text-anchor="middle">filling for commissioning</text><text x="46.0" y="286.4" font-size="11.5" font-weight="400" fill="#172b3a" text-anchor="start">2 Pressure test</text><text x="370.0" y="286.4" font-size="11.5" font-weight="700" fill="#172b3a" text-anchor="middle">1.5 × design pressure, hold ≥ 10 min</text><text x="645.0" y="286.4" font-size="11.5" font-weight="700" fill="#172b3a" text-anchor="middle">pressure test certificate</text><text x="865.0" y="286.4" font-size="11.5" font-weight="700" fill="#172b3a" text-anchor="middle">insulation and concealment</text><text x="46.0" y="310.8" font-size="11.5" font-weight="400" fill="#172b3a" text-anchor="start">3 Chiller FAT</text><text x="370.0" y="310.8" font-size="11.5" font-weight="700" fill="#172b3a" text-anchor="middle">capacity and efficiency at rating conditions</text><text x="645.0" y="310.8" font-size="11.5" font-weight="700" fill="#172b3a" text-anchor="middle">FAT report, AHRI tolerance</text><text x="865.0" y="310.8" font-size="11.5" font-weight="700" fill="#172b3a" text-anchor="middle">shipping release</text><text x="46.0" y="335.1" font-size="11.5" font-weight="400" fill="#172b3a" text-anchor="start">4 Balance (TAB)</text><text x="370.0" y="335.1" font-size="11.5" font-weight="700" fill="#172b3a" text-anchor="middle">terminals ±10 %, branches ±5 %, coils ±5 %</text><text x="645.0" y="335.1" font-size="11.5" font-weight="700" fill="#172b3a" text-anchor="middle">certified TAB report</text><text x="865.0" y="335.1" font-size="11.5" font-weight="700" fill="#172b3a" text-anchor="middle">L4 functional tests</text><text x="24.0" y="30.0" font-size="17" font-weight="700" fill="#172b3a" text-anchor="start">F01-9  Mechanical standards in the order the work is done</text><text x="24.0" y="48.0" font-size="11" font-weight="400" fill="#5b6b78" text-anchor="start">flush to BSRIA BG 29/2021 (1.26 m/s at 150 mm) · pressure test to ASME B31.9-2025 (1.5 × design, 10 min) · chiller FAT to AHRI 550/590 · TAB to NEBB or AABC</text><text x="32.0" y="379.1" font-size="10" font-weight="700" fill="#2d6a4f" text-anchor="start">WHAT TO PROVE</text><text x="32.0" y="395.1" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">• A loop is filled for commissioning only after the BG 29 flushing record and the CDU OEM particle limit are both met.</text><text x="32.0" y="410.1" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">• The CxM witnesses a sample of the TAB readings; water flow tolerance is ±10 % at terminals and ±5 % at main branches (CIBSE Code W).</text><text x="24.0" y="445.1" font-size="10" font-weight="700" fill="#5b6b78" text-anchor="start">LEGEND</text><line x1="24" y1="467.08000000000004" x2="50" y2="467.08000000000004" stroke="#0e7490" stroke-width="3"/><text x="56.0" y="471.1" font-size="10" font-weight="400" fill="#172b3a" text-anchor="start">chilled water (FWS)</text><rect x="24" y="485.08000000000004" width="952" height="44" rx="0" fill="#f6f8fa" fill-opacity="1" stroke="#5b6b78" stroke-width="1"/><text x="32.0" y="499.1" font-size="11" font-weight="700" fill="#172b3a" text-anchor="start">F01-9  ·  Mechanical standards in the order the work is done</text><text x="968.0" y="499.1" font-size="10" font-weight="400" fill="#5b6b78" text-anchor="end">Chapter 01 · §01.6.2</text><text x="32.0" y="512.1" font-size="9" font-weight="400" fill="#5b6b78" text-anchor="start">Data Centre Commissioning Field Manual R01 EN · October 2026 · educational reference, not to scale · project and OEM documents govern</text><text x="32.0" y="524.1" font-size="9" font-weight="400" fill="#5b6b78" text-anchor="start">Symbols: QElectroTech EN 60617 and P&amp;ID collections, CC-BY 3.0, native geometry · instrument bubbles per ISA 5.1 · states per IEC 60617 / IEEE C37.2 practice</text></svg>