 2026</text><text x="1100.0" y="291.0" font-size="10" font-weight="400" fill="#172b3a" text-anchor="start">to 9 Sep 2028</text><text x="694.0" y="341.0" font-size="10" font-weight="400" fill="#172b3a" text-anchor="start">from TOC 15 Mar 2027</text><text x="276.1" y="391.0" font-size="10" font-weight="400" fill="#b91c1c" text-anchor="start">delivery</text><text x="696.0" y="391.0" font-size="10" font-weight="400" fill="#b91c1c" text-anchor="start">TOC</text><text x="24.0" y="30.0" font-size="17" font-weight="700" fill="#172b3a" text-anchor="start">F12-5  Warranty dates against the DNP for the UPS systems of B2-DH3: gap check and extension</text><text x="24.0" y="48.0" font-size="11" font-weight="400" fill="#5b6b78" text-anchor="start">delivery 10 Mar 2026 · OEM warranty 24 months from delivery, ends 9 Mar 2028 · TOC forecast 15 Mar 2027 · DNP 12 months ends 14 Mar 2028 · 6-month extension moves OEM end to 9 Sep 2028</text><text x="32.0" y="468.0" font-size="10" font-weight="700" fill="#2d6a4f" text-anchor="start">WHAT TO PROVE</text><text x="32.0" y="484.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">• OEM end 9 Mar 2028 is earlier than DNP end 14 Mar 2028 by 5 days; with the 6-month extension the OEM end is 9 Sep 2028, 5 months and 26 days after the DNP ends.</text><text x="32.0" y="499.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">• The warranty register records both start dates for each UPS module and the CMMS alert is set 90 days before 9 Sep 2028.</text><rect x="24" y="532" width="1352" height="44" rx="0" fill="#f6f8fa" fill-opacity="1" stroke="#5b6b78" stroke-width="1"/><text x="32.0" y="546.0" font-size="11" font-weight="700" fill="#172b3a" text-anchor="start">F12-5  ·  Warranty dates against the DNP for the UPS systems of B2-DH3: gap check and extension</text><text x="1368.0" y="546.0" font-size="10" font-weight="400" fill="#5b6b78" text-anchor="end">Chapter 12 · §12.10</text><text x="32.0" y="559.0" font-size=