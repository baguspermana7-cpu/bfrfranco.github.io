="165.0" height="22.0" rx="0" fill="#ffffff" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><rect x="205.0" y="620.0" width="453.75000000000006" height="22.0" rx="0" fill="#ffffff" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><rect x="658.75" y="620.0" width="701.25" height="22.0" rx="0" fill="#ffffff" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><text x="40.0" y="112.0" font-size="13" font-weight="700" fill="#172b3a" text-anchor="start">Commissioning phase</text><text x="155.0" y="150.8" font-size="11.5" font-weight="700" fill="#475569" text-anchor="middle">G1 Mechanical completion</text><text x="155.0" y="163.6" font-size="9.5" font-weight="400" fill="#172b3a" text-anchor="middle">L2 signed</text><text x="427.0" y="150.8" font-size="11.5" font-weight="700" fill="#475569" text-anchor="middle">G2 Functional completion</text><text x="427.0" y="163.6" font-size="9.5" font-weight="400" fill="#172b3a" text-anchor="middle">L3, L4 passed</text><text x="699.0" y="150.8" font-size="11.5" font-weight="700" fill="#475569" text-anchor="middle">G3 Package submitted</text><text x="699.0" y="163.6" font-size="9.5" font-weight="400" fill="#172b3a" text-anchor="middle">TOC − 30 days</text><text x="971.0" y="150.8" font-size="11.5" font-weight="700" fill="#475569" text-anchor="middle">G4 Package reviewed</text><text x="971.0" y="163.6" font-size="9.5" font-weight="400" fill="#172b3a" text-anchor="middle">10 working days</text><text x="1243.0" y="150.8" font-size="11.5" font-weight="700" fill="#475569" text-anchor="middle">G5 IST passed</text><text x="1243.0" y="163.6" font-size="9.5" font-weight="400" fill="#172b3a" text-anchor="middle">5 days per hall</text><text x="40.0" y="252.0" font-size="13" font-weight="700" fill="#172b3a" text-anchor="start">Handover</text><text x="190.0" y="290.8" font-size="11.5" font-weight="700" fill="#334155" text-anchor="middle">G6 Readiness review</text><text x="190.0" y="303.6" font-size="9.5" font-weight="400" fill="#172b3a" text-anchor="middle">TOC − 5 working days</text><text x="550.0" y="290.8" font-size="11.5" font-weight="700" fill="#334155" text-anchor="middle">G7 Taking-over</text><text x="550.0" y="303.6" font-size="9.5" font-weight="400" fill="#172b3a" text-anchor="middle">TOC or Completion</text><text x="910.0" y="290.8" font-size="11.5" font-weight="700" fill="#334155" text-anchor="middle">G8 Ready for service</text><text x="910.0" y="303.6" font-size="9.5" font-weight="400" fill="#172b3a" text-anchor="middle">operations acceptance</text><text x="40.0" y="392.0" font-size="13" font-weight="700" fill="#172b3a" text-anchor="start">After taking-over</text><text x="190.0" y="430.8" font-size="11.5" font-weight="700" fill="#1d4ed8" text-anchor="middle">G9 Defects period</text><text x="190.0" y="443.6" font-size="9.5" font-weight="400" fill="#172b3a" text-anchor="middle">DNP, often 12 months</text><text x="550.0" y="430.8" font-size="11.5" font-weight="700" fill="#1d4ed8" text-anchor="middle">G10 Performance Certificate</text><text x="550.0" y="443.6" font-size="9.5" font-weight="400" fill="#172b3a" text-anchor="middle">28 days after DNP</text><text x="910.0" y="430.8" font-size="11.5" font-weight="700" fill="#1d4ed8" text-anchor="middle">G11 Final account</text><text x="910.0" y="443.6" font-size="9.5" font-weight="400" fill="#172b3a" text-anchor="middle">retention released</text><text x="45.0" y="525.0" font-size="11" font-weight="700" fill="#172b3a" text-anchor="start">Gate</text><text x="210.0" y="525.0" font-size="11" font-weight="700" fill="#172b3a" text-anchor="start">Owner</text><text x="663.8" y="525.0" font-size="11" font-weight="700" fill="#172b3a" text-anchor="start">Record</text><text x="45.0" y="547.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">G3, G4</text><text x="210.0" y="547.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">contractor; CxM and operations</text><text x="663.8" y="547.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">transmittal; consolidated review comment sheet</text><text x="45.0" y="569.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">G6</text><text x="210.0" y="569.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">owner project director</text><text x="663.8" y="569.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">readiness review minutes and outstanding works list</text><text x="45.0" y="591.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">G7</text><text x="210.0" y="591.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">Engineer (FIDIC) or Project Manager (NEC4)</text><text x="663.8" y="591.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">Taking-Over Certificate or Completion certificate</text><text x="45.0" y="613.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">G8</text><text x="210.0" y="613.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">DCOps lead</text><text x="663.8" y="613.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">RFS certificate</text><text x="45.0" y="635.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">G10</text><text x="210.0" y="635.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">Engineer or Supervisor</text><text x="663.8" y="635.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">Performance Certificate or Defects Certificate</text><text x="24.0" y="30.0" font-size="17" font-weight="700" fill="#172b3a" text-anchor="start">F12-1  Handover sequence for one data hall: gates G1 to G11 from mechanical completion to the final account</text><text x="24.0" y="48.0" font-size="10" font-weight="400" fill="#5b6b78" text-anchor="start">turnover package submitted 30 days before TOC · review 10 working days · readiness review 5 working days before TOC · TOC within 28 days of application (FIDIC practice) · DNP often 12 months · Performance Certificate within 28 days after</text><text x="24.0" y="61.0" font-size="10" font-weight="400" fill="#5b6b78" text-anchor="start">the last DNP</text><text x="32.0" y="678.0" font-size="10" font-weight="700" fill="#2d6a4f" text-anchor="start">WHAT TO PROVE</text><text x="32.0" y="694.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">• Each gate has an owner and a record: a gate with no signed record is open, and an open G6 item blocks the TOC application.</text><text x="32.0" y="709.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">• The DNP of a hall starts at its own TOC only when the contract names the hall as a Section.</text><text x="24.0" y="744.0" font-size="10" font-weight="700" fill="#5b6b78" text-anchor="start">LEGEND</text><line x1="24" y1="766.0" x2="50" y2="766.0" stroke="#475569" stroke-width="3"/><text x="56.0" y="770.0" font-size="10" font-weight="400" fill="#172b3a" text-anchor="start">signal / control</text><line x1="151.9671875" y1="766.0" x2="177.9671875" y2="766.0" stroke="#334155" stroke-width="3"/><text x="184.0" y="770.0" font-size="10" font-weight="400" fill="#172b3a" text-anchor="start">data / network</text><line x1="278.8265625" y1="766.0" x2="304.8265625" y2="766.0" stroke="#1d4ed8" stroke-width="3"/><text x="310.8" y="770.0" font-size="10" font-weight="400" fill="#172b3a" text-anchor="start">415 V</text><rect x="24" y="784.0" width="1352" height="44" rx="0" fill="#f6f8fa" fill-opacity="1" stroke="#5b6b78" stroke-width="1"/><text x="32.0" y="798.0" font-size="11" font-weight="700" fill="#172b3a" text-anchor="start">F12-1  ·  Handover sequence for one data hall: gates G1 to G11 from mechanical completion to the final account</text><text x="1368.0" y="798.0" font-size="10" font-weight="400" fill="#5b6b78" text-anchor="end">Chapter 12 · §12.2</text><text x="32.0" y="811.0" font-size="9" font-weight="400" fill="#5b6b78" text-anchor="start">Data Centre Commissioning Field Manual R01 EN · October 2026 · educational reference, not to scale · project and OEM documents govern</text><text x="32.0" y="823.0" font-size="9" font-weight="400" fill="#5b6b78" text-anchor="start">Symbols: QElectroTech EN 60617 and P&amp;ID collections, CC-BY 3.0, native geometry · instrument bubbles per ISA 5.1 · states per IEC 60617 / IEEE C37.2 practice</text></svg>