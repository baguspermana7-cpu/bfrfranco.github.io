" font-size="10" font-weight="400" fill="#172b3a" text-anchor="middle">L1 to L5</text><text x="672.0" y="124.7" font-size="12" font-weight="700" fill="#334155" text-anchor="middle">4 Authorise AIM</text><text x="672.0" y="138.2" font-size="10" font-weight="400" fill="#172b3a" text-anchor="middle">S7, owner</text><text x="854.0" y="124.7" font-size="12" font-weight="700" fill="#334155" text-anchor="middle">5 Transfer</text><text x="854.0" y="138.2" font-size="10" font-weight="400" fill="#172b3a" text-anchor="middle">for record</text><text x="140.0" y="544.0" font-size="10" font-weight="400" fill="#5b6b78" text-anchor="middle">0</text><text x="393.3" y="544.0" font-size="10" font-weight="400" fill="#5b6b78" text-anchor="middle">1</text><text x="646.7" y="544.0" font-size="10" font-weight="400" fill="#5b6b78" text-anchor="middle">2</text><text x="900.0" y="544.0" font-size="10" font-weight="400" fill="#5b6b78" text-anchor="middle">3</text><text x="134.0" y="534.0" font-size="10" font-weight="400" fill="#5b6b78" text-anchor="end">1</text><text x="134.0" y="454.0" font-size="10" font-weight="400" fill="#5b6b78" text-anchor="end">10</text><text x="134.0" y="374.0" font-size="10" font-weight="400" fill="#5b6b78" text-anchor="end">100</text><text x="134.0" y="294.0" font-size="10" font-weight="400" fill="#5b6b78" text-anchor="end">1000</text><text x="134.0" y="214.0" font-size="10" font-weight="400" fill="#5b6b78" text-anchor="end">10000</text><text x="520.0" y="560.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="middle">container state (1 CR or A code, 2 P revision under review, 3 missing)</text><text transform="translate(96 370.0) rotate(-90)" font-size="11" text-anchor="middle" fill="#172b3a">containers (count, log scale)</text><text x="168.0" y="578.0" font-size="10" font-weight="400" fill="#172b3a" text-anchor="start">containers at the completeness check (1,940 in the handover list)</text><text x="273.7" y="261.7" font-size="10" font-weight="400" fill="#8a5a00" text-anchor="start">1,902</text><text x="527.0" y="404.7" font-size="10" font-weight="400" fill="#8a5a00" text-anchor="start">31</text><text x="780.3" y="456.4" font-size="10" font-weight="400" fill="#8a5a00" text-anchor="start">7</text><circle cx="266.7" cy="267.7" r="4" fill="#b7791f"/><circle cx="520.0" cy="410.7" r="4" fill="#b7791f"/><circle cx="773.3" cy="462.4" r="4" fill="#b7791f"/><text x="24.0" y="30.0" font-size="17" font-weight="700" fill="#172b3a" text-anchor="start">F04-7  Handover completeness of the building 2 record set</text><text x="24.0" y="48.0" font-size="10" font-weight="400" fill="#5b6b78" text-anchor="start">1,940 containers with a handover milestone · 1,902 at CR or A code · 31 at P revisions under review · 7 missing · completeness 98.0 % · AIM authorised at 100 % or</text><text x="24.0" y="61.0" font-size="10" font-weight="400" fill="#5b6b78" text-anchor="start">accepted exceptions</text><text x="32.0" y="627.0" font-size="10" font-weight="700" fill="#2d6a4f" text-anchor="start">WHAT TO PROVE</text><text x="32.0" y="643.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">• Completeness is 1,902 ÷ 1,940 × 100 = 98.0 %; the 38 open containers are listed by originator with a due date.</text><text x="32.0" y="658.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">• Each commissioned asset has executed L1 to L4 records and its system has an L5 record before the transfer &quot;for record&quot;.</text><text x="24.0" y="693.0" font-size="10" font-weight="700" fill="#5b6b78" text-anchor="start">LEGEND</text><line x1="24" y1="715" x2="50" y2="715" stroke="#334155" stroke-width="3"/><text x="56.0" y="719.0" font-size="10" font-weight="400" fill="#172b3a" text-anchor="start">data / network</text><rect x="24" y="733" width="952" height="44" rx="0" fill="#f6f8fa" fill-opacity="1" stroke="#5b6b78" stroke-width="1"/><text x="32.0" y="747.0" font-size="11" font-weight="700" fill="#172b3a" text-anchor="start">F04-7  ·  Handover completeness of the building 2 record set</text><text x="968.0" y="747.0" font-size="10" font-weight="400" fill="#5b6b78" text-anchor="end">Chapter 04 · §04.13.3</text><text x="32.0" y="760.0" font-size="9" font-weight="400" fill="#5b6b78" text-anchor="start">Data Centre Commissioning Field Manual R01 EN · October 2026 · educational reference, not to scale · project and OEM documents govern</text><text x="32.0" y="772.0" font-size="9" font-weight="400" fill="#5b6b78" text-anchor="start">Symbols: QElectroTech EN 60617 and P&amp;ID collections, CC-BY 3.0, native geometry · instrument bubbles per ISA 5.1 · states per IEC 60617 / IEEE C37.2 practice</text></svg>