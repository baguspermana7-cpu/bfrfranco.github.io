O, method B</text><text x="345.0" y="625.2" font-size="11.5" font-weight="700" fill="#172b3a" text-anchor="middle">B</text><text x="480.0" y="625.2" font-size="11.5" font-weight="700" fill="#172b3a" text-anchor="middle">Type B</text><text x="640.0" y="625.2" font-size="11.5" font-weight="700" fill="#172b3a" text-anchor="middle">Type B</text><text x="805.0" y="625.2" font-size="11.5" font-weight="700" fill="#172b3a" text-anchor="middle">A-to-B</text><text x="975.0" y="625.2" font-size="11.5" font-weight="700" fill="#172b3a" text-anchor="middle">A-to-B</text><text x="1210.0" y="625.2" font-size="11.5" font-weight="700" fill="#172b3a" text-anchor="middle">position 12</text><text x="46.0" y="649.6" font-size="11.5" font-weight="400" fill="#172b3a" text-anchor="start">12-fibre MPO, method C</text><text x="345.0" y="649.6" font-size="11.5" font-weight="700" fill="#172b3a" text-anchor="middle">C</text><text x="480.0" y="649.6" font-size="11.5" font-weight="700" fill="#172b3a" text-anchor="middle">Type C</text><text x="640.0" y="649.6" font-size="11.5" font-weight="700" fill="#172b3a" text-anchor="middle">Type A</text><text x="805.0" y="649.6" font-size="11.5" font-weight="700" fill="#172b3a" text-anchor="middle">A-to-B</text><text x="975.0" y="649.6" font-size="11.5" font-weight="700" fill="#172b3a" text-anchor="middle">A-to-B</text><text x="1210.0" y="649.6" font-size="11.5" font-weight="700" fill="#172b3a" text-anchor="middle">position 2</text><text x="24.0" y="30.0" font-size="17" font-weight="700" fill="#172b3a" text-anchor="start">F26-4  Polarity of one duplex channel through an MPO trunk: methods A, B and C of ANSI/TIA-568.3-D</text><text x="24.0" y="48.0" font-size="10" font-weight="400" fill="#5b6b78" text-anchor="start">transmit at end 1 must reach receive at end 2 · Method A: Type A trunk (key up to key down, 1 to 1) with one A-to-B and one A-to-A cord · Method B: Type B trunk (key up to key up, 1 to 12) with A-to-B cords · Method C: Type C trunk (pairs</text><text x="24.0" y="61.0" font-size="10" font-weight="400" fill="#5b6b78" text-anchor="start">flipped) with A-to-B cords</text><text x="32.0" y="693.5" font-size="10" font-weight="700" fill="#2d6a4f" text-anchor="start">WHAT TO PROVE</text><text x="32.0" y="709.5" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">• In every method the signal crosses from Tx to Rx exactly once; a second A-to-B cord in Method A or a Type A trunk in a Method B design gives Tx to Tx and no link.</text><text x="32.0" y="724.5" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">• Method B uses key-up to key-up adapters, which do not support angle-polished single-mode MPO end faces: Method B is a multimode choice in practice.</text><text x="24.0" y="759.5" font-size="10" font-weight="700" fill="#5b6b78" text-anchor="start">LEGEND</text><line x1="24" y1="781.52" x2="50" y2="781.52" stroke="#334155" stroke-width="3"/><text x="56.0" y="785.5" font-size="10" font-weight="400" fill="#172b3a" text-anchor="start">data / network</text><line x1="150.859375" y1="781.52" x2="176.859375" y2="781.52" stroke="#475569" stroke-width="3"/><text x="182.9" y="785.5" font-size="10" font-weight="400" fill="#172b3a" text-anchor="start">signal / control</text><line x1="278.8265625" y1="781.52" x2="304.8265625" y2="781.52" stroke="#b91c1c" stroke-width="3"/><text x="310.8" y="785.5" font-size="10" font-weight="400" fill="#172b3a" text-anchor="start">trip / protection</text><rect x="24" y="799.52" width="1352" height="44" rx="0" fill="#f6f8fa" fill-opacity="1" stroke="#5b6b78" stroke-width="1"/><text x="32.0" y="813.5" font-size="11" font-weight="700" fill="#172b3a" text-anchor="start">F26-4  ·  Polarity of one duplex channel through an MPO trunk: methods A, B and C of ANSI/TIA-568.3-D</text><text x="1368.0" y="813.5" font-size="10" font-weight="400" fill="#5b6b78" text-anchor="end">Chapter 26 · §26.6</text><text x="32.0" y="826.5" font-size="9" font-weight="400" fill="#5b6b78" text-anchor="start">Data Centre Commissioning Field Manual R01 EN · October 2026 · educational reference, not to scale · project and OEM documents govern</text><text x="32.0" y="838.5" font-size="9" font-weight="400" fill="#5b6b78" text-anchor="start">Symbols: QElectroTech EN 60617 and P&amp;ID collections, CC-BY 3.0, native geometry · instrument bubbles per ISA 5.1 · states per IEC 60617 / IEEE C37.2 practice</text></svg>