x="0" fill="#ffffff" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><text x="700.0" y="122.0" font-size="12" font-weight="700" fill="#b45309" text-anchor="middle">B1-MVS-01 20 kV bus (section energised)</text><text x="168.6" y="177.8" font-size="11" font-weight="700" fill="#172b3a" text-anchor="start">P03</text><text x="1226.6" y="177.8" font-size="11" font-weight="700" fill="#172b3a" text-anchor="end">P07</text><text x="380.0" y="291.8" font-size="11.5" font-weight="700" fill="#b45309" text-anchor="middle">RMU-01</text><text x="380.0" y="304.6" font-size="9.5" font-weight="400" fill="#172b3a" text-anchor="middle">S1  S2  T1</text><text x="600.0" y="291.8" font-size="11.5" font-weight="700" fill="#b45309" text-anchor="middle">RMU-02</text><text x="600.0" y="304.6" font-size="9.5" font-weight="400" fill="#172b3a" text-anchor="middle">S1  S2  T1</text><text x="820.0" y="291.8" font-size="11.5" font-weight="700" fill="#b45309" text-anchor="middle">RMU-03</text><text x="820.0" y="304.6" font-size="9.5" font-weight="400" fill="#172b3a" text-anchor="middle">S1  S2  T1</text><text x="1040.0" y="291.8" font-size="11.5" font-weight="700" fill="#b45309" text-anchor="middle">RMU-04</text><text x="1040.0" y="304.6" font-size="9.5" font-weight="400" fill="#172b3a" text-anchor="middle">S1  S2  T1</text><text x="710.0" y="254.0" font-size="11" font-weight="700" fill="#b91c1c" text-anchor="middle">normal open point</text><text x="710.0" y="350.0" font-size="10.5" font-weight="400" fill="#5b6b78" text-anchor="middle">RMU-02 S2 open, padlocked</text><text x="380.0" y="415.0" font-size="10.5" font-weight="700" fill="#1d4ed8" text-anchor="middle">T1 2.5 MVA</text><text x="380.0" y="426.5" font-size="8.5" font-weight="400" fill="#172b3a" text-anchor="middle">tee-off open</text><text x="600.0" y="415.0" font-size="10.5" font-weight="700" fill="#1d4ed8" text-anchor="middle">T2 2.5 MVA</text><text x="600.0" y="426.5" font-size="8.5" font-weight="400" fill="#172b3a" text-anchor="middle">tee-off open</text><text x="820.0" y="415.0" font-size="10.5" font-weight="700" fill="#1d4ed8" text-anchor="middle">T3 2.5 MVA</text><text x="820.0" y="426.5" font-size="8.5" font-weight="400" fill="#172b3a" text-anchor="middle">tee-off open</text><text x="1040.0" y="415.0" font-size="10.5" font-weight="700" fill="#1d4ed8" text-anchor="middle">T4 2.5 MVA</text><text x="1040.0" y="426.5" font-size="8.5" font-weight="400" fill="#172b3a" text-anchor="middle">tee-off open</text><text x="45.0" y="505.0" font-size="11" font-weight="700" fill="#172b3a" text-anchor="start">Block of steps</text><text x="338.3" y="505.0" font-size="11" font-weight="700" fill="#172b3a" text-anchor="start">Steps</text><text x="455.7" y="505.0" font-size="11" font-weight="700" fill="#172b3a" text-anchor="start">Expected result</text><text x="1042.3" y="505.0" font-size="11" font-weight="700" fill="#172b3a" text-anchor="start">Hold point</text><text x="45.0" y="527.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">Remove earths and check states</text><text x="338.3" y="527.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">1 to 9</text><text x="455.7" y="527.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">all ring earth switches O, tee-offs O and locked, relays healthy</text><text x="1042.3" y="527.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">step 10: permission for leg A</text><text x="45.0" y="549.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">Energise leg A from P03</text><text x="338.3" y="549.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">11 to 15</text><text x="455.7" y="549.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">VDS lamps on RMU-01 and RMU-02 S1 side; RMU-02 S2 side dark</text><text x="1042.3" y="549.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">step 16: permission for leg B</text><text x="45.0" y="571.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">Energise leg B from P07</text><text x="338.3" y="571.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">17 to 20</text><text x="455.7" y="571.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">VDS lamps on RMU-04, RMU-03, RMU-02 S2 side; in phase across S2</text><text x="1042.3" y="571.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">step 21: ring closure decision</text><text x="45.0" y="593.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">Confirm and record</text><text x="338.3" y="593.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">22 to 24</text><text x="455.7" y="593.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">no alarms, EPMS mimic equals network status board</text><text x="1042.3" y="593.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">none</text><rect x="132.99484375" y="167.0" width="14.60515625" height="14" rx="3" fill="#2d6a4f" fill-opacity="1" stroke="#2d6a4f" stroke-width="1.4"/><text x="140.3" y="177.5" font-size="9" font-weight="700" fill="#ffffff" text-anchor="middle">C</text><rect x="1247.6" y="167.0" width="14.60515625" height="14" rx="3" fill="#2d6a4f" fill-opacity="1" stroke="#2d6a4f" stroke-width="1.4"/><text x="1254.9" y="177.5" font-size="9" font-weight="700" fill="#ffffff" text-anchor="middle">C</text><text x="24.0" y="30.0" font-size="17" font-weight="700" fill="#172b3a" text-anchor="start">F10-3  Switching programme SP-B1-HV-007: first energisation of 20 kV ring R1 in building B1</text><text x="24.0" y="48.0" font-size="11" font-weight="400" fill="#5b6b78" text-anchor="start">B1-MVS-01 panels P03 and P07 · RMU-01 to RMU-04 · normal open point RMU-02 S2 · tee-offs T1 open and locked · 24 steps, 3 hold points · phasing check at step 20 · charging current about 1 A</text><text x="32.0" y="636.0" font-size="10" font-weight="700" fill="#2d6a4f" text-anchor="start">WHAT TO PROVE</text><text x="32.0" y="652.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">• At step 15 the S2 side of RMU-02 must show no voltage; at step 19 it must show voltage from leg B. Any other result stops the programme.</text><text x="32.0" y="667.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">• The ammeter on P03 after step 11 shows cable charging current near 1 A; tens of amperes means a fault or a closed tee-off.</text><text x="24.0" y="702.0" font-size="10" font-weight="700" fill="#5b6b78" text-anchor="start">LEGEND</text><g transform="translate(38.9 723.0) scale(0.3)"><line x1="0" y1="-20" x2="0" y2="-40" stroke="#172b3a" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/><line x1="0" y1="0" x2="0" y2="20" stroke="#172b3a" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/><line x1="0" y1="0" x2="-8" y2="-23" stroke="#172b3a" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/><line x1="-2" y1="-22" x2="2" y2="-18" stroke="#172b3a" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/><line x1="2" y1="-22" x2="-2" y2="-18" stroke="#172b3a" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/></g><text x="58.0" y="724.0" font-size="10" font-weight="400" fill="#172b3a" text-anchor="start">Circuit breaker</text><line x1="24" y1="750.0" x2="50" y2="750.0" stroke="#b45309" stroke-width="3"/><text x="56.0" y="754.0" font-size="10" font-weight="400" fill="#172b3a" text-anchor="start">20 kV</text><line x1="106.534375" y1="750.0" x2="132.534375" y2="750.0" stroke="#1d4ed8" stroke-width="3"/><text x="138.5" y="754.0" font-size="10" font-weight="400" fill="#172b3a" text-anchor="start">415 V</text><rect x="24" y="764.0" width="14.60515625" height="14" rx="3" fill="#2d6a4f" fill-opacity="1" stroke="#2d6a4f" stroke-width="1.4"/><text x="31.3" y="774.5" font-size="9" font-weight="700" fill="#ffffff" text-anchor="middle">C</text><text x="44.6" y="775.0" font-size="10" font-weight="400" fill="#172b3a" text-anchor="start">closed / in service</text><rect x="24" y="790.0" width="1352" height="44" rx="0" fill="#f6f8fa" fill-opacity="1" stroke="#5b6b78" stroke-width="1"/><text x="32.0" y="804.0" font-size="11" font-weight="700" fill="#172b3a" text-anchor="start">F10-3  ·  Switching programme SP-B1-HV-007: first energisation of 20 kV ring R1 in building B1</text><text x="1368.0" y="804.0" font-size="10" font-weight="400" fill="#5b6b78" text-anchor="end">Chapter 10 · §10.4</text><text x="32.0" y="817.0" font-size="9" font-weight="400" fill="#5b6b78" text-anchor="start">Data Centre Commissioning Field Manual R01 EN · October 2026 · educational reference, not to scale · project and OEM documents govern</text><text x="32.0" y="829.0" font-size="9" font-weight="400" fill="#5b6b78" text-anchor="start">Symbols: QElectroTech EN 60617 and P&amp;ID collections, CC-BY 3.0, native geometry · instrument bubbles per ISA 5.1 · states per IEC 60617 / IEEE C37.2 practice</text></svg>