t="400" fill="#172b3a" text-anchor="middle">inside 18 to 27 °C</text><text x="750.0" y="210.3" font-size="11.5" font-weight="700" fill="#c2410c" text-anchor="middle">Rack 120 kW</text><text x="750.0" y="223.2" font-size="9.5" font-weight="400" fill="#172b3a" text-anchor="middle">24 kW to air, 1.685 m³/s</text><text x="750.0" y="236.0" font-size="9.5" font-weight="400" fill="#172b3a" text-anchor="middle">96 kW to cold plates</text><text x="1050.0" y="210.3" font-size="11.5" font-weight="700" fill="#0ea5e9" text-anchor="middle">Hot aisle containment</text><text x="1050.0" y="223.2" font-size="9.5" font-weight="400" fill="#172b3a" text-anchor="middle">35.8 °C at 11.8 K rise</text><text x="1050.0" y="236.0" font-size="9.5" font-weight="400" fill="#172b3a" text-anchor="middle">Δp set point +2 Pa</text><text x="600.0" y="120.0" font-size="11" font-weight="400" fill="#5b6b78" text-anchor="middle">ceiling return plenum 168.5 m³/s per hall</text><text x="155.0" y="372.5" font-size="11.5" font-weight="700" fill="#0e7490" text-anchor="middle">Air-hall CHW plant</text><text x="155.0" y="385.4" font-size="9.5" font-weight="400" fill="#172b3a" text-anchor="middle">(chapter 18 procedures,</text><text x="155.0" y="398.2" font-size="9.5" font-weight="400" fill="#172b3a" text-anchor="middle">5 × 2.5 MW per 03.9.3)</text><text x="155.0" y="411.0" font-size="9.5" font-weight="400" fill="#172b3a" text-anchor="middle">18 °C supply, 24 °C return</text><text x="155.0" y="423.8" font-size="9.5" font-weight="400" fill="#172b3a" text-anchor="middle">7.38 L/s per fan wall</text><text x="750.0" y="390.4" font-size="11.5" font-weight="700" fill="#0f766e" text-anchor="middle">Row manifold, zone Z2</text><text x="750.0" y="403.2" font-size="9.5" font-weight="400" fill="#172b3a" text-anchor="middle">25 racks, 58.0 L/s</text><text x="750.0" y="416.0" font-size="9.5" font-weight="400" fill="#172b3a" text-anchor="middle">TCS 45 °C supply, 55 °C return</text><text x="750.0" y="550.4" font-size="11.5" font-weight="700" fill="#0f766e" text-anchor="middle">CDU-01 to CDU-04, 1 MW each</text><text x="750.0" y="563.2" font-size="9.5" font-weight="400" fill="#172b3a" text-anchor="middle">normal 600 kW, 14.5 L/s each</text><text x="750.0" y="576.0" font-size="9.5" font-weight="400" fill="#172b3a" text-anchor="middle">one stopped: 800 kW, 19.33 L/s</text><text x="1050.0" y="550.4" font-size="11.5" font-weight="700" fill="#65a30d" text-anchor="middle">FWS to dry coolers</text><text x="1050.0" y="563.2" font-size="9.5" font-weight="400" fill="#172b3a" text-anchor="middle">35 °C supply, 45 °C return</text><text x="1050.0" y="576.0" font-size="9.5" font-weight="400" fill="#172b3a" text-anchor="middle">ATD 10 K (OCP rates at 5 K)</text><text x="45.0" y="675.0" font-size="11" font-weight="700" fill="#172b3a" text-anchor="start">Quantity</text><text x="305.3" y="675.0" font-size="11" font-weight="700" fill="#172b3a" text-anchor="start">Per rack</text><text x="509.8" y="675.0" font-size="11" font-weight="700" fill="#172b3a" text-anchor="start">Per zone (25 racks)</text><text x="770.1" y="675.0" font-size="11" font-weight="700" fill="#172b3a" text-anchor="start">Per hall (100 racks)</text><text x="1030.4" y="675.0" font-size="11" font-weight="700" fill="#172b3a" text-anchor="start">Formula</text><text x="45.0" y="697.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">Heat to liquid</text><text x="305.3" y="697.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">96 kW</text><text x="509.8" y="697.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">2.4 MW</text><text x="770.1" y="697.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">9.6 MW</text><text x="1030.4" y="697.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">120 kW × 0.8</text><text x="45.0" y="719.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">Heat to air</text><text x="305.3" y="719.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">24 kW</text><text x="509.8" y="719.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">0.6 MW</text><text x="770.1" y="719.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">2.4 MW</text><text x="1030.4" y="719.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">120 kW × 0.2</text><text x="45.0" y="741.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">TCS flow</text><text x="305.3" y="741.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">139.2 L/min</text><text x="509.8" y="741.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">58.0 L/s</text><text x="770.1" y="741.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">232 L/s</text><text x="1030.4" y="741.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">kW / (4.138 × 10 K)</text><text x="45.0" y="763.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">Airflow</text><text x="305.3" y="763.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">1.685 m³/s</text><text x="509.8" y="763.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">42.1 m³/s</text><text x="770.1" y="763.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">168.5 m³/s</text><text x="1030.4" y="763.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">kW / (1.206 × 11.8 K)</text><text x="24.0" y="30.0" font-size="17" font-weight="700" fill="#172b3a" text-anchor="start">F19-1  Heat paths of one MSC-1 hall: air through fan walls and liquid through CDUs</text><text x="24.0" y="48.0" font-size="11" font-weight="400" fill="#5b6b78" text-anchor="start">100 racks of 120 kW · capture ratio 0.8 · 96 kW per rack to the TCS at 45/55 °C, 139.2 L/min · 24 kW per rack to air, 1.685 m³/s at 11.8 K · 13 fan walls on CHW 18/24 °C · 16 CDUs of 1 MW on FWS 35/45 °C</text><text x="32.0" y="806.0" font-size="10" font-weight="700" fill="#2d6a4f" text-anchor="start">WHAT TO PROVE</text><text x="32.0" y="822.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">• Hall air load 2,400 kW at 168.48 m³/s gives 11.8 K across the racks; the cold-side set point 24 °C gives a hot aisle of 35.8 °C.</text><text x="32.0" y="837.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">• Hall liquid load 9,600 kW at 10 K needs 232 L/s of TCS flow; each zone of 25 racks takes 58.0 L/s from four 1 MW CDUs (N+1).</text><text x="24.0" y="872.0" font-size="10" font-weight="700" fill="#5b6b78" text-anchor="start">LEGEND</text><line x1="24" y1="894.0" x2="50" y2="894.0" stroke="#0ea5e9" stroke-width="3"/><text x="56.0" y="898.0" font-size="10" font-weight="400" fill="#172b3a" text-anchor="start">air</text><line x1="91.0171875" y1="894.0" x2="117.0171875" y2="894.0" stroke="#c2410c" stroke-width="3"/><text x="123.0" y="898.0" font-size="10" font-weight="400" fill="#172b3a" text-anchor="start">heat flow</text><line x1="191.3296875" y1="894.0" x2="217.3296875" y2="894.0" stroke="#0e7490" stroke-width="3"/><text x="223.3" y="898.0" font-size="10" font-weight="400" fill="#172b3a" text-anchor="start">chilled water (FWS)</text><line x1="342.6390625" y1="894.0" x2="368.6390625" y2="894.0" stroke="#0f766e" stroke-width="3"/><text x="374.6" y="898.0" font-size="10" font-weight="400" fill="#172b3a" text-anchor="start">coolant (TCS)</text><line x1="463.3734375" y1="894.0" x2="489.3734375" y2="894.0" stroke="#65a30d" stroke-width="3"/><text x="495.4" y="898.0" font-size="10" font-weight="400" fill="#172b3a" text-anchor="start">condenser water</text><rect x="24" y="912.0" width="1352" height="44" rx="0" fill="#f6f8fa" fill-opacity="1" stroke="#5b6b78" stroke-width="1"/><text x="32.0" y="926.0" font-size="11" font-weight="700" fill="#172b3a" text-anchor="start">F19-1  ·  Heat paths of one MSC-1 hall: air through fan walls and liquid through CDUs</text><text x="1368.0" y="926.0" font-size="10" font-weight="400" fill="#5b6b78" text-anchor="end">Chapter 19 · §19.1</text><text x="32.0" y="939.0" font-size="9" font-weight="400" fill="#5b6b78" text-anchor="start">Data Centre Commissioning Field Manual R01 EN · October 2026 · educational reference, not to scale · project and OEM documents govern</text><text x="32.0" y="951.0" font-size="9" font-weight="400" fill="#5b6b78" text-anchor="start">Symbols: QElectroTech EN 60617 and P&amp;ID collections, CC-BY 3.0, native geometry · instrument bubbles per ISA 5.1 · states per IEC 60617 / IEEE C37.2 practice</text></svg>