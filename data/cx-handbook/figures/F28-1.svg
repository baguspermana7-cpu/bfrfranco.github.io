ext x="233.6" y="541.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">30 min stability timer, S02 return to utility</text><text x="705.0" y="541.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">HP3 before retransfer</text><text x="1050.7" y="541.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">script IST-B2-DH3-S02</text><text x="45.0" y="563.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">11:30 to 12:30</text><text x="233.6" y="563.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">S03 generator G-07 fails to start</text><text x="705.0" y="563.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">HP after pickup</text><text x="1050.7" y="563.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">script IST-B2-DH3-S03</text><text x="45.0" y="585.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">13:30 to 15:00</text><text x="233.6" y="585.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">S04 generator G-03 trips on load</text><text x="705.0" y="585.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">HP after trip</text><text x="1050.7" y="585.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">script IST-B2-DH3-S04</text><text x="45.0" y="607.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">16:00 to 17:00</text><text x="233.6" y="607.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">debrief, issue log, day 3 plan</text><text x="705.0" y="607.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">none</text><text x="1050.7" y="607.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">daily report by 09:00</text><text x="24.0" y="30.0" font-size="17" font-weight="700" fill="#172b3a" text-anchor="start">F28-1  IST day 2 for hall B2-DH3: utility loss, return to utility and generator scenarios</text><text x="24.0" y="48.0" font-size="11" font-weight="400" fill="#5b6b78" text-anchor="start">07:00 to 17:00 · load held at 12.0 MW (9.6 MW liquid, 2.4 MW air) · S01 T0 at 09:00 · 30 min utility stability timer · S02 retransfer at 10:00 · S03 at 11:30 · S04 at 13:30 · debrief 16:00</text><text x="32.0" y="650.0" font-size="10" font-weight="700" fill="#2d6a4f" text-anchor="start">WHAT TO PROVE</text><text x="32.0" y="666.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">• S02 starts only after the 30 min utility stability timer that follows S01; the retransfer is closed transition with a parallel time of 100 ms or less.</text><text x="32.0" y="681.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">• Between S02 and S03 the hall returns to steady state (rack inlet change below 0.5 K and TCS change below 0.3 K in 30 min) before the next generator scenario.</text><rect x="24" y="714.0" width="1352" height="44" rx="0" fill="#f6f8fa" fill-opacity="1" stroke="#5b6b78" stroke-width="1"/><text x="32.0" y="728.0" font-size="11" font-weight="700" fill="#172b3a" text-anchor="start">F28-1  ·  IST day 2 for hall B2-DH3: utility loss, return to utility and generator scenarios</text><text x="1368.0" y="728.0" font-size="10" font-weight="400" fill="#5b6b78" text-anchor="end">Chapter 28 · §28.10</text><text x="32.0" y="741.0" font-size="9" font-weight="400" fill="#5b6b78" text-anchor="start">Data Centre Commissioning Field Manual R01 EN · October 2026 · educational reference, not to scale · project and OEM documents govern</text><text x="32.0" y="753.0" font-size="9" font-weight="400" fill="#5b6b78" text-anchor="start">Symbols: QElectroTech EN 60617 and P&amp;ID collections, CC-BY 3.0, native geometry · instrument bubbles per ISA 5.1 · states per IEC 60617 / IEEE C37.2 practice</text></svg>