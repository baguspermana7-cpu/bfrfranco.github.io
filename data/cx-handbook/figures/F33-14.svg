0" font-weight="400" fill="#5b6b78" text-anchor="middle">0</text><text x="315.0" y="494.0" font-size="10" font-weight="400" fill="#5b6b78" text-anchor="middle">0.5</text><text x="520.0" y="494.0" font-size="10" font-weight="400" fill="#5b6b78" text-anchor="middle">1</text><text x="725.0" y="494.0" font-size="10" font-weight="400" fill="#5b6b78" text-anchor="middle">1.5</text><text x="930.0" y="494.0" font-size="10" font-weight="400" fill="#5b6b78" text-anchor="middle">2</text><text x="104.0" y="484.0" font-size="10" font-weight="400" fill="#5b6b78" text-anchor="end">0</text><text x="104.0" y="394.0" font-size="10" font-weight="400" fill="#5b6b78" text-anchor="end">2</text><text x="104.0" y="304.0" font-size="10" font-weight="400" fill="#5b6b78" text-anchor="end">4</text><text x="104.0" y="214.0" font-size="10" font-weight="400" fill="#5b6b78" text-anchor="end">6</text><text x="104.0" y="124.0" font-size="10" font-weight="400" fill="#5b6b78" text-anchor="end">8</text><text x="520.0" y="510.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="middle">link length (km)</text><text transform="translate(66 300.0) rotate(-90)" font-size="11" text-anchor="middle" fill="#172b3a">loss budget (dB)</text><text x="138.0" y="528.0" font-size="10" font-weight="400" fill="#172b3a" text-anchor="start">OS2, 2 pairs, 2 splices</text><text x="138.0" y="543.0" font-size="10" font-weight="400" fill="#172b3a" text-anchor="start">OM4 850 nm, 4 pairs</text><text x="138.0" y="558.0" font-size="10" font-weight="400" fill="#172b3a" text-anchor="start">10GBASE-LR limit 6.2 dB</text><text x="138.0" y="573.0" font-size="10" font-weight="400" fill="#172b3a" text-anchor="start">10GBASE-SR OM4 about 2.9 dB</text><text x="609.0" y="352.5" font-size="10" font-weight="400" fill="#8a5a00" text-anchor="start">1.20 km: 2.70 dB</text><text x="153.9" y="326.9" font-size="10" font-weight="400" fill="#8a5a00" text-anchor="start">90 m: 3.27 dB</text><text x="45.0" y="655.0" font-size="11" font-weight="700" fill="#172b3a" text-anchor="start">Link (example)</text><text x="271.5" y="655.0" font-size="11" font-weight="700" fill="#172b3a" text-anchor="start">Length</text><text x="398.8" y="655.0" font-size="11" font-weight="700" fill="#172b3a" text-anchor="start">Pairs, splices</text><text x="554.5" y="655.0" font-size="11" font-weight="700" fill="#172b3a" text-anchor="start">TIA budget</text><text x="696.1" y="655.0" font-size="11" font-weight="700" fill="#172b3a" text-anchor="start">Test limit used</text><text x="45.0" y="677.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">OS2 campus link</text><text x="271.5" y="677.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">1.20 km</text><text x="398.8" y="677.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">2, 2</text><text x="554.5" y="677.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">2.70 dB</text><text x="696.1" y="677.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">TIA budget (≤ 6.2 dB)</text><text x="45.0" y="699.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">OM4 hall trunk</text><text x="271.5" y="699.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">90 m</text><text x="398.8" y="699.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">4, 0</text><text x="554.5" y="699.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">3.27 dB</text><text x="696.1" y="699.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">engineered 1.27 dB</text><text x="45.0" y="721.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">Mated pair, splice</text><text x="271.5" y="721.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">-</text><text x="398.8" y="721.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">-</text><text x="554.5" y="721.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">0.75, 0.3 dB</text><text x="696.1" y="721.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">ANSI/TIA-568.3-D</text><circle cx="602.0" cy="358.5" r="4" fill="#b7791f"/><circle cx="146.9" cy="332.9" r="4" fill="#b7791f"/><text x="24.0" y="30.0" font-size="17" font-weight="700" fill="#172b3a" text-anchor="start">F33-14  Fibre loss budget against link length with two application limits</text><text x="24.0" y="48.0" font-size="10" font-weight="400" fill="#5b6b78" text-anchor="start">budget = length × attenuation + pairs × 0.75 dB + splices × 0.3 dB · OS2 0.5 dB/km, 2 pairs, 2 splices · OM4 850 nm 3.0 dB/km, 4 pairs · 10GBASE-LR 6.2 dB ·</text><text x="24.0" y="61.0" font-size="10" font-weight="400" fill="#5b6b78" text-anchor="start">10GBASE-SR on OM4 about 2.9 dB</text><text x="32.0" y="764.0" font-size="10" font-weight="700" fill="#2d6a4f" text-anchor="start">WHAT TO PROVE</text><text x="32.0" y="780.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">• The 1.20 km OS2 campus link has a TIA budget of 2.70 dB, well below the 10GBASE-LR channel limit of 6.2 dB.</text><text x="32.0" y="795.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">• The 90 m OM4 link with 4 mated pairs has a TIA budget of 3.27 dB at 850 nm, which is above about 2.9 dB for 10GBASE-SR.</text><rect x="24" y="828.0" width="952" height="44" rx="0" fill="#f6f8fa" fill-opacity="1" stroke="#5b6b78" stroke-width="1"/><text x="32.0" y="842.0" font-size="11" font-weight="700" fill="#172b3a" text-anchor="start">F33-14  ·  Fibre loss budget against link length with two application limits</text><text x="968.0" y="842.0" font-size="10" font-weight="400" fill="#5b6b78" text-anchor="end">Chapter 33 · §33.17</text><text x="32.0" y="855.0" font-size="9" font-weight="400" fill="#5b6b78" text-anchor="start">Data Centre Commissioning Field Manual R01 EN · October 2026 · educational reference, not to scale · project and OEM documents govern</text><text x="32.0" y="867.0" font-size="9" font-weight="400" fill="#5b6b78" text-anchor="start">Symbols: QElectroTech EN 60617 and P&amp;ID collections, CC-BY 3.0, native geometry · instrument bubbles per ISA 5.1 · states per IEC 60617 / IEEE C37.2 practice</text></svg>