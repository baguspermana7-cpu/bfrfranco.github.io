67.6363636363636" height="22.0" rx="0" fill="#ffffff" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><rect x="458.18181818181813" y="482.0" width="250.9090909090909" height="22.0" rx="0" fill="#ffffff" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><rect x="709.090909090909" y="482.0" width="250.9090909090909" height="22.0" rx="0" fill="#ffffff" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><rect x="40" y="504.0" width="150.54545454545453" height="22.0" rx="0" fill="#ffffff" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><rect x="190.54545454545453" y="504.0" width="267.6363636363636" height="22.0" rx="0" fill="#ffffff" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><rect x="458.18181818181813" y="504.0" width="250.9090909090909" height="22.0" rx="0" fill="#ffffff" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><rect x="709.090909090909" y="504.0" width="250.9090909090909" height="22.0" rx="0" fill="#ffffff" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><rect x="40" y="526.0" width="150.54545454545453" height="22.0" rx="0" fill="#ffffff" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><rect x="190.54545454545453" y="526.0" width="267.6363636363636" height="22.0" rx="0" fill="#ffffff" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><rect x="458.18181818181813" y="526.0" width="250.9090909090909" height="22.0" rx="0" fill="#ffffff" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><rect x="709.090909090909" y="526.0" width="250.9090909090909" height="22.0" rx="0" fill="#ffffff" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><rect x="40" y="568.0" width="920" height="58.2" rx="4" fill="#fffbe6" fill-opacity="1" stroke="#b7791f" stroke-width="1.2"/><text x="500.0" y="115.7" font-size="12" font-weight="700" fill="#334155" text-anchor="middle">Interface on the MIL</text><text x="500.0" y="129.2" font-size="10" font-weight="400" fill="#172b3a" text-anchor="middle">what crosses the boundary?</text><text x="180.0" y="240.2" font-size="12" font-weight="700" fill="#475569" text-anchor="middle">Hardwired</text><text x="180.0" y="253.7" font-size="10" font-weight="400" fill="#172b3a" text-anchor="middle">voltage, current or contact</text><text x="180.0" y="267.1" font-size="10" font-weight="400" fill="#172b3a" text-anchor="middle">boundary: receiving terminal</text><text x="180.0" y="280.6" font-size="10" font-weight="400" fill="#172b3a" text-anchor="middle">FACP relay to CRAH fan stop</text><text x="500.0" y="240.2" font-size="12" font-weight="700" fill="#334155" text-anchor="middle">Protocol</text><text x="500.0" y="253.7" font-size="10" font-weight="400" fill="#172b3a" text-anchor="middle">values and commands</text><text x="500.0" y="267.1" font-size="10" font-weight="400" fill="#172b3a" text-anchor="middle">boundary: serving device port</text><text x="500.0" y="280.6" font-size="10" font-weight="400" fill="#172b3a" text-anchor="middle">CDU to BMS, Modbus TCP</text><text x="820.0" y="240.2" font-size="12" font-weight="700" fill="#1d4ed8" text-anchor="middle">Application</text><text x="820.0" y="253.7" font-size="10" font-weight="400" fill="#172b3a" text-anchor="middle">records by API, file or DB link</text><text x="820.0" y="267.1" font-size="10" font-weight="400" fill="#172b3a" text-anchor="middle">boundary: API endpoint</text><text x="820.0" y="280.6" font-size="10" font-weight="400" fill="#172b3a" text-anchor="middle">BMS alarm to CMMS work order</text><text x="180.0" y="368.8" font-size="11" font-weight="700" fill="#475569" text-anchor="middle">test proves</text><text x="180.0" y="380.9" font-size="9" font-weight="400" fill="#172b3a" text-anchor="middle">contact operates the circuit</text><text x="180.0" y="393.1" font-size="9" font-weight="400" fill="#172b3a" text-anchor="middle">wire on the correct terminal</text><text x="500.0" y="368.8" font-size="11" font-weight="700" fill="#334155" text-anchor="middle">test proves</text><text x="500.0" y="380.9" font-size="9" font-weight="400" fill="#172b3a" text-anchor="middle">scaling, units, quality</text><text x="500.0" y="393.1" font-size="9" font-weight="400" fill="#172b3a" text-anchor="middle">and timing of each value</text><text x="820.0" y="368.8" font-size="11" font-weight="700" fill="#1d4ed8" text-anchor="middle">test proves</text><text x="820.0" y="380.9" font-size="9" font-weight="400" fill="#172b3a" text-anchor="middle">record created, updated</text><text x="820.0" y="393.1" font-size="9" font-weight="400" fill="#172b3a" text-anchor="middle">and closed in the receiver</text><text x="45.0" y="475.0" font-size="11" font-weight="700" fill="#172b3a" text-anchor="start">Type</text><text x="195.5" y="475.0" font-size="11" font-weight="700" fill="#172b3a" text-anchor="start">Boundary</text><text x="463.2" y="475.0" font-size="11" font-weight="700" fill="#172b3a" text-anchor="start">Sender side provides</text><text x="714.1" y="475.0" font-size="11" font-weight="700" fill="#172b3a" text-anchor="start">Receiver side provides</text><text x="45.0" y="497.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">Hardwired</text><text x="195.5" y="497.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">terminal in receiving panel</text><text x="463.2" y="497.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">contact and cable</text><text x="714.1" y="497.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">terminal and logic</text><text x="45.0" y="519.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">Protocol</text><text x="195.5" y="519.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">port of serving device</text><text x="463.2" y="519.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">map and comms card (OEM)</text><text x="714.1" y="519.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">polling, mapping, graphics</text><text x="45.0" y="541.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">Application</text><text x="195.5" y="541.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">API endpoint</text><text x="463.2" y="541.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">API client</text><text x="714.1" y="541.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">API specification</text><text x="50.0" y="581.2" font-size="11" font-weight="700" fill="#b7791f" text-anchor="start">Rating check (25.1.2, common error 2)</text><text x="50.0" y="596.6" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">The ICD states voltage, current and contact type on both sides of a hardwired interface. A relay rated 1 A at 30 V DC wired into a 230 V AC fan contactor circuit</text><text x="50.0" y="611.5" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">fails.</text><text x="24.0" y="30.0" font-size="17" font-weight="700" fill="#172b3a" text-anchor="start">F25-9  Classify each interface by what crosses the boundary: hardwired, protocol, application</text><text x="24.0" y="48.0" font-size="10" font-weight="400" fill="#5b6b78" text-anchor="start">3 interface types · 3 boundary points (receiving terminal, serving device port, API endpoint) · 1 owner on each side · example rating check: a relay rated 1 A at 30 V DC</text><text x="24.0" y="61.0" font-size="10" font-weight="400" fill="#5b6b78" text-anchor="start">must not switch a 230 V AC contactor circuit</text><text x="32.0" y="662.2" font-size="10" font-weight="700" fill="#2d6a4f" text-anchor="start">WHAT TO PROVE</text><text x="32.0" y="678.2" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">• A fire alarm relay to a CRAH fan stop circuit is hardwired: the boundary is the terminal in the receiving panel and the test proves the contact operates the circuit on</text><text x="32.0" y="693.2" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">the correct terminal.</text><text x="32.0" y="708.2" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">• A CDU to BMS link on Modbus TCP is a protocol interface: the boundary is the network port of the CDU and the test proves scaling, units, quality and timing of each</text><text x="32.0" y="723.2" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">mapped value.</text><text x="32.0" y="738.2" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">• BMS alarms that open CMMS work orders are an application interface: the boundary is the API endpoint and the test proves each record is created, updated and</text><text x="32.0" y="753.2" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">closed.</text><text x="24.0" y="788.2" font-size="10" font-weight="700" fill="#5b6b78" text-anchor="start">LEGEND</text><line x1="24" y1="810.2" x2="50" y2="810.2" stroke="#334155" stroke-width="3"/><text x="56.0" y="814.2" font-size="10" font-weight="400" fill="#172b3a" text-anchor="start">data / network</text><line x1="150.859375" y1="810.2" x2="176.859375" y2="810.2" stroke="#475569" stroke-width="3"/><text x="182.9" y="814.2" font-size="10" font-weight="400" fill="#172b3a" text-anchor="start">signal / control</text><line x1="278.8265625" y1="810.2" x2="304.8265625" y2="810.2" stroke="#1d4ed8" stroke-width="3"/><text x="310.8" y="814.2" font-size="10" font-weight="400" fill="#172b3a" text-anchor="start">415 V</text><rect x="24" y="828.2" width="952" height="44" rx="0" fill="#f6f8fa" fill-opacity="1" stroke="#5b6b78" stroke-width="1"/><text x="32.0" y="842.2" font-size="11" font-weight="700" fill="#172b3a" text-anchor="start">F25-9  ·  Classify each interface by what crosses the boundary: hardwired, protocol, application</text><text x="968.0" y="842.2" font-size="10" font-weight="400" fill="#5b6b78" text-anchor="end">Chapter 25 · §25.1.1</text><text x="32.0" y="855.2" font-size="9" font-weight="400" fill="#5b6b78" text-anchor="start">Data Centre Commissioning Field Manual R01 EN · October 2026 · educational reference, not to scale · project and OEM documents govern</text><text x="32.0" y="867.2" font-size="9" font-weight="400" fill="#5b6b78" text-anchor="start">Symbols: QElectroTech EN 60617 and P&amp;ID collections, CC-BY 3.0, native geometry · instrument bubbles per ISA 5.1 · states per IEC 60617 / IEEE C37.2 practice</text></svg>