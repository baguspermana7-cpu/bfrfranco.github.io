<svg xmlns="http://www.w3.org/2000/svg" width="174mm" height="154.5mm" viewBox="0 0 1000 888" font-family="DejaVu Sans" role="img" aria-labelledby="t"><title id="t">F25-9 Classify each interface by what crosses the boundary: hardwired, protocol, application</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="context-stroke"/></marker><marker id="arrow-simple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#172b3a"/></marker><marker id="arrow-1d4ed8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#1d4ed8"/></marker><marker id="arrow-334155" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#334155"/></marker><marker id="arrow-475569" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#475569"/></marker></defs><rect width="1000" height="888" fill="#ffffff"/><rect x="4" y="4" width="992" height="880" fill="none" stroke="#172b3a" stroke-width="1.6"/><rect x="24" y="648.2" width="952" height="116" rx="4" fill="#f1f8f4" fill-opacity="1" stroke="#2d6a4f" stroke-width="1"/><polyline points="500.0,148.0 500.0,185.0 180.0,185.0 180.0,220.0" fill="none" stroke="#475569" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#arrow-475569)"/><polyline points="500.0,148.0 500.0,220.0" fill="none" stroke="#334155" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#arrow-334155)"/><polyline points="500.0,148.0 500.0,185.0 820.0,185.0 820.0,220.0" fill="none" stroke="#1d4ed8" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#arrow-1d4ed8)"/><polyline points="180.0,304.0 180.0,350.0" fill="none" stroke="#475569" stroke-width="1