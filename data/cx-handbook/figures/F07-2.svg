font-weight="700" fill="#172b3a" text-anchor="start">GC QA/QC</text><rect x="40" y="400" width="1320" height="130" rx="6" fill="#f6f8fa" fill-opacity="1" stroke="#172b3a" stroke-width="1.2" stroke-dasharray="7 5"/><rect x="48" y="392" width="74.5453125" height="16" rx="3" fill="#ffffff" fill-opacity="1" stroke="#172b3a" stroke-width="1"/><text x="54.0" y="404.0" font-size="11" font-weight="700" fill="#172b3a" text-anchor="start">ENGINEER</text><rect x="40" y="550" width="1320" height="130" rx="6" fill="#f6f8fa" fill-opacity="1" stroke="#172b3a" stroke-width="1.2" stroke-dasharray="7 5"/><rect x="48" y="542" width="39.5" height="16" rx="3" fill="#ffffff" fill-opacity="1" stroke="#172b3a" stroke-width="1"/><text x="54.0" y="554.0" font-size="11" font-weight="700" fill="#172b3a" text-anchor="start">CXM</text><rect x="24" y="741.08" width="1352" height="56" rx="4" fill="#f1f8f4" fill-opacity="1" stroke="#2d6a4f" stroke-width="1"/><polyline points="270.0,175.0 320.0,175.0" fill="none" stroke="#475569" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#arrow-475569)"/><polyline points="415.0,210.0 415.0,290.0" fill="none" stroke="#475569" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#arrow-475569)"/><polyline points="510.0,325.0 570.0,325.0" fill="none" stroke="#475569" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#arrow-475569)"/><polyline points="665.0,360.0 665.0,440.0" fill="none" stroke="#475569" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#arrow-475569)"/><polyline points="760.0,475.0 820.0,475.0" fill="none" stroke="#475569" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#arrow-475569)"/><polyline points="930.0,510.0 930.0,590.0" fill="none" stroke="#475569" stroke-width="1.6" stroke-linejoin="round" stroke-dasharray="7 5" marker-end="url(#arrow-475569)"/><polyline points="1040.0,475.0 1080.0,475.0 1080.0,325.0 1110.0,325.0" fill="none" stroke="#334155" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#arrow-334155)"/><polyline points="990.0,440.0 990.0,240.0 1215.0,240.0 1215.0,210.0" fill="none" stroke="#b91c1c" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#arrow-b91c1c)"/><rect x="80" y="140" width="190" height="70" rx="8" fill="#ffffff" fill-opacity="1" stroke="#475569" stroke-width="1.4"/><rect x="320" y="140" width="190" height="70" rx="8" fill="#ffffff" fill-opacity="1" stroke="#475569" stroke-width="1.4"/><rect x="1110" y="140" width="210" height="70" rx="8" fill="#ffffff" fill-opacity="1" stroke="#b91c1c" stroke-width="1.4"/><rect x="320" y="290" width="190" height="70" rx="8" fill="#ffffff" fill-opacity="1" stroke="#475569" stroke-width="1.4"/><rect x="570" y="290" width="190" height="70" rx="8" fill="#ffffff" fill-opacity="1" stroke="#334155" stroke-width="1.4"/><rect x="1110" y="290" width="210" height="70" rx="8" fill="#ffffff" fill-opacity="1" stroke="#334155" stroke-width="1.4"/><rect x="570" y="440" width="190" height="70" rx="8" fill="#ffffff" fill-opacity="1" stroke="#475569" stroke-width="1.4"/><rect x="820" y="440" width="220" height="70" rx="8" fill="#ffffff" fill-opacity="1" stroke="#475569" stroke-width="1.4"/><rect x="820" y="590" width="220" height="70" rx="8" fill="#ffffff" fill-opacity="1" stroke="#475569" stroke-width="1.4"/><text x="175.0" y="160.3" font-size="11.5" font-weight="700" fill="#475569" text-anchor="middle">Self-inspect</text><text x="175.0" y="173.2" font-size="9.5" font-weight="400" fill="#172b3a" text-anchor="middle">sign checklist</text><text x="175.0" y="186.0" font-size="9.5" font-weight="400" fill="#172b3a" text-anchor="middle">take photographs</text><text x="415.0" y="160.3" font-size="11.5" font-weight="700" fill="#475569" text-anchor="middle">Raise IR</text><text x="415.0" y="173.2" font-size="9.5" font-weight="400" fill="#172b3a" text-anchor="middle">ITP line, time, tags</text><text x="415.0" y="186.0" font-size="9.5" font-weight="400" fill="#172b3a" text-anchor="middle">attachments</text><text x="1215.0" y="166.8" font-size="11.5" font-weight="700" fill="#b91c1c" text-anchor="middle">Correct work</text><text x="1215.0" y="179.6" font-size="9.5" font-weight="400" fill="#172b3a" text-anchor="middle">raise IR suffix R1</text><text x="415.0" y="310.4" font-size="11.5" font-weight="700" fill="#475569" text-anchor="middle">Check IR</text><text x="415.0" y="323.2" font-size="9.5" font-weight="400" fill="#172b3a" text-anchor="middle">within 4 working hours</text><text x="415.0" y="336.0" font-size="9.5" font-weight="400" fill="#172b3a" text-anchor="middle">own H or W point</text><text x="665.0" y="310.4" font-size="11.5" font-weight="700" fill="#334155" text-anchor="middle">Document control</text><text x="665.0" y="323.2" font-size="9.5" font-weight="400" fill="#172b3a" text-anchor="middle">time stamp starts</text><text x="665.0" y="336.0" font-size="9.5" font-weight="400" fill="#172b3a" text-anchor="middle">notice period</text><text x="1215.0" y="316.8" font-size="11.5" font-weight="700" fill="#334155" text-anchor="middle">File and log</text><text x="1215.0" y="329.6" font-size="9.5" font-weight="400" fill="#172b3a" text-anchor="middle">within 1 working day</text><text x="665.0" y="466.8" font-size="11.5" font-weight="700" fill="#475569" text-anchor="middle">Confirm attendance</text><text x="665.0" y="479.6" font-size="9.5" font-weight="400" fill="#172b3a" text-anchor="middle">within 8 working hours</text><text x="930.0" y="460.4" font-size="11.5" font-weight="700" fill="#475569" text-anchor="middle">Joint inspection</text><text x="930.0" y="473.2" font-size="9.5" font-weight="400" fill="#172b3a" text-anchor="middle">code A, B, C or NA</text><text x="930.0" y="486.0" font-size="9.5" font-weight="400" fill="#172b3a" text-anchor="middle">signed on the IR</text><text x="930.0" y="616.8" font-size="11.5" font-weight="700" fill="#475569" text-anchor="middle">CxM witness or hold</text><text x="930.0" y="629.6" font-size="9.5" font-weight="400" fill="#172b3a" text-anchor="middle">same IR, own column</text><text x="1092.0" y="420.0" font-size="11" font-weight="700" fill="#334155" text-anchor="start">A, B, NA</text><text x="1002.0" y="330.0" font-size="11" font-weight="700" fill="#b91c1c" text-anchor="start">code C</text><text x="60.0" y="700.0" font-size="12" font-weight="400" fill="#172b3a" text-anchor="start">Notice periods on MSC-1: 24 working hours for a routine hold or witness point; 48 working hours when a third party, an OEM, the CxM from another building or a first energisation is involved; working hours count</text><text x="60.0" y="716.2" font-size="12" font-weight="400" fill="#172b3a" text-anchor="start">08:00 to 17:00, Monday to Friday.</text><text x="24.0" y="30.0" font-size="17" font-weight="700" fill="#172b3a" text-anchor="start">F07-2  Inspection request workflow in four lanes: subcontractor, GC QA/QC, Engineer, CxM</text><text x="24.0" y="48.0" font-size="11" font-weight="400" fill="#5b6b78" text-anchor="start">self-inspection before the IR · GC check within 4 working hours · notice 24 h routine, 48 h for third parties and first energisation · result written on the IR before leaving the area · filed within 1 working day</text><text x="32.0" y="755.1" font-size="10" font-weight="700" fill="#2d6a4f" text-anchor="start">WHAT TO PROVE</text><text x="32.0" y="771.1" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">• An IR without a signed self-inspection checklist is returned unopened; this keeps the first-pass yield target of 90 % achievable.</text><text x="32.0" y="786.1" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">• The Engineer and the CxM confirm attendance within 8 working hours of receipt; a code C result returns the work to the subcontractor for correction and re-inspection.</text><text x="24.0" y="821.1" font-size="10" font-weight="700" fill="#5b6b78" text-anchor="start">LEGEND</text><line x1="24" y1="843.08" x2="50" y2="843.08" stroke="#475569" stroke-width="3"/><text x="56.0" y="847.1" font-size="10" font-weight="400" fill="#172b3a" text-anchor="start">signal / control</text><line x1="151.9671875" y1="843.08" x2="177.9671875" y2="843.08" stroke="#b91c1c" stroke-width="3"/><text x="184.0" y="847.1" font-size="10" font-weight="400" fill="#172b3a" text-anchor="start">trip / protection</text><line x1="283.934375" y1="843.08" x2="309.934375" y2="843.08" stroke="#334155" stroke-width="3"/><text x="315.9" y="847.1" font-size="10" font-weight="400" fill="#172b3a" text-anchor="start">data / network</text><rect x="24" y="861.08" width="1352" height="44" rx="0" fill="#f6f8fa" fill-opacity="1" stroke="#5b6b78" stroke-width="1"/><text x="32.0" y="875.1" font-size="11" font-weight="700" fill="#172b3a" text-anchor="start">F07-2  ·  Inspection request workflow in four lanes: subcontractor, GC QA/QC, Engineer, CxM</text><text x="1368.0" y="875.1" font-size="10" font-weight="400" fill="#5b6b78" text-anchor="end">Chapter 07 · §07.5</text><text x="32.0" y="888.1" font-size="9" font-weight="400" fill="#5b6b78" text-anchor="start">Data Centre Commissioning Field Manual R01 EN · October 2026 · educational reference, not to scale · project and OEM documents govern</text><text x="32.0" y="900.1" font-size="9" font-weight="400" fill="#5b6b78" text-anchor="start">Symbols: QElectroTech EN 60617 and P&amp;ID collections, CC-BY 3.0, native geometry · instrument bubbles per ISA 5.1 · states per IEC 60617 / IEEE C37.2 practice</text></svg>