 y1="497" x2="1162" y2="497" stroke="#0f766e" stroke-width="2.2"/><polyline points="110.0,660.0 1290.0,660.0" fill="none" stroke="#b91c1c" stroke-width="2.2" stroke-dasharray="6 4"/><line x1="1140" y1="512" x2="1162" y2="512" stroke="#b91c1c" stroke-width="2.2" stroke-dasharray="6 4"/><polyline points="110.0,560.0 1290.0,560.0" fill="none" stroke="#b91c1c" stroke-width="2.2" stroke-dasharray="6 4"/><line x1="1140" y1="527" x2="1162" y2="527" stroke="#b91c1c" stroke-width="2.2" stroke-dasharray="6 4"/><text x="110.0" y="384.0" font-size="10" font-weight="400" fill="#5b6b78" text-anchor="middle">-10</text><text x="278.6" y="384.0" font-size="10" font-weight="400" fill="#5b6b78" text-anchor="middle">0</text><text x="447.1" y="384.0" font-size="10" font-weight="400" fill="#5b6b78" text-anchor="middle">10</text><text x="615.7" y="384.0" font-size="10" font-weight="400" fill="#5b6b78" text-anchor="middle">20</text><text x="784.3" y="384.0" font-size="10" font-weight="400" fill="#5b6b78" text-anchor="middle">30</text><text x="952.9" y="384.0" font-size="10" font-weight="400" fill="#5b6b78" text-anchor="middle">40</text><text x="1121.4" y="384.0" font-size="10" font-weight="400" fill="#5b6b78" text-anchor="middle">50</text><text x="1290.0" y="384.0" font-size="10" font-weight="400" fill="#5b6b78" text-anchor="middle">60</text><text x="104.0" y="374.0" font-size="10" font-weight="400" fill="#5b6b78" text-anchor="end">0</text><text x="104.0" y="321.9" font-size="10" font-weight="400" fill="#5b6b78" text-anchor="end">5</text><text x="104.0" y="269.8" font-size="10" font-weight="400" fill="#5b6b78" text-anchor="end">10</text><text x="104.0" y="217.8" font-size="10" font-weight="400" fill="#5b6b78" text-anchor="end">15</text><text x="104.0" y="165.7" font-size="10" font-weight="400" fill="#5b6b78" text-anchor="end">20</text><text x="700.0" y="400.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="middle">time from T0 (s)</text><text transform="translate(66 245.0) rotate(-90)" font-size="11" text-anchor="middle" fill="#172b3a">power (MW)</text><text x="1168.0" y="136.0" font-size="10" font-weight="400" fill="#172b3a" text-anchor="start">utility incomers</text><text x="1168.0" y="151.0" font-size="10" font-weight="400" fill="#172b3a" text-anchor="start">generator bus</text><text x="1168.0" y="166.0" font-size="10" font-weight="400" fill="#172b3a" text-anchor="start">UPS output, 8 blocks</text><text x="110.0" y="432.0" font-size="11" font-weight="400" fill="#5b6b78" text-anchor="start">Generator bus closed at 12.4 s and reached 14.4 MW at 30 s; the UPS output stayed at 12.0 MW.</text><text x="248.8" y="734.0" font-size="10" font-weight="400" fill="#5b6b78" text-anchor="middle">0</text><text x="595.9" y="734.0" font-size="10" font-weight="400" fill="#5b6b78" text-anchor="middle">5</text><text x="942.9" y="734.0" font-size="10" font-weight="400" fill="#5b6b78" text-anchor="middle">10</text><text x="1290.0" y="734.0" font-size="10" font-weight="400" fill="#5b6b78" text-anchor="middle">15</text><text x="104.0" y="699.0" font-size="10" font-weight="400" fill="#5b6b78" text-anchor="end">20</text><text x="104.0" y="649.0" font-size="10" font-weight="400" fill="#5b6b78" text-anchor="end">30</text><text x="104.0" y="599.0" font-size="10" font-weight="400" fill="#5b6b78" text-anchor="end">40</text><text x="104.0" y="549.0" font-size="10" font-weight="400" fill="#5b6b78" text-anchor="end">50</text><text x="104.0" y="499.0" font-size="10" font-weight="400" fill="#5b6b78" text-anchor="end">60</text><text x="700.0" y="750.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="middle">time from T0 (min)</text><text transform="translate(66 595.0) rotate(-90)" font-size="11" text-anchor="middle" fill="#172b3a">temperature (°C)</text><text x="1168.0" y="486.0" font-size="10" font-weight="400" fill="#172b3a" text-anchor="start">rack inlet, highest</text><text x="1168.0" y="501.0" font-size="10" font-weight="400" fill="#172b3a" text-anchor="start">TCS supply, highest CDU</text><text x="1168.0" y="516.0" font-size="10" font-weight="400" fill="#172b3a" text-anchor="start">pass 27 °C</text><text x="1168.0" y="531.0" font-size="10" font-weight="400" fill="#172b3a" text-anchor="start">pass 47 °C</text><text x="110.0" y="782.0" font-size="11" font-weight="400" fill="#5b6b78" text-anchor="start">Trim chillers restarted at 3 min 40 s; both temperatures returned to their initial values by 15 min.</text><text x="24.0" y="30.0" font-size="17" font-weight="700" fill="#172b3a" text-anchor="start">F28-3  Power and temperature trends during S01 utility loss in hall B2-DH3 (example data)</text><text x="24.0" y="48.0" font-size="11" font-weight="400" fill="#5b6b78" text-anchor="start">T0 = both 20 kV incomers open · UPS output 12.0 MW without interruption · generator bus closed at 12.4 s, 14.4 MW after pickup · rack inlet peak 25.9 °C at 4 min (pass 27 °C) · TCS supply peak 46.2 °C at 3 min (pass 47 °C)</text><text x="32.0" y="820.6" font-size="10" font-weight="700" fill="#2d6a4f" text-anchor="start">WHAT TO PROVE</text><text x="32.0" y="836.6" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">• The UPS output line stays at 12.0 MW through T0 and through the generator bus closing at 12.4 s: no rack lost power.</text><text x="32.0" y="851.6" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">• The highest rack inlet (25.9 °C) and the highest TCS supply (46.2 °C) stay below the 27 °C and 47 °C pass lines; the TCS margin is (47.0 - 46.2) / (47.0 - 45.0) = 40 %.</text><rect x="24" y="884.64" width="1352" height="44" rx="0" fill="#f6f8fa" fill-opacity="1" stroke="#5b6b78" stroke-width="1"/><text x="32.0" y="898.6" font-size="11" font-weight="700" fill="#172b3a" text-anchor="start">F28-3  ·  Power and temperature trends during S01 utility loss in hall B2-DH3 (example data)</text><text x="1368.0" y="898.6" font-size="10" font-weight="400" fill="#5b6b78" text-anchor="end">Chapter 28 · §28.14</text><text x="32.0" y="911.6" font-size="9" font-weight="400" fill="#5b6b78" text-anchor="start">Data Centre Commissioning Field Manual R01 EN · October 2026 · educational reference, not to scale · project and OEM documents govern</text><text x="32.0" y="923.6" font-size="9" font-weight="400" fill="#5b6b78" text-anchor="start">Symbols: QElectroTech EN 60617 and P&amp;ID collections, CC-BY 3.0, native geometry · instrument bubbles per ISA 5.1 · states per IEC 60617 / IEEE C37.2 practice</text></svg>