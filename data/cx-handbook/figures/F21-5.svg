2b3a" text-anchor="middle">high 47.0 °C P2 30 s; high-high 49.0 °C P1 10 s</text><text x="930.0" y="305.2" font-size="12" font-weight="700" fill="#172b3a" text-anchor="middle">engineer of record</text><text x="1210.0" y="305.2" font-size="12" font-weight="700" fill="#172b3a" text-anchor="middle">alarm test</text><text x="46.0" y="330.7" font-size="12" font-weight="400" fill="#172b3a" text-anchor="start">Trend</text><text x="560.0" y="330.7" font-size="12" font-weight="700" fill="#172b3a" text-anchor="middle">10 s interval</text><text x="930.0" y="330.7" font-size="12" font-weight="700" fill="#172b3a" text-anchor="middle">operations</text><text x="1210.0" y="330.7" font-size="12" font-weight="700" fill="#172b3a" text-anchor="middle">trend check, IST</text><text x="46.0" y="356.1" font-size="12" font-weight="400" fill="#172b3a" text-anchor="start">Interface reference</text><text x="560.0" y="356.1" font-size="12" font-weight="700" fill="#172b3a" text-anchor="middle">ICD-25-021</text><text x="930.0" y="356.1" font-size="12" font-weight="700" fill="#172b3a" text-anchor="middle">commissioning manager</text><text x="1210.0" y="356.1" font-size="12" font-weight="700" fill="#172b3a" text-anchor="middle">integration test</text><text x="46.0" y="381.6" font-size="12" font-weight="400" fill="#172b3a" text-anchor="start">Test reference</text><text x="560.0" y="381.6" font-size="12" font-weight="700" fill="#172b3a" text-anchor="middle">P2P-B2-DH3-CDU07</text><text x="930.0" y="381.6" font-size="12" font-weight="700" fill="#172b3a" text-anchor="middle">commissioning manager</text><text x="1210.0" y="381.6" font-size="12" font-weight="700" fill="#172b3a" text-anchor="middle">point-to-point test</text><text x="24.0" y="30.0" font-size="17" font-weight="700" fill="#172b3a" text-anchor="start">F21-5  Anatomy of a points list row: where each field comes from and which test uses it</text><text x="24.0" y="48.0" font-size="11" font-weight="400" fill="#5b6b78" text-anchor="start">example row MSC1_B2_DH3_CDU07_TCS_SupT · 18 fields · first issue with the controls submittal · review period 10 working days</text><text x="32.0" y="425.8" font-size="10" font-weight="700" fill="#2d6a4f" text-anchor="start">WHAT TO PROVE</text><text x="32.0" y="441.8" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">• The alarm limits (47.0 °C high, 49.0 °C high-high) come from the engineer of record; the trend interval (10 s) comes from operations because the IST judges events shorter than 60 s.</text><text x="32.0" y="456.8" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">• The interface reference ICD-25-031 and the test reference P2P-B2-DH3-CDU07 link the row to chapter 25 and chapter 22.</text><rect x="24" y="489.84000000000003" width="1352" height="44" rx="0" fill="#f6f8fa" fill-opacity="1" stroke="#5b6b78" stroke-width="1"/><text x="32.0" y="503.8" font-size="11" font-weight="700" fill="#172b3a" text-anchor="start">F21-5  ·  Anatomy of a points list row: where each field comes from and which test uses it</text><text x="1368.0" y="503.8" font-size="10" font-weight="400" fill="#5b6b78" text-anchor="end">Chapter 21 · §21.10</text><text x="32.0" y="516.8" font-size="9" font-weight="400" fill="#5b6b78" text-anchor="start">Data Centre Commissioning Field Manual R01 EN · October 2026 · educational reference, not to scale · project and OEM documents govern</text><text x="32.0" y="528.8" font-size="9" font-weight="400" fill="#5b6b78" text-anchor="start">Symbols: QElectroTech EN 60617 and P&amp;ID collections, CC-BY 3.0, native geometry · instrument bubbles per ISA 5.1 · states per IEC 60617 / IEEE C37.2 practice</text></svg>