th="0.8"/><rect x="40" y="364.4" width="280" height="25.44" rx="0" fill="#e9f0f4" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><rect x="320" y="364.4" width="480" height="25.44" rx="0" fill="#ffffff" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><rect x="800" y="364.4" width="260" height="25.44" rx="0" fill="#ffffff" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><rect x="1060" y="364.4" width="300" height="25.44" rx="0" fill="#ffffff" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><text x="560.0" y="127.2" font-size="11" font-weight="700" fill="#172b3a" text-anchor="middle">Example value</text><text x="930.0" y="127.2" font-size="11" font-weight="700" fill="#172b3a" text-anchor="middle">Written by</text><text x="1210.0" y="127.2" font-size="11" font-weight="700" fill="#172b3a" text-anchor="middle">Used by</text><text x="46.0" y="152.6" font-size="12" font-weight="400" fill="#172b3a" text-anchor="start">Point name</text><text x="560.0" y="152.6" font-size="12" font-weight="700" fill="#172b3a" text-anchor="middle">MSC1_B2_DH3_CDU07_TCS_SupT</text><text x="930.0" y="152.6" font-size="12" font-weight="700" fill="#172b3a" text-anchor="middle">controls contractor</text><text x="1210.0" y="152.6" font-size="12" font-weight="700" fill="#172b3a" text-anchor="middle">all systems, naming check</text><text x="46.0" y="178.0" font-size="12" font-weight="400" fill="#172b3a" text-anchor="start">Equipment tag</text><text x="560.0" y="178.0" font-size="12" font-weight="700" fill="#172b3a" text-anchor="middle">B2-DH3-CDU-07</text><text x="930.0" y="178.0" font-size="12" font-weight="700" fill="#172b3a" text-anchor="middle">controls contractor</text><text x="1210.0" y="178.0" font-size="12" font-weight="700" fill="#172b3a" text-anchor="middle">CMMS and DCIM asset match</text><text x="46.0" y="203.5" font-size="12" font-weight="400" fill="#172b3a" text-anchor="start">Object and device instance</text><text x="560.0" y="203.5" font-size="12" font-weight="7