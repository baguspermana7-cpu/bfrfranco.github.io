ion load before RFS</text><text x="32.0" y="502.0" font-size="10" font-weight="700" fill="#2d6a4f" text-anchor="start">WHAT TO PROVE</text><text x="32.0" y="518.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">• For the B1 chiller plant 17 of 140 rows failed at least one rule (87.9 % first pass); the target is 100 % before the production load.</text><text x="32.0" y="533.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">• The field sample is 5 % of assets per system (7 of 140) checked against the nameplates.</text><text x="24.0" y="568.0" font-size="10" font-weight="700" fill="#5b6b78" text-anchor="start">LEGEND</text><line x1="24" y1="590.0" x2="50" y2="590.0" stroke="#334155" stroke-width="3"/><text x="56.0" y="594.0" font-size="10" font-weight="400" fill="#172b3a" text-anchor="start">data / network</text><rect x="24" y="608.0" width="1352" height="44" rx="0" fill="#f6f8fa" fill-opacity="1" stroke="#5b6b78" stroke-width="1"/><text x="32.0" y="622.0" font-size="11" font-weight="700" fill="#172b3a" text-anchor="start">F12-3  ·  Asset data flow from installation to the CMMS, with the validation rules applied at each step</text><text x="1368.0" y="622.0" font-size="10" font-weight="400" fill="#5b6b78" text-anchor="end">Chapter 12 · §12.7</text><text x="32.0" y="635.0" font-size="9" font-weight="400" fill="#5b6b78" text-anchor="start">Data Centre Commissioning Field Manual R01 EN · October 2026 · educational reference, not to scale · project and OEM documents govern</text><text x="32.0" y="647.0" font-size="9" font-weight="400" fill="#5b6b78" text-anchor="start">Symbols: QElectroTech EN 60617 and P&amp;ID collections, CC-BY 3.0, native geometry · instrument bubbles per ISA 5.1 · states per IEC 60617 / IEEE C37.2 practice</text></svg>