4.0" y="594.0" font-size="10" font-weight="400" fill="#5b6b78" text-anchor="end">0</text><text x="104.0" y="491.8" font-size="10" font-weight="400" fill="#5b6b78" text-anchor="end">10</text><text x="104.0" y="389.7" font-size="10" font-weight="400" fill="#5b6b78" text-anchor="end">20</text><text x="104.0" y="287.5" font-size="10" font-weight="400" fill="#5b6b78" text-anchor="end">30</text><text x="104.0" y="185.3" font-size="10" font-weight="400" fill="#5b6b78" text-anchor="end">40</text><text x="490.0" y="620.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="middle">flow per pump (L/s)</text><text transform="translate(66 355.0) rotate(-90)" font-size="11" text-anchor="middle" fill="#172b3a">head (m)</text><text x="748.0" y="528.0" font-size="10" font-weight="400" fill="#172b3a" text-anchor="start">100 % speed</text><text x="748.0" y="543.0" font-size="10" font-weight="400" fill="#172b3a" text-anchor="start">90 % speed</text><text x="748.0" y="558.0" font-size="10" font-weight="400" fill="#172b3a" text-anchor="start">85 % speed</text><text x="748.0" y="573.0" font-size="10" font-weight="400" fill="#172b3a" text-anchor="start">system curve</text><text x="635.6" y="257.0" font-size="10" font-weight="400" fill="#8a5a00" text-anchor="start">duty 116 L/s, 32.0 m</text><text x="537.2" y="340.8" font-size="10" font-weight="400" fill="#8a5a00" text-anchor="start">85 %: 94.0 L/s, 23.8 m</text><text x="110.0" y="640.0" font-size="11" font-weight="400" fill="#5b6b78" text-anchor="start">Open squares: field test points 1 to 4 of record 18.7.5, measured head at measured flow.</text><text x="955.0" y="135.0" font-size="11" font-weight="700" fill="#172b3a" text-anchor="start">Test point</text><text x="1069.4" y="135.0" font-size="11" font-weight="700" fill="#172b3a" text-anchor="start">Flow (L/s)</text><text x="1164.8" y="135.0" font-size="11" font-weight="700" fill="#172b3a" text-anchor="start">Head (m)</text><text x="1260.1" y="135.0" font-size="11" font-weight="700" fill="#172b3a" text-anchor="start">Deviation</text><text x="955.0" y="157.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">1</text><text x="1069.4" y="157.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">62.0</text><text x="1164.8" y="157.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">38.2</text><text x="1260.1" y="157.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">−2.3 %</text><text x="955.0" y="179.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">2</text><text x="1069.4" y="179.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">88.5</text><text x="1164.8" y="179.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">35.4</text><text x="1260.1" y="179.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">−2.2 %</text><text x="955.0" y="201.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">3</text><text x="1069.4" y="201.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">114.8</text><text x="1164.8" y="201.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">32.3</text><text x="1260.1" y="201.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">+0.4 %</text><text x="955.0" y="223.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">4</text><text x="1069.4" y="223.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">126.0</text><text x="1164.8" y="223.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">30.5</text><text x="1260.1" y="223.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">+1.0 %</text><text x="960.0" y="303.2" font-size="11" font-weight="700" fill="#b7791f" text-anchor="start">What to prove</text><text x="960.0" y="318.6" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">Head is calculated from flange pressures plus velocity head and</text><text x="960.0" y="333.4" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">gauge elevation.</text><text x="960.0" y="348.3" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">Each point lies within the project tolerance of the factory curve</text><text x="960.0" y="363.2" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">(example ±5 %).</text><text x="960.0" y="378.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">Motor current at duty is below the nameplate current.</text><circle cx="628.6" cy="263.0" r="4" fill="#b7791f"/><circle cx="530.2" cy="346.8" r="4" fill="#b7791f"/><text x="24.0" y="30.0" font-size="17" font-weight="700" fill="#172b3a" text-anchor="start">F18-2  FWS pump curves at 100, 90 and 85 % speed, system curve and the field test points</text><text x="24.0" y="48.0" font-size="11" font-weight="400" fill="#5b6b78" text-anchor="start">one pump of 3 × 50 % · duty 116 L/s at 32.0 m · shut-off 42 m · pump H = n² × 42 − 7.43e-4 Q² · system H = 8 + 1.784e-3 Q² (8 m differential-pressure set point) · at 85 % speed 94.0 L/s at 23.8 m</text><text x="32.0" y="678.6" font-size="10" font-weight="700" fill="#2d6a4f" text-anchor="start">WHAT TO PROVE</text><text x="32.0" y="694.6" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">• The duty point is where the 100 % pump curve meets the system curve: 116 L/s at 32.0 m.</text><text x="32.0" y="709.6" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">• At 85 % speed the operating point moves to 94.0 L/s at 23.8 m; the four field points lie within −2.3 % to +1.0 % of the factory curve.</text><rect x="24" y="742.64" width="1352" height="44" rx="0" fill="#f6f8fa" fill-opacity="1" stroke="#5b6b78" stroke-width="1"/><text x="32.0" y="756.6" font-size="11" font-weight="700" fill="#172b3a" text-anchor="start">F18-2  ·  FWS pump curves at 100, 90 and 85 % speed, system curve and the field test points</text><text x="1368.0" y="756.6" font-size="10" font-weight="400" fill="#5b6b78" text-anchor="end">Chapter 18 · §18.7</text><text x="32.0" y="769.6" font-size="9" font-weight="400" fill="#5b6b78" text-anchor="start">Data Centre Commissioning Field Manual R01 EN · October 2026 · educational reference, not to scale · project and OEM documents govern</text><text x="32.0" y="781.6" font-size="9" font-weight="400" fill="#5b6b78" text-anchor="start">Symbols: QElectroTech EN 60617 and P&amp;ID collections, CC-BY 3.0, native geometry · instrument bubbles per ISA 5.1 · states per IEC 60617 / IEEE C37.2 practice</text></svg>