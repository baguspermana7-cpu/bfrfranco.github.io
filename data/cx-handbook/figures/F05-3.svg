per age band</text><text x="225.0" y="154.4" font-size="10" font-weight="400" fill="#8a5a00" text-anchor="start">46</text><text x="381.0" y="268.4" font-size="10" font-weight="400" fill="#8a5a00" text-anchor="start">31</text><text x="537.0" y="367.2" font-size="10" font-weight="400" fill="#8a5a00" text-anchor="start">18</text><text x="693.0" y="435.6" font-size="10" font-weight="400" fill="#8a5a00" text-anchor="start">9</text><text x="849.0" y="473.6" font-size="10" font-weight="400" fill="#8a5a00" text-anchor="start">4</text><text x="140.0" y="596.0" font-size="12" font-weight="400" fill="#172b3a" text-anchor="start">Band 0 to 1: 0-5 working days (46)</text><text x="140.0" y="612.2" font-size="12" font-weight="400" fill="#172b3a" text-anchor="start">Band 1 to 2: 6-10 working days (31)</text><text x="140.0" y="628.4" font-size="12" font-weight="400" fill="#172b3a" text-anchor="start">Band 2 to 3: 11-20 working days (18)</text><text x="140.0" y="644.6" font-size="12" font-weight="400" fill="#172b3a" text-anchor="start">Band 3 to 4: 21-40 working days (9)</text><text x="140.0" y="660.8" font-size="12" font-weight="400" fill="#172b3a" text-anchor="start">Band 4 to 5: over 40 working days (4)</text><circle cx="218.0" cy="160.4" r="4" fill="#b7791f"/><circle cx="374.0" cy="274.4" r="4" fill="#b7791f"/><circle cx="530.0" cy="373.2" r="4" fill="#b7791f"/><circle cx="686.0" cy="441.6" r="4" fill="#b7791f"/><circle cx="842.0" cy="479.6" r="4" fill="#b7791f"/><text x="24.0" y="30.0" font-size="17" font-weight="700" fill="#172b3a" text-anchor="start">F05-3  Ageing histogram of open RFIs, building 2, week 32 of the MSC-1 worked example</text><text x="24.0" y="48.0" font-size="11" font-weight="400" fill="#5b6b78" text-anchor="start">108 open RFIs · bands 0-5, 6-10, 11-20, 21-40, over 40 working days · 13 RFIs older than 20 working days listed at the weekly meeting</text><text x="32.0" y="699.7" font-size="10" font-weight="700" fill="#2d6a4f" text-anchor="start">WHAT TO PROVE</text><text x="32.0" y="715.7" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">• Counts 46, 31, 18, 9 and 4 sum to 108 open RFIs; 9 + 4 = 13 are older than 20 working days.</text><text x="32.0" y="730.7" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">• The week-32 average response time is 7.0 working days and the on-time rate 85.4 %, below the 90 % target.</text><rect x="24" y="763.6800000000002" width="952" height="44" rx="0" fill="#f6f8fa" fill-opacity="1" stroke="#5b6b78" stroke-width="1"/><text x="32.0" y="777.7" font-size="11" font-weight="700" fill="#172b3a" text-anchor="start">F05-3  ·  Ageing histogram of open RFIs, building 2, week 32 of the MSC-1 worked example</text><text x="968.0" y="777.7" font-size="10" font-weight="400" fill="#5b6b78" text-anchor="end">Chapter 05 · §05.8</text><text x="32.0" y="790.7" font-size="9" font-weight="400" fill="#5b6b78" text-anchor="start">Data Centre Commissioning Field Manual R01 EN · October 2026 · educational reference, not to scale · project and OEM documents govern</text><text x="32.0" y="802.7" font-size="9" font-weight="400" fill="#5b6b78" text-anchor="start">Symbols: QElectroTech EN 60617 and P&amp;ID collections, CC-BY 3.0, native geometry · instrument bubbles per ISA 5.1 · states per IEC 60617 / IEEE C37.2 practice</text></svg>