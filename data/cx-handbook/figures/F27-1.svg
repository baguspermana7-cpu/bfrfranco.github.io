orian replica, jump host,</text><text x="700.0" y="266.0" font-size="9.5" font-weight="400" fill="#172b3a" text-anchor="middle">patch server</text><text x="700.0" y="386.8" font-size="11.5" font-weight="700" fill="#475569" text-anchor="middle">Z3 OT servers  (SL-T 3)</text><text x="700.0" y="399.6" font-size="9.5" font-weight="400" fill="#172b3a" text-anchor="middle">BMS, PME, DCIM, ACS and VMS servers</text><text x="1210.0" y="380.4" font-size="11.5" font-weight="700" fill="#172b3a" text-anchor="middle">Z9 Management  (SL-T 3)</text><text x="1210.0" y="393.2" font-size="9.5" font-weight="400" fill="#172b3a" text-anchor="middle">switch and firewall</text><text x="1210.0" y="406.0" font-size="9.5" font-weight="400" fill="#172b3a" text-anchor="middle">management ports</text><text x="170.0" y="563.9" font-size="11" font-weight="700" fill="#475569" text-anchor="middle">Z4 EPMS field  (SL-T 3)</text><text x="170.0" y="576.0" font-size="9" font-weight="400" fill="#172b3a" text-anchor="middle">meters, relays, trip units</text><text x="440.0" y="563.9" font-size="11" font-weight="700" fill="#475569" text-anchor="middle">Z5 BMS field  (SL-T 3)</text><text x="440.0" y="576.0" font-size="9" font-weight="400" fill="#172b3a" text-anchor="middle">controllers, CDU PLCs</text><text x="710.0" y="563.9" font-size="11" font-weight="700" fill="#475569" text-anchor="middle">Z6 Safety and fire</text><text x="710.0" y="576.0" font-size="9" font-weight="400" fill="#172b3a" text-anchor="middle">fire and leak panels</text><text x="980.0" y="563.9" font-size="11" font-weight="700" fill="#475569" text-anchor="middle">Z7 Security  (SL-T 2)</text><text x="980.0" y="576.0" font-size="9" font-weight="400" fill="#172b3a" text-anchor="middle">door controllers, cameras</text><text x="1250.0" y="563.9" font-size="11" font-weight="700" fill="#475569" text-anchor="middle">Z8 Vendor equipment</text><text x="1250.0" y="576.0" font-size="9" font-weight="400" fill="#172b3a" text-anchor="middle">UPS cards, gen controls</text><text x="712.0" y="198.0" font-size="10.5" font-weight="400" fill="#5b6b78" text-anchor="start">C1  HTTPS 443, MFA</text><text x="712.0" y="334.0" font-size="10.5" font-weight="400" fill="#5b6b78" text-anchor="start">C2  replication</text><text x="908.0" y="388.0" font-size="10.5" font-weight="400" fill="#5b6b78" text-anchor="start">C7  SSH, SNMPv3</text><text x="64.0" y="622.0" font-size="10.5" font-weight="700" fill="#334155" text-anchor="start">C3  Modbus 502</text><text x="334.0" y="622.0" font-size="10.5" font-weight="700" fill="#334155" text-anchor="start">C4  BACnet</text><text x="604.0" y="622.0" font-size="10.5" font-weight="700" fill="#334155" text-anchor="start">C5  read only</text><text x="874.0" y="622.0" font-size="10.5" font-weight="700" fill="#334155" text-anchor="start">C6  ACS, VMS</text><text x="1144.0" y="622.0" font-size="10.5" font-weight="700" fill="#334155" text-anchor="start">C8  SNMPv3</text><text x="45.0" y="665.0" font-size="11" font-weight="700" fill="#172b3a" text-anchor="start">Conduit</text><text x="205.0" y="665.0" font-size="11" font-weight="700" fill="#172b3a" text-anchor="start">From</text><text x="325.0" y="665.0" font-size="11" font-weight="700" fill="#172b3a" text-anchor="start">To</text><text x="445.0" y="665.0" font-size="11" font-weight="700" fill="#172b3a" text-anchor="start">Protocol</text><text x="885.0" y="665.0" font-size="11" font-weight="700" fill="#172b3a" text-anchor="start">Control</text><text x="45.0" y="687.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">C1</text><text x="205.0" y="687.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">Z1</text><text x="325.0" y="687.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">Z2</text><text x="445.0" y="687.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">HTTPS 443, RDP gateway</text><text x="885.0" y="687.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">firewall 1, MFA on jump host</text><text x="45.0" y="709.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">C3</text><text x="205.0" y="709.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">Z3</text><text x="325.0" y="709.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">Z4</text><text x="445.0" y="709.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">Modbus TCP 502, ION 7700</text><text x="885.0" y="709.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">firewall, source address list</text><text x="45.0" y="731.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">C4</text><text x="205.0" y="731.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">Z3</text><text x="325.0" y="731.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">Z5</text><text x="445.0" y="731.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">BACnet/IP 47808 or BACnet/SC</text><text x="885.0" y="731.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">firewall, BBMD limits</text><text x="45.0" y="753.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">C5</text><text x="205.0" y="753.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">Z6</text><text x="325.0" y="753.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">Z3</text><text x="445.0" y="753.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">read-only gateway</text><text x="885.0" y="753.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">no write function codes</text><text x="45.0" y="775.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">C7</text><text x="205.0" y="775.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">Z9</text><text x="325.0" y="775.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">all</text><text x="445.0" y="775.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">SSH 22, SNMPv3 161</text><text x="885.0" y="775.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">out-of-band management</text><text x="24.0" y="30.0" font-size="17" font-weight="700" fill="#172b3a" text-anchor="start">F27-1  Zones and conduits of one MSC-1 building (IEC 62443-3-2) with the target security level of each zone</text><text x="24.0" y="48.0" font-size="11" font-weight="400" fill="#5b6b78" text-anchor="start">nine zones Z1 to Z9 · conduits C1 to C8 each pass a firewall or a read-only gateway · SL-T example values: DMZ, servers, EPMS field and BMS field SL3; security SL2 · fire zone Z6 sends values only</text><text x="32.0" y="818.0" font-size="10" font-weight="700" fill="#2d6a4f" text-anchor="start">WHAT TO PROVE</text><text x="32.0" y="834.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">• The firewall rule base has one rule set per conduit C1 to C8 and no rule with &quot;any&quot; in source, destination or service.</text><text x="32.0" y="849.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">• Conduit C5 from the fire zone Z6 is read-only: Modbus function codes 05, 06, 15 and 16 and BACnet WriteProperty are rejected in the conduit test.</text><text x="24.0" y="884.0" font-size="10" font-weight="700" fill="#5b6b78" text-anchor="start">LEGEND</text><line x1="24" y1="906.0" x2="50" y2="906.0" stroke="#334155" stroke-width="3"/><text x="56.0" y="910.0" font-size="10" font-weight="400" fill="#172b3a" text-anchor="start">data / network</text><line x1="150.859375" y1="906.0" x2="176.859375" y2="906.0" stroke="#b91c1c" stroke-width="3"/><text x="182.9" y="910.0" font-size="10" font-weight="400" fill="#172b3a" text-anchor="start">trip / protection</text><line x1="282.8265625" y1="906.0" x2="308.8265625" y2="906.0" stroke="#475569" stroke-width="3"/><text x="314.8" y="910.0" font-size="10" font-weight="400" fill="#172b3a" text-anchor="start">signal / control</text><rect x="24" y="924.0" width="1352" height="44" rx="0" fill="#f6f8fa" fill-opacity="1" stroke="#5b6b78" stroke-width="1"/><text x="32.0" y="938.0" font-size="11" font-weight="700" fill="#172b3a" text-anchor="start">F27-1  ·  Zones and conduits of one MSC-1 building (IEC 62443-3-2) with the target security level of each zone</text><text x="1368.0" y="938.0" font-size="10" font-weight="400" fill="#5b6b78" text-anchor="end">Chapter 27 · §27.10</text><text x="32.0" y="951.0" font-size="9" font-weight="400" fill="#5b6b78" text-anchor="start">Data Centre Commissioning Field Manual R01 EN · October 2026 · educational reference, not to scale · project and OEM documents govern</text><text x="32.0" y="963.0" font-size="9" font-weight="400" fill="#5b6b78" text-anchor="start">Symbols: QElectroTech EN 60617 and P&amp;ID collections, CC-BY 3.0, native geometry · instrument bubbles per ISA 5.1 · states per IEC 60617 / IEEE C37.2 practice</text></svg>