 %) at t = 0 · frequency minimum 47.10 Hz (-5.8 %), back in the 49.0-51.0 Hz band at 2.1 s · voltage minimum 17.92 kV (-10.4 %), back in the 19.8-20.2 kV band at 1.6 s · G3 limits 46.5 Hz, 3 s; 17.0 kV, 4 s</text><text x="32.0" y="830.0" font-size="10" font-weight="700" fill="#2d6a4f" text-anchor="start">WHAT TO PROVE</text><text x="32.0" y="846.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">• Frequency dip 2.90 Hz = 5.8 % against the 7 % G3 limit; recovery 2.1 s against 3 s.</text><text x="32.0" y="861.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">• Voltage dip 2.08 kV = 10.4 % against the 15 % G3 limit; recovery 1.6 s against 4 s; the recorder must give half-cycle RMS values for these readings.</text><rect x="24" y="894" width="1352" height="44" rx="0" fill="#f6f8fa" fill-opacity="1" stroke="#5b6b78" stroke-width="1"/><text x="32.0" y="908.0" font-size="11" font-weight="700" fill="#172b3a" text-anchor="start">F15-3  ·  Load acceptance stage 1 of B2-GEN-07: frequency and voltage dip against ISO 8528-5 class G3</text><text x="1368.0" y="908.0" font-size="10" font-weight="400" fill="#5b6b78" text-anchor="end">Chapter 15 · §15.8</text><text x="32.0" y="921.0" font-size="9" font-weight="400" fill="#5b6b78" text-anchor="start">Data Centre Commissioning Field Manual R01 EN · October 2026 · educational reference, not to scale · project and OEM documents govern</text><text x="32.0" y="933.0" font-size="9" font-weight="400" fill="#5b6b78" text-anchor="start">Symbols: QElectroTech EN 60617 and P&amp;ID collections, CC-BY 3.0, native geometry · instrument bubbles per ISA 5.1 · states per IEC 60617 / IEEE C37.2 practice</text></svg>