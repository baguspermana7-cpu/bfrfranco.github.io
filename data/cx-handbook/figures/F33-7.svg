width="0.8"/><rect x="868.0" y="684.0" width="92.0" height="22.0" rx="0" fill="#ffffff" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><rect x="40" y="706.0" width="260.6666666666667" height="22.0" rx="0" fill="#ffffff" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><rect x="300.6666666666667" y="706.0" width="567.3333333333334" height="22.0" rx="0" fill="#ffffff" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><rect x="868.0" y="706.0" width="92.0" height="22.0" rx="0" fill="#ffffff" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><text x="180.0" y="131.8" font-size="11" font-weight="700" fill="#334155" text-anchor="middle">BMS servers</text><text x="180.0" y="144.0" font-size="9" font-weight="400" fill="#172b3a" text-anchor="middle">BACnet/IP, COV, trend logs</text><text x="180.0" y="156.1" font-size="9" font-weight="400" fill="#172b3a" text-anchor="middle">failover: clients back ≤ 60 s</text><text x="500.0" y="131.8" font-size="11" font-weight="700" fill="#334155" text-anchor="middle">PME server (EPMS)</text><text x="500.0" y="144.0" font-size="9" font-weight="400" fill="#172b3a" text-anchor="middle">72 h completeness ≥ 99.5 %</text><text x="500.0" y="156.1" font-size="9" font-weight="400" fill="#172b3a" text-anchor="middle">alarm notification ≤ 60 s</text><text x="820.0" y="131.8" font-size="11" font-weight="700" fill="#334155" text-anchor="middle">DCIM and CMMS</text><text x="820.0" y="144.0" font-size="9" font-weight="400" fill="#172b3a" text-anchor="middle">reads BMS and EPMS values</text><text x="820.0" y="156.1" font-size="9" font-weight="400" fill="#172b3a" text-anchor="middle">DDF per device type</text><text x="500.0" y="276.9" font-size="11" font-weight="700" fill="#334155" text-anchor="middle">OT network ring (MRP, IEC 62439-2)</text><text x="500.0" y="289.0" font-size="9" font-weight="400" fill="#172b3a" text-anchor="middle">10 ms profile up to 14 switches · VLANs per system · DMZ to the corporate network</text><text x="180.0" y="414.7" font-size="11" font-weight="700" fill="#475569" text-anchor="middle">BMS controllers</text><text x="180.0" y="426.9" font-size="9" font-weight="400" fill="#172b3a" text-anchor="middle">MS/TP: ≤ 1,200 m, 32 unit loads</text><text x="180.0" y="439.0" font-size="9" font-weight="400" fill="#172b3a" text-anchor="middle">MAC 0 to 127, Max_Master</text><text x="180.0" y="451.2" font-size="9" font-weight="400" fill="#172b3a" text-anchor="middle">BBMD and BDT between subnets</text><text x="500.0" y="414.7" font-size="11" font-weight="700" fill="#475569" text-anchor="middle">Power meters</text><text x="500.0" y="426.9" font-size="9" font-weight="400" fill="#172b3a" text-anchor="middle">ION9000: kW ±0.3 %</text><text x="500.0" y="439.0" font-size="9" font-weight="400" fill="#172b3a" text-anchor="middle">PM5000: kW ±1.0 %</text><text x="500.0" y="451.2" font-size="9" font-weight="400" fill="#172b3a" text-anchor="middle">back-fill from onboard memory</text><text x="820.0" y="414.7" font-size="11" font-weight="700" fill="#475569" text-anchor="middle">Relays and clock</text><text x="820.0" y="426.9" font-size="9" font-weight="400" fill="#172b3a" text-anchor="middle">SOE 1 ms, offset ±1 ms</text><text x="820.0" y="439.0" font-size="9" font-weight="400" fill="#172b3a" text-anchor="middle">IRIG-B B004 from GPS clock</text><text x="820.0" y="451.2" font-size="9" font-weight="400" fill="#172b3a" text-anchor="middle">NTP and PTP for servers</text><text x="45.0" y="545.0" font-size="11" font-weight="700" fill="#172b3a" text-anchor="start">Term</text><text x="305.7" y="545.0" font-size="11" font-weight="700" fill="#172b3a" text-anchor="start">Acceptance value or rule</text><text x="873.0" y="545.0" font-size="11" font-weight="700" fill="#172b3a" text-anchor="start">Sect.</text><text x="45.0" y="567.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">RS-485 pair resistance</text><text x="305.7" y="567.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">about 60 Ω with two 120 Ω terminations</text><text x="873.0" y="567.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">22.4.3</text><text x="45.0" y="589.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">Token rotation</text><text x="305.7" y="589.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">below 1 s on MSC-1 sensor trunks</text><text x="873.0" y="589.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">22.5.1</text><text x="45.0" y="611.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">Loss of communication</text><text x="305.7" y="611.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">alarm within 60 s; other devices unaffected</text><text x="873.0" y="611.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">22.14.1</text><text x="45.0" y="633.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">Time synchronisation</text><text x="305.7" y="633.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">servers within 100 ms, controllers within 1 s</text><text x="873.0" y="633.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">22.17.1</text><text x="45.0" y="655.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">Stale data</text><text x="305.7" y="655.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">flagged when not updated in the expected time</text><text x="873.0" y="655.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">24.15</text><text x="45.0" y="677.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">Back-fill</text><text x="305.7" y="677.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">gap filled from meter memory before the 72 h count</text><text x="873.0" y="677.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">24.13</text><text x="45.0" y="699.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">PRP and HSR</text><text x="305.7" y="699.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">zero lost frames on a link or switch failure</text><text x="873.0" y="699.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">26.13.2</text><text x="45.0" y="721.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">Leak alarm latency</text><text x="305.7" y="721.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">≤ 10 s end to end to the operations centre</text><text x="873.0" y="721.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">25.8.4</text><text x="24.0" y="30.0" font-size="17" font-weight="700" fill="#172b3a" text-anchor="start">F33-7  BMS, EPMS and network terms on one block diagram</text><text x="24.0" y="48.0" font-size="11" font-weight="400" fill="#5b6b78" text-anchor="start">MS/TP ≤ 1,200 m, 32 unit loads, two 120 Ω ends · BMS failover ≤ 60 s · EPMS completeness ≥ 99.5 % in 72 h · SOE 1 ms by IRIG-B · MRP 10 ms with ≤ 14 switches</text><text x="32.0" y="764.0" font-size="10" font-weight="700" fill="#2d6a4f" text-anchor="start">WHAT TO PROVE</text><text x="32.0" y="780.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">• An MS/TP trunk is at most 1,200 m with 32 unit loads and reads about 60 Ω across the pair with both 120 Ω terminations fitted.</text><text x="32.0" y="795.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">• An MRP ring with the 10 ms profile has no more than 14 switches; EPMS data completeness over 72 hours is 99.5 % or more after back-fill.</text><text x="24.0" y="830.0" font-size="10" font-weight="700" fill="#5b6b78" text-anchor="start">LEGEND</text><line x1="24" y1="852.0" x2="50" y2="852.0" stroke="#334155" stroke-width="3"/><text x="56.0" y="856.0" font-size="10" font-weight="400" fill="#172b3a" text-anchor="start">data / network</text><line x1="150.859375" y1="852.0" x2="176.859375" y2="852.0" stroke="#475569" stroke-width="3"/><text x="182.9" y="856.0" font-size="10" font-weight="400" fill="#172b3a" text-anchor="start">signal / control</text><rect x="24" y="870.0" width="952" height="44" rx="0" fill="#f6f8fa" fill-opacity="1" stroke="#5b6b78" stroke-width="1"/><text x="32.0" y="884.0" font-size="11" font-weight="700" fill="#172b3a" text-anchor="start">F33-7  ·  BMS, EPMS and network terms on one block diagram</text><text x="968.0" y="884.0" font-size="10" font-weight="400" fill="#5b6b78" text-anchor="end">Chapter 33 · §33.3.3</text><text x="32.0" y="897.0" font-size="9" font-weight="400" fill="#5b6b78" text-anchor="start">Data Centre Commissioning Field Manual R01 EN · October 2026 · educational reference, not to scale · project and OEM documents govern</text><text x="32.0" y="909.0" font-size="9" font-weight="400" fill="#5b6b78" text-anchor="start">Symbols: QElectroTech EN 60617 and P&amp;ID collections, CC-BY 3.0, native geometry · instrument bubbles per ISA 5.1 · states per IEC 60617 / IEEE C37.2 practice</text></svg>