a hold point before duct backfill, in working hours from the IR time stamp</text><text x="24.0" y="48.0" font-size="10" font-weight="400" fill="#5b6b78" text-anchor="start">IR-B2-ELE-0457 · time-stamped Tuesday 19 May 2026 08:15 · inspection Thursday 09:00 = 18.75 working hours (below the 24 h routine rule, accepted by the Engineer on the IR) · code C · R1 released Friday 22 May 09:00 to 10:00 · backfill only</text><text x="24.0" y="61.0" font-size="10" font-weight="400" fill="#5b6b78" text-anchor="start">after release</text><text x="32.0" y="657.0" font-size="10" font-weight="700" fill="#2d6a4f" text-anchor="start">WHAT TO PROVE</text><text x="32.0" y="673.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">• The IR gave 18.75 working hours of notice; where 24 working hours are required, the inspector may decline and propose a later time, or accept the shorter notice in writing on the IR.</text><text x="32.0" y="688.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">• The rejection at hour 18.75 adds the correction and the R1 re-inspection before backfill can start at hour 28 (Friday 22 May 10:00).</text><rect x="24" y="721.0" width="1352" height="44" rx="0" fill="#f6f8fa" fill-opacity="1" stroke="#5b6b78" stroke-width="1"/><text x="32.0" y="735.0" font-size="11" font-weight="700" fill="#172b3a" text-anchor="start">F07-5  ·  Inspection request timing for a hold point before duct backfill, in working hours from the IR time stamp</text><text x="1368.0" y="735.0" font-size="10" font-weight="400" fill="#5b6b78" text-anchor="end">Chapter 07 · §07.5</text><text x="32.0" y="748.0" font-size="9" font-weight="400" fill="#5b6b78" text-anchor="start">Data Centre Commissioning Field Manual R01 EN · October 2026 · educational reference, not to scale · project and OEM documents govern</text><text x="32.0" y="760.0" font-size="9" font-weight="400" fill="#5b6b78" text-anchor="start">Symbols: QElectroTech EN 60617 and P&amp;ID collections, CC-