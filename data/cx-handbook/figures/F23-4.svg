 stroke-width="0.8"/><rect x="731.4285714285713" y="743.0" width="282.85714285714283" height="21.0" rx="0" fill="#ffffff" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><rect x="1014.2857142857142" y="743.0" width="345.7142857142858" height="21.0" rx="0" fill="#ffffff" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><rect x="40" y="764.0" width="408.57142857142856" height="21.0" rx="0" fill="#ffffff" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><rect x="448.57142857142856" y="764.0" width="282.85714285714283" height="21.0" rx="0" fill="#ffffff" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><rect x="731.4285714285713" y="764.0" width="282.85714285714283" height="21.0" rx="0" fill="#ffffff" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><rect x="1014.2857142857142" y="764.0" width="345.7142857142858" height="21.0" rx="0" fill="#ffffff" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><text x="700.0" y="131.7" font-size="12" font-weight="700" fill="#475569" text-anchor="middle">GPS antenna and receiver</text><text x="700.0" y="145.2" font-size="10" font-weight="400" fill="#172b3a" text-anchor="middle">roof mounted, lightning protected</text><text x="700.0" y="248.2" font-size="12" font-weight="700" fill="#475569" text-anchor="middle">Time server</text><text x="700.0" y="261.6" font-size="10" font-weight="400" fill="#172b3a" text-anchor="middle">PTP grandmaster (IEEE 1588)</text><text x="700.0" y="275.1" font-size="10" font-weight="400" fill="#172b3a" text-anchor="middle">IRIG-B outputs, NTP server</text><text x="700.0" y="288.6" font-size="10" font-weight="400" fill="#172b3a" text-anchor="middle">holdover oscillator</text><text x="320.0" y="406.8" font-size="11.5" font-weight="700" fill="#334155" text-anchor="middle">EPMS switches with PTP support</text><text x="320.0" y="419.6" font-size="9.5" font-weight="400" fill="#172b3a" text-anchor="middle">boundary or transparent clock</text><text x="700.0" y="406.8" font-size="11.5" font-weight="700" fill="#475569" text-anchor="middle">IRIG-B distribution</text><text x="700.0" y="419.6" font-size="9.5" font-weight="400" fill="#172b3a" text-anchor="middle">B00x unmodulated or B12x</text><text x="1080.0" y="406.8" font-size="11.5" font-weight="700" fill="#334155" text-anchor="middle">NTP service</text><text x="1080.0" y="419.6" font-size="9.5" font-weight="400" fill="#172b3a" text-anchor="middle">servers, gateways, firewalls</text><text x="330.0" y="262.0" font-size="11" font-weight="700" fill="#334155" text-anchor="start">PTP</text><text x="1070.0" y="262.0" font-size="11" font-weight="700" fill="#334155" text-anchor="end">NTP</text><text x="710.0" y="350.0" font-size="11" font-weight="700" fill="#475569" text-anchor="start">IRIG-B</text><text x="170.0" y="545.4" font-size="11.5" font-weight="700" fill="#b45309" text-anchor="middle">ION9000</text><text x="170.0" y="558.2" font-size="9.5" font-weight="400" fill="#172b3a" text-anchor="middle">PTP slave</text><text x="170.0" y="571.0" font-size="9.5" font-weight="400" fill="#172b3a" text-anchor="middle">Class A, SOE</text><text x="420.0" y="545.4" font-size="11.5" font-weight="700" fill="#b45309" text-anchor="middle">Easergy P3 relays</text><text x="420.0" y="558.2" font-size="9.5" font-weight="400" fill="#172b3a" text-anchor="middle">PTP or IRIG-B</text><text x="420.0" y="571.0" font-size="9.5" font-weight="400" fill="#172b3a" text-anchor="middle">event log</text><text x="700.0" y="545.4" font-size="11.5" font-weight="700" fill="#b45309" text-anchor="middle">PM8000 (no PTP)</text><text x="700.0" y="558.2" font-size="9.5" font-weight="400" fill="#172b3a" text-anchor="middle">IRIG-B input</text><text x="700.0" y="571.0" font-size="9.5" font-weight="400" fill="#172b3a" text-anchor="middle">1 ms system accuracy</text><text x="980.0" y="545.4" font-size="11.5" font-weight="700" fill="#334155" text-anchor="middle">PME server</text><text x="980.0" y="558.2" font-size="9.5" font-weight="400" fill="#172b3a" text-anchor="middle">NTP client</text><text x="980.0" y="571.0" font-size="9.5" font-weight="400" fill="#172b3a" text-anchor="middle">event log time</text><text x="1220.0" y="545.4" font-size="11.5" font-weight="700" fill="#b45309" text-anchor="middle">PM5000, Link150</text><text x="1220.0" y="558.2" font-size="9.5" font-weight="400" fill="#172b3a" text-anchor="middle">PME time sync</text><text x="1220.0" y="571.0" font-size="9.5" font-weight="400" fill="#172b3a" text-anchor="middle">or SNTP</text><text x="1000.0" y="640.0" font-size="10.5" font-weight="400" fill="#5b6b78" text-anchor="middle">PME sync (Modbus: hourly default)</text><text x="45.0" y="694.3" font-size="10.5" font-weight="700" fill="#172b3a" text-anchor="start">Method</text><text x="453.6" y="694.3" font-size="10.5" font-weight="700" fill="#172b3a" text-anchor="start">Medium</text><text x="736.4" y="694.3" font-size="10.5" font-weight="700" fill="#172b3a" text-anchor="start">Typical accuracy at device</text><text x="1019.3" y="694.3" font-size="10.5" font-weight="700" fill="#172b3a" text-anchor="start">Used for</text><text x="45.0" y="715.3" font-size="10.5" font-weight="400" fill="#172b3a" text-anchor="start">PTP, IEEE 1588 (power profile IEC 61850-9-3 / IEEE C37.238)</text><text x="453.6" y="715.3" font-size="10.5" font-weight="400" fill="#172b3a" text-anchor="start">Ethernet with PTP-aware switches</text><text x="736.4" y="715.3" font-size="10.5" font-weight="400" fill="#172b3a" text-anchor="start">below 1 µs to tens of µs (OEM value)</text><text x="1019.3" y="715.3" font-size="10.5" font-weight="400" fill="#172b3a" text-anchor="start">Class A PQ, SOE across meters and relays</text><text x="45.0" y="736.3" font-size="10.5" font-weight="400" fill="#172b3a" text-anchor="start">IRIG-B (B00x DC level, B12x 1 kHz AM)</text><text x="453.6" y="736.3" font-size="10.5" font-weight="400" fill="#172b3a" text-anchor="start">coaxial, twisted pair or fibre</text><text x="736.4" y="736.3" font-size="10.5" font-weight="400" fill="#172b3a" text-anchor="start">about 1 ms (PM8000 datasheet)</text><text x="1019.3" y="736.3" font-size="10.5" font-weight="400" fill="#172b3a" text-anchor="start">devices without PTP</text><text x="45.0" y="757.3" font-size="10.5" font-weight="400" fill="#172b3a" text-anchor="start">NTP</text><text x="453.6" y="757.3" font-size="10.5" font-weight="400" fill="#172b3a" text-anchor="start">Ethernet</text><text x="736.4" y="757.3" font-size="10.5" font-weight="400" fill="#172b3a" text-anchor="start">about 1 ms to a few ms on a LAN (NTP FAQ)</text><text x="1019.3" y="757.3" font-size="10.5" font-weight="400" fill="#172b3a" text-anchor="start">PME server, gateways, switches, firewalls</text><text x="45.0" y="778.3" font-size="10.5" font-weight="400" fill="#172b3a" text-anchor="start">SNTP or PME software sync</text><text x="453.6" y="778.3" font-size="10.5" font-weight="400" fill="#172b3a" text-anchor="start">Ethernet</text><text x="736.4" y="778.3" font-size="10.5" font-weight="400" fill="#172b3a" text-anchor="start">about 1 s (PM8000 datasheet)</text><text x="1019.3" y="778.3" font-size="10.5" font-weight="400" fill="#172b3a" text-anchor="start">energy meters where SOE is not required</text><text x="24.0" y="30.0" font-size="17" font-weight="700" fill="#172b3a" text-anchor="start">F23-4  Time synchronisation architecture: GPS clock, PTP to Class A meters and relays, IRIG-B to legacy devices, NTP to servers</text><text x="24.0" y="48.0" font-size="10" font-weight="400" fill="#5b6b78" text-anchor="start">one time source per device · PTP (IEEE 1588) over the EPMS network to ION9000 and Easergy P3 · IRIG-B coaxial or fibre where PTP is not supported · NTP or SNTP for PME server, gateways and PM5000 · PME time sync for Modbus devices hourly</text><text x="24.0" y="61.0" font-size="10" font-weight="400" fill="#5b6b78" text-anchor="start">by default</text><text x="32.0" y="821.0" font-size="10" font-weight="700" fill="#2d6a4f" text-anchor="start">WHAT TO PROVE</text><text x="32.0" y="837.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">• A device configured with two external sources (for example PTP and PME time sync) can step its clock; the ION9000 guidance is one external source at a time.</text><text x="32.0" y="852.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">• Typical achieved accuracy: PTP sub-microsecond to tens of microseconds, IRIG-B about 1 ms at the device, NTP about 1 ms to a few ms on a local network, SNTP or PME sync about 1 s; the achieved value is read from each device</text><text x="32.0" y="867.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">manual.</text><text x="24.0" y="902.0" font-size="10" font-weight="700" fill="#5b6b78" text-anchor="start">LEGEND</text><line x1="24" y1="924.0" x2="50" y2="924.0" stroke="#475569" stroke-width="3"/><text x="56.0" y="928.0" font-size="10" font-weight="400" fill="#172b3a" text-anchor="start">signal / control</text><line x1="151.9671875" y1="924.0" x2="177.9671875" y2="924.0" stroke="#334155" stroke-width="3"/><text x="184.0" y="928.0" font-size="10" font-weight="400" fill="#172b3a" text-anchor="start">data / network</text><line x1="278.8265625" y1="924.0" x2="304.8265625" y2="924.0" stroke="#b45309" stroke-width="3"/><text x="310.8" y="928.0" font-size="10" font-weight="400" fill="#172b3a" text-anchor="start">20 kV</text><rect x="24" y="942.0" width="1352" height="44" rx="0" fill="#f6f8fa" fill-opacity="1" stroke="#5b6b78" stroke-width="1"/><text x="32.0" y="956.0" font-size="11" font-weight="700" fill="#172b3a" text-anchor="start">F23-4  ·  Time synchronisation architecture: GPS clock, PTP to Class A meters and relays, IRIG-B to legacy devices, NTP to servers</text><text x="1368.0" y="956.0" font-size="10" font-weight="400" fill="#5b6b78" text-anchor="end">Chapter 23 · §23.7</text><text x="32.0" y="969.0" font-size="9" font-weight="400" fill="#5b6b78" text-anchor="start">Data Centre Commissioning 