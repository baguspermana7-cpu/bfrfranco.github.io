t-size="11.5" font-weight="400" fill="#172b3a" text-anchor="start">CDU, 16 per hall</text><text x="727.6" y="259.4" font-size="11.5" font-weight="400" fill="#172b3a" text-anchor="start">1 Identification</text><text x="45.0" y="282.4" font-size="11.5" font-weight="400" fill="#172b3a" text-anchor="start">System B (receiver)</text><text x="267.6" y="282.4" font-size="11.5" font-weight="400" fill="#172b3a" text-anchor="start">1</text><text x="341.8" y="282.4" font-size="11.5" font-weight="400" fill="#172b3a" text-anchor="start">BMS</text><text x="727.6" y="282.4" font-size="11.5" font-weight="400" fill="#172b3a" text-anchor="start">1 Identification</text><text x="45.0" y="305.4" font-size="11.5" font-weight="400" fill="#172b3a" text-anchor="start">Protocol and medium</text><text x="267.6" y="305.4" font-size="11.5" font-weight="400" fill="#172b3a" text-anchor="start">1</text><text x="341.8" y="305.4" font-size="11.5" font-weight="400" fill="#172b3a" text-anchor="start">Modbus TCP, OT Ethernet</text><text x="727.6" y="305.4" font-size="11.5" font-weight="400" fill="#172b3a" text-anchor="start">3 Physical, 5 Protocol</text><text x="45.0" y="328.4" font-size="11.5" font-weight="400" fill="#172b3a" text-anchor="start">Direction</text><text x="267.6" y="328.4" font-size="11.5" font-weight="400" fill="#172b3a" text-anchor="start">1</text><text x="341.8" y="328.4" font-size="11.5" font-weight="400" fill="#172b3a" text-anchor="start">A↔B: status read, enable written</text><text x="727.6" y="328.4" font-size="11.5" font-weight="400" fill="#172b3a" text-anchor="start">6 Data list, 7 Commands</text><text x="45.0" y="351.4" font-size="11.5" font-weight="400" fill="#172b3a" text-anchor="start">Data items</text><text x="267.6" y="351.4" font-size="11.5" font-weight="400" fill="#172b3a" text-anchor="start">1</text><text x="341.8" y="351.4" font-size="11.5" font-weight="400" fill="#172b3a" text-anchor="start">30 per CDU</text><text x="727.6" y="351.4" font-size="11.5" font-weight="400" fill="#172b3a" text-anchor="start">6 Data list</text><text x="45.0" y="374.4" font-size="11.5" font-weight="400" fill="#172b3a" text-anchor="start">Owner, side A</text><text x="267.6" y="374.4" font-size="11.5" font-weight="400" fill="#172b3a" text-anchor="start">2</text><text x="341.8" y="374.4" font-size="11.5" font-weight="400" fill="#172b3a" text-anchor="start">CDU OEM</text><text x="727.6" y="374.4" font-size="11.5" font-weight="400" fill="#172b3a" text-anchor="start">1 Identification</text><text x="45.0" y="397.4" font-size="11.5" font-weight="400" fill="#172b3a" text-anchor="start">Owner, side B</text><text x="267.6" y="397.4" font-size="11.5" font-weight="400" fill="#172b3a" text-anchor="start">2</text><text x="341.8" y="397.4" font-size="11.5" font-weight="400" fill="#172b3a" text-anchor="start">BMS controls contractor</text><text x="727.6" y="397.4" font-size="11.5" font-weight="400" fill="#172b3a" text-anchor="start">1 Identification</text><text x="45.0" y="420.4" font-size="11.5" font-weight="400" fill="#172b3a" text-anchor="start">ICD reference</text><text x="267.6" y="420.4" font-size="11.5" font-weight="400" fill="#172b3a" text-anchor="start">2</text><text x="341.8" y="420.4" font-size="11.5" font-weight="400" fill="#172b3a" text-anchor="start">ICD-25-021 rev B</text><text x="727.6" y="420.4" font-size="11.5" font-weight="400" fill="#172b3a" text-anchor="start">13 Change history</text><text x="45.0" y="443.4" font-size="11.5" font-weight="400" fill="#172b3a" text-anchor="start">Test level</text><text x="267.6" y="443.4" font-size="11.5" font-weight="400" fill="#172b3a" text-anchor="start">2</text><text x="341.8" y="443.4" font-size="11.5" font-weight="400" fill="#172b3a" text-anchor="start">L3, L4, L5</text><text x="727.6" y="443.4" font-size="11.5" font-weight="400" fill="#172b3a" text-anchor="start">12 Tests</text><text x="45.0" y="466.4" font-size="11.5" font-weight="400" fill="#172b3a" text-anchor="start">Test method</text><text x="267.6" y="466.4" font-size="11.5" font-weight="400" fill="#172b3a" text-anchor="start">2</text><text x="341.8" y="466.4" font-size="11.5" font-weight="400" fill="#172b3a" text-anchor="start">P2P of 30 points; pump failover; IST</text><text x="727.6" y="466.4" font-size="11.5" font-weight="400" fill="#172b3a" text-anchor="start">12 Tests</text><text x="45.0" y="489.4" font-size="11.5" font-weight="400" fill="#172b3a" text-anchor="start">Status</text><text x="267.6" y="489.4" font-size="11.5" font-weight="400" fill="#172b3a" text-anchor="start">both</text><text x="341.8" y="489.4" font-size="11.5" font-weight="400" fill="#172b3a" text-anchor="start">ICD approved to L5 passed</text><text x="727.6" y="489.4" font-size="11.5" font-weight="400" fill="#172b3a" text-anchor="start">1 Identification</text><text x="40.0" y="522.8" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">Test method in full: point-to-point test of all 30 points against the CDU display (L3); pump failover (L4); IST CDU loss (L5).</text><text x="24.0" y="30.0" font-size="17" font-weight="700" fill="#172b3a" text-anchor="start">F25-10  Master interface list: the fields and one filled row traced to its ICD</text><text x="24.0" y="48.0" font-size="11" font-weight="400" fill="#5b6b78" text-anchor="start">12 MIL fields · row IF-021: CDU (16 per hall) to BMS, Modbus TCP, A↔B, 30 data items per CDU · ICD-25-021 rev B, 13 sections · tests L3, L4, L5</text><text x="32.0" y="561.4" font-size="10" font-weight="700" fill="#2d6a4f" text-anchor="start">WHAT TO PROVE</text><text x="32.0" y="577.4" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">• The MIL value and the ICD must agree; IF-021 lists 30 data items, and section 6 of ICD-25-021 lists the same 30 items.</text><text x="32.0" y="592.4" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">• The MIL is first issued at the end of design development and frozen before L4 testing starts.</text><text x="24.0" y="627.4" font-size="10" font-weight="700" fill="#5b6b78" text-anchor="start">LEGEND</text><line x1="24" y1="649.4399999999999" x2="50" y2="649.4399999999999" stroke="#334155" stroke-width="3"/><text x="56.0" y="653.4" font-size="10" font-weight="400" fill="#172b3a" text-anchor="start">data / network</text><line x1="150.859375" y1="649.4399999999999" x2="176.859375" y2="649.4399999999999" stroke="#475569" stroke-width="3"/><text x="182.9" y="653.4" font-size="10" font-weight="400" fill="#172b3a" text-anchor="start">signal / control</text><rect x="24" y="667.4399999999999" width="952" height="44" rx="0" fill="#f6f8fa" fill-opacity="1" stroke="#5b6b78" stroke-width="1"/><text x="32.0" y="681.4" font-size="11" font-weight="700" fill="#172b3a" text-anchor="start">F25-10  ·  Master interface list: the fields and one filled row traced to its ICD</text><text x="968.0" y="681.4" font-size="10" font-weight="400" fill="#5b6b78" text-anchor="end">Chapter 25 · §25.2.3</text><text x="32.0" y="694.4" font-size="9" font-weight="400" fill="#5b6b78" text-anchor="start">Data Centre Commissioning Field Manual R01 EN · October 2026 · educational reference, not to scale · project and OEM documents govern</text><text x="32.0" y="706.4" font-size="9" font-weight="400" fill="#5b6b78" text-anchor="start">Symbols: QElectroTech EN 60617 and P&amp;ID collections, CC-BY 3.0, native geometry · instrument bubbles per ISA 5.1 · states per IEC 60617 / IEEE C37.2 practice</text></svg>