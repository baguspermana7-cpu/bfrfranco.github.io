rt">0.3</text><text x="827.7" y="614.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">pass</text><text x="45.0" y="636.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">E4</text><text x="127.4" y="636.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">1.50 km</text><text x="251.0" y="636.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">bend at splice tray</text><text x="511.9" y="636.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">0.45</text><text x="745.3" y="636.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">0.3</text><text x="827.7" y="636.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">fail; repaired</text><text x="45.0" y="658.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">E5</text><text x="127.4" y="658.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">1.70 km</text><text x="251.0" y="658.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">connector, far-end panel</text><text x="511.9" y="658.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">0.30</text><text x="745.3" y="658.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">0.75</text><text x="827.7" y="658.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">pass</text><circle cx="223.9" cy="155.2" r="4" fill="#b7791f"/><circle cx="296.8" cy="212.1" r="4" fill="#b7791f"/><circle cx="417.5" cy="218.7" r="4" fill="#b7791f"/><circle cx="451.7" cy="217.3" r="4" fill="#b7791f"/><circle cx="497.2" cy="196.1" r="4" fill="#b7791f"/><circle cx="884.4" cy="394.6" r="4" fill="#b7791f"/><text x="24.0" y="30.0" font-size="17" font-weight="700" fill="#172b3a" text-anchor="start">F32-12  OTDR trace drawn from the event table: B2-MDF to CAMPUS-CORE fibre 01, 1550 nm, end A</text><text x="24.0" y="48.0" font-size="10" font-weight="400" fill="#5b6b78" text-anchor="start">launch cord 0 to 0.50 km · link 0.50 to 1.70 km (1.20 km, 0.19 dB/km) · tail cord to 2.20 km · E1 0.32 · E2 0.06 · E3 −0.06 (gainer, average 0.06) · E4 0.45 bend (fail) · E5</text><text x="24.0" y="61.0" font-size="10" font-weight="400" fill="#5b6b78" text-anchor="start">0.30 dB · ghost at 3.40 km = 2 × 1.70 km</text><text x="32.0" y="701.0" font-size="10" font-weight="700" fill="#2d6a4f" text-anchor="start">WHAT TO PROVE</text><text x="32.0" y="717.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">• Link loss from the trace: 0.32 + 0.06 + 0.06 + 0.45 + 0.30 + 1.20 × 0.19 = 1.42 dB at 1550 nm.</text><text x="32.0" y="732.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">• The ghost at 3.40 km is twice the distance of the strong reflection E5 at 1.70 km and shows no loss step.</text><text x="32.0" y="747.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">• E4 (0.45 dB) is above the 0.3 dB splice limit; after re-routing the tray the link loss is 1.01 dB.</text><rect x="24" y="774.0" width="952" height="44" rx="0" fill="#f6f8fa" fill-opacity="1" stroke="#5b6b78" stroke-width="1"/><text x="32.0" y="788.0" font-size="11" font-weight="700" fill="#172b3a" text-anchor="start">F32-12  ·  OTDR trace drawn from the event table: B2-MDF to CAMPUS-CORE fibre 01, 1550 nm, end A</text><text x="968.0" y="788.0" font-size="10" font-weight="400" fill="#5b6b78" text-anchor="end">Chapter 32 · §32.8.2</text><text x="32.0" y="801.0" font-size="9" font-weight="400" fill="#5b6b78" text-anchor="start">Data Centre Commissioning Field Manual R01 EN · October 2026 · educational reference, not to scale · project and OEM documents govern</text><text x="32.0" y="813.0" font-size="9" font-weight="400" fill="#5b6b78" text-anchor="start">Symbols: QElectroTech EN 60617 and P&amp;ID collections, CC-BY 3.0, native geometry · instrument bubbles per ISA 5.1 · states per IEC 60617 / IEEE C37.2 practice</text></svg>