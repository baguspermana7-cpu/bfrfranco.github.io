fb0bb" stroke-width="0.8"/><rect x="776.0" y="741.0" width="184.0" height="23.0" rx="0" fill="#ffffff" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><text x="40.0" y="104.0" font-size="12" font-weight="700" fill="#172b3a" text-anchor="start">Building B2 commissioning dashboard · week 12 · data extracted from the registers at 08:00 WIB</text><text x="262.5" y="152.2" font-size="12" font-weight="700" fill="#b91c1c" text-anchor="middle">1 RFS forecast per hall</text><text x="262.5" y="165.7" font-size="10" font-weight="400" fill="#172b3a" text-anchor="middle">DH1 on track; DH2 late 2 days</text><text x="262.5" y="179.2" font-size="10" font-weight="400" fill="#172b3a" text-anchor="middle">DH3 recovered</text><text x="262.5" y="192.7" font-size="10" font-weight="400" fill="#172b3a" text-anchor="middle">target: objective date per hall</text><text x="737.5" y="152.2" font-size="12" font-weight="700" fill="#b91c1c" text-anchor="middle">2 L3 checklist curve</text><text x="737.5" y="165.7" font-size="10" font-weight="400" fill="#172b3a" text-anchor="middle">1,700 of 2,400 verified (70.8 %)</text><text x="737.5" y="179.2" font-size="10" font-weight="400" fill="#172b3a" text-anchor="middle">plan 2,030 at week 12</text><text x="737.5" y="192.7" font-size="10" font-weight="400" fill="#172b3a" text-anchor="middle">forecast week 16.4 against 16</text><text x="262.5" y="276.2" font-size="12" font-weight="700" fill="#b91c1c" text-anchor="middle">3 L4 first-pass yield</text><text x="262.5" y="289.7" font-size="10" font-weight="400" fill="#172b3a" text-anchor="middle">total 87.3 %, target 90 %</text><text x="262.5" y="303.2" font-size="10" font-weight="400" fill="#172b3a" text-anchor="middle">BMS sequences 74.1 %</text><text x="262.5" y="316.7" font-size="10" font-weight="400" fill="#172b3a" text-anchor="middle">CDU and TCS 81.3 %</text><text x="737.5" y="276.2" font-size="12" font-weight="700" fill="#475569" text-anchor="middle">4 Open issues per week</text><text x="737.5" y="289.7" font-size="10" font-weight="400" fill="#172b3a" text-anchor="middle">180 open at week 12</text><text x="737.5" y="303.2" font-size="10" font-weight="400" fill="#172b3a" text-anchor="middle">peak 203 in week 9</text><text x="737.5" y="316.7" font-size="10" font-weight="400" fill="#172b3a" text-anchor="middle">week 12: raised 44, closed 57</text><text x="262.5" y="400.2" font-size="12" font-weight="700" fill="#b91c1c" text-anchor="middle">5 Issues past their limit</text><text x="262.5" y="413.7" font-size="10" font-weight="400" fill="#172b3a" text-anchor="middle">A 1, B 9, C 22</text><text x="262.5" y="427.2" font-size="10" font-weight="400" fill="#172b3a" text-anchor="middle">limits A 1, B 7, C 30 working days</text><text x="262.5" y="440.7" font-size="10" font-weight="400" fill="#172b3a" text-anchor="middle">target for category A: 0</text><text x="737.5" y="400.2" font-size="12" font-weight="700" fill="#b91c1c" text-anchor="middle">6 RFI cycle time</text><text x="737.5" y="413.7" font-size="10" font-weight="400" fill="#172b3a" text-anchor="middle">median 6 working days</text><text x="737.5" y="427.2" font-size="10" font-weight="400" fill="#172b3a" text-anchor="middle">90th percentile 12 working days</text><text x="737.5" y="440.7" font-size="10" font-weight="400" fill="#172b3a" text-anchor="middle">P2 limit 5 working days</text><text x="262.5" y="524.1" font-size="12" font-weight="700" fill="#475569" text-anchor="middle">7 Sensor and meter checks</text><text x="262.5" y="537.6" font-size="10" font-weight="400" fill="#172b3a" text-anchor="middle">CDU-07 TT-01 drift, TT-02 frozen</text><text x="262.5" y="551.1" font-size="10" font-weight="400" fill="#172b3a" text-anchor="middle">meter B2-DH3-MCC-A1 offline</text><text x="262.5" y="564.6" font-size="10" font-weight="400" fill="#172b3a" text-anchor="middle">flags open: 3</text><text x="737.5" y="524.1" font-size="12" font-weight="700" fill="#b91c1c" text-anchor="middle">8 Data quality</text><text x="737.5" y="537.6" font-size="10" font-weight="400" fill="#172b3a" text-anchor="middle">14 records without asset tags</text><text x="737.5" y="551.1" font-size="10" font-weight="400" fill="#172b3a" text-anchor="middle">rule: tag field filled</text><text x="737.5" y="564.6" font-size="10" font-weight="400" fill="#172b3a" text-anchor="middle">target: 0 failed rules</text><text x="45.0" y="641.6" font-size="11.5" font-weight="700" fill="#172b3a" text-anchor="start">Panel</text><text x="229.0" y="641.6" font-size="11.5" font-weight="700" fill="#172b3a" text-anchor="start">Source</text><text x="781.0" y="641.6" font-size="11.5" font-weight="700" fill="#172b3a" text-anchor="start">Refresh</text><text x="45.0" y="664.6" font-size="11.5" font-weight="400" fill="#172b3a" text-anchor="start">1, 2</text><text x="229.0" y="664.6" font-size="11.5" font-weight="400" fill="#172b3a" text-anchor="start">schedule, checklist register</text><text x="781.0" y="664.6" font-size="11.5" font-weight="400" fill="#172b3a" text-anchor="start">daily</text><text x="45.0" y="687.6" font-size="11.5" font-weight="400" fill="#172b3a" text-anchor="start">3</text><text x="229.0" y="687.6" font-size="11.5" font-weight="400" fill="#172b3a" text-anchor="start">test register</text><text x="781.0" y="687.6" font-size="11.5" font-weight="400" fill="#172b3a" text-anchor="start">daily</text><text x="45.0" y="710.6" font-size="11.5" font-weight="400" fill="#172b3a" text-anchor="start">4, 5</text><text x="229.0" y="710.6" font-size="11.5" font-weight="400" fill="#172b3a" text-anchor="start">issue log</text><text x="781.0" y="710.6" font-size="11.5" font-weight="400" fill="#172b3a" text-anchor="start">daily</text><text x="45.0" y="733.6" font-size="11.5" font-weight="400" fill="#172b3a" text-anchor="start">6</text><text x="229.0" y="733.6" font-size="11.5" font-weight="400" fill="#172b3a" text-anchor="start">RFI log</text><text x="781.0" y="733.6" font-size="11.5" font-weight="400" fill="#172b3a" text-anchor="start">daily</tex