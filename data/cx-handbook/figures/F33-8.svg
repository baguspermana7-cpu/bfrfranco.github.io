-size="11" font-weight="400" fill="#172b3a" text-anchor="start">L2</text><text x="140.2" y="461.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">ELE-L2-UPS-B2-DH3-A1-01</text><text x="552.6" y="461.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">IR at 1,000 V DC; torque marks</text><text x="45.0" y="483.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">L3</text><text x="140.2" y="483.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">ELE-L3-UPS-B2-DH3-A1-01</text><text x="552.6" y="483.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">gate GATE-L3 signed; tag green</text><text x="45.0" y="505.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">L4</text><text x="140.2" y="505.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">UPS-L4-B2-DH3-A1-01</text><text x="552.6" y="505.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">all steps passed or retested</text><text x="45.0" y="527.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">L5</text><text x="140.2" y="527.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">IST-B2-DH3 day 2</text><text x="552.6" y="527.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">IST issues closed or accepted</text><text x="45.0" y="549.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">L6</text><text x="140.2" y="549.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">turnover package per system</text><text x="552.6" y="549.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">DCOps acceptance signed</text><text x="24.0" y="30.0" font-size="17" font-weight="700" fill="#172b3a" text-anchor="start">F33-8  Commissioning levels L0 to L6 with the documents and time limits of each level</text><text x="24.0" y="48.0" font-size="10" font-weight="400" fill="#5b6b78" text-anchor="start">L0 design review 10 working days · FAT procedure approved ≥ 10 working days before L1 · inspection request 24 h · TRR before L4 and L5 · IST entry gate 16 rows ·</text><text x="24.0" y="61.0" font-size="10" font-weight="400" fill="#5b6b78" text-anchor="start">turnover package at L6</text><text x="32.0" y="592.0" font-size="10" font-weight="700" fill="#2d6a4f" text-anchor="start">WHAT TO PROVE</text><text x="32.0" y="608.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">• The FAT procedure is approved at least 10 working days before the test, and a FAT outside Indonesia is notified 15 working days ahead.</text><text x="32.0" y="623.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">• L5 starts only when the 16 IST entry rows are closed or accepted in writing with the affected scenarios removed.</text><text x="24.0" y="658.0" font-size="10" font-weight="700" fill="#5b6b78" text-anchor="start">LEGEND</text><line x1="24" y1="680.0" x2="50" y2="680.0" stroke="#475569" stroke-width="3"/><text x="56.0" y="684.0" font-size="10" font-weight="400" fill="#172b3a" text-anchor="start">signal / control</text><rect x="24" y="698.0" width="952" height="44" rx="0" fill="#f6f8fa" fill-opacity="1" stroke="#5b6b78" stroke-width="1"/><text x="32.0" y="712.0" font-size="11" font-weight="700" fill="#172b3a" text-anchor="start">F33-8  ·  Commissioning levels L0 to L6 with the documents and time limits of each level</text><text x="968.0" y="712.0" font-size="10" font-weight="400" fill="#5b6b78" text-anchor="end">Chapter 33 · §33.4.4</text><text x="32.0" y="725.0" font-size="9" font-weight="400" fill="#5b6b78" text-anchor="start">Data Centre Commissioning Field Manual R01 EN · October 2026 · educational reference, not to scale · project and OEM documents govern</text><text x="32.0" y="737.0" font-size="9" font-weight="400" fill="#5b6b78" text-anchor="start">Symbols: QElectroTech EN 60617 and P&amp;ID collections, CC-BY 3.0, native geome