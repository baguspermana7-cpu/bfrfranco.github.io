ill="#ffffff" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><rect x="201.79487179487177" y="786.0" width="377.94871794871796" height="22.0" rx="0" fill="#ffffff" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><rect x="579.7435897435897" y="786.0" width="343.58974358974353" height="22.0" rx="0" fill="#ffffff" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><rect x="923.3333333333333" y="786.0" width="446.66666666666663" height="22.0" rx="0" fill="#ffffff" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><rect x="30" y="808.0" width="171.79487179487177" height="22.0" rx="0" fill="#ffffff" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><rect x="201.79487179487177" y="808.0" width="377.94871794871796" height="22.0" rx="0" fill="#ffffff" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><rect x="579.7435897435897" y="808.0" width="343.58974358974353" height="22.0" rx="0" fill="#ffffff" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><rect x="923.3333333333333" y="808.0" width="446.66666666666663" height="22.0" rx="0" fill="#ffffff" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><text x="700.0" y="142.8" font-size="11.5" font-weight="700" fill="#334155" text-anchor="middle">Enterprise network</text><text x="700.0" y="155.6" font-size="9.5" font-weight="400" fill="#172b3a" text-anchor="middle">corporate services, remote users</text><text x="460.0" y="272.8" font-size="11.5" font-weight="700" fill="#b91c1c" text-anchor="middle">Firewall 1 (IT side)</text><text x="460.0" y="285.6" font-size="9.5" font-weight="400" fill="#172b3a" text-anchor="middle">stateful, logged</text><text x="700.0" y="266.4" font-size="11.5" font-weight="700" fill="#b91c1c" text-anchor="middle">DMZ servers</text><text x="700.0" y="279.2" font-size="9.5" font-weight="400" fill="#172b3a" text-anchor="middle">historian replica,</text><text x="700.0" y="292.0" font-size="9.5" font-weight="400" fill="#172b3a" text-anchor="middle">jump host, patching</text><text x="940.0" y="272.8" font-size="11.5" font-weight="700" fill="#b91c1c" text-anchor="middle">Firewall 2 (OT side)</text><text x="940.0" y="285.6" font-size="9.5" font-weight="400" fill="#172b3a" text-anchor="middle">conduit rules only</text><text x="700.0" y="404.8" font-size="11.5" font-weight="700" fill="#334155" text-anchor="middle">OT core switches A and B</text><text x="700.0" y="417.6" font-size="9.5" font-weight="400" fill="#172b3a" text-anchor="middle">L3, VRF per system</text><text x="120.0" y="522.9" font-size="11" font-weight="700" fill="#475569" text-anchor="middle">SW1</text><text x="260.0" y="522.9" font-size="11" font-weight="700" fill="#475569" text-anchor="middle">SW2</text><text x="400.0" y="522.9" font-size="11" font-weight="700" fill="#475569" text-anchor="middle">SW3</text><text x="260.0" y="590.0" font-size="10" font-weight="400" fill="#5b6b78" text-anchor="middle">ring closing link (diverse route)</text><text x="260.0" y="612.0" font-size="11" font-weight="700" fill="#475569" text-anchor="middle">EPMS ring (MRP or RSTP)</text><text x="120.0" y="632.0" font-size="10.5" font-weight="400" fill="#172b3a" text-anchor="start">ION9000, P3 relays,</text><text x="120.0" y="646.2" font-size="10.5" font-weight="400" fill="#172b3a" text-anchor="start">MTZ, PM8000, UPS NMC</text><text x="560.0" y="522.9" font-size="11" font-weight="700" fill="#475569" text-anchor="middle">SW1</text><text x="700.0" y="522.9" font-size="11" font-weight="700" fill="#475569" text-anchor="middle">SW2</text><text x="840.0" y="522.9" font-size="11" font-weight="700" fill="#475569" text-anchor="middle">SW3</text><text x="700.0" y="590.0" font-size="10" font-weight="400" fill="#5b6b78" text-anchor="middle">ring closing link (diverse route)</text><text x="700.0" y="612.0" font-size="11" font-weight="700" fill="#475569" text-anchor="middle">BMS ring (RSTP)</text><text x="560.0" y="632.0" font-size="10.5" font-weight="400" fill="#172b3a" text-anchor="start">controllers, CDU PLCs,</text><text x="560.0" y="646.2" font-size="10.5" font-weight="400" fill="#172b3a" text-anchor="start">CRAH, chiller panels</text><text x="1000.0" y="522.9" font-size="11" font-weight="700" fill="#475569" text-anchor="middle">SW1</text><text x="1140.0" y="522.9" font-size="11" font-weight="700" fill="#475569" text-anchor="middle">SW2</text><text x="1280.0" y="522.9" font-size="11" font-weight="700" fill="#475569" text-anchor="middle">SW3</text><text x="1140.0" y="590.0" font-size="10" font-weight="400" fill="#5b6b78" text-anchor="middle">ring closing link (diverse route)</text><text x="1140.0" y="612.0" font-size="11" font-weight="700" fill="#475569" text-anchor="middle">Security and fire</text><text x="1000.0" y="632.0" font-size="10.5" font-weight="400" fill="#172b3a" text-anchor="start">access control, CCTV</text><text x="1000.0" y="646.2" font-size="10.5" font-weight="400" fill="#172b3a" text-anchor="start">fire panel read-only</text><text x="35.0" y="735.0" font-size="11" font-weight="700" fill="#172b3a" text-anchor="start">Zone</text><text x="206.8" y="735.0" font-size="11" font-weight="700" fill="#172b3a" text-anchor="start">Cabling</text><text x="584.7" y="735.0" font-size="11" font-weight="700" fill="#172b3a" text-anchor="start">Typical VLAN and subnet (example)</text><text x="928.3" y="735.0" font-size="11" font-weight="700" fill="#172b3a" text-anchor="start">Allowed flows</text><text x="35.0" y="757.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">EPMS</text><text x="206.8" y="757.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">OS2 risers, OM4 in rooms, Cat 6A to meters</text><text x="584.7" y="757.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">VLAN 110, 10.21.10.0/24</text><text x="928.3" y="757.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">devices to PME only; PME to DMZ historian</text><text x="35.0" y="779.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">BMS</text><text x="206.8" y="779.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">OS2 risers, Cat 6A to controllers</text><text x="584.7" y="779.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">VLAN 120, 10.21.20.0/23</text><text x="928.3" y="779.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">controllers to BMS servers; BMS read of EPMS gateway</text><text x="35.0" y="801.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">Security and fire</text><text x="206.8" y="801.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">OS2, Cat 6A</text><text x="584.7" y="801.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">VLAN 130, 10.21.30.0/24</text><text x="928.3" y="801.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">read-only fire status to BMS</text><text x="35.0" y="823.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">Management</text><text x="206.8" y="823.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">out-of-band copper</text><text x="584.7" y="823.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">VLAN 199, 10.21.99.0/24</text><text x="928.3" y="823.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">switch management from jump host only</text><text x="24.0" y="30.0" font-size="17" font-weight="700" fill="#172b3a" text-anchor="start">F26-1  OT network for one MSC-1 building: core, distribution rings, access switches and the DMZ</text><text x="24.0" y="48.0" font-size="11" font-weight="400" fill="#5b6b78" text-anchor="start">enterprise IT, OT DMZ and OT zones separated by two firewall layers · EPMS ring and BMS ring on separate switches · OS2 fibre between rooms, OM4 inside rooms, Cat 6A to devices · VLANs per system</text><text x="32.0" y="866.0" font-size="10" font-weight="700" fill="#2d6a4f" text-anchor="start">WHAT TO PROVE</text><text x="32.0" y="882.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">• No device in the EPMS or BMS VLANs has a route to the enterprise network; the firewall rule base shows only DMZ-initiated or OT-initiated flows listed in the conduit table.</text><text x="32.0" y="897.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">• Each ring has two fibre paths on diverse routes (east and west risers), so a single cable cut is a test case in the ring failover test.</text><text x="24.0" y="932.0" font-size="10" font-weight="700" fill="#5b6b78" text-anchor="start">LEGEND</text><line x1="24" y1="954.0" x2="50" y2="954.0" stroke="#334155" stroke-width="3"/><text x="56.0" y="958.0" font-size="10" font-weight="400" fill="#172b3a" text-anchor="start">data / network</text><line x1="150.859375" y1="954.0" x2="176.859375" y2="954.0" stroke="#b91c1c" stroke-width="3"/><text x="182.9" y="958.0" font-size="10" font-weight="400" fill="#172b3a" text-anchor="start">trip / protection</text><line x1="282.8265625" y1="954.0" x2="308.8265625" y2="954.0" stroke="#475569" stroke-width="3"/><text x="314.8" y="958.0" font-size="10" font-weight="400" fill="#172b3a" text-anchor="start">signal / control</text><rect x="24" y="972.0" width="1352" height="44" rx="0" fill="#f6f8fa" fill-opacity="1" stroke="#5b6b78" stroke-width="1"/><text x="32.0" y="986.0" font-size="11" font-weight="700" fill="#172b3a" text-anchor="start">F26-1  ·  OT network for one MSC-1 building: core, distribution rings, access switches and the DMZ</text><text x="1368.0" y="986.0" font-size="10" font-weight="400" fill="#5b6b78" text-anchor="end">Chapter 26 · §26.1</text><text x="32.0" y="999.0" font-size="9" font-weight="400" fill="#5b6b78" text-anchor="start">Data Centre Commissioning Field Manual R01 EN · October 2026 · educational reference, not to scale · project and OEM documents govern</text><text x="32.0" y="1011.0" font-size="9" font-weight="400" fill="#5b6b78" text-anchor="start">Symbols: QElectroTech EN 60617 and P&amp;ID collections, CC-BY 3.0, native geometry · instrument bubbles per ISA 5.1 · states per IEC 60617 / IEEE C37.2 practice</text></svg>