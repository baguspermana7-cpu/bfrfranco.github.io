or</text><text x="392.0" y="218.6" font-size="9.5" font-weight="400" fill="#172b3a" text-anchor="start">R. Wibowo, LV subcontractor</text><text x="872.0" y="205.8" font-size="11.5" font-weight="700" fill="#172b3a" text-anchor="start">Discipline</text><text x="872.0" y="218.6" font-size="9.5" font-weight="400" fill="#172b3a" text-anchor="start">ELE</text><text x="1112.0" y="205.8" font-size="11.5" font-weight="700" fill="#172b3a" text-anchor="start">Trigger</text><text x="1112.0" y="218.6" font-size="9.5" font-weight="400" fill="#172b3a" text-anchor="start">conflict</text><text x="60.0" y="270.0" font-size="12" font-weight="700" fill="#5b6b78" text-anchor="start">Section 2: location and references</text><text x="72.0" y="301.8" font-size="11.5" font-weight="700" fill="#172b3a" text-anchor="start">Location and tag</text><text x="72.0" y="314.6" font-size="9.5" font-weight="400" fill="#172b3a" text-anchor="start">B2-00-LV3, B2-DH3-LVMSB-A1</text><text x="492.0" y="301.8" font-size="11.5" font-weight="700" fill="#172b3a" text-anchor="start">Drawing and specification references</text><text x="492.0" y="314.6" font-size="9.5" font-weight="400" fill="#172b3a" text-anchor="start">MSC1-EDC-B2-00-DR-E-2101 C02; MSC1-LVS-B2-00-SH-X-0012 C01; 26 24 13 cl. 2.6.B</text><text x="60.0" y="366.0" font-size="12" font-weight="700" fill="#5b6b78" text-anchor="start">Section 3: question and proposed solution</text><text x="72.0" y="398.4" font-size="11.5" font-weight="700" fill="#334155" text-anchor="start">Question</text><text x="72.0" y="411.2" font-size="9.5" font-weight="400" fill="#172b3a" text-anchor="start">Confirm the CT ratio for the metering CTs</text><text x="72.0" y="424.0" font-size="9.5" font-weight="400" fill="#172b3a" text-anchor="start">of the block LV main incomer.</text><text x="732.0" y="398.4" font-size="11.5" font-weight="700" fill="#334155" text-anchor="start">Proposed solution</text><text x="732.0" y="411.2" font-size="9.5" font-weight="400" fill="#172b3a" text-anchor="start">4000/5 A class 0.5S; meter primary setting 4000</text><text x="732.0" y="424.0" font-size="9.5" font-weight="400" fill="#172b3a" text-anchor="start">(full-load current 3,478 A)</text><text x="60.0" y="476.0" font-size="12" font-weight="700" fill="#5b6b78" text-anchor="start">Section 4: impact, dates and routing</text><text x="72.0" y="507.8" font-size="11.5" font-weight="700" fill="#172b3a" text-anchor="start">Cost impact</text><text x="72.0" y="520.6" font-size="9.5" font-weight="400" fill="#172b3a" text-anchor="start">N</text><text x="292.0" y="507.8" font-size="11.5" font-weight="700" fill="#172b3a" text-anchor="start">Time impact</text><text x="292.0" y="520.6" font-size="9.5" font-weight="400" fill="#172b3a" text-anchor="start">Y if no answer by 10 Jun</text><text x="572.0" y="507.8" font-size="11.5" font-weight="700" fill="#172b3a" text-anchor="start">Required by</text><text x="572.0" y="520.6" font-size="9.5" font-weight="400" fill="#172b3a" text-anchor="start">10 Jun 2026, B2-LV-FAT-03</text><text x="832.0" y="507.8" font-size="11.5" font-weight="700" fill="#172b3a" text-anchor="start">Priority</text><text x="832.0" y="520.6" font-size="9.5" font-weight="400" fill="#172b3a" text-anchor="start">P2</text><text x="1012.0" y="507.8" font-size="11.5" font-weight="700" fill="#172b3a" text-anchor="start">Assignee and distribution</text><text x="1012.0" y="520.6" font-size="9.5" font-weight="400" fill="#172b3a" text-anchor="start">design lead; GC, CxM, CxA, owner</text><text x="60.0" y="572.0" font-size="12" font-weight="700" fill="#5b6b78" text-anchor="start">Section 5: response and closure</text><text x="72.0" y="604.4" font-size="11.5" font-weight="700" fill="#475569" text-anchor="start">Response</text><text x="72.0" y="617.2" font-size="9.5" font-weight="400" fill="#172b3a" text-anchor="start">Proposed solution accepted; 3200/5 A is below full-load current;</text><text x="72.0" y="630.0" font-size="9.5" font-weight="400" fill="#172b3a" text-anchor="start">applies to all 24 block LV mains of B2 and to B1, B3, B4.</text><text x="852.0" y="610.8" font-size="11.5" font-weight="700" fill="#475569" text-anchor="start">Classification</text><text x="852.0" y="623.6" font-size="9.5" font-weight="400" fill="#172b3a" text-anchor="start">clarification</text><text x="1112.0" y="610.8" font-size="11.5" font-weight="700" fill="#475569" text-anchor="start">Status and closure</text><text x="1112.0" y="623.6" font-size="9.5" font-weight="400" fill="#172b3a" text-anchor="start">closed 09 Jun 2026</text><text x="24.0" y="30.0" font-size="17" font-weight="700" fill="#172b3a" text-anchor="start">F05-4  RFI form layout with the required fields</text><text x="24.0" y="48.0" font-size="11" font-weight="400" fill="#5b6b78" text-anchor="start">Header, references, question and proposed solution, impact and dates, response and closure · example RFI-B2-ELE-0142</text><text x="32.0" y="692.0" font-size="10" font-weight="700" fill="#2d6a4f" text-anchor="start">WHAT TO PROVE</text><text x="32.0" y="708.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">• The title names the system, location and conflict; every drawing reference carries its revision.</text><text x="32.0" y="723.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">• Cost and time impact are entered as yes, no or unknown with the activity affected and a required-by date taken from the programme.</text><text x="24.0" y="758.0" font-size="10" font-weight="700" fill="#5b6b78" text-anchor="start">LEGEND</text><line x1="24" y1="780" x2="50" y2="780" stroke="#334155" stroke-width="3"/><text x="56.0" y="784.0" font-size="10" font-weight="400" fill="#172b3a" text-anchor="start">data / network</text><line x1="150.859375" y1="780" x2="176.859375" y2="780" stroke="#475569" stroke-width="3"/><text x="182.9" y="784.0" font-size="10" font-weight="400" fill="#172b3a" text-anchor="start">signal / control</text><rect x="24" y="798" width="1352" height="44" 