" y="321.5" font-size="11.5" font-weight="700" fill="#172b3a" text-anchor="middle">Y</text><text x="675.0" y="321.5" font-size="11.5" font-weight="700" fill="#172b3a" text-anchor="middle">Y</text><text x="865.0" y="321.5" font-size="11.5" font-weight="700" fill="#172b3a" text-anchor="middle">Y</text><text x="1055.0" y="321.5" font-size="11.5" font-weight="700" fill="#172b3a" text-anchor="middle">Y</text><text x="1255.0" y="321.5" font-size="11.5" font-weight="700" fill="#172b3a" text-anchor="middle">pass</text><text x="46.0" y="345.9" font-size="11.5" font-weight="400" fill="#172b3a" text-anchor="start">Configuration backed up</text><text x="490.0" y="345.9" font-size="11.5" font-weight="700" fill="#172b3a" text-anchor="middle">Y</text><text x="675.0" y="345.9" font-size="11.5" font-weight="700" fill="#172b3a" text-anchor="middle">Y</text><text x="865.0" y="345.9" font-size="11.5" font-weight="700" fill="#172b3a" text-anchor="middle">Y</text><text x="1055.0" y="345.9" font-size="11.5" font-weight="700" fill="#172b3a" text-anchor="middle">Y</text><text x="1255.0" y="345.9" font-size="11.5" font-weight="700" fill="#172b3a" text-anchor="middle">pass</text><text x="46.0" y="370.2" font-size="11.5" font-weight="400" fill="#172b3a" text-anchor="start">Unused switch ports shut</text><text x="490.0" y="370.2" font-size="11.5" font-weight="700" fill="#172b3a" text-anchor="middle">n/a</text><text x="675.0" y="370.2" font-size="11.5" font-weight="700" fill="#172b3a" text-anchor="middle">n/a</text><text x="865.0" y="370.2" font-size="11.5" font-weight="700" fill="#172b3a" text-anchor="middle">Y</text><text x="1055.0" y="370.2" font-size="11.5" font-weight="700" fill="#172b3a" text-anchor="middle">n/a</text><text x="1255.0" y="370.2" font-size="11.5" font-weight="700" fill="#172b3a" text-anchor="middle">14 ports shut</text><text x="24.0" y="30.0" font-size="17" font-weight="700" fill="#172b3a" text-anchor="start">F27-4  Hardening checklist matrix: controls by device type and the result of the B2 sample check</text><text x="24.0" y="48.0" font-size="11" font-weight="400" fill="#5b6b78" text-anchor="start">sample: 100 % of servers, firewalls and core switches; 10 % of each field device type (minimum 3) · Y = required and checked · S = where the product supports it · n/a = not applicable · one default credential found is a category A issue</text><text x="32.0" y="414.2" font-size="10" font-weight="700" fill="#2d6a4f" text-anchor="start">WHAT TO PROVE</text><text x="32.0" y="430.2" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">• Default passwords are changed on every device type; the sample check found 0 devices that accept a vendor default credential.</text><text x="32.0" y="445.2" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">• Telnet 23, FTP 21 and HTTP 80 are closed on each sampled device where the product allows their removal, shown by the port scan.</text><rect x="24" y="478.18" width="1352" height="44" rx="0" fill="#f6f8fa" fill-opacity="1" stroke="#5b6b78" stroke-width="1"/><text x="32.0" y="492.2" font-size="11" font-weight="700" fill="#172b3a" text-anchor="start">F27-4  ·  Hardening checklist matrix: controls by device type and the result of the B2 sample check</text><text x="1368.0" y="492.2" font-size="10" font-weight="400" fill="#5b6b78" text-anchor="end">Chapter 27 · §27.11</text><text x="32.0" y="505.2" font-size="9" font-weight="400" fill="#5b6b78" text-anchor="start">Data Centre Commissioning Field Manual R01 EN · October 2026 · educational reference, not to scale · project and OEM documents govern</text><text x="32.0" y="517.2" font-size="9" font-weight="400" fill="#5b6b78" text-anchor="start">Symbols: QElectroTech EN 60617 and P&amp;ID collections, CC-BY 3.0, native geometry · instrument bubbles per ISA 5.1 · states per IEC 60617 / IEEE C37.2 practice</text></svg>