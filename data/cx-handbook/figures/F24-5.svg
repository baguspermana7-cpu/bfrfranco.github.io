0" height="22.0" rx="0" fill="#ffffff" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><rect x="304.0" y="656.0" width="1056.0" height="22.0" rx="0" fill="#ffffff" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><rect x="40" y="678.0" width="264.0" height="22.0" rx="0" fill="#ffffff" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><rect x="304.0" y="678.0" width="1056.0" height="22.0" rx="0" fill="#ffffff" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><text x="150.0" y="143.3" font-size="11.5" font-weight="700" fill="#475569" text-anchor="middle">GPS antenna</text><text x="150.0" y="156.2" font-size="9.5" font-weight="400" fill="#172b3a" text-anchor="middle">shared roof antenna</text><text x="150.0" y="169.0" font-size="9.5" font-weight="400" fill="#172b3a" text-anchor="middle">or own GPS receiver</text><text x="150.0" y="287.5" font-size="11.5" font-weight="700" fill="#b91c1c" text-anchor="middle">Secondary test set</text><text x="150.0" y="300.4" font-size="9.5" font-weight="400" fill="#172b3a" text-anchor="middle">GPS synchronised</text><text x="150.0" y="313.2" font-size="9.5" font-weight="400" fill="#172b3a" text-anchor="middle">binary output BO1</text><text x="150.0" y="326.0" font-size="9.5" font-weight="400" fill="#172b3a" text-anchor="middle">pulse at whole second</text><text x="150.0" y="338.8" font-size="9.5" font-weight="400" fill="#172b3a" text-anchor="middle">repeat 10 times</text><text x="460.0" y="149.8" font-size="11.5" font-weight="700" fill="#475569" text-anchor="middle">EPMS time server</text><text x="460.0" y="162.6" font-size="9.5" font-weight="400" fill="#172b3a" text-anchor="middle">PTP, IRIG-B, NTP</text><text x="460.0" y="293.9" font-size="11.5" font-weight="700" fill="#b91c1c" text-anchor="middle">Test terminal block</text><text x="460.0" y="306.8" font-size="9.5" font-weight="400" fill="#172b3a" text-anchor="middle">BO1 split to 5 pairs</text><text x="460.0" y="319.6" font-size="9.5" font-weight="400" fill="#172b3a" text-anchor="middle">twisted pair, &lt; 10 m</text><text x="460.0" y="332.4" font-size="9.5" font-weight="400" fill="#172b3a" text-anchor="middle">polarity checked</text><text x="830.0" y="133.8" font-size="11.5" font-weight="700" fill="#b45309" text-anchor="middle">ION9000 DI1</text><text x="830.0" y="146.6" font-size="9.5" font-weight="400" fill="#172b3a" text-anchor="middle">input debounce recorded</text><text x="830.0" y="223.8" font-size="11.5" font-weight="700" fill="#b45309" text-anchor="middle">Easergy P3 DI3</text><text x="830.0" y="236.6" font-size="9.5" font-weight="400" fill="#172b3a" text-anchor="middle">input debounce recorded</text><text x="830.0" y="313.8" font-size="11.5" font-weight="700" fill="#b45309" text-anchor="middle">MTZ via IO module</text><text x="830.0" y="326.6" font-size="9.5" font-weight="400" fill="#172b3a" text-anchor="middle">input debounce recorded</text><text x="830.0" y="403.8" font-size="11.5" font-weight="700" fill="#b45309" text-anchor="middle">PM8000 DI1</text><text x="830.0" y="416.6" font-size="9.5" font-weight="400" fill="#172b3a" text-anchor="middle">input debounce recorded</text><text x="830.0" y="493.8" font-size="11.5" font-weight="700" fill="#b45309" text-anchor="middle">PM5000 DI1</text><text x="830.0" y="506.6" font-size="9.5" font-weight="400" fill="#172b3a" text-anchor="middle">input debounce recorded</text><text x="1210.0" y="293.9" font-size="11.5" font-weight="700" fill="#334155" text-anchor="middle">PME</text><text x="1210.0" y="306.8" font-size="9.5" font-weight="400" fill="#172b3a" text-anchor="middle">event log and</text><text x="1210.0" y="319.6" font-size="9.5" font-weight="400" fill="#172b3a" text-anchor="middle">Alarms application</text><text x="1210.0" y="332.4" font-size="9.5" font-weight="400" fill="#172b3a" text-anchor="middle">SOE report export</text><text x="460.0" y="220.0" font-size="10.5" font-weight="400" fill="#475569" text-anchor="middle">time to all devices (F23-4)</text><text x="45.0" y="605.0" font-size="11" font-weight="700" fill="#172b3a" text-anchor="start">Set-up item</text><text x="309.0" y="605.0" font-size="11" font-weight="700" fill="#172b3a" text-anchor="start">Value or requirement</text><text x="45.0" y="627.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">Test set</text><text x="309.0" y="627.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">GPS-synchronised secondary injection set, binary output time accuracy better than 100 µs (check the calibration certificate)</text><text x="45.0" y="649.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">Contact</text><text x="309.0" y="649.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">one output, potential-free, wetted at the input voltage of each device (24 V DC or 110 V DC as specified)</text><text x="45.0" y="671.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">Repeats</text><text x="309.0" y="671.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">10 injections at whole GPS seconds, 30 s apart; open and close transitions recorded</text><text x="45.0" y="693.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">Reading</text><text x="309.0" y="693.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">device event log by ION Setup or relay software, and PME event log or Alarms export</text><text x="24.0" y="30.0" font-size="17" font-weight="700" fill="#172b3a" text-anchor="start">F24-5  SOE test set-up: GPS-synchronised secondary test set driving the same contact into five devices</text><text x="24.0" y="48.0" font-size="11" font-weight="400" fill="#5b6b78" text-anchor="start">test set with GPS or PTP time reference · one dry contact split to five binary inputs through a test terminal block · injection at a whole GPS second · 10 repeats · result read from each device log and from PME</text><text x="32.0" y="736.0" font-size="10" font-weight="700" fill="#2d6a4f" text-anchor="start">WHAT TO PROVE</text><text x="32.0" y="752.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">• The contact is wired in parallel to every binary input so that all devices see the same physical change; separate outputs would add the test-set output skew.</text><text x="32.0" y="767.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">• Ten repeats give the mean and the spread; the record shows each repeat, the debounce setting and the corrected time.</text><text x="24.0" y="802.0" font-size="10" font-weight="700" fill="#5b6b78" text-anchor="start">LEGEND</text><line x1="24" y1="824.0" x2="50" y2="824.0" stroke="#475569" stroke-width="3"/><text x="56.0" y="828.0" font-size="10" font-weight="400" fill="#172b3a" text-anchor="start">signal / control</text><line x1="151.9671875" y1="824.0" x2="177.9671875" y2="824.0" stroke="#b91c1c" stroke-width="3"/><text x="184.0" y="828.0" font-size="10" font-weight="400" fill="#172b3a" text-anchor="start">trip / protection</text><line x1="283.934375" y1="824.0" x2="309.934375" y2="824.0" stroke="#b45309" stroke-width="3"/><text x="315.9" y="828.0" font-size="10" font-weight="400" fill="#172b3a" text-anchor="start">20 kV</text><line x1="366.46875" y1="824.0" x2="392.46875" y2="824.0" stroke="#334155" stroke-width="3"/><text x="398.5" y="828.0" font-size="10" font-weight="400" fill="#172b3a" text-anchor="start">data / network</text><rect x="24" y="842.0" width="1352" height="44" rx="0" fill="#f6f8fa" fill-opacity="1" stroke="#5b6b78" stroke-width="1"/><text x="32.0" y="856.0" font-size="11" font-weight="700" fill="#172b3a" text-anchor="start">F24-5  ·  SOE test set-up: GPS-synchronised secondary test set driving the same contact into five devices</text><text x="1368.0" y="856.0" font-size="10" font-weight="400" fill="#5b6b78" text-anchor="end">Chapter 24 · §24.10</text><text x="32.0" y="869.0" font-size="9" font-weight="400" fill="#5b6b78" text-anchor="start">Data Centre Commissioning Field Manual R01 EN · October 2026 · educational reference, not to scale · project and OEM documents govern</text><text x="32.0" y="881.0" font-size="9" font-weight="400" fill="#5b6b78" text-anchor="start">Symbols: QElectroTech EN 60617 and P&amp;ID collections, CC-BY 3.0, native geometry · instrument bubbles per ISA 5.1 · states per IEC 60617 / IEEE C37.2 practice</text></svg>