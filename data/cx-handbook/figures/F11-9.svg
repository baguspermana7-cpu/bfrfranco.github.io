9fb0bb" stroke-width="0.8"/><rect x="662.3529411764706" y="456.0" width="162.35294117647058" height="24.0" rx="0" fill="#ffffff" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><rect x="824.7058823529412" y="456.0" width="135.29411764705884" height="24.0" rx="0" fill="#ffffff" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><text x="40.0" y="110.0" font-size="13" font-weight="700" fill="#172b3a" text-anchor="start">Open actions by age band (bar length = number of actions)</text><text x="40.0" y="157.0" font-size="12" font-weight="400" fill="#172b3a" text-anchor="start">0 to 7 days</text><text x="764.0" y="157.0" font-size="12" font-weight="700" fill="#172b3a" text-anchor="start">41 (48 %)</text><text x="40.0" y="209.0" font-size="12" font-weight="400" fill="#172b3a" text-anchor="start">8 to 14 days</text><text x="536.0" y="209.0" font-size="12" font-weight="700" fill="#172b3a" text-anchor="start">22 (26 %)</text><text x="40.0" y="261.0" font-size="12" font-weight="400" fill="#172b3a" text-anchor="start">15 to 30 days</text><text x="452.0" y="261.0" font-size="12" font-weight="700" fill="#172b3a" text-anchor="start">15 (17 %)</text><text x="40.0" y="313.0" font-size="12" font-weight="400" fill="#172b3a" text-anchor="start">more than 30 days</text><text x="368.0" y="313.0" font-size="12" font-weight="700" fill="#172b3a" text-anchor="start">8 (9 %)</text><text x="45.0" y="376.3" font-size="12" font-weight="700" fill="#172b3a" text-anchor="start">KPI</text><text x="315.6" y="376.3" font-size="12" font-weight="700" fill="#172b3a" text-anchor="start">Value on 7 Nov 2026</text><text x="667.4" y="376.3" font-size="12" font-weight="700" fill="#172b3a" text-anchor="start">Target</text><text x="829.7" y="376.3" font-size="12" font-weight="700" fill="#172b3a" text-anchor="start">Status</text><text x="45.0" y="400.3" font-size="12" font-weight="400" fill="#172b3a" text-anchor="start">Overdue actions</text><text x="315.6" y="400.3" font-size="12" font-weight="400" fill="#172b3a" text-anchor="start">13 / 86 = 15.1 %</text><text x="667.4" y="400.3" font-size="12" font-weight="400" fill="#172b3a" text-anchor="start">≤ 10 %</text><text x="829.7" y="400.3" font-size="12" font-weight="400" fill="#172b3a" text-anchor="start">not met</text><text x="45.0" y="424.3" font-size="12" font-weight="400" fill="#172b3a" text-anchor="start">Median age of open actions</text><text x="315.6" y="424.3" font-size="12" font-weight="400" fill="#172b3a" text-anchor="start">9.5 days (43rd and 44th: 9 and 10)</text><text x="667.4" y="424.3" font-size="12" font-weight="400" fill="#172b3a" text-anchor="start">≤ 10 days</text><text x="829.7" y="424.3" font-size="12" font-weight="400" fill="#172b3a" text-anchor="start">met</text><text x="45.0" y="448.3" font-size="12" font-weight="400" fill="#172b3a" text-anchor="start">Actions closed per week</text><text x="315.6" y="448.3" font-size="12" font-weight="400" fill="#172b3a" text-anchor="start">27 closed, 31 raised</text><text x="667.4" y="448.3" font-size="12" font-weight="400" fill="#172b3a" text-anchor="start">at least raised</text><text x="829.7" y="448.3" font-size="12" font-weight="400" fill="#172b3a" text-anchor="start">not met</text><text x="45.0" y="472.3" font-size="12" font-weight="400" fill="#172b3a" text-anchor="start">Older than 30 days</text><text x="315.6" y="472.3" font-size="12" font-weight="400" fill="#172b3a" text-anchor="start">8 actions</text><text x="667.4" y="472.3" font-size="12" font-weight="400" fill="#172b3a" text-anchor="start">named in report</text><text x="829.7" y="472.3" font-size="12" font-weight="400" fill="#172b3a" text-anchor="start">escalated</text><text x="40.0" y="520.0" font-size="12" font-weight="400" fill="#172b3a" text-anchor="start">Escalation rule (11.4.2): an action overdue by more than 7 days is named in the weekly report and raised with the owner&#x27;s manager.</text><text x="24.0" y="30.0" font-size="17" font-weight="700" fill="#172b3a" text-anchor="start">F11-9  Action ageing, building B1, 7 Nov 2026</text><text x="24.0" y="48.0" font-size="11" font-weight="400" fill="#5b6b78" text-anchor="start">86 open actions · 13 past due = 15.1 % (target ≤ 10 %) · median age 9.5 days (target ≤ 10) · raised 31, closed 27 in the week</text><text x="32.0" y="558.9" font-size="10" font-weight="700" fill="#2d6a4f" text-anchor="start">WHAT TO PROVE</text><text x="32.0" y="574.9" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">• Overdue share = 13 / 86 = 15.1 %, above the 10 % target; median age 9.5 days meets the 10-day target.</text><text x="32.0" y="589.9" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">• 31 actions raised and 27 closed, so the open count grows by 4; the CxM asks for a closure date for each of the 13 overdue actions.</text><rect x="24" y="622.88" width="952" height="44" rx="0" fill="#f6f8fa" fill-opacity="1" stroke="#5b6b78" stroke-width="1"/><text x="32.0" y="636.9" font-size="11" font-weight="700" fill="#172b3a" text-anchor="start">F11-9  ·  Action ageing, building B1, 7 Nov 2026</text><text x="968.0" y="636.9" font-size="10" font-weight="400" fill="#5b6b78" text-anchor="end">Chapter 11 · §11.4.2</text><text x="32.0" y="649.9" font-size="9" font-weight="400" fill="#5b6b78" text-anchor="start">Data Centre Commissioning Field Manual R01 EN · October 2026 · educational reference, not to scale · project and OEM documents govern</text><text x="32.0" y="661.9" font-size="9" font-weight="400" fill="#5b6b78" text-anchor="start">Symbols: QElectroTech EN 60617 and P&amp;ID collections, CC-BY 3.0, native geometry · instrument bubbles per ISA 5.1 · states per IEC 60617 / IEEE C37.2 practice</text></svg>