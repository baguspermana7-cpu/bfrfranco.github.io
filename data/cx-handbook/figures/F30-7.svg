<text x="597.0" y="662.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">1.26</text><text x="764.3" y="662.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">1.26</text><text x="45.0" y="684.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">3</text><text x="212.3" y="684.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">9.0</text><text x="379.5" y="684.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">11.03</text><text x="597.0" y="684.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">1.23</text><text x="764.3" y="684.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">1.23</text><text x="45.0" y="706.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">4</text><text x="212.3" y="706.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">12.0</text><text x="379.5" y="706.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">14.53</text><text x="597.0" y="706.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">1.21</text><text x="764.3" y="706.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">1.21</text><circle cx="184.5" cy="240.0" r="4" fill="#b7791f"/><circle cx="408.2" cy="333.0" r="4" fill="#b7791f"/><circle cx="631.8" cy="367.0" r="4" fill="#b7791f"/><circle cx="855.5" cy="380.3" r="4" fill="#b7791f"/><text x="24.0" y="30.0" font-size="17" font-weight="700" fill="#172b3a" text-anchor="start">F30-7  Dataset 8: hall B2-DH3 PUE at the IST load steps (example data)</text><text x="24.0" y="48.0" font-size="10" font-weight="400" fill="#5b6b78" text-anchor="start">IT load from load banks and heat emulators 3, 6, 9, 12 MW · facility power 4.10, 7.58, 11.03, 14.53 MW · PUE 1.37, 1.26, 1.23, 1.21 · design 1.22 at 12 MW · model PUE = 1</text><text x="24.0" y="61.0" font-size="10" font-weight="400" fill="#5b6b78" text-anchor="start">+ (0.60 MW fixed + 0.16 x IT) / IT</text><text x="32.0" y="749.0" font-size="10" font-weight="700" fill="#2d6a4f" text-anchor="start">WHAT TO PROVE</text><text x="32.0" y="765.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">• At 12 MW the measured PUE is 1.21 (14.53 / 12.00), inside the design value 1.22.</text><text x="32.0" y="780.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">• At 3 MW the PUE is 1.37 because the 0.60 MW fixed overhead is shared by less load.</text><text x="32.0" y="795.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">• This is an IST interval PUE for one hall; it is reported with its dates and weather and is separate from an annual ISO/IEC 30134-2 PUE.</text><rect x="24" y="828.0" width="952" height="44" rx="0" fill="#f6f8fa" fill-opacity="1" stroke="#5b6b78" stroke-width="1"/><text x="32.0" y="842.0" font-size="11" font-weight="700" fill="#172b3a" text-anchor="start">F30-7  ·  Dataset 8: hall B2-DH3 PUE at the IST load steps (example data)</text><text x="968.0" y="842.0" font-size="10" font-weight="400" fill="#5b6b78" text-anchor="end">Chapter 30 · §30.11</text><text x="32.0" y="855.0" font-size="9" font-weight="400" fill="#5b6b78" text-anchor="start">Data Centre Commissioning Field Manual R01 EN · October 2026 · educational reference, not to scale · project and OEM documents govern</text><text x="32.0" y="867.0" font-size="9" font-weight="400" fill="#5b6b78" text-anchor="start">Symbols: QElectroTech EN 60617 and P&amp;ID collections, CC-BY 3.0, native geometry · instrument bubbles per ISA 5.1 · states per IEC 60617 / IEEE C37.2 practice</text></svg>