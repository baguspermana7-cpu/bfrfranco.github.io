"604.0" width="83.63636363636364" height="21.0" rx="0" fill="#ffffff" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><rect x="304.8484848484849" y="604.0" width="418.1818181818182" height="21.0" rx="0" fill="#ffffff" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><rect x="723.030303030303" y="604.0" width="236.96969696969697" height="21.0" rx="0" fill="#ffffff" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><rect x="40" y="625.0" width="181.21212121212122" height="21.0" rx="0" fill="#ffffff" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><rect x="221.21212121212122" y="625.0" width="83.63636363636364" height="21.0" rx="0" fill="#ffffff" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><rect x="304.8484848484849" y="625.0" width="418.1818181818182" height="21.0" rx="0" fill="#ffffff" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><rect x="723.030303030303" y="625.0" width="236.96969696969697" height="21.0" rx="0" fill="#ffffff" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><rect x="40" y="646.0" width="181.21212121212122" height="21.0" rx="0" fill="#ffffff" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><rect x="221.21212121212122" y="646.0" width="83.63636363636364" height="21.0" rx="0" fill="#ffffff" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><rect x="304.8484848484849" y="646.0" width="418.1818181818182" height="21.0" rx="0" fill="#ffffff" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><rect x="723.030303030303" y="646.0" width="236.96969696969697" height="21.0" rx="0" fill="#ffffff" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><text x="500.0" y="121.9" font-size="11" font-weight="700" fill="#b91c1c" text-anchor="middle">Input event at the FACP</text><text x="500.0" y="134.0" font-size="9" font-weight="400" fill="#172b3a" text-anchor="middle">34 causes, B2-FIRE-CE rev 6</text><text x="180.0" y="255.5" font-size="10.5" font-weight="700" fill="#b91c1c" text-anchor="middle">Pre-alarm: 2 rows</text><text x="180.0" y="267.0" font-size="8.5" font-weight="400" fill="#172b3a" text-anchor="middle">rows 1, 2</text><text x="180.0" y="278.5" font-size="8.5" font-weight="400" fill="#172b3a" text-anchor="middle">effects O3, O14</text><text x="180.0" y="289.9" font-size="8.5" font-weight="400" fill="#172b3a" text-anchor="middle">no evacuation, no plant stop</text><text x="500.0" y="255.5" font-size="10.5" font-weight="700" fill="#b91c1c" text-anchor="middle">Alarm, one device: 16 rows</text><text x="500.0" y="267.0" font-size="8.5" font-weight="400" fill="#172b3a" text-anchor="middle">rows 3, 5, 7, 8, 11, 16, 18, 19, 21-28</text><text x="500.0" y="278.5" font-size="8.5" font-weight="400" fill="#172b3a" text-anchor="middle">O1, O2, O3, O6, O14</text><text x="500.0" y="289.9" font-size="8.5" font-weight="400" fill="#172b3a" text-anchor="middle">no suppression release</text><text x="820.0" y="255.5" font-size="10.5" font-weight="700" fill="#b91c1c" text-anchor="middle">Coincidence: 4 rows</text><text x="820.0" y="267.0" font-size="8.5" font-weight="400" fill="#172b3a" text-anchor="middle">rows 4, 6, 12, 20</text><text x="820.0" y="278.5" font-size="8.5" font-weight="400" fill="#172b3a" text-anchor="middle">O7 countdown or O9 solenoid</text><text x="820.0" y="289.9" font-size="8.5" font-weight="400" fill="#172b3a" text-anchor="middle">owner signs each row</text><text x="180.0" y="405.5" font-size="10.5" font-weight="700" fill="#b91c1c" text-anchor="middle">Release: 2 rows</text><text x="180.0" y="417.0" font-size="8.5" font-weight="400" fill="#172b3a" text-anchor="middle">rows 13, 14</text><text x="180.0" y="428.5" font-size="8.5" font-weight="400" fill="#172b3a" text-anchor="middle">O8 agent release</text><text x="180.0" y="439.9" font-size="8.5" font-weight="400" fill="#172b3a" text-anchor="middle">blocked by abort or lock-out</text><text x="500.0" y="405.5" font-size="10.5" font-weight="700" fill="#475569" text-anchor="middle">Supervisory: 8 rows</text><text x="500.0" y="417.0" font-size="8.5" font-weight="400" fill="#172b3a" text-anchor="middle">rows 9, 10, 15, 17, 29-31, 33</text><text x="500.0" y="428.5" font-size="8.5" font-weight="400" fill="#172b3a" text-anchor="middle">effects O3, O14</text><text x="500.0" y="439.9" font-size="8.5" font-weight="400" fill="#172b3a" text-anchor="middle">no evacuation</text><text x="820.0" y="405.5" font-size="10.5" font-weight="700" fill="#475569" text-anchor="middle">Trouble: 2 rows</text><text x="820.0" y="417.0" font-size="8.5" font-weight="400" fill="#172b3a" text-anchor="middle">rows 32, 34</text><text x="820.0" y="428.5" font-size="8.5" font-weight="400" fill="#172b3a" text-anchor="middle">O3, O14, panel buzzer</text><text x="820.0" y="439.9" font-size="8.5" font-weight="400" fill="#172b3a" text-anchor="middle">no evacuation</text><text x="45.0" y="534.3" font-size="10.5" font-weight="700" fill="#172b3a" text-anchor="start">Class</text><text x="226.2" y="534.3" font-size="10.5" font-weight="700" fill="#172b3a" text-anchor="start">Rows</text><text x="309.8" y="534.3" font-size="10.5" font-weight="700" fill="#172b3a" text-anchor="start">Effects allowed</text><text x="728.0" y="534.3" font-size="10.5" font-weight="700" fill="#172b3a" text-anchor="start">Never</text><text x="45.0" y="555.3" font-size="10.5" font-weight="400" fill="#172b3a" text-anchor="start">Pre-alarm</text><text x="226.2" y="555.3" font-size="10.5" font-weight="400" fill="#172b3a" text-anchor="start">2</text><text x="309.8" y="555.3" font-size="10.5" font-weight="400" fill="#172b3a" text-anchor="start">O3, O14</text><text x="728.0" y="555.3" font-size="10.5" font-weight="400" fill="#172b3a" text-anchor="start">evacuation, plant stop</text><text x="45.0" y="576.3" font-size="10.5" font-weight="400" fill="#172b3a" text-anchor="start">Alarm, one device</text><text x="226.2" y="576.3" font-size="10.5" font-weight="400" fill="#172b3a" text-anchor="start">16</text><text x="309.8" y="576.3" font-size="10.5" font-weight="400" fill="#172b3a" text-anchor="start">O1, O2, O3, O6, O14, plus the units named in the row</text><text x="728.0" y="576.3" font-size="10.5" font-weight="400" fill="#172b3a" text-anchor="start">suppression release</text><text x="45.0" y="597.3" font-size="10.5" font-weight="400" fill="#172b3a" text-anchor="start">Coincidence</text><text x="226.2" y="597.3" font-size="10.5" font-weight="400" fill="#172b3a" text-anchor="start">4</text><text x="309.8" y="597.3" font-size="10.5" font-weight="400" fill="#172b3a" text-anchor="start">O7 or O9; O4, O5 in gas rooms; O8 after countdown (row 20)</text><text x="728.0" y="597.3" font-size="10.5" font-weight="400" fill="#172b3a" text-anchor="start">IT power trip</text><text x="45.0" y="618.3" font-size="10.5" font-weight="400" fill="#172b3a" text-anchor="start">Release</text><text x="226.2" y="618.3" font-size="10.5" font-weight="400" fill="#172b3a" text-anchor="start">2</text><text x="309.8" y="618.3" font-size="10.5" font-weight="400" fill="#172b3a" text-anchor="start">O8</text><text x="728.0" y="618.3" font-size="10.5" font-weight="400" fill="#172b3a" text-anchor="start">release while the abort is held</text><text x="45.0" y="639.3" font-size="10.5" font-weight="400" fill="#172b3a" text-anchor="start">Supervisory</text><text x="226.2" y="639.3" font-size="10.5" font-weight="400" fill="#172b3a" text-anchor="start">8</text><text x="309.8" y="639.3" font-size="10.5" font-weight="400" fill="#172b3a" text-anchor="start">O3, O14</text><text x="728.0" y="639.3" font-size="10.5" font-weight="400" fill="#172b3a" text-anchor="start">evacuation</text><text x="45.0" y="660.3" font-size="10.5" font-weight="400" fill="#172b3a" text-anchor="start">Trouble</text><text x="226.2" y="660.3" font-size="10.5" font-weight="400" fill="#172b3a" text-anchor="start">2</text><text x="309.8" y="660.3" font-size="10.5" font-weight="400" fill="#172b3a" text-anchor="start">O3, O14, panel buzzer</text><text x="728.0" y="660.3" font-size="10.5" font-weight="400" fill="#172b3a" text-anchor="start">evacuation</text><text x="24.0" y="30.0" font-size="17" font-weight="700" fill="#172b3a" text-anchor="start">F20-7  Event classes of the B2 matrix and the effects each class may produce</text><text x="24.0" y="48.0" font-size="11" font-weight="400" fill="#5b6b78" text-anchor="start">34 rows of matrix B2-FIRE-CE rev 6 · 2 pre-alarm · 16 alarm (one device) · 4 coincidence · 2 release · 8 supervisory · 2 trouble · no row trips UPS, PDU or rack power</text><text x="32.0" y="703.0" font-size="10" font-weight="700" fill="#2d6a4f" text-anchor="start">WHAT TO PROVE</text><text x="32.0" y="719.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">• The 34 rows split into 2 pre-alarm, 16 single-device alarm, 4 coincidence, 2 release, 8 supervisory and 2 trouble rows.</text><text x="32.0" y="734.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">• Suppression outputs O7, O8 and O9 appear only on rows 4, 6, 12, 13, 14 and 20; no class trips UPS, PDU or rack power.</text><text x="24.0" y="769.0" font-size="10" font-weight="700" fill="#5b6b78" text-anchor="start">LEGEND</text><line x1="24" y1="791.0" x2="50" y2="791.0" stroke="#b91c1c" stroke-width="3"/><text x="56.0" y="795.0" font-size="10" font-weight="400" fill="#172b3a" text-anchor="start">fire water</text><line x1="126.0109375" y1="791.0" x2="152.0109375" y2="791.0" stroke="#475569" stroke-width="3"/><text x="158.0" y="795.0" font-size="10" font-weight="400" fill="#172b3a" text-anchor="start">signal / control</text><rect x="24" y="809.0" width="952" height="44" rx="0" fill="#f6f8fa" fill-opacity="1" stroke="#5b6b78" stroke-width="1"/><text x="32.0" y="823.0" font-size="11" font-weight="700" fill="#172b3a" text-anchor="start">F20-7  ·  Event classes of the B2 matrix and the effects each class may produce</text><text x="968.0" y="823.0" font-size="10" font-weight="400" fill="#5b6b78" text-anchor="end">Chapter 20 · §20.9.4</text><text x="32.0" y="836.0" font-size="9" font-weight="400" fill="#5b6b78" text-anchor="start">Data Centre Commissioning Field Manual R01 EN · October 2026 · educational reference, not to scale · project and OEM documents govern</text><text x="32.0" y="848.0" font-size="9" font-weight="400" fill="#5b6b78" text-anchor="start">Symbols: QElectroTech EN 60617 and P&amp;ID collections, CC-BY 3.0, native geometry · instrument bubbles per ISA 5.1 · states per IEC 60617 / IEEE C37.2 practice</text></svg>