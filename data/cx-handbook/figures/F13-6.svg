" width="131.42857142857144" height="22.0" rx="0" fill="#ffffff" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><rect x="244.44444444444446" y="610.0" width="277.46031746031747" height="22.0" rx="0" fill="#ffffff" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><rect x="521.9047619047619" y="610.0" width="160.63492063492066" height="22.0" rx="0" fill="#ffffff" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><rect x="682.5396825396826" y="610.0" width="131.42857142857144" height="22.0" rx="0" fill="#ffffff" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><rect x="813.9682539682541" y="610.0" width="146.03174603174602" height="22.0" rx="0" fill="#ffffff" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><rect x="40" y="632.0" width="73.01587301587301" height="22.0" rx="0" fill="#ffffff" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><rect x="113.01587301587301" y="632.0" width="131.42857142857144" height="22.0" rx="0" fill="#ffffff" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><rect x="244.44444444444446" y="632.0" width="277.46031746031747" height="22.0" rx="0" fill="#ffffff" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><rect x="521.9047619047619" y="632.0" width="160.63492063492066" height="22.0" rx="0" fill="#ffffff" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><rect x="682.5396825396826" y="632.0" width="131.42857142857144" height="22.0" rx="0" fill="#ffffff" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><rect x="813.9682539682541" y="632.0" width="146.03174603174602" height="22.0" rx="0" fill="#ffffff" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><text x="150.0" y="208.9" font-size="11.5" font-weight="700" fill="#172b3a" text-anchor="middle">Power factor test set</text><text x="150.0" y="221.8" font-size="9.5" font-weight="400" fill="#172b3a" text-anchor="middle">10 kV, 50 Hz</text><text x="150.0" y="234.6" font-size="9.5" font-weight="400" fill="#172b3a" text-anchor="middle">HV lead, LV lead</text><text x="150.0" y="247.4" font-size="9.5" font-weight="400" fill="#172b3a" text-anchor="middle">modes GST, guard, UST</text><text x="445.0" y="196.8" font-size="11.5" font-weight="700" fill="#8a1c1c" text-anchor="middle">HV winding 150 kV</text><text x="445.0" y="209.6" font-size="9.5" font-weight="400" fill="#172b3a" text-anchor="middle">H1, H2, H3 shorted</text><text x="835.0" y="196.8" font-size="11.5" font-weight="700" fill="#b45309" text-anchor="middle">LV winding 20 kV</text><text x="835.0" y="209.6" font-size="9.5" font-weight="400" fill="#172b3a" text-anchor="middle">X1, X2, X3 shorted</text><text x="640.0" y="426.2" font-size="11.5" font-weight="700" fill="#172b3a" text-anchor="middle">Tank and core, earthed</text><text x="300.0" y="160.0" font-size="10.5" font-weight="400" fill="#5b6b78" text-anchor="middle">HV lead</text><text x="560.0" y="145.0" font-size="10.5" font-weight="400" fill="#5b6b78" text-anchor="middle">LV lead: earth (GST), guard, or measuring input (UST)</text><text x="640.0" y="196.9" font-size="11" font-weight="700" fill="#8a1c1c" text-anchor="middle">CHL</text><text x="640.0" y="209.0" font-size="9" font-weight="400" fill="#172b3a" text-anchor="middle">6,420 pF</text><text x="445.0" y="306.9" font-size="11" font-weight="700" fill="#8a1c1c" text-anchor="middle">CH</text><text x="445.0" y="319.0" font-size="9" font-weight="400" fill="#172b3a" text-anchor="middle">4,150 pF</text><text x="835.0" y="306.9" font-size="11" font-weight="700" fill="#b45309" text-anchor="middle">CL</text><text x="835.0" y="319.0" font-size="9" font-weight="400" fill="#172b3a" text-anchor="middle">11,850 pF</text><text x="160.0" y="418.0" font-size="10.5" font-weight="400" fill="#5b6b78" text-anchor="start">test set earth to tank</text><text x="45.0" y="515.0" font-size="11" font-weight="700" fill="#172b3a" text-anchor="start">Test</text><text x="118.0" y="515.0" font-size="11" font-weight="700" fill="#172b3a" text-anchor="start">Energised</text><text x="249.4" y="515.0" font-size="11" font-weight="700" fill="#172b3a" text-anchor="start">LV lead on other winding</text><text x="526.9" y="515.0" font-size="11" font-weight="700" fill="#172b3a" text-anchor="start">Measures</text><text x="687.5" y="515.0" font-size="11" font-weight="700" fill="#172b3a" text-anchor="start">C (pF)</text><text x="819.0" y="515.0" font-size="11" font-weight="700" fill="#172b3a" text-anchor="start">PF at 20 °C</text><text x="45.0" y="537.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">1</text><text x="118.0" y="537.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">HV</text><text x="249.4" y="537.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">earthed (GST)</text><text x="526.9" y="537.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">CH + CHL</text><text x="687.5" y="537.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">10,570</text><text x="819.0" y="537.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">0.27 %</text><text x="45.0" y="559.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">2</text><text x="118.0" y="559.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">HV</text><text x="249.4" y="559.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">guard (GST-guard)</text><text x="526.9" y="559.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">CH</text><text x="687.5" y="559.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">4,150</text><text x="819.0" y="559.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">0.31 %</text><text x="45.0" y="581.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">3</text><text x="118.0" y="581.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">HV</text><text x="249.4" y="581.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">measuring input (UST)</text><text x="526.9" y="581.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">CHL</text><text x="687.5" y="581.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">6,420</text><text x="819.0" y="581.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">0.25 %</text><text x="45.0" y="603.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">4</text><text x="118.0" y="603.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">LV</text><text x="249.4" y="603.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">earthed (GST)</text><text x="526.9" y="603.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">CL + CHL</text><text x="687.5" y="603.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">18,270</text><text x="819.0" y="603.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">0.27 %</text><text x="45.0" y="625.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">5</text><text x="118.0" y="625.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">LV</text><text x="249.4" y="625.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">guard (GST-guard)</text><text x="526.9" y="625.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">CL</text><text x="687.5" y="625.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">11,850</text><text x="819.0" y="625.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">0.28 %</text><text x="45.0" y="647.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">6</text><text x="118.0" y="647.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">LV</text><text x="249.4" y="647.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">measuring input (UST)</text><text x="526.9" y="647.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">CHL</text><text x="687.5" y="647.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">6,420</text><text x="819.0" y="647.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">0.25 %</text><text x="24.0" y="30.0" font-size="17" font-weight="700" fill="#172b3a" text-anchor="start">F13-6  Insulation power factor of TX-A: six connections for CH, CHL and CL</text><text x="24.0" y="48.0" font-size="10" font-weight="400" fill="#5b6b78" text-anchor="start">10 kV test set in GST and UST modes · HV winding H1-H2-H3 and LV winding X1-X2-X3 each shorted on itself · tank earthed · example results at 20 °C: CH 4,150 pF 0.31 %,</text><text x="24.0" y="61.0" font-size="10" font-weight="400" fill="#5b6b78" text-anchor="start">CHL 6,420 pF 0.25 %, CL 11,850 pF 0.28 %</text><text x="32.0" y="690.0" font-size="10" font-weight="700" fill="#2d6a4f" text-anchor="start">WHAT TO PROVE</text><text x="32.0" y="706.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">• Test 1 reads CH + CHL = 4,150 + 6,420 = 10,570 pF. Tests 2 and 3 add up to it within about 1 %.</text><text x="32.0" y="721.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">• A sum that does not agree points to a wrong lead or guard connection; the test is repeated before the result is recorded.</text><text x="32.0" y="736.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">• Each power factor is corrected to 20 °C and compared with the factory value of the same connection.</text><text x="24.0" y="771.0" font-size="10" font-weight="700" fill="#5b6b78" text-anchor="start">LEGEND</text><line x1="24" y1="793.0" x2="50" y2="793.0" stroke="#8a1c1c" stroke-width="3"/><text x="56.0" y="797.0" font-size="10" font-weight="400" fill="#172b3a" text-anchor="start">150 kV</text><line x1="112.896875" y1="793.0" x2="138.896875" y2="793.0" stroke="#b45309" stroke-width="3"/><text x="144.9" y="797.0" font-size="10" font-weight="400" fill="#172b3a" text-anchor="start">20 kV</text><rect x="24" y="811.0" width="952" height="44" rx="0" fill="#f6f8fa" fill-opacity="1" stroke="#5b6b78" stroke-width="1"/><text x="32.0" y="825.0" font-size="11" font-weight="700" fill="#172b3a" text-anchor="start">F13-6  ·  Insulation power factor of TX-A: six connections for CH, CHL and CL</text><text x="968.0" y="825.0" font-size="10" font-weight="400" fill="#5b6b78" text-anchor="end">Chapter 13 · §13.7.5</text><text x="32.0" y="838.0" font-size="9" font-weight="400" fill="#5b6b78" text-anchor="start">Data Centre Commissioning Field Manual R01 EN · October 2026 · educational reference, not to scale · project and OEM documents govern</text><text x="32.0" y="850.0" font-size="9" font-weight="400" fill="#5b6b78" text-anchor="start">Symbols: QElectroTech EN 60617 and P&amp;ID collections, CC-BY 3.0, native geometry · instrument bubbles per ISA 5.1 · states per IEC 60617 / IEEE C37.2 practice</text></svg>