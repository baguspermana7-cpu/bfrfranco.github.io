 font-size="10" font-weight="700" fill="#2d6a4f" text-anchor="start">WHAT TO PROVE</text><text x="32.0" y="613.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">• Flow recovers above 18.0 L/s at 12 s, inside the 15 s limit; the standby pump starts at 6 s, inside the 10 s limit.</text><text x="32.0" y="628.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">• The supply temperature peak of 45.6 °C stays below the 46.5 °C limit of step 3 and below the 47.0 °C P2 alarm.</text><rect x="24" y="661" width="1352" height="44" rx="0" fill="#f6f8fa" fill-opacity="1" stroke="#5b6b78" stroke-width="1"/><text x="32.0" y="675.0" font-size="11" font-weight="700" fill="#172b3a" text-anchor="start">F22-4  ·  CDU 07 pump failover during the sequence test: TCS flow and supply temperature</text><text x="1368.0" y="675.0" font-size="10" font-weight="400" fill="#5b6b78" text-anchor="end">Chapter 22 · §22.10</text><text x="32.0" y="688.0" font-size="9" font-weight="400" fill="#5b6b78" text-anchor="start">Data Centre Commissioning Field Manual R01 EN · October 2026 · educational reference, not to scale · project and OEM documents govern</text><text x="32.0" y="700.0" font-size="9" font-weight="400" fill="#5b6b78" text-anchor="start">Symbols: QElectroTech EN 60617 and P&amp;ID collections, CC-BY 3.0, native geometry · instrument bubbles per ISA 5.1 · states per IEC 60617 / IEEE C37.2 practice</text></svg>