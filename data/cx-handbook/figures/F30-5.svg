">18.2</text><text x="104.0" y="250.7" font-size="10" font-weight="400" fill="#5b6b78" text-anchor="end">18.4</text><text x="104.0" y="187.3" font-size="10" font-weight="400" fill="#5b6b78" text-anchor="end">18.6</text><text x="104.0" y="124.0" font-size="10" font-weight="400" fill="#5b6b78" text-anchor="end">18.8</text><text x="520.0" y="530.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="middle">sample number (15 min interval)</text><text transform="translate(66 310.0) rotate(-90)" font-size="11" text-anchor="middle" fill="#172b3a">supply temperature (°C)</text><text x="138.0" y="548.0" font-size="10" font-weight="400" fill="#172b3a" text-anchor="start">measured</text><text x="138.0" y="563.0" font-size="10" font-weight="400" fill="#172b3a" text-anchor="start">mean</text><text x="138.0" y="578.0" font-size="10" font-weight="400" fill="#172b3a" text-anchor="start">upper control limit</text><text x="138.0" y="593.0" font-size="10" font-weight="400" fill="#172b3a" text-anchor="start">lower control limit</text><text x="426.2" y="171.0" font-size="10" font-weight="400" fill="#8a5a00" text-anchor="start">sample 23: rule 1</text><text x="45.0" y="653.0" font-size="11" font-weight="700" fill="#172b3a" text-anchor="start">Item</text><text x="626.1" y="653.0" font-size="11" font-weight="700" fill="#172b3a" text-anchor="start">Value</text><text x="45.0" y="675.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">Baseline mean (samples 1 to 40, 23 excluded)</text><text x="626.1" y="675.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">18.005 °C</text><text x="45.0" y="697.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">Average moving range</text><text x="626.1" y="697.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">0.085 K</text><text x="45.0" y="719.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">Sigma = average moving range / 1.128</text><text x="626.1" y="719.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">0.075 K</text><text x="45.0" y="741.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">Upper and lower control limits</text><text x="626.1" y="741.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">18.23 °C and 17.78 °C</text><text x="45.0" y="763.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">Mean of samples 41 to 60</text><text x="626.1" y="763.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">18.241 °C</text><circle cx="419.2" cy="177.0" r="4" fill="#b7791f"/><text x="24.0" y="30.0" font-size="17" font-weight="700" fill="#172b3a" text-anchor="start">F30-5  Dataset 6: control chart of chilled-water supply temperature (example data)</text><text x="24.0" y="48.0" font-size="10" font-weight="400" fill="#5b6b78" text-anchor="start">60 samples at 15 min · baseline samples 1 to 40 · mean 18.00 °C · sigma from moving range 0.075 K · limits 17.78 and 18.23 °C · sample 23 above the upper limit ·</text><text x="24.0" y="61.0" font-size="10" font-weight="400" fill="#5b6b78" text-anchor="start">samples 41 to 60 all above the mean</text><text x="32.0" y="806.0" font-size="10" font-weight="700" fill="#2d6a4f" text-anchor="start">WHAT TO PROVE</text><text x="32.0" y="822.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">• Sample 23 (18.62 °C) lies above the upper control limit 18.23 °C: a single spike, traced to a valve stroke test.</text><text x="32.0" y="837.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">• Samples 41 to 60 lie above the mean: a sustained shift of about +0.24 K, traced to a set-point change made without a change record.</text><rect x="24" y="870.0" width="952" height="44" rx="0" fill="#f6f8fa" fill-opacity="1" stroke="#5b6b78" stroke-width="1"/><text x="32.0" y="884.0" font-size="11" font-weight="700" fill="#172b3a" text-anchor="start">F30-5  ·  Dataset 6: control chart of chilled-water supply temperature (example data)</text><text x="968.0" y="884.0" font-size="10" font-weight="400" fill="#5b6b78" text-anchor="end">Chapter 30 · §30.9</text><text x="32.0" y="897.0" font-size="9" font-weight="400" fill="#5b6b78" text-anchor="start">Data Centre Commissioning Field Manual R01 EN · October 2026 · educational reference, not to scale · project and OEM documents govern</text><text x="32.0" y="909.0" font-size="9" font-weight="400" fill="#5b6b78" text-anchor="start">Symbols: QElectroTech EN 60617 and P&amp;ID collections, CC-BY 3.0, native geometry · instrument bubbles per ISA 5.1 · states per IEC 60617 / IEEE C37.2 practice</text></svg>