ext x="600.0" y="272.0" font-size="10.5" font-weight="400" fill="#5b6b78" text-anchor="middle">template revision with all fields passes to the checks</text><text x="1110.0" y="315.6" font-size="13" font-weight="700" fill="#b7791f" text-anchor="start">Hold rule</text><text x="1110.0" y="333.8" font-size="13" font-weight="400" fill="#172b3a" text-anchor="start">mismatch above 2 % of</text><text x="1110.0" y="351.4" font-size="13" font-weight="400" fill="#172b3a" text-anchor="start">the sample: contractor</text><text x="1110.0" y="368.9" font-size="13" font-weight="400" fill="#172b3a" text-anchor="start">rechecks the system</text><text x="45.0" y="455.0" font-size="11" font-weight="700" fill="#172b3a" text-anchor="start">Field added</text><text x="411.7" y="455.0" font-size="11" font-weight="700" fill="#172b3a" text-anchor="start">Step</text><text x="521.7" y="455.0" font-size="11" font-weight="700" fill="#172b3a" text-anchor="start">Source document</text><text x="888.3" y="455.0" font-size="11" font-weight="700" fill="#172b3a" text-anchor="start">Example</text><text x="45.0" y="477.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">Asset ID, rating, location</text><text x="411.7" y="477.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">2</text><text x="521.7" y="477.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">equipment schedule, drawings</text><text x="888.3" y="477.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">B2-UPS-A1, 2,500 kW, UPS room A</text><text x="45.0" y="499.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">Manufacturer, model</text><text x="411.7" y="499.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">3</text><text x="521.7" y="499.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">approved submittal</text><text x="888.3" y="499.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">model number from submittal</text><text x="45.0" y="521.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">Serial number, install date</text><text x="411.7" y="521.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">4</text><text x="521.7" y="521.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">nameplate photo</text><text x="888.3" y="521.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">photo B2-UPS-A1_nameplate.jpg</text><text x="45.0" y="543.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">Commissioning and warranty dates</text><text x="411.7" y="543.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">5</text><text x="521.7" y="543.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">L4 pass record</text><text x="888.3" y="543.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">2026-10-02, warranty to 2028-11-30</text><text x="45.0" y="565.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">PM schedule IDs</text><text x="411.7" y="565.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">7</text><text x="521.7" y="565.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">O&amp;M manual maintenance table</text><text x="888.3" y="565.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">PM-UPS-Q, PM-UPS-A</text><text x="24.0" y="30.0" font-size="17" font-weight="700" fill="#172b3a" text-anchor="start">F27-3  Asset data handover flow: from the design equipment schedule to work orders in the CMMS</text><text x="24.0" y="48.0" font-size="11" font-weight="400" fill="#5b6b78" text-anchor="start">nine steps with owner and time limit · field check samples 100 % of criticality A assets and 10 % of others (minimum 20 per system) · mismatch above 2 % sends the whole system back · PM generation tested for 90 days</text><text x="32.0" y="608.0" font-size="10" font-weight="700" fill="#2d6a4f" text-anchor="start">WHAT TO PROVE</text><text x="32.0" y="624.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">• Mandatory fields for criticality A assets are 100 % filled with no &quot;TBC&quot; or &quot;N/A&quot; before the CMMS load.</text><text x="32.0" y="639.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">• The 90-day work order generation produces the expected count for each asset class, for example 17 generators x 3 months = 51 monthly run work orders.</text><text x="24.0" y="674.0" font-size="10" font-weight="700" fill="#5b6b78" text-anchor="start">LEGEND</text><line x1="24" y1="696.0" x2="50" y2="696.0" stroke="#475569" stroke-width="3"/><text x="56.0" y="700.0" font-size="10" font-weight="400" fill="#172b3a" text-anchor="start">signal / control</text><line x1="151.9671875" y1="696.0" x2="177.9671875" y2="696.0" stroke="#334155" stroke-width="3"/><text x="184.0" y="700.0" font-size="10" font-weight="400" fill="#172b3a" text-anchor="start">data / network</text><rect x="24" y="714.0" width="1352" height="44" rx="0" fill="#f6f8fa" fill-opacity="1" stroke="#5b6b78" stroke-width="1"/><text x="32.0" y="728.0" font-size="11" font-weight="700" fill="#172b3a" text-anchor="start">F27-3  ·  Asset data handover flow: from the design equipment schedule to work orders in the CMMS</text><text x="1368.0" y="728.0" font-size="10" font-weight="400" fill="#5b6b78" text-anchor="end">Chapter 27 · §27.5</text><text x="32.0" y="741.0" font-size="9" font-weight="400" fill="#5b6b78" text-anchor="start">Data Centre Commissioning Field Manual R01 EN · October 2026 · educational reference, not to scale · project and OEM documents govern</text><text x="32.0" y="753.0" font-size="9" font-weight="400" fill="#5b6b78" text-anchor="start">Symbols: QElectroTech EN 60617 and P&amp;ID collections, CC-BY 3.0, native geometry · instrument bubbles per ISA 5.1 · states per IEC 60617 / IEEE C37.2 practice</text></