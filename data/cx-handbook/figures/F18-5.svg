 height="22.0" rx="0" fill="#ffffff" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><rect x="950" y="290" width="410" height="87.9" rx="4" fill="#fffbe6" fill-opacity="1" stroke="#b7791f" stroke-width="1.2"/><text x="110.0" y="594.0" font-size="10" font-weight="400" fill="#5b6b78" text-anchor="middle">20</text><text x="300.0" y="594.0" font-size="10" font-weight="400" fill="#5b6b78" text-anchor="middle">40</text><text x="490.0" y="594.0" font-size="10" font-weight="400" fill="#5b6b78" text-anchor="middle">60</text><text x="680.0" y="594.0" font-size="10" font-weight="400" fill="#5b6b78" text-anchor="middle">80</text><text x="870.0" y="594.0" font-size="10" font-weight="400" fill="#5b6b78" text-anchor="middle">100</text><text x="104.0" y="584.0" font-size="10" font-weight="400" fill="#5b6b78" text-anchor="end">0</text><text x="104.0" y="469.0" font-size="10" font-weight="400" fill="#5b6b78" text-anchor="end">5</text><text x="104.0" y="354.0" font-size="10" font-weight="400" fill="#5b6b78" text-anchor="end">10</text><text x="104.0" y="239.0" font-size="10" font-weight="400" fill="#5b6b78" text-anchor="end">15</text><text x="104.0" y="124.0" font-size="10" font-weight="400" fill="#5b6b78" text-anchor="end">20</text><text x="490.0" y="610.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="middle">load (% of full load)</text><text transform="translate(66 350.0) rotate(-90)" font-size="11" text-anchor="middle" fill="#172b3a">tolerance (%)</text><text x="748.0" y="136.0" font-size="10" font-weight="400" fill="#172b3a" text-anchor="start">Tol1, ΔT_FL 10.8 °F</text><text x="748.0" y="151.0" font-size="10" font-weight="400" fill="#172b3a" text-anchor="start">Tol1, ΔT_FL 18 °F</text><text x="748.0" y="166.0" font-size="10" font-weight="400" fill="#172b3a" text-anchor="start">Tol4, ΔT_FL 10.8 °F</text><text x="863.0" y="461.5" font-size="10" font-weight="400" fill="#8a5a00" text-anchor="end">4.89 %</text><text x="402.0" y="349.1" font-size="10" font-weight="400" fill="#8a5a00" text-anchor="start">9.78 %</text><text x="955.0" y="135.0" font-size="11" font-weight="700" fill="#172b3a" text-anchor="start">Load</text><text x="1068.9" y="135.0" font-size="11" font-weight="700" fill="#172b3a" text-anchor="start">Tol1 (10.8 °F)</text><text x="1216.9" y="135.0" font-size="11" font-weight="700" fill="#172b3a" text-anchor="start">Tol4 (10.8 °F)</text><text x="955.0" y="157.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">100 %</text><text x="1068.9" y="157.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">4.89 %</text><text x="1216.9" y="157.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">3.47 %</text><text x="955.0" y="179.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">75 %</text><text x="1068.9" y="179.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">7.10 %</text><text x="1216.9" y="179.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">5.02 %</text><text x="955.0" y="201.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">50 %</text><text x="1068.9" y="201.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">9.78 %</text><text x="1216.9" y="201.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">6.89 %</text><text x="955.0" y="223.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">25 %</text><text x="1068.9" y="223.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">14.31 %</text><text x="1216.9" y="223.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">10.06 %</text><text x="960.0" y="303.2" font-size="11" font-weight="700" fill="#b7791f" text-anchor="start">What to prove</text><text x="960.0" y="318.6" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">Test points at site conditions are written into the purchase order.</text><text x="960.0" y="333.4" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">Data are taken for 15 min in steady state: leaving water mean within</text><text x="960.0" y="348.3" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">±0.50 °F, standard deviation ≤ 0.18 °F.</text><text x="960.0" y="363.2" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">The energy balance is inside Tol4, or the test is not valid.</text><circle cx="870.0" cy="467.5" r="4" fill="#b7791f"/><circle cx="395.0" cy="355.1" r="4" fill="#b7791f"/><text x="24.0" y="30.0" font-size="17" font-weight="700" fill="#172b3a" text-anchor="start">F18-5  AHRI 550/590 tolerance Tol1 against load, and the energy-balance tolerance Tol4</text><text x="24.0" y="48.0" font-size="11" font-weight="400" fill="#5b6b78" text-anchor="start">Tol1 = 0.105 − 0.07 × %Load + 0.15 ÷ (ΔT_FL × %Load) · Tol4 = 0.074 − 0.049 × %Load + 0.105 ÷ (ΔT_FL × %Load) · ΔT_FL in °F · MSC-1 trim chiller ΔT_FL = 6 K = 10.8 °F: Tol1 4.89 % at 100 %, 9.78 % at 50 % · Tol4 3.47 % at 100 %</text><text x="32.0" y="650.0" font-size="10" font-weight="700" fill="#2d6a4f" text-anchor="start">WHAT TO PROVE</text><text x="32.0" y="666.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">• For the 2,500 kW trim chiller the minimum accepted full-load capacity is 2,377.8 kW and the minimum COP is 7.0 ÷ 1.0489 = 6.67; the factory result 2,431 kW at COP 6.91 passes.</text><text x="32.0" y="681.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">• Using ΔT in kelvin (6) in place of °F (10.8) would overstate Tol1 at full load (6.0 % instead of 4.89 %).</text><rect x="24" y="714" width="1352" height="44" rx="0" fill="#f6f8fa" fill-opacity="1" stroke="#5b6b78" stroke-width="1"/><text x="32.0" y="728.0" font-size="11" font-weight="700" fill="#172b3a" text-anchor="start">F18-5  ·  AHRI 550/590 tolerance Tol1 against load, and the energy-balance tolerance Tol4</text><text x="1368.0" y="728.0" font-size="10" font-weight="400" fill="#5b6b78" text-anchor="end">Chapter 18 · §18.8</text><text x="32.0" y="741.0" font-size="9" font-weight="400" fill="#5b6b78" text-anchor="start">Data Centre Commissioning Field Manual R01 EN · October 2026 · educational reference, not to scale · project and OEM documents govern</text><text x="32.0" y="753.0" font-size="9" font-weight="400" fill="#5b6b78" text-anchor="start">Symbols: QElectroTech EN 60617 and P&amp;ID collections, CC-BY 3.0, native geometry · instrument bubbles per ISA 5.1 · states per IEC 60617 / IEEE C37.2 practice</text></svg>