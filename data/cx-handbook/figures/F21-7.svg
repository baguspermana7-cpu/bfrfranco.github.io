5.0" y="178.0" font-size="12" font-weight="700" fill="#172b3a" text-anchor="middle">NULL</text><text x="46.0" y="203.5" font-size="12" font-weight="400" fill="#172b3a" text-anchor="start">3 and 4 (project use)</text><text x="470.0" y="203.5" font-size="12" font-weight="700" fill="#172b3a" text-anchor="middle">NULL</text><text x="670.0" y="203.5" font-size="12" font-weight="700" fill="#172b3a" text-anchor="middle">NULL</text><text x="875.0" y="203.5" font-size="12" font-weight="700" fill="#172b3a" text-anchor="middle">NULL</text><text x="46.0" y="228.9" font-size="12" font-weight="400" fill="#172b3a" text-anchor="start">5 Critical Equipment Control</text><text x="470.0" y="228.9" font-size="12" font-weight="700" fill="#172b3a" text-anchor="middle">NULL</text><text x="670.0" y="228.9" font-size="12" font-weight="700" fill="#172b3a" text-anchor="middle">NULL</text><text x="875.0" y="228.9" font-size="12" font-weight="700" fill="#172b3a" text-anchor="middle">NULL</text><text x="46.0" y="254.4" font-size="12" font-weight="400" fill="#172b3a" text-anchor="start">6 Minimum On/Off</text><text x="470.0" y="254.4" font-size="12" font-weight="700" fill="#172b3a" text-anchor="middle">NULL</text><text x="670.0" y="254.4" font-size="12" font-weight="700" fill="#172b3a" text-anchor="middle">NULL</text><text x="875.0" y="254.4" font-size="12" font-weight="700" fill="#172b3a" text-anchor="middle">NULL</text><text x="46.0" y="279.8" font-size="12" font-weight="400" fill="#172b3a" text-anchor="start">7 (project use)</text><text x="470.0" y="279.8" font-size="12" font-weight="700" fill="#172b3a" text-anchor="middle">NULL</text><text x="670.0" y="279.8" font-size="12" font-weight="700" fill="#172b3a" text-anchor="middle">NULL</text><text x="875.0" y="279.8" font-size="12" font-weight="700" fill="#172b3a" text-anchor="middle">NULL</text><text x="46.0" y="305.2" font-size="12" font-weight="400" fill="#172b3a" text-anchor="start">8 Manual Operator</text><text x="470.0" y="305.2" font-size="12" font-weight="700" fill="#172b3a" text-anchor="middle">80 %</text><text x="670.0" y="305.2" font-size="12" font-weight="700" fill="#172b3a" text-anchor="middle">NULL</text><text x="875.0" y="305.2" font-size="12" font-weight="700" fill="#172b3a" text-anchor="middle">NULL</text><text x="46.0" y="330.7" font-size="12" font-weight="400" fill="#172b3a" text-anchor="start">9 to 15 (project use)</text><text x="470.0" y="330.7" font-size="12" font-weight="700" fill="#172b3a" text-anchor="middle">NULL</text><text x="670.0" y="330.7" font-size="12" font-weight="700" fill="#172b3a" text-anchor="middle">NULL</text><text x="875.0" y="330.7" font-size="12" font-weight="700" fill="#172b3a" text-anchor="middle">NULL</text><text x="46.0" y="356.1" font-size="12" font-weight="400" fill="#172b3a" text-anchor="start">16 (sequence, default)</text><text x="470.0" y="356.1" font-size="12" font-weight="700" fill="#172b3a" text-anchor="middle">62 %</text><text x="670.0" y="356.1" font-size="12" font-weight="700" fill="#172b3a" text-anchor="middle">62 %</text><text x="875.0" y="356.1" font-size="12" font-weight="700" fill="#172b3a" text-anchor="middle">NULL</text><text x="46.0" y="381.6" font-size="12" font-weight="400" fill="#172b3a" text-anchor="start">Relinquish_Default</text><text x="470.0" y="381.6" font-size="12" font-weight="700" fill="#172b3a" text-anchor="middle">100 %</text><text x="670.0" y="381.6" font-size="12" font-weight="700" fill="#172b3a" text-anchor="middle">100 %</text><text x="875.0" y="381.6" font-size="12" font-weight="700" fill="#172b3a" text-anchor="middle">100 %</text><text x="46.0" y="407.0" font-size="12" font-weight="400" fill="#172b3a" text-anchor="start">Present_Value</text><text x="470.0" y="407.0" font-size="12" font-weight="700" fill="#172b3a" text-anchor="middle">80 % (slot 8)</text><text x="670.0" y="407.0" font-size="12" font-weight="700" fill="#172b3a" text-anchor="middle">62 % (slot 16)</text><text x="875.0" y="407.0" font-size="12" font-weight="700" fill="#172b3a" text-anchor="middle">100 % (default)</text><text x="45.0" y="460.2" font-size="11" font-weight="700" fill="#172b3a" text-anchor="start">L3 test step on AO:1</text><text x="607.2" y="460.2" font-size="11" font-weight="700" fill="#172b3a" text-anchor="start">Value recorded in the example</text><text x="45.0" y="482.2" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">1. Write 80 % at priority 8 from the workstation</text><text x="607.2" y="482.2" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">Present_Value 80 %</text><text x="45.0" y="504.2" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">2. Read Priority_Array</text><text x="607.2" y="504.2" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">slot 8 = 80, slot 16 = 62</text><text x="45.0" y="526.2" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">3. Relinquish priority 8 (write NULL)</text><text x="607.2" y="526.2" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">Present_Value 62 %</text><text x="45.0" y="548.2" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">4. Read the override summary page</text><text x="607.2" y="548.2" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">no AO:1 entry</text><text x="45.0" y="570.2" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">5. Restart the controller, sequence disabled</text><text x="607.2" y="570.2" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">Present_Value 100 %</text><text x="24.0" y="30.0" font-size="17" font-weight="700" fill="#172b3a" text-anchor="start">F21-7  BACnet priority array of the CRAH 11 fan speed command</text><text x="24.0" y="48.0" font-size="11" font-weight="400" fill="#5b6b78" text-anchor="start">B2-DH3-CRAH-11, device 232011, Fan_SpdCmd AO:1 · operator override 80 % at priority 8 · sequence 62 % at priority 16 · Relinquish_Default 100 % (example value)</text><text x="32.0" y="613.3" font-size="10" font-weight="700" fill="#2d6a4f" text-anchor="start">WHAT TO PROVE</text><text x="32.0" y="629.3" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">• With the override at priority 8 the fan runs at 80 %; the sequence value of 62 % at priority 16 has no effect until slot 8 is relinquished.</text><text x="32.0" y="644.3" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">• After a controller restart with the sequence not yet running, every slot is NULL and the fan runs at the Relinquish_Default of 100 %.</text><text x="32.0" y="659.3" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">• The L3 test writes, reads and relinquishes slot 8 and records Present_Value after each step.</text><rect x="24" y="692.28" width="952" height="44" rx="0" fill="#f6f8fa" fill-opacity="1" stroke="#5b6b78" stroke-width="1"/><text x="32.0" y="706.3" font-size="11" font-weight="700" fill="#172b3a" text-anchor="start">F21-7  ·  BACnet priority array of the CRAH 11 fan speed command</text><text x="968.0" y="706.3" font-size="10" font-weight="400" fill="#5b6b78" text-anchor="end">Chapter 21 · §21.3.3</text><text x="32.0" y="719.3" font-size="9" font-weight="400" fill="#5b6b78" text-anchor="start">Data Centre Commissioning Field Manual R01 EN · October 2026 · educational reference, not to scale · project and OEM documents govern</text><text x="32.0" y="731.3" font-size="9" font-weight="400" fill="#5b6b78" text-anchor="start">Symbols: QElectroTech EN 60617 and P&amp;ID collections, CC-BY 3.0, native geometry · instrument bubbles per ISA 5.1 · states per IEC 60617 / IEEE C37.2 practice</text></svg>