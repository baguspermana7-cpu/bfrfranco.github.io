-size="11" font-weight="700" fill="#172b3a" text-anchor="start">To 38 °C alarm</text><text x="45.0" y="677.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">200 m³</text><text x="351.7" y="677.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">0.69 K/min</text><text x="556.1" y="677.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">37.1 °C</text><text x="743.5" y="677.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">4.3 min</text><text x="45.0" y="699.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">300 m³ (example)</text><text x="351.7" y="699.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">0.46 K/min</text><text x="556.1" y="699.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">36.4 °C</text><text x="743.5" y="699.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">6.5 min</text><text x="45.0" y="721.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">400 m³</text><text x="351.7" y="721.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">0.35 K/min</text><text x="556.1" y="721.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">36.0 °C</text><text x="743.5" y="721.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">8.7 min</text><circle cx="383.3" cy="318.6" r="4" fill="#b7791f"/><text x="24.0" y="30.0" font-size="17" font-weight="700" fill="#172b3a" text-anchor="start">F18-8  FWS supply rise in one hall if all heat rejection stops: mixed-volume estimate</text><text x="24.0" y="48.0" font-size="10" font-weight="400" fill="#5b6b78" text-anchor="start">9.6 MW into the loop · ρ × cp = 4.18 × 994 kJ/(m³·K) · 300 m³ loop: 0.46 K/min, 36.4 °C after a 3 min chiller restart, 38 °C CDU alarm after 6.5 min · 200 m³: 4.3 min · 400</text><text x="24.0" y="61.0" font-size="10" font-weight="400" fill="#5b6b78" text-anchor="start">m³: 8.7 min</text><text x="32.0" y="764.0" font-size="10" font-weight="700" fill="#2d6a4f" text-anchor="start">WHAT TO PROVE</text><text x="32.0" y="780.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">• For the 300 m³ example loop the rise is 9,600 ÷ (300 × 4.18 × 994) × 60 = 0.46 K per minute, so a 3-minute chiller restart ends at about 36.4 °C.</text><text x="32.0" y="795.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">• The 38 °C CDU high-temperature alarm is reached after 3.0 ÷ 0.46 = 6.5 minutes in the example; a smaller loop of 200 m³ reaches it after 4.3 minutes.</text><rect x="24" y="828.0" width="952" height="44" rx="0" fill="#f6f8fa" fill-opacity="1" stroke="#5b6b78" stroke-width="1"/><text x="32.0" y="842.0" font-size="11" font-weight="700" fill="#172b3a" text-anchor="start">F18-8  ·  FWS supply rise in one hall if all heat rejection stops: mixed-volume estimate</text><text x="968.0" y="842.0" font-size="10" font-weight="400" fill="#5b6b78" text-anchor="end">Chapter 18 · §18.11</text><text x="32.0" y="855.0" font-size="9" font-weight="400" fill="#5b6b78" text-anchor="start">Data Centre Commissioning Field Manual R01 EN · October 2026 · educational reference, not to scale · project and OEM documents govern</text><text x="32.0" y="867.0" font-size="9" font-weight="400" fill="#5b6b78" text-anchor="start">Symbols: QElectroTech EN 60617 and P&amp;ID collections, CC-BY 3.0, native geometry · instrument bubbles per ISA 5.1 · states per IEC 60617 / IEEE C37.2 practice</text></svg>