<svg xmlns="http://www.w3.org/2000/svg" width="174mm" height="105.6mm" viewBox="0 0 1000 607" font-family="DejaVu Sans" role="img" aria-labelledby="t"><title id="t">F01-11 Edition check of the standards cited outside the registers, 1 November 2026</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="context-stroke"/></marker><marker id="arrow-simple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#172b3a"/></marker></defs><rect width="1000" height="607" fill="#ffffff"/><rect x="4" y="4" width="992" height="599" fill="none" stroke="#172b3a" stroke-width="1.6"/><rect x="24" y="469.185" width="952" height="56" rx="4" fill="#f1f8f4" fill-opacity="1" stroke="#2d6a4f" stroke-width="1"/><rect x="40" y="110" width="920" height="237.36" rx="0" fill="#ffffff" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><rect x="240" y="110" width="70" height="24.380000000000003" rx="0" fill="#e9f0f4" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><rect x="310" y="110" width="390" height="24.380000000000003" rx="0" fill="#e9f0f4" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><rect x="700" y="110" width="260" height="24.380000000000003" rx="0" fill="#e9f0f4" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><rect x="40" y="134.38" width="200" height="39.56" rx="0" fill="#e9f0f4" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><rect x="240" y="134.38" width="70" height="39.56" rx="0" fill="#ffffff" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><rect x="310" y="134.38" width="390" height="39.56" rx="0" fill="#ffffff" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><rect x="700" y="134.38" width="260" height="39.56" rx="0" fill="#ffffff" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><rect x="40" y="173.94" width="200" height="39.56" rx="0" fill="#e9f0f4" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><rect x="240" y="173.94" width="70" height="39.56" rx="0" fill="#ffffff" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><rect x="310" y="173.94" width="390" height="39.56" rx="0" fill="#ffffff" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><rect x="700" y="173.94" width="260" height="39.56" rx="0" fill="#ffffff" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><rect x="40" y="213.5" width="200" height="54.74000000000001" rx="0" fill="#e9f0f4" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><rect x="240" y="213.5" width="70" height="54.74000000000001" rx="0" fill="#ffffff" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><rect x="310" y="213.5" width="390" height="54.74000000000001" rx="0" fill="#ffffff" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><rect x="700" y="213.5" width="260" height="54.74000000000001" rx="0" fill="#ffffff" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><rect x="40" y="268.24" width="200" height="39.56" rx="0" fill="#e9f0f4" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><rect x="240" y="268.24" width="70" height="39.56" rx="0" fill="#ffffff" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><rect x="310" y="268.24" width="390" height="39.56" rx="0" fill="#ffffff" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><rect x="700" y="268.24" width="260" height="39.56" rx="0" fill="#ffffff" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><rect x="40" y="307.8" width="200" height="39.56" rx="0" fill="#e9f0f4" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><rect x="240" y="307.8" width="70" height="39.56" rx="0" fill="#ffffff" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><rect x="310" y="307.8" width="390" height="39.56" rx="0" fill="#ffffff" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><rect x="700" y="307.8" width="260" height="39.56" rx="0" fill="#ffffff" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><rect x="40" y="371.36" width="920" height="75.825" rx="4" fill="#fffbe6" fill-opacity="1" stroke="#b7791f" stroke-width="1.2"/><text x="275.0" y="126.4" font-size="10.5" font-weight="700" fill="#172b3a" text-anchor="middle">Count</text><text x="505.0" y="126.4" font-size="10.5" font-weight="700" fill="#172b3a" text-anchor="middle">Examples</text><text x="830.0" y="126.4" font-size="10.5" font-weight="700" fill="#172b3a" text-anchor="middle">Action in the manual</text><text x="46.0" y="158.4" font-size="11.5" font-weight="400" fill="#172b3a" text-anchor="start">Newer edition published</text><text x="275.0" y="158.4" font-size="11.5" font-weight="700" fill="#172b3a" text-anchor="middle">5</text><text x="505.0" y="150.8" font-size="11.5" font-weight="700" fill="#172b3a" text-anchor="middle">IEC 60751:2022; EN 1434-1:2022; IEEE 81-2025; ASHRAE</text><text x="505.0" y="166.0" font-size="11.5" font-weight="700" fill="#172b3a" text-anchor="middle">90.4-2025; AHRI 551/591-2026 (SI)</text><text x="830.0" y="150.8" font-size="11.5" font-weight="700" fill="#172b3a" text-anchor="middle">adopt the new edition; label the value</text><text x="830.0" y="166.0" font-size="11.5" font-weight="700" fill="#172b3a" text-anchor="middle">read from the old one</text><text x="46.0" y="198.0" font-size="11.5" font-weight="400" fill="#172b3a" text-anchor="start">Inactive, no replacement</text><text x="275.0" y="198.0" font-size="11.5" font-weight="700" fill="#172b3a" text-anchor="middle">1</text><text x="505.0" y="198.0" font-size="11.5" font-weight="700" fill="#172b3a" text-anchor="middle">IEEE 43-2013 (inactive-reserved since 21 Mar 2024)</text><text x="830.0" y="190.4" font-size="11.5" font-weight="700" fill="#172b3a" text-anchor="middle">keep the 2013 values and say the</text><text x="830.0" y="205.6" font-size="11.5" font-weight="700" fill="#172b3a" text-anchor="middle">status</text><text x="46.0" y="245.1" font-size="11.5" font-weight="400" fill="#172b3a" text-anchor="start">Amendment to note</text><text x="275.0" y="245.1" font-size="11.5" font-weight="700" fill="#172b3a" text-anchor="middle">4</text><text x="505.0" y="229.9" font-size="11.5" font-weight="700" fill="#172b3a" text-anchor="middle">IEC 62271-100:2021/AMD1:2024; IEC</text><text x="505.0" y="245.1" font-size="11.5" font-weight="700" fill="#172b3a" text-anchor="middle">60502-2:2014/AMD1:2024; EN 50160:2022+A1:2025; IEEE</text><text x="505.0" y="260.3" font-size="11.5" font-weight="700" fill="#172b3a" text-anchor="middle">1547a-2020</text><text x="830.0" y="237.5" font-size="11.5" font-weight="700" fill="#172b3a" text-anchor="middle">name the amendment beside the base</text><text x="830.0" y="252.7" font-size="11.5" font-weight="700" fill="#172b3a" text-anchor="middle">edition</text><text x="46.0" y="292.3" font-size="11.5" font-weight="400" fill="#172b3a" text-anchor="start">Withdrawn and replaced</text><text x="275.0" y="292.3" font-size="11.5" font-weight="700" fill="#172b3a" text-anchor="middle">2</text><text x="505.0" y="292.3" font-size="11.5" font-weight="700" fill="#172b3a" text-anchor="middle">BS 1192:2007 and BS 1192-4:2014, replaced by ISO 19650</text><text x="830.0" y="284.7" font-size="11.5" font-weight="700" fill="#172b3a" text-anchor="middle">cite only for legacy codes; name the</text><text x="830.0" y="299.9" font-size="11.5" font-weight="700" fill="#172b3a" text-anchor="middle">successor</text><text x="46.0" y="331.8" font-size="11.5" font-weight="400" fill="#172b3a" text-anchor="start">Current as cited</text><text x="275.0" y="331.8" font-size="11.5" font-weight="700" fill="#172b3a" text-anchor="middle">44</text><text x="505.0" y="324.2" font-size="11.5" font-weight="700" fill="#172b3a" text-anchor="middle">IEC 60076-1:2011; IEC 61869-2:2012; ISO 9906:2012; ISO</text><text x="505.0" y="339.4" font-size="11.5" font-weight="700" fill="#172b3a" text-anchor="middle">14224:2016 and 40 others</text><text x="830.0" y="331.8" font-size="11.5" font-weight="700" fill="#172b3a" text-anchor="middle">no change; date of check recorded</text><text x="50.0" y="385.2" font-size="11.5" font-weight="700" fill="#b7791f" text-anchor="start">Where the status came from</text><text x="50.0" y="401.3" font-size="11.5" font-weight="400" fill="#172b3a" text-anchor="start">Publisher catalogue pages (IEC webstore, IEEE Standards Association status pages, ISO online browsing platform) first; national standards bodies (SIS, SNV,</text><text x="50.0" y="416.8" font-size="11.5" font-weight="400" fill="#172b3a" text-anchor="start">AFNOR, BSI, DIN) where the publisher page did not state the status.</text><text x="50.0" y="432.3" font-size="11.5" font-weight="400" fill="#172b3a" text-anchor="start">A retailer label &quot;current&quot; is not proof on its own: IEEE 81-2012 and IEEE 43-2013 were still labelled current by two retailers after IEEE had inactivated them.</text><text x="24.0" y="30.0" font-size="17" font-weight="700" fill="#172b3a" text-anchor="start">F01-11  Edition check of the standards cited outside the registers, 1 November 2026</text><text x="24.0" y="48.0" font-size="10" font-weight="400" fill="#5b6b78" text-anchor="start">56 standards checked against the publisher or a national standards body · 5 newer editions · 1 inactive without replacement · 4 amendments to note · 2 withdrawn · 44</text><text x="24.0" y="61.0" font-size="10" font-weight="400" fill="#5b6b78" text-anchor="start">current as cited</text><text x="32.0" y="483.2" font-size="10" font-weight="700" fill="#2d6a4f" text-anchor="start">WHAT TO PROVE</text><text x="32.0" y="499.2" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">• A chapter that quotes a value from an older edition names that edition beside the value and says the newer text was not read.</text><text x="32.0" y="514.2" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">• The check is repeated at every release and the date in the table heading is changed; a citation of a year other than the adopted one fails the build check.</text><rect x="24" y="547.185" width="952" height="44" rx="0" fill="#f6f8fa" fill-opacity="1" stroke="#5b6b78" stroke-width="1"/><text x="32.0" y="561.2" font-size="11" font-weight="700" fill="#172b3a" text-anchor="start">F01-11  ·  Edition check of the standards cited outside the registers, 1 November 2026</text><text x="968.0" y="561.2" font-size="10" font-weight="400" fill="#5b6b78" text-anchor="end">Chapter 01 · §01.13.5</text><text x="32.0" y="574.2" font-size="9" font-weight="400" fill="#5b6b78" text-anchor="start">Data Centre Commissioning Field Manual R01 EN · October 2026 · educational reference, not to scale · project and OEM documents govern</text><text x="32.0" y="586.2" font-size="9" font-weight="400" fill="#5b6b78" text-anchor="start">Symbols: QElectroTech EN 60617 and P&amp;ID collections, CC-BY 3.0, native geometry · instrument bubbles per ISA 5.1 · states per IEC 60617 / IEEE C37.2 practice</text></svg>