<svg xmlns="http://www.w3.org/2000/svg" width="174mm" height="163.4mm" viewBox="0 0 1000 939" font-family="DejaVu Sans" role="img" aria-labelledby="t"><title id="t">F02-6 Level 4 test day: run order and the decision after a failed step</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="context-stroke"/></marker><marker id="arrow-simple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#172b3a"/></marker><marker id="arrow-475569" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#475569"/></marker><marker id="arrow-b91c1c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#b91c1c"/></marker></defs><rect width="1000" height="939" fill="#ffffff"/><rect x="4" y="4" width="992" height="931" fill="none" stroke="#172b3a" stroke-width="1.6"/><rect x="24" y="744.7" width="952" height="71" rx="4" fill="#f1f8f4" fill-opacity="1" stroke="#2d6a4f" stroke-width="1"/><polyline points="250.0,176.0 250.0,216.0" fill="none" stroke="#475569" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#arrow-475569)"/><polyline points="250.0,274.0 250.0,314.0" fill="none" stroke="#475569" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#arrow-475569)"/><polyline points="250.0,372.0 250.0,412.0" fill="none" stroke="#475569" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#arrow-475569)"/><polyline points="250.0,470.0 250.0,510.0" fill="none" stroke="#475569" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#arrow-475569)"/><polyline points="440.0,343.0 560.0,343.0" fill="none" stroke="#b91c1c" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#arrow-b91c1c)"/><polyline points="750.0,372.0 750.0,412.0" fill="none" stroke="#b91c1c" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#arrow-b91c1c)"/><rect x="60" y="110" width="380" height="66" rx="8" fill="#ffffff" fill-opacity="1" stroke="#475569" stroke-width="1.4"/><rect x="60" y="216" width="380" height="58" rx="8" fill="#ffffff" fill-opacity="1" stroke="#475569" stroke-width="1.4"/><rect x="60" y="314" width="380" height="58" rx="0" fill="#ffffff" fill-opacity="1" stroke="#172b3a" stroke-width="1.4"/><rect x="60" y="412" width="380" height="58" rx="8" fill="#ffffff" fill-opacity="1" stroke="#475569" stroke-width="1.4"/><rect x="60" y="510" width="380" height="58" rx="8" fill="#ffffff" fill-opacity="1" stroke="#475569" stroke-width="1.4"/><rect x="560" y="314" width="380" height="58" rx="8" fill="#ffffff" fill-opacity="1" stroke="#b91c1c" stroke-width="1.4"/><rect x="560" y="412" width="380" height="58" rx="8" fill="#ffffff" fill-opacity="1" stroke="#b91c1c" stroke-width="1.4"/><rect x="40" y="610" width="920" height="112.70000000000002" rx="0" fill="#ffffff" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><rect x="190" y="610" width="330" height="24.380000000000003" rx="0" fill="#e9f0f4" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><rect x="520" y="610" width="440" height="24.380000000000003" rx="0" fill="#e9f0f4" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><rect x="40" y="634.38" width="150" height="39.56" rx="0" fill="#e9f0f4" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><rect x="190" y="634.38" width="330" height="39.56" rx="0" fill="#ffffff" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><rect x="520" y="634.38" width="440" height="39.56" rx="0" fill="#ffffff" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><rect x="40" y="673.94" width="150" height="24.380000000000003" rx="0" fill="#e9f0f4" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><rect x="190" y="673.94" width="330" height="24.380000000000003" rx="0" fill="#ffffff" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><rect x="520" y="673.94" width="440" height="24.380000000000003" rx="0" fill="#ffffff" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><rect x="40" y="698.32" width="150" height="24.380000000000003" rx="0" fill="#e9f0f4" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><rect x="190" y="698.32" width="330" height="24.380000000000003" rx="0" fill="#ffffff" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><rect x="520" y="698.32" width="440" height="24.380000000000003" rx="0" fill="#ffffff" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><text x="250.0" y="127.9" font-size="12" font-weight="700" fill="#475569" text-anchor="middle">1 Pre-test meeting, 30 min</text><text x="250.0" y="141.4" font-size="10" font-weight="400" fill="#172b3a" text-anchor="middle">script revision, permits, load banks</text><text x="250.0" y="154.9" font-size="10" font-weight="400" fill="#172b3a" text-anchor="middle">instruments, roles, stop criteria</text><text x="250.0" y="236.7" font-size="12" font-weight="700" fill="#475569" text-anchor="middle">2 Run the next step</text><text x="250.0" y="250.2" font-size="10" font-weight="400" fill="#172b3a" text-anchor="middle">record value, time and result</text><text x="250.0" y="334.7" font-size="12" font-weight="700" fill="#172b3a" text-anchor="middle">3 Step passed</text><text x="250.0" y="348.2" font-size="10" font-weight="400" fill="#172b3a" text-anchor="middle">measured value within acceptance</text><text x="250.0" y="432.7" font-size="12" font-weight="700" fill="#475569" text-anchor="middle">4 Load run at 100 %</text><text x="250.0" y="446.2" font-size="10" font-weight="400" fill="#172b3a" text-anchor="middle">continuous, 8 h minimum</text><text x="250.0" y="530.6" font-size="12" font-weight="700" fill="#475569" text-anchor="middle">5 Sign the script</text><text x="250.0" y="544.1" font-size="10" font-weight="400" fill="#172b3a" text-anchor="middle">contractor, OEM, CxA, owner witness</text><text x="260.0" y="396.0" font-size="11.5" font-weight="700" fill="#475569" text-anchor="start">yes, after the last step</text><text x="750.0" y="334.7" font-size="12" font-weight="700" fill="#b91c1c" text-anchor="middle">Stop and record the failure</text><text x="750.0" y="348.2" font-size="10" font-weight="400" fill="#172b3a" text-anchor="middle">step, value, time, photo</text><text x="750.0" y="432.7" font-size="12" font-weight="700" fill="#b91c1c" text-anchor="middle">Classify with the EoR</text><text x="750.0" y="446.2" font-size="10" font-weight="400" fill="#172b3a" text-anchor="middle">issue category A, B or C</text><text x="470.0" y="333.0" font-size="11.5" font-weight="700" fill="#b91c1c" text-anchor="start">no</text><text x="355.0" y="626.4" font-size="10.5" font-weight="700" fill="#172b3a" text-anchor="middle">Meaning (section 02.5.4)</text><text x="740.0" y="626.4" font-size="10.5" font-weight="700" fill="#172b3a" text-anchor="middle">Action on the test day</text><text x="46.0" y="658.4" font-size="11.5" font-weight="400" fill="#172b3a" text-anchor="start">A (critical)</text><text x="355.0" y="658.4" font-size="11.5" font-weight="700" fill="#172b3a" text-anchor="middle">safety, critical load or validity of later steps</text><text x="740.0" y="650.8" font-size="11.5" font-weight="700" fill="#172b3a" text-anchor="middle">end the test; raise issue A; retest from the step named by CxM</text><text x="740.0" y="666.0" font-size="11.5" font-weight="700" fill="#172b3a" text-anchor="middle">and EoR</text><text x="46.0" y="690.4" font-size="11.5" font-weight="400" fill="#172b3a" text-anchor="start">B (major)</text><text x="355.0" y="690.4" font-size="11.5" font-weight="700" fill="#172b3a" text-anchor="middle">function or performance affected</text><text x="740.0" y="690.4" font-size="11.5" font-weight="700" fill="#172b3a" text-anchor="middle">continue only if CxM and EoR record later steps unaffected</text><text x="46.0" y="714.8" font-size="11.5" font-weight="400" fill="#172b3a" text-anchor="start">C (minor)</text><text x="355.0" y="714.8" font-size="11.5" font-weight="700" fill="#172b3a" text-anchor="middle">no effect on function or later steps</text><text x="740.0" y="714.8" font-size="11.5" font-weight="700" fill="#172b3a" text-anchor="middle">continue; raise issue C; close within 30 working days</text><text x="24.0" y="30.0" font-size="17" font-weight="700" fill="#172b3a" text-anchor="start">F02-6  Level 4 test day: run order and the decision after a failed step</text><text x="24.0" y="48.0" font-size="11" font-weight="400" fill="#5b6b78" text-anchor="start">pre-test meeting 30 min · each step records value, time and result · failed step: stop, record, classify with the EoR · load runs 8 h minimum (Uptime) · four signatures</text><text x="32.0" y="758.7" font-size="10" font-weight="700" fill="#2d6a4f" text-anchor="start">WHAT TO PROVE</text><text x="32.0" y="774.7" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">• A category A failure ends the test; the system is retested from the step that the CxM and the EoR name.</text><text x="32.0" y="789.7" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">• A category B failure lets the script continue only when the CxM and the EoR record that the later steps are not affected.</text><text x="32.0" y="804.7" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">• The script is signed on the day by the contractor, the OEM, the CxA and the owner witness.</text><text x="24.0" y="839.7" font-size="10" font-weight="700" fill="#5b6b78" text-anchor="start">LEGEND</text><line x1="24" y1="861.7" x2="50" y2="861.7" stroke="#475569" stroke-width="3"/><text x="56.0" y="865.7" font-size="10" font-weight="400" fill="#172b3a" text-anchor="start">signal / control</text><line x1="151.9671875" y1="861.7" x2="177.9671875" y2="861.7" stroke="#b91c1c" stroke-width="3"/><text x="184.0" y="865.7" font-size="10" font-weight="400" fill="#172b3a" text-anchor="start">trip / protection</text><rect x="24" y="879.7" width="952" height="44" rx="0" fill="#f6f8fa" fill-opacity="1" stroke="#5b6b78" stroke-width="1"/><text x="32.0" y="893.7" font-size="11" font-weight="700" fill="#172b3a" text-anchor="start">F02-6  ·  Level 4 test day: run order and the decision after a failed step</text><text x="968.0" y="893.7" font-size="10" font-weight="400" fill="#5b6b78" text-anchor="end">Chapter 02 · §02.4.5</text><text x="32.0" y="906.7" font-size="9" font-weight="400" fill="#5b6b78" text-anchor="start">Data Centre Commissioning Field Manual R01 EN · October 2026 · educational reference, not to scale · project and OEM documents govern</text><text x="32.0" y="918.7" font-size="9" font-weight="400" fill="#5b6b78" text-anchor="start">Symbols: QElectroTech EN 60617 and P&amp;ID collections, CC-BY 3.0, native geometry · instrument bubbles per ISA 5.1 · states per IEC 60617 / IEEE C37.2 practice</text></svg>