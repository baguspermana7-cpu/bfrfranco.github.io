-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><rect x="565" y="265.81999999999994" width="200" height="22.26" rx="0" fill="#ffffff" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><rect x="765" y="265.81999999999994" width="195" height="22.26" rx="0" fill="#ffffff" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><rect x="40" y="330" width="920" height="73.05000000000001" rx="4" fill="#fffbe6" fill-opacity="1" stroke="#b7791f" stroke-width="1.2"/><text x="270.0" y="125.0" font-size="9.5" font-weight="700" fill="#172b3a" text-anchor="middle">Electrical</text><text x="467.5" y="125.0" font-size="9.5" font-weight="700" fill="#172b3a" text-anchor="middle">Mechanical</text><text x="665.0" y="125.0" font-size="9.5" font-weight="700" fill="#172b3a" text-anchor="middle">BMS and EPMS</text><text x="862.5" y="125.0" font-size="9.5" font-weight="700" fill="#172b3a" text-anchor="middle">Fire, network</text><text x="46.0" y="147.3" font-size="10.5" font-weight="400" fill="#172b3a" text-anchor="start">L1 FAT</text><text x="270.0" y="147.3" font-size="10.5" font-weight="700" fill="#172b3a" text-anchor="middle">UPS-L1-FAT-B2-01</text><text x="467.5" y="147.3" font-size="10.5" font-weight="700" fill="#172b3a" text-anchor="middle">MEC-L1-FAT-CH-B2-01</text><text x="665.0" y="147.3" font-size="10.5" font-weight="700" fill="#172b3a" text-anchor="middle">BMS-L1-FAT-B2-DH3</text><text x="862.5" y="147.3" font-size="10.5" font-weight="700" fill="#172b3a" text-anchor="middle">FIRE-L1-B2</text><text x="46.0" y="169.5" font-size="10.5" font-weight="400" fill="#172b3a" text-anchor="start">L2 install</text><text x="270.0" y="169.5" font-size="10.5" font-weight="700" fill="#172b3a" text-anchor="middle">ELE-L2-UPS-B2-DH3-A1-01</text><text x="467.5" y="169.5" font-size="10.5" font-weight="700" fill="#172b3a" text-anchor="middle">MEC-L2-PT-B2-017</text><text x="46.0" y="191.8" font-size="10.5" font-weight="400" fill="#172b3a" text-anchor="start">L3 start-up</text><text x="270.0" y="191.8" font-size="10.5" font-weight="700" fill="#172b3a" text-anchor="middle">ELE-L3-UPS-B2-DH3-A1-01</text><text x="467.5" y="191.8" font-size="10.5" font-weight="700" fill="#172b3a" text-anchor="middle">MEC-L3-CH-B2-01</text><text x="665.0" y="191.8" font-size="10.5" font-weight="700" fill="#172b3a" text-anchor="middle">EPMS-L3-B2-DH3-UPS-A1</text><text x="862.5" y="191.8" font-size="10.5" font-weight="700" fill="#172b3a" text-anchor="middle">NET-L3-CU-B2-01</text><text x="46.0" y="214.1" font-size="10.5" font-weight="400" fill="#172b3a" text-anchor="start">L4 function</text><text x="270.0" y="214.1" font-size="10.5" font-weight="700" fill="#172b3a" text-anchor="middle">UPS-L4-B2-DH3-A1-01</text><text x="467.5" y="214.1" font-size="10.5" font-weight="700" fill="#172b3a" text-anchor="middle">MEC-L4-CHW-B2-STG-01</text><text x="665.0" y="214.1" font-size="10.5" font-weight="700" fill="#172b3a" text-anchor="middle">BMS-L4-B2-DH3-CDU-SEQ-01</text><text x="862.5" y="214.1" font-size="10.5" font-weight="700" fill="#172b3a" text-anchor="middle">FIRE-L4-CE-B2-DH3</text><text x="46.0" y="236.3" font-size="10.5" font-weight="400" fill="#172b3a" text-anchor="start">L5 IST</text><text x="270.0" y="236.3" font-size="10.5" font-weight="700" fill="#172b3a" text-anchor="middle">IST-B2-DH3 day 2</text><text x="467.5" y="236.3" font-size="10.5" font-weight="700" fill="#172b3a" text-anchor="middle">IST-B2 day 3</text><text x="665.0" y="236.3" font-size="10.5" font-weight="700" fill="#172b3a" text-anchor="middle">IST-DH3-014 (issue)</text><text x="46.0" y="258.6" font-size="10.5" font-weight="400" fill="#172b3a" text-anchor="start">Retest</text><text x="270.0" y="258.6" font-size="10.5" font-weight="700" fill="#172b3a" text-anchor="middle">UPS-L4-B2-DH3-A1-01-RT1</text><text x="665.0" y="258.6" font-size="10.5" font-weight="700" fill="#172b3a" text-anchor="middle">EPMS-L3-B2-DH3-UPS-A3-RT1</text><text x="46.0" y="280.8" font-size="10.5" font-weight="400" fill="#172b3a" text-anchor="start">Gate</text><text x="270.0" y="280.8" font-size="10.5" font-weight="700" fill="#172b3a" text-anchor="middle">GATE-L3-B2-DH3-UPS-A1-M2</text><text x="467.5" y="280.8" font-size="10.5" font-weight="700" fill="#172b3a" text-anchor="middle">GATE-L4-B2-DH3-CRAH-14</text><text x="50.0" y="343.2" font-size="11" font-weight="700" fill="#b7791f" text-anchor="start">How to use the map</text><text x="50.0" y="358.6" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">1. Find the level and the discipline of the record to be filled.</text><text x="50.0" y="373.4" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">2. Search the record ID in chapters 02 to 28 to read the filled example before filling a new record.</text><text x="50.0" y="388.3" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">3. Name a retest with the original ID and the suffix RT1, and link it to the failed record and its issue.</text><text x="24.0" y="30.0" font-size="17" font-weight="700" fill="#172b3a" text-anchor="start">F33-18  Map of record forms by commissioning level and discipline (MSC-1 examples)</text><text x="24.0" y="48.0" font-size="11" font-weight="400" fill="#5b6b78" text-anchor="start">record IDs found in chapters 02 to 28 · L1 FAT reports · L2 installation · L3 start-up · L4 functional tests · L5 IST · retest suffix RT1 · gate records GATE-L3 and GATE-L4</text><text x="32.0" y="439.1" font-size="10" font-weight="700" fill="#2d6a4f" text-anchor="start">WHAT TO PROVE</text><text x="32.0" y="455.1" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">• The UPS block B2-DH3-A1 has a record at every level from UPS-L1-FAT-B2-01 to the L5 day in IST-B2-DH3.</text><text x="32.0" y="470.1" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">• A gate record such as GATE-L4-B2-DH3-CRAH-14 must be signed before the colour tag of the item moves to the next level.</text><rect x="24" y="503.05" width="952" height="44" rx="0" fill="#f6f8fa" fill-opacity="1" stroke="#5b6b78" stroke-width="1"/><text x="32.0" y="517.0" font-size="11" font-weight="700" fill="#172b3a" text-anchor="start">F33-18  ·  Map of record forms by commissioning level and discipline (MSC-1 examples)</text><text x="968.0" y="517.0" font-size="10" font-weight="400" fill="#5b6b78" text-anchor="end">Chapter 33 · §33.22.5</text><text x="32.0" y="530.0" font-size="9" font-weight="400" fill="#5b6b78" text-anchor="start">Data Centre Commissioning Field Manual R01 EN · October 2026 · educational reference, not to scale · project and OEM documents govern</text><text x="32.0" y="542.0" font-size="9" font-weight="400" fill="#5b6b78" text-anchor="start">Symbols: QElectroTech EN 60617 and P&amp;ID collections, CC-BY 3.0, native geometry · instrument bubbles per ISA 5.1 · states per IEC 60617 / IEEE C37.2 practice</text></svg>