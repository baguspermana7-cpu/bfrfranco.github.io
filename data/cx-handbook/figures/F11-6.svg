" cy="288.3" r="4" fill="#b7791f"/><circle cx="804.0" cy="258.6" r="4" fill="#b7791f"/><text x="24.0" y="30.0" font-size="17" font-weight="700" fill="#172b3a" text-anchor="start">F11-6  Weekly PPC and L3 first-pass yield for building B1, weeks 41 to 45 (example data)</text><text x="24.0" y="48.0" font-size="11" font-weight="400" fill="#5b6b78" text-anchor="start">PPC target 80 % · FPY target 90 % · week 45: PPC 81.3 % (52 of 64), TA 85.9 %, TMR 78.6 %, FPY 84.6 % (22 of 26)</text><text x="32.0" y="622.0" font-size="10" font-weight="700" fill="#2d6a4f" text-anchor="start">WHAT TO PROVE</text><text x="32.0" y="638.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">• Week 45 PPC = 52 ÷ 64 = 81.3 %; FPY = 22 ÷ 26 = 84.6 %, below the 90 % target.</text><text x="32.0" y="653.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">• The reasons for the 12 incomplete tasks are counted by category: prerequisite 4, witness 3, permit 2, equipment 2, document 1.</text><rect x="24" y="686" width="1352" height="44" rx="0" fill="#f6f8fa" fill-opacity="1" stroke="#5b6b78" stroke-width="1"/><text x="32.0" y="700.0" font-size="11" font-weight="700" fill="#172b3a" text-anchor="start">F11-6  ·  Weekly PPC and L3 first-pass yield for building B1, weeks 41 to 45 (example data)</text><text x="1368.0" y="700.0" font-size="10" font-weight="400" fill="#5b6b78" text-anchor="end">Chapter 11 · §11.8</text><text x="32.0" y="713.0" font-size="9" font-weight="400" fill="#5b6b78" text-anchor="start">Data Centre Commissioning Field Manual R01 EN · October 2026 · educational reference, not to scale · project and OEM documents govern</text><text x="32.0" y="725.0" font-size="9" font-weight="400" fill="#5b6b78" text-anchor="start">Symbols: QElectroTech EN 60617 and P&amp;ID collections, CC-BY 3.0, native geometry · instrument bubbles per ISA 5.1 · states per IEC 60617 / IEEE C37.2 practice</text></svg>