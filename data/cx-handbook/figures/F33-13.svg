0" fill="#5b6b78" text-anchor="end">150</text><text x="104.0" y="158.5" font-size="10" font-weight="400" fill="#5b6b78" text-anchor="end">200</text><text x="520.0" y="530.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="middle">duration of the event (s, log)</text><text transform="translate(66 310.0) rotate(-90)" font-size="11" text-anchor="middle" fill="#172b3a">voltage (% of nominal)</text><text x="138.0" y="548.0" font-size="10" font-weight="400" fill="#172b3a" text-anchor="start">ITI lower edge</text><text x="138.0" y="563.0" font-size="10" font-weight="400" fill="#172b3a" text-anchor="start">ITI upper edge</text><text x="256.7" y="494.0" font-size="10" font-weight="400" fill="#8a5a00" text-anchor="start">STS 0 V for 4 ms: inside</text><text x="472.9" y="355.8" font-size="10" font-weight="400" fill="#8a5a00" text-anchor="start">80 % for 100 ms: inside</text><text x="500.2" y="407.6" font-size="10" font-weight="400" fill="#8a5a00" text-anchor="start">50 % for 150 ms: below</text><text x="45.0" y="635.0" font-size="11" font-weight="700" fill="#172b3a" text-anchor="start">Test point</text><text x="275.0" y="635.0" font-size="11" font-weight="700" fill="#172b3a" text-anchor="start">Voltage</text><text x="404.4" y="635.0" font-size="11" font-weight="700" fill="#172b3a" text-anchor="start">Duration</text><text x="533.8" y="635.0" font-size="11" font-weight="700" fill="#172b3a" text-anchor="start">Result</text><text x="878.8" y="635.0" font-size="11" font-weight="700" fill="#172b3a" text-anchor="start">Sect.</text><text x="45.0" y="657.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">STS transfer</text><text x="275.0" y="657.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">0 %</text><text x="404.4" y="657.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">4 ms</text><text x="533.8" y="657.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">inside (≤ 20 ms at 0 %)</text><text x="878.8" y="657.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">16.8.3</text><text x="45.0" y="679.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">Waveform trigger 1</text><text x="275.0" y="679.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">80 %</text><text x="404.4" y="679.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">100 ms</text><text x="533.8" y="679.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">inside (70 % edge to 0.5 s)</text><text x="878.8" y="679.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">24.11</text><text x="45.0" y="701.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">Waveform trigger 2</text><text x="275.0" y="701.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">50 %</text><text x="404.4" y="701.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">150 ms</text><text x="533.8" y="701.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">below the lower edge</text><text x="878.8" y="701.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">24.11</text><circle cx="249.7" cy="500.0" r="4" fill="#b7791f"/><circle cx="465.9" cy="361.8" r="4" fill="#b7791f"/><circle cx="493.2" cy="413.6" r="4" fill="#b7791f"/><text x="24.0" y="30.0" font-size="17" font-weight="700" fill="#172b3a" text-anchor="start">F33-13  ITI (CBEMA) voltage tolerance envelope with three UPS and STS test points</text><text x="24.0" y="48.0" font-size="11" font-weight="400" fill="#5b6b78" text-anchor="start">lower edge 0 % to 20 ms, 70 % to 0.5 s, 80 % to 10 s, 90 % beyond · upper edge 200 % to 1 ms, 140 % to 3 ms, 120 % to 0.5 s, 110 % beyond · STS transfer ≤ 4 ms</text><text x="32.0" y="744.0" font-size="10" font-weight="700" fill="#2d6a4f" text-anchor="start">WHAT TO PROVE</text><text x="32.0" y="760.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">• A static transfer with 0 V for 4 ms lies inside the envelope, because the lower edge allows 0 % for up to 20 ms.</text><text x="32.0" y="775.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">• A sag to 80 % for 100 ms lies inside the envelope; a sag to 50 % for 150 ms lies below the 70 % edge and must be captured by the EPMS waveform trigger.</text><rect x="24" y="808.0" width="952" height="44" rx="0" fill="#f6f8fa" fill-opacity="1" stroke="#5b6b78" stroke-width="1"/><text x="32.0" y="822.0" font-size="11" font-weight="700" fill="#172b3a" text-anchor="start">F33-13  ·  ITI (CBEMA) voltage tolerance envelope with three UPS and STS test points</text><text x="968.0" y="822.0" font-size="10" font-weight="400" fill="#5b6b78" text-anchor="end">Chapter 33 · §33.10</text><text x="32.0" y="835.0" font-size="9" font-weight="400" fill="#5b6b78" text-anchor="start">Data Centre Commissioning Field Manual R01 EN · October 2026 · educational reference, not to scale · project and OEM documents govern</text><text x="32.0" y="847.0" font-size="9" font-weight="400" fill="#5b6b78" text-anchor="start">Symbols: QElectroTech EN 60617 and P&amp;ID collections, CC-BY 3.0, native geometry · instrument bubbles per ISA 5.1 · states per IEC 60617 / IEEE C37.2 practice</text></svg>