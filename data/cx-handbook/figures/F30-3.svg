or="start">19</text><text x="394.0" y="728.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">4</text><text x="552.6" y="728.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">8</text><text x="774.7" y="728.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">2</text><circle cx="422.4" cy="156.0" r="4" fill="#b7791f"/><circle cx="461.4" cy="192.0" r="4" fill="#b7791f"/><text x="24.0" y="30.0" font-size="17" font-weight="700" fill="#172b3a" text-anchor="start">F30-3  Dataset 3: P2 RFI cycle time, median and 90th percentile (example data)</text><text x="24.0" y="48.0" font-size="10" font-weight="400" fill="#5b6b78" text-anchor="start">P2 target 5 working days · median above 5 in weeks 4 to 13, worst 9 in week 8 · 90th percentile 18 in week 8 · after the weekly design-review slot (week 9) both fall · week</text><text x="24.0" y="61.0" font-size="10" font-weight="400" fill="#5b6b78" text-anchor="start">20: median 4, 90th percentile 8</text><text x="32.0" y="771.0" font-size="10" font-weight="700" fill="#2d6a4f" text-anchor="start">WHAT TO PROVE</text><text x="32.0" y="787.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">• The median exceeded the 5-day P2 target from week 4 to week 13; the 90th percentile peaked at 18 working days in week 8.</text><text x="32.0" y="802.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">• From week 9 both values fall; at week 20 the median is 4 and the 90th percentile is 8 working days, so 1 RFI in 10 still exceeds the target.</text><rect x="24" y="835.0" width="952" height="44" rx="0" fill="#f6f8fa" fill-opacity="1" stroke="#5b6b78" stroke-width="1"/><text x="32.0" y="849.0" font-size="11" font-weight="700" fill="#172b3a" text-anchor="start">F30-3  ·  Dataset 3: P2 RFI cycle time, median and 90th percentile (example data)</text><text x="968.0" y="849.0" font-size="10" font-weight="400" fill="#5b6b78" text-anchor="end">Chapter 30 · §30.6</t