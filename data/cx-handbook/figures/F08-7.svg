"#ffffff" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><rect x="302.8571428571429" y="500.0" width="328.5714285714286" height="24.0" rx="0" fill="#ffffff" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><rect x="631.4285714285716" y="500.0" width="328.5714285714286" height="24.0" rx="0" fill="#ffffff" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><text x="40.0" y="110.0" font-size="13" font-weight="700" fill="#172b3a" text-anchor="start">Route 1: variation by instruction (13.3.1)</text><text x="124.0" y="146.9" font-size="12" font-weight="700" fill="#475569" text-anchor="middle">Engineer instructs</text><text x="124.0" y="160.4" font-size="10" font-weight="400" fill="#172b3a" text-anchor="middle">Variation stated</text><text x="124.0" y="173.9" font-size="10" font-weight="400" fill="#172b3a" text-anchor="middle">sub-clause 3.5</text><text x="313.2" y="153.7" font-size="12" font-weight="700" fill="#475569" text-anchor="middle">Contractor proceeds</text><text x="313.2" y="167.2" font-size="10" font-weight="400" fill="#172b3a" text-anchor="middle">with the varied work</text><text x="502.4" y="146.9" font-size="12" font-weight="700" fill="#475569" text-anchor="middle">Particulars</text><text x="502.4" y="160.4" font-size="10" font-weight="400" fill="#172b3a" text-anchor="middle">within 28 days</text><text x="502.4" y="173.9" font-size="10" font-weight="400" fill="#172b3a" text-anchor="middle">programme, valuation</text><text x="690.4" y="153.7" font-size="12" font-weight="700" fill="#475569" text-anchor="middle">Agree (3.7)</text><text x="690.4" y="167.2" font-size="10" font-weight="400" fill="#172b3a" text-anchor="middle">within 42 days</text><text x="878.4" y="146.9" font-size="12" font-weight="700" fill="#475569" text-anchor="middle">Determine (3.7)</text><text x="878.4" y="160.4" font-size="10" font-weight="400" fill="#172b3a" text-anchor="middle">further 42 days</text><text x="878.4" y="173.9" font-size="10" font-weight="400" fill="#172b3a" text-anchor="middle">NOD within 28 days</text><text x="40.0" y="250.0" font-size="13" font-weight="700" fill="#172b3a" text-anchor="start">Route 2: variation by request for proposal (13.3.2)</text><text x="124.0" y="286.9" font-size="12" font-weight="700" fill="#334155" text-anchor="middle">Engineer requests</text><text x="124.0" y="300.4" font-size="10" font-weight="400" fill="#172b3a" text-anchor="middle">proposal before</text><text x="124.0" y="313.9" font-size="10" font-weight="400" fill="#172b3a" text-anchor="middle">deciding</text><text x="313.3" y="286.9" font-size="12" font-weight="700" fill="#334155" text-anchor="middle">Contractor proposes</text><text x="313.3" y="300.4" font-size="10" font-weight="400" fill="#172b3a" text-anchor="middle">as soon as</text><text x="313.3" y="313.9" font-size="10" font-weight="400" fill="#172b3a" text-anchor="middle">practicable</text><text x="502.5" y="286.9" font-size="12" font-weight="700" fill="#334155" text-anchor="middle">Engineer decides</text><text x="502.5" y="300.4" font-size="10" font-weight="400" fill="#172b3a" text-anchor="middle">instruct or</text><text x="502.5" y="313.9" font-size="10" font-weight="400" fill="#172b3a" text-anchor="middle">not approve</text><text x="690.5" y="286.9" font-size="12" font-weight="700" fill="#334155" text-anchor="middle">If instructed</text><text x="690.5" y="300.4" font-size="10" font-weight="400" fill="#172b3a" text-anchor="middle">valuation under 3.7</text><text x="690.5" y="313.9" font-size="10" font-weight="400" fill="#172b3a" text-anchor="middle">as route 1</text><text x="878.5" y="286.9" font-size="12" font-weight="700" fill="#334155" text-anchor="middle">If not approved</text><text x="878.5" y="300.4" font-size="10" font-weight="400" fill="#172b3a" text-anchor="middle">proposal cost may</text><text x="878.5" y="313.9" font-size="10" font-weight="400" fill="#172b3a" text-anchor="middle">be claimed (20.2)</text><text x="45.0" y="396.3" font-size="12" font-weight="700" fill="#172b3a" text-anchor="start">Item</text><text x="307.9" y="396.3" font-size="12" font-weight="700" fill="#172b3a" text-anchor="start">Route 1 (13.3.1)</text><text x="636.4" y="396.3" font-size="12" font-weight="700" fill="#172b3a" text-anchor="start">Route 2 (13.3.2)</text><text x="45.0" y="420.3" font-size="12" font-weight="400" fill="#172b3a" text-anchor="start">Who starts</text><text x="307.9" y="420.3" font-size="12" font-weight="400" fill="#172b3a" text-anchor="start">Engineer instruction</text><text x="636.4" y="420.3" font-size="12" font-weight="400" fill="#172b3a" text-anchor="start">Engineer request</text><text x="45.0" y="444.3" font-size="12" font-weight="400" fill="#172b3a" text-anchor="start">Work before price</text><text x="307.9" y="444.3" font-size="12" font-weight="400" fill="#172b3a" text-anchor="start">yes, Contractor proceeds</text><text x="636.4" y="444.3" font-size="12" font-weight="400" fill="#172b3a" text-anchor="start">no, decision after proposal</text><text x="45.0" y="468.3" font-size="12" font-weight="400" fill="#172b3a" text-anchor="start">Contractor time limit</text><text x="307.9" y="468.3" font-size="12" font-weight="400" fill="#172b3a" text-anchor="start">28 days, particulars</text><text x="636.4" y="468.3" font-size="12" font-weight="400" fill="#172b3a" text-anchor="start">as soon as practicable</text><text x="45.0" y="492.3" font-size="12" font-weight="400" fill="#172b3a" text-anchor="start">MSC-1 example</text><text x="307.9" y="492.3" font-size="12" font-weight="400" fill="#172b3a" text-anchor="start">-</text><text x="636.4" y="492.3" font-size="12" font-weight="400" fill="#172b3a" text-anchor="start">VO-B2-017, rack density</text><text x="45.0" y="516.3" font-size="12" font-weight="400" fill="#172b3a" text-anchor="start">Valuation</text><text x="307.9" y="516.3" font-size="12" font-weight="400" fill="#172b3a" text-anchor="start">3.7 agreement or determination</text><text x="636.4" y="516.3" font-size="12" font-weight="400" fill="#172b3a" text-anchor="start">3.7, if instructed</text><text x="40.0" y="564.0" font-size="12" font-weight="400" fill="#172b3a" text-anchor="start">The 28-day period of sub-clause 13.3.1 is quoted from the HKA summary of the 2017 Red Book. NOD = Notice of Dissatisfaction.</text><text x="24.0" y="30.0" font-size="17" font-weight="700" fill="#172b3a" text-anchor="start">F08-7  FIDIC 2017 sub-clause 13.3: variation by instruction and by request for proposal</text><text x="24.0" y="48.0" font-size="10" font-weight="400" fill="#5b6b78" text-anchor="start">13.3.1: Contractor proceeds and gives particulars within 28 days · 13.3.2: proposal as soon as practicable · valuation under 3.7: agree in 42 days, determine in a further 42</text><text x="24.0" y="61.0" font-size="10" font-weight="400" fill="#5b6b78" text-anchor="start">days · NOD within 28 days</text><text x="32.0" y="602.9" font-size="10" font-weight="700" fill="#2d6a4f" text-anchor="start">WHAT TO PROVE</text><text x="32.0" y="618.9" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">• Under 13.3.1 the Contractor proceeds with the work and submits particulars within 28 days of the instruction (or an agreed period).</text><text x="32.0" y="633.9" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">• Under 13.3.2 the cost of a proposal that is not approved may be claimed under sub-clause 20.2; a determination not disputed by a NOD within 28 days becomes</text><text x="32.0" y="648.9" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">final and binding.</text><text x="24.0" y="683.9" font-size="10" font-weight="700" fill="#5b6b78" text-anchor="start">LEGEND</text><line x1="24" y1="705.88" x2="50" y2="705.88" stroke="#475569" stroke-width="3"/><text x="56.0" y="709.9" font-size="10" font-weight="400" fill="#172b3a" text-anchor="start">signal / control</text><line x1="151.9671875" y1="705.88" x2="177.9671875" y2="705.88" stroke="#334155" stroke-width="3"/><text x="184.0" y="709.9" font-size="10" font-weight="400" fill="#172b3a" text-anchor="start">data / network</text><rect x="24" y="723.88" width="952" height="44" rx="0" fill="#f6f8fa" fill-opacity="1" stroke="#5b6b78" stroke-width="1"/><text x="32.0" y="737.9" font-size="11" font-weight="700" fill="#172b3a" text-anchor="start">F08-7  ·  FIDIC 2017 sub-clause 13.3: variation by instruction and by request for proposal</text><text x="968.0" y="737.9" font-size="10" font-weight="400" fill="#5b6b78" text-anchor="end">Chapter 08 · §08.5.3</text><text x="32.0" y="750.9" font-size="9" font-weight="400" fill="#5b6b78" text-anchor="start">Data Centre Commissioning Field Manual R01 EN · October 2026 · educational reference, not to scale · project and OEM documents govern</text><text x="32.0" y="762.9" font-size="9" font-weight="400" fill="#5b6b78" text-anchor="start">Symbols: QElectroTech EN 60617 and P&amp;ID collections, CC-BY 3.0, native geometry · instrument bubbles per ISA 5.1 · states per IEC 60617 / IEEE C37.2 practice</text></svg>