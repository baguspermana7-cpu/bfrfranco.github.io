5" font-weight="700" fill="#334155" text-anchor="middle">ACS server</text><text x="540.0" y="159.6" font-size="9.5" font-weight="400" fill="#172b3a" text-anchor="middle">fire mode status, events</text><text x="900.0" y="136.8" font-size="11.5" font-weight="700" fill="#334155" text-anchor="middle">VMS</text><text x="900.0" y="149.6" font-size="9.5" font-weight="400" fill="#172b3a" text-anchor="middle">camera B2-L1-CAM-041</text><text x="1225.0" y="136.8" font-size="11.5" font-weight="700" fill="#334155" text-anchor="middle">Site NTP server</text><text x="1225.0" y="149.6" font-size="9.5" font-weight="400" fill="#172b3a" text-anchor="middle">time for ACS, VMS</text><text x="192.0" y="250.0" font-size="10.5" font-weight="400" fill="#5b6b78" text-anchor="start">relay opens on alarm</text><text x="1092.0" y="346.0" font-size="10.5" font-weight="400" fill="#5b6b78" text-anchor="start">interlock: one door at a time</text><text x="45.0" y="515.0" font-size="11" font-weight="700" fill="#172b3a" text-anchor="start">Test step</text><text x="300.5" y="515.0" font-size="11" font-weight="700" fill="#172b3a" text-anchor="start">Action</text><text x="811.5" y="515.0" font-size="11" font-weight="700" fill="#172b3a" text-anchor="start">Acceptance</text><text x="45.0" y="537.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">Door forced</text><text x="300.5" y="537.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">open door with mechanical key</text><text x="811.5" y="537.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">alarm in 2 s, camera view opens</text><text x="45.0" y="559.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">Interlock</text><text x="300.5" y="559.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">open door 1, present card at door 2</text><text x="811.5" y="559.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">door 2 stays locked</text><text x="45.0" y="581.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">Network loss</text><text x="300.5" y="581.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">unplug controller network</text><text x="811.5" y="581.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">valid cards still open; events stored</text><text x="45.0" y="603.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">Fire release</text><text x="300.5" y="603.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">detector B2-DH3-SD-112 in alarm</text><text x="811.5" y="603.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">all fail-safe doors release in 1 s</text><text x="45.0" y="625.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">Power loss</text><text x="300.5" y="625.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">switch off lock supply mains</text><text x="811.5" y="625.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">fail-safe releases; fail-secure stays latched</text><text x="24.0" y="30.0" font-size="17" font-weight="700" fill="#172b3a" text-anchor="start">F27-5  Access control interface test: mantrap doors of hall B2-DH3 with fire release, CCTV and power</text><text x="24.0" y="48.0" font-size="11" font-weight="400" fill="#5b6b78" text-anchor="start">fire relay opens on alarm and cuts lock power (a broken wire also releases) · release within 1 s of the relay change · fail-safe maglocks with free exit on the mantrap · fail-secure strikes on fire-rated corridor doors · controller battery 4 h</text><text x="32.0" y="668.0" font-size="10" font-weight="700" fill="#2d6a4f" text-anchor="start">WHAT TO PROVE</text><text x="32.0" y="684.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">• In the B2-DH3 fire release test the 6 fail-safe doors released between 14:02:11.2 and 14:02:11.6, inside 1 s of the relay change at 14:02:11.</text><text x="32.0" y="699.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">• A forced door raises the alarm within 2 s and calls camera B2-L1-CAM-041 to the operator screen; ACS and VMS times agree within 1 s through NTP.</text><text x="24.0" y="734.0" font-size="10" font-weight="700" fill="#5b6b78" text-anchor="start">LEGEND</text><line x1="24" y1="756.0" x2="50" y2="756.0" stroke="#b91c1c" stroke-width="3"/><text x="56.0" y="760.0" font-size="10" font-weight="400" fill="#172b3a" text-anchor="start">trip / protection</text><line x1="155.9671875" y1="756.0" x2="181.9671875" y2="756.0" stroke="#6d28d9" stroke-width="3"/><text x="188.0" y="760.0" font-size="10" font-weight="400" fill="#172b3a" text-anchor="start">DC</text><line x1="224.64999999999998" y1="756.0" x2="250.64999999999998" y2="756.0" stroke="#475569" stroke-width="3"/><text x="256.6" y="760.0" font-size="10" font-weight="400" fill="#172b3a" text-anchor="start">signal / control</text><line x1="352.6171875" y1="756.0" x2="378.6171875" y2="756.0" stroke="#334155" stroke-width="3"/><text x="384.6" y="760.0" font-size="10" font-weight="400" fill="#172b3a" text-anchor="start">data / network</text><rect x="24" y="774.0" width="1352" height="44" rx="0" fill="#f6f8fa" fill-opacity="1" stroke="#5b6b78" stroke-width="1"/><text x="32.0" y="788.0" font-size="11" font-weight="700" fill="#172b3a" text-anchor="start">F27-5  ·  Access control interface test: mantrap doors of hall B2-DH3 with fire release, CCTV and power</text><text x="1368.0" y="788.0" font-size="10" font-weight="400" fill="#5b6b78" text-anchor="end">Chapter 27 · §27.8</text><text x="32.0" y="801.0" font-size="9" font-weight="400" fill="#5b6b78" text-anchor="start">Data Centre Commissioning Field Manual R01 EN · October 2026 · educational reference, not to scale · project and OEM documents govern</text><text x="32.0" y="813.0" font-size="9" font-weight="400" fill="#5b6b78" text-anchor="start">Symbols: QElect