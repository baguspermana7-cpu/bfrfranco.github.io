3a" text-anchor="start">L2 (example)</text><text x="148.0" y="588.0" font-size="10" font-weight="400" fill="#172b3a" text-anchor="start">L3 (example)</text><text x="792.0" y="171.5" font-size="10" font-weight="400" fill="#8a5a00" text-anchor="start">L3 7.0 at 1.5 U0</text><text x="507.0" y="366.2" font-size="10" font-weight="400" fill="#8a5a00" text-anchor="start">L3 2.9 at U0</text><text x="945.0" y="145.0" font-size="11" font-weight="700" fill="#172b3a" text-anchor="start">Phase</text><text x="1091.1" y="145.0" font-size="11" font-weight="700" fill="#172b3a" text-anchor="start">TD at U0</text><text x="1182.4" y="145.0" font-size="11" font-weight="700" fill="#172b3a" text-anchor="start">Stability</text><text x="1273.7" y="145.0" font-size="11" font-weight="700" fill="#172b3a" text-anchor="start">Tip-up</text><text x="945.0" y="167.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">L1</text><text x="1091.1" y="167.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">0.50</text><text x="1182.4" y="167.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">0.01</text><text x="1273.7" y="167.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">0.10</text><text x="945.0" y="189.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">L2</text><text x="1091.1" y="189.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">0.56</text><text x="1182.4" y="189.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">0.02</text><text x="1273.7" y="189.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">0.08</text><text x="945.0" y="211.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">L3</text><text x="1091.1" y="211.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">2.90</text><text x="1182.4" y="211.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">0.35</text><text x="1273.7" y="211.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">6.20</text><text x="945.0" y="233.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">Limit (no action)</text><text x="1091.1" y="233.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">&lt; 4</text><text x="1182.4" y="233.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">&lt; 0.1</text><text x="1273.7" y="233.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">&lt; 5</text><text x="945.0" y="315.0" font-size="11" font-weight="700" fill="#172b3a" text-anchor="start">Decision</text><text x="1085.0" y="315.0" font-size="11" font-weight="700" fill="#172b3a" text-anchor="start">Result</text><text x="945.0" y="337.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">L1, L2</text><text x="1085.0" y="337.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">no action required</text><text x="945.0" y="359.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">L3</text><text x="1085.0" y="359.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">tip-up and stability in &quot;further study&quot;</text><text x="945.0" y="381.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">Next step</text><text x="1085.0" y="381.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">PD test, then repair the joint</text><text x="945.0" y="403.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">Record</text><text x="1085.0" y="403.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">ELE-L2-MVC-011 rev B</text><circle cx="785.0" cy="177.5" r="4" fill="#b7791f"/><circle cx="500.0" cy="372.2" r="4" fill="#b7791f"/><text x="24.0" y="30.0" font-size="17" font-weight="700" fill="#172b3a" text-anchor="start">F13-2  VLF tan delta of three phases of one 20 kV cable (example): mean tan delta against applied voltage</text><text x="24.0" y="48.0" font-size="11" font-weight="400" fill="#5b6b78" text-anchor="start">MSC-1 example cable B2-MV-C-011, 12/20 (24) kV XLPE, 420 m · U0 = 12 kV · steps 0.5, 1.0 and 1.5 U0 (6, 12, 18 kV rms) at 0.1 Hz sine · phase L3 shows a tip-up of 6.2 x 10⁻³</text><text x="32.0" y="637.0" font-size="10" font-weight="700" fill="#2d6a4f" text-anchor="start">WHAT TO PROVE</text><text x="32.0" y="653.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">• Tip-up = mean tan delta at 1.5 U0 minus mean at 0.5 U0: L1 0.10, L2 0.08, L3 6.2 (all x 10⁻³). The L3 tip-up is above the 5 x 10⁻³ limit for &quot;no action required&quot; in the widely reproduced IEEE 400.2-2013 PE table (confirm against IEEE</text><text x="32.0" y="668.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">400.2-2024).</text><text x="32.0" y="683.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">• A new cable with a tip-up of this size is not accepted: the CxM asks for a partial discharge test to locate the defect before the withstand test is repeated.</text><rect x="24" y="716" width="1352" height="44" rx="0" fill="#f6f8fa" fill-opacity="1" stroke="#5b6b78" stroke-width="1"/><text x="32.0" y="730.0" font-size="11" font-weight="700" fill="#172b3a" text-anchor="start">F13-2  ·  VLF tan delta of three phases of one 20 kV cable (example): mean tan delta against applied voltage</text><text x="1368.0" y="730.0" font-size="10" font-weight="400" fill="#5b6b78" text-anchor="end">Chapter 13 · §13.8</text><text x="32.0" y="743.0" font-size="9" font-weight="400" fill="#5b6b78" text-anchor="start">Data Centre Commissioning Field Manual R01 EN · October 2026 · educational reference, not to scale · project and OEM documents govern</text><text x="32.0" y="755.0" font-size="9" font-weight="400" fill="#5b6b78" text-anchor="start">Symbols: QElectroTech EN 60617 and P&amp;ID collections, CC-BY 3.0, native geometry · instrument bubbles per ISA 5.1 · states per IEC 60617 / IEEE C37.2 practice</text></svg>