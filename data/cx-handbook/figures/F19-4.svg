t">12.0 MW total = 9.6 MW in 100 liquid load units at 96 kW + 2.4 MW in 100 air load banks at 24 kW · 3.0 MW per zone busway · about 450 logger channels at 10 s · steps 25, 50, 75, 100 %</text><text x="32.0" y="806.0" font-size="10" font-weight="700" fill="#2d6a4f" text-anchor="start">WHAT TO PROVE</text><text x="32.0" y="822.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">• A 120 kW rack position at 415 V draws 167 A per phase; each zone busway carries 3.0 MW at 100 % load.</text><text x="32.0" y="837.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">• Loggers, the BMS and the EPMS share one time source within 1 s so that the trends of F19-5 can be overlaid.</text><text x="24.0" y="872.0" font-size="10" font-weight="700" fill="#5b6b78" text-anchor="start">LEGEND</text><line x1="24" y1="894.0" x2="50" y2="894.0" stroke="#1d4ed8" stroke-width="3"/><text x="56.0" y="898.0" font-size="10" font-weight="400" fill="#172b3a" text-anchor="start">415 V</text><line x1="107.10625" y1="894.0" x2="133.10625" y2="894.0" stroke="#c2410c" stroke-width="3"/><text x="139.1" y="898.0" font-size="10" font-weight="400" fill="#172b3a" text-anchor="start">heat flow</text><line x1="207.41875" y1="894.0" x2="233.41875" y2="894.0" stroke="#0f766e" stroke-width="3"/><text x="239.4" y="898.0" font-size="10" font-weight="400" fill="#172b3a" text-anchor="start">coolant (TCS)</text><line x1="328.153125" y1="894.0" x2="354.153125" y2="894.0" stroke="#0ea5e9" stroke-width="3"/><text x="360.2" y="898.0" font-size="10" font-weight="400" fill="#172b3a" text-anchor="start">air</text><line x1="395.1703125" y1="894.0" x2="421.1703125" y2="894.0" stroke="#334155" stroke-width="3"/><text x="427.2" y="898.0" font-size="10" font-weight="400" fill="#172b3a" text-anchor="start">data / network</text><rect x="24" y="912.0" width="1352" height="44" rx="0" fill="#f6f8fa" fill-opacity="1" stroke="#5b6b78" stroke-width="1"/><text x="32.0" y="926.0" font-size="11" font-weig