" rx="0" fill="#f1f1f1" fill-opacity="1" stroke="#172b3a" stroke-width="1.4"/><rect x="40" y="544.7" width="520" height="44.3" rx="0" fill="#f1f1f1" fill-opacity="1" stroke="#172b3a" stroke-width="1.4"/><rect x="40" y="593.0" width="520" height="44.3" rx="0" fill="#f1f1f1" fill-opacity="1" stroke="#172b3a" stroke-width="1.4"/><rect x="40" y="641.3" width="520" height="44.3" rx="0" fill="#f1f1f1" fill-opacity="1" stroke="#172b3a" stroke-width="1.4"/><rect x="620" y="110.0" width="211.42857142857142" height="24.0" rx="0" fill="#e9f0f4" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><rect x="831.4285714285714" y="110.0" width="528.5714285714286" height="24.0" rx="0" fill="#e9f0f4" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><rect x="620" y="134.0" width="211.42857142857142" height="24.0" rx="0" fill="#ffffff" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><rect x="831.4285714285714" y="134.0" width="528.5714285714286" height="24.0" rx="0" fill="#ffffff" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><rect x="620" y="158.0" width="211.42857142857142" height="24.0" rx="0" fill="#ffffff" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><rect x="831.4285714285714" y="158.0" width="528.5714285714286" height="24.0" rx="0" fill="#ffffff" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><rect x="620" y="182.0" width="211.42857142857142" height="24.0" rx="0" fill="#ffffff" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><rect x="831.4285714285714" y="182.0" width="528.5714285714286" height="24.0" rx="0" fill="#ffffff" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><rect x="620" y="206.0" width="211.42857142857142" height="24.0" rx="0" fill="#ffffff" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><rect x="831.4285714285714" y="206.0" width="528.5714285714286" height="24.0" rx="0" fill="#ffffff" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><rect x="620" y="230.0" width="211.42857142857142" height="24.0" rx="0" fill="#ffffff" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><rect x="831.4285714285714" y="230.0" width="528.5714285714286" height="24.0" rx="0" fill="#ffffff" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><rect x="620" y="254.0" width="211.42857142857142" height="24.0" rx="0" fill="#ffffff" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><rect x="831.4285714285714" y="254.0" width="528.5714285714286" height="24.0" rx="0" fill="#ffffff" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><rect x="620" y="278.0" width="211.42857142857142" height="24.0" rx="0" fill="#ffffff" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><rect x="831.4285714285714" y="278.0" width="528.5714285714286" height="24.0" rx="0" fill="#ffffff" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><text x="300.0" y="123.8" font-size="12" font-weight="700" fill="#172b3a" text-anchor="middle">1 Header</text><text x="300.0" y="137.3" font-size="10" font-weight="400" fill="#172b3a" text-anchor="middle">ID, revision, CDE number, status</text><text x="300.0" y="172.1" font-size="12" font-weight="700" fill="#172b3a" text-anchor="middle">2 Purpose and scope</text><text x="300.0" y="185.6" font-size="10" font-weight="400" fill="#172b3a" text-anchor="middle">what is proved, which assets</text><text x="300.0" y="220.4" font-size="12" font-weight="700" fill="#172b3a" text-anchor="middle">3 References</text><text x="300.0" y="233.9" font-size="10" font-weight="400" fill="#172b3a" text-anchor="middle">OPR, specification, sequence clauses, standards</text><text x="300.0" y="268.7" font-size="12" font-weight="700" fill="#172b3a" text-anchor="middle">4 Prerequisites</text><text x="300.0" y="282.2" font-size="10" font-weight="400" fill="#172b3a" text-anchor="middle">levels passed, issues, settings, load, trends</text><text x="300.0" y="317.0" font-size="12" font-weight="700" fill="#172b3a" text-anchor="middle">5 Instruments</text><text x="300.0" y="330.5" font-size="10" font-weight="400" fill="#172b3a" text-anchor="middle">calibration and accuracy</text><text x="300.0" y="365.3" font-size="12" font-weight="700" fill="#172b3a" text-anchor="middle">6 Safety and stop criteria</text><text x="300.0" y="378.8" font-size="10" font-weight="400" fill="#172b3a" text-anchor="middle">permits, abort values</text><text x="300.0" y="413.6" font-size="12" font-weight="700" fill="#172b3a" text-anchor="middle">7 Initial conditions</text><text x="300.0" y="427.1" font-size="10" font-weight="400" fill="#172b3a" text-anchor="middle">plant state at the start</text><text x="300.0" y="461.9" font-size="12" font-weight="700" fill="#172b3a" text-anchor="middle">8 Step table</text><text x="300.0" y="475.4" font-size="10" font-weight="400" fill="#172b3a" text-anchor="middle">numbered steps, see right</text><text x="300.0" y="510.2" font-size="12" font-weight="700" fill="#172b3a" text-anchor="middle">9 Restoration</text><text x="300.0" y="523.7" font-size="10" font-weight="400" fill="#172b3a" text-anchor="middle">return to normal</text><text x="300.0" y="558.5" font-size="12" font-weight="700" fill="#172b3a" text-anchor="middle">10 Results summary</text><text x="300.0" y="572.0" font-size="10" font-weight="400" fill="#172b3a" text-anchor="middle">passed, failed, issues</text><text x="300.0" y="606.8" font-size="12" font-weight="700" fill="#172b3a" text-anchor="middle">11 Attachments</text><text x="300.0" y="620.3" font-size="10" font-weight="400" fill="#172b3a" text-anchor="middle">trend and analyser files</text><text x="300.0" y="655.1" font-size="12" font-weight="700" fill="#172b3a" text-anchor="middle">12 Signatures</text><text x="300.0" y="668.6" font-size="10" font-weight="400" fill="#172b3a" text-anchor="middle">contractor, OEM, CxA, CxM, operations</text><text x="625.0" y="126.3" font-size="12" font-weight="700" fill="#172b3a" text-anchor="start">Column</text><text x="836.4" y="126.3" font-size="12" font-weight="700" fill="#172b3a" text-anchor="start">Example (step 3)</text><text x="625.0" y="150.3" font-size="12" font-weight="400" fill="#172b3a" text-anchor="start">Step</text><text x="836.4" y="150.3" font-size="12" font-weight="400" fill="#172b3a" text-anchor="start">3</text><text x="625.0" y="174.3" font-size="12" font-weight="400" fill="#172b3a" text-anchor="start">Action</text><text x="836.4" y="174.3" font-size="12" font-weight="400" fill="#172b3a" text-anchor="start">hold heater load at 2.35 MW for 10 min</text><text x="625.0" y="198.3" font-size="12" font-weight="400" fill="#172b3a" text-anchor="start">Expected response</text><text x="836.4" y="198.3" font-size="12" font-weight="400" fill="#172b3a" text-anchor="start">stage-up command to CH-02</text><text x="625.0" y="222.3" font-size="12" font-weight="400" fill="#172b3a" text-anchor="start">Acceptance and source</text><text x="836.4" y="222.3" font-size="12" font-weight="400" fill="#172b3a" text-anchor="start">10 min ±10 s after step 2 (SOO-B2-CHW rev C 4.3)</text><text x="625.0" y="246.3" font-size="12" font-weight="400" fill="#172b3a" text-anchor="start">Measured</text><text x="836.4" y="246.3" font-size="12" font-weight="400" fill="#172b3a" text-anchor="start">command at 10:12:12 (10 min 2 s)</text><text x="625.0" y="270.3" font-size="12" font-weight="400" fill="#172b3a" text-anchor="start">Result</text><text x="836.4" y="270.3" font-size="12" font-weight="400" fill="#172b3a" text-anchor="start">pass</text><text x="625.0" y="294.3" font-size="12" font-weight="400" fill="#172b3a" text-anchor="start">Initials</text><text x="836.4" y="294.3" font-size="12" font-weight="400" fill="#172b3a" text-anchor="start">witness initials</text><text x="24.0" y="30.0" font-size="17" font-weight="700" fill="#172b3a" text-anchor="start">F03-2  Anatomy of a Level 4 functional performance test script</text><text x="24.0" y="48.0" font-size="11" font-weight="400" fill="#5b6b78" text-anchor="start">twelve parts · step table with seven columns · every acceptance value has a source · step result pass, fail or not tested · script status not started, passed, failed or retest</text><text x="32.0" y="721.6" font-size="10" font-weight="700" fill="#2d6a4f" text-anchor="start">WHAT TO PROVE</text><text x="32.0" y="737.6" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">• Step 3 of the chiller staging script passes when the stage-up command is issued 10 min ±10 s after the load exceeds 90 % of running capacity (SOO-B2-CHW rev C 4.3).</text><text x="32.0" y="752.6" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">• A step that is changed during the test is redlined on the controlled copy and signed by the witness and the contractor.</text><rect x="24" y="785.5999999999999" width="1352" height="44" rx="0" fill="#f6f8fa" fill-opacity="1" stroke="#5b6b78" stroke-width="1"/><text x="32.0" y="799.6" font-size="11" font-weight="700" fill="#172b3a" text-anchor="start">F03-2  ·  Anatomy of a Level 4 functional performance test script</text><text x="1368.0" y="799.6" font-size="10" font-weight="400" fill="#5b6b78" text-anchor="end">Chapter 03 · §03.9</text><text x="32.0" y="812.6" font-size="9" font-weight="400" fill="#5b6b78" text-anchor="start">Data Centre Commissioning Field Manual R01 EN · October 2026 · educational reference, not to scale · project and OEM documents govern</text><text x="32.0" y="824.6" font-size="9" font-weight="400" fill="#5b6b78" text-anchor="start">Symbols: QElectroTech EN 60617 and P&amp;ID collections, CC-BY 3.0, native geometry · instrument bubbles per ISA 5.1 · states per IEC 60617 / IEEE C37.2 practice</text></svg>