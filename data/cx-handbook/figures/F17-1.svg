18309859155" height="22.0" rx="0" fill="#ffffff" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><text x="190.0" y="150.3" font-size="11.5" font-weight="700" fill="#b45309" text-anchor="middle">150/20 kV substation</text><text x="190.0" y="163.2" font-size="9.5" font-weight="400" fill="#172b3a" text-anchor="middle">earth grid 60 x 40 m</text><text x="190.0" y="176.0" font-size="9.5" font-weight="400" fill="#172b3a" text-anchor="middle">touch and step to IEEE 80</text><text x="190.0" y="301.8" font-size="11.5" font-weight="700" fill="#b45309" text-anchor="middle">20 kV neutral resistor</text><text x="190.0" y="314.6" font-size="9.5" font-weight="400" fill="#172b3a" text-anchor="middle">1,000 A, 10 s (example)</text><text x="700.0" y="496.8" font-size="11.5" font-weight="700" fill="#172b3a" text-anchor="middle">Building ring earth and foundation electrode</text><text x="700.0" y="509.6" font-size="9.5" font-weight="400" fill="#172b3a" text-anchor="middle">bare copper 95 mm², 0.8 m deep, rods at corners</text><text x="700.0" y="300.4" font-size="11.5" font-weight="700" fill="#172b3a" text-anchor="middle">Main earthing terminal (MET)</text><text x="700.0" y="313.2" font-size="9.5" font-weight="400" fill="#172b3a" text-anchor="middle">test links, labelled</text><text x="700.0" y="326.0" font-size="9.5" font-weight="400" fill="#172b3a" text-anchor="middle">one N-PE link per block</text><text x="530.0" y="150.3" font-size="11.5" font-weight="700" fill="#1d4ed8" text-anchor="middle">Block transformer 2.5 MVA</text><text x="530.0" y="163.2" font-size="9.5" font-weight="400" fill="#172b3a" text-anchor="middle">20/0.415 kV Dyn11</text><text x="530.0" y="176.0" font-size="9.5" font-weight="400" fill="#172b3a" text-anchor="middle">star point to MET</text><text x="870.0" y="150.3" font-size="11.5" font-weight="700" fill="#1d4ed8" text-anchor="middle">LV switchboard</text><text x="870.0" y="163.2" font-size="9.5" font-weight="400" fill="#172b3a" text-anchor="middle">PE bar and N bar</text><text x="870.0" y="176.0" font-size="9.5" font-weight="400" fill="#172b3a" text-anchor="middle">separate (TN-S)</text><text x="1210.0" y="150.3" font-size="11.5" font-weight="700" fill="#1d4ed8" text-anchor="middle">Data hall</text><text x="1210.0" y="163.2" font-size="9.5" font-weight="400" fill="#172b3a" text-anchor="middle">supplementary bonding</text><text x="1210.0" y="176.0" font-size="9.5" font-weight="400" fill="#172b3a" text-anchor="middle">network, rack frames, trays</text><text x="1210.0" y="320.4" font-size="11.5" font-weight="700" fill="#b91c1c" text-anchor="middle">Lightning protection</text><text x="1210.0" y="333.2" font-size="9.5" font-weight="400" fill="#172b3a" text-anchor="middle">air terminals, mesh</text><text x="1210.0" y="346.0" font-size="9.5" font-weight="400" fill="#172b3a" text-anchor="middle">down conductors</text><text x="1222.0" y="440.0" font-size="10.5" font-weight="400" fill="#5b6b78" text-anchor="start">down conductors</text><text x="545.0" y="236.0" font-size="10.5" font-weight="400" fill="#5b6b78" text-anchor="start">star point</text><text x="45.0" y="615.0" font-size="11" font-weight="700" fill="#172b3a" text-anchor="start">Connection</text><text x="379.6" y="615.0" font-size="11" font-weight="700" fill="#172b3a" text-anchor="start">Test</text><text x="639.9" y="615.0" font-size="11" font-weight="700" fill="#172b3a" text-anchor="start">Instrument</text><text x="918.8" y="615.0" font-size="11" font-weight="700" fill="#172b3a" text-anchor="start">Acceptance (example project values)</text><text x="45.0" y="637.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">Ring earth and rods to remote earth</text><text x="379.6" y="637.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">fall-of-potential, 61.8 %</text><text x="639.9" y="637.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">4-pole earth tester</text><text x="918.8" y="637.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">≤ 1 Ω combined system (project); compare with design</text><text x="45.0" y="659.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">MET to PE bars, structural steel</text><text x="379.6" y="659.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">continuity</text><text x="639.9" y="659.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">low-resistance ohmmeter 10 A</text><text x="918.8" y="659.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">≤ 0.1 Ω per bond (project value)</text><text x="45.0" y="681.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">Down conductor to ring earth</text><text x="379.6" y="681.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">continuity, test joint</text><text x="639.9" y="681.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">low-resistance ohmmeter</text><text x="918.8" y="681.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">overall ≤ 0.2 Ω (confirm 62305-3:2024)</text><text x="45.0" y="703.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">N-PE link (one per block)</text><text x="379.6" y="703.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">neutral current in PE</text><text x="639.9" y="703.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">clamp meter</text><text x="918.8" y="703.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">no neutral current on PE conductors</text><text x="24.0" y="30.0" font-size="17" font-weight="700" fill="#172b3a" text-anchor="start">F17-1  Earthing and bonding scheme of one MSC-1 building: grid, ring earth, MET, TN-S and hall bonding</text><text x="24.0" y="48.0" font-size="10" font-weight="400" fill="#5b6b78" text-anchor="start">150/20 kV substation grid bonded to the building ring earth · 20 kV neutral earthed through a resistor (example 1,000 A for 10 s) · each 2.5 MVA block transformer star point earthed once at the MET (TN-S) · LPS down conductors to the ring</text><text x="24.0" y="61.0" font-size="10" font-weight="400" fill="#5b6b78" text-anchor="start">earth · target ≤ 1 Ω for the combined system (project value)</text><text x="32.0" y="746.0" font-size="10" font-weight="700" fill="#2d6a4f" text-anchor="start">WHAT TO PROVE</text><text x="32.0" y="762.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">• Fall-of-potential test of the combined system gives 0.38 Ω against the ≤ 1 Ω project value; each test link is opened only under a permit and closed and torqued before the record is signed.</text><text x="32.0" y="777.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">• A neutral-to-earth connection anywhere downstream of the MET (for example inside a UPS output board without a separately derived source) is a defect found by the neutral current clamp test.</text><text x="24.0" y="812.0" font-size="10" font-weight="700" fill="#5b6b78" text-anchor="start">LEGEND</text><line x1="24" y1="834.0" x2="50" y2="834.0" stroke="#b45309" stroke-width="3"/><text x="56.0" y="838.0" font-size="10" font-weight="400" fill="#172b3a" text-anchor="start">20 kV</text><line x1="106.534375" y1="834.0" x2="132.534375" y2="834.0" stroke="#1d4ed8" stroke-width="3"/><text x="138.5" y="838.0" font-size="10" font-weight="400" fill="#172b3a" text-anchor="start">415 V</text><line x1="189.640625" y1="834.0" x2="215.640625" y2="834.0" stroke="#b91c1c" stroke-width="3"/><text x="221.6" y="838.0" font-size="10" font-weight="400" fill="#172b3a" text-anchor="start">trip / protection</text><rect x="24" y="852.0" width="1352" height="44" rx="0" fill="#f6f8fa" fill-opacity="1" stroke="#5b6b78" stroke-width="1"/><text x="32.0" y="866.0" font-size="11" font-weight="700" fill="#172b3a" text-anchor="start">F17-1  ·  Earthing and bonding scheme of one MSC-1 building: grid, ring earth, MET, TN-S and hall bonding</text><text x="1368.0" y="866.0" font-size="10" font-weight="400" fill="#5b6b78" text-anchor="end">Chapter 17 · §17.1</text><text x="32.0" y="879.0" font-size="9" font-weight="400" fill="#5b6b78" text-anchor="start">Data Centre Commissioning Field Manual R01 EN · October 2026 · educational reference, not to scale · project and OEM documents govern</text><text x="32.0" y="891.0" font-size="9" font-weight="400" fill="#5b6b78" text-anchor="start">Symbols: QElectroTech EN 60617 and P&amp;ID collections, CC-BY 3.0, native geometry · instrument bubbles per ISA 5.1 · states per IEC 60617 / IEEE C37.2 practice</text></svg>