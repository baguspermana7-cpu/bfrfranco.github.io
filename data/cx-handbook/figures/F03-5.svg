.0" y="191.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">load 4.6 MW</text><text x="1269.4" y="191.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">41</text><text x="995.0" y="213.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">CH-03 commanded</text><text x="1269.4" y="213.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">51</text><text x="995.0" y="235.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">load 9.1 MW</text><text x="1269.4" y="235.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">80</text><text x="995.0" y="257.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">CH-04 commanded</text><text x="1269.4" y="257.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">85</text><text x="995.0" y="279.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">CH-02 trip, CH-05 start</text><text x="1269.4" y="279.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">125 to 127</text><text x="995.0" y="301.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">load 4.0 MW, stage-down timer</text><text x="1269.4" y="301.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">156</text><text x="995.0" y="323.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">CH-03 stopped</text><text x="1269.4" y="323.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">166</text><text x="995.0" y="345.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">one chiller running</text><text x="1269.4" y="345.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">238</text><text x="24.0" y="30.0" font-size="17" font-weight="700" fill="#172b3a" text-anchor="start">F03-5  Chiller staging test trace: heater load, running capacity and chilled water supply temperature</text><text x="24.0" y="48.0" font-size="11" font-weight="400" fill="#5b6b78" text-anchor="start">B2 plant, 5 chillers of 2.5 MW · stage-up at 90 % of running capacity for 10 min or CHWS above 18.8 °C for 5 min · CH-02 trip at about 12:05 with standby start in 1 min 50 s · peak CHWS 19.4 °C, limit 20.0 °C</text><text x="32.0" y="885.0" font-size="10" font-weight="700" fill="#2d6a4f" text-anchor="start">WHAT TO PROVE</text><text x="32.0" y="901.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">• Each stage-up occurs 10 min after the load passes 90 % of running capacity (steps 3 and 8) or 5 min after CHWS passes 18.8 °C (step 10).</text><text x="32.0" y="916.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">• During the CH-02 trip (step 13) CHWS peaks at 19.4 °C, below the 20.0 °C limit, and returns to 18.3 °C within 11 min.</text><rect x="24" y="949" width="1352" height="44" rx="0" fill="#f6f8fa" fill-opacity="1" stroke="#5b6b78" stroke-width="1"/><text x="32.0" y="963.0" font-size="11" font-weight="700" fill="#172b3a" text-anchor="start">F03-5  ·  Chiller staging test trace: heater load, running capacity and chilled water supply temperature</text><text x="1368.0" y="963.0" font-size="10" font-weight="400" fill="#5b6b78" text-anchor="end">Chapter 03 · §03.9</text><text x="32.0" y="976.0" font-size="9" font-weight="400" fill="#5b6b78" text-anchor="start">Data Centre Commissioning Field Manual R01 EN · October 2026 · educational reference, not to scale · project and OEM documents govern</text><text x="32.0" y="988.0" font-size="9" font-weight="400" fill="#5b6b78" text-anchor="start">Symbols: QElectroTech EN 60617 and P&amp;ID collections, CC-BY 3.0, native geometry · instrument bubbles per ISA 5.1 · states per IEC 60617 / IEEE C37.2 practice</text></svg>