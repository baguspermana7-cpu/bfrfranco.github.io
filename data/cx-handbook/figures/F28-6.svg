ill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><rect x="40" y="484.0" width="360.0" height="22.0" rx="0" fill="#ffffff" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><rect x="400.0" y="484.0" width="720.0" height="22.0" rx="0" fill="#ffffff" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><rect x="1120.0" y="484.0" width="240.0" height="22.0" rx="0" fill="#ffffff" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><rect x="40" y="506.0" width="360.0" height="22.0" rx="0" fill="#ffffff" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><rect x="400.0" y="506.0" width="720.0" height="22.0" rx="0" fill="#ffffff" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><rect x="1120.0" y="506.0" width="240.0" height="22.0" rx="0" fill="#ffffff" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><rect x="40" y="528.0" width="360.0" height="22.0" rx="0" fill="#ffffff" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><rect x="400.0" y="528.0" width="720.0" height="22.0" rx="0" fill="#ffffff" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><rect x="1120.0" y="528.0" width="240.0" height="22.0" rx="0" fill="#ffffff" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><rect x="40" y="550.0" width="360.0" height="22.0" rx="0" fill="#ffffff" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><rect x="400.0" y="550.0" width="720.0" height="22.0" rx="0" fill="#ffffff" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><rect x="1120.0" y="550.0" width="240.0" height="22.0" rx="0" fill="#ffffff" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><rect x="40" y="572.0" width="360.0" height="22.0" rx="0" fill="#ffffff" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><rect x="400.0" y="572.0" width="720.0" height="22.0" rx="0" fill="#ffffff" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><rect x="1120.0" y="572.0" width="240.0" height="22.0" rx="0" fill="#ffffff" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><text x="190.0" y="151.7" font-size="12" font-weight="700" fill="#b91c1c" text-anchor="middle">1 Abort value reached</text><text x="190.0" y="165.2" font-size="10" font-weight="400" fill="#172b3a" text-anchor="middle">any person sees it</text><text x="530.0" y="151.7" font-size="12" font-weight="700" fill="#b91c1c" text-anchor="middle">2 Call stop</text><text x="530.0" y="165.2" font-size="10" font-weight="400" fill="#172b3a" text-anchor="middle">channel 1, with reason</text><text x="870.0" y="151.7" font-size="12" font-weight="700" fill="#b91c1c" text-anchor="middle">3 Freeze actions</text><text x="870.0" y="165.2" font-size="10" font-weight="400" fill="#172b3a" text-anchor="middle">nobody operates</text><text x="1210.0" y="151.7" font-size="12" font-weight="700" fill="#b91c1c" text-anchor="middle">4 Reduce load</text><text x="1210.0" y="165.2" font-size="10" font-weight="400" fill="#172b3a" text-anchor="middle">25 % in 2 min, or zero</text><text x="190.0" y="331.7" font-size="12" font-weight="700" fill="#475569" text-anchor="middle">5 Restore sources</text><text x="190.0" y="345.2" font-size="10" font-weight="400" fill="#172b3a" text-anchor="middle">script recovery steps</text><text x="530.0" y="331.7" font-size="12" font-weight="700" fill="#475569" text-anchor="middle">6 Record</text><text x="530.0" y="345.2" font-size="10" font-weight="400" fill="#172b3a" text-anchor="middle">stop record</text><text x="870.0" y="331.7" font-size="12" font-weight="700" fill="#475569" text-anchor="middle">7 Debrief</text><text x="870.0" y="345.2" font-size="10" font-weight="400" fill="#172b3a" text-anchor="middle">within 30 min</text><text x="1210.0" y="331.7" font-size="12" font-weight="700" fill="#475569" text-anchor="middle">8 Decide</text><text x="1210.0" y="345.2" font-size="10" font-weight="400" fill="#172b3a" text-anchor="middle">repeat, void or fail</text><text x="45.0" y="455.0" font-size="11" font-weight="700" fill="#172b3a" text-anchor="start">Condition</text><text x="405.0" y="455.0" font-size="11" font-weight="700" fill="#172b3a" text-anchor="start">Abort value on MSC-1</text><text x="1125.0" y="455.0" font-size="11" font-weight="700" fill="#172b3a" text-anchor="start">Load action</text><text x="45.0" y="477.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">Rack inlet air</text><text x="405.0" y="477.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">&gt; 35 °C for 60 s, or &gt; 32 °C mean of 5 racks</text><text x="1125.0" y="477.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">25 %</text><text x="45.0" y="499.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">TCS supply</text><text x="405.0" y="499.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">&gt; 50 °C for 30 s at any CDU</text><text x="1125.0" y="499.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">25 %</text><text x="45.0" y="521.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">TCS flow</text><text x="405.0" y="521.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">&lt; 50 % of design for 60 s</text><text x="1125.0" y="521.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">25 %</text><text x="45.0" y="543.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">UPS battery</text><text x="405.0" y="543.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">&lt; 30 % state of charge or &lt; 2 min remaining</text><text x="1125.0" y="543.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">25 %</text><text x="45.0" y="565.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">Generator</text><text x="405.0" y="565.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">shutdown alarm or &gt; 110 % load for 60 s</text><text x="1125.0" y="565.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">25 %</text><text x="45.0" y="587.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">Fire, leak, injury</text><text x="405.0" y="587.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">any real event</text><text x="1125.0" y="587.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">zero</text><text x="24.0" y="30.0" font-size="17" font-weight="700" fill="#172b3a" text-anchor="start">F28-6  Abort decision flow: from the stop call to the decision to repeat the scenario</text><text x="24.0" y="48.0" font-size="11" font-weight="400" fill="#5b6b78" text-anchor="start">stop called on channel 1 · all actions frozen · load to 25 % within 2 min (zero for fire, leak or injury) · sources restored by the script recovery steps · debrief within 30 min</text><text x="32.0" y="630.0" font-size="10" font-weight="700" fill="#2d6a4f" text-anchor="start">WHAT TO PROVE</text><text x="32.0" y="646.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">• The abort values sit below damage limits: rack inlet 35 °C for 60 s, TCS supply 50 °C for 30 s, battery 30 % state of charge.</text><text x="32.0" y="661.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">• The stop record holds the time, the caller, the condition, the last completed step and the measured values.</text><text x="24.0" y="696.0" font-size="10" font-weight="700" fill="#5b6b78" text-anchor="start">LEGEND</text><line x1="24" y1="718.0" x2="50" y2="718.0" stroke="#b91c1c" stroke-width="3"/><text x="56.0" y="722.0" font-size="10" font-weight="400" fill="#172b3a" text-anchor="start">trip / protection</text><line x1="155.9671875" y1="718.0" x2="181.9671875" y2="718.0" stroke="#475569" stroke-width="3"/><text x="188.0" y="722.0" font-size="10" font-weight="400" fill="#172b3a" text-anchor="start">signal / control</text><rect x="24" y="736.0" width="1352" height="44" rx="0" fill="#f6f8fa" fill-opacity="1" stroke="#5b6b78" stroke-width="1"/><text x="32.0" y="750.0" font-size="11" font-weight="700" fill="#172b3a" text-anchor="start">F28-6  ·  Abort decision flow: from the stop call to the decision to repeat the scenario</text><text x="1368.0" y="750.0" font-size="10" font-weight="400" fill="#5b6b78" text-anchor="end">Chapter 28 · §28.8</text><text x="32.0" y="763.0" font-size="9" font-weight="400" fill="#5b6b78" text-anchor="start">Data Centre Commissioning Field Manual R01 EN · October 2026 · educational reference, not to scale · project and OEM documents govern</text><text x="32.0" y="775.0" font-size="9" font-weight="400" fill="#5b6b78" text-anchor="start">Symbols: QElectroTech EN 60617 and P&amp;ID collections, CC-BY 3.0, native geometry · instrument bubbles per ISA 5.1 · states per IEC 60617 / IEEE C37.2 practice</text></svg>