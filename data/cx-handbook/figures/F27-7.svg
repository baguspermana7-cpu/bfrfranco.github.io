29" y="446.0" width="237.41935483870967" height="22.0" rx="0" fill="#ffffff" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><rect x="529.6774193548387" y="446.0" width="237.41935483870967" height="22.0" rx="0" fill="#ffffff" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><rect x="767.0967741935483" y="446.0" width="192.90322580645162" height="22.0" rx="0" fill="#ffffff" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><rect x="40" y="468.0" width="252.25806451612902" height="22.0" rx="0" fill="#ffffff" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><rect x="292.258064516129" y="468.0" width="237.41935483870967" height="22.0" rx="0" fill="#ffffff" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><rect x="529.6774193548387" y="468.0" width="237.41935483870967" height="22.0" rx="0" fill="#ffffff" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><rect x="767.0967741935483" y="468.0" width="192.90322580645162" height="22.0" rx="0" fill="#ffffff" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><text x="117.5" y="152.7" font-size="11" font-weight="700" fill="#334155" text-anchor="middle">Vendor laptop</text><text x="117.5" y="164.8" font-size="9" font-weight="400" fill="#172b3a" text-anchor="middle">work order</text><text x="117.5" y="177.0" font-size="9" font-weight="400" fill="#172b3a" text-anchor="middle">WO window</text><text x="290.0" y="152.7" font-size="11" font-weight="700" fill="#b91c1c" text-anchor="middle">Firewall 1</text><text x="290.0" y="164.8" font-size="9" font-weight="400" fill="#172b3a" text-anchor="middle">conduit C1</text><text x="290.0" y="177.0" font-size="9" font-weight="400" fill="#172b3a" text-anchor="middle">HTTPS 443</text><text x="465.0" y="144.7" font-size="11" font-weight="700" fill="#475569" text-anchor="middle">Jump host</text><text x="465.0" y="156.8" font-size="9" font-weight="400" fill="#172b3a" text-anchor="middle">MFA required</text><text x="465.0" y="169.0" font-size="9" font-weight="400" fill="#172b3a" text-anchor="middle">session recorded</text><text x="465.0" y="181.1" font-size="9" font-weight="400" fill="#172b3a" text-anchor="middle">account per window</text><text x="650.0" y="152.7" font-size="11" font-weight="700" fill="#b91c1c" text-anchor="middle">Firewall 2</text><text x="650.0" y="164.8" font-size="9" font-weight="400" fill="#172b3a" text-anchor="middle">conduit C2</text><text x="650.0" y="177.0" font-size="9" font-weight="400" fill="#172b3a" text-anchor="middle">listed flows only</text><text x="845.0" y="152.7" font-size="11" font-weight="700" fill="#334155" text-anchor="middle">OT server</text><text x="845.0" y="164.8" font-size="9" font-weight="400" fill="#172b3a" text-anchor="middle">B2-BMS-SRV-01</text><text x="845.0" y="177.0" font-size="9" font-weight="400" fill="#172b3a" text-anchor="middle">named account, logged</text><text x="465.0" y="262.6" font-size="11" font-weight="700" fill="#475569" text-anchor="middle">Patch server</text><text x="465.0" y="274.8" font-size="9" font-weight="400" fill="#172b3a" text-anchor="middle">malware scan</text><text x="465.0" y="286.9" font-size="9" font-weight="400" fill="#172b3a" text-anchor="middle">files to OT only here</text><text x="865.0" y="274.6" font-size="11" font-weight="700" fill="#b91c1c" text-anchor="middle">Cellular modem</text><text x="865.0" y="286.8" font-size="9" font-weight="400" fill="#172b3a" text-anchor="middle">in vendor chiller panel</text><text x="865.0" y="298.9" font-size="9" font-weight="400" fill="#172b3a" text-anchor="middle">not allowed: remove</text><text x="45.0" y="300.0" font-size="10" font-weight="400" fill="#5b6b78" text-anchor="start">files: never direct</text><text x="45.0" y="395.0" font-size="11" font-weight="700" fill="#172b3a" text-anchor="start">Test case (27.15 step 6)</text><text x="297.3" y="395.0" font-size="11" font-weight="700" fill="#172b3a" text-anchor="start">Account state</text><text x="534.7" y="395.0" font-size="11" font-weight="700" fill="#172b3a" text-anchor="start">Expected result</text><text x="772.1" y="395.0" font-size="11" font-weight="700" fill="#172b3a" text-anchor="start">Record</text><text x="45.0" y="417.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">1 Disabled vendor account</text><text x="297.3" y="417.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">disabled outside window</text><text x="534.7" y="417.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">login refused</text><text x="772.1" y="417.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">jump host log</text><text x="45.0" y="439.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">2 Enabled, no MFA</text><text x="297.3" y="439.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">enabled, MFA not given</text><text x="534.7" y="439.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">login refused</text><text x="772.1" y="439.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">jump host log</text><text x="45.0" y="461.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">3 Enabled with MFA</text><text x="297.3" y="461.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">inside work-order window</text><text x="534.7" y="461.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">login works, recorded</text><text x="772.1" y="461.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">session recording</text><text x="45.0" y="483.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">4 Unlisted path search</text><text x="297.3" y="483.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">all OT switches, rooms</text><text x="534.7" y="483.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">no unknown MAC, no modem</text><text x="772.1" y="483.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">walkdown record</text><text x="24.0" y="30.0" font-size="17" font-weight="700" fill="#172b3a" text-anchor="start">F27-7  Remote access to OT: one path through the jump host, three login tests</text><text x="24.0" y="48.0" font-size="10" font-weight="400" fill="#5b6b78" text-anchor="start">vendor laptop to firewall 1 (conduit C1, HTTPS 443) to jump host in Z2 (MFA, session window, recording) to firewall 2 to OT server in Z3 · files only through the patch server</text><text x="24.0" y="61.0" font-size="10" font-weight="400" fill="#5b6b78" text-anchor="start">with a malware scan · no modem or cellular router in any OT zone</text><text x="32.0" y="526.0" font-size="10" font-weight="700" fill="#2d6a4f" text-anchor="start">WHAT TO PROVE</text><text x="32.0" y="542.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">• A disabled vendor account and an enabled account without MFA are both refused; only an enabled account with MFA inside the work-order window logs in, and the</text><text x="32.0" y="557.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">session is logged.</text><text x="32.0" y="572.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">• A cellular modem found in a chiller or generator vendor panel is removed or listed as a conduit in the approved risk assessment before handover.</text><text x="24.0" y="607.0" font-size="10" font-weight="700" fill="#5b6b78" text-anchor="start">LEGEND</text><line x1="24" y1="629.0" x2="50" y2="629.0" stroke="#334155" stroke-width="3"/><text x="56.0" y="633.0" font-size="10" font-weight="400" fill="#172b3a" text-anchor="start">data / network</text><line x1="150.859375" y1="629.0" x2="176.859375" y2="629.0" stroke="#b91c1c" stroke-width="3"/><text x="182.9" y="633.0" font-size="10" font-weight="400" fill="#172b3a" text-anchor="start">trip / protection</text><line x1="282.8265625" y1="629.0" x2="308.8265625" y2="629.0" stroke="#475569" stroke-width="3"/><text x="314.8" y="633.0" font-size="10" font-weight="400" fill="#172b3a" text-anchor="start">signal / control</text><rect x="24" y="647.0" width="952" height="44" rx="0" fill="#f6f8fa" fill-opacity="1" stroke="#5b6b78" stroke-width="1"/><text x="32.0" y="661.0" font-size="11" font-weight="700" fill="#172b3a" text-anchor="start">F27-7  ·  Remote access to OT: one path through the jump host, three login tests</text><text x="968.0" y="661.0" font-size="10" font-weight="400" fill="#5b6b78" text-anchor="end">Chapter 27 · §27.15</text><text x="32.0" y="674.0" font-size="9" font-weight="400" fill="#5b6b78" text-anchor="start">Data Centre Commissioning Field Manual R01 EN · October 2026 · educational reference, not to scale · project and OEM documents govern</text><text x="32.0" y="686.0" font-size="9" font-weight="400" fill="#5b6b78" text-anchor="start">Symbols: QElectroTech EN 60617 and P&amp;ID collections, CC-BY 3.0, native geometry · instrument bubbles per ISA 5.1 · states per IEC 60617 / IEEE C37.2 practice</text></svg>