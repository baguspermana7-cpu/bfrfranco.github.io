rect x="1060" y="198.0" width="199.2857142857143" height="22.0" rx="0" fill="#ffffff" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><rect x="1259.2857142857142" y="198.0" width="110.71428571428572" height="22.0" rx="0" fill="#ffffff" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><text x="110.0" y="484.0" font-size="10" font-weight="400" fill="#5b6b78" text-anchor="middle">0</text><text x="260.0" y="484.0" font-size="10" font-weight="400" fill="#5b6b78" text-anchor="middle">10</text><text x="410.0" y="484.0" font-size="10" font-weight="400" fill="#5b6b78" text-anchor="middle">20</text><text x="560.0" y="484.0" font-size="10" font-weight="400" fill="#5b6b78" text-anchor="middle">30</text><text x="710.0" y="484.0" font-size="10" font-weight="400" fill="#5b6b78" text-anchor="middle">40</text><text x="860.0" y="484.0" font-size="10" font-weight="400" fill="#5b6b78" text-anchor="middle">50</text><text x="1010.0" y="484.0" font-size="10" font-weight="400" fill="#5b6b78" text-anchor="middle">60</text><text x="104.0" y="474.0" font-size="10" font-weight="400" fill="#5b6b78" text-anchor="end">0</text><text x="104.0" y="414.0" font-size="10" font-weight="400" fill="#5b6b78" text-anchor="end">1</text><text x="104.0" y="354.0" font-size="10" font-weight="400" fill="#5b6b78" text-anchor="end">2</text><text x="104.0" y="294.0" font-size="10" font-weight="400" fill="#5b6b78" text-anchor="end">3</text><text x="104.0" y="234.0" font-size="10" font-weight="400" fill="#5b6b78" text-anchor="end">4</text><text x="104.0" y="174.0" font-size="10" font-weight="400" fill="#5b6b78" text-anchor="end">5</text><text x="104.0" y="114.0" font-size="10" font-weight="400" fill="#5b6b78" text-anchor="end">6</text><text x="560.0" y="500.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="middle">time (s), panel 4 switched off at 10 s</text><text transform="translate(66 290.0) rotate(-90)" font-size="11" text-anchor="middle" fill="#172b3a">polling cycle time (s)</text><text x="138.0" y="518.0" font-size="10" font-weight="400" fill="#172b3a" text-anchor="start">time-out 1,000 ms, 3 retries</text><text x="138.0" y="533.0" font-size="10" font-weight="400" fill="#172b3a" text-anchor="start">time-out 300 ms, 1 retry, offline skip</text><text x="138.0" y="548.0" font-size="10" font-weight="400" fill="#172b3a" text-anchor="start">5 s latency requirement</text><text x="1065.0" y="125.0" font-size="11" font-weight="700" fill="#172b3a" text-anchor="start">Setting</text><text x="1264.3" y="125.0" font-size="11" font-weight="700" fill="#172b3a" text-anchor="start">Cycle</text><text x="1065.0" y="147.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">normal, all 8 panels</text><text x="1264.3" y="147.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">1.2 s</text><text x="1065.0" y="169.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">1,000 ms, 3 retries</text><text x="1264.3" y="169.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">5.2 s</text><text x="1065.0" y="191.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">300 ms, 1 retry</text><text x="1264.3" y="191.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">1.8 s</text><text x="1065.0" y="213.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">after offline skip</text><text x="1264.3" y="213.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">about 1.1 s</text><text x="24.0" y="30.0" font-size="17" font-weight="700" fill="#172b3a" text-anchor="start">F25-6  Shared Modbus RTU port: polling cycle time when one of eight leak panels is switched off</text><text x="24.0" y="48.0" font-size="11" font-weight="400" fill="#5b6b78" text-anchor="start">8 panels at 19,200 bit/s · normal cycle 1.2 s · time-out 1,000 ms with 3 retries gives 5.2 s · time-out 300 ms with 1 retry and offline skip after 3 failed cycles gives 1.8 s, then about 1.1 s</text><text x="32.0" y="597.0" font-size="10" font-weight="700" fill="#2d6a4f" text-anchor="start">WHAT TO PROVE</text><text x="32.0" y="613.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">• With 1,000 ms and 3 retries the cycle stays at 5.2 s for as long as panel 4 is off; a 5 s latency requirement for the other 7 panels fails.</text><text x="32.0" y="628.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">• With 300 ms, 1 retry and an offline skip the cycle is 1.8 s for 3 cycles and then about 1.1 s; the L4 test switches one panel off and measures another panel.</text><rect x="24" y="661" width="1352" height="44" rx="0" fill="#f6f8fa" fill-opacity="1" stroke="#5b6b78" stroke-width="1"/><text x="32.0" y="675.0" font-size="11" font-weight="700" fill="#172b3a" text-anchor="start">F25-6  ·  Shared Modbus RTU port: polling cycle time when one of eight leak panels is switched off</text><text x="1368.0" y="675.0" font-size="10" font-weight="400" fill="#5b6b78" text-anchor="end">Chapter 25 · §25.8</text><text x="32.0" y="688.0" font-size="9" font-weight="400" fill="#5b6b78" text-anchor="start">Data Centre Commissioning Field Manual R01 EN · October 2026 · educational reference, not to scale · project and OEM documents govern</text><text x="32.0" y="700.0" font-size="9" font-weight="400" fill="#5b6b78" text-anchor="start">Symbols: QElectroTech EN 60617 and P&amp;ID collections, CC-BY 3.0, native geometry · instrument bubbles per ISA 5.1 · states per IEC 60617 / IEEE C37.2 practice</text></svg>