22.0" rx="0" fill="#ffffff" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><rect x="382.2222222222222" y="632.0" width="977.7777777777777" height="22.0" rx="0" fill="#ffffff" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><rect x="40" y="654.0" width="342.2222222222222" height="22.0" rx="0" fill="#ffffff" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><rect x="382.2222222222222" y="654.0" width="977.7777777777777" height="22.0" rx="0" fill="#ffffff" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><rect x="40" y="676.0" width="342.2222222222222" height="22.0" rx="0" fill="#ffffff" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><rect x="382.2222222222222" y="676.0" width="977.7777777777777" height="22.0" rx="0" fill="#ffffff" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><rect x="40" y="698.0" width="342.2222222222222" height="22.0" rx="0" fill="#ffffff" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><rect x="382.2222222222222" y="698.0" width="977.7777777777777" height="22.0" rx="0" fill="#ffffff" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><text x="40.0" y="146.0" font-size="13" font-weight="700" fill="#172b3a" text-anchor="start">One-jumper</text><text x="40.0" y="166.0" font-size="10.5" font-weight="400" fill="#5b6b78" text-anchor="start">both end connections counted</text><text x="260.0" y="126.0" font-size="10.5" font-weight="700" fill="#5b6b78" text-anchor="start">reference</text><text x="325.0" y="152.0" font-size="11" font-weight="700" fill="#475569" text-anchor="middle">Source</text><text x="481.0" y="152.0" font-size="11" font-weight="700" fill="#475569" text-anchor="middle">TRC 1</text><text x="637.0" y="152.0" font-size="11" font-weight="700" fill="#475569" text-anchor="middle">Meter</text><text x="260.0" y="196.0" font-size="10.5" font-weight="700" fill="#5b6b78" text-anchor="start">test</text><text x="325.0" y="222.0" font-size="11" font-weight="700" fill="#334155" text-anchor="middle">Source</text><text x="481.0" y="222.0" font-size="11" font-weight="700" fill="#334155" text-anchor="middle">TRC 1</text><text x="637.0" y="222.0" font-size="11" font-weight="700" fill="#334155" text-anchor="middle">Link</text><text x="793.0" y="222.0" font-size="11" font-weight="700" fill="#334155" text-anchor="middle">TRC 2</text><text x="949.0" y="222.0" font-size="11" font-weight="700" fill="#334155" text-anchor="middle">Meter</text><text x="40.0" y="306.0" font-size="13" font-weight="700" fill="#172b3a" text-anchor="start">Two-jumper</text><text x="40.0" y="326.0" font-size="10.5" font-weight="400" fill="#5b6b78" text-anchor="start">one end connection counted</text><text x="260.0" y="286.0" font-size="10.5" font-weight="700" fill="#5b6b78" text-anchor="start">reference</text><text x="325.0" y="311.9" font-size="11" font-weight="700" fill="#475569" text-anchor="middle">Source</text><text x="481.0" y="311.9" font-size="11" font-weight="700" fill="#475569" text-anchor="middle">TRC 1</text><text x="637.0" y="311.9" font-size="11" font-weight="700" fill="#475569" text-anchor="middle">TRC 2</text><text x="793.0" y="311.9" font-size="11" font-weight="700" fill="#475569" text-anchor="middle">Meter</text><text x="260.0" y="356.0" font-size="10.5" font-weight="700" fill="#5b6b78" text-anchor="start">test</text><text x="325.0" y="381.9" font-size="11" font-weight="700" fill="#334155" text-anchor="middle">Source</text><text x="481.0" y="381.9" font-size="11" font-weight="700" fill="#334155" text-anchor="middle">TRC 1</text><text x="637.0" y="381.9" font-size="11" font-weight="700" fill="#334155" text-anchor="middle">Link</text><text x="793.0" y="381.9" font-size="11" font-weight="700" fill="#334155" text-anchor="middle">TRC 2</text><text x="949.0" y="381.9" font-size="11" font-weight="700" fill="#334155" text-anchor="middle">Meter</text><text x="40.0" y="466.0" font-size="13" font-weight="700" fill="#172b3a" text-anchor="start">Three-jumper</text><text x="40.0" y="486.0" font-size="10.5" font-weight="400" fill="#5b6b78" text-anchor="start">no end connection counted</text><text x="260.0" y="446.0" font-size="10.5" font-weight="700" fill="#5b6b78" text-anchor="start">reference</text><text x="325.0" y="471.9" font-size="11" font-weight="700" fill="#475569" text-anchor="middle">Source</text><text x="481.0" y="471.9" font-size="11" font-weight="700" fill="#475569" text-anchor="middle">TRC 1</text><text x="637.0" y="471.9" font-size="11" font-weight="700" fill="#475569" text-anchor="middle">TRC 3</text><text x="793.0" y="471.9" font-size="11" font-weight="700" fill="#475569" text-anchor="middle">TRC 2</text><text x="949.0" y="471.9" font-size="11" font-weight="700" fill="#475569" text-anchor="middle">Meter</text><text x="260.0" y="516.0" font-size="10.5" font-weight="700" fill="#5b6b78" text-anchor="start">test</text><text x="325.0" y="541.9" font-size="11" font-weight="700" fill="#334155" text-anchor="middle">Source</text><text x="481.0" y="541.9" font-size="11" font-weight="700" fill="#334155" text-anchor="middle">TRC 1</text><text x="637.0" y="541.9" font-size="11" font-weight="700" fill="#334155" text-anchor="middle">Link</text><text x="793.0" y="541.9" font-size="11" font-weight="700" fill="#334155" text-anchor="middle">TRC 2</text><text x="949.0" y="541.9" font-size="11" font-weight="700" fill="#334155" text-anchor="middle">Meter</text><text x="45.0" y="625.0" font-size="11" font-weight="700" fill="#172b3a" text-anchor="start">Item</text><text x="387.2" y="625.0" font-size="11" font-weight="700" fill="#172b3a" text-anchor="start">Requirement</text><text x="45.0" y="647.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">Test reference cords (TRC)</text><text x="387.2" y="647.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">reference-grade connectors: mated loss ≤ 0.10 dB multimode, ≤ 0.20 dB single-mode; 1 to 5 m long</text><text x="45.0" y="669.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">Launch condition, multimode</text><text x="387.2" y="669.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">encircled flux per IEC 61280-4-1 / ANSI/TIA-526-14-C (850 nm required on 50/125 µm in TIA)</text><text x="45.0" y="691.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">Reference check</text><text x="387.2" y="691.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">after setting reference, connect TRC 1 to TRC 2 through an adapter: reading ≤ 0.10 dB (MM) or ≤ 0.20 dB (SM), else clean and redo</text><text x="45.0" y="713.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">Wavelengths</text><text x="387.2" y="713.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">multimode 850 and 1300 nm; single-mode 1310 and 1550 nm; both directions where the specification asks for it</text><text x="24.0" y="30.0" font-size="17" font-weight="700" fill="#172b3a" text-anchor="start">F26-7  Tier 1 loss test reference methods: one-jumper, two-jumper and three-jumper (TIA-526 names)</text><text x="24.0" y="48.0" font-size="11" font-weight="400" fill="#5b6b78" text-anchor="start">one-jumper (formerly Method B): includes both end connections in the result · two-jumper (formerly Method A): includes one · three-jumper (formerly Method C): includes none · multimode source with encircled-flux launch cord</text><text x="32.0" y="756.0" font-size="10" font-weight="700" fill="#2d6a4f" text-anchor="start">WHAT TO PROVE</text><text x="32.0" y="772.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">• A one-jumper reference followed by a link test counts both end connector pairs, which matches the TIA-568.3-D link definition and the 0.75 dB per pair budget.</text><text x="32.0" y="787.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">• Setting a reference through an adapter (two-jumper) removes one connection from the result and makes a bad link look up to 0.75 dB better.</text><text x="24.0" y="822.0" font-size="10" font-weight="700" fill="#5b6b78" text-anchor="start">LEGEND</text><line x1="24" y1="844.0" x2="50" y2="844.0" stroke="#475569" stroke-width="3"/><text x="56.0" y="848.0" font-size="10" font-weight="400" fill="#172b3a" text-anchor="start">signal / control</text><line x1="151.9671875" y1="844.0" x2="177.9671875" y2="844.0" stroke="#334155" stroke-width="3"/><text x="184.0" y="848.0" font-size="10" font-weight="400" fill="#172b3a" text-anchor="start">data / network</text><rect x="24" y="862.0" width="1352" height="44" rx="0" fill="#f6f8fa" fill-opacity="1" stroke="#5b6b78" stroke-width="1"/><text x="32.0" y="876.0" font-size="11" font-weight="700" fill="#172b3a" text-anchor="start">F26-7  ·  Tier 1 loss test reference methods: one-jumper, two-jumper and three-jumper (TIA-526 names)</text><text x="1368.0" y="876.0" font-size="10" font-weight="400" fill="#5b6b78" text-anchor="end">Chapter 26 · §26.8</text><text x="32.0" y="889.0" font-size="9" font-weight="400" fill="#5b6b78" text-anchor="start">Data Centre Commissioning Field Manual R01 EN · October 2026 · educational reference, not to scale · project and OEM documents govern</text><text x="32.0" y="901.0" font-size="9" font-weight="400" fill="#5b6b78" text-anchor="start">Symbols: QElectroTech EN 60617 and P&amp;ID collections, CC-BY 3.0, native geometry · instrument bubbles per ISA 5.1 · states per IEC 60617 / IEEE C37.2 practice</text></svg>