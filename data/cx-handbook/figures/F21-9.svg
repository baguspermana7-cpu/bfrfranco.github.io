11" font-weight="700" fill="#172b3a" text-anchor="start">CDUs without supervision</text><text x="539.1" y="282.2" font-size="11" font-weight="700" fill="#172b3a" text-anchor="start">Supervised per zone</text><text x="726.5" y="282.2" font-size="11" font-weight="700" fill="#172b3a" text-anchor="start">Unit state</text><text x="45.0" y="304.2" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">None</text><text x="283.5" y="304.2" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">0</text><text x="539.1" y="304.2" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">4</text><text x="726.5" y="304.2" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">normal control</text><text x="45.0" y="326.2" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">Switch A lost</text><text x="283.5" y="326.2" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">8 (odd numbers)</text><text x="539.1" y="326.2" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">2</text><text x="726.5" y="326.2" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">local control</text><text x="45.0" y="348.2" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">Switch B lost</text><text x="283.5" y="348.2" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">8 (even numbers)</text><text x="539.1" y="348.2" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">2</text><text x="726.5" y="348.2" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">local control</text><text x="45.0" y="370.2" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">Automation server lost</text><text x="283.5" y="370.2" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">16</text><text x="539.1" y="370.2" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">0</text><text x="726.5" y="370.2" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">local control, safe state</text><text x="24.0" y="30.0" font-size="17" font-weight="700" fill="#172b3a" text-anchor="start">F21-9  Split of the hall 3 CDUs across the two hall switches</text><text x="24.0" y="48.0" font-size="11" font-weight="400" fill="#5b6b78" text-anchor="start">B2-DH3: 4 zones × 4 CDUs = 16 CDUs · odd units on switch A, even units on switch B · loss of one switch: 8 CDUs unsupervised, 2 supervised per zone</text><text x="32.0" y="413.2" font-size="10" font-weight="700" fill="#2d6a4f" text-anchor="start">WHAT TO PROVE</text><text x="32.0" y="429.2" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">• Loss of switch A removes supervision of CDUs 01, 03, 05, 07, 09, 11, 13 and 15; each zone keeps two supervised units.</text><text x="32.0" y="444.2" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">• All 16 CDUs keep running on local control during the loss; the network path failure test in chapter 22 records the alarm and the recovery.</text><rect x="24" y="477.2" width="952" height="44" rx="0" fill="#f6f8fa" fill-opacity="1" stroke="#5b6b78" stroke-width="1"/><text x="32.0" y="491.2" font-size="11" font-weight="700" fill="#172b3a" text-anchor="start">F21-9  ·  Split of the hall 3 CDUs across the two hall switches</text><text x="968.0" y="491.2" font-size="10" font-weight="400" fill="#5b6b78" text-anchor="end">Chapter 21 · §21.13.2</text><text x="32.0" y="504.2" font-size="9" font-weight="400" fill="#5b6b78" text-anchor="start">Data Centre Commissioning Field Manual R01 EN · October 2026 · educational reference, not to scale · project and OEM documents govern</text><text x="32.0" y="516.2" font-size="9" font-weight="400" fill="#5b6b78" text-anchor="start">Symbols: QElectroTech EN 60617 and P&amp;ID collections, CC-BY 3.0, native geometry · instrument bubbles per ISA 5.1 · states per IEC 60617 / IEEE C37.2 practice</text></svg>