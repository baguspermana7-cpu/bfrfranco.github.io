t-weight="400" fill="#8a5a00" text-anchor="start">switch reboot: 48 devices for 2 h</text><text x="45.0" y="593.0" font-size="11" font-weight="700" fill="#172b3a" text-anchor="start">Item</text><text x="505.0" y="593.0" font-size="11" font-weight="700" fill="#172b3a" text-anchor="start">Value</text><text x="45.0" y="615.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">Expected records</text><text x="505.0" y="615.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">431 x 4 x 72 = 124,128</text><text x="45.0" y="637.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">First received</text><text x="505.0" y="637.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">123,624 (99.59 %)</text><text x="45.0" y="659.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">After back-fill</text><text x="505.0" y="659.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">124,008 (99.90 %)</text><text x="45.0" y="681.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">Longest single-device gap after back-fill</text><text x="505.0" y="681.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">15 min</text><text x="45.0" y="703.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">Result</text><text x="505.0" y="703.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">pass against ≥ 99.5 % and ≤ 1 h gap</text><circle cx="463.1" cy="420.6" r="4" fill="#b7791f"/><text x="24.0" y="30.0" font-size="17" font-weight="700" fill="#172b3a" text-anchor="start">F24-6  72 h data completeness run: 15-minute energy records received per hour for one building</text><text x="24.0" y="48.0" font-size="10" font-weight="400" fill="#5b6b78" text-anchor="start">431 devices x 4 records per hour = 1,724 expected per hour · 72 h = 124,128 records · before back-fill 123,624 (99.59 %) · switch B2-ER2-SW03 reboot at hours 31 to 33 ·</text><text x="24.0" y="61.0" font-size="10" font-weight="400" fill="#5b6b78" text-anchor="start">after back-fill 124,008 (99.90 %) · acceptance ≥ 99.5 %, no device gap above 1 h</text><text x="32.0" y="746.0" font-size="10" font-weight="700" fill="#2d6a4f" text-anchor="start">WHAT TO PROVE</text><text x="32.0" y="762.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">• Expected 124,128 records; 123,624 first received (99.59 %); 124,008 after back-fill from onboard device logs (99.90 %): pass against 99.5 %.</text><text x="32.0" y="777.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">• The 384 records of the 2 h gap were recovered from device memory; the 120 scattered misses (hours 10, 45, 60) remain and are listed by device in the record.</text><rect x="24" y="810.0" width="952" height="44" rx="0" fill="#f6f8fa" fill-opacity="1" stroke="#5b6b78" stroke-width="1"/><text x="32.0" y="824.0" font-size="11" font-weight="700" fill="#172b3a" text-anchor="start">F24-6  ·  72 h data completeness run: 15-minute energy records received per hour for one building</text><text x="968.0" y="824.0" font-size="10" font-weight="400" fill="#5b6b78" text-anchor="end">Chapter 24 · §24.13</text><text x="32.0" y="837.0" font-size="9" font-weight="400" fill="#5b6b78" text-anchor="start">Data Centre Commissioning Field Manual R01 EN · October 2026 · educational reference, not to scale · project and OEM documents govern</text><text x="32.0" y="849.0" font-size="9" font-weight="400" fill="#5b6b78" text-anchor="start">Symbols: QElectroTech EN 60617 and P&amp;ID collections, CC-BY 3.0, native geometry · instrument bubbles per ISA 5.1 · states per IEC 60617 / IEEE C37.2 practice</text></svg>