0" height="64" rx="0" fill="#ffffff" fill-opacity="1" stroke="#334155" stroke-width="1.4"/><text x="60.0" y="112.0" font-size="12.5" font-weight="700" fill="#b91c1c" text-anchor="start">No-go criteria (all must be met)</text><text x="250.0" y="140.8" font-size="11.5" font-weight="700" fill="#b91c1c" text-anchor="middle">Script approved</text><text x="250.0" y="153.6" font-size="9.5" font-weight="400" fill="#172b3a" text-anchor="middle">approval stamp, revision</text><text x="250.0" y="194.8" font-size="11.5" font-weight="700" fill="#b91c1c" text-anchor="middle">L2 checklists signed</text><text x="250.0" y="207.6" font-size="9.5" font-weight="400" fill="#172b3a" text-anchor="middle">checklist register extract</text><text x="250.0" y="248.8" font-size="11.5" font-weight="700" fill="#b91c1c" text-anchor="middle">Earlier L3 tests signed</text><text x="250.0" y="261.6" font-size="9.5" font-weight="400" fill="#172b3a" text-anchor="middle">test register extract</text><text x="250.0" y="302.8" font-size="11.5" font-weight="700" fill="#b91c1c" text-anchor="middle">No open category A issue</text><text x="250.0" y="315.6" font-size="9.5" font-weight="400" fill="#172b3a" text-anchor="middle">issues log filter</text><text x="250.0" y="356.8" font-size="11.5" font-weight="700" fill="#b91c1c" text-anchor="middle">Instruments calibrated</text><text x="250.0" y="369.6" font-size="9.5" font-weight="400" fill="#172b3a" text-anchor="middle">certificate numbers, expiry dates</text><text x="250.0" y="410.8" font-size="11.5" font-weight="700" fill="#b91c1c" text-anchor="middle">Load bank or heat source ready</text><text x="250.0" y="423.6" font-size="9.5" font-weight="400" fill="#172b3a" text-anchor="middle">delivery note, connection check</text><text x="60.0" y="470.0" font-size="12.5" font-weight="700" fill="#475569" text-anchor="start">Conditional criteria</text><text x="250.0" y="498.8" font-size="11.5" font-weight="700" fill="#475569" text-anchor="middle">Permits requested</text><text x="250.0" y="511.6" font-size="9.5" font-weight="400" fill="#172b3a" text-anchor="middle">permit request numbers</text><text x="250.0" y="552.8" font-size="11.5" font-weight="700" fill="#475569" text-anchor="middle">Witnesses confirmed</text><text x="250.0" y="565.6" font-size="9.5" font-weight="400" fill="#172b3a" text-anchor="middle">witness notice and reply</text><text x="250.0" y="606.8" font-size="11.5" font-weight="700" fill="#475569" text-anchor="middle">Alarm plan agreed</text><text x="250.0" y="619.6" font-size="9.5" font-weight="400" fill="#172b3a" text-anchor="middle">alarm plan reference</text><text x="730.0" y="266.7" font-size="12" font-weight="700" fill="#172b3a" text-anchor="middle">All 6 no-go criteria met</text><text x="730.0" y="280.2" font-size="10" font-weight="400" fill="#172b3a" text-anchor="middle">each with a record</text><text x="730.0" y="136.9" font-size="12" font-weight="700" fill="#b91c1c" text-anchor="middle">No-go</text><text x="730.0" y="150.4" font-size="10" font-weight="400" fill="#172b3a" text-anchor="middle">new date in the look-ahead</text><text x="730.0" y="163.9" font-size="10" font-weight="400" fill="#172b3a" text-anchor="middle">constraint owner named</text><text x="730.0" y="446.7" font-size="12" font-weight="700" fill="#172b3a" text-anchor="middle">All 3 conditional criteria met</text><text x="730.0" y="460.2" font-size="10" font-weight="400" fill="#172b3a" text-anchor="middle">permits, witnesses, alarm plan</text><text x="730.0" y="583.6" font-size="12" font-weight="700" fill="#c2410c" text-anchor="middle">Go with conditions</text><text x="730.0" y="597.1" font-size="10" font-weight="400" fill="#172b3a" text-anchor="middle">owner and close-by time per item</text><text x="730.0" y="703.6" font-size="12" font-weight="700" fill="#334155" text-anchor="middle">Go</text><text x="730.0" y="717.1" font-size="10" font-weight="400" fill="#172b3a" text-anchor="middle">test starts on the planned date</text><text x="740.0" y="222.0" font-size="11" font-weight="700" fill="#b91c1c" text-anchor="start">no</text><text x="740.0" y="352.0" font-size="11" font-weight="700" fill="#172b3a" text-anchor="start">yes</text><text x="940.0" y="520.0" font-size="11" font-weight="700" fill="#c2410c" text-anchor="start">no</text><text x="530.0" y="520.0" font-size="11" font-weight="700" fill="#334155" text-anchor="start">yes</text><text x="60.0" y="780.0" font-size="12" font-weight="400" fill="#172b3a" text-anchor="start">Record: TRR decision record with date, attendees, the status of each criterion and the decision; filed with the test script in the CDE.</text><text x="24.0" y="30.0" font-size="17" font-weight="700" fill="#172b3a" text-anchor="start">F11-7  Test readiness review: go, go with conditions or no-go</text><text x="24.0" y="48.0" font-size="11" font-weight="400" fill="#5b6b78" text-anchor="start">held 2 to 3 working days before each L3, L4 and L5 test · 30 to 60 minutes · 6 no-go criteria · 3 conditional criteria · chaired by the CxM</text><text x="32.0" y="818.9" font-size="10" font-weight="700" fill="#2d6a4f" text-anchor="start">WHAT TO PROVE</text><text x="32.0" y="834.9" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">• A test with an unsigned L2 checklist, an open category A issue or an uncalibrated instrument is a no-go, whatever the other criteria show.</text><text x="32.0" y="849.9" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">• A &quot;go with conditions&quot; record names each condition, its owner and the time by which it is closed before the first test step.</text><text x="24.0" y="884.9" font-size="10" font-weight="700" fill="#5b6b78" text-anchor="start">LEGEND</text><line x1="24" y1="906.88" x2="50" y2="906.88" stroke="#b91c1c" stroke-width="3"/><text x="56.0" y="910.9" font-size="10" font-weight="400" fill="#172b3a" text-anchor="start">trip / protection</text><line x1="155.9671875" y1="906.88" x2="181.9671875" y2="906.88" stroke="#475569" stroke-width="3"/><text x="188.0" y="910.9" font-size="10" font-weight="400" fill="#172b3a" text-anchor="start">signal / control</text><line x1="283.934375" y1="906.88" x2="309.934375" y2="906.88" stroke="#c2410c" stroke-width="3"/><text x="315.9" y="910.9" font-size="10" font-weight="400" fill="#172b3a" text-anchor="start">heat flow</text><line x1="384.246875" y1="906.88" x2="410.246875" y2="906.88" stroke="#334155" stroke-width="3"/><text x="416.2" y="910.9" font-size="10" font-weight="400" fill="#172b3a" text-anchor="start">data / network</text><rect x="24" y="924.88" width="952" height="44" rx="0" fill="#f6f8fa" fill-opacity="1" stroke="#5b6b78" stroke-width="1"/><text x="32.0" y="938.9" font-size="11" font-weight="700" fill="#172b3a" text-anchor="start">F11-7  ·  Test readiness review: go, go with conditions or no-go</text><text x="968.0" y="938.9" font-size="10" font-weight="400" fill="#5b6b78" text-anchor="end">Chapter 11 · §11.2.5</text><text x="32.0" y="951.9" font-size="9" font-weight="400" fill="#5b6b78" text-anchor="start">Data Centre Commissioning Field Manual R01 EN · October 2026 · educational reference, not to scale · project and OEM documents govern</text><text x="32.0" y="963.9" font-size="9" font-weight="400" fill="#5b6b78" text-anchor="start">Symbols: QElectroTech EN 60617 and P&amp;ID collections, CC-BY 3.0, native geometry · instrument bubbles per ISA 5.1 · states per IEC 60617 / IEEE C37.2 practice</text></svg>