" text-anchor="start">28</text><text x="144.0" y="478.6" font-size="11.5" font-weight="400" fill="#172b3a" text-anchor="start">31 March 2026</text><text x="408.0" y="478.6" font-size="11.5" font-weight="400" fill="#172b3a" text-anchor="start">latest Notice of Claim; Engineer period to reject a late notice ends</text><text x="1134.0" y="478.6" font-size="11.5" font-weight="400" fill="#172b3a" text-anchor="start">20.2.1, 20.2.2</text><text x="45.0" y="501.6" font-size="11.5" font-weight="400" fill="#172b3a" text-anchor="start">84</text><text x="144.0" y="501.6" font-size="11.5" font-weight="400" fill="#172b3a" text-anchor="start">26 May 2026</text><text x="408.0" y="501.6" font-size="11.5" font-weight="400" fill="#172b3a" text-anchor="start">latest fully detailed Claim</text><text x="1134.0" y="501.6" font-size="11.5" font-weight="400" fill="#172b3a" text-anchor="start">20.2.4</text><text x="45.0" y="524.6" font-size="11.5" font-weight="400" fill="#172b3a" text-anchor="start">126</text><text x="144.0" y="524.6" font-size="11.5" font-weight="400" fill="#172b3a" text-anchor="start">7 July 2026</text><text x="408.0" y="524.6" font-size="11.5" font-weight="400" fill="#172b3a" text-anchor="start">end of the 42-day agreement period</text><text x="1134.0" y="524.6" font-size="11.5" font-weight="400" fill="#172b3a" text-anchor="start">3.7</text><text x="45.0" y="547.6" font-size="11.5" font-weight="400" fill="#172b3a" text-anchor="start">168</text><text x="144.0" y="547.6" font-size="11.5" font-weight="400" fill="#172b3a" text-anchor="start">18 August 2026</text><text x="408.0" y="547.6" font-size="11.5" font-weight="400" fill="#172b3a" text-anchor="start">end of the 42-day determination period</text><text x="1134.0" y="547.6" font-size="11.5" font-weight="400" fill="#172b3a" text-anchor="start">3.7</text><text x="45.0" y="570.6" font-size="11.5" font-weight="400" fill="#172b3a" text-anchor="start">196</text><text x="144.0" y="570.6" font-size="11.5" font-weight="400" fill="#172b3a" text-anchor="start">15 September 2026</text><text x="408.0" y="570.6" font-size="11.5" font-weight="400" fill="#172b3a" text-anchor="start">latest Notice of Dissatisfaction</text><text x="1134.0" y="570.6" font-size="11.5" font-weight="400" fill="#172b3a" text-anchor="start">3.7.5</text><text x="24.0" y="30.0" font-size="17" font-weight="700" fill="#172b3a" text-anchor="start">F08-2  FIDIC 2017 claim timeline for the MSC-1 MV room access claim, in calendar days from awareness</text><text x="24.0" y="48.0" font-size="11" font-weight="400" fill="#5b6b78" text-anchor="start">awareness 3 March 2026 · notice sent day 14 · notice limit day 28 · Engineer 14 days to reject a late notice · fully detailed claim day 84 · 42 days agreement · 42 days determination · NOD within 28 days</text><text x="32.0" y="614.0" font-size="10" font-weight="700" fill="#2d6a4f" text-anchor="start">WHAT TO PROVE</text><text x="32.0" y="630.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">• Day 28 is 31 March 2026 and day 84 is 26 May 2026; the 3.7 periods in the example run from receipt of the fully detailed claim on 26 May.</text><text x="32.0" y="645.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">• The determination by 18 August 2026 becomes final and binding unless a Notice of Dissatisfaction is given by 15 September 2026.</text><rect x="24" y="678.0" width="1352" height="44" rx="0" fill="#f6f8fa" fill-opacity="1" stroke="#5b6b78" stroke-width="1"/><text x="32.0" y="692.0" font-size="11" font-weight="700" fill="#172b3a" text-anchor="start">F08-2  ·  FIDIC 2017 claim timeline for the MSC-1 MV room access claim, in calendar days from awareness</text><text x="1368.0" y="692.0" font-size="10" font-weight="400" fill="#5b6b78" text-anchor="end">Chapter 08 · §08.8</text><text x="32.0" y="705.0" font-size="9" font-weight="400" fill="#5b6b78" text-anchor="start">Data Centre Commissioning Field Manual R01 EN · October 2026 · educational reference, not to scale · project and OEM documents govern</text><text x="32.0" y="717.0" font-size="9" font-weight="400" fill="#5b6b78" text-anchor="start">Symbols: QElectroTech EN 60617 and P&amp;ID collections, CC-BY 3.0, native geometry · instrument bubbles per ISA 5.1 · states per IEC 60617 / IEEE C37.2 practice</text></svg>