x="0" fill="#ffffff" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><text x="240.0" y="134.9" font-size="13" font-weight="700" fill="#475569" text-anchor="middle">Data level (L3)</text><text x="240.0" y="149.8" font-size="11" font-weight="400" fill="#172b3a" text-anchor="middle">value, scaling, units</text><text x="240.0" y="164.6" font-size="11" font-weight="400" fill="#172b3a" text-anchor="middle">quality, time stamp</text><text x="700.0" y="134.9" font-size="13" font-weight="700" fill="#475569" text-anchor="middle">Function level (L4)</text><text x="700.0" y="149.8" font-size="11" font-weight="400" fill="#172b3a" text-anchor="middle">alarm, command, interlock</text><text x="700.0" y="164.6" font-size="11" font-weight="400" fill="#172b3a" text-anchor="middle">loss of communication</text><text x="1160.0" y="134.9" font-size="13" font-weight="700" fill="#475569" text-anchor="middle">Scenario level (L5)</text><text x="1160.0" y="149.8" font-size="11" font-weight="400" fill="#172b3a" text-anchor="middle">all interfaces in an event</text><text x="1160.0" y="164.6" font-size="11" font-weight="400" fill="#172b3a" text-anchor="middle">IST scripts, chapter 28</text><text x="45.0" y="275.0" font-size="11" font-weight="700" fill="#172b3a" text-anchor="start">Level</text><text x="191.7" y="275.0" font-size="11" font-weight="700" fill="#172b3a" text-anchor="start">CDU 07 example</text><text x="631.7" y="275.0" font-size="11" font-weight="700" fill="#172b3a" text-anchor="start">Acceptance</text><text x="1071.7" y="275.0" font-size="11" font-weight="700" fill="#172b3a" text-anchor="start">Record</text><text x="45.0" y="297.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">Data</text><text x="191.7" y="297.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">30 points read against the CDU display and reference instruments</text><text x="631.7" y="297.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">difference inside tolerance; quality flags correct</text><text x="1071.7" y="297.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">P2P-B2-DH3-CDU07</text><text x="45.0" y="319.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">Function</text><text x="191.7" y="319.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">leak tray wetted; pump 1 stopped; Modbus link disconnected</text><text x="631.7" y="319.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">alarm at operations centre ≤ 10 s; standby pump ≤ 10 s; stale after 60 s</text><text x="1071.7" y="319.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">BMS-L4-B2-DH3-CDU-SEQ-01</text><text x="45.0" y="341.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">Scenario</text><text x="191.7" y="341.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">CDU 07 lost at full load during the hall IST</text><text x="631.7" y="341.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">zone supply below the abort line; survivors carry the load</text><text x="1071.7" y="341.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">IST record, day 3</text><text x="24.0" y="30.0" font-size="17" font-weight="700" fill="#172b3a" text-anchor="start">F25-4  Integration test levels mapped to commissioning levels L3, L4 and L5</text><text x="24.0" y="48.0" font-size="11" font-weight="400" fill="#5b6b78" text-anchor="start">data level: every mapped point of the first unit of each type and P2P on every unit · function level: every ICD function once per type, every leak alarm on every unit · scenario level: every L5 interface in an IST script</text><text x="32.0" y="384.0" font-size="10" font-weight="700" fill="#2d6a4f" text-anchor="start">WHAT TO PROVE</text><text x="32.0" y="400.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">• The CDU example passes the data level when 45.2 °C at the BMS equals 45.2 °C on the CDU display; the function level when a wetted leak tray reaches the operations centre in under 10 s.</text><text x="32.0" y="415.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">• Rack PDUs are sampled at 10 % at the data level and checked by script for the rest; the sample size is set by the project specification.</text><text x="24.0" y="450.0" font-size="10" font-weight="700" fill="#5b6b78" text-anchor="start">LEGEND</text><line x1="24" y1="472.0" x2="50" y2="472.0" stroke="#475569" stroke-width="3"/><text x="56.0" y="476.0" font-size="10" font-weight="400" fill="#172b3a" text-anchor="start">signal / control</text><rect x="24" y="490.0" width="1352" height="44" rx="0" fill="#f6f8fa" fill-opacity="1" stroke="#5b6b78" stroke-width="1"/><text x="32.0" y="504.0" font-size="11" font-weight="700" fill="#172b3a" text-anchor="start">F25-4  ·  Integration test levels mapped to commissioning levels L3, L4 and L5</text><text x="1368.0" y="504.0" font-size="10" font-weight="400" fill="#5b6b78" text-anchor="end">Chapter 25 · §25.6</text><text x="32.0" y="517.0" font-size="9" font-weight="400" fill="#5b6b78" text-anchor="start">Data Centre Commissioning Field Manual R01 EN · October 2026 · educational reference, not to scale · project and OEM documents govern</text><text x="32.0" y="529.0" font-size="9" font-weight="400" fill="#5b6b78" text-anchor="start">Symbols: QElectroTech EN 60617 and P&amp;ID collections, CC-BY 3.0, native geometry · instrument bubbles per ISA 5.1 · states per IEC 60617 / IEEE C37.2 practice</text></svg>