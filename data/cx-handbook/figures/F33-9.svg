" stroke-width="0.8"/><rect x="273.6507936507936" y="734.0" width="365.07936507936506" height="22.0" rx="0" fill="#ffffff" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><rect x="638.7301587301587" y="734.0" width="233.65079365079364" height="22.0" rx="0" fill="#ffffff" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><rect x="872.3809523809523" y="734.0" width="87.61904761904762" height="22.0" rx="0" fill="#ffffff" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><rect x="40" y="756.0" width="233.65079365079364" height="22.0" rx="0" fill="#ffffff" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><rect x="273.6507936507936" y="756.0" width="365.07936507936506" height="22.0" rx="0" fill="#ffffff" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><rect x="638.7301587301587" y="756.0" width="233.65079365079364" height="22.0" rx="0" fill="#ffffff" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><rect x="872.3809523809523" y="756.0" width="87.61904761904762" height="22.0" rx="0" fill="#ffffff" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><rect x="40" y="778.0" width="233.65079365079364" height="22.0" rx="0" fill="#ffffff" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><rect x="273.6507936507936" y="778.0" width="365.07936507936506" height="22.0" rx="0" fill="#ffffff" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><rect x="638.7301587301587" y="778.0" width="233.65079365079364" height="22.0" rx="0" fill="#ffffff" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><rect x="872.3809523809523" y="778.0" width="87.61904761904762" height="22.0" rx="0" fill="#ffffff" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><rect x="40" y="800.0" width="233.65079365079364" height="22.0" rx="0" fill="#ffffff" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><rect x="273.6507936507936" y="800.0" width="365.07936507936506" height="22.0" rx="0" fill="#ffffff" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><rect x="638.7301587301587" y="800.0" width="233.65079365079364" height="22.0" rx="0" fill="#ffffff" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><rect x="872.3809523809523" y="800.0" width="87.61904761904762" height="22.0" rx="0" fill="#ffffff" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><rect x="40" y="822.0" width="233.65079365079364" height="22.0" rx="0" fill="#ffffff" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><rect x="273.6507936507936" y="822.0" width="365.07936507936506" height="22.0" rx="0" fill="#ffffff" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><rect x="638.7301587301587" y="822.0" width="233.65079365079364" height="22.0" rx="0" fill="#ffffff" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><rect x="872.3809523809523" y="822.0" width="87.61904761904762" height="22.0" rx="0" fill="#ffffff" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><text x="250.0" y="133.0" font-size="11" font-weight="700" fill="#475569" text-anchor="middle">Meaning of the contract documents is unclear</text><text x="780.0" y="126.9" font-size="11" font-weight="700" fill="#334155" text-anchor="middle">RFI</text><text x="780.0" y="139.0" font-size="9" font-weight="400" fill="#172b3a" text-anchor="middle">P1 2, P2 5, P3 10 working days</text><text x="530.0" y="124.0" font-size="10.5" font-weight="700" fill="#5b6b78" text-anchor="middle">yes</text><text x="262.0" y="180.0" font-size="10.5" font-weight="700" fill="#5b6b78" text-anchor="start">no</text><text x="250.0" y="213.0" font-size="11" font-weight="700" fill="#475569" text-anchor="middle">The answer changes scope, price or time</text><text x="780.0" y="206.9" font-size="11" font-weight="700" fill="#334155" text-anchor="middle">PCO, then CO, VO or CE</text><text x="780.0" y="219.0" font-size="9" font-weight="400" fill="#172b3a" text-anchor="middle">FIDIC claim notice ≤ 28 days</text><text x="530.0" y="204.0" font-size="10.5" font-weight="700" fill="#5b6b78" text-anchor="middle">yes</text><text x="262.0" y="260.0" font-size="10.5" font-weight="700" fill="#5b6b78" text-anchor="start">no</text><text x="250.0" y="292.9" font-size="11" font-weight="700" fill="#475569" text-anchor="middle">An instruction was given orally on site</text><text x="780.0" y="286.9" font-size="11" font-weight="700" fill="#334155" text-anchor="middle">CVI</text><text x="780.0" y="299.0" font-size="9" font-weight="400" fill="#172b3a" text-anchor="middle">written confirmation to the CM</text><text x="530.0" y="284.0" font-size="10.5" font-weight="700" fill="#5b6b78" text-anchor="middle">yes</text><text x="262.0" y="340.0" font-size="10.5" font-weight="700" fill="#5b6b78" text-anchor="start">no</text><text x="250.0" y="372.9" font-size="11" font-weight="700" fill="#475569" text-anchor="middle">Work is ready for a hold or witness point</text><text x="780.0" y="366.9" font-size="11" font-weight="700" fill="#334155" text-anchor="middle">Inspection request (IR)</text><text x="780.0" y="379.0" font-size="9" font-weight="400" fill="#172b3a" text-anchor="middle">24 h notice in working hours</text><text x="530.0" y="364.0" font-size="10.5" font-weight="700" fill="#5b6b78" text-anchor="middle">yes</text><text x="262.0" y="420.0" font-size="10.5" font-weight="700" fill="#5b6b78" text-anchor="start">no</text><text x="250.0" y="452.9" font-size="11" font-weight="700" fill="#475569" text-anchor="middle">Work fails a requirement; a decision is needed</text><text x="780.0" y="446.9" font-size="11" font-weight="700" fill="#334155" text-anchor="middle">NCR</text><text x="780.0" y="459.0" font-size="9" font-weight="400" fill="#172b3a" text-anchor="middle">containment 1, correction 10 / 5 working days</text><text x="530.0" y="444.0" font-size="10.5" font-weight="700" fill="#5b6b78" text-anchor="middle">yes</text><text x="262.0" y="500.0" font-size="10.5" font-weight="700" fill="#5b6b78" text-anchor="start">no</text><text x="250.0" y="532.9" font-size="11" font-weight="700" fill="#475569" text-anchor="middle">The nonconformity repeats or a hold was bypassed</text><text x="780.0" y="526.9" font-size="11" font-weight="700" fill="#334155" text-anchor="middle">CAR</text><text x="780.0" y="539.0" font-size="9" font-weight="400" fill="#172b3a" text-anchor="middle">root-cause analysis required</text><text x="530.0" y="524.0" font-size="10.5" font-weight="700" fill="#5b6b78" text-anchor="middle">yes</text><text x="262.0" y="580.0" font-size="10.5" font-weight="700" fill="#5b6b78" text-anchor="start">no</text><text x="250.0" y="612.9" font-size="11" font-weight="700" fill="#475569" text-anchor="middle">A simple defect found on a walk-down</text><text x="780.0" y="606.9" font-size="11" font-weight="700" fill="#334155" text-anchor="middle">Punch item</text><text x="780.0" y="619.0" font-size="9" font-weight="400" fill="#172b3a" text-anchor="middle">A 1, B 7, C 30 working days</text><text x="530.0" y="604.0" font-size="10.5" font-weight="700" fill="#5b6b78" text-anchor="middle">yes</text><text x="45.0" y="705.0" font-size="11" font-weight="700" fill="#172b3a" text-anchor="start">Document</text><text x="278.7" y="705.0" font-size="11" font-weight="700" fill="#172b3a" text-anchor="start">Time limit (working days unless stated)</text><text x="643.7" y="705.0" font-size="11" font-weight="700" fill="#172b3a" text-anchor="start">Source</text><text x="877.4" y="705.0" font-size="11" font-weight="700" fill="#172b3a" text-anchor="start">Sect.</text><text x="45.0" y="727.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">RFI P1 / P2 / P3</text><text x="278.7" y="727.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">2 / 5 / 10</text><text x="643.7" y="727.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">MSC-1 procedure</text><text x="877.4" y="727.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">05.5.3</text><text x="45.0" y="749.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">Inspection request</text><text x="278.7" y="749.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">24 h; FAT abroad 15</text><text x="643.7" y="749.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">MSC-1 procedure</text><text x="877.4" y="749.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">07.5.3</text><text x="45.0" y="771.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">NCR</text><text x="278.7" y="771.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">containment 1; correction 10 / 5</text><text x="643.7" y="771.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">MSC-1 procedure</text><text x="877.4" y="771.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">09.5</text><text x="45.0" y="793.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">Punch item</text><text x="278.7" y="793.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">A 1, B 7, C 30</text><text x="643.7" y="793.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">case ledger</text><text x="877.4" y="793.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">09.8.2</text><text x="45.0" y="815.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">FIDIC Notice of Claim</text><text x="278.7" y="815.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">≤ 28 calendar days after awareness</text><text x="643.7" y="815.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">FIDIC 2017 20.2.1</text><text x="877.4" y="815.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">08.8.1</text><text x="45.0" y="837.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">NEC4 CE notification</text><text x="278.7" y="837.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">≤ 8 weeks (unless amended)</text><text x="643.7" y="837.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">NEC4 ECC 61.3</text><text x="877.4" y="837.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">05.9.3</text><text x="24.0" y="30.0" font-size="17" font-weight="700" fill="#172b3a" text-anchor="start">F33-9  Decision tree: which document to raise for a site question or a defect</text><text x="24.0" y="48.0" font-size="11" font-weight="400" fill="#5b6b78" text-anchor="start">RFI P1 / P2 / P3: 2, 5 and 10 working days · inspection request 24 h · NCR containment 1 working day, correction 10 / 5 working days · punch A / B / C: 1, 7, 30 working days</text><text x="32.0" y="880.0" font-size="10" font-weight="700" fill="#2d6a4f" text-anchor="start">WHAT TO PROVE</text><text x="32.0" y="896.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">• A question on the meaning of the contract documents is an RFI; its answer does not authorise a change, which needs a PCO and then a CO, VO or CE.</text><text x="32.0" y="911.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">• Work that fails a requirement and needs a technical decision is an NCR with containment in 1 working day; a simple defect is a punch item.</text><text x="24.0" y="946.0" font-size="10" font-weight="700" fill="#5b6b78" text-anchor="start">LEGEND</text><line x1="24" y1="968.0" x2="50" y2="968.0" stroke="#475569" stroke-width="3"/><text x="56.0" y="972.0" font-size="10" font-weight="400" fill="#172b3a" text-anchor="start">signal / control</text><line x1="151.9671875" y1="968.0" x2="177.9671875" y2="968.0" stroke="#334155" stroke-width="3"/><text x="184.0" y="972.0" font-size="10" font-weight="400" fill="#172b3a" text-anchor="start">data / network</text><rect x="24" y="986.0" width="952" height="44" rx="0" fill="#f6f8fa" fill-opacity="1" stroke="#5b6b78" stroke-width="1"/><text x="32.0" y="1000.0" font-size="11" font-weight="700" fill="#172b3a" text-anchor="start">F33-9  ·  Decision tree: which document to raise for a site question or a defect</text><text x="968.0" y="1000.0" font-size="10" font-weight="400" fill="#5b6b78" text-anchor="end">Chapter 33 · §33.5.2</text><text x="32.0" y="1013.0" font-size="9" font-weight="400" fill="#5b6b78" text-anchor="start">Data Centre Commissioning Field Manual R01 EN · October 2026 · educational reference, not to scale · project and OEM documents govern</text><text x="32.0" y="1025.0" font-size="9" font-weight="400" fill="#5b6b78" text-anchor="start">Symbols: QElectroTech EN 60617 and P&amp;ID collections, CC-BY 3.0, native geometry · instrument bubbles per ISA 5.1 · states per IEC 60617 / IEEE C37.2 practice</text></svg>