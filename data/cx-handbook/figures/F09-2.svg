<svg xmlns="http://www.w3.org/2000/svg" width="267mm" height="162.3mm" viewBox="0 0 1400 851" font-family="DejaVu Sans" role="img" aria-labelledby="t"><title id="t">F09-2 Disposition decision tree: rework, use as is, repair or reject</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="context-stroke"/></marker><marker id="arrow-simple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#172b3a"/></marker><marker id="arrow-334155" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#334155"/></marker><marker id="arrow-475569" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#475569"/></marker><marker id="arrow-b91c1c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#b91c1c"/></marker></defs><rect width="1400" height="851" fill="#ffffff"/><rect x="4" y="4" width="1392" height="843" fill="none" stroke="#172b3a" stroke-width="1.6"/><rect x="24" y="671.0" width="1352" height="56" rx="4" fill="#f1f8f4" fill-opacity="1" stroke="#2d6a4f" stroke-width="1"/><polyline points="870.0,143.0 1030.0,143.0" fill="none" stroke="#b91c1c" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#arrow-b91c1c)"/><polyline points="870.0,259.0 1030.0,259.0" fill="none" stroke="#334155" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#arrow-334155)"/><polyline points="870.0,375.0 1030.0,375.0" fill="none" stroke="#475569" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#arrow-475569)"/><polyline points="870.0,491.0 1030.0,491.0" fill="none" stroke="#475569" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#arrow-475569)"/><polyline points="470.0,491.0 370.0,491.0" fill="none" stroke="#b91c1c" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#arrow-b91c1c)"/><polyline points="670.0,176.0 670.0,226.0" fill="none" stroke="#475569" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#arrow-475569)"/><polyline points="670.0,292.0 670.0,342.0" fill="none" stroke="#475569" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#arrow-475569)"/><polyline points="670.0,408.0 670.0,458.0" fill="none" stroke="#475569" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#arrow-475569)"/><rect x="470" y="110" width="400" height="66" rx="0" fill="#ffffff" fill-opacity="1" stroke="#475569" stroke-width="1.4"/><rect x="470" y="226" width="400" height="66" rx="0" fill="#ffffff" fill-opacity="1" stroke="#475569" stroke-width="1.4"/><rect x="470" y="342" width="400" height="66" rx="0" fill="#ffffff" fill-opacity="1" stroke="#475569" stroke-width="1.4"/><rect x="470" y="458" width="400" height="66" rx="0" fill="#ffffff" fill-opacity="1" stroke="#475569" stroke-width="1.4"/><rect x="1030" y="110" width="300" height="66" rx="8" fill="#ffffff" fill-opacity="1" stroke="#b91c1c" stroke-width="1.4"/><rect x="1030" y="226" width="300" height="66" rx="8" fill="#ffffff" fill-opacity="1" stroke="#334155" stroke-width="1.4"/><rect x="1030" y="342" width="300" height="66" rx="8" fill="#ffffff" fill-opacity="1" stroke="#475569" stroke-width="1.4"/><rect x="1030" y="458" width="300" height="66" rx="8" fill="#ffffff" fill-opacity="1" stroke="#475569" stroke-width="1.4"/><rect x="70" y="458" width="300" height="66" rx="8" fill="#ffffff" fill-opacity="1" stroke="#b91c1c" stroke-width="1.4"/><rect x="70" y="580.0" width="237.39130434782606" height="23.0" rx="0" fill="#e9f0f4" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><rect x="307.39130434782606" y="580.0" width="438.2608695652174" height="23.0" rx="0" fill="#e9f0f4" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><rect x="745.6521739130435" y="580.0" width="584.3478260869565" height="23.0" rx="0" fill="#e9f0f4" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><rect x="70" y="603.0" width="237.39130434782606" height="23.0" rx="0" fill="#ffffff" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><rect x="307.39130434782606" y="603.0" width="438.2608695652174" height="23.0" rx="0" fill="#ffffff" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><rect x="745.6521739130435" y="603.0" width="584.3478260869565" height="23.0" rx="0" fill="#ffffff" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><rect x="70" y="626.0" width="237.39130434782606" height="23.0" rx="0" fill="#ffffff" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><rect x="307.39130434782606" y="626.0" width="438.2608695652174" height="23.0" rx="0" fill="#ffffff" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><rect x="745.6521739130435" y="626.0" width="584.3478260869565" height="23.0" rx="0" fill="#ffffff" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><text x="670.0" y="134.7" font-size="12" font-weight="700" fill="#475569" text-anchor="middle">Affects safety and cannot be</text><text x="670.0" y="148.2" font-size="10" font-weight="400" fill="#172b3a" text-anchor="middle">fully corrected in place</text><text x="670.0" y="250.7" font-size="12" font-weight="700" fill="#475569" text-anchor="middle">Can be made to conform in place</text><text x="670.0" y="264.1" font-size="10" font-weight="400" fill="#172b3a" text-anchor="middle">by an approved method</text><text x="670.0" y="366.7" font-size="12" font-weight="700" fill="#475569" text-anchor="middle">Designer confirms function,</text><text x="670.0" y="380.2" font-size="10" font-weight="400" fill="#172b3a" text-anchor="middle">reliability and warranty as it is</text><text x="670.0" y="482.7" font-size="12" font-weight="700" fill="#475569" text-anchor="middle">Approved repair method makes</text><text x="670.0" y="496.2" font-size="10" font-weight="400" fill="#172b3a" text-anchor="middle">it fit for use</text><text x="1180.0" y="134.7" font-size="12" font-weight="700" fill="#b91c1c" text-anchor="middle">REJECT</text><text x="1180.0" y="148.2" font-size="10" font-weight="400" fill="#172b3a" text-anchor="middle">remove and replace</text><text x="1180.0" y="250.7" font-size="12" font-weight="700" fill="#334155" text-anchor="middle">REWORK</text><text x="1180.0" y="264.1" font-size="10" font-weight="400" fill="#172b3a" text-anchor="middle">conforms; no concession</text><text x="1180.0" y="366.7" font-size="12" font-weight="700" fill="#475569" text-anchor="middle">USE AS IS</text><text x="1180.0" y="380.2" font-size="10" font-weight="400" fill="#172b3a" text-anchor="middle">concession, as-built note</text><text x="1180.0" y="482.7" font-size="12" font-weight="700" fill="#475569" text-anchor="middle">REPAIR</text><text x="1180.0" y="496.2" font-size="10" font-weight="400" fill="#172b3a" text-anchor="middle">concession, as-built note</text><text x="220.0" y="482.7" font-size="12" font-weight="700" fill="#b91c1c" text-anchor="middle">REJECT</text><text x="220.0" y="496.2" font-size="10" font-weight="400" fill="#172b3a" text-anchor="middle">remove and replace</text><text x="682.0" y="208.0" font-size="11" font-weight="700" fill="#172b3a" text-anchor="start">no</text><text x="682.0" y="324.0" font-size="11" font-weight="700" fill="#172b3a" text-anchor="start">no</text><text x="682.0" y="440.0" font-size="11" font-weight="700" fill="#172b3a" text-anchor="start">no</text><text x="900.0" y="133.0" font-size="11" font-weight="700" fill="#172b3a" text-anchor="start">yes</text><text x="900.0" y="249.0" font-size="11" font-weight="700" fill="#172b3a" text-anchor="start">yes</text><text x="900.0" y="365.0" font-size="11" font-weight="700" fill="#172b3a" text-anchor="start">yes</text><text x="900.0" y="481.0" font-size="11" font-weight="700" fill="#172b3a" text-anchor="start">yes</text><text x="440.0" y="481.0" font-size="11" font-weight="700" fill="#172b3a" text-anchor="end">no</text><text x="75.0" y="595.6" font-size="11.5" font-weight="700" fill="#172b3a" text-anchor="start">Disposition</text><text x="312.4" y="595.6" font-size="11.5" font-weight="700" fill="#172b3a" text-anchor="start">Approved by on MSC-1</text><text x="750.7" y="595.6" font-size="11.5" font-weight="700" fill="#172b3a" text-anchor="start">Contract basis</text><text x="75.0" y="618.6" font-size="11.5" font-weight="400" fill="#172b3a" text-anchor="start">Rework or reject</text><text x="312.4" y="618.6" font-size="11.5" font-weight="400" fill="#172b3a" text-anchor="start">QA/QC manager (minor) or Engineer (major)</text><text x="750.7" y="618.6" font-size="11.5" font-weight="400" fill="#172b3a" text-anchor="start">FIDIC 7.5, 7.6; NEC4 44; AIA 12.2.1</text><text x="75.0" y="641.6" font-size="11.5" font-weight="400" fill="#172b3a" text-anchor="start">Use as is or repair</text><text x="312.4" y="641.6" font-size="11.5" font-weight="400" fill="#172b3a" text-anchor="start">Engineer with designer agreement; owner informed</text><text x="750.7" y="641.6" font-size="11.5" font-weight="400" fill="#172b3a" text-anchor="start">NEC4 45 change to the Scope; AIA 12.3 price reduction; ISO 9001 8.7.1 d)</text><text x="24.0" y="30.0" font-size="17" font-weight="700" fill="#172b3a" text-anchor="start">F09-2  Disposition decision tree: rework, use as is, repair or reject</text><text x="24.0" y="48.0" font-size="11" font-weight="400" fill="#5b6b78" text-anchor="start">safety first · rework when the item can be made to conform in place · use as is or repair only with the designer&#x27;s written agreement and a concession · otherwise reject</text><text x="32.0" y="685.0" font-size="10" font-weight="700" fill="#2d6a4f" text-anchor="start">WHAT TO PROVE</text><text x="32.0" y="701.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">• In the CDU filter example the use-as-is proposal fails at step 3 because flushing debris would reach the rack manifolds; the disposition is reject.</text><text x="32.0" y="716.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">• In the busway torque example the joints can be made to conform in place, so the disposition is rework.</text><text x="24.0" y="751.0" font-size="10" font-weight="700" fill="#5b6b78" text-anchor="start">LEGEND</text><line x1="24" y1="773.0" x2="50" y2="773.0" stroke="#475569" stroke-width="3"/><text x="56.0" y="777.0" font-size="10" font-weight="400" fill="#172b3a" text-anchor="start">signal / control</text><line x1="151.9671875" y1="773.0" x2="177.9671875" y2="773.0" stroke="#b91c1c" stroke-width="3"/><text x="184.0" y="777.0" font-size="10" font-weight="400" fill="#172b3a" text-anchor="start">trip / protection</text><line x1="283.934375" y1="773.0" x2="309.934375" y2="773.0" stroke="#334155" stroke-width="3"/><text x="315.9" y="777.0" font-size="10" font-weight="400" fill="#172b3a" text-anchor="start">data / network</text><rect x="24" y="791.0" width="1352" height="44" rx="0" fill="#f6f8fa" fill-opacity="1" stroke="#5b6b78" stroke-width="1"/><text x="32.0" y="805.0" font-size="11" font-weight="700" fill="#172b3a" text-anchor="start">F09-2  ·  Disposition decision tree: rework, use as is, repair or reject</text><text x="1368.0" y="805.0" font-size="10" font-weight="400" fill="#5b6b78" text-anchor="end">Chapter 09 · §09.6</text><text x="32.0" y="818.0" font-size="9" font-weight="400" fill="#5b6b78" text-anchor="start">Data Centre Commissioning Field Manual R01 EN · October 2026 · educational reference, not to scale · project and OEM documents govern</text><text x="32.0" y="830.0" font-size="9" font-weight="400" fill="#5b6b78" text-anchor="start">Symbols: QElectroTech EN 60617 and P&amp;ID collections, CC-BY 3.0, native geometry · instrument bubbles per ISA 5.1 · states per IEC 60617 / IEEE C37.2 practice</text></svg>