160.5" font-size="12" font-weight="400" fill="#172b3a" text-anchor="start">Pre-design (L0)</text><text x="435.0" y="152.6" font-size="12" font-weight="700" fill="#172b3a" text-anchor="middle">Guideline 0-2019, Std 202-2024, BG</text><text x="435.0" y="168.4" font-size="12" font-weight="700" fill="#172b3a" text-anchor="middle">8/2009</text><text x="710.0" y="152.6" font-size="12" font-weight="700" fill="#172b3a" text-anchor="middle">Uptime Topology, TIA-942-C, BICSI</text><text x="710.0" y="168.4" font-size="12" font-weight="700" fill="#172b3a" text-anchor="middle">002-2024</text><text x="1005.0" y="160.5" font-size="12" font-weight="700" fill="#172b3a" text-anchor="middle">not yet used</text><text x="1265.0" y="152.6" font-size="12" font-weight="700" fill="#172b3a" text-anchor="middle">reading of Permen ESDM</text><text x="1265.0" y="168.4" font-size="12" font-weight="700" fill="#172b3a" text-anchor="middle">12/2021</text><text x="46.0" y="201.8" font-size="12" font-weight="400" fill="#172b3a" text-anchor="start">Design (L0)</text><text x="435.0" y="193.9" font-size="12" font-weight="700" fill="#172b3a" text-anchor="middle">Guideline 0, CSI 01 91 13, Guideline 1.1,</text><text x="435.0" y="209.7" font-size="12" font-weight="700" fill="#172b3a" text-anchor="middle">Guideline 13</text><text x="710.0" y="201.8" font-size="12" font-weight="700" fill="#172b3a" text-anchor="middle">TC 9.9 Thermal Guidelines 5th ed.</text><text x="1005.0" y="193.9" font-size="12" font-weight="700" fill="#172b3a" text-anchor="middle">NETA ATS-2025, IEC 62040-3, ISO 8528-5, NFPA</text><text x="1005.0" y="209.7" font-size="12" font-weight="700" fill="#172b3a" text-anchor="middle">72</text><text x="1265.0" y="201.8" font-size="12" font-weight="700" fill="#172b3a" text-anchor="middle">PUIL 2020 design rules</text><text x="46.0" y="243.1" font-size="12" font-weight="400" fill="#172b3a" text-anchor="start">Construction: factory (L1)</text><text x="435.0" y="243.1" font-size="12" font-weight="700"