l="#172b3a" text-anchor="middle">fire authority acceptance</text><text x="46.0" y="359.0" font-size="12" font-weight="400" fill="#172b3a" text-anchor="start">Occupancy and operations (L6)</text><text x="435.0" y="359.0" font-size="12" font-weight="700" fill="#172b3a" text-anchor="middle">Guideline 1.3, Guideline 1.4, BG 54/2018</text><text x="710.0" y="359.0" font-size="12" font-weight="700" fill="#172b3a" text-anchor="middle">Uptime Operational Sustainability</text><text x="1005.0" y="359.0" font-size="12" font-weight="700" fill="#172b3a" text-anchor="middle">NFPA 70B, NETA MTS</text><text x="1265.0" y="359.0" font-size="12" font-weight="700" fill="#172b3a" text-anchor="middle">SLO renewal dates</text><text x="24.0" y="30.0" font-size="17" font-weight="700" fill="#172b3a" text-anchor="start">F01-1  Reference documents by project phase: which document the commissioning manager opens first</text><text x="24.0" y="48.0" font-size="11" font-weight="400" fill="#5b6b78" text-anchor="start">five phases · pre-design and design use process documents · construction uses product and test standards · acceptance uses Guideline 0, Uptime Topology and NFPA · occupancy uses Guideline 1.3, 1.4, BG 54 and NETA MTS</text><text x="32.0" y="403.3" font-size="10" font-weight="700" fill="#2d6a4f" text-anchor="start">WHAT TO PROVE</text><text x="32.0" y="419.3" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">• Guideline 0-2019 and Standard 202-2024 are used in every phase; NETA ATS-2025 enters at design review and governs L2 and L3 electrical tests.</text><text x="32.0" y="434.3" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">• The Indonesian SLO (Permen ESDM 12/2021) and the fire authority acceptance are hold points in construction and acceptance.</text><rect x="24" y="467.28000000000003" width="1352" height="44" rx="0" fill="#f6f8fa" fill-opacity="1" stroke="#5b6b78" stroke-width="1"/><text x="32.0" y="481.3" font-size="11" font-weight="700" fill="#172b3a" text-anchor="start">F01-1  ·  Reference documents by project phase: which document the commissioning manager opens first</text><text x="1368.0" y="481.3" font-size="10" font-weight="400" fill="#5b6b78" text-anchor="end">Chapter 01 · §01.12</text><text x="32.0" y="494.3" font-size="9" font-weight="400" fill="#5b6b78" text-anchor="start">Data Centre Commissioning Field Manual R01 EN · October 2026 · educational reference, not to scale · project and OEM documents govern</text><text x="32.0" y="506.3" font-size="9" font-weight="400" fill="#5b6b78" text-anchor="start">Symbols: QElectroTech EN 60617 and P&amp;ID collections, CC-BY 3.0, native geometry · instrument bubbles per ISA 5.1 · states per IEC 60617 / IEEE C37.2 practice</text></svg>