5: residual 9.8 %, meter</text><text x="24.0" y="61.0" font-size="10" font-weight="400" fill="#5b6b78" text-anchor="start">B2-DH3-MCC-A1 not reporting · limit 2.0 %</text><text x="32.0" y="756.0" font-size="10" font-weight="700" fill="#2d6a4f" text-anchor="start">WHAT TO PROVE</text><text x="32.0" y="772.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">• Outside hours 13 to 15 the residual stays between 0.76 % and 0.94 %, inside the 2.0 % limit set for this block.</text><text x="32.0" y="787.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">• In hours 13 to 15 the residual steps to 9.8 %, equal to the 155 kWh per hour of MCC-A1.</text><text x="32.0" y="802.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">• The PME data log shows meter MCC-A1 offline for these three hours.</text><rect x="24" y="835.0" width="952" height="44" rx="0" fill="#f6f8fa" fill-opacity="1" stroke="#5b6b78" stroke-width="1"/><text x="32.0" y="849.0" font-size="11" font-weight="700" fill="#172b3a" text-anchor="start">F30-6  ·  Dataset 7: energy reconciliation, LV main against feeders (example data)</text><text x="968.0" y="849.0" font-size="10" font-weight="400" fill="#5b6b78" text-anchor="end">Chapter 30 · §30.10</text><text x="32.0" y="862.0" font-size="9" font-weight="400" fill="#5b6b78" text-anchor="start">Data Centre Commissioning Field Manual R01 EN · October 2026 · educational reference, not to scale · project and OEM documents govern</text><text x="32.0" y="874.0" font-size="9" font-weight="400" fill="#5b6b78" text-anchor="start">Symbols: QElectroTech EN 60617 and P&amp;ID collections, CC-BY 3.0, native geometry · instrument bubbles per ISA 5.1 · states per IEC 60617 / IEEE C37.2 practice</text></svg>