ight="700" fill="#172b3a" text-anchor="start">Acceptance</text><text x="45.0" y="827.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">ELA (m²)</text><text x="290.3" y="827.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">0.071</text><text x="505.0" y="827.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">0.038</text><text x="719.7" y="827.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">from the software</text><text x="45.0" y="849.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">Predicted hold time (min)</text><text x="290.3" y="849.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">7.2</text><text x="505.0" y="849.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">13.6</text><text x="719.7" y="849.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">≥ 10 (NFPA 2001)</text><text x="45.0" y="871.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">Concentration held</text><text x="290.3" y="871.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">85 % of minimum design</text><text x="505.0" y="871.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">85 % of minimum design</text><text x="719.7" y="871.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">at 2.4 m height</text><text x="45.0" y="893.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">Result</text><text x="290.3" y="893.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">fail</text><text x="505.0" y="893.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">pass</text><text x="719.7" y="893.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">signed by CxA and insurer</text><circle cx="783.0" cy="534.0" r="4" fill="#b7791f"/><circle cx="354.0" cy="422.0" r="4" fill="#b7791f"/><text x="24.0" y="30.0" font-size="17" font-weight="700" fill="#172b3a" text-anchor="start">F20-6  Door fan test of MV room B2-ER-03: leakage area and hold time</text><text x="24.0" y="48.0" font-size="10" font-weight="400" fill="#5b6b78" text-anchor="start">640 m³ · room height 4.0 m · protected height 2.4 m · FK-5-1-12 at 4.5 % · first test ELA 0.071 m², 7.2 min: fail · 3 leaks sealed · retest ELA 0.038 m², 13.6 min: pass · limit</text><text x="24.0" y="61.0" font-size="10" font-weight="400" fill="#5b6b78" text-anchor="start">10 min</text><text x="32.0" y="936.0" font-size="10" font-weight="700" fill="#2d6a4f" text-anchor="start">WHAT TO PROVE</text><text x="32.0" y="952.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">• The first test predicts 7.2 min, below the 10 min hold time, so the room fails and the leak search starts.</text><text x="32.0" y="967.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">• After the cable tray penetration and two damper frames are sealed, the ELA falls from 0.071 to 0.038 m² and the predicted hold time is 13.6 min: pass.</text><text x="24.0" y="1002.0" font-size="10" font-weight="700" fill="#5b6b78" text-anchor="start">LEGEND</text><line x1="24" y1="1024.0" x2="50" y2="1024.0" stroke="#0ea5e9" stroke-width="3"/><text x="56.0" y="1028.0" font-size="10" font-weight="400" fill="#172b3a" text-anchor="start">air</text><line x1="91.0171875" y1="1024.0" x2="117.0171875" y2="1024.0" stroke="#b91c1c" stroke-width="3"/><text x="123.0" y="1028.0" font-size="10" font-weight="400" fill="#172b3a" text-anchor="start">fire water</text><line x1="193.028125" y1="1024.0" x2="219.028125" y2="1024.0" stroke="#475569" stroke-width="3"/><text x="225.0" y="1028.0" font-size="10" font-weight="400" fill="#172b3a" text-anchor="start">signal / control</text><line x1="320.99531249999995" y1="1024.0" x2="346.99531249999995" y2="1024.0" stroke="#b91c1c" stroke-width="3"/><text x="353.0" y="1028.0" font-size="10" font-weight="400" fill="#172b3a" text-anchor="start">trip / protection</text><rect x="24" y="1042.0" width="952" height="44" rx="0" fill="#f6f8fa" fill-opacity="1" stroke="#5b6b78" stroke-width="1"/><text x="32.0" y="1056.0" font-size="11" font-weight="700" fill="#172b3a" text-anchor="start">F20-6  ·  Door fan test of MV room B2-ER-03: leakage area and hold time</text><text x="968.0" y="1056.0" font-size="10" font-weight="400" fill="#5b6b78" text-anchor="end">Chapter 20 · §20.6.4</text><text x="32.0" y="1069.0" font-size="9" font-weight="400" fill="#5b6b78" text-anchor="start">Data Centre Commissioning Field Manual R01 EN · October 2026 · educational reference, not to scale · project and OEM documents govern</text><text x="32.0" y="1081.0" font-size="9" font-weight="400" fill="#5b6b78" text-anchor="start">Symbols: QElectroTech EN 60617 and P&amp;ID collections, CC-BY 3.0, native geometry · instrument bubbles per ISA 5.1 · states per IEC 60617 / IEEE C37.2 practice</text></svg>