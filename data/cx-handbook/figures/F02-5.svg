tart">L0 and design</text><text x="312.0" y="174.0" font-size="10" font-weight="400" fill="#172b3a" text-anchor="start">FATs, MV energised, L2, L3</text><text x="585.0" y="214.0" font-size="10" font-weight="400" fill="#172b3a" text-anchor="start">L4 halls 1 to 3, IST</text><text x="743.0" y="214.0" font-size="10" font-weight="400" fill="#b91c1c" text-anchor="start">B1 RFS</text><text x="195.0" y="254.0" font-size="10" font-weight="400" fill="#172b3a" text-anchor="start">design</text><text x="507.0" y="294.0" font-size="10" font-weight="400" fill="#172b3a" text-anchor="start">FATs, L2, L3</text><text x="858.0" y="334.0" font-size="10" font-weight="400" fill="#172b3a" text-anchor="start">L4, IST</text><text x="1055.0" y="334.0" font-size="10" font-weight="400" fill="#b91c1c" text-anchor="start">B2 RFS</text><text x="741.0" y="374.0" font-size="10" font-weight="400" fill="#172b3a" text-anchor="start">L1 to L3</text><text x="1131.0" y="414.0" font-size="10" font-weight="400" fill="#172b3a" text-anchor="start">L4, IST</text><text x="975.0" y="454.0" font-size="10" font-weight="400" fill="#172b3a" text-anchor="start">L1 to L4</text><text x="741.0" y="494.0" font-size="10" font-weight="400" fill="#172b3a" text-anchor="start">B1 live from 14; B2 live from 22</text><text x="24.0" y="30.0" font-size="17" font-weight="700" fill="#172b3a" text-anchor="start">F02-5  MSC-1 campus sequencing: four buildings, levels by month and IST windows</text><text x="24.0" y="48.0" font-size="11" font-weight="400" fill="#5b6b78" text-anchor="start">B1 RFS month 14 · B2 RFS month 22 · 15 IST days per building (3 halls × 5 days) · 60 IST days for the campus, 61 after the shared MV ring scenario</text><text x="32.0" y="566.0" font-size="10" font-weight="700" fill="#2d6a4f" text-anchor="start">WHAT TO PROVE</text><text x="32.0" y="582.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">• B2 L4 and L5 run under live-site rules because B1 is in operation from month 14.</text><text x="32.0" y="597.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">• The B2 scenario that opens the shared MV ring runs in a combined window with B1 operations and adds one IST day.</text><rect x="24" y="630" width="1352" height="44" rx="0" fill="#f6f8fa" fill-opacity="1" stroke="#5b6b78" stroke-width="1"/><text x="32.0" y="644.0" font-size="11" font-weight="700" fill="#172b3a" text-anchor="start">F02-5  ·  MSC-1 campus sequencing: four buildings, levels by month and IST windows</text><text x="1368.0" y="644.0" font-size="10" font-weight="400" fill="#5b6b78" text-anchor="end">Chapter 02 · §02.12</text><text x="32.0" y="657.0" font-size="9" font-weight="400" fill="#5b6b78" text-anchor="start">Data Centre Commissioning Field Manual R01 EN · October 2026 · educational reference, not to scale · project and OEM documents govern</text><text x="32.0" y="669.0" font-size="9" font-weight="400" fill="#5b6b78" text-anchor="start">Symbols: QElectroTech EN 60617 and P&amp;ID collections, CC-BY 3.0, native geometry · instrument bubbles per ISA 5.1 · states per IEC 60617 / IEEE C37.2 practice</text></svg>