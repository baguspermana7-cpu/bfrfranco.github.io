text x="385.6" y="713.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">pass</text><text x="811.5" y="713.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">repeat in stable conditions: end pressure below 15.0 bar</text><text x="24.0" y="30.0" font-size="17" font-weight="700" fill="#172b3a" text-anchor="start">F18-6  Hydrostatic test trends: a valid hold at night and a hold disturbed by pipe cooling</text><text x="24.0" y="48.0" font-size="11" font-weight="400" fill="#5b6b78" text-anchor="start">B2 FWS riser · design 10.0 bar(g) · test 15.0 bar(g) at the high point · 120 min hold · class 0.5 gauge 0 to 25 bar (±0.125 bar) · night test: 15.20 → 15.14 bar at 28.6 °C · evening test: 15.10 → 14.08 bar while the pipe cooled 0.3 K</text><text x="32.0" y="756.0" font-size="10" font-weight="700" fill="#2d6a4f" text-anchor="start">WHAT TO PROVE</text><text x="32.0" y="772.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">• The night test passes: no leakage, end pressure 15.14 bar is above 15.0 bar, drop 0.06 bar inside the ±0.125 bar gauge uncertainty.</text><text x="32.0" y="787.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">• The evening test is repeated: the 1.02 bar fall matches the temperature effect, but the end pressure 14.08 bar is below the 15.0 bar test pressure.</text><rect x="24" y="820.0" width="1352" height="44" rx="0" fill="#f6f8fa" fill-opacity="1" stroke="#5b6b78" stroke-width="1"/><text x="32.0" y="834.0" font-size="11" font-weight="700" fill="#172b3a" text-anchor="start">F18-6  ·  Hydrostatic test trends: a valid hold at night and a hold disturbed by pipe cooling</text><text x="1368.0" y="834.0" font-size="10" font-weight="400" fill="#5b6b78" text-anchor="end">Chapter 18 · §18.3</text><text x="32.0" y="847.0" font-size="9" font-weight="400" fill="#5b6b78" text-anchor="start">Data Centre Commissioning Field Manual R01 EN · October 2026 · educational reference, not to scale · project and OEM documents govern</text><text x="32.0" y="859.0" font-size="9" font-weight="400" fill="#5b6b78" text-anchor="start">Symbols: QElectroTech EN 60617 and P&amp;ID collections, CC-BY 3.0, native geometry · instrument bubbles per ISA 5.1 · states per IEC 60617 / IEEE C37.2 practice</text></svg>