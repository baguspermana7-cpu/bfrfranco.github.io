fill-opacity="1" stroke="#475569" stroke-width="1.4"/><rect x="580" y="300" width="240" height="80" rx="0" fill="#ffffff" fill-opacity="1" stroke="#475569" stroke-width="1.4"/><rect x="850" y="300" width="240" height="80" rx="0" fill="#ffffff" fill-opacity="1" stroke="#475569" stroke-width="1.4"/><rect x="1120" y="300" width="240" height="80" rx="0" fill="#ffffff" fill-opacity="1" stroke="#475569" stroke-width="1.4"/><rect x="40" y="440" width="240" height="80" rx="8" fill="#ffffff" fill-opacity="1" stroke="#172b3a" stroke-width="1.4"/><rect x="310" y="440" width="240" height="80" rx="8" fill="#ffffff" fill-opacity="1" stroke="#172b3a" stroke-width="1.4"/><rect x="580" y="440" width="240" height="80" rx="8" fill="#ffffff" fill-opacity="1" stroke="#172b3a" stroke-width="1.4"/><rect x="850" y="440" width="240" height="80" rx="8" fill="#ffffff" fill-opacity="1" stroke="#172b3a" stroke-width="1.4"/><rect x="1120" y="440" width="240" height="80" rx="8" fill="#ffffff" fill-opacity="1" stroke="#172b3a" stroke-width="1.4"/><rect x="40" y="580" width="640" height="70" rx="8" fill="#ffffff" fill-opacity="1" stroke="#334155" stroke-width="1.4"/><rect x="720" y="580" width="640" height="70" rx="8" fill="#ffffff" fill-opacity="1" stroke="#172b3a" stroke-width="1.4"/><text x="700.0" y="141.7" font-size="12" font-weight="700" fill="#475569" text-anchor="middle">Test director</text><text x="700.0" y="155.2" font-size="10" font-weight="400" fill="#172b3a" text-anchor="middle">commissioning manager or senior CxA</text><text x="1070.0" y="141.9" font-size="11" font-weight="700" fill="#334155" text-anchor="middle">Script reader, recorder</text><text x="1070.0" y="154.0" font-size="9" font-weight="400" fill="#172b3a" text-anchor="middle">CxA engineer, master script</text><text x="330.0" y="141.9" font-size="11" font-weight="700" fill="#b91c1c" text-anchor="middle">Safety officer</text><text x="330.0" y="154.0" font-size="9" font-weight="400" fill="#172b3a" text-anchor="middle">permits, access, fire watch</text><text x="160.0" y="331.9" font-size="11" font-weight="700" fill="#475569" text-anchor="middle">Electrical lead</text><text x="160.0" y="344.0" font-size="9" font-weight="400" fill="#172b3a" text-anchor="middle">+ 3 switching team</text><text x="430.0" y="331.9" font-size="11" font-weight="700" fill="#475569" text-anchor="middle">Mechanical lead</text><text x="430.0" y="344.0" font-size="9" font-weight="400" fill="#172b3a" text-anchor="middle">+ 3 technicians</text><text x="700.0" y="331.9" font-size="11" font-weight="700" fill="#475569" text-anchor="middle">Controls lead</text><text x="700.0" y="344.0" font-size="9" font-weight="400" fill="#172b3a" text-anchor="middle">BMS and EPMS, 2</text><text x="970.0" y="331.9" font-size="11" font-weight="700" fill="#475569" text-anchor="middle">Load bank lead</text><text x="970.0" y="344.0" font-size="9" font-weight="400" fill="#172b3a" text-anchor="middle">+ 2 technicians</text><text x="1240.0" y="331.9" font-size="11" font-weight="700" fill="#475569" text-anchor="middle">Fire lead</text><text x="1240.0" y="344.0" font-size="9" font-weight="400" fill="#172b3a" text-anchor="middle">fire contractor</text><text x="160.0" y="471.9" font-size="11" font-weight="700" fill="#172b3a" text-anchor="middle">Generator, UPS vendors</text><text x="160.0" y="484.0" font-size="9" font-weight="400" fill="#172b3a" text-anchor="middle">watch and read logs</text><text x="430.0" y="471.9" font-size="11" font-weight="700" fill="#172b3a" text-anchor="middle">Chiller, CDU vendors</text><text x="430.0" y="484.0" font-size="9" font-weight="400" fill="#172b3a" text-anchor="middle">watch and read logs</text><text x="700.0" y="471.9" font-size="11" font-weight="700" fill="#172b3a" text-anchor="middle">BMS, EPMS screens</text><text x="700.0" y="484.0" font-size="9" font-weight="400" fill="#172b3a" text-anchor="middle">alarm and trend capture</text><text x="970.0" y="471.9" font-size="11" font-weight="700" fill="#172b3a" text-anchor="middle">Load bank units</text><text x="970.0" y="484.0" font-size="9" font-weight="400" fill="#172b3a" text-anchor="middle">set and hold load</text><text x="1240.0" y="471.9" font-size="11" font-weight="700" fill="#172b3a" text-anchor="middle">Fire panel</text><text x="1240.0" y="484.0" font-size="9" font-weight="400" fill="#172b3a" text-anchor="middle">detectors, valve</text><text x="360.0" y="606.9" font-size="11" font-weight="700" fill="#334155" text-anchor="middle">Owner operations (3)</text><text x="360.0" y="619.0" font-size="9" font-weight="400" fill="#172b3a" text-anchor="middle">run EOPs and MOPs at the consoles; take over after the test</text><text x="1040.0" y="606.9" font-size="11" font-weight="700" fill="#172b3a" text-anchor="middle">Observers</text><text x="1040.0" y="619.0" font-size="9" font-weight="400" fill="#172b3a" text-anchor="middle">owner, designer, insurer, certifier: watch and note only</text><text x="24.0" y="30.0" font-size="17" font-weight="700" fill="#172b3a" text-anchor="start">F28-4  Test-day organisation for an IST: one test director gives every instruction that changes the plant</text><text x="24.0" y="48.0" font-size="11" font-weight="400" fill="#5b6b78" text-anchor="start">25 people on the day shift · radio channel 1 for instructions with repeat-back · any person may call stop for safety · only the test director restarts</text><text x="32.0" y="686.0" font-size="10" font-weight="700" fill="#2d6a4f" text-anchor="start">WHAT TO PROVE</text><text x="32.0" y="702.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">• Every operating instruction comes from the test director on channel 1 and is repeated back with the device tag before the action.</text><text x="32.0" y="717.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">• The safety officer and every lead can stop the test; only the test director can restart it after the debrief.</text><text x="24.0" y="752.0" font-size="10" font-weight="700" fill="#5b6b78" text-anchor="start">LEGEND</text><line x1="24" y1="774" x2="50" y2="774" stroke="#475569" stroke-width="3"/><text x="56.0" y="778.0" font-size="10" font-weight="400" fill="#172b3a" text-anchor="start">signal / control</text><line x1="151.9671875" y1="774" x2="177.9671875" y2="774" stroke="#334155" stroke-width="3"/><text x="184.0" y="778.0" font-size="10" font-weight="400" fill="#172b3a" text-anchor="start">data / network</text><line x1="278.8265625" y1="774" x2="304.8265625" y2="774" stroke="#b91c1c" stroke-width="3"/><text x="310.8" y="778.0" font-size="10" font-weight="400" fill="#172b3a" text-anchor="start">trip / protection</text><rect x="24" y="792" width="1352" height="44" rx="0" fill="#f6f8fa" fill-opacity="1" stroke="#5b6b78" stroke-width="1"/><text x="32.0" y="806.0" font-size="11" font-weight="700" fill="#172b3a" text-anchor="start">F28-4  ·  Test-day organisation for an IST: one test director gives every instruction that changes the plant</text><text x="1368.0" y="806.0" font-size="10" font-weight="400" fill="#5b6b78" text-anchor="end">Chapter 28 · §28.4</text><text x="32.0" y="819.0" font-size="9" font-weight="400" fill="#5b6b78" text-anchor="start">Data Centre Commissioning Field Manual R01 EN · October 2026 · educational reference, not to scale · project and OEM documents govern</text><text x="32.0" y="831.0" font-size="9" font-weight="400" fill="#5b6b78" text-anchor="start">Symbols: QElectroTech EN 60617 and P&amp;ID collections, CC-BY 3.0, native geometry · instrument bubbles per ISA 5.1 · states per IEC 60617 / IEEE C37.2 practice</text></svg>