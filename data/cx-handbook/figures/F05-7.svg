dth="2.2"/><polyline points="140.0,480.0 330.0,448.2 520.0,416.4 710.0,384.6 900.0,352.8" fill="none" stroke="#b91c1c" stroke-width="2.2"/><line x1="140" y1="539" x2="162" y2="539" stroke="#b91c1c" stroke-width="2.2"/><text x="140.0" y="494.0" font-size="10" font-weight="400" fill="#5b6b78" text-anchor="middle">0</text><text x="330.0" y="494.0" font-size="10" font-weight="400" fill="#5b6b78" text-anchor="middle">0.5</text><text x="520.0" y="494.0" font-size="10" font-weight="400" fill="#5b6b78" text-anchor="middle">1</text><text x="710.0" y="494.0" font-size="10" font-weight="400" fill="#5b6b78" text-anchor="middle">1.5</text><text x="900.0" y="494.0" font-size="10" font-weight="400" fill="#5b6b78" text-anchor="middle">2</text><text x="134.0" y="484.0" font-size="10" font-weight="400" fill="#5b6b78" text-anchor="end">0</text><text x="134.0" y="394.0" font-size="10" font-weight="400" fill="#5b6b78" text-anchor="end">25</text><text x="134.0" y="304.0" font-size="10" font-weight="400" fill="#5b6b78" text-anchor="end">50</text><text x="134.0" y="214.0" font-size="10" font-weight="400" fill="#5b6b78" text-anchor="end">75</text><text x="134.0" y="124.0" font-size="10" font-weight="400" fill="#5b6b78" text-anchor="end">100</text><text x="520.0" y="510.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="middle">flushing velocity v (m/s)</text><text transform="translate(96 300.0) rotate(-90)" font-size="11" text-anchor="middle" fill="#172b3a">flow Q (l/s)</text><text x="168.0" y="528.0" font-size="10" font-weight="400" fill="#172b3a" text-anchor="start">DN250 main</text><text x="168.0" y="543.0" font-size="10" font-weight="400" fill="#172b3a" text-anchor="start">DN150 branch</text><text x="717.0" y="208.9" font-size="10" font-weight="400" fill="#8a5a00" text-anchor="start">73.6</text><text x="625.8" y="393.8" font-size="10" font-weight="400" fill="#8a5a00" text-anchor="start">22.3</text><text x="140.0" y="588.0" font-size="12" font-weight="400" fill="#172b3a" text-anchor="start">Marked points: DN250 main at 1.5 m/s needs 73.6 l/s; DN150 branch at 1.26 m/s (BSRIA BG 29, section 18.4.3) needs 22.3</text><text x="140.0" y="604.2" font-size="12" font-weight="400" fill="#172b3a" text-anchor="start">l/s.</text><circle cx="710.0" cy="214.9" r="4" fill="#b7791f"/><circle cx="618.8" cy="399.8" r="4" fill="#b7791f"/><text x="24.0" y="30.0" font-size="17" font-weight="700" fill="#172b3a" text-anchor="start">F05-7  Flushing flow needed for the RFI-B2-MEC-0248 velocities</text><text x="24.0" y="48.0" font-size="11" font-weight="400" fill="#5b6b78" text-anchor="start">Q = v × π/4 × D² · DN150 at 1.26 m/s needs 22.3 l/s · DN250 at 1.5 m/s needs 73.6 l/s (about 74 l/s) · nominal bore used as the internal diameter</text><text x="32.0" y="643.1" font-size="10" font-weight="700" fill="#2d6a4f" text-anchor="start">WHAT TO PROVE</text><text x="32.0" y="659.1" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">• For DN250: 1.5 m/s × π/4 × 0.25² m² = 0.0736 m³/s, which is about 74 l/s.</text><text x="32.0" y="674.1" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">• For DN150: 1.26 m/s × π/4 × 0.15² m² = 0.0223 m³/s, which is 22.3 l/s.</text><rect x="24" y="707.08" width="952" height="44" rx="0" fill="#f6f8fa" fill-opacity="1" stroke="#5b6b78" stroke-width="1"/><text x="32.0" y="721.1" font-size="11" font-weight="700" fill="#172b3a" text-anchor="start">F05-7  ·  Flushing flow needed for the RFI-B2-MEC-0248 velocities</text><text x="968.0" y="721.1" font-size="10" font-weight="400" fill="#5b6b78" text-anchor="end">Chapter 05 · §05.12.2</text><text x="32.0" y="734.1" font-size="9" font-weight="400" fill="#5b6b78" text-anchor="start">Data Centre Commissioning Field Manual R01 EN · October 2026 · educational reference, not to scale · project and OEM documents govern</text><text x="32.0" y="746.1" font-size="9" font-weight="400" fill="#5b6b78" text-anchor="start">Symbols: QElectroTech EN 60617 and P&amp;ID collections, CC-BY 3.0, native geometry · instrument bubbles per ISA 5.1 · states per IEC 60617 / IEEE C37.2 practice</text></svg>