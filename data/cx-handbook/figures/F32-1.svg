idth="0.8"/><rect x="50" y="608" width="760" height="76" rx="0" fill="#ffffff" fill-opacity="1" stroke="#475569" stroke-width="1.4"/><rect x="830" y="608" width="250" height="76" rx="0" fill="#ffffff" fill-opacity="1" stroke="#475569" stroke-width="1.4"/><rect x="1100" y="608" width="250" height="76" rx="0" fill="#ffffff" fill-opacity="1" stroke="#475569" stroke-width="1.4"/><text x="50.0" y="116.0" font-size="12" font-weight="700" fill="#5b6b78" text-anchor="start">Part 1: identification (originator)</text><text x="55.0" y="141.6" font-size="11.5" font-weight="700" fill="#172b3a" text-anchor="start">RFI number</text><text x="262.2" y="141.6" font-size="11.5" font-weight="700" fill="#172b3a" text-anchor="start">Container identifier</text><text x="639.1" y="141.6" font-size="11.5" font-weight="700" fill="#172b3a" text-anchor="start">Date raised</text><text x="902.8" y="141.6" font-size="11.5" font-weight="700" fill="#172b3a" text-anchor="start">Discipline</text><text x="1072.4" y="141.6" font-size="11.5" font-weight="700" fill="#172b3a" text-anchor="start">Priority</text><text x="1204.3" y="141.6" font-size="11.5" font-weight="700" fill="#172b3a" text-anchor="start">Status</text><text x="55.0" y="164.6" font-size="11.5" font-weight="400" fill="#172b3a" text-anchor="start">RFI-B2-BMS-0231</text><text x="262.2" y="164.6" font-size="11.5" font-weight="400" fill="#172b3a" text-anchor="start">MSC1-GCX-B2-DH-RI-B-0231</text><text x="639.1" y="164.6" font-size="11.5" font-weight="400" fill="#172b3a" text-anchor="start">08 Mar 2027 09:05</text><text x="902.8" y="164.6" font-size="11.5" font-weight="400" fill="#172b3a" text-anchor="start">B (BMS)</text><text x="1072.4" y="164.6" font-size="11.5" font-weight="400" fill="#172b3a" text-anchor="start">P2</text><text x="1204.3" y="164.6" font-size="11.5" font-weight="400" fill="#172b3a" text-anchor="start">closed</text><text x="62.0" y="212.8" font-size="11.5" font-weight="700" fill="#172b3a" text-anchor="start">Title</text><text x="62.0" y="225.6" font-size="9.5" font-weight="400" fill="#172b3a" text-anchor="start">B2-DH3-CDU-07 TCS return sensor: P&amp;ID shows well after strainer, CDU OEM drawing shows well before strainer</text><text x="50.0" y="274.0" font-size="12" font-weight="700" fill="#5b6b78" text-anchor="start">Part 2: location and references (originator)</text><text x="55.0" y="299.6" font-size="11.5" font-weight="700" fill="#172b3a" text-anchor="start">Field</text><text x="306.6" y="299.6" font-size="11.5" font-weight="700" fill="#172b3a" text-anchor="start">Entry</text><text x="55.0" y="322.6" font-size="11.5" font-weight="400" fill="#172b3a" text-anchor="start">Location and tags</text><text x="306.6" y="322.6" font-size="11.5" font-weight="400" fill="#172b3a" text-anchor="start">B2, level 01, data hall 3, grid G6; B2-DH3-CDU-07, point TCS_RetT</text><text x="55.0" y="345.6" font-size="11.5" font-weight="400" fill="#172b3a" text-anchor="start">Drawings</text><text x="306.6" y="345.6" font-size="11.5" font-weight="400" fill="#172b3a" text-anchor="start">MSC1-MEP-B2-01-DR-M-4410 C03 (P&amp;ID); CDU OEM general arrangement GA-CDU-1000 rev D</text><text x="55.0" y="368.6" font-size="11.5" font-weight="400" fill="#172b3a" text-anchor="start">Specification and trigger</text><text x="306.6" y="368.6" font-size="11.5" font-weight="400" fill="#172b3a" text-anchor="start">23 09 23 clause 2.4.A; trigger: conflict</text><text x="50.0" y="404.0" font-size="12" font-weight="700" fill="#5b6b78" text-anchor="start">Part 3: question and proposed solution (originator)</text><text x="62.0" y="437.4" font-size="11.5" font-weight="700" fill="#334155" text-anchor="start">Question</text><text x="62.0" y="450.2" font-size="9.5" font-weight="400" fill="#172b3a" text-anchor="start">1. Confirm the well location on CDU 07 and 15 sister CDUs.</text><text x="62.0" y="463.0" font-size="9.5" font-weight="400" fill="#172b3a" text-anchor="start">2. Confirm whether the P&amp;ID will be revised.</text><text x="722.0" y="437.4" font-size="11.5" font-weight="700" fill="#334155" text-anchor="start">Proposed solution</text><text x="722.0" y="450.2" font-size="9.5" font-weight="400" fill="#172b3a" text-anchor="start">Use the OEM location before the strainer;</text><text x="722.0" y="463.0" font-size="9.5" font-weight="400" fill="#172b3a" text-anchor="start">both locations read the same within ±0.1 K.</text><text x="50.0" y="518.0" font-size="12" font-weight="700" fill="#5b6b78" text-anchor="start">Part 4: impact, dates and routing (originator, RFI manager)</text><text x="55.0" y="543.6" font-size="11.5" font-weight="700" fill="#172b3a" text-anchor="start">Cost impact</text><text x="222.7" y="543.6" font-size="11.5" font-weight="700" fill="#172b3a" text-anchor="start">Time impact</text><text x="516.3" y="543.6" font-size="11.5" font-weight="700" fill="#172b3a" text-anchor="start">Activity</text><text x="809.8" y="543.6" font-size="11.5" font-weight="700" fill="#172b3a" text-anchor="start">Required by</text><text x="1019.5" y="543.6" font-size="11.5" font-weight="700" fill="#172b3a" text-anchor="start">Assignee</text><text x="55.0" y="566.6" font-size="11.5" font-weight="400" fill="#172b3a" text-anchor="start">N</text><text x="222.7" y="566.6" font-size="11.5" font-weight="400" fill="#172b3a" text-anchor="start">Y, L3 on 16 Mar 2027</text><text x="516.3" y="566.6" font-size="11.5" font-weight="400" fill="#172b3a" text-anchor="start">B2-DH3-CDU-L3-07</text><text x="809.8" y="566.6" font-size="11.5" font-weight="400" fill="#172b3a" text-anchor="start">15 Mar 2027</text><text x="1019.5" y="566.6" font-size="11.5" font-weight="400" fill="#172b3a" text-anchor="start">mechanical design lead</text><text x="50.0" y="598.0" font-size="12" font-weight="700" fill="#5b6b78" text-anchor="start">Part 5: response and closure (responder, RFI manager)</text><text x="62.0" y="631.4" font-size="11.5" font-weight="700" fill="#475569" text-anchor="start">Response (mechanical design lead, 11 Mar 2027)</text><text x="62.0" y="644.2" font-size="9.5" font-weight="400" fill="#172b3a" text-anchor="start">Accept the proposed solution for all 16 CDUs of B2-DH3.</text><text x="62.0" y="657.0" font-size="9.5" font-weight="400" fill="#172b3a" text-anchor="start">P&amp;ID 4410 will show the OEM location at revision C04.</text><text x="842.0" y="631.4" font-size="11.5" font-weight="700" fill="#475569" text-anchor="start">Classification</text><text x="842.0" y="644.2" font-size="9.5" font-weight="400" fill="#172b3a" text-anchor="start">clarification with</text><text x="842.0" y="657.0" font-size="9.5" font-weight="400" fill="#172b3a" text-anchor="start">revised document</text><text x="1112.0" y="631.4" font-size="11.5" font-weight="700" fill="#475569" text-anchor="start">Closure</text><text x="1112.0" y="644.2" font-size="9.5" font-weight="400" fill="#172b3a" text-anchor="start">12 Mar 2027,</text><text x="1112.0" y="657.0" font-size="9.5" font-weight="400" fill="#172b3a" text-anchor="start">GC document control</text><text x="50.0" y="716.0" font-size="11.5" font-weight="400" fill="#5b6b78" text-anchor="start">Required fields: every field in parts 1 to 4 before the RFI leaves draft; part 5 at answer and closure.</text><text x="50.0" y="740.0" font-size="11.5" font-weight="400" fill="#5b6b78" text-anchor="start">Linked items: P2P sheet P2P-B2-DH3-CDU07; no Cx issue raised; distribution GC, CxM, CxA, owner mechanical lead, CDU OEM.</text><text x="24.0" y="30.0" font-size="17" font-weight="700" fill="#172b3a" text-anchor="start">F32-1  RFI form as printed: RFI-B2-BMS-0231, CDU 07 return temperature sensor location</text><text x="24.0" y="48.0" font-size="11" font-weight="400" fill="#5b6b78" text-anchor="start">Priority P2, 5 working days · opened 08 Mar 2027, answered 11 Mar 2027 (3 working days) · required by 15 Mar 2027 for L3 of B2-DH3-CDU-07</text><text x="32.0" y="778.8" font-size="10" font-weight="700" fill="#2d6a4f" text-anchor="start">WHAT TO PROVE</text><text x="32.0" y="794.8" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">• The title names the asset, the two conflicting documents and both locations; both drawing references carry their revision.</text><text x="32.0" y="809.8" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">• The required-by date 15 Mar 2027 comes from the L3 activity on 16 Mar 2027, and the answer of 11 Mar 2027 is inside the P2 period of 5 working days.</text><text x="24.0" y="844.8" font-size="10" font-weight="700" fill="#5b6b78" text-anchor="start">LEGEND</text><line x1="24" y1="866.76" x2="50" y2="866.76" stroke="#334155" stroke-width="3"/><text x="56.0" y="870.8" font-size="10" font-weight="400" fill="#172b3a" text-anchor="start">data / network</text><line x1="150.859375" y1="866.76" x2="176.859375" y2="866.76" stroke="#475569" stroke-width="3"/><text x="182.9" y="870.8" font-size="10" font-weight="400" fill="#172b3a" text-anchor="start">signal / control</text><rect x="24" y="884.76" width="1352" height="44" rx="0" fill="#f6f8fa" fill-opacity="1" stroke="#5b6b78" stroke-width="1"/><text x="32.0" y="898.8" font-size="11" font-weight="700" fill="#172b3a" text-anchor="start">F32-1  ·  RFI form as printed: RFI-B2-BMS-0231, CDU 07 return temperature sensor location</text><text x="1368.0" y="898.8" font-size="10" font-weight="400" fill="#5b6b78" text-anchor="end">Chapter 32 · §32.2</text><text x="32.0" y="911.8" font-size="9" font-weight="400" fill="#5b6b78" text-anchor="start">Data Centre Commissioning Field Manual R01 EN · October 2026 · educational reference, not to scale · project and OEM documents govern</text><text x="32.0" y="923.8" font-size="9" font-weight="400" fill="#5b6b78" text-anchor="start">Symbols: QElectroTech EN 60617 and P&amp;ID collections, CC-BY 3.0, native geometry · instrument bubbles per ISA 5.1 · states per IEC 60617 / IEEE C37.2 practice</text></svg>