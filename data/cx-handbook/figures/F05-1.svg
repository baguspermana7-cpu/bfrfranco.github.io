y="7 5"/><rect x="48" y="352" width="164.405" height="16" rx="3" fill="#ffffff" fill-opacity="1" stroke="#172b3a" stroke-width="1"/><text x="54.0" y="364.0" font-size="11" font-weight="700" fill="#172b3a" text-anchor="start">RESPONDER (DESIGNER)</text><rect x="40" y="490" width="1320" height="120" rx="6" fill="#f6f8fa" fill-opacity="1" stroke="#172b3a" stroke-width="1.2" stroke-dasharray="7 5"/><rect x="48" y="482" width="39.5" height="16" rx="3" fill="#ffffff" fill-opacity="1" stroke="#172b3a" stroke-width="1"/><text x="54.0" y="494.0" font-size="11" font-weight="700" fill="#172b3a" text-anchor="start">CXM</text><rect x="24" y="632" width="1352" height="56" rx="4" fill="#f1f8f4" fill-opacity="1" stroke="#2d6a4f" stroke-width="1"/><polyline points="228.0,170.0 291.0,170.0 291.0,264.0" fill="none" stroke="#334155" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#arrow-334155)"/><polyline points="410.0,300.0 434.0,300.0" fill="none" stroke="#334155" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#arrow-334155)"/><polyline points="592.0,300.0 695.0,300.0 695.0,394.0" fill="none" stroke="#334155" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#arrow-334155)"/><polyline points="774.0,430.0 798.0,430.0" fill="none" stroke="#334155" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#arrow-334155)"/><polyline points="956.0,430.0 1059.0,430.0 1059.0,206.0" fill="none" stroke="#334155" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#arrow-334155)"/><polyline points="1138.0,170.0 1241.0,170.0 1241.0,264.0" fill="none" stroke="#334155" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#arrow-334155)"/><polyline points="1241.0,336.0 1241.0,524.0" fill="none" stroke="#475569" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#arrow-475569)"/><polyline points="695.0,466.0 695.0,560.0 1162.0,560.0" fill="none" stroke="#475569" stroke-width="1.6" stroke-linejoin="round" stroke-dasharray="7 5"/><rect x="70" y="134" width="158" height="72" rx="8" fill="#ffffff" fill-opacity="1" stroke="#334155" stroke-width="1.4"/><rect x="252" y="264" width="158" height="72" rx="8" fill="#ffffff" fill-opacity="1" stroke="#334155" stroke-width="1.4"/><rect x="434" y="264" width="158" height="72" rx="8" fill="#ffffff" fill-opacity="1" stroke="#334155" stroke-width="1.4"/><rect x="616" y="394" width="158" height="72" rx="8" fill="#ffffff" fill-opacity="1" stroke="#334155" stroke-width="1.4"/><rect x="798" y="394" width="158" height="72" rx="8" fill="#ffffff" fill-opacity="1" stroke="#334155" stroke-width="1.4"/><rect x="980" y="134" width="158" height="72" rx="8" fill="#ffffff" fill-opacity="1" stroke="#334155" stroke-width="1.4"/><rect x="1162" y="264" width="158" height="72" rx="8" fill="#ffffff" fill-opacity="1" stroke="#334155" stroke-width="1.4"/><rect x="1162" y="524" width="158" height="72" rx="8" fill="#ffffff" fill-opacity="1" stroke="#334155" stroke-width="1.4"/><text x="149.0" y="161.7" font-size="12" font-weight="700" fill="#334155" text-anchor="middle">Search log, draft</text><text x="149.0" y="175.2" font-size="10" font-weight="400" fill="#172b3a" text-anchor="middle">1 working day</text><text x="331.0" y="291.7" font-size="12" font-weight="700" fill="#334155" text-anchor="middle">Check fields</text><text x="331.0" y="305.2" font-size="10" font-weight="400" fill="#172b3a" text-anchor="middle">1 working day</text><text x="513.0" y="291.7" font-size="12" font-weight="700" fill="#334155" text-anchor="middle">Open and assign</text><text x="513.0" y="305.2" font-size="10" font-weight="400" fill="#172b3a" text-anchor="middle">clock starts</text><text x="695.0" y="421.7" font-size="12" font-weight="700" fill="#334155" text-anchor="middle">Coordinate</text><text x="695.0" y="435.2" font-size="10" font-weight="400" fill="#172b3a" text-anchor="middle">other disciplines</text><text x="877.0" y="421.7" font-size="12" font-weight="700" fill="#334155" text-anchor="middle">Respond, classify</text><text x="877.0" y="435.2" font-size="10" font-weight="400" fill="#172b3a" text-anchor="middle">2, 5 or 10 WD</text><text x="1059.0" y="161.7" font-size="12" font-weight="700" fill="#334155" text-anchor="middle">Confirm answer</text><text x="1059.0" y="175.2" font-size="10" font-weight="400" fill="#172b3a" text-anchor="middle">2 working days</text><text x="1241.0" y="291.7" font-size="12" font-weight="700" fill="#334155" text-anchor="middle">Close, update log</text><text x="1241.0" y="305.2" font-size="10" font-weight="400" fill="#172b3a" text-anchor="middle">1 working day</text><text x="1241.0" y="551.6" font-size="12" font-weight="700" fill="#334155" text-anchor="middle">Update Cx records</text><text x="1241.0" y="565.1" font-size="10" font-weight="400" fill="#172b3a" text-anchor="middle">script, issue</text><text x="70.0" y="540.0" font-size="11" font-weight="400" fill="#475569" text-anchor="start">CxM consulted when the answer affects a sequence, setpoint, point or test</text><text x="24.0" y="30.0" font-size="17" font-weight="700" fill="#172b3a" text-anchor="start">F05-1  RFI workflow across originator, RFI manager, responder and CxM</text><text x="24.0" y="48.0" font-size="11" font-weight="400" fill="#5b6b78" text-anchor="start">Draft within 1 working day · completeness check within 1 working day · response period by priority P1 2, P2 5, P3 10 working days · closure within 1 working day of confirmation</text><text x="32.0" y="646.0" font-size="10" font-weight="700" fill="#2d6a4f" text-anchor="start">WHAT TO PROVE</text><text x="32.0" y="662.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">• Priority P1 is answered in 2 working days, P2 in 5 and P3 in 10, unless the contract sets other periods.</text><text x="32.0" y="677.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">• The CxM updates scripts, checklists and the linked Cx issue after every Cx relevant response.</text><text x="24.0" y="712.0" font-size="10" font-weight="700" fill="#5b6b78" text-anchor="start">LEGEND</text><line x1="24" y1="734" x2="50" y2="734" stroke="#334155" stroke-width="3"/><text x="56.0" y="738.0" font-size="10" font-weight="400" fill="#172b3a" text-anchor="start">data / network</text><line x1="150.859375" y1="734" x2="176.859375" y2="734" stroke="#475569" stroke-width="3"/><text x="182.9" y="738.0" font-size="10" font-weight="400" fill="#172b3a" text-anchor="start">signal / control</text><rect x="24" y="752" width="1352" height="44" rx="0" fill="#f6f8fa" fill-opacity="1" stroke="#5b6b78" stroke-width="1"/><text x="32.0" y="766.0" font-size="11" font-weight="700" fill="#172b3a" text-anchor="start">F05-1  ·  RFI workflow across originator, RFI manager, responder and CxM</text><text x="1368.0" y="766.0" font-size="10" font-weight="400" fill="#5b6b78" text-anchor="end">Chapter 05 · §05.5</text><text x="32.0" y="779.0" font-size="9" font-weight="400" fill="#5b6b78" text-anchor="start">Data Centre Commissioning Field Manual R01 EN · October 2026 · educational reference, not to scale · project and OEM documents govern</text><text x="32.0" y="791.0" font-size="9" font-weight="400" fill="#5b6b78" text-anchor="start">Symbols: QElectroTech EN 60617 and P&amp;ID collections, CC-BY 3.0, native geometry · instrument bubbles per ISA 5.1 · states per IEC 60617 / IEEE C37.2 practice</text></svg>