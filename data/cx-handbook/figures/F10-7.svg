marker-end="url(#arrow-475569)"/><rect x="50" y="110" width="400" height="54" rx="8" fill="#ffffff" fill-opacity="1" stroke="#475569" stroke-width="1.4"/><rect x="560" y="110" width="390" height="54" rx="0" fill="#ffffff" fill-opacity="1" stroke="#b91c1c" stroke-width="1.4"/><rect x="50" y="194" width="400" height="54" rx="8" fill="#ffffff" fill-opacity="1" stroke="#475569" stroke-width="1.4"/><rect x="560" y="194" width="390" height="54" rx="0" fill="#ffffff" fill-opacity="1" stroke="#b91c1c" stroke-width="1.4"/><rect x="50" y="278" width="400" height="54" rx="8" fill="#ffffff" fill-opacity="1" stroke="#475569" stroke-width="1.4"/><rect x="560" y="278" width="390" height="54" rx="0" fill="#ffffff" fill-opacity="1" stroke="#b91c1c" stroke-width="1.4"/><rect x="50" y="362" width="400" height="54" rx="8" fill="#ffffff" fill-opacity="1" stroke="#475569" stroke-width="1.4"/><rect x="560" y="362" width="390" height="54" rx="0" fill="#ffffff" fill-opacity="1" stroke="#b91c1c" stroke-width="1.4"/><rect x="50" y="446" width="400" height="54" rx="8" fill="#ffffff" fill-opacity="1" stroke="#475569" stroke-width="1.4"/><rect x="560" y="446" width="390" height="54" rx="0" fill="#ffffff" fill-opacity="1" stroke="#b91c1c" stroke-width="1.4"/><rect x="50" y="530" width="400" height="54" rx="8" fill="#ffffff" fill-opacity="1" stroke="#475569" stroke-width="1.4"/><rect x="560" y="530" width="390" height="54" rx="0" fill="#ffffff" fill-opacity="1" stroke="#b91c1c" stroke-width="1.4"/><rect x="50" y="614" width="400" height="54" rx="8" fill="#ffffff" fill-opacity="1" stroke="#475569" stroke-width="1.4"/><rect x="560" y="614" width="390" height="54" rx="0" fill="#ffffff" fill-opacity="1" stroke="#b91c1c" stroke-width="1.4"/><rect x="50" y="698" width="400" height="54" rx="8" fill="#ffffff" fill-opacity="1" stroke="#475569" stroke-width="1.4"/><rect x="560" y="698" width="390" height="54" rx="0" fill="#ffffff" fill-opacity="1" stroke="#b91c1c" stroke-width="1.4"/><rect x="50" y="782" width="400" height="54" rx="8" fill="#ffffff" fill-opacity="1" stroke="#475569" stroke-width="1.4"/><rect x="560" y="782" width="390" height="54" rx="0" fill="#ffffff" fill-opacity="1" stroke="#b91c1c" stroke-width="1.4"/><rect x="50" y="866" width="400" height="54" rx="8" fill="#ffffff" fill-opacity="1" stroke="#475569" stroke-width="1.4"/><rect x="560" y="866" width="390" height="54" rx="0" fill="#ffffff" fill-opacity="1" stroke="#334155" stroke-width="1.4"/><text x="250.0" y="135.4" font-size="12" font-weight="700" fill="#475569" text-anchor="middle">1 Exposed live parts, cannot de-energise</text><text x="755.0" y="128.7" font-size="12" font-weight="700" fill="#b91c1c" text-anchor="middle">Energised electrical work permit</text><text x="755.0" y="142.2" font-size="10" font-weight="400" fill="#172b3a" text-anchor="middle">single task · NFPA 70E EEWP, PPE category</text><text x="505.0" y="130.0" font-size="11" font-weight="700" fill="#475569" text-anchor="middle">yes</text><text x="250.0" y="219.4" font-size="12" font-weight="700" fill="#475569" text-anchor="middle">2 Work on conductors made dead</text><text x="755.0" y="212.7" font-size="12" font-weight="700" fill="#b91c1c" text-anchor="middle">Electrical isolation permit</text><text x="755.0" y="226.2" font-size="10" font-weight="400" fill="#172b3a" text-anchor="middle">renewed daily · isolation certificate, earths</text><text x="505.0" y="214.0" font-size="11" font-weight="700" fill="#475569" text-anchor="middle">yes</text><text x="262.0" y="185.0" font-size="10.5" font-weight="400" fill="#172b3a" text-anchor="start">no or next question</text><text x="250.0" y="303.4" font-size="12" font-weight="700" fill="#475569" text-anchor="middle">3 Test needs an earth or isolation removed</text><text x="755.0" y="296.7" font-size="12" font-weight="700" fill="#b91c1c" text-anchor="middle">Sanction for test</text><text x="755.0" y="310.2" font-size="10" font-weight="400" fill="#172b3a" text-anchor="middle">duration of the test · test procedure</text><text x="505.0" y="298.0" font-size="11" font-weight="700" fill="#475569" text-anchor="middle">yes</text><text x="262.0" y="269.0" font-size="10.5" font-weight="400" fill="#172b3a" text-anchor="start">no or next question</text><text x="250.0" y="387.4" font-size="12" font-weight="700" fill="#475569" text-anchor="middle">4 Welding, cutting, grinding, flame</text><text x="755.0" y="380.7" font-size="12" font-weight="700" fill="#b91c1c" text-anchor="middle">Hot work permit</text><text x="755.0" y="394.2" font-size="10" font-weight="400" fill="#172b3a" text-anchor="middle">fire watch 1 h after · 11 m clearance</text><text x="505.0" y="382.0" font-size="11" font-weight="700" fill="#475569" text-anchor="middle">yes</text><text x="262.0" y="353.0" font-size="10.5" font-weight="400" fill="#172b3a" text-anchor="start">no or next question</text><text x="250.0" y="471.4" font-size="12" font-weight="700" fill="#475569" text-anchor="middle">5 Tank, pit, vault, trench or plenum</text><text x="755.0" y="464.7" font-size="12" font-weight="700" fill="#b91c1c" text-anchor="middle">Confined space entry permit</text><text x="755.0" y="478.2" font-size="10" font-weight="400" fill="#172b3a" text-anchor="middle">O2 19.5 % to 23.5 % · gas &lt; 10 % LFL</text><text x="505.0" y="466.0" font-size="11" font-weight="700" fill="#475569" text-anchor="middle">yes</text><text x="262.0" y="437.0" font-size="10.5" font-weight="400" fill="#172b3a" text-anchor="start">no or next question</text><text x="250.0" y="555.4" font-size="12" font-weight="700" fill="#475569" text-anchor="middle">6 Above the project height limit</text><text x="755.0" y="548.6" font-size="12" font-weight="700" fill="#b91c1c" text-anchor="middle">Work at height permit</text><text x="755.0" y="562.1" font-size="10" font-weight="400" fill="#172b3a" text-anchor="middle">project trigger, often 1.8 m · harness</text><text x="505.0" y="550.0" font-size="11" font-weight="700" fill="#475569" text-anchor="middle">yes</text><text x="262.0" y="521.0" font-size="10.5" font-weight="400" fill="#172b3a" text-anchor="start">no or next question</text><text x="250.0" y="639.4" font-size="12" font-weight="700" fill="#475569" text-anchor="middle">7 Crane lift or critical lift</text><text x="755.0" y="632.6" font-size="12" font-weight="700" fill="#b91c1c" text-anchor="middle">Lifting permit</text><text x="755.0" y="646.1" font-size="10" font-weight="400" fill="#172b3a" text-anchor="middle">one lift or shift · lift plan, exclusion zone</text><text x="505.0" y="634.0" font-size="11" font-weight="700" fill="#475569" text-anchor="middle">yes</text><text x="262.0" y="605.0" font-size="10.5" font-weight="400" fill="#172b3a" text-anchor="start">no or next question</text><text x="250.0" y="723.4" font-size="12" font-weight="700" fill="#475569" text-anchor="middle">8 Digging near 20 kV cable or earth grid</text><text x="755.0" y="716.6" font-size="12" font-weight="700" fill="#b91c1c" text-anchor="middle">Excavation permit</text><text x="755.0" y="730.1" font-size="10" font-weight="400" fill="#172b3a" text-anchor="middle">duration of the dig · cable locate</text><text x="505.0" y="718.0" font-size="11" font-weight="700" fill="#475569" text-anchor="middle">yes</text><text x="262.0" y="689.0" font-size="10.5" font-weight="400" fill="#172b3a" text-anchor="start">no or next question</text><text x="250.0" y="807.4" font-size="12" font-weight="700" fill="#475569" text-anchor="middle">9 Pressurised CHW, fuel or refrigerant</text><text x="755.0" y="800.6" font-size="12" font-weight="700" fill="#b91c1c" text-anchor="middle">Mechanical isolation permit</text><text x="755.0" y="814.1" font-size="10" font-weight="400" fill="#172b3a" text-anchor="middle">two valves locked · gauge at 0 bar</text><text x="505.0" y="802.0" font-size="11" font-weight="700" fill="#475569" text-anchor="middle">yes</text><text x="262.0" y="773.0" font-size="10.5" font-weight="400" fill="#172b3a" text-anchor="start">no or next question</text><text x="250.0" y="891.4" font-size="12" font-weight="700" fill="#475569" text-anchor="middle">No &quot;yes&quot; in questions 1 to 9</text><text x="755.0" y="884.6" font-size="12" font-weight="700" fill="#334155" text-anchor="middle">General work permit</text><text x="755.0" y="898.1" font-size="10" font-weight="400" fill="#172b3a" text-anchor="middle">one shift · area check, barriers, PPE</text><text x="50.0" y="962.0" font-size="12" font-weight="400" fill="#172b3a" text-anchor="start">Every question is answered for every request: a &quot;yes&quot; adds a permit, and the next question is still asked. The permits of one task are</text><text x="50.0" y="978.2" font-size="12" font-weight="400" fill="#172b3a" text-anchor="start">cross-referenced by number on each form.</text><text x="24.0" y="30.0" font-size="17" font-weight="700" fill="#172b3a" text-anchor="start">F10-7  Permit type selection: one question per hazard, top to bottom</text><text x="24.0" y="48.0" font-size="11" font-weight="400" fill="#5b6b78" text-anchor="start">10 permit types · answer every question · a task can need two permits · validity: one shift unless stated · lead time 2 working days, 5 for HV</text><text x="32.0" y="1017.1" font-size="10" font-weight="700" fill="#2d6a4f" text-anchor="start">WHAT TO PROVE</text><text x="32.0" y="1033.1" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">• Hot work in a cable trench answers &quot;yes&quot; at questions 4 and 5 and needs a hot work permit and a confined space entry permit.</text><text x="32.0" y="1048.1" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">• The fire watch after hot work is at least 1 hour (raised by NFPA 51B-2019; confirm in NFPA 51B-2024).</text><text x="32.0" y="1063.1" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">• The confined space atmosphere is 19.5 % to 23.5 % oxygen and below 10 % of the LFL (OSHA 29 CFR 1910.146).</text><text x="24.0" y="1098.1" font-size="10" font-weight="700" fill="#5b6b78" text-anchor="start">LEGEND</text><line x1="24" y1="1120.08" x2="50" y2="1120.08" stroke="#475569" stroke-width="3"/><text x="56.0" y="1124.1" font-size="10" font-weight="400" fill="#172b3a" text-anchor="start">signal / control</text><line x1="151.9671875" y1="1120.08" x2="177.9671875" y2="1120.08" stroke="#b91c1c" stroke-width="3"/><text x="184.0" y="1124.1" font-size="10" font-weight="400" fill="#172b3a" text-anchor="start">trip / protection</text><line x1="283.934375" y1="1120.08" x2="309.934375" y2="1120.08" stroke="#334155" stroke-width="3"/><text x="315.9" y="1124.1" font-size="10" font-weight="400" fill="#172b3a" text-anchor="start">data / network</text><rect x="24" y="1138.08" width="952" height="44" rx="0" fill="#f6f8fa" fill-opacity="1" stroke="#5b6b78" stroke-width="1"/><text x="32.0" y="1152.1" font-size="11" font-weight="700" fill="#172b3a" text-anchor="start">F10-7  ·  Permit type selection: one question per hazard, top to bottom</text><text x="968.0" y="1152.1" font-size="10" font-weight="400" fill="#5b6b78" text-anchor="end">Chapter 10 · §10.1.3</text><text x="32.0" y="1165.1" font-size="9" font-weight="400" fill="#5b6b78" text-anchor="start">Data Centre Commissioning Field Manual R01 EN · October 2026 · educational reference, not to scale · project and OEM documents govern</text><text x="32.0" y="1177.1" font-size="9" font-weight="400" fill="#5b6b78" text-anchor="start">Symbols: QElectroTech EN 60617 and P&amp;ID collections, CC-BY 3.0, native geometry · instrument bubbles per ISA 5.1 · states per IEC 60617 / IEEE C37.2 practice</text></svg>