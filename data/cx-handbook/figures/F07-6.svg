font-weight="400" fill="#172b3a" text-anchor="start">TS-02-02</text><text x="45.0" y="454.3" font-size="12" font-weight="400" fill="#172b3a" text-anchor="start">5.5</text><text x="141.8" y="454.3" font-size="12" font-weight="400" fill="#172b3a" text-anchor="start">W / W / W</text><text x="351.7" y="454.3" font-size="12" font-weight="400" fill="#172b3a" text-anchor="start">witnesses sign the sheet</text><text x="771.3" y="454.3" font-size="12" font-weight="400" fill="#172b3a" text-anchor="start">TS-02-01</text><text x="45.0" y="478.3" font-size="12" font-weight="400" fill="#172b3a" text-anchor="start">5.4</text><text x="141.8" y="478.3" font-size="12" font-weight="400" fill="#172b3a" text-anchor="start">W / W / R</text><text x="351.7" y="478.3" font-size="12" font-weight="400" fill="#172b3a" text-anchor="start">GC and Engineer sign; CxM reviews</text><text x="771.3" y="478.3" font-size="12" font-weight="400" fill="#172b3a" text-anchor="start">TS-02-04</text><text x="45.0" y="502.3" font-size="12" font-weight="400" fill="#172b3a" text-anchor="start">6.3</text><text x="141.8" y="502.3" font-size="12" font-weight="400" fill="#172b3a" text-anchor="start">H / H / H</text><text x="351.7" y="502.3" font-size="12" font-weight="400" fill="#172b3a" text-anchor="start">GC, Engineer, then CxM</text><text x="771.3" y="502.3" font-size="12" font-weight="400" fill="#172b3a" text-anchor="start">release form</text><text x="40.0" y="550.0" font-size="12" font-weight="400" fill="#172b3a" text-anchor="start">Before line 6.3: the 2 category B punch items (missing phase labels at the transformer end) are closed.</text><text x="40.0" y="566.2" font-size="12" font-weight="400" fill="#172b3a" text-anchor="start">Acceptance sources: NETA ATS Table 100.1, 25 kV class (section 13.4.2); the 25 % fall limit is the project specification value.</text><text x="24.0" y="30.0" font-size="17" font-weight="700" fill="#172b3a" text-anchor="start">F07-6  MV cable test lines 5.1 to 6.3 for feeder B2-MV-F07, in test order</text><text x="24.0" y="48.0" font-size="11" font-weight="400" fill="#5b6b78" text-anchor="start">ITP-ELE-MV-002 rev 1 · 410 m, 3 × 1C 630 mm² · IR minimum 10,000 MΩ at 1 min · fall after VLF ≤ 25 % · tests 3 June, oversheath 8 June, CxM release 10 June 2026</text><text x="32.0" y="605.1" font-size="10" font-weight="700" fill="#2d6a4f" text-anchor="start">WHAT TO PROVE</text><text x="32.0" y="621.1" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">• Every phase reads above 10,000 MΩ before and after VLF; the largest fall is 3.1 % on L1, inside the 25 % allowed.</text><text x="32.0" y="636.1" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">• Line 5.2 is a GC hold point released after the VLF test with no breakdown; line 6.3 is held by the GC, the Engineer and the CxM.</text><text x="24.0" y="671.1" font-size="10" font-weight="700" fill="#5b6b78" text-anchor="start">LEGEND</text><line x1="24" y1="693.08" x2="50" y2="693.08" stroke="#475569" stroke-width="3"/><text x="56.0" y="697.1" font-size="10" font-weight="400" fill="#172b3a" text-anchor="start">signal / control</text><rect x="24" y="711.08" width="952" height="44" rx="0" fill="#f6f8fa" fill-opacity="1" stroke="#5b6b78" stroke-width="1"/><text x="32.0" y="725.1" font-size="11" font-weight="700" fill="#172b3a" text-anchor="start">F07-6  ·  MV cable test lines 5.1 to 6.3 for feeder B2-MV-F07, in test order</text><text x="968.0" y="725.1" font-size="10" font-weight="400" fill="#5b6b78" text-anchor="end">Chapter 07 · §07.9.3</text><text x="32.0" y="738.1" font-size="9" font-weight="400" fill="#5b6b78" text-anchor="start">Data Centre Commissioning Field Manual R01 EN · October 2026 · educational reference, not to scale · project and OEM documents govern</text><text x="32.0" y="750.1" font-size="9" font-weight="400" fill="#5b6b78" text-anchor="start">Symbols: QElectroTech EN 60617 and P&amp;ID collections, CC-BY 3.0, native geometry · instrument bubbles per ISA 5.1 