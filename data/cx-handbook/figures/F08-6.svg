x="835.0" y="152.6" font-size="12" font-weight="700" fill="#172b3a" text-anchor="middle">Change Order, CCD or minor</text><text x="835.0" y="168.4" font-size="12" font-weight="700" fill="#172b3a" text-anchor="middle">change (7.1.2)</text><text x="46.0" y="193.9" font-size="12" font-weight="400" fill="#172b3a" text-anchor="start">2 Record</text><text x="335.0" y="193.9" font-size="12" font-weight="700" fill="#172b3a" text-anchor="middle">PCO within 2 working days (MSC-1)</text><text x="585.0" y="193.9" font-size="12" font-weight="700" fill="#172b3a" text-anchor="middle">Early Warning Register (15); PCO</text><text x="835.0" y="193.9" font-size="12" font-weight="700" fill="#172b3a" text-anchor="middle">PCO within 2 working days (MSC-1)</text><text x="46.0" y="227.2" font-size="12" font-weight="400" fill="#172b3a" text-anchor="start">3 Notice</text><text x="335.0" y="219.3" font-size="12" font-weight="700" fill="#172b3a" text-anchor="middle">Notice of Claim within 28 days</text><text x="335.0" y="235.2" font-size="12" font-weight="700" fill="#172b3a" text-anchor="middle">(20.2.1)</text><text x="585.0" y="227.2" font-size="12" font-weight="700" fill="#172b3a" text-anchor="middle">CE notified within 8 weeks (61.3)</text><text x="835.0" y="219.3" font-size="12" font-weight="700" fill="#172b3a" text-anchor="middle">Claim notice within 21 days</text><text x="835.0" y="235.2" font-size="12" font-weight="700" fill="#172b3a" text-anchor="middle">(15.1.3.1)</text><text x="46.0" y="260.6" font-size="12" font-weight="400" fill="#172b3a" text-anchor="start">4 Proposal</text><text x="335.0" y="260.6" font-size="12" font-weight="700" fill="#172b3a" text-anchor="middle">particulars within 28 days (13.3.1)</text><text x="585.0" y="260.6" font-size="12" font-weight="700" fill="#172b3a" text-anchor="middle">quotation within 3 weeks (62.3)</text><text x="835.0" y="260.6" font-size="12" font-weight="700" fill="#172b3a" text-anchor="middle">itemised proposal (7.3.3)</text><text x="46.0" y="294.0" font-size="12" font-weight="400" fill="#172b3a" text-anchor="start">5 Decision</text><text x="335.0" y="286.0" font-size="12" font-weight="700" fill="#172b3a" text-anchor="middle">agree in 42 days, then determine</text><text x="335.0" y="301.9" font-size="12" font-weight="700" fill="#172b3a" text-anchor="middle">in 42 days (3.7)</text><text x="585.0" y="294.0" font-size="12" font-weight="700" fill="#172b3a" text-anchor="middle">PM reply within 2 weeks (62.3)</text><text x="835.0" y="286.0" font-size="12" font-weight="700" fill="#172b3a" text-anchor="middle">Change Order signed (7.2) or CCD</text><text x="835.0" y="301.9" font-size="12" font-weight="700" fill="#172b3a" text-anchor="middle">(7.3)</text><text x="46.0" y="335.2" font-size="12" font-weight="400" fill="#172b3a" text-anchor="start">6 Implementation</text><text x="335.0" y="327.3" font-size="12" font-weight="700" fill="#172b3a" text-anchor="middle">DCN within 10 working days; ITP</text><text x="335.0" y="343.2" font-size="12" font-weight="700" fill="#172b3a" text-anchor="middle">and Cx scripts within 10 more</text><text x="585.0" y="335.2" font-size="12" font-weight="700" fill="#172b3a" text-anchor="middle">as FIDIC (MSC-1 procedure)</text><text x="835.0" y="335.2" font-size="12" font-weight="700" fill="#172b3a" text-anchor="middle">as FIDIC (MSC-1 procedure)</text><text x="46.0" y="376.5" font-size="12" font-weight="400" fill="#172b3a" text-anchor="start">7 Closure</text><text x="335.0" y="368.6" font-size="12" font-weight="700" fill="#172b3a" text-anchor="middle">register closed with a</text><text x="335.0" y="384.4" font-size="12" font-weight="700" fill="#172b3a" text-anchor="middle">commissioning test record</text><text x="585.0" y="376.5" font-size="12" font-weight="700" fill="#172b3a" text-anchor="middle">as FIDIC</text><text x="835.0" y="376.5" font-size="12" font-weight="700" fill="#172b3a" text-anchor="middle">as FIDIC</text><text x="40.0" y="432.7" font-size="12" font-weight="400" fill="#172b3a" text-anchor="start">Red cells are time bars: a late notice can lose the entitlement to time and money.</text><text x="40.0" y="448.9" font-size="12" font-weight="400" fill="#172b3a" text-anchor="start">PM = Project Manager; CE = compensation event; CCD = construction change directive; PCO = potential change order; DCN = design change notice.</text><text x="24.0" y="30.0" font-size="17" font-weight="700" fill="#172b3a" text-anchor="start">F08-6  Seven steps of a change and the document at each step, by contract form</text><text x="24.0" y="48.0" font-size="10" font-weight="400" fill="#5b6b78" text-anchor="start">notice: FIDIC 28 days, NEC4 8 weeks, AIA 21 days · proposal: FIDIC 28 days, NEC4 3 weeks · decision: FIDIC 42 + 42 days, NEC4 reply 2 weeks · MSC-1 internal limits in</text><text x="24.0" y="61.0" font-size="10" font-weight="400" fill="#5b6b78" text-anchor="start">working days</text><text x="32.0" y="487.8" font-size="10" font-weight="700" fill="#2d6a4f" text-anchor="start">WHAT TO PROVE</text><text x="32.0" y="503.8" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">• The notice step has a different time bar in each form: FIDIC 20.2.1 within 28 days, NEC4 61.3 within eight weeks, AIA 15.1.3.1 within 21 days.</text><text x="32.0" y="518.8" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">• Implementation and closure follow the MSC-1 procedure in every form: DCN within 10 working days of approval, ITP and Cx scripts within 10 working days of the</text><text x="32.0" y="533.8" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">DCN, closure only with a test record.</text><rect x="24" y="566.8" width="952" height="44" rx="0" fill="#f6f8fa" fill-opacity="1" stroke="#5b6b78" stroke-width="1"/><text x="32.0" y="580.8" font-size="11" font-weight="700" fill="#172b3a" text-anchor="start">F08-6  ·  Seven steps of a change and the document at each step, by contract form</text><text x="968.0" y="580.8" font-size="10" font-weight="400" fill="#5b6b78" text-anchor="end">Chapter 08 · §08.2.2</text><text x="32.0" y="593.8" font-size="9" font-weight="400" fill="#5b6b78" text-anchor="start">Data Centre Commissioning Field Manual R01 EN · October 2026 · educational reference, not to scale · project and OEM documents govern</text><text x="32.0" y="605.8" font-size="9" font-weight="400" fill="#5b6b78" text-anchor="start">Symbols: QElectroTech EN 60617 and P&amp;ID collections, CC-BY 3.0, native geometry · instrument bubbles per ISA 5.1 · states per IEC 60617 / IEEE C37.2 practice</text></svg>