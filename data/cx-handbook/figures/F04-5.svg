1.4"/><rect x="797.6" y="190" width="361.5999999999998" height="40" rx="3" fill="#d1d4da" fill-opacity="1" stroke="#7e8896" stroke-width="1.4"/><rect x="24" y="378.76" width="1352" height="56" rx="4" fill="#f1f8f4" fill-opacity="1" stroke="#2d6a4f" stroke-width="1"/><line x1="210.0" y1="128" x2="210.0" y2="172" stroke="#334155" stroke-width="2.4"/><circle cx="210.0" cy="150.0" r="4" fill="#334155"/><line x1="210.0" y1="190" x2="210.0" y2="230" stroke="#b91c1c" stroke-width="2"/><line x1="571.6" y1="130" x2="571.6" y2="170" stroke="#334155" stroke-width="2"/><line x1="797.6" y1="190" x2="797.6" y2="230" stroke="#475569" stroke-width="2"/><line x1="888.0" y1="248" x2="888.0" y2="292" stroke="#b91c1c" stroke-width="2.4"/><circle cx="888.0" cy="270.0" r="4" fill="#b91c1c"/><line x1="1159.2" y1="248" x2="1159.2" y2="292" stroke="#475569" stroke-width="2.4"/><circle cx="1159.2" cy="270.0" r="4" fill="#475569"/><text x="68.0" y="154.0" font-size="11" font-weight="700" fill="#172b3a" text-anchor="start">Contractor</text><text x="68.0" y="214.0" font-size="11" font-weight="700" fill="#172b3a" text-anchor="start">Reviewer</text><text x="68.0" y="274.0" font-size="11" font-weight="700" fill="#172b3a" text-anchor="start">FAT need</text><text x="210.0" y="314.0" font-size="10" font-weight="400" fill="#5b6b78" text-anchor="middle">0 WD</text><text x="436.0" y="314.0" font-size="10" font-weight="400" fill="#5b6b78" text-anchor="middle">5 WD</text><text x="662.0" y="314.0" font-size="10" font-weight="400" fill="#5b6b78" text-anchor="middle">10 WD</text><text x="888.0" y="314.0" font-size="10" font-weight="400" fill="#5b6b78" text-anchor="middle">15 WD</text><text x="1114.0" y="314.0" font-size="10" font-weight="400" fill="#5b6b78" text-anchor="middle">20 WD</text><text x="1340.0" y="314.0" font-size="10" font-weight="400" fill="#5b6b78" text-anchor="middle">25 WD</text><text x="217.0" y="154.0" font-size="10" font-weight="400" fill="#334155" text-anchor="start">submit P02</text><text x="215.0" y="214.0" font-size="10" font-weight="400" fill="#172b3a" text-anchor="start">review 1: code C</text><text x="576.6" y="154.0" font-size="10" font-weight="400" fill="#172b3a" text-anchor="start">revise P03</text><text x="802.6" y="214.0" font-size="10" font-weight="400" fill="#172b3a" text-anchor="start">review 2: code B</text><text x="895.0" y="274.0" font-size="10" font-weight="400" fill="#b91c1c" text-anchor="start">latest approval 27 Jul</text><text x="1166.2" y="274.0" font-size="10" font-weight="400" fill="#475569" text-anchor="start">approved 4 Aug</text><text x="60.0" y="354.0" font-size="11.5" font-weight="400" fill="#5b6b78" text-anchor="start">WD = working day after the first submission. Day 0 is Monday 6 July 2026; no public holiday in the period.</text><text x="24.0" y="30.0" font-size="17" font-weight="700" fill="#172b3a" text-anchor="start">F04-5  Review cycle of the UPS control wiring drawing against the FAT need date</text><text x="24.0" y="48.0" font-size="11" font-weight="400" fill="#5b6b78" text-anchor="start">MSC1-UPS-B2-01-DR-X-0031 · 10 working day review period · code C on day 8, resubmission, code B on day 8 · approval 6 working days after the latest date</text><text x="32.0" y="392.8" font-size="10" font-weight="700" fill="#2d6a4f" text-anchor="start">WHAT TO PROVE</text><text x="32.0" y="408.8" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">• First review: submitted 6 July, returned 16 July with code C (8 working days); second review: resubmitted 23 July, returned 4 August with code B (8 working days).</text><text x="32.0" y="423.8" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">• Total 21 working days from first submission to approval against a latest approval of working day 15, so the CxM raises an early warning.</text><rect x="24" y="456.76" width="1352" height="44" rx="0" fill="#f6f8fa" fill-opacity="1" stroke="#5b6b78" stroke-width="1"/><text x="32.0" y="470.8" font-size="11" font-weight="700" fill="#172b3a" text-anchor="start">F04-5  ·  Review cycle of the UPS control wiring drawing against the FAT need date</text><text x="1368.0" y="470.8" font-size="10" font-weight="400" fill="#5b6b78" text-anchor="end">Chapter 04 · §04.8</text><text x="32.0" y="483.8" font-size="9" font-weight="400" fill="#5b6b78" text-anchor="start">Data Centre Commissioning Field Manual R01 EN · October 2026 · educational reference, not to scale · project and OEM documents govern</text><text x="32.0" y="495.8" font-size="9" font-weight="400" fill="#5b6b78" text-anchor="start">Symbols: QElectroTech EN 60617 and P&amp;ID collections, CC-BY 3.0, native geometry · instrument bubbles per ISA 5.1 · states per IEC 60617 / IEEE C37.2 practice</text></svg>