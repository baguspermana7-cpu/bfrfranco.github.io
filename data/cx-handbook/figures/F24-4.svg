idth="0.8" stroke-dasharray="3 3"/><line x1="1360.0" y1="120" x2="1360.0" y2="484" stroke="#d7dee4" stroke-width="0.8" stroke-dasharray="3 3"/><rect x="190.117" y="442" width="877.383" height="32" rx="3" fill="#c5cace" fill-opacity="1" stroke="#5d6b75" stroke-width="1.4"/><rect x="24" y="559.49" width="1352" height="56" rx="4" fill="#f1f8f4" fill-opacity="1" stroke="#2d6a4f" stroke-width="1"/><line x1="190.0" y1="128" x2="190.0" y2="164" stroke="#b91c1c" stroke-width="2.4"/><circle cx="190.0" cy="146.0" r="4" fill="#b91c1c"/><line x1="190.1" y1="180" x2="190.1" y2="216" stroke="#334155" stroke-width="2.4"/><circle cx="190.1" cy="198.0" r="4" fill="#334155"/><line x1="189.8" y1="232" x2="189.8" y2="268" stroke="#334155" stroke-width="2.4"/><circle cx="189.8" cy="250.0" r="4" fill="#334155"/><line x1="190.2" y1="284" x2="190.2" y2="320" stroke="#334155" stroke-width="2.4"/><circle cx="190.2" cy="302.0" r="4" fill="#334155"/><line x1="190.5" y1="336" x2="190.5" y2="372" stroke="#475569" stroke-width="2.4"/><circle cx="190.5" cy="354.0" r="4" fill="#475569"/><line x1="431.0" y1="388" x2="431.0" y2="424" stroke="#b45309" stroke-width="2.4"/><circle cx="431.0" cy="406.0" r="4" fill="#b45309"/><line x1="190.1" y1="442" x2="190.1" y2="474" stroke="#172b3a" stroke-width="2"/><text x="48.0" y="150.0" font-size="11" font-weight="700" fill="#172b3a" text-anchor="start">Test set output</text><text x="48.0" y="202.0" font-size="11" font-weight="700" fill="#172b3a" text-anchor="start">ION9000 (PTP)</text><text x="48.0" y="254.0" font-size="11" font-weight="700" fill="#172b3a" text-anchor="start">Easergy P3 (PTP)</text><text x="48.0" y="306.0" font-size="11" font-weight="700" fill="#172b3a" text-anchor="start">MTZ trip unit (PTP)</text><text x="48.0" y="358.0" font-size="11" font-weight="700" fill="#172b3a" text-anchor="start">PM8000 (IRIG-B)</text><text x="48.0" y="410.0" font-size="11" font-weight="700" fill="#172b3a" text-anchor="start">PM5000 (PME sync)</text><text x="48.0" y="462.0" font-size="11" font-weight="700" fill="#172b3a" text-anchor="start">PME event log</text><text x="190.0" y="498.0" font-size="10" font-weight="400" fill="#5b6b78" text-anchor="middle">0 ms</text><text x="482.5" y="498.0" font-size="10" font-weight="400" fill="#5b6b78" text-anchor="middle">500 ms</text><text x="775.0" y="498.0" font-size="10" font-weight="400" fill="#5b6b78" text-anchor="middle">1000 ms</text><text x="1067.5" y="498.0" font-size="10" font-weight="400" fill="#5b6b78" text-anchor="middle">1500 ms</text><text x="1360.0" y="498.0" font-size="10" font-weight="400" fill="#5b6b78" text-anchor="middle">2000 ms</text><text x="197.0" y="150.0" font-size="10" font-weight="400" fill="#b91c1c" text-anchor="start">t0 = 0 ms</text><text x="197.1" y="202.0" font-size="10" font-weight="400" fill="#334155" text-anchor="start">+0.2 ms</text><text x="196.8" y="254.0" font-size="10" font-weight="400" fill="#334155" text-anchor="start">-0.3 ms</text><text x="197.2" y="306.0" font-size="10" font-weight="400" fill="#334155" text-anchor="start">+0.4 ms</text><text x="197.5" y="358.0" font-size="10" font-weight="400" fill="#475569" text-anchor="start">+0.8 ms</text><text x="438.0" y="410.0" font-size="10" font-weight="400" fill="#b45309" text-anchor="start">+412 ms</text><text x="195.1" y="462.0" font-size="10" font-weight="400" fill="#172b3a" text-anchor="start">events written within 1.5 s</text><text x="40.0" y="520.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">Debounce: each binary input has a filter (for example 2 ms on the relay, 1 ms on the meter); the time stamp is taken after the filter, so the record lists the setting and subtracts it.</text><text x="40.0" y="534.9" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">Scale: the window shown is 0 to 2,000 ms so that the PM5000 point and the PME log write time are visible; the PTP and IRIG-B devices sit inside 1 ms of t0.</text><text x="24.0" y="30.0" font-size="17" font-weight="700" fill="#172b3a" text-anchor="start">F24-4  SOE timing chart: one injected trip seen by five devices and the PME event log</text><text x="24.0" y="48.0" font-size="11" font-weight="400" fill="#5b6b78" text-anchor="start">t = 0 is the test-set binary output at a GPS second · acceptance ±1 ms device-to-device on PTP or IRIG-B (project value) · PM5000 on PME time sync shows +412 ms and is excluded from SOE use</text><text x="32.0" y="573.5" font-size="10" font-weight="700" fill="#2d6a4f" text-anchor="start">WHAT TO PROVE</text><text x="32.0" y="589.5" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">• ION9000, Easergy P3 and MTZ report within 0.4 ms of the injection after debounce correction; PM8000 on IRIG-B reports +0.8 ms: all inside ±1 ms.</text><text x="32.0" y="604.5" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">• The PM5000 time stamp is 412 ms late because it is synchronised by PME software only: it must not be used in SOE reports, which the SOE test record states.</text><rect x="24" y="637.49" width="1352" height="44" rx="0" fill="#f6f8fa" fill-opacity="1" stroke="#5b6b78" stroke-width="1"/><text x="32.0" y="651.5" font-size="11" font-weight="700" fill="#172b3a" text-anchor="start">F24-4  ·  SOE timing chart: one injected trip seen by five devices and the PME event log</text><text x="1368.0" y="651.5" font-size="10" font-weight="400" fill="#5b6b78" text-anchor="end">Chapter 24 · §24.10</text><text x="32.0" y="664.5" font-size="9" font-weight="400" fill="#5b6b78" text-anchor="start">Data Centre Commissioning Field Manual R01 EN · October 2026 · educational reference, not to scale · project and OEM documents govern</text><text x="32.0" y="676.5" font-size="9" font-weight="400" fill="#5b6b78" text-anchor="start">Symbols: QElectroTech EN 60617 and P&amp;ID collections, CC-BY 3.0, native geometry · instrument bubbles per ISA 5.1 · states per IEC 60617 / IEEE C37.2 practice</text></svg>