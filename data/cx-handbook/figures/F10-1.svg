ty="1" stroke="#9fb0bb" stroke-width="0.8"/><rect x="982.8571428571429" y="490.0" width="377.14285714285717" height="22.0" rx="0" fill="#ffffff" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><rect x="40" y="512.0" width="174.06593406593407" height="22.0" rx="0" fill="#ffffff" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><rect x="214.06593406593407" y="512.0" width="217.58241758241758" height="22.0" rx="0" fill="#ffffff" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><rect x="431.64835164835165" y="512.0" width="319.1208791208792" height="22.0" rx="0" fill="#ffffff" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><rect x="750.7692307692308" y="512.0" width="232.0879120879121" height="22.0" rx="0" fill="#ffffff" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><rect x="982.8571428571429" y="512.0" width="377.14285714285717" height="22.0" rx="0" fill="#ffffff" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><text x="40.0" y="112.0" font-size="13" font-weight="700" fill="#172b3a" text-anchor="start">Before the work day</text><text x="155.0" y="150.8" font-size="11.5" font-weight="700" fill="#475569" text-anchor="middle">1 Request</text><text x="155.0" y="163.6" font-size="9.5" font-weight="400" fill="#172b3a" text-anchor="middle">receiver, MS and RA</text><text x="427.0" y="150.8" font-size="11.5" font-weight="700" fill="#475569" text-anchor="middle">2 Conflict check</text><text x="427.0" y="163.6" font-size="9.5" font-weight="400" fill="#172b3a" text-anchor="middle">coordinator, 1 day</text><text x="699.0" y="150.8" font-size="11.5" font-weight="700" fill="#475569" text-anchor="middle">3 Prepare isolation</text><text x="699.0" y="163.6" font-size="9.5" font-weight="400" fill="#172b3a" text-anchor="middle">isolating authority</text><text x="971.0" y="150.8" font-size="11.5" font-weight="700" fill="#475569" text-anchor="middle">4 Isolate, prove dead</text><text x="971.0" y="163.6" font-size="9.5" font-weight="400" fill="#172b3a" text-anchor="middle">certificate signed</text><text x="1243.0" y="150.8" font-size="11.5" font-weight="700" fill="#475569" text-anchor="middle">5 Issue permit</text><text x="1243.0" y="163.6" font-size="9.5" font-weight="400" fill="#172b3a" text-anchor="middle">joint walk-down</text><text x="40.0" y="252.0" font-size="13" font-weight="700" fill="#172b3a" text-anchor="start">On the work day</text><text x="155.0" y="290.8" font-size="11.5" font-weight="700" fill="#334155" text-anchor="middle">6 Brief work party</text><text x="155.0" y="303.6" font-size="9.5" font-weight="400" fill="#172b3a" text-anchor="middle">personal locks on box</text><text x="427.0" y="290.8" font-size="11.5" font-weight="700" fill="#334155" text-anchor="middle">7 Work</text><text x="427.0" y="303.6" font-size="9.5" font-weight="400" fill="#172b3a" text-anchor="middle">permit at work face</text><text x="699.0" y="290.8" font-size="11.5" font-weight="700" fill="#334155" text-anchor="middle">8 Suspend if needed</text><text x="699.0" y="303.6" font-size="9.5" font-weight="400" fill="#172b3a" text-anchor="middle">issuer re-checks</text><text x="971.0" y="290.8" font-size="11.5" font-weight="700" fill="#334155" text-anchor="middle">9 Hand back</text><text x="971.0" y="303.6" font-size="9.5" font-weight="400" fill="#172b3a" text-anchor="middle">locks removed</text><text x="1243.0" y="290.8" font-size="11.5" font-weight="700" fill="#334155" text-anchor="middle">10 Cancel</text><text x="1243.0" y="303.6" font-size="9.5" font-weight="400" fill="#172b3a" text-anchor="middle">issuer inspects</text><text x="45.0" y="395.0" font-size="11" font-weight="700" fill="#172b3a" text-anchor="start">Step</text><text x="219.1" y="395.0" font-size="11" font-weight="700" fill="#172b3a" text-anchor="start">Owner</text><text x="436.6" y="395.0" font-size="11" font-weight="700" fill="#172b3a" text-anchor="start">Time limit</text><text x="755.8" y="395.0" font-size="11" font-weight="700" fill="#172b3a" text-anchor="start">Record</text><text x="987.9" y="395.0" font-size="11" font-weight="700" fill="#172b3a" text-anchor="start">Blocks the next step when</text><text x="45.0" y="417.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">1 Request</text><text x="219.1" y="417.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">permit receiver</text><text x="436.6" y="417.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">2 working days before (5 for HV switching)</text><text x="755.8" y="417.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">permit request</text><text x="987.9" y="417.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">method statement or risk assessment missing</text><text x="45.0" y="439.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">2 Conflict check</text><text x="219.1" y="439.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">PTW coordinator</text><text x="436.6" y="439.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">1 working day</text><text x="755.8" y="439.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">permit register entry</text><text x="987.9" y="439.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">conflict with a live zone or another permit</text><text x="45.0" y="461.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">4 Isolate</text><text x="219.1" y="461.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">isolating authority</text><text x="436.6" y="461.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">switching programme window</text><text x="755.8" y="461.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">isolation certificate</text><text x="987.9" y="461.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">proving-dead grid incomplete</text><text x="45.0" y="483.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">5 Issue</text><text x="219.1" y="483.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">permit issuer and receiver</text><text x="436.6" y="483.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">15 to 30 min walk-down</text><text x="755.8" y="483.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">signed permit</text><text x="987.9" y="483.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">any precaution not in place</text><text x="45.0" y="505.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">9 Hand back</text><text x="219.1" y="505.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">permit receiver</text><text x="436.6" y="505.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">before validity end</text><text x="755.8" y="505.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">hand-back signature</text><text x="987.9" y="505.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">a personal lock remains on the box</text><text x="45.0" y="527.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">10 Cancel</text><text x="219.1" y="527.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">permit issuer</text><text x="436.6" y="527.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">same shift</text><text x="755.8" y="527.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">cancellation signature</text><text x="987.9" y="527.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">area not inspected</text><text x="24.0" y="30.0" font-size="17" font-weight="700" fill="#172b3a" text-anchor="start">F10-1  Permit-to-work life cycle on a data-centre campus: request to cancellation</text><text x="24.0" y="48.0" font-size="11" font-weight="400" fill="#5b6b78" text-anchor="start">request ≥ 2 working days before (≥ 5 for HV) · conflict check within 1 working day · walk-down 15 to 30 min · validity one shift · isolation removed only after cancellation</text><text x="32.0" y="570.0" font-size="10" font-weight="700" fill="#2d6a4f" text-anchor="start">WHAT TO PROVE</text><text x="32.0" y="586.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">• The isolation certificate is signed in step 4 before the permit is issued in step 5, and it is removed only after step 10.</text><text x="32.0" y="601.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">• A permit open after its validity end is counted as overdue; the target is 0 per week (10.1.7).</text><text x="24.0" y="636.0" font-size="10" font-weight="700" fill="#5b6b78" text-anchor="start">LEGEND</text><line x1="24" y1="658.0" x2="50" y2="658.0" stroke="#475569" stroke-width="3"/><text x="56.0" y="662.0" font-size="10" font-weight="400" fill="#172b3a" text-anchor="start">signal / control</text><line x1="151.9671875" y1="658.0" x2="177.9671875" y2="658.0" stroke="#334155" stroke-width="3"/><text x="184.0" y="662.0" font-size="10" font-weight="400" fill="#172b3a" text-anchor="start">data / network</text><rect x="24" y="676.0" width="1352" height="44" rx="0" fill="#f6f8fa" fill-opacity="1" stroke="#5b6b78" stroke-width="1"/><text x="32.0" y="690.0" font-size="11" font-weight="700" fill="#172b3a" text-anchor="start">F10-1  ·  Permit-to-work life cycle on a data-centre campus: request to cancellation</text><text x="1368.0" y="690.0" font-size="10" font-weight="400" fill="#5b6b78" text-anchor="end">Chapter 10 · §10.1</text><text x="32.0" y="703.0" font-size="9" font-weight="400" fill="#5b6b78" text-anchor="start">Data Centre Commissioning Field Manual R01 EN · October 2026 · educational reference, not to scale · project and OEM documents govern</text><text x="32.0" y="715.0" font-size="9" font-weight="400" fill="#5b6b78" text-anchor="start">Symbols: QElectroTech EN 60617 and P&amp;ID collections, CC-BY 3.0, native geometry · instrument bubbles per ISA 5.1 · states per IEC 60617 / IEEE C37.2 practice</text></svg>