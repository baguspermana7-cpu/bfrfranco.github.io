t-size="11.5" font-weight="400" fill="#172b3a" text-anchor="start">Engineer&#x27;s rep.</text><text x="430.8" y="308.6" font-size="11.5" font-weight="400" fill="#172b3a" text-anchor="start">raised 8 Sep</text><text x="648.4" y="308.6" font-size="11.5" font-weight="400" fill="#172b3a" text-anchor="start">same day</text><text x="806.7" y="308.6" font-size="11.5" font-weight="400" fill="#172b3a" text-anchor="start">0 WD</text><text x="895.8" y="308.6" font-size="11.5" font-weight="400" fill="#172b3a" text-anchor="start">met</text><text x="45.0" y="331.6" font-size="11.5" font-weight="400" fill="#172b3a" text-anchor="start">1 Containment</text><text x="242.8" y="331.6" font-size="11.5" font-weight="400" fill="#172b3a" text-anchor="start">ES-02</text><text x="430.8" y="331.6" font-size="11.5" font-weight="400" fill="#172b3a" text-anchor="start">run locked out 8 Sep</text><text x="648.4" y="331.6" font-size="11.5" font-weight="400" fill="#172b3a" text-anchor="start">1 WD</text><text x="806.7" y="331.6" font-size="11.5" font-weight="400" fill="#172b3a" text-anchor="start">0 WD</text><text x="895.8" y="331.6" font-size="11.5" font-weight="400" fill="#172b3a" text-anchor="start">met</text><text x="45.0" y="354.6" font-size="11.5" font-weight="400" fill="#172b3a" text-anchor="start">2 Proposal</text><text x="242.8" y="354.6" font-size="11.5" font-weight="400" fill="#172b3a" text-anchor="start">ES-02 QC eng.</text><text x="430.8" y="354.6" font-size="11.5" font-weight="400" fill="#172b3a" text-anchor="start">proposed 9 Sep</text><text x="648.4" y="354.6" font-size="11.5" font-weight="400" fill="#172b3a" text-anchor="start">3 WD</text><text x="806.7" y="354.6" font-size="11.5" font-weight="400" fill="#172b3a" text-anchor="start">1 WD</text><text x="895.8" y="354.6" font-size="11.5" font-weight="400" fill="#172b3a" text-anchor="start">met</text><text x="45.0" y="377.6" font-size="11.5" font-weight="400" fill="#172b3a" text-anchor="start">2 Approval</text><text x="242.8" y="377.6" font-size="11.5" font-weight="400" fill="#172b3a" text-anchor="start">Engineer&#x27;s rep.</text><text x="430.8" y="377.6" font-size="11.5" font-weight="400" fill="#172b3a" text-anchor="start">approved 10 Sep</text><text x="648.4" y="377.6" font-size="11.5" font-weight="400" fill="#172b3a" text-anchor="start">3 WD</text><text x="806.7" y="377.6" font-size="11.5" font-weight="400" fill="#172b3a" text-anchor="start">1 WD</text><text x="895.8" y="377.6" font-size="11.5" font-weight="400" fill="#172b3a" text-anchor="start">met</text><text x="45.0" y="400.6" font-size="11.5" font-weight="400" fill="#172b3a" text-anchor="start">3 Correction</text><text x="242.8" y="400.6" font-size="11.5" font-weight="400" fill="#172b3a" text-anchor="start">ES-02</text><text x="430.8" y="400.6" font-size="11.5" font-weight="400" fill="#172b3a" text-anchor="start">corrected 11 Sep</text><text x="648.4" y="400.6" font-size="11.5" font-weight="400" fill="#172b3a" text-anchor="start">10 WD (major)</text><text x="806.7" y="400.6" font-size="11.5" font-weight="400" fill="#172b3a" text-anchor="start">1 WD</text><text x="895.8" y="400.6" font-size="11.5" font-weight="400" fill="#172b3a" text-anchor="start">met</text><text x="45.0" y="423.6" font-size="11.5" font-weight="400" fill="#172b3a" text-anchor="start">3 Verification</text><text x="242.8" y="423.6" font-size="11.5" font-weight="400" fill="#172b3a" text-anchor="start">inspector</text><text x="430.8" y="423.6" font-size="11.5" font-weight="400" fill="#172b3a" text-anchor="start">IR-0711-R1; retests</text><text x="648.4" y="423.6" font-size="11.5" font-weight="400" fill="#172b3a" text-anchor="start">before closure</text><text x="806.7" y="423.6" font-size="11.5" font-weight="400" fill="#172b3a" text-anchor="start">5 WD</text><text x="895.8" y="423.6" font-size="11.5" font-weight="400" fill="#172b3a" text-anchor="start">met</text><text x="45.0" y="446.6" font-size="11.5" font-weight="400" fill="#172b3a" text-anchor="start">4 Closure</text><text x="242.8" y="446.6" font-size="11.5" font-weight="400" fill="#172b3a" text-anchor="start">GC-A QA/QC, Eng.</text><text x="430.8" y="446.6" font-size="11.5" font-weight="400" fill="#172b3a" text-anchor="start">closed 16 Sep</text><text x="648.4" y="446.6" font-size="11.5" font-weight="400" fill="#172b3a" text-anchor="start">15 WD (KPI)</text><text x="806.7" y="446.6" font-size="11.5" font-weight="400" fill="#172b3a" text-anchor="start">6 WD</text><text x="895.8" y="446.6" font-size="11.5" font-weight="400" fill="#172b3a" text-anchor="start">met</text><text x="40.0" y="500.0" font-size="11.5" font-weight="400" fill="#172b3a" text-anchor="start">WD = working days counted from the date raised, Monday to Friday. Major NCR: containment within 1 WD, proposal within 3 WD, review within 3 WD,</text><text x="40.0" y="515.5" font-size="11.5" font-weight="400" fill="#172b3a" text-anchor="start">correction within 10 WD; median closure KPI not more than 15 WD (09.11.1).</text><text x="40.0" y="531.0" font-size="11.5" font-weight="400" fill="#172b3a" text-anchor="start">Retests filed before closure: insulation resistance of run B2-DH2-BW-03 above 2,000 MΩ on every phase; thermographic scan at the 1.5 MW load bank test on</text><text x="40.0" y="546.6" font-size="11.5" font-weight="400" fill="#172b3a" text-anchor="start">15 Sep, joint difference 0.8 K.</text><text x="24.0" y="30.0" font-size="17" font-weight="700" fill="#172b3a" text-anchor="start">F09-6  The four parts of the NCR form, filled for NCR-B2-ELE-0044</text><text x="24.0" y="48.0" font-size="11" font-weight="400" fill="#5b6b78" text-anchor="start">major, workmanship · 9 of 48 joints below torque · raised 8 Sep 2026, closed 16 Sep 2026 · 6 working days (KPI 15)</text><text x="32.0" y="585.3" font-size="10" font-weight="700" fill="#2d6a4f" text-anchor="start">WHAT TO PROVE</text><text x="32.0" y="601.3" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">• The subcontractor proposes the disposition (part 2) and the Engineer approves it; the finder fills part 1 only.</text><text x="32.0" y="616.3" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">• NCR-B2-ELE-0044 used 1 working day for the proposal, 1 for the approval, 1 for the correction and 6 in total, inside every limit.</text><text x="32.0" y="631.3" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">• The retests (insulation resistance above 2,000 MΩ and the thermographic scan on 15 Sep) are filed before the closure signature.</text><text x="24.0" y="666.3" font-size="10" font-weight="700" fill="#5b6b78" text-anchor="start">LEGEND</text><line x1="24" y1="688.3349999999999" x2="50" y2="688.3349999999999" stroke="#475569" stroke-width="3"/><text x="56.0" y="692.3" font-size="10" font-weight="400" fill="#172b3a" text-anchor="start">signal / control</text><rect x="24" y="706.3349999999999" width="952" height="44" rx="0" fill="#f6f8fa" fill-opacity="1" stroke="#5b6b78" stroke-width="1"/><text x="32.0" y="720.3" font-size="11" font-weight="700" fill="#172b3a" text-anchor="start">F09-6  ·  The four parts of the NCR form, filled for NCR-B2-ELE-0044</text><text x="968.0" y="720.3" font-size="10" font-weight="400" fill="#5b6b78" text-anchor="end">Chapter 09 · §09.3</text><text x="32.0" y="733.3" font-size="9" font-weight="400" fill="#5b6b78" text-anchor="start">Data Centre Commissioning Field Manual R01 EN · October 2026 · educational reference, not to scale · project and OEM documents govern</text><text x="32.0" y="745.3" font-size="9" font-weight="400" fill="#5b6b78" text-anchor="start">Symbols: QElectroTech EN 60617 and P&amp;ID collections, CC-BY 3.0, native geometry · instrument bubbles per ISA 5.1 · states per IEC 60617 / IEEE C37.2 practice</text></svg>