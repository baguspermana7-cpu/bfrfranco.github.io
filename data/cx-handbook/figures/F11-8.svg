mary.</text><text x="32.0" y="723.9" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">• The category A count closes at 1 + 2 − 3 = 0, and the L3 first-pass yield of 84.6 % is below the 90 % target.</text><text x="24.0" y="758.9" font-size="10" font-weight="700" fill="#5b6b78" text-anchor="start">LEGEND</text><line x1="24" y1="780.88" x2="50" y2="780.88" stroke="#475569" stroke-width="3"/><text x="56.0" y="784.9" font-size="10" font-weight="400" fill="#172b3a" text-anchor="start">signal / control</text><rect x="24" y="798.88" width="952" height="44" rx="0" fill="#f6f8fa" fill-opacity="1" stroke="#5b6b78" stroke-width="1"/><text x="32.0" y="812.9" font-size="11" font-weight="700" fill="#172b3a" text-anchor="start">F11-8  ·  Weekly report checks before issue: B1-DH2, week 45, cut-off 6 Nov 2026 12:00</text><text x="968.0" y="812.9" font-size="10" font-weight="400" fill="#5b6b78" text-anchor="end">Chapter 11 · §11.6.4</text><text x="32.0" y="825.9" font-size="9" font-weight="400" fill="#5b6b78" text-anchor="start">Data Centre Commissioning Field Manual R01 EN · October 2026 · educational reference, not to scale · project and OEM documents govern</text><text x="32.0" y="837.9" font-size="9" font-weight="400" fill="#5b6b78" text-anchor="start">Symbols: QElectroTech EN 60617 and P&amp;ID collections, CC-BY 3.0, native geometry · instrument bubbles per ISA 5.1 · states per IEC 60617 / IEEE C37.2 practice</text></svg>