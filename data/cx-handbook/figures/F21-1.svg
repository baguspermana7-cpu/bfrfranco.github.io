nejoin="round"/><polyline points="400.0,546.0 400.0,558.0 945.0,558.0 945.0,546.0" fill="none" stroke="#334155" stroke-width="1.6" stroke-linejoin="round"/><polyline points="675.0,558.0 675.0,546.0" fill="none" stroke="#334155" stroke-width="1.6" stroke-linejoin="round"/><circle cx="675.0" cy="558.0" r="3.6" fill="#334155"/><polyline points="475.0,366.0 475.0,396.0 1220.0,396.0 1220.0,462.0" fill="none" stroke="#475569" stroke-width="1.6" stroke-linejoin="round" stroke-dasharray="7 5"/><polyline points="95.0,366.0 95.0,448.0 40.0,448.0 40.0,670.0 60.0,670.0" fill="none" stroke="#475569" stroke-width="1.6" stroke-linejoin="round" stroke-dasharray="7 5"/><polyline points="1220.0,546.0 1220.0,632.0" fill="none" stroke="#475569" stroke-width="1.6" stroke-linejoin="round"/><polyline points="1005.0,546.0 1005.0,590.0 930.0,590.0 930.0,632.0" fill="none" stroke="#475569" stroke-width="1.6" stroke-linejoin="round"/><polyline points="225.0,366.0 225.0,448.0 530.0,448.0 530.0,632.0" fill="none" stroke="#475569" stroke-width="1.6" stroke-linejoin="round" stroke-dasharray="7 5"/><rect x="60" y="122" width="250" height="84" rx="4" fill="#ffffff" fill-opacity="1" stroke="#334155" stroke-width="1.6"/><rect x="360" y="122" width="230" height="84" rx="4" fill="#ffffff" fill-opacity="1" stroke="#334155" stroke-width="1.6"/><rect x="640" y="122" width="230" height="84" rx="4" fill="#ffffff" fill-opacity="1" stroke="#334155" stroke-width="1.6"/><rect x="1090" y="122" width="250" height="84" rx="4" fill="#ffffff" fill-opacity="1" stroke="#b91c1c" stroke-width="1.6"/><rect x="60" y="282" width="250" height="84" rx="4" fill="#ffffff" fill-opacity="1" stroke="#475569" stroke-width="1.6"/><rect x="360" y="282" width="230" height="84" rx="4" fill="#ffffff" fill-opacity="1" stroke="#475569" stroke-width="1.6"/><rect x="640" y="282" width="230" height="84" rx="4" fill="#ffffff" fill-opacity="1" stroke="#475569" stroke-width="1.6"/><rect x="1090" y="282" width="250" height="84" rx="4" fill="#ffffff" fill-opacity="1" stroke="#334155" stroke-width="1.6"/><rect x="60" y="462" width="200" height="84" rx="4" fill="#ffffff" fill-opacity="1" stroke="#334155" stroke-width="1.6"/><rect x="300" y="462" width="200" height="84" rx="4" fill="#ffffff" fill-opacity="1" stroke="#334155" stroke-width="1.6"/><rect x="560" y="462" width="230" height="84" rx="4" fill="#ffffff" fill-opacity="1" stroke="#334155" stroke-width="1.6"/><rect x="830" y="462" width="230" height="84" rx="4" fill="#ffffff" fill-opacity="1" stroke="#334155" stroke-width="1.6"/><rect x="1100" y="462" width="240" height="84" rx="4" fill="#ffffff" fill-opacity="1" stroke="#334155" stroke-width="1.6"/><rect x="60" y="632" width="280" height="74" rx="4" fill="#ffffff" fill-opacity="1" stroke="#475569" stroke-width="1.6"/><rect x="390" y="632" width="280" height="74" rx="4" fill="#ffffff" fill-opacity="1" stroke="#475569" stroke-width="1.6"/><rect x="720" y="632" width="300" height="74" rx="4" fill="#ffffff" fill-opacity="1" stroke="#475569" stroke-width="1.6"/><rect x="1070" y="632" width="270" height="74" rx="4" fill="#ffffff" fill-opacity="1" stroke="#475569" stroke-width="1.6"/><text x="185.0" y="148.9" font-size="12" font-weight="700" fill="#334155" text-anchor="middle">BMS server cluster</text><text x="185.0" y="162.4" font-size="10" font-weight="400" fill="#172b3a" text-anchor="middle">two hosts, virtual machines</text><text x="185.0" y="175.9" font-size="10" font-weight="400" fill="#172b3a" text-anchor="middle">alarms, graphics, history</text><text x="475.0" y="148.9" font-size="12" font-weight="700" fill="#334155" text-anchor="middle">Historian</text><text x="475.0" y="162.4" font-size="10" font-weight="400" fill="#172b3a" text-anchor="middle">13 months online</text><text x="475.0" y="175.9" font-size="10" font-weight="400" fill="#172b3a" text-anchor="middle">about 24 GB per hall</text><text x="755.0" y="148.9" font-size="12" font-weight="700" fill="#334155" text-anchor="middle">Operator workstations</text><text x="755.0" y="162.4" font-size="10" font-weight="400" fill="#172b3a" text-anchor="middle">building control room</text><text x="755.0" y="175.9" font-size="10" font-weight="400" fill="#172b3a" text-anchor="middle">web clients</text><text x="1215.0" y="155.7" font-size="12" font-weight="700" fill="#b91c1c" text-anchor="middle">Campus operations centre</text><text x="1215.0" y="169.2" font-size="10" font-weight="400" fill="#172b3a" text-anchor="middle">BACnet/SC through firewall</text><text x="185.0" y="308.9" font-size="12" font-weight="700" fill="#475569" text-anchor="middle">Automation server DH3</text><text x="185.0" y="322.4" font-size="10" font-weight="400" fill="#172b3a" text-anchor="middle">B-BC profile</text><text x="185.0" y="335.9" font-size="10" font-weight="400" fill="#172b3a" text-anchor="middle">MS/TP router, BBMD</text><text x="475.0" y="308.9" font-size="12" font-weight="700" fill="#475569" text-anchor="middle">Modbus gateway DH3</text><text x="475.0" y="322.4" font-size="10" font-weight="400" fill="#172b3a" text-anchor="middle">Modbus RTU to BACnet</text><text x="475.0" y="335.9" font-size="10" font-weight="400" fill="#172b3a" text-anchor="middle">leak panels</text><text x="755.0" y="308.9" font-size="12" font-weight="700" fill="#475569" text-anchor="middle">Plant controller pair</text><text x="755.0" y="322.4" font-size="10" font-weight="400" fill="#172b3a" text-anchor="middle">FWS pumps, dry coolers</text><text x="755.0" y="335.9" font-size="10" font-weight="400" fill="#172b3a" text-anchor="middle">supplies A and B</text><text x="1215.0" y="308.9" font-size="12" font-weight="700" fill="#334155" text-anchor="middle">Building OT core switches</text><text x="1215.0" y="322.4" font-size="10" font-weight="400" fill="#172b3a" text-anchor="middle">ring, two switches</text><text x="1215.0" y="335.9" font-size="10" font-weight="400" fill="#172b3a" text-anchor="middle">BMS VLANs</text><text x="160.0" y="495.7" font-size="12" font-weight="700" fill="#334155" text-anchor="middle">Hall switch A</text><text x="160.0" y="509.2" font-size="10" font-weight="400" fill="#172b3a" text-anchor="middle">odd-numbered units</text><text x="400.0" y="495.7" font-size="12" font-weight="700" fill="#334155" text-anchor="middle">Hall switch B</text><text x="400.0" y="509.2" font-size="10" font-weight="400" fill="#172b3a" text-anchor="middle">even-numbered units</text><text x="675.0" y="488.9" font-size="12" font-weight="700" fill="#334155" text-anchor="middle">CDU controllers × 16</text><text x="675.0" y="502.4" font-size="10" font-weight="400" fill="#172b3a" text-anchor="middle">Modbus TCP, port 502</text><text x="675.0" y="515.9" font-size="10" font-weight="400" fill="#172b3a" text-anchor="middle">30 points each</text><text x="945.0" y="488.9" font-size="12" font-weight="700" fill="#334155" text-anchor="middle">CRAH controllers × 13</text><text x="945.0" y="502.4" font-size="10" font-weight="400" fill="#172b3a" text-anchor="middle">BACnet/IP, UDP 47808</text><text x="945.0" y="515.9" font-size="10" font-weight="400" fill="#172b3a" text-anchor="middle">40 points each</text><text x="1220.0" y="488.9" font-size="12" font-weight="700" fill="#334155" text-anchor="middle">Leak panels × 8</text><text x="1220.0" y="502.4" font-size="10" font-weight="400" fill="#172b3a" text-anchor="middle">Modbus RTU, 19,200 bit/s</text><text x="1220.0" y="515.9" font-size="10" font-weight="400" fill="#172b3a" text-anchor="middle">32 zones</text><text x="200.0" y="660.6" font-size="12" font-weight="700" fill="#475569" text-anchor="middle">Rack-row sensors × 50</text><text x="200.0" y="674.1" font-size="10" font-weight="400" fill="#172b3a" text-anchor="middle">4 MS/TP trunks, 38,400 bit/s</text><text x="530.0" y="660.6" font-size="12" font-weight="700" fill="#475569" text-anchor="middle">Hardwired I/O</text><text x="530.0" y="674.1" font-size="10" font-weight="400" fill="#172b3a" text-anchor="middle">hall pressure, doors, valves</text><text x="870.0" y="660.6" font-size="12" font-weight="700" fill="#475569" text-anchor="middle">Sensors and actuators in units</text><text x="870.0" y="674.1" font-size="10" font-weight="400" fill="#172b3a" text-anchor="middle">wired to the unit controllers</text><text x="1205.0" y="660.6" font-size="12" font-weight="700" fill="#475569" text-anchor="middle">Leak sensing cables</text><text x="1205.0" y="674.1" font-size="10" font-weight="400" fill="#172b3a" text-anchor="middle">wired to leak panels</text><text x="40.0" y="760.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">Solid lines: Ethernet (BACnet/IP, Modbus TCP, OPC UA). Dashed lines: RS-485 trunks and hardwired I/O. The dashed red line to the campus operations centre is BACnet/SC through the building firewall.</text><text x="40.0" y="774.9" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">A CDU or CRAH keeps its last valid setpoint when the link to the automation server is lost; the automation server keeps schedules and buffers alarms when the BMS server is lost.</text><path d="M218.0 414 A7 7 0 0 1 232.0 414" fill="none" stroke="#ffffff" stroke-width="7"/><path d="M218.0 414 A7 7 0 0 1 232.0 414" fill="none" stroke="#172b3a" stroke-width="2"/><path d="M523.0 558 A7 7 0 0 1 537.0 558" fill="none" stroke="#ffffff" stroke-width="7"/><path d="M523.0 558 A7 7 0 0 1 537.0 558" fill="none" stroke="#172b3a" stroke-width="2"/><path d="M1208.0 396 A7 7 0 0 1 1222.0 396" fill="none" stroke="#ffffff" stroke-width="7"/><path d="M1208.0 396 A7 7 0 0 1 1222.0 396" fill="none" stroke="#172b3a" stroke-width="2"/><path d="M393.0 448 A7 7 0 0 1 407.0 448" fill="none" stroke="#ffffff" stroke-width="7"/><path d="M393.0 448 A7 7 0 0 1 407.0 448" fill="none" stroke="#172b3a" stroke-width="2"/><text x="24.0" y="30.0" font-size="17" font-weight="700" fill="#172b3a" text-anchor="start">F21-1  BMS architecture of one MSC-1 building in four layers</text><text x="24.0" y="48.0" font-size="11" font-weight="400" fill="#5b6b78" text-anchor="start">Building 2 · 3 halls · per hall 16 CDUs, 13 CRAHs, 50 rack-row sensors, 32 leak zones · about 1,480 points per hall · each layer keeps running when the layer above is lost</text><text x="32.0" y="813.5" font-size="10" font-weight="700" fill="#2d6a4f" text-anchor="start">WHAT TO PROVE</text><text x="32.0" y="829.5" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">• Redundant CDUs are split between hall switch A (odd numbers) and switch B (even numbers), so loss of one switch leaves two supervised CDUs in every zone.</text><text x="32.0" y="844.5" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">• The rack-row sensors use BACnet MS/TP trunks under the automation server; the leak panels use Modbus RTU through a gateway; the CDUs use Modbus TCP and the CRAHs BACnet/IP.</text><text x="24.0" y="879.5" font-size="10" font-weight="700" fill="#5b6b78" text-anchor="start">LEGEND</text><line x1="24" y1="901.49" x2="50" y2="901.49" stroke="#334155" stroke-width="3"/><text x="56.0" y="905.5" font-size="10" font-weight="400" fill="#172b3a" text-anchor="start">data / network</text><line x1="150.859375" y1="901.49" x2="176.859375" y2="901.49" stroke="#475569" stroke-width="3"/><text x="182.9" y="905.5" font-size="10" font-weight="400" fill="#172b3a" text-anchor="start">signal / control</text><line x1="278.8265625" y1="901.49" x2="304.8265625" y2="901.49" stroke="#b91c1c" stroke-width="3"/><text x="310.8" y="905.5" font-size="10" font-weight="400" fill="#172b3a" text-anchor="start">trip / protection</text><rect x="24" y="919.49" width="1352" height="44" rx="0" fill="#f6f8fa" fill-opacity="1" stroke="#5b6b78" stroke-width="1"/><text x="32.0" y="933.5" font-size="11" font-weight="700" fill="#172b3a" text-anchor="start">F21-1  ·  BMS architecture of one MSC-1 building in four layers</text><text x="1368.0" y="933.5" font-size="10" font-weight="400" fill="#5b6b78" text-anchor="end">Chapter 21 · §21.1</text><text x="32.0" y="946.5" font-size="9" font-weight="400" fill="#5b6b78" text-anchor="start">Data Centre Commissioning Field Manual R01 EN · October 2026 · educational reference, not to scale · project and OEM documents govern</text><text x="32.0" y="958.5" font-size="9" font-weight="400" fill="#5b6b78" text-anchor="start">Symbols: QElectroTech EN 60617 and P&amp;ID collections, CC-BY 3.0, native geometry · instrument bubbles per ISA 5.1 · states per IEC 60617 / IEEE C37.2 practice</text></svg>