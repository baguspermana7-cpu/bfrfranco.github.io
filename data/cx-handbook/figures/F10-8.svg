font-size="10" font-weight="400" fill="#172b3a" text-anchor="middle">at the switch room door</text><text x="372.0" y="238.0" font-size="10.5" font-weight="400" fill="#172b3a" text-anchor="start">keys into</text><text x="372.0" y="252.0" font-size="10.5" font-weight="400" fill="#172b3a" text-anchor="start">the box</text><text x="835.0" y="171.9" font-size="12" font-weight="700" fill="#475569" text-anchor="middle">PTW-B2-E-0901</text><text x="835.0" y="185.4" font-size="10" font-weight="400" fill="#172b3a" text-anchor="middle">work party of 4</text><text x="835.0" y="198.9" font-size="10" font-weight="400" fill="#172b3a" text-anchor="middle">4 personal locks</text><text x="835.0" y="421.9" font-size="12" font-weight="700" fill="#475569" text-anchor="middle">PTW-B2-E-0902</text><text x="835.0" y="435.4" font-size="10" font-weight="400" fill="#172b3a" text-anchor="middle">work party of 3</text><text x="835.0" y="448.9" font-size="10" font-weight="400" fill="#172b3a" text-anchor="middle">3 personal locks</text><text x="520.0" y="491.8" font-size="11.5" font-weight="700" fill="#334155" text-anchor="middle">Key safe KS-B2-07</text><text x="520.0" y="504.6" font-size="9.5" font-weight="400" fill="#172b3a" text-anchor="middle">keys between shifts</text><text x="55.0" y="575.6" font-size="11.5" font-weight="700" fill="#172b3a" text-anchor="start">Order</text><text x="129.1" y="575.6" font-size="11.5" font-weight="700" fill="#172b3a" text-anchor="start">Action</text><text x="573.8" y="575.6" font-size="11.5" font-weight="700" fill="#172b3a" text-anchor="start">By</text><text x="775.0" y="575.6" font-size="11.5" font-weight="700" fill="#172b3a" text-anchor="start">Record</text><text x="55.0" y="598.6" font-size="11.5" font-weight="400" fill="#172b3a" text-anchor="start">1</text><text x="129.1" y="598.6" font-size="11.5" font-weight="400" fill="#172b3a" text-anchor="start">Apply 6 safety locks, keys into GLB-B2-03</text><text x="573.8" y="598.6" font-size="11.5" font-weight="400" fill="#172b3a" text-anchor="start">isolating authority</text><text x="775.0" y="598.6" font-size="11.5" font-weight="400" fill="#172b3a" text-anchor="start">lock register</text><text x="55.0" y="621.6" font-size="11.5" font-weight="400" fill="#172b3a" text-anchor="start">2</text><text x="129.1" y="621.6" font-size="11.5" font-weight="400" fill="#172b3a" text-anchor="start">Apply one personal lock per worker</text><text x="573.8" y="621.6" font-size="11.5" font-weight="400" fill="#172b3a" text-anchor="start">each worker</text><text x="775.0" y="621.6" font-size="11.5" font-weight="400" fill="#172b3a" text-anchor="start">permit briefing</text><text x="55.0" y="644.6" font-size="11.5" font-weight="400" fill="#172b3a" text-anchor="start">3</text><text x="129.1" y="644.6" font-size="11.5" font-weight="400" fill="#172b3a" text-anchor="start">Shift change: on-coming locks on, then off-going off</text><text x="573.8" y="644.6" font-size="11.5" font-weight="400" fill="#172b3a" text-anchor="start">both receivers</text><text x="775.0" y="644.6" font-size="11.5" font-weight="400" fill="#172b3a" text-anchor="start">handover section</text><text x="55.0" y="667.6" font-size="11.5" font-weight="400" fill="#172b3a" text-anchor="start">4</text><text x="129.1" y="667.6" font-size="11.5" font-weight="400" fill="#172b3a" text-anchor="start">Remove personal locks at hand-back</text><text x="573.8" y="667.6" font-size="11.5" font-weight="400" fill="#172b3a" text-anchor="start">each worker</text><text x="775.0" y="667.6" font-size="11.5" font-weight="400" fill="#172b3a" text-anchor="start">permit hand-back</text><text x="55.0" y="690.6" font-size="11.5" font-weight="400" fill="#172b3a" text-anchor="start">5</text><text x="129.1" y="690.6" font-size="11.5" font-weight="400" fill="#172b3a" text-anchor="start">Cancel both permits</text><text x="573.8" y="690.6" font-size="11.5" font-weight="400" fill="#172b3a" text-anchor="start">permit issuer</text><text x="775.0" y="690.6" font-size="11.5" font-weight="400" fill="#172b3a" text-anchor="start">permit register</text><text x="55.0" y="713.6" font-size="11.5" font-weight="400" fill="#172b3a" text-anchor="start">6</text><text x="129.1" y="713.6" font-size="11.5" font-weight="400" fill="#172b3a" text-anchor="start">Remove safety locks, close certificate</text><text x="573.8" y="713.6" font-size="11.5" font-weight="400" fill="#172b3a" text-anchor="start">isolating authority</text><text x="775.0" y="713.6" font-size="11.5" font-weight="400" fill="#172b3a" text-anchor="start">IC-B2-LV-0388</text><text x="24.0" y="30.0" font-size="17" font-weight="700" fill="#172b3a" text-anchor="start">F10-8  Group lockout for isolation certificate IC-B2-LV-0388 (UPS B2-DH3-UPS-A1)</text><text x="24.0" y="48.0" font-size="11" font-weight="400" fill="#5b6b78" text-anchor="start">6 safety locks L-0412 to L-0417 · 6 keys in group lock box GLB-B2-03 · 2 permits, 7 personal locks (example) · keys in key safe KS-B2-07 between shifts</text><text x="32.0" y="757.0" font-size="10" font-weight="700" fill="#2d6a4f" text-anchor="start">WHAT TO PROVE</text><text x="32.0" y="773.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">• The six isolation points of IC-B2-LV-0388 each carry one red safety lock, and the six keys are inside GLB-B2-03.</text><text x="32.0" y="788.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">• The isolating authority removes the safety locks only after all 7 personal locks are off and both permits PTW-B2-E-0901 and PTW-B2-E-0902 are cancelled.</text><text x="24.0" y="823.0" font-size="10" font-weight="700" fill="#5b6b78" text-anchor="start">LEGEND</text><line x1="24" y1="845.0" x2="50" y2="845.0" stroke="#1d4ed8" stroke-width="3"/><text x="56.0" y="849.0" font-size="10" font-weight="400" fill="#172b3a" text-anchor="start">415 V</text><line x1="107.10625" y1="845.0" x2="133.10625" y2="845.0" stroke="#475569" stroke-width="3"/><text x="139.1" y="849.0" font-size="10" font-weight="400" fill="#172b3a" text-anchor="start">signal / control</text><line x1="235.0734375" y1="845.0" x2="261.0734375" y2="845.0" stroke="#334155" stroke-width="3"/><text x="267.1" y="849.0" font-size="10" font-weight="400" fill="#172b3a" text-anchor="start">data / network</text><rect x="24" y="863.0" width="952" height="44" rx="0" fill="#f6f8fa" fill-opacity="1" stroke="#5b6b78" stroke-width="1"/><text x="32.0" y="877.0" font-size="11" font-weight="700" fill="#172b3a" text-anchor="start">F10-8  ·  Group lockout for isolation certificate IC-B2-LV-0388 (UPS B2-DH3-UPS-A1)</text><text x="968.0" y="877.0" font-size="10" font-weight="400" fill="#5b6b78" text-anchor="end">Chapter 10 · §10.2.6</text><text x="32.0" y="890.0" font-size="9" font-weight="400" fill="#5b6b78" text-anchor="start">Data Centre Commissioning Field Manual R01 EN · October 2026 · educational reference, not to scale · project and OEM documents govern</text><text x="32.0" y="902.0" font-size="9" font-weight="400" fill="#5b6b78" text-anchor="start">Symbols: QElectroTech EN 60617 and P&amp;ID collections, CC-BY 3.0, native geometry · instrument bubbles per ISA 5.1 · states per IEC 60617 / IEEE C37.2 practice</text></svg>