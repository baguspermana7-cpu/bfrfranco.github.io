xt><text x="965.0" y="344.3" font-size="10.5" font-weight="700" fill="#172b3a" text-anchor="start">Test</text><text x="1095.0" y="344.3" font-size="10.5" font-weight="700" fill="#172b3a" text-anchor="start">Expected</text><text x="1245.0" y="344.3" font-size="10.5" font-weight="700" fill="#172b3a" text-anchor="start">Measured</text><text x="965.0" y="365.3" font-size="10.5" font-weight="400" fill="#172b3a" text-anchor="start">L at 6,000 A</text><text x="1095.0" y="365.3" font-size="10.5" font-weight="400" fill="#172b3a" text-anchor="start">32 s (25 to 40 s)</text><text x="1245.0" y="365.3" font-size="10.5" font-weight="400" fill="#172b3a" text-anchor="start">30.8 s</text><text x="965.0" y="386.3" font-size="10.5" font-weight="400" fill="#172b3a" text-anchor="start">S at 12,000 A</text><text x="1095.0" y="386.3" font-size="10.5" font-weight="400" fill="#172b3a" text-anchor="start">0.10 s band</text><text x="1245.0" y="386.3" font-size="10.5" font-weight="400" fill="#172b3a" text-anchor="start">0.09 s</text><text x="965.0" y="407.3" font-size="10.5" font-weight="400" fill="#172b3a" text-anchor="start">G at 1,440 A</text><text x="1095.0" y="407.3" font-size="10.5" font-weight="400" fill="#172b3a" text-anchor="start">0.20 s band</text><text x="1245.0" y="407.3" font-size="10.5" font-weight="400" fill="#172b3a" text-anchor="start">0.21 s</text><text x="965.0" y="428.3" font-size="10.5" font-weight="400" fill="#172b3a" text-anchor="start">Pick-up L</text><text x="1095.0" y="428.3" font-size="10.5" font-weight="400" fill="#172b3a" text-anchor="start">1.05 to 1.20 Ir</text><text x="1245.0" y="428.3" font-size="10.5" font-weight="400" fill="#172b3a" text-anchor="start">1.10 Ir</text><circle cx="472.6" cy="315.4" r="4" fill="#b7791f"/><circle cx="601.3" cy="511.7" r="4" fill="#b7791f"/><circle cx="629.9" cy="474.3" r="4" fill="#b7791f"/><text x="24.0" y="30.0" font-size="17" font-weight="700" fill="#172b3a" text-anchor="start">F14-2  Time-current curves of the main ACB QA1 and feeder ACB QF1 with the LSIG bands and the test points (example settings)</text><text x="24.0" y="48.0" font-size="10" font-weight="400" fill="#5b6b78" text-anchor="start">QA1: Ir 3500 A, tr 16 s at 6 Ir, Isd 4 x Ir = 14,000 A, tsd 0.3 s · QF1: Ir 2000 A, tr 8 s, Isd 5 x Ir = 10,000 A, tsd 0.1 s, Ii 30 kA · band = pick-up and time tolerance from the OEM curve (example ±8 % on L; tsd 0.1 s band 0.08 to 0.14 s, tsd 0.3 s</text><text x="24.0" y="61.0" font-size="10" font-weight="400" fill="#5b6b78" text-anchor="start">band 0.25 to 0.36 s)</text><text x="32.0" y="732.0" font-size="10" font-weight="700" fill="#2d6a4f" text-anchor="start">WHAT TO PROVE</text><text x="32.0" y="748.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">• Long-time test of QF1 at 3 x Ir = 6,000 A: nominal trip time = 8 x (6/3)² = 32 s; the test passes between about 25 and 40 s when the OEM band is used (example).</text><text x="32.0" y="763.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">• At 12 kA the QF1 band ends at about 0.14 s and the QA1 band starts at about 0.25 s: the 0.11 s margin meets the 0.1 s study requirement; above 30 kA the QF1 instantaneous element trips first.</text><rect x="24" y="796" width="1352" height="44" rx="0" fill="#f6f8fa" fill-opacity="1" stroke="#5b6b78" stroke-width="1"/><text x="32.0" y="810.0" font-size="11" font-weight="700" fill="#172b3a" text-anchor="start">F14-2  ·  Time-current curves of the main ACB QA1 and feeder ACB QF1 with the LSIG bands and the test points (example settings)</text><text x="1368.0" y="810.0" font-size="10" font-weight="400" fill="#5b6b78" text-anchor="end">Chapter 14 · §14.6</text><text x="32.0" y="823.0" font-size="9" font-weight="400" fill="#5b6b78" text-anchor="start">Data Centre Commissioning Field Manual R01 EN · October 2026 · educational reference, not to scale · project and OEM documents govern</text><text x="32.0" y="835.0" font-size="9" font-weight="400" fill="#5b6b78" text-anchor="start">Symbols: QElectroTech EN 60617 and P&amp;ID collections, CC-BY 3.0, native geometry · instrument bubbles per ISA 5.1 · states per IEC 60617 / IEEE C37.2 practice</text></svg>