fter 1,786 kW (71.4 %)</text><text x="610.0" y="342.4" font-size="9.5" font-weight="400" fill="#172b3a" text-anchor="middle">change +236 kW</text><text x="842.0" y="303.9" font-size="11.5" font-weight="700" fill="#1d4ed8" text-anchor="middle">Block 8</text><text x="842.0" y="316.8" font-size="9.5" font-weight="400" fill="#172b3a" text-anchor="middle">before 1,571 kW (62.8 %)</text><text x="842.0" y="329.6" font-size="9.5" font-weight="400" fill="#172b3a" text-anchor="middle">after 1,787 kW (71.5 %)</text><text x="842.0" y="342.4" font-size="9.5" font-weight="400" fill="#172b3a" text-anchor="middle">change +216 kW</text><text x="45.0" y="445.0" font-size="11" font-weight="700" fill="#172b3a" text-anchor="start">Quantity</text><text x="340.7" y="445.0" font-size="11" font-weight="700" fill="#172b3a" text-anchor="start">Before</text><text x="505.0" y="445.0" font-size="11" font-weight="700" fill="#172b3a" text-anchor="start">After</text><text x="669.3" y="445.0" font-size="11" font-weight="700" fill="#172b3a" text-anchor="start">Acceptance</text><text x="45.0" y="467.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">Blocks carrying the hall</text><text x="340.7" y="467.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">8</text><text x="505.0" y="467.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">7</text><text x="669.3" y="467.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">7 of 8 (block redundant)</text><text x="45.0" y="489.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">Sum of UPS outputs</text><text x="340.7" y="489.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">12,496 kW</text><text x="505.0" y="489.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">12,496 kW</text><text x="669.3" y="489.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">equal within metering accuracy</text><text x="45.0" y="511.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">Highest block load</text><text x="340.7" y="511.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">63.2 %</text><text x="505.0" y="511.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">72.4 %</text><text x="669.3" y="511.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">≤ 71.4 % + measured margin</text><text x="45.0" y="533.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">Rack power loss</text><text x="340.7" y="533.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">none</text><text x="505.0" y="533.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">none</text><text x="669.3" y="533.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">no rack loses power</text><text x="24.0" y="30.0" font-size="17" font-weight="700" fill="#172b3a" text-anchor="start">F16-7  Loss-of-block test in hall B2-DH3: UPS output of the eight blocks</text><text x="24.0" y="48.0" font-size="10" font-weight="400" fill="#5b6b78" text-anchor="start">block 5 MV breaker opened at 10:12:00 · before: 1,540 to 1,580 kW, average 1,562 kW (62.5 %) · after: 1,760 to 1,810 kW on 7 blocks · highest 72.4 % against 71.4 %</text><text x="24.0" y="61.0" font-size="10" font-weight="400" fill="#5b6b78" text-anchor="start">design</text><text x="32.0" y="576.0" font-size="10" font-weight="700" fill="#2d6a4f" text-anchor="start">WHAT TO PROVE</text><text x="32.0" y="592.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">• The sum of UPS outputs is 12,496 kW before and 12,496 kW after the block is lost.</text><text x="32.0" y="607.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">• The highest block reads 1,810 kW = 72.4 %, one point above 71.4 % because the blocks do not share equally (block 4: 1,580 × 8 / 7 = 1,806 kW).</text><text x="32.0" y="622.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">• No rack PDU reports a power loss; the B-feed PDUs of block 5 read zero current.</text><text x="24.0" y="657.0" font-size="10" font-weight="700" fill="#5b6b78" text-anchor="start">LEGEND</text><line x1="24" y1="679.0" x2="50" y2="679.0" stroke="#1d4ed8" stroke-width="3"/><text x="56.0" y="683.0" font-size="10" font-weight="400" fill="#172b3a" text-anchor="start">415 V</text><line x1="107.10625" y1="679.0" x2="133.10625" y2="679.0" stroke="#b91c1c" stroke-width="3"/><text x="139.1" y="683.0" font-size="10" font-weight="400" fill="#172b3a" text-anchor="start">trip / protection</text><rect x="24" y="697.0" width="952" height="44" rx="0" fill="#f6f8fa" fill-opacity="1" stroke="#5b6b78" stroke-width="1"/><text x="32.0" y="711.0" font-size="11" font-weight="700" fill="#172b3a" text-anchor="start">F16-7  ·  Loss-of-block test in hall B2-DH3: UPS output of the eight blocks</text><text x="968.0" y="711.0" font-size="10" font-weight="400" fill="#5b6b78" text-anchor="end">Chapter 16 · §16.11</text><text x="32.0" y="724.0" font-size="9" font-weight="400" fill="#5b6b78" text-anchor="start">Data Centre Commissioning Field Manual R01 EN · October 2026 · educational reference, not to scale · project and OEM documents govern</text><text x="32.0" y="736.0" font-size="9" font-weight="400" fill="#5b6b78" text-anchor="start">Symbols: QElectroTech EN 60617 and P&amp;ID collections, CC-BY 3.0, native geometry · instrument bubbles per ISA 5.1 · states per IEC 60617 / IEEE C37.2 practice</text></svg>