"#9fb0bb" stroke-width="0.8"/><rect x="40" y="528.0" width="214.88372093023253" height="22.0" rx="0" fill="#ffffff" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><rect x="254.88372093023253" y="528.0" width="276.27906976744185" height="22.0" rx="0" fill="#ffffff" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><rect x="531.1627906976744" y="528.0" width="276.27906976744185" height="22.0" rx="0" fill="#ffffff" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><rect x="807.4418604651162" y="528.0" width="245.58139534883722" height="22.0" rx="0" fill="#ffffff" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><rect x="1053.0232558139535" y="528.0" width="306.9767441860465" height="22.0" rx="0" fill="#ffffff" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><rect x="40" y="550.0" width="214.88372093023253" height="22.0" rx="0" fill="#ffffff" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><rect x="254.88372093023253" y="550.0" width="276.27906976744185" height="22.0" rx="0" fill="#ffffff" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><rect x="531.1627906976744" y="550.0" width="276.27906976744185" height="22.0" rx="0" fill="#ffffff" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><rect x="807.4418604651162" y="550.0" width="245.58139534883722" height="22.0" rx="0" fill="#ffffff" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><rect x="1053.0232558139535" y="550.0" width="306.9767441860465" height="22.0" rx="0" fill="#ffffff" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><text x="126.0" y="152.8" font-size="11.5" font-weight="700" fill="#475569" text-anchor="middle">1 FAT of PME server</text><text x="126.0" y="165.6" font-size="9.5" font-weight="400" fill="#172b3a" text-anchor="middle">L1 · FAT report</text><text x="318.0" y="152.8" font-size="11.5" font-weight="700" fill="#475569" text-anchor="middle">2 Device delivery</text><text x="318.0" y="165.6" font-size="9.5" font-weight="400" fill="#172b3a" text-anchor="middle">L2A · receiving record</text><text x="510.0" y="152.8" font-size="11.5" font-weight="700" fill="#475569" text-anchor="middle">3 Install and wiring</text><text x="510.0" y="165.6" font-size="9.5" font-weight="400" fill="#172b3a" text-anchor="middle">L2 · L2 checklist</text><text x="702.0" y="152.8" font-size="11.5" font-weight="700" fill="#475569" text-anchor="middle">4 Configuration check</text><text x="702.0" y="165.6" font-size="9.5" font-weight="400" fill="#172b3a" text-anchor="middle">L3 · device config record</text><text x="894.0" y="152.8" font-size="11.5" font-weight="700" fill="#475569" text-anchor="middle">5 Wiring diagnostics</text><text x="894.0" y="165.6" font-size="9.5" font-weight="400" fill="#172b3a" text-anchor="middle">L3 · phasor record</text><text x="1086.0" y="152.8" font-size="11.5" font-weight="700" fill="#475569" text-anchor="middle">6 Communications</text><text x="1086.0" y="165.6" font-size="9.5" font-weight="400" fill="#172b3a" text-anchor="middle">L3 · comms record</text><text x="1278.0" y="152.8" font-size="11.5" font-weight="700" fill="#475569" text-anchor="middle">7 Value verification</text><text x="1278.0" y="165.6" font-size="9.5" font-weight="400" fill="#172b3a" text-anchor="middle">L3 · meter verification sheet</text><text x="126.0" y="332.8" font-size="11.5" font-weight="700" fill="#334155" text-anchor="middle">8 Breaker status, trip</text><text x="126.0" y="345.6" font-size="9.5" font-weight="400" fill="#172b3a" text-anchor="middle">L3 · point-to-point sheet</text><text x="318.0" y="332.8" font-size="11.5" font-weight="700" fill="#334155" text-anchor="middle">9 Alarm tests</text><text x="318.0" y="345.6" font-size="9.5" font-weight="400" fill="#172b3a" text-anchor="middle">L4 · alarm test record</text><text x="510.6" y="332.8" font-size="11.5" font-weight="700" fill="#334155" text-anchor="middle">10 SOE timestamp test</text><text x="510.6" y="345.6" font-size="9.5" font-weight="400" fill="#172b3a" text-anchor="middle">L4 · SOE test record</text><text x="715.9" y="332.8" font-size="11.5" font-weight="700" fill="#334155" text-anchor="middle">11 PQ, waveforms, reports</text><text x="715.9" y="345.6" font-size="9.5" font-weight="400" fill="#172b3a" text-anchor="middle">L4 · report check sheet</text><text x="920.8" y="332.8" font-size="11.5" font-weight="700" fill="#334155" text-anchor="middle">12 72 h data run</text><text x="920.8" y="345.6" font-size="9.5" font-weight="400" fill="#172b3a" text-anchor="middle">L4 · completeness record</text><text x="1112.8" y="332.8" font-size="11.5" font-weight="700" fill="#334155" text-anchor="middle">13 Security, backup</text><text x="1112.8" y="345.6" font-size="9.5" font-weight="400" fill="#172b3a" text-anchor="middle">L4 · restore record</text><text x="1304.8" y="332.8" font-size="11.5" font-weight="700" fill="#334155" text-anchor="middle">14 Acceptance</text><text x="1304.8" y="345.6" font-size="9.5" font-weight="400" fill="#172b3a" text-anchor="middle">L5 IST inputs · certificate</text><text x="45.0" y="455.0" font-size="11" font-weight="700" fill="#172b3a" text-anchor="start">Step</text><text x="259.9" y="455.0" font-size="11" font-weight="700" fill="#172b3a" text-anchor="start">Owner</text><text x="536.2" y="455.0" font-size="11" font-weight="700" fill="#172b3a" text-anchor="start">Witness</text><text x="812.4" y="455.0" font-size="11" font-weight="700" fill="#172b3a" text-anchor="start">Typical duration</text><text x="1058.0" y="455.0" font-size="11" font-weight="700" fill="#172b3a" text-anchor="start">Blocks</text><text x="45.0" y="477.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">1 FAT</text><text x="259.9" y="477.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">EPMS contractor</text><text x="536.2" y="477.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">CxA, owner IT security</text><text x="812.4" y="477.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">3 to 5 working days</text><text x="1058.0" y="477.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">server shipment</text><text x="45.0" y="499.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">4 to 7 per switchboard</text><text x="259.9" y="499.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">EPMS contractor technician</text><text x="536.2" y="499.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">CxA sample 10 to 20 %</text><text x="812.4" y="499.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">0.5 day per 10 devices</text><text x="1058.0" y="499.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">energisation of loads on that board</text><text x="45.0" y="521.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">9 and 10</text><text x="259.9" y="521.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">EPMS contractor with relay engineer</text><text x="536.2" y="521.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">CxA 100 %</text><text x="812.4" y="521.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">2 to 4 days per building</text><text x="1058.0" y="521.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">L4 sign-off</text><text x="45.0" y="543.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">12 72 h run</text><text x="259.9" y="543.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">EPMS contractor</text><text x="536.2" y="543.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">CxA reviews data</text><text x="812.4" y="543.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">3 days plus 1 day review</text><text x="1058.0" y="543.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">acceptance</text><text x="45.0" y="565.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">14 acceptance</text><text x="259.9" y="565.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">commissioning manager</text><text x="536.2" y="565.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">owner operations</text><text x="812.4" y="565.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">1 day</text><text x="1058.0" y="565.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">L5 IST start</text><text x="24.0" y="30.0" font-size="17" font-weight="700" fill="#172b3a" text-anchor="start">F24-1  EPMS commissioning workflow from factory test to acceptance, with the record that closes each step</text><text x="24.0" y="48.0" font-size="11" font-weight="400" fill="#5b6b78" text-anchor="start">14 steps · L1 factory test · L2 delivery and installation · L3 device and point tests · L4 system tests (alarms, SOE, reports, 72 h data run) · L5 integrated systems test · a failed step returns to the step that owns the cause</text><text x="32.0" y="608.0" font-size="10" font-weight="700" fill="#2d6a4f" text-anchor="start">WHAT TO PROVE</text><text x="32.0" y="624.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">• The 72 h data completeness run (step 12) starts only after the alarm, SOE and report tests are signed, because a configuration change resets the run.</text><text x="32.0" y="639.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">• Acceptance (step 14) needs all 13 records, the backup and restore record, and an empty open-issue list for category A and B issues.</text><text x="24.0" y="674.0" font-size="10" font-weight="700" fill="#5b6b78" text-anchor="start">LEGEND</text><line x1="24" y1="696.0" x2="50" y2="696.0" stroke="#475569" stroke-width="3"/><text x="56.0" y="700.0" font-size="10" font-weight="400" fill="#172b3a" text-anchor="start">signal / control</text><line x1="151.9671875" y1="696.0" x2="177.9671875" y2="696.0" stroke="#334155" stroke-width="3"/><text x="184.0" y="700.0" font-size="10" font-weight="400" fill="#172b3a" text-anchor="start">data / network</text><rect x="24" y="714.0" width="1352" height="44" rx="0" fill="#f6f8fa" fill-opacity="1" stroke="#5b6b78" stroke-width="1"/><text x="32.0" y="728.0" font-size="11" font-weight="700" fill="#172b3a" text-anchor="start">F24-1  ·  EPMS commissioning workflow from factory test to acceptance, with the record that closes each step</text><text x="1368.0" y="728.0" font-size="10" font-weight="400" fill="#5b6b78" text-anchor="end">Chapter 24 · §24.1</text><text x="32.0" y="741.0" font-size="9" font-weight="400" fill="#5b6b78" text-anchor="start">Data Centre Commissioning Field Manual R01 EN · October 2026 · educational reference, not to scale · project and OEM documents govern</text><text x="32.0" y="753.0" font-size="9" font-weight="400" fill="#5b6b78" text-anchor="start">Symbols: QElectroTech EN 60617 and P&amp;ID collections, CC-BY 3.0, native geometry · instrument bubbles per ISA 5.1 · states per IEC 60617 / IEEE C37.2 practice</text></svg>