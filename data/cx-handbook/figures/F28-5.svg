"599.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">• Thermocouples sit at 0.3, 1.0 and 1.8 m on one rack in four; flow and temperature of every CDU secondary are logged at 5 s.</text><text x="24.0" y="634.0" font-size="10" font-weight="700" fill="#5b6b78" text-anchor="start">LEGEND</text><line x1="24" y1="656.0" x2="50" y2="656.0" stroke="#1d4ed8" stroke-width="3"/><text x="56.0" y="660.0" font-size="10" font-weight="400" fill="#172b3a" text-anchor="start">415 V</text><line x1="107.10625" y1="656.0" x2="133.10625" y2="656.0" stroke="#c2410c" stroke-width="3"/><text x="139.1" y="660.0" font-size="10" font-weight="400" fill="#172b3a" text-anchor="start">heat flow</text><line x1="207.41875" y1="656.0" x2="233.41875" y2="656.0" stroke="#0f766e" stroke-width="3"/><text x="239.4" y="660.0" font-size="10" font-weight="400" fill="#172b3a" text-anchor="start">coolant (TCS)</text><line x1="328.153125" y1="656.0" x2="354.153125" y2="656.0" stroke="#0ea5e9" stroke-width="3"/><text x="360.2" y="660.0" font-size="10" font-weight="400" fill="#172b3a" text-anchor="start">air</text><rect x="24" y="674.0" width="1352" height="44" rx="0" fill="#f6f8fa" fill-opacity="1" stroke="#5b6b78" stroke-width="1"/><text x="32.0" y="688.0" font-size="11" font-weight="700" fill="#172b3a" text-anchor="start">F28-5  ·  Heat-load test layout for one rack position and one zone of hall B2-DH3</text><text x="1368.0" y="688.0" font-size="10" font-weight="400" fill="#5b6b78" text-anchor="end">Chapter 28 · §28.6</text><text x="32.0" y="701.0" font-size="9" font-weight="400" fill="#5b6b78" text-anchor="start">Data Centre Commissioning Field Manual R01 EN · October 2026 · educational reference, not to scale · project and OEM documents govern</text><text x="32.0" y="713.0" font-size="9" font-weight="400" fill="#5b6b78" text-anchor="start">Symbols: QElectroTech EN 60617 and P&amp;ID collections, CC-BY 3.0, native geometry · instrument bubbles per ISA 5.1 · states per IEC 60617 / IEEE C