<rect x="510" y="264" width="185" height="72" rx="8" fill="#ffffff" fill-opacity="1" stroke="#334155" stroke-width="1.4"/><rect x="725" y="394" width="185" height="72" rx="8" fill="#ffffff" fill-opacity="1" stroke="#334155" stroke-width="1.4"/><rect x="940" y="394" width="185" height="72" rx="8" fill="#ffffff" fill-opacity="1" stroke="#334155" stroke-width="1.4"/><rect x="1155" y="524" width="185" height="72" rx="8" fill="#ffffff" fill-opacity="1" stroke="#334155" stroke-width="1.4"/><rect x="1155" y="264" width="185" height="72" rx="8" fill="#ffffff" fill-opacity="1" stroke="#334155" stroke-width="1.4"/><text x="172.5" y="161.7" font-size="12" font-weight="700" fill="#334155" text-anchor="middle">Prepare issue list</text><text x="172.5" y="175.2" font-size="10" font-weight="400" fill="#172b3a" text-anchor="middle">same day as approval</text><text x="387.5" y="291.7" font-size="12" font-weight="700" fill="#334155" text-anchor="middle">Check names, status</text><text x="387.5" y="305.2" font-size="10" font-weight="400" fill="#172b3a" text-anchor="middle">1 working day</text><text x="602.5" y="291.7" font-size="12" font-weight="700" fill="#334155" text-anchor="middle">Raise and send</text><text x="602.5" y="305.2" font-size="10" font-weight="400" fill="#172b3a" text-anchor="middle">register updated</text><text x="817.5" y="421.7" font-size="12" font-weight="700" fill="#334155" text-anchor="middle">Acknowledge</text><text x="817.5" y="435.2" font-size="10" font-weight="400" fill="#172b3a" text-anchor="middle">1 working day</text><text x="1032.5" y="421.7" font-size="12" font-weight="700" fill="#334155" text-anchor="middle">Distribute</text><text x="1032.5" y="435.2" font-size="10" font-weight="400" fill="#172b3a" text-anchor="middle">1 working day</text><text x="1247.5" y="551.6" font-size="12" font-weight="700" fill="#334155" text-anchor="middle">Withdraw old prints</text><text x="1247.5" y="565.1" font-size="10" font-weight="400" fill="#172b3a" text-anchor="middle">1 working day</text><text x="1247.5" y="291.7" font-size="12" font-weight="700" fill="#334155" text-anchor="middle">Close transmittal</text><text x="1247.5" y="305.2" font-size="10" font-weight="400" fill="#172b3a" text-anchor="middle">all acknowledged</text><text x="80.0" y="640.0" font-size="11" font-weight="400" fill="#5b6b78" text-anchor="start">Dashed line: site withdrawal record returned to the sending document controller before closure.</text><text x="24.0" y="30.0" font-size="17" font-weight="700" fill="#172b3a" text-anchor="start">F04-3  Transmittal workflow from approval to site withdrawal of the superseded print</text><text x="24.0" y="48.0" font-size="11" font-weight="400" fill="#5b6b78" text-anchor="start">Four lanes · time limits in working days · purpose of issue, response due date and superseded list are required fields</text><text x="32.0" y="678.6" font-size="10" font-weight="700" fill="#2d6a4f" text-anchor="start">WHAT TO PROVE</text><text x="32.0" y="694.6" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">• Name and metadata check within 1 working day; acknowledgement within 1 working day for construction issues; site withdrawal within 1 working day.</text><text x="32.0" y="709.6" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">• Transmittals not fully acknowledged after 3 working days appear on the weekly overdue list.</text><text x="24.0" y="744.6" font-size="10" font-weight="700" fill="#5b6b78" text-anchor="start">LEGEND</text><line x1="24" y1="766.64" x2="50" y2="766.64" stroke="#334155" stroke-width="3"/><text x="56.0" y="770.6" font-size="10" font-weight="400" fill="#172b3a" text-anchor="start">data / network</text><line x1="150.859375" y1="766.64" x2="176.859375" y2="766.64" stroke="#475569" stroke-width="3"/><text x="182.9" y="770.6" font-size="10" font-weight="400" fill="#172b3a" text-anchor="start">signal / control</text><rect x="24" y="784.64" width="1352" height="44" rx="0" fill="#f6f8fa" fill-opacity="1" stroke="#5b6b78" stroke-width="1"/><text x="32.0" y="798.6" font-size="11" font-weight="700" fill="#172b3a" text-anchor="start">F04-3  ·  Transmittal workflow from approval to site withdrawal of the superseded print</text><text x="1368.0" y="798.6" font-size="10" font-weight="400" fill="#5b6b78" text-anchor="end">Chapter 04 · §04.7</text><text x="32.0" y="811.6" font-size="9" font-weight="400" fill="#5b6b78" text-anchor="start">Data Centre Commissioning Field Manual R01 EN · October 2026 · educational reference, not to scale · project and OEM documents govern</text><text x="32.0" y="823.6" font-size="9" font-weight="400" fill="#5b6b78" text-anchor="start">Symbols: QElectroTech EN 60617 and P&amp;ID collections, CC-BY 3.0, native geometry · instrument bubbles per ISA 5.1 · states per IEC 60617 / IEEE C37.2 practice</text></svg>