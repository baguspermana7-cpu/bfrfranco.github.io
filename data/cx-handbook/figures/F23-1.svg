ize="11.5" font-weight="700" fill="#b45309" text-anchor="middle">Galaxy UPS NMC</text><text x="1063.0" y="540.2" font-size="9.5" font-weight="400" fill="#172b3a" text-anchor="middle">UPS status</text><text x="1063.0" y="553.0" font-size="9.5" font-weight="400" fill="#172b3a" text-anchor="middle">Modbus TCP, SNMP</text><text x="1249.0" y="527.4" font-size="11.5" font-weight="700" fill="#475569" text-anchor="middle">Link150</text><text x="1249.0" y="540.2" font-size="9.5" font-weight="400" fill="#172b3a" text-anchor="middle">gateway</text><text x="1249.0" y="553.0" font-size="9.5" font-weight="400" fill="#172b3a" text-anchor="middle">Modbus TCP to RTU</text><text x="1249.0" y="645.9" font-size="11" font-weight="700" fill="#b45309" text-anchor="middle">Generator controllers</text><text x="1249.0" y="658.0" font-size="9" font-weight="400" fill="#172b3a" text-anchor="middle">RS-485 Modbus RTU</text><text x="1149.0" y="612.0" font-size="10" font-weight="400" fill="#475569" text-anchor="end">RS-485</text><text x="35.0" y="745.0" font-size="11" font-weight="700" fill="#172b3a" text-anchor="start">Layer</text><text x="303.0" y="745.0" font-size="11" font-weight="700" fill="#172b3a" text-anchor="start">What it does</text><text x="839.0" y="745.0" font-size="11" font-weight="700" fill="#172b3a" text-anchor="start">Commissioning record</text><text x="35.0" y="767.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">Apps, analytics and services</text><text x="303.0" y="767.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">reports, alarms, PUE, capacity, export to BMS and DCIM</text><text x="839.0" y="767.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">report verification sheet, point-export test record</text><text x="35.0" y="789.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">Edge control</text><text x="303.0" y="789.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">PME server, databases, time server, EPMS switches and firewall</text><text x="839.0" y="789.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">server build sheet, backup and restore record, switch configuration backup</text><text x="35.0" y="811.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">Connected products</text><text x="303.0" y="811.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">measure, protect, time-stamp, capture waveforms</text><text x="839.0" y="811.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">meter verification sheet, SOE test record, device configuration record</text><text x="24.0" y="30.0" font-size="17" font-weight="700" fill="#172b3a" text-anchor="start">F23-1  EPMS architecture for one MSC-1 building in the three EcoStruxure Power layers</text><text x="24.0" y="48.0" font-size="11" font-weight="400" fill="#5b6b78" text-anchor="start">Apps, analytics and services · edge control · connected products · two EPMS core switches in a ring · Ethernet devices direct, RS-485 devices through Link150 gateways · one-way export to BMS and DCIM through the DMZ firewall</text><text x="32.0" y="854.0" font-size="10" font-weight="700" fill="#2d6a4f" text-anchor="start">WHAT TO PROVE</text><text x="32.0" y="870.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">• Every connected product reaches PME over the EPMS network only; the BMS and DCIM receive data through the firewall and never write to a meter or a breaker.</text><text x="32.0" y="885.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">• Serial devices (generator controllers, small meters) sit behind Link150 gateways; Ethernet devices (ION9000, PM8000, EIFE, Easergy P3, UPS NMC) connect directly to access switches.</text><text x="24.0" y="920.0" font-size="10" font-weight="700" fill="#5b6b78" text-anchor="start">LEGEND</text><line x1="24" y1="942.0" x2="50" y2="942.0" stroke="#334155" stroke-width="3"/><text x="56.0" y="946.0" font-size="10" font-weight="400" fill="#172b3a" text-anchor="start">data / network</text><line x1="150.859375" y1="942.0" x2="176.859375" y2="942.0" stroke="#475569" stroke-width="3"/><text x="182.9" y="946.0" font-size="10" font-weight="400" fill="#172b3a" text-anchor="start">signal / control</text><line x1="278.8265625" y1="942.0" x2="304.8265625" y2="942.0" stroke="#b45309" stroke-width="3"/><text x="310.8" y="946.0" font-size="10" font-weight="400" fill="#172b3a" text-anchor="start">20 kV</text><line x1="361.36093750000003" y1="942.0" x2="387.36093750000003" y2="942.0" stroke="#b91c1c" stroke-width="3"/><text x="393.4" y="946.0" font-size="10" font-weight="400" fill="#172b3a" text-anchor="start">trip / protection</text><rect x="24" y="960.0" width="1352" height="44" rx="0" fill="#f6f8fa" fill-opacity="1" stroke="#5b6b78" stroke-width="1"/><text x="32.0" y="974.0" font-size="11" font-weight="700" fill="#172b3a" text-anchor="start">F23-1  ·  EPMS architecture for one MSC-1 building in the three EcoStruxure Power layers</text><text x="1368.0" y="974.0" font-size="10" font-weight="400" fill="#5b6b78" text-anchor="end">Chapter 23 · §23.2</text><text x="32.0" y="987.0" font-size="9" font-weight="400" fill="#5b6b78" text-anchor="start">Data Centre Commissioning Field Manual R01 EN · October 2026 · educational reference, not to scale · project and OEM documents govern</text><text x="32.0" y="999.0" font-size="9" font-weight="400" fill="#5b6b78" text-anchor="start">Symbols: QElectroTech EN 60617 and P&amp;ID collections, CC-BY 3.0, native geometry · instrument bubbles per ISA 5.1 · states per IEC 60617 / IEEE C37.2 practice</text></svg>