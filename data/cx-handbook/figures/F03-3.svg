7" y="342.0" width="550.0" height="24.0" rx="0" fill="#ffffff" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><rect x="956.6666666666667" y="342.0" width="403.33333333333337" height="24.0" rx="0" fill="#ffffff" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><rect x="40" y="366.0" width="366.6666666666667" height="24.0" rx="0" fill="#ffffff" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><rect x="406.6666666666667" y="366.0" width="550.0" height="24.0" rx="0" fill="#ffffff" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><rect x="956.6666666666667" y="366.0" width="403.33333333333337" height="24.0" rx="0" fill="#ffffff" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><rect x="40" y="390.0" width="366.6666666666667" height="24.0" rx="0" fill="#ffffff" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><rect x="406.6666666666667" y="390.0" width="550.0" height="24.0" rx="0" fill="#ffffff" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><rect x="956.6666666666667" y="390.0" width="403.33333333333337" height="24.0" rx="0" fill="#ffffff" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><text x="137.5" y="123.8" font-size="12" font-weight="700" fill="#475569" text-anchor="middle">Execute and sign</text><text x="137.5" y="137.3" font-size="10" font-weight="400" fill="#172b3a" text-anchor="middle">day 0</text><text x="137.5" y="150.8" font-size="10" font-weight="400" fill="#172b3a" text-anchor="middle">all parties sign</text><text x="362.5" y="123.8" font-size="12" font-weight="700" fill="#475569" text-anchor="middle">Raise issues</text><text x="362.5" y="137.3" font-size="10" font-weight="400" fill="#172b3a" text-anchor="middle">≤ 1 day</text><text x="362.5" y="150.8" font-size="10" font-weight="400" fill="#172b3a" text-anchor="middle">one per failed step</text><text x="587.5" y="123.8" font-size="12" font-weight="700" fill="#475569" text-anchor="middle">Attach data</text><text x="587.5" y="137.3" font-size="10" font-weight="400" fill="#172b3a" text-anchor="middle">≤ 2 days</text><text x="587.5" y="150.8" font-size="10" font-weight="400" fill="#172b3a" text-anchor="middle">native and PDF</text><text x="812.5" y="123.8" font-size="12" font-weight="700" fill="#475569" text-anchor="middle">CxA review</text><text x="812.5" y="137.3" font-size="10" font-weight="400" fill="#172b3a" text-anchor="middle">≤ 3 days</text><text x="812.5" y="150.8" font-size="10" font-weight="400" fill="#172b3a" text-anchor="middle">completeness</text><text x="1037.5" y="123.8" font-size="12" font-weight="700" fill="#475569" text-anchor="middle">CxM approval</text><text x="1037.5" y="137.3" font-size="10" font-weight="400" fill="#172b3a" text-anchor="middle">≤ 2 days</text><text x="1037.5" y="150.8" font-size="10" font-weight="400" fill="#172b3a" text-anchor="middle">status A in CDE</text><text x="1262.5" y="123.8" font-size="12" font-weight="700" fill="#475569" text-anchor="middle">Close record</text><text x="1262.5" y="137.3" font-size="10" font-weight="400" fill="#172b3a" text-anchor="middle">issues closed</text><text x="1262.5" y="150.8" font-size="10" font-weight="400" fill="#172b3a" text-anchor="middle">register updated</text><text x="45.0" y="286.3" font-size="12" font-weight="700" fill="#172b3a" text-anchor="start">Check at CxA review</text><text x="411.7" y="286.3" font-size="12" font-weight="700" fill="#172b3a" text-anchor="start">Rule</text><text x="961.7" y="286.3" font-size="12" font-weight="700" fill="#172b3a" text-anchor="start">If not met</text><text x="45.0" y="310.3" font-size="12" font-weight="400" fill="#172b3a" text-anchor="start">every step has a measured value</text><text x="411.7" y="310.3" font-size="12" font-weight="400" fill="#172b3a" text-anchor="start">value, unit or time stamp recorded on the day</text><text x="961.7" y="310.3" font-size="12" font-weight="400" fill="#172b3a" text-anchor="start">record returned to the contractor</text><text x="45.0" y="334.3" font-size="12" font-weight="400" fill="#172b3a" text-anchor="start">every failed step has an issue</text><text x="411.7" y="334.3" font-size="12" font-weight="400" fill="#172b3a" text-anchor="start">issue ID written in the step row</text><text x="961.7" y="334.3" font-size="12" font-weight="400" fill="#172b3a" text-anchor="start">issue raised before approval</text><text x="45.0" y="358.3" font-size="12" font-weight="400" fill="#172b3a" text-anchor="start">every attachment present</text><text x="411.7" y="358.3" font-size="12" font-weight="400" fill="#172b3a" text-anchor="start">trend, analyser and photo files listed in part 11</text><text x="961.7" y="358.3" font-size="12" font-weight="400" fill="#172b3a" text-anchor="start">missing file requested; approval waits</text><text x="45.0" y="382.3" font-size="12" font-weight="400" fill="#172b3a" text-anchor="start">redlines signed</text><text x="411.7" y="382.3" font-size="12" font-weight="400" fill="#172b3a" text-anchor="start">witness and contractor signatures on each change</text><text x="961.7" y="382.3" font-size="12" font-weight="400" fill="#172b3a" text-anchor="start">step treated as not tested</text><text x="45.0" y="406.3" font-size="12" font-weight="400" fill="#172b3a" text-anchor="start">retest linked</text><text x="411.7" y="406.3" font-size="12" font-weight="400" fill="#172b3a" text-anchor="start">RT suffix, failed record ID and issue ID</text><text x="961.7" y="406.3" font-size="12" font-weight="400" fill="#172b3a" text-anchor="start">retest record rejected</text><text x="24.0" y="30.0" font-size="17" font-weight="700" fill="#172b3a" text-anchor="start">F03-3  Record approval workflow: from test execution to a closed record</text><text x="24.0" y="48.0" font-size="11" font-weight="400" fill="#5b6b78" text-anchor="start">sign on the day · data attached within 2 working days · issues within 1 working day · CxA review 3 working days · CxM approval 2 working days · closed when all issues are closed</text><text x="32.0" y="450.0" font-size="10" font-weight="700" fill="#2d6a4f" text-anchor="start">WHAT TO PROVE</text><text x="32.0" y="466.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">• UPS-L4-B2-DH3-A1-01: test 2 to 3 March, record approved 8 March as failed, retest RT1 passed 11 March; closure took 7 working days.</text><text x="32.0" y="481.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">• The template is never overwritten; each executed record names the template ID and revision.</text><text x="24.0" y="516.0" font-size="10" font-weight="700" fill="#5b6b78" text-anchor="start">LEGEND</text><line x1="24" y1="538.0" x2="50" y2="538.0" stroke="#475569" stroke-width="3"/><text x="56.0" y="542.0" font-size="10" font-weight="400" fill="#172b3a" text-anchor="start">signal / control</text><rect x="24" y="556.0" width="1352" height="44" rx="0" fill="#f6f8fa" fill-opacity="1" stroke="#5b6b78" stroke-width="1"/><text x="32.0" y="570.0" font-size="11" font-weight="700" fill="#172b3a" text-anchor="start">F03-3  ·  Record approval workflow: from test execution to a closed record</text><text x="1368.0" y="570.0" font-size="10" font-weight="400" fill="#5b6b78" text-anchor="end">Chapter 03 · §03.17</text><text x="32.0" y="583.0" font-size="9" font-weight="400" fill="#5b6b78" text-anchor="start">Data Centre Commissioning Field Manual R01 EN · October 2026 · educational reference, not to scale · project and OEM documents govern</text><text x="32.0" y="595.0" font-size="9" font-weight="400" fill="#5b6b78" text-anchor="start">Symbols: QElectroTech EN 60617 and P&amp;ID collections, CC-BY 3.0, native geometry · instrument bubbles per ISA 5.1 · states per IEC 60617 / IEEE C37.2 practice</text></svg>