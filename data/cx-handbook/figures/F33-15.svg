TA ATS Table 100.1: 100 MΩ (600 V class) · 1,500 (5 kV) · 5,000 (15 kV) · 10,000 (25 kV) · 100,000 MΩ (34.5 kV at 5,000 V) · Table 100.5 transformers: liquid 100 / 1,000 /</text><text x="24.0" y="61.0" font-size="10" font-weight="400" fill="#5b6b78" text-anchor="start">5,000, dry 500 / 5,000 / 25,000 MΩ</text><text x="32.0" y="830.0" font-size="10" font-weight="700" fill="#2d6a4f" text-anchor="start">WHAT TO PROVE</text><text x="32.0" y="846.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">• The 20 kV switchgear example readings of 28.2 GΩ are above the 10,000 MΩ minimum of the 25 kV class row at 5,000 V DC.</text><text x="32.0" y="861.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">• A dry-type transformer winding above 5,000 V needs 25,000 MΩ at 5,000 V DC; a liquid-filled winding needs 5,000 MΩ.</text><rect x="24" y="894.0" width="952" height="44" rx="0" fill="#f6f8fa" fill-opacity="1" stroke="#5b6b78" stroke-width="1"/><text x="32.0" y="908.0" font-size="11" font-weight="700" fill="#172b3a" text-anchor="start">F33-15  ·  Insulation resistance acceptance ladder by voltage class (MΩ, log scale)</text><text x="968.0" y="908.0" font-size="10" font-weight="400" fill="#5b6b78" text-anchor="end">Chapter 33 · §33.21.2</text><text x="32.0" y="921.0" font-size="9" font-weight="400" fill="#5b6b78" text-anchor="start">Data Centre Commissioning Field Manual R01 EN · October 2026 · educational reference, not to scale · project and OEM documents govern</text><text x="32.0" y="933.0" font-size="9" font-weight="400" fill="#5b6b78" text-anchor="start">Symbols: QElectroTech EN 60617 and P&amp;ID collections, CC-BY 3.0, native geometry · instrument bubbles per ISA 5.1 · states per IEC 60617 / IEEE C37.2 practice</text></svg>