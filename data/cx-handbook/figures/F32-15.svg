nt-size="11" font-weight="400" fill="#172b3a" text-anchor="start">4 to 8</text><text x="185.3" y="612.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">2.35 to 4.6 MW</text><text x="403.6" y="612.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">2</text><text x="653.1" y="612.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">CH-03 command 10:51:34</text><text x="45.0" y="634.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">9 to 10</text><text x="185.3" y="634.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">4.6 to 9.1 MW</text><text x="403.6" y="634.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">3</text><text x="653.1" y="634.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">CH-04 command 11:25:06</text><text x="45.0" y="656.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">11 to 17</text><text x="185.3" y="656.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">9.1, 6.5, 4.0 MW</text><text x="403.6" y="656.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">4 (CH-05 after the trip)</text><text x="653.1" y="656.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">max CHWS 19.4 °C at step 14</text><text x="45.0" y="678.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">18 to 20</text><text x="185.3" y="678.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">4.0 to 1.8 MW</text><text x="403.6" y="678.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">3, then 1</text><text x="653.1" y="678.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">one chiller at 13:58</text><circle cx="617.6" cy="163.3" r="4" fill="#b7791f"/><circle cx="812.9" cy="230.0" r="4" fill="#b7791f"/><text x="24.0" y="30.0" font-size="17" font-weight="700" fill="#172b3a" text-anchor="start">F32-15  Staging script MEC-L4-CHW-B2-STG-01: load and running chiller capacity by step</text><text x="24.0" y="48.0" font-size="10" font-weight="400" fill="#5b6b78" text-anchor="start">5 chillers of 2.5 MW on the cold loop (4 duty, 1 standby; example value) · load 1.8 → 2.35 → 4.6 → 9.1 → 6.5 → 4.0 → 1.8 MW · CH-02 trip at step 13, standby CH-05 starts ·</text><text x="24.0" y="61.0" font-size="10" font-weight="400" fill="#5b6b78" text-anchor="start">20 of 20 steps passed at the first attempt</text><text x="32.0" y="721.0" font-size="10" font-weight="700" fill="#2d6a4f" text-anchor="start">WHAT TO PROVE</text><text x="32.0" y="737.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">• At steps 11 to 17 four chillers (10.0 MW) carry 9.1 MW; at step 13 CH-05 replaces the tripped CH-02, so the count stays at four.</text><text x="32.0" y="752.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">• At 4.0 MW (below 60 % of 7.5 MW = 4.5 MW) the stage-down timer starts at step 17 and CH-03 stops at step 18.</text><rect x="24" y="779.0" width="952" height="44" rx="0" fill="#f6f8fa" fill-opacity="1" stroke="#5b6b78" stroke-width="1"/><text x="32.0" y="793.0" font-size="11" font-weight="700" fill="#172b3a" text-anchor="start">F32-15  ·  Staging script MEC-L4-CHW-B2-STG-01: load and running chiller capacity by step</text><text x="968.0" y="793.0" font-size="10" font-weight="400" fill="#5b6b78" text-anchor="end">Chapter 32 · §32.7.2</text><text x="32.0" y="806.0" font-size="9" font-weight="400" fill="#5b6b78" text-anchor="start">Data Centre Commissioning Field Manual R01 EN · October 2026 · educational reference, not to scale · project and OEM documents govern</text><text x="32.0" y="818.0" font-size="9" font-weight="400" fill="#5b6b78" text-anchor="start">Symbols: QElectroTech EN 60617 and P&amp;ID collections, CC-BY 3.0, native geometry · instrument bubbles per ISA 5.1 · states per IEC 60617 / IEEE C37.2 practice</text></svg>