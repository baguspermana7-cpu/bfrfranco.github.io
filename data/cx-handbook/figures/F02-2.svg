0" width="126.92307692307692" height="22.0" rx="0" fill="#ffffff" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><rect x="1166.923076923077" y="154.0" width="203.07692307692307" height="22.0" rx="0" fill="#ffffff" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><rect x="1040" y="176.0" width="126.92307692307692" height="22.0" rx="0" fill="#ffffff" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><rect x="1166.923076923077" y="176.0" width="203.07692307692307" height="22.0" rx="0" fill="#ffffff" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><rect x="1040" y="198.0" width="126.92307692307692" height="22.0" rx="0" fill="#ffffff" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><rect x="1166.923076923077" y="198.0" width="203.07692307692307" height="22.0" rx="0" fill="#ffffff" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><rect x="1040" y="220.0" width="126.92307692307692" height="22.0" rx="0" fill="#ffffff" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><rect x="1166.923076923077" y="220.0" width="203.07692307692307" height="22.0" rx="0" fill="#ffffff" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><text x="320.0" y="130.7" font-size="12" font-weight="700" fill="#475569" text-anchor="middle">L5 Integrated systems test</text><text x="320.0" y="144.2" font-size="10" font-weight="400" fill="#172b3a" text-anchor="middle">all systems of the hall, normal and failure scenarios at 12 MW</text><text x="805.0" y="137.0" font-size="11" font-weight="700" fill="#b91c1c" text-anchor="middle">Gate: IST record, Cx report</text><text x="360.0" y="212.7" font-size="12" font-weight="700" fill="#475569" text-anchor="middle">L4 Functional performance test</text><text x="360.0" y="226.2" font-size="10" font-weight="400" fill="#172b3a" text-anchor="middle">system functions, sequences, alarms, capacity, 8 h load runs</text><text x="845.0" y="219.0" font-size="11" font-weight="700" fill="#b91c1c" text-anchor="middle">Gate: signed L4 script</text><text x="400.0" y="294.7" font-size="12" font-weight="700" fill="#475569" text-anchor="middle">L3 Start-up and pre-functional</text><text x="400.0" y="308.2" font-size="10" font-weight="400" fill="#172b3a" text-anchor="middle">energise, OEM start-up, settings, point checks, TAB</text><text x="885.0" y="300.9" font-size="11" font-weight="700" fill="#b91c1c" text-anchor="middle">Gate: L3 checklist, start-up report</text><text x="440.0" y="376.7" font-size="12" font-weight="700" fill="#475569" text-anchor="middle">L2 Delivery and installation</text><text x="440.0" y="390.2" font-size="10" font-weight="400" fill="#172b3a" text-anchor="middle">L2A delivery, L2B installation, torque, IR, pressure, flushing</text><text x="925.0" y="382.9" font-size="11" font-weight="700" fill="#b91c1c" text-anchor="middle">Gate: L2 checklist</text><text x="480.0" y="458.7" font-size="12" font-weight="700" fill="#475569" text-anchor="middle">L1 Factory acceptance test</text><text x="480.0" y="472.2" font-size="10" font-weight="400" fill="#172b3a" text-anchor="middle">major equipment at the factory, failure simulations witnessed</text><text x="965.0" y="464.9" font-size="11" font-weight="700" fill="#b91c1c" text-anchor="middle">Gate: FAT report, shipping release</text><text x="520.0" y="540.6" font-size="12" font-weight="700" fill="#475569" text-anchor="middle">L0 Design and planning review</text><text x="520.0" y="554.1" font-size="10" font-weight="400" fill="#172b3a" text-anchor="middle">OPR, BOD, design, Cx specification, draft scripts</text><text x="1005.0" y="546.9" font-size="11" font-weight="700" fill="#b91c1c" text-anchor="middle">Gate: design review log closed</text><text x="1045.0" y="125.0" font-size="11" font-weight="700" fill="#172b3a" text-anchor="start">Gate</text><text x="1171.9" y="125.0" font-size="11" font-weight="700" fill="#172b3a" text-anchor="start">Decision time</text><text x="1045.0" y="147.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">L1 item</text><text x="1171.9" y="147.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">2 working days</text><text x="1045.0" y="169.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">L2 item</text><text x="1171.9" y="169.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">2 working days</text><text x="1045.0" y="191.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">L3 item</text><text x="1171.9" y="191.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">2 working days</text><text x="1045.0" y="213.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">L4 system</text><text x="1171.9" y="213.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">3 working days</text><text x="1045.0" y="235.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">L5 hall</text><text x="1171.9" y="235.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">readiness review 5 working days </text><text x="24.0" y="30.0" font-size="17" font-weight="700" fill="#172b3a" text-anchor="start">F02-2  Level ladder L0 to L5 with the gate that closes each level</text><text x="24.0" y="48.0" font-size="11" font-weight="400" fill="#5b6b78" text-anchor="start">item gates at L1 to L3 (2 working days) · system gate at L4 (3 working days) · hall gate at L5 · any open category A issue blocks a gate</text><text x="32.0" y="614.0" font-size="10" font-weight="700" fill="#2d6a4f" text-anchor="start">WHAT TO PROVE</text><text x="32.0" y="630.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">• L4 starts only with approved scripts (no drafts), load banks connected and zero open critical issues on the system.</text><text x="32.0" y="645.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">• L5 starts only when every L4 in the hall has passed with its issues closed and event logging is enabled on UPS, switchgear, generators and BMS.</text><text x="24.0" y="680.0" font-size="10" font-weight="700" fill="#5b6b78" text-anchor="start">LEGEND</text><line x1="24" y1="702" x2="50" y2="702" stroke="#475569" stroke-width="3"/><text x="56.0" y="706.0" font-size="10" font-weight="400" fill="#172b3a" text-anchor="start">signal / control</text><line x1="151.9671875" y1="702" x2="177.9671875" y2="702" stroke="#b91c1c" stroke-width="3"/><text x="184.0" y="706.0" font-size="10" font-weight="400" fill="#172b3a" text-anchor="start">trip / protection</text><rect x="24" y="720" width="1352" height="44" rx="0" fill="#f6f8fa" fill-opacity="1" stroke="#5b6b78" stroke-width="1"/><text x="32.0" y="734.0" font-size="11" font-weight="700" fill="#172b3a" text-anchor="start">F02-2  ·  Level ladder L0 to L5 with the gate that closes each level</text><text x="1368.0" y="734.0" font-size="10" font-weight="400" fill="#5b6b78" text-anchor="end">Chapter 02 · §02.5</text><text x="32.0" y="747.0" font-size="9" font-weight="400" fill="#5b6b78" text-anchor="start">Data Centre Commissioning Field Manual R01 EN · October 2026 · educational reference, not to scale · project and OEM documents govern</text><text x="32.0" y="759.0" font-size="9" font-weight="400" fill="#5b6b78" text-anchor="start">Symbols: QElectroTech EN 60617 and P&amp;ID collections, CC-BY 3.0, native geometry · instrument bubbles per ISA 5.1 · states per IEC 60617 / IEEE C37.2 practice</text></svg>