<svg xmlns="http://www.w3.org/2000/svg" width="267mm" height="187.3mm" viewBox="0 0 1400 982" font-family="DejaVu Sans" role="img" aria-labelledby="t"><title id="t">F29-5 Decision tree: fibre link loss above the budget</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="context-stroke"/></marker><marker id="arrow-simple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#172b3a"/></marker><marker id="arrow-475569" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#475569"/></marker><marker id="arrow-b91c1c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#b91c1c"/></marker></defs><rect width="1400" height="982" fill="#ffffff"/><rect x="4" y="4" width="1392" height="974" fill="none" stroke="#172b3a" stroke-width="1.6"/><rect x="24" y="802" width="1352" height="56" rx="4" fill="#f1f8f4" fill-opacity="1" stroke="#2d6a4f" stroke-width="1"/><polyline points="620.0,150.0 760.0,150.0" fill="none" stroke="#b91c1c" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#arrow-b91c1c)"/><polyline points="340.0,180.0 340.0,220.0" fill="none" stroke="#475569" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#arrow-475569)"/><polyline points="620.0,250.0 760.0,250.0" fill="none" stroke="#b91c1c" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#arrow-b91c1c)"/><polyline points="340.0,280.0 340.0,320.0" fill="none" stroke="#475569" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#arrow-475569)"/><polyline points="620.0,350.0 760.0,350.0" fill="none" stroke="#b91c1c" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#arrow-b91c1c)"/><polyline points="340.0,380.0 340.0,420.0" fill="none" stroke="#475569" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#arrow-475569)"/><polyline points="340.0,480.0 340.0,520.0" fill="none" stroke="#475569" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#arrow-475569)"/><polyline points="620.0,550.0 760.0,550.0" fill="none" stroke="#b91c1c" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#arrow-b91c1c)"/><polyline points="340.0,580.0 340.0,620.0" fill="none" stroke="#475569" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#arrow-475569)"/><polyline points="620.0,650.0 760.0,650.0" fill="none" stroke="#b91c1c" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#arrow-b91c1c)"/><polyline points="340.0,680.0 340.0,720.0" fill="none" stroke="#475569" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#arrow-475569)"/><rect x="60" y="120" width="560" height="60" rx="0" fill="#ffffff" fill-opacity="1" stroke="#475569" stroke-width="1.4"/><rect x="760" y="120" width="600" height="60" rx="0" fill="#ffffff" fill-opacity="1" stroke="#b91c1c" stroke-width="1.4"/><rect x="60" y="220" width="560" height="60" rx="0" fill="#ffffff" fill-opacity="1" stroke="#475569" stroke-width="1.4"/><rect x="760" y="220" width="600" height="60" rx="0" fill="#ffffff" fill-opacity="1" stroke="#b91c1c" stroke-width="1.4"/><rect x="60" y="320" width="560" height="60" rx="0" fill="#ffffff" fill-opacity="1" stroke="#475569" stroke-width="1.4"/><rect x="760" y="320" width="600" height="60" rx="0" fill="#ffffff" fill-opacity="1" stroke="#b91c1c" stroke-width="1.4"/><rect x="60" y="420" width="560" height="60" rx="0" fill="#ffffff" fill-opacity="1" stroke="#475569" stroke-width="1.4"/><rect x="60" y="520" width="560" height="60" rx="0" fill="#ffffff" fill-opacity="1" stroke="#475569" stroke-width="1.4"/><rect x="760" y="520" width="600" height="60" rx="0" fill="#ffffff" fill-opacity="1" stroke="#b91c1c" stroke-width="1.4"/><rect x="60" y="620" width="560" height="60" rx="0" fill="#ffffff" fill-opacity="1" stroke="#475569" stroke-width="1.4"/><rect x="760" y="620" width="600" height="60" rx="0" fill="#ffffff" fill-opacity="1" stroke="#b91c1c" stroke-width="1.4"/><rect x="60" y="720" width="560" height="60" rx="8" fill="#ffffff" fill-opacity="1" stroke="#334155" stroke-width="1.4"/><text x="340.0" y="141.8" font-size="11.5" font-weight="700" fill="#475569" text-anchor="middle">1. Reference method and cords</text><text x="340.0" y="154.6" font-size="9.5" font-weight="400" fill="#172b3a" text-anchor="middle">one-jumper; cords ≤ 0.10 dB MM, ≤ 0.20 dB SM</text><text x="1060.0" y="148.2" font-size="11.5" font-weight="700" fill="#b91c1c" text-anchor="middle">Reset reference; replace cords</text><text x="340.0" y="241.8" font-size="11.5" font-weight="700" fill="#475569" text-anchor="middle">2. Inspect and clean both ends</text><text x="340.0" y="254.6" font-size="9.5" font-weight="400" fill="#172b3a" text-anchor="middle">IEC 61300-3-35 profile</text><text x="1060.0" y="248.2" font-size="11.5" font-weight="700" fill="#b91c1c" text-anchor="middle">Clean, re-inspect, retest</text><text x="340.0" y="341.8" font-size="11.5" font-weight="700" fill="#475569" text-anchor="middle">3. Compare 1310 and 1550 nm</text><text x="340.0" y="354.6" font-size="9.5" font-weight="400" fill="#172b3a" text-anchor="middle">higher at 1550 nm: bend</text><text x="1060.0" y="341.8" font-size="11.5" font-weight="700" fill="#b91c1c" text-anchor="middle">Locate the bend with OTDR</text><text x="1060.0" y="354.6" font-size="9.5" font-weight="400" fill="#172b3a" text-anchor="middle">go to step 4</text><text x="340.0" y="441.8" font-size="11.5" font-weight="700" fill="#475569" text-anchor="middle">4. OTDR with launch and tail cords</text><text x="340.0" y="454.6" font-size="9.5" font-weight="400" fill="#172b3a" text-anchor="middle">read event table</text><text x="340.0" y="541.8" font-size="11.5" font-weight="700" fill="#475569" text-anchor="middle">5. Judge the high event</text><text x="340.0" y="554.6" font-size="9.5" font-weight="400" fill="#172b3a" text-anchor="middle">connector &gt; 0.75 dB, splice &gt; 0.3 dB</text><text x="1060.0" y="541.8" font-size="11.5" font-weight="700" fill="#b91c1c" text-anchor="middle">Replace connector, re-splice, release bend</text><text x="1060.0" y="554.6" font-size="9.5" font-weight="400" fill="#172b3a" text-anchor="middle">average splice both ways</text><text x="340.0" y="641.8" font-size="11.5" font-weight="700" fill="#475569" text-anchor="middle">6. Polarity and patch path</text><text x="340.0" y="654.6" font-size="9.5" font-weight="400" fill="#172b3a" text-anchor="middle">extra panel adds a pair</text><text x="1060.0" y="648.2" font-size="11.5" font-weight="700" fill="#b91c1c" text-anchor="middle">Correct the patch</text><text x="340.0" y="741.8" font-size="11.5" font-weight="700" fill="#334155" text-anchor="middle">Retest Tier 1 at both wavelengths</text><text x="340.0" y="754.6" font-size="9.5" font-weight="400" fill="#172b3a" text-anchor="middle">result ≤ budget</text><text x="760.0" y="740.0" font-size="11" font-weight="400" fill="#5b6b78" text-anchor="start">Arrow down: the check found nothing, go to the next check.</text><text x="760.0" y="760.0" font-size="11" font-weight="400" fill="#5b6b78" text-anchor="start">Arrow right: the check found the fault, apply the fix, then retest.</text><text x="24.0" y="30.0" font-size="17" font-weight="700" fill="#172b3a" text-anchor="start">F29-5  Decision tree: fibre link loss above the budget</text><text x="24.0" y="48.0" font-size="11" font-weight="400" fill="#5b6b78" text-anchor="start">budget from ANSI/TIA-568.3-D: 0.75 dB per connector pair, 0.3 dB per splice, 0.5 dB/km OS2 · worked link 0.85 km, 2 pairs, 2 splices = 2.53 dB · first result 3.12 / 3.65 dB · final 1.62 / 1.58 dB at 1310 / 1550 nm</text><text x="32.0" y="816.0" font-size="10" font-weight="700" fill="#2d6a4f" text-anchor="start">WHAT TO PROVE</text><text x="32.0" y="832.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">• Budget 0.85 x 0.5 + 2 x 0.75 + 2 x 0.3 = 2.53 dB; after cleaning, 2.84 dB at 1550 nm was still above it and 0.53 dB above 1310 nm.</text><text x="32.0" y="847.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">• The OTDR found a 0.58 dB event at 0.62 km in a splice tray; re-routing the fibre gave 1.58 dB at 1550 nm.</text><text x="24.0" y="882.0" font-size="10" font-weight="700" fill="#5b6b78" text-anchor="start">LEGEND</text><line x1="24" y1="904" x2="50" y2="904" stroke="#475569" stroke-width="3"/><text x="56.0" y="908.0" font-size="10" font-weight="400" fill="#172b3a" text-anchor="start">signal / control</text><line x1="151.9671875" y1="904" x2="177.9671875" y2="904" stroke="#b91c1c" stroke-width="3"/><text x="184.0" y="908.0" font-size="10" font-weight="400" fill="#172b3a" text-anchor="start">trip / protection</text><line x1="283.934375" y1="904" x2="309.934375" y2="904" stroke="#334155" stroke-width="3"/><text x="315.9" y="908.0" font-size="10" font-weight="400" fill="#172b3a" text-anchor="start">data / network</text><rect x="24" y="922" width="1352" height="44" rx="0" fill="#f6f8fa" fill-opacity="1" stroke="#5b6b78" stroke-width="1"/><text x="32.0" y="936.0" font-size="11" font-weight="700" fill="#172b3a" text-anchor="start">F29-5  ·  Decision tree: fibre link loss above the budget</text><text x="1368.0" y="936.0" font-size="10" font-weight="400" fill="#5b6b78" text-anchor="end">Chapter 29 · §29.13</text><text x="32.0" y="949.0" font-size="9" font-weight="400" fill="#5b6b78" text-anchor="start">Data Centre Commissioning Field Manual R01 EN · October 2026 · educational reference, not to scale · project and OEM documents govern</text><text x="32.0" y="961.0" font-size="9" font-weight="400" fill="#5b6b78" text-anchor="start">Symbols: QElectroTech EN 60617 and P&amp;ID collections, CC-BY 3.0, native geometry · instrument bubbles per ISA 5.1 · states per IEC 60617 / IEEE C37.2 practice</text></svg>