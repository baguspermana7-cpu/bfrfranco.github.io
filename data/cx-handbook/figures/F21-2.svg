"#ffffff" fill-opacity="1" stroke="#475569" stroke-width="1.6"/><rect x="730" y="266" width="270" height="80" rx="4" fill="#ffffff" fill-opacity="1" stroke="#475569" stroke-width="1.6"/><rect x="1060" y="266" width="280" height="80" rx="4" fill="#ffffff" fill-opacity="1" stroke="#334155" stroke-width="1.6"/><rect x="730" y="400" width="610" height="110" rx="0" fill="#ffffff" fill-opacity="1" stroke="#334155" stroke-width="1.4"/><text x="190.0" y="146.7" font-size="12" font-weight="700" fill="#334155" text-anchor="middle">BMS server 10.22.0.11</text><text x="190.0" y="160.2" font-size="10" font-weight="400" fill="#172b3a" text-anchor="middle">BBMD 1 for subnet 10.22.0.0</text><text x="1180.0" y="146.7" font-size="12" font-weight="700" fill="#b91c1c" text-anchor="middle">Commissioning laptop</text><text x="1180.0" y="160.2" font-size="10" font-weight="400" fill="#172b3a" text-anchor="middle">foreign device registered with BBMD 1</text><text x="700.0" y="146.7" font-size="12" font-weight="700" fill="#334155" text-anchor="middle">OT router and firewall</text><text x="700.0" y="160.2" font-size="10" font-weight="400" fill="#172b3a" text-anchor="middle">routes 10.22.x.0/24, no broadcasts</text><text x="190.0" y="290.9" font-size="12" font-weight="700" fill="#475569" text-anchor="middle">Automation server AS-DH3</text><text x="190.0" y="304.4" font-size="10" font-weight="400" fill="#172b3a" text-anchor="middle">10.22.3.10 · BBMD 2</text><text x="190.0" y="317.9" font-size="10" font-weight="400" fill="#172b3a" text-anchor="middle">routes MS/TP 2301 to 2304</text><text x="505.0" y="297.7" font-size="12" font-weight="700" fill="#334155" text-anchor="middle">CDU 07 instance 233007</text><text x="505.0" y="311.2" font-size="10" font-weight="400" fill="#172b3a" text-anchor="middle">10.22.3.47 (via Modbus map)</text><text x="505.0" y="411.7" font-size="12" font-weight="700" fill="#334155" text-anchor="middle">CRAH 11 instance 232011</text><text x="505.0" y="425.2" font-size="10" font-weight="400" fill="#172b3a" text-anchor="middle">10.22.3.81 · BACnet/IP</text><text x="190.0" y="449.9" font-size="12" font-weight="700" fill="#475569" text-anchor="middle">MS/TP trunks 2301 to 2304</text><text x="190.0" y="463.4" font-size="10" font-weight="400" fill="#172b3a" text-anchor="middle">13 sensors per trunk</text><text x="190.0" y="476.9" font-size="10" font-weight="400" fill="#172b3a" text-anchor="middle">MAC 1 to 13 · Max_Master 13</text><text x="865.0" y="290.9" font-size="12" font-weight="700" fill="#475569" text-anchor="middle">Automation server AS-DH2</text><text x="865.0" y="304.4" font-size="10" font-weight="400" fill="#172b3a" text-anchor="middle">10.22.2.10 · BBMD 3</text><text x="865.0" y="317.9" font-size="10" font-weight="400" fill="#172b3a" text-anchor="middle">routes MS/TP 2201 to 2204</text><text x="1200.0" y="297.7" font-size="12" font-weight="700" fill="#334155" text-anchor="middle">CDU controllers DH2</text><text x="1200.0" y="311.2" font-size="10" font-weight="400" fill="#172b3a" text-anchor="middle">instances 223001 to 223016</text><text x="1035.0" y="439.9" font-size="12" font-weight="700" fill="#334155" text-anchor="middle">Broadcast distribution table (identical in BBMD 1, 2 and 3)</text><text x="1035.0" y="453.4" font-size="10" font-weight="400" fill="#172b3a" text-anchor="middle">10.22.0.10/24 · 10.22.3.10/24 · 10.22.2.10/24</text><text x="1035.0" y="466.9" font-size="10" font-weight="400" fill="#172b3a" text-anchor="middle">UDP 47808 on every entry · foreign device table: laptop, time-to-live 300 s</text><text x="40.0" y="560.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">The router between subnets does not forward broadcasts. A Who-Is sent in hall 3 reaches BBMD 2, which forwards it to BBMD 1 and BBMD 3 as listed in its table; each BBMD then broadcasts it on its own subnet.</text><text x="40.0" y="574.9" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">Two BBMDs on one subnet would forward every broadcast twice. Network numbers 2301 to 2304 are unique on the campus; the factory default network number 1 is changed on every router before connection.</text><text x="24.0" y="30.0" font-size="17" font-weight="700" fill="#172b3a" text-anchor="start">F21-2  BACnet internetwork of Building 2 with one BBMD per subnet and MS/TP trunks under the automation servers</text><text x="24.0" y="48.0" font-size="11" font-weight="400" fill="#5b6b78" text-anchor="start">network number = building × 1000 + hall × 100 + trunk · BACnet/IP network 2000 · hall subnets 10.22.1.0/24 to 10.22.3.0/24 · MS/TP trunks 2301 to 2304 at 38,400 bit/s</text><text x="32.0" y="613.5" font-size="10" font-weight="700" fill="#2d6a4f" text-anchor="start">WHAT TO PROVE</text><text x="32.0" y="629.5" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">• The BDT of every BBMD lists the same three peers (10.22.0.10, 10.22.3.10, 10.22.2.10); a missing entry makes discovery work in one direction only.</text><text x="32.0" y="644.5" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">• Device instances follow the six-digit scheme: CDU 07 of hall 3 is 233007 and CRAH 11 is 232011; the highest number in the scheme is 498999, below the limit of 4,194,302.</text><text x="24.0" y="679.5" font-size="10" font-weight="700" fill="#5b6b78" text-anchor="start">LEGEND</text><line x1="24" y1="701.49" x2="50" y2="701.49" stroke="#334155" stroke-width="3"/><text x="56.0" y="705.5" font-size="10" font-weight="400" fill="#172b3a" text-anchor="start">data / network</text><line x1="150.859375" y1="701.49" x2="176.859375" y2="701.49" stroke="#475569" stroke-width="3"/><text x="182.9" y="705.5" font-size="10" font-weight="400" fill="#172b3a" text-anchor="start">signal / control</text><line x1="278.8265625" y1="701.49" x2="304.8265625" y2="701.49" stroke="#b91c1c" stroke-width="3"/><text x="310.8" y="705.5" font-size="10" font-weight="400" fill="#172b3a" text-anchor="start">trip / protection</text><rect x="24" y="719.49" width="1352" height="44" rx="0" fill="#f6f8fa" fill-opacity="1" stroke="#5b6b78" stroke-width="1"/><text x="32.0" y="733.5" font-size="11" font-weight="700" fill="#172b3a" text-anchor="start">F21-2  ·  BACnet internetwork of Building 2 with one BBMD per subnet and MS/TP trunks under the automation servers</text><text x="1368.0" y="733.5" font-size="10" font-weight="400" fill="#5b6b78" text-anchor="end">Chapter 21 · §21.4</text><text x="32.0" y="746.5" font-size="9" font-weight="400" fill="#5b6b78" text-anchor="start">Data Centre Commissioning Field Manual R01 EN · October 2026 · educational reference, not to scale · project and OEM documents govern</text><text x="32.0" y="758.5" font-size="9" font-weight="400" fill="#5b6b78" text-anchor="start">Symbols: QElectroTech EN 60617 and P&amp;ID collections, CC-BY 3.0, native geometry · instrument bubbles per ISA 5.1 · states per IEC 60617 / IEEE C37.2 practice</text></svg>