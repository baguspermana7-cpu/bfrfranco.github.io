ill="#172b3a" text-anchor="start">A</text><text x="70.0" y="392.4" font-size="12" font-weight="700" fill="#b7791f" text-anchor="start">Hold created by the code C row</text><text x="70.0" y="409.2" font-size="12" font-weight="400" fill="#172b3a" text-anchor="start">Level 2 wiring inspection of B2-DH3-UPS-A1 blocked</text><text x="70.0" y="425.4" font-size="12" font-weight="400" fill="#172b3a" text-anchor="start">reason recorded in the Cx programme</text><text x="70.0" y="441.6" font-size="12" font-weight="400" fill="#172b3a" text-anchor="start">released when the drawing returns at code A or B</text><text x="730.0" y="392.4" font-size="12" font-weight="700" fill="#b7791f" text-anchor="start">Code meanings used in the register</text><text x="730.0" y="409.2" font-size="12" font-weight="400" fill="#172b3a" text-anchor="start">A approved; B approved with comments</text><text x="730.0" y="425.4" font-size="12" font-weight="400" fill="#172b3a" text-anchor="start">C revise and resubmit; D rejected</text><text x="730.0" y="441.6" font-size="12" font-weight="400" fill="#172b3a" text-anchor="start">NR not reviewed; RA receipt acknowledged</text><text x="24.0" y="30.0" font-size="17" font-weight="700" fill="#172b3a" text-anchor="start">F04-4  Document register extract for building 2 with review codes</text><text x="24.0" y="48.0" font-size="11" font-weight="400" fill="#5b6b78" text-anchor="start">Six rows from the MSC-1 worked example · current revision, status, issue date, review code · S3 with code C blocks the dependent Level 2 inspection</text><text x="32.0" y="492.6" font-size="10" font-weight="700" fill="#2d6a4f" text-anchor="start">WHAT TO PROVE</text><text x="32.0" y="508.6" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">• MSC1-UPS-B2-01-DR-X-0031 is at P02, status S3, review code C, so no Level 2 wiring inspection of UPS B2-DH3-UPS-A1 may be signed against it.</text><text x="32.0" y="523.6" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">• Published rows carry C revisions and A3 or A4 status codes.</text><rect x="24" y="556.6" width="1352" height="44" rx="0" fill="#f6f8fa" fill-opacity="1" stroke="#5b6b78" stroke-width="1"/><text x="32.0" y="570.6" font-size="11" font-weight="700" fill="#172b3a" text-anchor="start">F04-4  ·  Document register extract for building 2 with review codes</text><text x="1368.0" y="570.6" font-size="10" font-weight="400" fill="#5b6b78" text-anchor="end">Chapter 04 · §04.5</text><text x="32.0" y="583.6" font-size="9" font-weight="400" fill="#5b6b78" text-anchor="start">Data Centre Commissioning Field Manual R01 EN · October 2026 · educational reference, not to scale · project and OEM documents govern</text><text x="32.0" y="595.6" font-size="9" font-weight="400" fill="#5b6b78" text-anchor="start">Symbols: QElectroTech EN 60617 and P&amp;ID collections, CC-BY 3.0, native geometry · instrument bubbles per ISA 5.1 · states per IEC 60617 / IEEE C37.2 practice</text></svg>