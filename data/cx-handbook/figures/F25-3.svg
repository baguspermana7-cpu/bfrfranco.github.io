" stroke-width="0.8"/><rect x="40" y="186.32" width="300" height="25.44" rx="0" fill="#e9f0f4" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><rect x="340" y="186.32" width="720" height="25.44" rx="0" fill="#ffffff" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><rect x="1060" y="186.32" width="300" height="25.44" rx="0" fill="#ffffff" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><rect x="40" y="211.76" width="300" height="25.44" rx="0" fill="#e9f0f4" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><rect x="340" y="211.76" width="720" height="25.44" rx="0" fill="#ffffff" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><rect x="1060" y="211.76" width="300" height="25.44" rx="0" fill="#ffffff" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><rect x="40" y="237.2" width="300" height="25.44" rx="0" fill="#e9f0f4" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><rect x="340" y="237.2" width="720" height="25.44" rx="0" fill="#ffffff" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><rect x="1060" y="237.2" width="300" height="25.44" rx="0" fill="#ffffff" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><rect x="40" y="262.64" width="300" height="25.44" rx="0" fill="#e9f0f4" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><rect x="340" y="262.64" width="720" height="25.44" rx="0" fill="#ffffff" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><rect x="1060" y="262.64" width="300" height="25.44" rx="0" fill="#ffffff" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><rect x="40" y="288.08" width="300" height="25.44" rx="0" fill="#e9f0f4" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><rect x="340" y="288.08" width="720" height="25.44" rx="0" fill="#ffffff" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><rect x="1060" y="288.08" width="300" height="25.44" rx="0" fill="#ffffff" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><rect x="40" y="313.52" width="300" height="25.44" rx="0" fill="#e9f0f4" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><rect x="340" y="313.52" width="720" height="25.44" rx="0" fill="#ffffff" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><rect x="1060" y="313.52" width="300" height="25.44" rx="0" fill="#ffffff" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><rect x="40" y="338.96" width="300" height="25.44" rx="0" fill="#e9f0f4" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><rect x="340" y="338.96" width="720" height="25.44" rx="0" fill="#ffffff" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><rect x="1060" y="338.96" width="300" height="25.44" rx="0" fill="#ffffff" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><rect x="40" y="364.4" width="300" height="25.44" rx="0" fill="#e9f0f4" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><rect x="340" y="364.4" width="720" height="25.44" rx="0" fill="#ffffff" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><rect x="1060" y="364.4" width="300" height="25.44" rx="0" fill="#ffffff" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><rect x="40" y="389.84" width="300" height="25.44" rx="0" fill="#e9f0f4" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><rect x="340" y="389.84" width="720" height="25.44" rx="0" fill="#ffffff" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><rect x="1060" y="389.84" width="300" height="25.44" rx="0" fill="#ffffff" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><rect x="40" y="415.28" width="300" height="25.44" rx="0" fill="#e9f0f4" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><rect x="340" y="415.28" width="720" height="25.44" rx="0" fill="#ffffff" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><rect x="1060" y="415.28" width="300" height="25.44" rx="0" fill="#ffffff" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><rect x="40" y="440.71999999999997" width="300" height="25.44" rx="0" fill="#e9f0f4" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><rect x="340" y="440.71999999999997" width="720" height="25.44" rx="0" fill="#ffffff" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><rect x="1060" y="440.71999999999997" width="300" height="25.44" rx="0" fill="#ffffff" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><text x="700.0" y="127.2" font-size="11" font-weight="700" fill="#172b3a" text-anchor="middle">Content in ICD-25-021</text><text x="1210.0" y="127.2" font-size="11" font-weight="700" fill="#172b3a" text-anchor="middle">Written by</text><text x="46.0" y="152.6" font-size="12" font-weight="400" fill="#172b3a" text-anchor="start">1 Identification</text><text x="700.0" y="152.6" font-size="12" font-weight="700" fill="#172b3a" text-anchor="middle">ICD number, MIL row IF-021, owners, signatures</text><text x="1210.0" y="152.6" font-size="12" font-weight="700" fill="#172b3a" text-anchor="middle">commissioning manager</text><text x="46.0" y="178.0" font-size="12" font-weight="400" fill="#172b3a" text-anchor="start">2 Purpose and functions</text><text x="700.0" y="178.0" font-size="12" font-weight="700" fill="#172b3a" text-anchor="middle">BMS monitors, alarms, trends, enables each CDU; CDU controls itself</text><text x="1210.0" y="178.0" font-size="12" font-weight="700" fill="#172b3a" text-anchor="middle">engineer of record</text><text x="46.0" y="203.5" font-size="12" font-weight="400" fill="#172b3a" text-anchor="start">3 Physical layer</text><text x="700.0" y="203.5" font-size="12" font-weight="700" fill="#172b3a" text-anchor="middle">ETH1 to hall switch A (odd) or B (even), Cat 6A</text><text x="1210.0" y="203.5" font-size="12" font-weight="700" fill="#172b3a" text-anchor="middle">both owners</text><text x="46.0" y="228.9" font-size="12" font-weight="400" fill="#172b3a" text-anchor="start">4 Network layer</text><text x="700.0" y="228.9" font-size="12" font-weight="700" fill="#172b3a" text-anchor="middle">VLAN 2310, 10.22.3.47, TCP 502 from 10.22.0.13 only</text><text x="1210.0" y="228.9" font-size="12" font-weight="700" fill="#172b3a" text-anchor="middle">network contractor</text><text x="46.0" y="254.4" font-size="12" font-weight="400" fill="#172b3a" text-anchor="start">5 Protocol settings</text><text x="700.0" y="254.4" font-size="12" font-weight="700" fill="#172b3a" text-anchor="middle">Modbus TCP, unit 1, 500 ms time-out, 1 retry</text><text x="1210.0" y="254.4" font-size="12" font-weight="700" fill="#172b3a" text-anchor="middle">both owners</text><text x="46.0" y="279.8" font-size="12" font-weight="400" fill="#172b3a" text-anchor="start">6 Data list</text><text x="700.0" y="279.8" font-size="12" font-weight="700" fill="#172b3a" text-anchor="middle">30 items: register, type, scale, units, update rate</text><text x="1210.0" y="279.8" font-size="12" font-weight="700" fill="#172b3a" text-anchor="middle">CDU OEM</text><text x="46.0" y="305.2" font-size="12" font-weight="400" fill="#172b3a" text-anchor="start">7 Commands and authority</text><text x="700.0" y="305.2" font-size="12" font-weight="700" fill="#172b3a" text-anchor="middle">coil 00001 Remote_Enable only, priority 10</text><text x="1210.0" y="305.2" font-size="12" font-weight="700" fill="#172b3a" text-anchor="middle">engineer of record</text><text x="46.0" y="330.7" font-size="12" font-weight="400" fill="#172b3a" text-anchor="start">8 Failure behaviour</text><text x="700.0" y="330.7" font-size="12" font-weight="700" fill="#172b3a" text-anchor="middle">CDU keeps local setpoint; BMS marks stale, P2 after 60 s</text><text x="1210.0" y="330.7" font-size="12" font-weight="700" fill="#172b3a" text-anchor="middle">engineer of record</text><text x="46.0" y="356.1" font-size="12" font-weight="400" fill="#172b3a" text-anchor="start">9 Timing</text><text x="700.0" y="356.1" font-size="12" font-weight="700" fill="#172b3a" text-anchor="middle">leak alarm to operations centre within 10 s</text><text x="1210.0" y="356.1" font-size="12" font-weight="700" fill="#172b3a" text-anchor="middle">commissioning manager</text><text x="46.0" y="381.6" font-size="12" font-weight="400" fill="#172b3a" text-anchor="start">10 Security</text><text x="700.0" y="381.6" font-size="12" font-weight="700" fill="#172b3a" text-anchor="middle">no write except coil 00001; firewall rule</text><text x="1210.0" y="381.6" font-size="12" font-weight="700" fill="#172b3a" text-anchor="middle">OT security lead</text><text x="46.0" y="407.0" font-size="12" font-weight="400" fill="#172b3a" text-anchor="start">11 Versions</text><text x="700.0" y="407.0" font-size="12" font-weight="700" fill="#172b3a" text-anchor="middle">firmware 4.12.x, map v3.2, BMS server version</text><text x="1210.0" y="407.0" font-size="12" font-weight="700" fill="#172b3a" text-anchor="middle">both owners</text><text x="46.0" y="432.4" font-size="12" font-weight="400" fill="#172b3a" text-anchor="start">12 Tests</text><text x="700.0" y="432.4" font-size="12" font-weight="700" fill="#172b3a" text-anchor="middle">L3 P2P, L4 failover, L5 IST CDU loss</text><text x="1210.0" y="432.4" font-size="12" font-weight="700" fill="#172b3a" text-anchor="middle">commissioning manager</text><text x="46.0" y="457.9" font-size="12" font-weight="400" fill="#172b3a" text-anchor="start">13 Change history</text><text x="700.0" y="457.9" font-size="12" font-weight="700" fill="#172b3a" text-anchor="middle">rev A first issue, rev B map v3.2</text><text x="1210.0" y="457.9" font-size="12" font-weight="700" fill="#172b3a" text-anchor="middle">commissioning manager</text><text x="24.0" y="30.0" font-size="17" font-weight="700" fill="#172b3a" text-anchor="start">F25-3  Anatomy of an interface control document: thirteen sections and their writers</text><text x="24.0" y="48.0" font-size="11" font-weight="400" fill="#5b6b78" text-anchor="start">example ICD-25-021 rev B, CDU type 1 to BMS · Modbus TCP unit 1 · map CDU1-MB-MAP v3.2 for firmware 4.12.x · word order ABCD · heartbeat 40300, stale after 30 s</text><text x="32.0" y="502.2" font-size="10" font-weight="700" fill="#2d6a4f" text-anchor="start">WHAT TO PROVE</text><text x="32.0" y="518.2" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">• Sections 7 and 8 (commands and failure behaviour) are written by the engineer of record because they set what the BMS may do to the CDU and what each side does on loss of communication.</text><text x="32.0" y="533.2" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">• The firmware in section 11 must match the firmware read from the device on the test day; a different version stops the test.</text><rect x="24" y="566.1600000000001" width="1352" height="44" rx="0" fill="#f6f8fa" fill-opacity="1" stroke="#5b6b78" stroke-width="1"/><text x="32.0" y="580.2" font-size="11" font-weight="700" fill="#172b3a" text-anchor="start">F25-3  ·  Anatomy of an interface control document: thirteen sections and their writers</text><text x="1368.0" y="580.2" font-size="10" font-weight="400" fill="#5b6b78" text-anchor="end">Chapter 25 · §25.3</text><text x="32.0" y="593.2" font-size="9" font-weight="400" fill="#5b6b78" text-anchor="start">Data Centre Commissioning Field Manual R01 EN · October 2026 · educational reference, not to scale · project and OEM documents govern</text><text x="32.0" y="605.2" font-size="9" font-weight="400" fill="#5b6b78" text-anchor="start">Symbols: QElectroTech EN 60617 and P&amp;ID collections, CC-BY 3.0, native geometry · instrument bubbles per ISA 5.1 · states per IEC 60617 / IEEE C37.2 practice</text></svg>