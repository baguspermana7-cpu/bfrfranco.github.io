h site issue with its row</text><text x="950.0" y="446.5" font-size="13" font-weight="400" fill="#172b3a" text-anchor="start">to build the project distribution.</text><text x="24.0" y="30.0" font-size="17" font-weight="700" fill="#172b3a" text-anchor="start">F29-1  Issue library: number of rows per discipline (130 rows in 13 tables)</text><text x="24.0" y="48.0" font-size="11" font-weight="400" fill="#5b6b78" text-anchor="start">electrical 12 · generators 11 · UPS 11 · chilled water 11 · air 9 · CDU 10 · fire 9 · BMS 11 · EPMS 11 · integration 9 · network 10 · documentation 8 · process 8 · controls and integration group (BMS, EPMS, integration, network) 41 rows = 32 %</text><text x="32.0" y="692.6" font-size="10" font-weight="700" fill="#2d6a4f" text-anchor="start">WHAT TO PROVE</text><text x="32.0" y="708.6" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">• The 13 counts add up to 130 rows, the minimum of 120 issues required for the library is met.</text><text x="32.0" y="723.6" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">• BMS 11 + EPMS 11 + integration 9 + network 10 = 41 rows, 32 % of the library.</text><rect x="24" y="756.64" width="1352" height="44" rx="0" fill="#f6f8fa" fill-opacity="1" stroke="#5b6b78" stroke-width="1"/><text x="32.0" y="770.6" font-size="11" font-weight="700" fill="#172b3a" text-anchor="start">F29-1  ·  Issue library: number of rows per discipline (130 rows in 13 tables)</text><text x="1368.0" y="770.6" font-size="10" font-weight="400" fill="#5b6b78" text-anchor="end">Chapter 29 · §29.2</text><text x="32.0" y="783.6" font-size="9" font-weight="400" fill="#5b6b78" text-anchor="start">Data Centre Commissioning Field Manual R01 EN · October 2026 · educational reference, not to scale · project and OEM documents govern</text><text x="32.0" y="795.6" font-size="9" font-weight="400" fill="#5b6b78" text-anchor="start">Symbols: QElectroTech EN 60617 and P&amp;ID collections, CC-BY 3.0, native geometry · in