nt-size="11" font-weight="400" fill="#172b3a" text-anchor="start">100 to 0 %</text><text x="1146.8" y="179.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">+3.8 %</text><text x="1255.9" y="179.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">20 ms</text><text x="1005.0" y="201.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">limit</text><text x="1146.8" y="201.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">±5 %</text><text x="1255.9" y="201.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">50 ms</text><text x="24.0" y="30.0" font-size="17" font-weight="700" fill="#172b3a" text-anchor="start">F16-5  UPS step load test of B2-DH3-UPS-A1 in normal mode: 0 to 100 % and 100 to 0 % linear load</text><text x="24.0" y="48.0" font-size="11" font-weight="400" fill="#5b6b78" text-anchor="start">step on: minimum 398.0 V (-4.1 %), back inside ±1 % at 24 ms · step off: maximum 430.6 V (+3.8 %), back inside ±1 % at 20 ms · data-sheet limit ±5 % and 50 ms · half-cycle RMS recorder</text><text x="32.0" y="652.0" font-size="10" font-weight="700" fill="#2d6a4f" text-anchor="start">WHAT TO PROVE</text><text x="32.0" y="668.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">• Deviation on: (398.0 - 415) / 415 = -4.1 %; deviation off: (430.6 - 415) / 415 = +3.8 %; both inside ±5 %.</text><text x="32.0" y="683.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">• Recovery into ±1 % (410.9 to 419.2 V) at 24 ms and 20 ms, inside 50 ms; repeat the test in battery mode.</text><rect x="24" y="716" width="1352" height="44" rx="0" fill="#f6f8fa" fill-opacity="1" stroke="#5b6b78" stroke-width="1"/><text x="32.0" y="730.0" font-size="11" font-weight="700" fill="#172b3a" text-anchor="start">F16-5  ·  UPS step load test of B2-DH3-UPS-A1 in normal mode: 0 to 100 % and 100 to 0 % linear load</text><text x="1368.0" y="730.0" font-size="10" font-weight="400" fill="#5b6b78" text-anchor="end">Chapter 16 · §16.6</text><text x="32.0" y="743.0" font-size="9" font-weight="400" fill="#5b6b78" text-anchor="start">Data Centre Commissioning Field Manual R01 EN · October 2026 · educational reference, not to scale · project and OEM documents govern</text><text x="32.0" y="755.0" font-size="9" font-weight="400" fill="#5b6b78" text-anchor="start">Symbols: QElectroTech EN 60617 and P&amp;ID collections, CC-BY 3.0, native geometry · instrument bubbles per ISA 5.1 · states per IEC 60617 / IEEE C37.2 practice</text></svg>