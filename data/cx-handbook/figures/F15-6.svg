dth="0.8"/><rect x="535.3846153846154" y="746.0" width="176.9230769230769" height="22.0" rx="0" fill="#ffffff" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><rect x="712.3076923076923" y="746.0" width="247.69230769230768" height="22.0" rx="0" fill="#ffffff" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><text x="155.0" y="165.3" font-size="11.5" font-weight="700" fill="#172b3a" text-anchor="middle">Insulation tester 5 kV</text><text x="155.0" y="178.2" font-size="9.5" font-weight="400" fill="#172b3a" text-anchor="middle">5,000 V DC</text><text x="155.0" y="191.0" font-size="9.5" font-weight="400" fill="#172b3a" text-anchor="middle">1 min and 10 min readings</text><text x="530.0" y="158.9" font-size="11.5" font-weight="700" fill="#b45309" text-anchor="middle">Stator winding, 20 kV</text><text x="530.0" y="171.8" font-size="9.5" font-weight="400" fill="#172b3a" text-anchor="middle">U under test</text><text x="530.0" y="184.6" font-size="9.5" font-weight="400" fill="#172b3a" text-anchor="middle">V and W earthed</text><text x="530.0" y="197.4" font-size="9.5" font-weight="400" fill="#172b3a" text-anchor="middle">star point open, NER off</text><text x="860.0" y="171.8" font-size="11.5" font-weight="700" fill="#172b3a" text-anchor="middle">Frame and earth</text><text x="860.0" y="184.6" font-size="9.5" font-weight="400" fill="#172b3a" text-anchor="middle">bond ≤ 0.1 Ω</text><text x="335.0" y="172.0" font-size="10.5" font-weight="400" fill="#5b6b78" text-anchor="middle">line lead to U</text><text x="710.0" y="172.0" font-size="10.5" font-weight="400" fill="#5b6b78" text-anchor="middle">V, W</text><text x="500.0" y="272.0" font-size="10.5" font-weight="400" fill="#5b6b78" text-anchor="middle">earth lead to frame</text><text x="110.0" y="574.0" font-size="10" font-weight="400" fill="#5b6b78" text-anchor="middle">0</text><text x="305.2" y="574.0" font-size="10" font-weight="400" fill="#5b6b78" text-anchor="middle">2.5</text><text x="500.5" y="574.0" font-size="10" font-weight="400" fill="#5b6b78" text-anchor="middle">5</text><text x="695.7" y="574.0" font-size="10" font-weight="400" fill="#5b6b78" text-anchor="middle">7.5</text><text x="891.0" y="574.0" font-size="10" font-weight="400" fill="#5b6b78" text-anchor="middle">10</text><text x="104.0" y="564.0" font-size="10" font-weight="400" fill="#5b6b78" text-anchor="end">0</text><text x="104.0" y="518.0" font-size="10" font-weight="400" fill="#5b6b78" text-anchor="end">2000</text><text x="104.0" y="472.0" font-size="10" font-weight="400" fill="#5b6b78" text-anchor="end">4000</text><text x="104.0" y="426.0" font-size="10" font-weight="400" fill="#5b6b78" text-anchor="end">6000</text><text x="104.0" y="380.0" font-size="10" font-weight="400" fill="#5b6b78" text-anchor="end">8000</text><text x="104.0" y="334.0" font-size="10" font-weight="400" fill="#5b6b78" text-anchor="end">10000</text><text x="520.0" y="590.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="middle">time after voltage applied (min)</text><text transform="translate(66 445.0) rotate(-90)" font-size="11" text-anchor="middle" fill="#172b3a">insulation resistance (MΩ)</text><text x="138.0" y="608.0" font-size="10" font-weight="400" fill="#172b3a" text-anchor="start">phase U (example)</text><text x="138.0" y="623.0" font-size="10" font-weight="400" fill="#172b3a" text-anchor="start">minimum 100 MΩ at 40 °C</text><text x="884.0" y="341.5" font-size="10" font-weight="400" fill="#8a5a00" text-anchor="end">9,240 at 10 min</text><text x="45.0" y="673.0" font-size="11" font-weight="700" fill="#172b3a" text-anchor="start">Quantity</text><text x="363.5" y="673.0" font-size="11" font-weight="700" fill="#172b3a" text-anchor="start">Value</text><text x="540.4" y="673.0" font-size="11" font-weight="700" fill="#172b3a" text-anchor="start">Acceptance</text><text x="717.3" y="673.0" font-size="11" font-weight="700" fill="#172b3a" text-anchor="start">Source</text><text x="45.0" y="695.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">IR at 1 min, 28 °C</text><text x="363.5" y="695.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">3,850 MΩ</text><text x="540.4" y="695.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">—</text><text x="717.3" y="695.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">record ELE-L2-GEN-07</text><text x="45.0" y="717.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">IR at 1 min, corrected to 40 °C</text><text x="363.5" y="717.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">1,676 MΩ</text><text x="540.4" y="717.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">≥ 100 MΩ</text><text x="717.3" y="717.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">IEEE 43-2013</text><text x="45.0" y="739.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">PI = R10 / R1</text><text x="363.5" y="739.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">2.40</text><text x="540.4" y="739.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">≥ 2.0</text><text x="717.3" y="739.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">IEEE 43-2013</text><text x="45.0" y="761.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">Rotor and exciter at 500 V DC</text><text x="363.5" y="761.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">above 1 MΩ</text><text x="540.4" y="761.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">≥ 1 MΩ or OEM</text><text x="717.3" y="761.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">OEM manual</text><circle cx="891.0" cy="347.5" r="4" fill="#b7791f"/><text x="24.0" y="30.0" font-size="17" font-weight="700" fill="#172b3a" text-anchor="start">F15-6  Alternator stator insulation test of B2-GEN-07: connection and IR curve</text><text x="24.0" y="48.0" font-size="10" font-weight="400" fill="#5b6b78" text-anchor="start">20 kV stator · 5,000 V DC, each phase to earth with the other two earthed · star point and NER disconnected · winding 28 °C · 3,850 MΩ at 1 min, 9,240 MΩ at 10 min, PI</text><text x="24.0" y="61.0" font-size="10" font-weight="400" fill="#5b6b78" text-anchor="start">2.40 · minimum 100 MΩ at 40 °C (IEEE 43-2013, form-wound stator)</text><text x="32.0" y="804.0" font-size="10" font-weight="700" fill="#2d6a4f" text-anchor="start">WHAT TO PROVE</text><text x="32.0" y="820.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">• PI = 9,240 / 3,850 = 2.40, above the 2.0 minimum.</text><text x="32.0" y="835.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">• The 1-minute value corrected to 40 °C is about 1,676 MΩ, far above 100 MΩ.</text><text x="32.0" y="850.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">• The test is repeated for U, V and W and the three PI values are compared with each other.</text><text x="24.0" y="885.0" font-size="10" font-weight="700" fill="#5b6b78" text-anchor="start">LEGEND</text><line x1="24" y1="907.0" x2="50" y2="907.0" stroke="#b45309" stroke-width="3"/><text x="56.0" y="911.0" font-size="10" font-weight="400" fill="#172b3a" text-anchor="start">20 kV</text><rect x="24" y="925.0" width="952" height="44" rx="0" fill="#f6f8fa" fill-opacity="1" stroke="#5b6b78" stroke-width="1"/><text x="32.0" y="939.0" font-size="11" font-weight="700" fill="#172b3a" text-anchor="start">F15-6  ·  Alternator stator insulation test of B2-GEN-07: connection and IR curve</text><text x="968.0" y="939.0" font-size="10" font-weight="400" fill="#5b6b78" text-anchor="end">Chapter 15 · §15.4.2</text><text x="32.0" y="952.0" font-size="9" font-weight="400" fill="#5b6b78" text-anchor="start">Data Centre Commissioning Field Manual R01 EN · October 2026 · educational reference, not to scale · project and OEM documents govern</text><text x="32.0" y="964.0" font-size="9" font-weight="400" fill="#5b6b78" text-anchor="start">Symbols: QElectroTech EN 60617 and P&amp;ID collections, CC-BY 3.0, native geometry · instrument bubbles per ISA 5.1 · states per IEC 60617 / IEEE C37.2 practice</text></svg>