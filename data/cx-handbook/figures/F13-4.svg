ect x="564.3835616438357" y="610.0" width="253.15068493150682" height="22.0" rx="0" fill="#ffffff" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><rect x="817.5342465753425" y="610.0" width="325.47945205479454" height="22.0" rx="0" fill="#ffffff" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><rect x="1143.013698630137" y="610.0" width="216.986301369863" height="22.0" rx="0" fill="#ffffff" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><text x="185.0" y="198.9" font-size="11.5" font-weight="700" fill="#b91c1c" text-anchor="middle">Primary injection set</text><text x="185.0" y="211.8" font-size="9.5" font-weight="400" fill="#172b3a" text-anchor="middle">0 to 2000 A AC</text><text x="185.0" y="224.6" font-size="9.5" font-weight="400" fill="#172b3a" text-anchor="middle">timer start on injection</text><text x="185.0" y="237.4" font-size="9.5" font-weight="400" fill="#172b3a" text-anchor="middle">stop on relay trip contact</text><text x="185.0" y="371.8" font-size="11.5" font-weight="700" fill="#475569" text-anchor="middle">Reference clamp meter</text><text x="185.0" y="384.6" font-size="9.5" font-weight="400" fill="#172b3a" text-anchor="middle">class 1, on the loop</text><text x="569.0" y="167.0" font-size="12" font-weight="700" fill="#172b3a" text-anchor="start">Q11</text><text x="569.0" y="182.0" font-size="10" font-weight="400" fill="#5b6b78" text-anchor="start">racked to test or bolted loop</text><text x="1050.0" y="268.9" font-size="11.5" font-weight="700" fill="#475569" text-anchor="middle">Feeder relay Q11-F (P3 or equal)</text><text x="1050.0" y="281.8" font-size="9.5" font-weight="400" fill="#172b3a" text-anchor="middle">ANSI 50/51, 50N/51N</text><text x="1050.0" y="294.6" font-size="9.5" font-weight="400" fill="#172b3a" text-anchor="middle">CT primary 1500, secondary 1</text><text x="1050.0" y="307.4" font-size="9.5" font-weight="400" fill="#172b3a" text-anchor="middle">IsN 330 A, SI curve, TMS 0.10</text><text x="640.0" y="262.0" font-size="10.5" font-weight="400" fill="#5b6b78" text-anchor="start">S1 S2 via test block</text><text x="700.0" y="452.0" font-size="10.5" font-weight="400" fill="#5b6b78" text-anchor="middle">trip contact to test set timer stop</text><text x="45.0" y="515.0" font-size="11" font-weight="700" fill="#172b3a" text-anchor="start">Step</text><text x="280.1" y="515.0" font-size="11" font-weight="700" fill="#172b3a" text-anchor="start">Injected primary</text><text x="569.4" y="515.0" font-size="11" font-weight="700" fill="#172b3a" text-anchor="start">Expected secondary</text><text x="822.5" y="515.0" font-size="11" font-weight="700" fill="#172b3a" text-anchor="start">Relay display (example)</text><text x="1148.0" y="515.0" font-size="11" font-weight="700" fill="#172b3a" text-anchor="start">Result</text><text x="45.0" y="537.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">Ratio L1</text><text x="280.1" y="537.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">300 A</text><text x="569.4" y="537.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">0.200 A</text><text x="822.5" y="537.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">301 A / 0.201 A</text><text x="1148.0" y="537.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">pass</text><text x="45.0" y="559.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">Ratio L2</text><text x="280.1" y="559.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">300 A</text><text x="569.4" y="559.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">0.200 A</text><text x="822.5" y="559.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">299 A / 0.199 A</text><text x="1148.0" y="559.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">pass</text><text x="45.0" y="581.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">Earth path L1 to N</text><text x="280.1" y="581.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">100 A</text><text x="569.4" y="581.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">0.067 A residual</text><text x="822.5" y="581.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">100 A earth current</text><text x="1148.0" y="581.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">pass</text><text x="45.0" y="603.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">51N pick-up</text><text x="280.1" y="603.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">ramp L1 to 330 A (IsN = 0.22 In)</text><text x="569.4" y="603.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">0.220 A residual</text><text x="822.5" y="603.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">start at 331 A</text><text x="1148.0" y="603.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">pass, error +0.3 %</text><text x="45.0" y="625.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">51N timing at 2 x IsN</text><text x="280.1" y="625.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">660 A on L1</text><text x="569.4" y="625.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">0.440 A residual</text><text x="822.5" y="625.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">trip 1.01 s (expected 1.00 s)</text><text x="1148.0" y="625.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">pass</text><text x="24.0" y="30.0" font-size="17" font-weight="700" fill="#172b3a" text-anchor="start">F13-4  Primary injection of feeder Q11: test set, CT 1500/1 A, relay and the trip circuit</text><text x="24.0" y="48.0" font-size="11" font-weight="400" fill="#5b6b78" text-anchor="start">high-current test set 0 to 2000 A AC · injection loop through the feeder CT with the cable disconnected and earthed · reference CT or clamp meter on the loop · relay reads secondary current; 300 A primary gives 0.200 A secondary</text><text x="32.0" y="668.0" font-size="10" font-weight="700" fill="#2d6a4f" text-anchor="start">WHAT TO PROVE</text><text x="32.0" y="684.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">• At 300 A primary the relay must show 0.200 A secondary and 300 A primary on its display, within the CT class and relay metering accuracy (example limit ±3 %).</text><text x="32.0" y="699.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">• A wrong CT ratio set in the relay (for example 1250/1) shows 360 A on the display for 300 A injected; this error is invisible in secondary injection.</text><text x="24.0" y="734.0" font-size="10" font-weight="700" fill="#5b6b78" text-anchor="start">LEGEND</text><g transform="translate(38.9 755.0) scale(0.3)"><line x1="0" y1="-20" x2="0" y2="-40" stroke="#172b3a" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/><line x1="0" y1="0" x2="0" y2="20" stroke="#172b3a" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/><line x1="0" y1="0" x2="-8" y2="-23" stroke="#172b3a" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/><line x1="-2" y1="-22" x2="2" y2="-18" stroke="#172b3a" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/><line x1="2" y1="-22" x2="-2" y2="-18" stroke="#172b3a" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/></g><text x="58.0" y="756.0" font-size="10" font-weight="400" fill="#172b3a" text-anchor="start">Circuit breaker</text><g transform="translate(380.5 761.0) scale(0.3)"><line x1="-30" y1="-60" x2="-30" y2="0" stroke="#172b3a" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/><line x1="-20" y1="-30" x2="10" y2="-30" stroke="#172b3a" stroke-width="1.8" fill="none" stroke-li