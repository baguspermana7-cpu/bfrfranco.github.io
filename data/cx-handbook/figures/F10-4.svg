3a" text-anchor="middle">open</text><text x="46.0" y="477.5" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">15 EPMS points</text><text x="470.0" y="477.5" font-size="11" font-weight="700" fill="#172b3a" text-anchor="middle">temporary meter</text><text x="700.0" y="477.5" font-size="11" font-weight="700" fill="#172b3a" text-anchor="middle">risk accepted</text><text x="46.0" y="500.8" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">16 Statutory inspection</text><text x="470.0" y="500.8" font-size="11" font-weight="700" fill="#172b3a" text-anchor="middle">Ahli K3 report</text><text x="700.0" y="500.8" font-size="11" font-weight="700" fill="#172b3a" text-anchor="middle">closed</text><text x="890.0" y="143.8" font-size="11.5" font-weight="700" fill="#b7791f" text-anchor="start">ERB decision ERB-B1-021</text><text x="890.0" y="159.9" font-size="11.5" font-weight="400" fill="#172b3a" text-anchor="start">Approve with condition: criterion 14 closed by 31 Oct 17:00.</text><text x="890.0" y="175.4" font-size="11.5" font-weight="400" fill="#172b3a" text-anchor="start">Risk acceptance 8: four snag items in the room, none in the panel line-up.</text><text x="890.0" y="191.0" font-size="11.5" font-weight="400" fill="#172b3a" text-anchor="start">Risk acceptance 15: temporary meter on P03 until EPMS point test.</text><text x="885.0" y="345.0" font-size="11" font-weight="700" fill="#172b3a" text-anchor="start">Count</text><text x="1000.0" y="345.0" font-size="11" font-weight="700" fill="#172b3a" text-anchor="start">Status</text><text x="885.0" y="367.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">13</text><text x="1000.0" y="367.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">closed with record</text><text x="885.0" y="389.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">2</text><text x="1000.0" y="389.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">risk accepted by owner</text><text x="885.0" y="411.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">1</text><text x="1000.0" y="411.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">open, condition</text><text x="24.0" y="30.0" font-size="17" font-weight="700" fill="#172b3a" text-anchor="start">F10-4  Energisation readiness gate: 16 criteria reviewed by the ERB for ring R1 (example status)</text><text x="24.0" y="48.0" font-size="11" font-weight="400" fill="#5b6b78" text-anchor="start">13 closed with a signed record · 2 closed with an owner risk acceptance · 1 open (notice to trades due 31 Oct) · decision: approve with condition · energisation 2 Nov 2026 09:00</text><text x="32.0" y="544.4" font-size="10" font-weight="700" fill="#2d6a4f" text-anchor="start">WHAT TO PROVE</text><text x="32.0" y="560.4" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">• Criteria 2 to 5 (cable, switchgear, relay and CT/VT tests) need signed reports; a draft report counts as open.</text><text x="32.0" y="575.4" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">• The condition on the approval is criterion 14: the notice to trades must be issued 48 hours before step 1, or the switching does not start.</text><rect x="24" y="608.44" width="1352" height="44" rx="0" fill="#f6f8fa" fill-opacity="1" stroke="#5b6b78" stroke-width="1"/><text x="32.0" y="622.4" font-size="11" font-weight="700" fill="#172b3a" text-anchor="start">F10-4  ·  Energisation readiness gate: 16 criteria reviewed by the ERB for ring R1 (example status)</text><text x="1368.0" y="622.4" font-size="10" font-weight="400" fill="#5b6b78" text-anchor="end">Chapter 10 · §10.5</text><text x="32.0" y="635.4" font-size="9" font-weight="400" fill="#5b6b78" text-anchor="start">Data Centre Commissioning Field Manual R01 EN · October 2026 · educational reference, not to scale · project and OEM documents govern</text><text x="32.0" y="647.4" font-size="9" font-weight="400" fill="#5b6b78" text-anchor="start">Symbols: QElectroTech EN 60617 and P&amp;ID collections, CC-BY 3.0, native geometry · instrument bubbles per ISA 5.1 · states per IEC 60617 / IEEE C37.2 practice</text></svg>