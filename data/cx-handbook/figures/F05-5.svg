h="0.8" stroke-dasharray="3 3"/><line x1="992.3" y1="120" x2="992.3" y2="306" stroke="#d7dee4" stroke-width="0.8" stroke-dasharray="3 3"/><line x1="1079.2" y1="120" x2="1079.2" y2="306" stroke="#d7dee4" stroke-width="0.8" stroke-dasharray="3 3"/><line x1="1166.2" y1="120" x2="1166.2" y2="306" stroke="#d7dee4" stroke-width="0.8" stroke-dasharray="3 3"/><line x1="1253.1" y1="120" x2="1253.1" y2="306" stroke="#d7dee4" stroke-width="0.8" stroke-dasharray="3 3"/><line x1="1340.0" y1="120" x2="1340.0" y2="306" stroke="#d7dee4" stroke-width="0.8" stroke-dasharray="3 3"/><rect x="24" y="384.76" width="1352" height="56" rx="4" fill="#f1f8f4" fill-opacity="1" stroke="#2d6a4f" stroke-width="1"/><line x1="296.9" y1="128" x2="296.9" y2="174" stroke="#334155" stroke-width="2.4"/><circle cx="296.9" cy="151.0" r="4" fill="#334155"/><line x1="470.8" y1="128" x2="470.8" y2="174" stroke="#475569" stroke-width="2.4"/><circle cx="470.8" cy="151.0" r="4" fill="#475569"/><line x1="644.6" y1="190" x2="644.6" y2="236" stroke="#475569" stroke-width="2.4"/><circle cx="644.6" cy="213.0" r="4" fill="#475569"/><line x1="905.4" y1="252" x2="905.4" y2="298" stroke="#b91c1c" stroke-width="2.4"/><circle cx="905.4" cy="275.0" r="4" fill="#b91c1c"/><line x1="1079.2" y1="252" x2="1079.2" y2="298" stroke="#b91c1c" stroke-width="2.4"/><circle cx="1079.2" cy="275.0" r="4" fill="#b91c1c"/><text x="68.0" y="155.0" font-size="11" font-weight="700" fill="#172b3a" text-anchor="start">CDE and RFI manager</text><text x="68.0" y="217.0" font-size="11" font-weight="700" fill="#172b3a" text-anchor="start">Meetings</text><text x="68.0" y="279.0" font-size="11" font-weight="700" fill="#172b3a" text-anchor="start">Contract and owner</text><text x="210.0" y="320.0" font-size="10" font-weight="400" fill="#5b6b78" text-anchor="middle">-3 WD</text><text x="296.9" y="320.0" font-size="10" font-weight="400" fill="#5b6b78" text-anchor="middle">-2 WD</text><text x="383.8" y="320.0" font-size="10" font-weight="400" fill="#5b6b78" text-anchor="middle">-1 WD</text><text x="470.8" y="320.0" font-size="10" font-weight="400" fill="#5b6b78" text-anchor="middle">0 WD</text><text x="557.7" y="320.0" font-size="10" font-weight="400" fill="#5b6b78" text-anchor="middle">1 WD</text><text x="644.6" y="320.0" font-size="10" font-weight="400" fill="#5b6b78" text-anchor="middle">2 WD</text><text x="731.5" y="320.0" font-size="10" font-weight="400" fill="#5b6b78" text-anchor="middle">3 WD</text><text x="818.5" y="320.0" font-size="10" font-weight="400" fill="#5b6b78" text-anchor="middle">4 WD</text><text x="905.4" y="320.0" font-size="10" font-weight="400" fill="#5b6b78" text-anchor="middle">5 WD</text><text x="992.3" y="320.0" font-size="10" font-weight="400" fill="#5b6b78" text-anchor="middle">6 WD</text><text x="1079.2" y="320.0" font-size="10" font-weight="400" fill="#5b6b78" text-anchor="middle">7 WD</text><text x="1166.2" y="320.0" font-size="10" font-weight="400" fill="#5b6b78" text-anchor="middle">8 WD</text><text x="1253.1" y="320.0" font-size="10" font-weight="400" fill="#5b6b78" text-anchor="middle">9 WD</text><text x="1340.0" y="320.0" font-size="10" font-weight="400" fill="#5b6b78" text-anchor="middle">10 WD</text><text x="303.9" y="155.0" font-size="10" font-weight="400" fill="#334155" text-anchor="start">automatic reminder</text><text x="477.8" y="155.0" font-size="10" font-weight="400" fill="#475569" text-anchor="start">due date: call, committed date</text><text x="651.6" y="217.0" font-size="10" font-weight="400" fill="#475569" text-anchor="start">listed at weekly meeting</text><text x="912.4" y="279.0" font-size="10" font-weight="400" fill="#b91c1c" text-anchor="start">letter; consider notice</text><text x="1086.2" y="279.0" font-size="10" font-weight="400" fill="#b91c1c" text-anchor="start">owner decides or instructs</text><text x="60.0" y="360.0" font-size="11.5" font-weight="400" fill="#5b6b78" text-anchor="start">WD = working days relative to the response due date (0). Negative values are before the due date.</text><text x="24.0" y="30.0" font-size="17" font-weight="700" fill="#172b3a" text-anchor="start">F05-5  Escalation ladder for an overdue RFI</text><text x="24.0" y="48.0" font-size="11" font-weight="400" fill="#5b6b78" text-anchor="start">Reminder at due date minus 2 working days · call at the due date · weekly meeting at plus 2 · letter and contract notice at plus 5 or at the required-by date</text><text x="32.0" y="398.8" font-size="10" font-weight="700" fill="#2d6a4f" text-anchor="start">WHAT TO PROVE</text><text x="32.0" y="414.8" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">• The contractor considers a contract notice (NEC early warning, FIDIC Sub-Clause 1.9 notice) when the RFI is 5 working days overdue or the required-by date is reached.</text><text x="32.0" y="429.8" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">• The owner&#x27;s representative decides or instructs by site instruction when the required-by date has passed and the activity is stopped.</text><rect x="24" y="462.76" width="1352" height="44" rx="0" fill="#f6f8fa" fill-opacity="1" stroke="#5b6b78" stroke-width="1"/><text x="32.0" y="476.8" font-size="11" font-weight="700" fill="#172b3a" text-anchor="start">F05-5  ·  Escalation ladder for an overdue RFI</text><text x="1368.0" y="476.8" font-size="10" font-weight="400" fill="#5b6b78" text-anchor="end">Chapter 05 · §05.6</text><text x="32.0" y="489.8" font-size="9" font-weight="400" fill="#5b6b78" text-anchor="start">Data Centre Commissioning Field Manual R01 EN · October 2026 · educational reference, not to scale · project and OEM documents govern</text><text x="32.0" y="501.8" font-size="9" font-weight="400" fill="#5b6b78" text-anchor="start">Symbols: QElectroTech EN 60617 and P&amp;ID collections, CC-BY 3.0, native geometry · instrument bubbles per ISA 5.1 · states per IEC 60617 / IEEE C37.2 practice</text></svg>