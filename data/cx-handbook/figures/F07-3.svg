fill="#ffffff" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><rect x="1055.5555555555557" y="580.0" width="284.44444444444446" height="22.0" rx="0" fill="#ffffff" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><rect x="60" y="602.0" width="355.5555555555556" height="22.0" rx="0" fill="#ffffff" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><rect x="415.5555555555556" y="602.0" width="640.0000000000001" height="22.0" rx="0" fill="#ffffff" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><rect x="1055.5555555555557" y="602.0" width="284.44444444444446" height="22.0" rx="0" fill="#ffffff" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><rect x="60" y="624.0" width="355.5555555555556" height="22.0" rx="0" fill="#ffffff" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><rect x="415.5555555555556" y="624.0" width="640.0000000000001" height="22.0" rx="0" fill="#ffffff" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><rect x="1055.5555555555557" y="624.0" width="284.44444444444446" height="22.0" rx="0" fill="#ffffff" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><text x="190.0" y="151.7" font-size="12" font-weight="700" fill="#172b3a" text-anchor="middle">Not reached</text><text x="190.0" y="165.2" font-size="10" font-weight="400" fill="#172b3a" text-anchor="middle">work in progress</text><text x="520.0" y="144.9" font-size="12" font-weight="700" fill="#172b3a" text-anchor="middle">Ready</text><text x="520.0" y="158.4" font-size="10" font-weight="400" fill="#172b3a" text-anchor="middle">self-inspected</text><text x="520.0" y="171.9" font-size="10" font-weight="400" fill="#172b3a" text-anchor="middle">checklist signed</text><text x="850.0" y="144.9" font-size="12" font-weight="700" fill="#172b3a" text-anchor="middle">Notified</text><text x="850.0" y="158.4" font-size="10" font-weight="400" fill="#172b3a" text-anchor="middle">IR time-stamped</text><text x="850.0" y="171.9" font-size="10" font-weight="400" fill="#172b3a" text-anchor="middle">notice running</text><text x="1180.0" y="151.7" font-size="12" font-weight="700" fill="#172b3a" text-anchor="middle">Inspected</text><text x="1180.0" y="165.2" font-size="10" font-weight="400" fill="#172b3a" text-anchor="middle">joint inspection</text><text x="190.0" y="354.9" font-size="12" font-weight="700" fill="#172b3a" text-anchor="middle">Bypassed</text><text x="190.0" y="368.4" font-size="10" font-weight="400" fill="#172b3a" text-anchor="middle">work started</text><text x="190.0" y="381.9" font-size="10" font-weight="400" fill="#172b3a" text-anchor="middle">without release</text><text x="520.0" y="354.9" font-size="12" font-weight="700" fill="#172b3a" text-anchor="middle">Rejected</text><text x="520.0" y="368.4" font-size="10" font-weight="400" fill="#172b3a" text-anchor="middle">code C</text><text x="520.0" y="381.9" font-size="10" font-weight="400" fill="#172b3a" text-anchor="middle">defects listed</text><text x="850.0" y="361.7" font-size="12" font-weight="700" fill="#172b3a" text-anchor="middle">Conditionally released</text><text x="850.0" y="375.2" font-size="10" font-weight="400" fill="#172b3a" text-anchor="middle">condition and due step</text><text x="1180.0" y="354.9" font-size="12" font-weight="700" fill="#172b3a" text-anchor="middle">Released</text><text x="1180.0" y="368.4" font-size="10" font-weight="400" fill="#172b3a" text-anchor="middle">code A or B</text><text x="1180.0" y="381.9" font-size="10" font-weight="400" fill="#172b3a" text-anchor="middle">signed, timed</text><text x="65.0" y="485.0" font-size="11" font-weight="700" fill="#172b3a" text-anchor="start">Transition</text><text x="420.6" y="485.0" font-size="11" font-weight="700" fill="#172b3a" text-anchor="start">Action</text><text x="1060.6" y="485.0" font-size="11" font-weight="700" fill="#172b3a" text-anchor="start">Who</text><text x="65.0" y="507.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">Not reached to ready</text><text x="420.6" y="507.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">subcontractor completes work and signs the checklist</text><text x="1060.6" y="507.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">subcontractor QC</text><text x="65.0" y="529.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">Ready to notified</text><text x="420.6" y="529.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">IR submitted; document control time stamp</text><text x="1060.6" y="529.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">GC QA/QC</text><text x="65.0" y="551.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">Notified to inspected</text><text x="420.6" y="551.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">joint inspection at the notified time</text><text x="1060.6" y="551.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">H-column party</text><text x="65.0" y="573.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">Inspected to released</text><text x="420.6" y="573.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">code A or B written and signed on the IR</text><text x="1060.6" y="573.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">release authority</text><text x="65.0" y="595.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">Inspected to rejected, then ready</text><text x="420.6" y="595.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">code C; correction; re-inspection IR R1</text><text x="1060.6" y="595.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">release authority, subcontractor</text><text x="65.0" y="617.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">Inspected to conditionally released</text><text x="420.6" y="617.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">written condition, step before which it closes, verifier</text><text x="1060.6" y="617.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">release authority</text><text x="65.0" y="639.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">Not reached to bypassed</text><text x="420.6" y="639.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">next activity started without release; NCR and CAR raised</text><text x="1060.6" y="639.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">found by QC walk</text><text x="24.0" y="30.0" font-size="17" font-weight="700" fill="#172b3a" text-anchor="start">F07-3  Hold-point release states and the transitions that move a hold point between them</text><text x="24.0" y="48.0" font-size="11" font-weight="400" fill="#5b6b78" text-anchor="start">only the party in the H column releases · release in writing with signature, date and time · conditional release only when the open item does not affect safety at the next step · a bypassed hold point raises an NCR and a CAR</text><text x="32.0" y="682.0" font-size="10" font-weight="700" fill="#2d6a4f" text-anchor="start">WHAT TO PROVE</text><text x="32.0" y="698.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">• The transition from &quot;inspected&quot; to &quot;released&quot; needs code A or B signed by the named release authority; code C returns the item to &quot;rejected&quot; and then to &quot;ready&quot; after correction.</text><text x="32.0" y="713.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">• In the MSC-1 example, backfilling 42 m of duct bank past an unreleased hold point cost USD 6,570 to expose and reinstate, borne by the contractor.</text><text x="24.0" y="748.0" font-size="10" font-weight="700" fill="#5b6b78" text-anchor="start">LEGEND</text><line x1="24" y1="770.0" x2="50" y2="770.0" stroke="#475569" stroke-width="3"/><text x="56.0" y="774.0" font-size="10" font-weight="400" fill="#172b3a" text-anchor="start">signal / control</text><line x1="151.9671875" y1="770.0" x2="177.9671875" y2="770.0" stroke="#b91c1c" stroke-width="3"/><text x="184.0" y="774.0" font-size="10" font-weight="400" fill="#172b3a" text-anchor="start">trip / protection</text><rect x="24" y="788.0" width="1352" height="44" rx="0" fill="#f6f8fa" fill-opacity="1" stroke="#5b6b78" stroke-width="1"/><text x="32.0" y="802.0" font-size="11" font-weight="700" fill="#172b3a" text-anchor="start">F07-3  ·  Hold-point release states and the transitions that move a hold point between them</text><text x="1368.0" y="802.0" font-size="10" font-weight="400" fill="#5b6b78" text-anchor="end">Chapter 07 · §07.6</text><text x="32.0" y="815.0" font-size="9" font-weight="400" fill="#5b6b78" text-anchor="start">Data Centre Commissioning Field Manual R01 EN · October 2026 · educational reference, not to scale · project and OEM documents govern</text><text x="32.0" y="827.0" font-size="9" font-weight="400" fill="#5b6b78" text-anchor="start">Symbols: QElectroTech EN 60617 and P&amp;ID collections, CC-BY 3.0, native geometry · instrument bubbles per ISA 5.1 · states per IEC 60617 / IEEE C37.2 practice</text></svg>