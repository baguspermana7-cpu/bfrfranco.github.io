<svg xmlns="http://www.w3.org/2000/svg" width="174mm" height="93.4mm" viewBox="0 0 1000 537" font-family="DejaVu Sans" role="img" aria-labelledby="t"><title id="t">F21-4 Modbus 32-bit word order: the value 24.2 L/s read in four orders</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="context-stroke"/></marker><marker id="arrow-simple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#172b3a"/></marker></defs><rect width="1000" height="537" fill="#ffffff"/><rect x="4" y="4" width="992" height="529" fill="none" stroke="#172b3a" stroke-width="1.6"/><rect x="24" y="399.2" width="952" height="56" rx="4" fill="#f1f8f4" fill-opacity="1" stroke="#2d6a4f" stroke-width="1"/><rect x="40" y="110" width="920" height="127.2" rx="0" fill="#ffffff" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><rect x="290" y="110" width="200" height="25.44" rx="0" fill="#e9f0f4" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><rect x="490" y="110" width="220" height="25.44" rx="0" fill="#e9f0f4" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><rect x="710" y="110" width="250" height="25.44" rx="0" fill="#e9f0f4" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><rect x="40" y="135.44" width="250" height="25.44" rx="0" fill="#e9f0f4" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><rect x="290" y="135.44" width="200" height="25.44" rx="0" fill="#ffffff" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><rect x="490" y="135.44" width="220" height="25.44" rx="0" fill="#ffffff" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><rect x="710" y="135.44" width="250" height="25.44" rx="0" fill="#ffffff" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><rect x="40" y="160.88" width="250" height="25.44" rx="0" fill="#e9f0f4" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><rect x="290" y="160.88" width="200" height="25.44" rx="0" fill="#ffffff" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><rect x="490" y="160.88" width="220" height="25.44" rx="0" fill="#ffffff" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><rect x="710" y="160.88" width="250" height="25.44" rx="0" fill="#ffffff" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><rect x="40" y="186.32" width="250" height="25.44" rx="0" fill="#e9f0f4" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><rect x="290" y="186.32" width="200" height="25.44" rx="0" fill="#ffffff" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><rect x="490" y="186.32" width="220" height="25.44" rx="0" fill="#ffffff" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><rect x="710" y="186.32" width="250" height="25.44" rx="0" fill="#ffffff" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><rect x="40" y="211.76" width="250" height="25.44" rx="0" fill="#e9f0f4" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><rect x="290" y="211.76" width="200" height="25.44" rx="0" fill="#ffffff" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><rect x="490" y="211.76" width="220" height="25.44" rx="0" fill="#ffffff" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><rect x="710" y="211.76" width="250" height="25.44" rx="0" fill="#ffffff" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><rect x="40" y="267.2" width="541.1764705882354" height="22.0" rx="0" fill="#e9f0f4" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><rect x="581.1764705882354" y="267.2" width="378.8235294117647" height="22.0" rx="0" fill="#e9f0f4" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><rect x="40" y="289.2" width="541.1764705882354" height="22.0" rx="0" fill="#ffffff" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><rect x="581.1764705882354" y="289.2" width="378.8235294117647" height="22.0" rx="0" fill="#ffffff" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><rect x="40" y="311.2" width="541.1764705882354" height="22.0" rx="0" fill="#ffffff" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><rect x="581.1764705882354" y="311.2" width="378.8235294117647" height="22.0" rx="0" fill="#ffffff" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><rect x="40" y="333.2" width="541.1764705882354" height="22.0" rx="0" fill="#ffffff" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><rect x="581.1764705882354" y="333.2" width="378.8235294117647" height="22.0" rx="0" fill="#ffffff" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><rect x="40" y="355.2" width="541.1764705882354" height="22.0" rx="0" fill="#ffffff" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><rect x="581.1764705882354" y="355.2" width="378.8235294117647" height="22.0" rx="0" fill="#ffffff" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><text x="390.0" y="127.2" font-size="11" font-weight="700" fill="#172b3a" text-anchor="middle">Bytes as combined</text><text x="600.0" y="127.2" font-size="11" font-weight="700" fill="#172b3a" text-anchor="middle">Value shown by BMS</text><text x="835.0" y="127.2" font-size="11" font-weight="700" fill="#172b3a" text-anchor="middle">Verdict</text><text x="46.0" y="152.6" font-size="12" font-weight="400" fill="#172b3a" text-anchor="start">ABCD (no swap)</text><text x="390.0" y="152.6" font-size="12" font-weight="700" fill="#172b3a" text-anchor="middle">0x41C1999A</text><text x="600.0" y="152.6" font-size="12" font-weight="700" fill="#172b3a" text-anchor="middle">24.2</text><text x="835.0" y="152.6" font-size="12" font-weight="700" fill="#172b3a" text-anchor="middle">matches the display: correct</text><text x="46.0" y="178.0" font-size="12" font-weight="400" fill="#172b3a" text-anchor="start">CDAB (word swap)</text><text x="390.0" y="178.0" font-size="12" font-weight="700" fill="#172b3a" text-anchor="middle">0x999A41C1</text><text x="600.0" y="178.0" font-size="12" font-weight="700" fill="#172b3a" text-anchor="middle">-1.59498e-23</text><text x="835.0" y="178.0" font-size="12" font-weight="700" fill="#172b3a" text-anchor="middle">rejected: reads as 0.00 L/s</text><text x="46.0" y="203.5" font-size="12" font-weight="400" fill="#172b3a" text-anchor="start">BADC (byte swap)</text><text x="390.0" y="203.5" font-size="12" font-weight="700" fill="#172b3a" text-anchor="middle">0xC1419A99</text><text x="600.0" y="203.5" font-size="12" font-weight="700" fill="#172b3a" text-anchor="middle">-12.1002</text><text x="835.0" y="203.5" font-size="12" font-weight="700" fill="#172b3a" text-anchor="middle">rejected: negative flow</text><text x="46.0" y="228.9" font-size="12" font-weight="400" fill="#172b3a" text-anchor="start">DCBA (byte and word swap)</text><text x="390.0" y="228.9" font-size="12" font-weight="700" fill="#172b3a" text-anchor="middle">0x9A99C141</text><text x="600.0" y="228.9" font-size="12" font-weight="700" fill="#172b3a" text-anchor="middle">-6.35915e-23</text><text x="835.0" y="228.9" font-size="12" font-weight="700" fill="#172b3a" text-anchor="middle">rejected: reads as 0.00 L/s</text><text x="45.0" y="282.2" font-size="11" font-weight="700" fill="#172b3a" text-anchor="start">Step at the L3 data test</text><text x="586.2" y="282.2" font-size="11" font-weight="700" fill="#172b3a" text-anchor="start">Value used in this example</text><text x="45.0" y="304.2" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">Read the value on the CDU local display</text><text x="586.2" y="304.2" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">24.2 L/s</text><text x="45.0" y="326.2" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">Read the two registers with function code 03</text><text x="586.2" y="326.2" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">0x41C1 then 0x999A</text><text x="45.0" y="348.2" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">Set the order in the client to the map (ABCD)</text><text x="586.2" y="348.2" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">BMS shows 24.2 L/s</text><text x="45.0" y="370.2" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">Record the order in ICD-25-021</text><text x="586.2" y="370.2" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">word order ABCD</text><text x="24.0" y="30.0" font-size="17" font-weight="700" fill="#172b3a" text-anchor="start">F21-4  Modbus 32-bit word order: the value 24.2 L/s read in four orders</text><text x="24.0" y="48.0" font-size="10" font-weight="400" fill="#5b6b78" text-anchor="start">CDU 07 TCS flow, 24.2 L/s per 1 MW CDU at 45/55 °C (MSC-1 ledger) · FLOAT32 IEEE 754 = 0x41C1999A · holding registers 40201 and 40202 · register 1 holds 0x41C1 and</text><text x="24.0" y="61.0" font-size="10" font-weight="400" fill="#5b6b78" text-anchor="start">register 2 holds 0x999A in ABCD order</text><text x="32.0" y="413.2" font-size="10" font-weight="700" fill="#2d6a4f" text-anchor="start">WHAT TO PROVE</text><text x="32.0" y="429.2" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">• ABCD gives 24.2 L/s, the value on the CDU display; CDAB gives about −1.6 × 10^-23, which a graphic shows as 0.00 L/s, and BADC gives −12.1 L/s.</text><text x="32.0" y="444.2" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">• A swapped order can give a number close to zero that looks like a stopped pump; every FLOAT32 point is therefore compared with the device display at L3.</text><rect x="24" y="477.2" width="952" height="44" rx="0" fill="#f6f8fa" fill-opacity="1" stroke="#5b6b78" stroke-width="1"/><text x="32.0" y="491.2" font-size="11" font-weight="700" fill="#172b3a" text-anchor="start">F21-4  ·  Modbus 32-bit word order: the value 24.2 L/s read in four orders</text><text x="968.0" y="491.2" font-size="10" font-weight="400" fill="#5b6b78" text-anchor="end">Chapter 21 · §21.7</text><text x="32.0" y="504.2" font-size="9" font-weight="400" fill="#5b6b78" text-anchor="start">Data Centre Commissioning Field Manual R01 EN · October 2026 · educational reference, not to scale · project and OEM documents govern</text><text x="32.0" y="516.2" font-size="9" font-weight="400" fill="#5b6b78" text-anchor="start">Symbols: QElectroTech EN 60617 and P&amp;ID collections, CC-BY 3.0, native geometry · instrument bubbles per ISA 5.1 · states per IEC 60617 / IEEE C37.2 practice</text></svg>