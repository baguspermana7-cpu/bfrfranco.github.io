3 510.0 A7 7 0 0 1 847 510.0" fill="none" stroke="#172b3a" stroke-width="2"/><text x="24.0" y="30.0" font-size="17" font-weight="700" fill="#172b3a" text-anchor="start">F11-2  Report data flow: registers, cut-off times and the reports they feed</text><text x="24.0" y="48.0" font-size="11" font-weight="400" fill="#5b6b78" text-anchor="start">checklist and test registers cut-off daily 15:00 and Friday 12:00 · P6 update Thursday · PTW register 17:00 · daily report 16:00 · weekly report Friday 17:00 · one owner per register</text><text x="32.0" y="648.0" font-size="10" font-weight="700" fill="#2d6a4f" text-anchor="start">WHAT TO PROVE</text><text x="32.0" y="664.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">• The weekly report totals agree with the checklist and test registers at the Friday 12:00 cut-off.</text><text x="32.0" y="679.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">• The S-curve baseline comes from the P6 baseline and is never edited when progress is updated.</text><text x="24.0" y="714.0" font-size="10" font-weight="700" fill="#5b6b78" text-anchor="start">LEGEND</text><line x1="24" y1="736" x2="50" y2="736" stroke="#334155" stroke-width="3"/><text x="56.0" y="740.0" font-size="10" font-weight="400" fill="#172b3a" text-anchor="start">data / network</text><line x1="150.859375" y1="736" x2="176.859375" y2="736" stroke="#475569" stroke-width="3"/><text x="182.9" y="740.0" font-size="10" font-weight="400" fill="#172b3a" text-anchor="start">signal / control</text><rect x="24" y="754" width="1352" height="44" rx="0" fill="#f6f8fa" fill-opacity="1" stroke="#5b6b78" stroke-width="1"/><text x="32.0" y="768.0" font-size="11" font-weight="700" fill="#172b3a" text-anchor="start">F11-2  ·  Report data flow: registers, cut-off times and the reports they feed</text><text x="1368.0" y="768.0" font-size="10" font-weight="400" fill="#5b6b78" text-anchor="end">Chapter 11 · §11.10</text><text x="32.0" y="781.0" font-size="9" fo