0" y="258.4" font-size="12" font-weight="700" fill="#334155" text-anchor="middle">STG</text><text x="501.0" y="302.0" font-size="10.5" font-weight="400" fill="#5b6b78" text-anchor="middle">function</text><text x="605.0" y="258.4" font-size="12" font-weight="700" fill="#334155" text-anchor="middle">01</text><text x="605.0" y="302.0" font-size="10.5" font-weight="400" fill="#5b6b78" text-anchor="middle">sequence</text><text x="709.0" y="258.4" font-size="12" font-weight="700" fill="#334155" text-anchor="middle">rev C</text><text x="709.0" y="302.0" font-size="10.5" font-weight="400" fill="#5b6b78" text-anchor="middle">revision</text><text x="40.0" y="338.0" font-size="12" font-weight="700" fill="#172b3a" text-anchor="start">Retest record</text><text x="85.0" y="368.4" font-size="12" font-weight="700" fill="#334155" text-anchor="middle">BMS</text><text x="85.0" y="412.0" font-size="10.5" font-weight="400" fill="#5b6b78" text-anchor="middle">discipline</text><text x="189.0" y="368.4" font-size="12" font-weight="700" fill="#334155" text-anchor="middle">L4</text><text x="189.0" y="412.0" font-size="10.5" font-weight="400" fill="#5b6b78" text-anchor="middle">level</text><text x="293.0" y="368.4" font-size="12" font-weight="700" fill="#334155" text-anchor="middle">B2-DH3</text><text x="293.0" y="412.0" font-size="10.5" font-weight="400" fill="#5b6b78" text-anchor="middle">location</text><text x="397.0" y="368.4" font-size="12" font-weight="700" fill="#334155" text-anchor="middle">CDU-SEQ</text><text x="397.0" y="412.0" font-size="10.5" font-weight="400" fill="#5b6b78" text-anchor="middle">function</text><text x="501.0" y="368.4" font-size="12" font-weight="700" fill="#334155" text-anchor="middle">01</text><text x="501.0" y="412.0" font-size="10.5" font-weight="400" fill="#5b6b78" text-anchor="middle">sequence</text><text x="605.0" y="368.4" font-size="12" font-weight="700" fill="#334155" text-anchor="middle">RT1</text><text x="605.0" y="412.0" font-size="10.5" font-weight="400" fill="#5b6b78" text-anchor="middle">first retest</text><text x="45.0" y="475.0" font-size="11" font-weight="700" fill="#172b3a" text-anchor="start">Field</text><text x="251.2" y="475.0" font-size="11" font-weight="700" fill="#172b3a" text-anchor="start">Values</text><text x="758.8" y="475.0" font-size="11" font-weight="700" fill="#172b3a" text-anchor="start">Example</text><text x="45.0" y="497.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">Discipline</text><text x="251.2" y="497.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">ELE, MEC, BMS, EPMS, FIRE, NET, INT, IST</text><text x="758.8" y="497.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">MEC</text><text x="45.0" y="519.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">Level</text><text x="251.2" y="519.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">L1 to L5 (L1-FAT for factory)</text><text x="758.8" y="519.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">L4</text><text x="45.0" y="541.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">System</text><text x="251.2" y="541.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">CHW, UPS, CRAH, CDU, MVSG, LVSB, GEN</text><text x="758.8" y="541.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">CHW</text><text x="45.0" y="563.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">Location</text><text x="251.2" y="563.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">building and hall</text><text x="758.8" y="563.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">B2 or B2-DH3</text><text x="45.0" y="585.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">Sequence, retest</text><text x="251.2" y="585.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">two digits; RT1, RT2</text><text x="758.8" y="585.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">01; RT1</text><text x="45.0" y="607.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">Revision</text><text x="251.2" y="607.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">rev A, B, C (draft); 0, 1, 2 (issued)</text><text x="758.8" y="607.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">rev C</text><text x="24.0" y="30.0" font-size="17" font-weight="700" fill="#172b3a" text-anchor="start">F33-16  How an equipment tag and a test record ID are built</text><text x="24.0" y="48.0" font-size="11" font-weight="400" fill="#5b6b78" text-anchor="start">equipment tag B2-DH3-UPS-A1 · test record ID MEC-L4-CHW-B2-STG-01 rev C · retest BMS-L4-B2-DH3-CDU-SEQ-01-RT1 · format of section 03.16.2</text><text x="32.0" y="650.0" font-size="10" font-weight="700" fill="#2d6a4f" text-anchor="start">WHAT TO PROVE</text><text x="32.0" y="666.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">• In MEC-L4-CHW-B2-STG-01 rev C, MEC is the discipline, L4 the level, CHW the system, B2 the building, STG the function (staging) and 01 the sequence number.</text><text x="32.0" y="681.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">• A retest keeps the original ID and adds RT1 or RT2, as in BMS-L4-B2-DH3-CDU-SEQ-01-RT1.</text><text x="24.0" y="716.0" font-size="10" font-weight="700" fill="#5b6b78" text-anchor="start">LEGEND</text><line x1="24" y1="738.0" x2="50" y2="738.0" stroke="#334155" stroke-width="3"/><text x="56.0" y="742.0" font-size="10" font-weight="400" fill="#172b3a" text-anchor="start">data / network</text><rect x="24" y="756.0" width="952" height="44" rx="0" fill="#f6f8fa" fill-opacity="1" stroke="#5b6b78" stroke-width="1"/><text x="32.0" y="770.0" font-size="11" font-weight="700" fill="#172b3a" text-anchor="start">F33-16  ·  How an equipment tag and a test record ID are built</text><text x="968.0" y="770.0" font-size="10" font-weight="400" fill="#5b6b78" text-anchor="end">Chapter 33 · §33.22.1</text><text x="32.0" y="783.0" font-size="9" font-weight="400" fill="#5b6b78" text-anchor="start">Data Centre Commissioning Field Manual R01 EN · October 2026 · educational reference, not to scale · project and OEM documents govern</text><text x="32.0" y="795.0" font-size="9" font-weight="400" fill="#5b6b78" text-anchor="start">Symbols: QElectroTech EN 60617 and P&amp;ID collections, CC-BY 3.0, native geometry · instrument bubbles per ISA 5.1 · states per IEC 60617 / IEEE C37.2 practice</text></svg>