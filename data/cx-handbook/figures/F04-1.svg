8"/><rect x="935.7894736842106" y="446.0" width="404.2105263157895" height="23.0" rx="0" fill="#ffffff" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><rect x="60" y="469.0" width="185.26315789473685" height="23.0" rx="0" fill="#ffffff" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><rect x="245.26315789473685" y="469.0" width="303.15789473684214" height="23.0" rx="0" fill="#ffffff" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><rect x="548.421052631579" y="469.0" width="387.3684210526316" height="23.0" rx="0" fill="#ffffff" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><rect x="935.7894736842106" y="469.0" width="404.2105263157895" height="23.0" rx="0" fill="#ffffff" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><rect x="60" y="492.0" width="185.26315789473685" height="23.0" rx="0" fill="#ffffff" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><rect x="245.26315789473685" y="492.0" width="303.15789473684214" height="23.0" rx="0" fill="#ffffff" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><rect x="548.421052631579" y="492.0" width="387.3684210526316" height="23.0" rx="0" fill="#ffffff" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><rect x="935.7894736842106" y="492.0" width="404.2105263157895" height="23.0" rx="0" fill="#ffffff" fill-opacity="1" stroke="#9fb0bb" stroke-width="0.8"/><text x="185.0" y="181.6" font-size="13" font-weight="700" fill="#172b3a" text-anchor="middle">Work in progress</text><text x="185.0" y="196.4" font-size="11" font-weight="400" fill="#172b3a" text-anchor="middle">code S0</text><text x="185.0" y="211.3" font-size="11" font-weight="400" fill="#172b3a" text-anchor="middle">revision P01.01 ...</text><text x="185.0" y="226.1" font-size="11" font-weight="400" fill="#172b3a" text-anchor="middle">task team only</text><text x="521.0" y="181.6" font-size="13" font-weight="700" fill="#172b3a" text-anchor="middle">Shared</text><text x="521.0" y="196.4" font-size="11" font-weight="400" fill="#172b3a" text-anchor="middle">codes S1 to S4, S6, S7</text><text x="521.0" y="211.3" font-size="11" font-weight="400" fill="#172b3a" text-anchor="middle">revision P01, P02</text><text x="521.0" y="226.1" font-size="11" font-weight="400" fill="#172b3a" text-anchor="middle">other task teams</text><text x="857.0" y="181.6" font-size="13" font-weight="700" fill="#172b3a" text-anchor="middle">Published</text><text x="857.0" y="196.4" font-size="11" font-weight="400" fill="#172b3a" text-anchor="middle">codes A1..An, B1..Bn, CR</text><text x="857.0" y="211.3" font-size="11" font-weight="400" fill="#172b3a" text-anchor="middle">revision C01, C02</text><text x="857.0" y="226.1" font-size="11" font-weight="400" fill="#172b3a" text-anchor="middle">site and all parties</text><text x="1193.0" y="181.6" font-size="13" font-weight="700" fill="#172b3a" text-anchor="middle">Archived</text><text x="1193.0" y="196.4" font-size="11" font-weight="400" fill="#172b3a" text-anchor="middle">read only</text><text x="1193.0" y="211.3" font-size="11" font-weight="400" fill="#172b3a" text-anchor="middle">marked superseded</text><text x="1193.0" y="226.1" font-size="11" font-weight="400" fill="#172b3a" text-anchor="middle">kept for retention</text><text x="60.0" y="136.0" font-size="11" font-weight="700" fill="#5b6b78" text-anchor="start">Gate 1: task team lead check</text><text x="396.0" y="136.0" font-size="11" font-weight="700" fill="#5b6b78" text-anchor="start">Gate 2: authorise and accept</text><text x="732.0" y="136.0" font-size="11" font-weight="700" fill="#5b6b78" text-anchor="start">Gate 3: next revision published</text><text x="361.0" y="342.0" font-size="11" font-weight="400" fill="#b91c1c" text-anchor="start">Rejected at review: back to WIP, version suffix increases (P02.01)</text><text x="65.0" y="415.6" font-size="11.5" font-weight="700" fill="#172b3a" text-anchor="start">State</text><text x="250.3" y="415.6" font-size="11.5" font-weight="700" fill="#172b3a" text-anchor="start">Who sees it</text><text x="553.4" y="415.6" font-size="11.5" font-weight="700" fill="#172b3a" text-anchor="start">Use allowed</text><text x="940.8" y="415.6" font-size="11.5" font-weight="700" fill="#172b3a" text-anchor="start">Gate to next state</text><text x="65.0" y="438.6" font-size="11.5" font-weight="400" fill="#172b3a" text-anchor="start">Work in progress</text><text x="250.3" y="438.6" font-size="11.5" font-weight="400" fill="#172b3a" text-anchor="start">authoring task team</text><text x="553.4" y="438.6" font-size="11.5" font-weight="400" fill="#172b3a" text-anchor="start">drafting and internal check</text><text x="940.8" y="438.6" font-size="11.5" font-weight="400" fill="#172b3a" text-anchor="start">task team lead approves for sharing</text><text x="65.0" y="461.6" font-size="11.5" font-weight="400" fill="#172b3a" text-anchor="start">Shared</text><text x="250.3" y="461.6" font-size="11.5" font-weight="400" fill="#172b3a" text-anchor="start">other task teams, lead appointed party</text><text x="553.4" y="461.6" font-size="11.5" font-weight="400" fill="#172b3a" text-anchor="start">coordination, information, review, authorisation</text><text x="940.8" y="461.6" font-size="11.5" font-weight="400" fill="#172b3a" text-anchor="start">lead appointed party authorises; owner accepts</text><text x="65.0" y="484.6" font-size="11.5" font-weight="400" fill="#172b3a" text-anchor="start">Published</text><text x="250.3" y="484.6" font-size="11.5" font-weight="400" fill="#172b3a" text-anchor="start">all parties including site</text><text x="553.4" y="484.6" font-size="11.5" font-weight="400" fill="#172b3a" text-anchor="start">construction, procurement, testing, handover</text><text x="940.8" y="484.6" font-size="11.5" font-weight="400" fill="#172b3a" text-anchor="start">superseded by the next revision</text><text x="65.0" y="507.6" font-size="11.5" font-weight="400" fill="#172b3a" text-anchor="start">Archived</text><text x="250.3" y="507.6" font-size="11.5" font-weight="400" fill="#172b3a" text-anchor="start">all, read only</text><text x="553.4" y="507.6" font-size="11.5" font-weight="400" fill="#172b3a" text-anchor="start">record and dispute evidence only</text><text x="940.8" y="507.6" font-size="11.5" font-weight="400" fill="#172b3a" text-anchor="start">none</text><text x="24.0" y="30.0" font-size="17" font-weight="700" fill="#172b3a" text-anchor="start">F04-1  CDE container states and the approval gates between them</text><text x="24.0" y="48.0" font-size="11" font-weight="400" fill="#5b6b78" text-anchor="start">ISO 19650 states: work in progress, shared, published, archived · status codes S0, S1 to S7, A1 to An, B1 to Bn, CR · revisions P01.01, P01, C01</text><text x="32.0" y="551.0" font-size="10" font-weight="700" fill="#2d6a4f" text-anchor="start">WHAT TO PROVE</text><text x="32.0" y="567.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">• Shared containers carry P revisions and S codes; published containers carry A or B codes, and contractual issues carry C revisions.</text><text x="32.0" y="582.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">• The WIP version suffix (P01.03) is dropped when the container is shared (P01); the superseded published revision stays readable in the archive.</text><text x="24.0" y="617.0" font-size="10" font-weight="700" fill="#5b6b78" text-anchor="start">LEGEND</text><line x1="24" y1="639.0" x2="50" y2="639.0" stroke="#475569" stroke-width="3"/><text x="56.0" y="643.0" font-size="10" font-weight="400" fill="#172b3a" text-anchor="start">signal / control</text><line x1="151.9671875" y1="639.0" x2="177.9671875" y2="639.0" stroke="#b91c1c" stroke-width="3"/><text x="184.0" y="643.0" font-size="10" font-weight="400" fill="#172b3a" text-anchor="start">trip / protection</text><rect x="24" y="657.0" width="1352" height="44" rx="0" fill="#f6f8fa" fill-opacity="1" stroke="#5b6b78" stroke-width="1"/><text x="32.0" y="671.0" font-size="11" font-weight="700" fill="#172b3a" text-anchor="start">F04-1  ·  CDE container states and the approval gates between them</text><text x="1368.0" y="671.0" font-size="10" font-weight="400" fill="#5b6b78" text-anchor="end">Chapter 04 · §04.2</text><text x="32.0" y="684.0" font-size="9" font-weight="400" fill="#5b6b78" text-anchor="start">Data Centre Commissioning Field Manual R01 EN · October 2026 · educational reference, not to scale · project and OEM documents govern</text><text x="32.0" y="696.0" font-size="9" font-weight="400" fill="#5b6b78" text-anchor="start">Symbols: QElectroTech EN 60617 and P&amp;ID collections, CC-BY 3.0, native geometry · instrument bubbles per ISA 5.1 · states per IEC 60617 / IEEE C37.2 practice</text></svg>