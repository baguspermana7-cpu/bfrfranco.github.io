</text><text x="1103.5" y="145.0" font-size="11" font-weight="700" fill="#172b3a" text-anchor="start">Qty</text><text x="1182.7" y="145.0" font-size="11" font-weight="700" fill="#172b3a" text-anchor="start">Max</text><text x="1277.8" y="145.0" font-size="11" font-weight="700" fill="#172b3a" text-anchor="start">Total dB</text><text x="945.0" y="167.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">Connector pair</text><text x="1103.5" y="167.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">2</text><text x="1182.7" y="167.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">0.75 dB</text><text x="1277.8" y="167.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">1.50</text><text x="945.0" y="189.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">Fusion splice</text><text x="1103.5" y="189.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">2</text><text x="1182.7" y="189.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">0.3 dB</text><text x="1277.8" y="189.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">0.60</text><text x="945.0" y="211.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">OS2 fibre</text><text x="1103.5" y="211.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">1.20 km</text><text x="1182.7" y="211.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">0.5 dB/km</text><text x="1277.8" y="211.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">0.60</text><text x="945.0" y="233.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">Budget</text><text x="1103.5" y="233.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start"></text><text x="1182.7" y="233.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start"></text><text x="1277.8" y="233.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">2.70</text><text x="945.0" y="255.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">Measured 1310 nm</text><text x="1103.5" y="255.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start"></text><text x="1182.7" y="255.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start"></text><text x="1277.8" y="255.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">1.26</text><text x="945.0" y="277.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">Measured 1550 nm</text><text x="1103.5" y="277.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start"></text><text x="1182.7" y="277.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start"></text><text x="1277.8" y="277.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">1.42</text><text x="945.0" y="299.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">Margin 1310 nm</text><text x="1103.5" y="299.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start"></text><text x="1182.7" y="299.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start"></text><text x="1277.8" y="299.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">1.44</text><circle cx="823.7" cy="216.9" r="4" fill="#b7791f"/><circle cx="823.7" cy="373.2" r="4" fill="#b7791f"/><text x="24.0" y="30.0" font-size="17" font-weight="700" fill="#172b3a" text-anchor="start">F26-3  Loss budget of an OS2 campus link: maximum values of ANSI/TIA-568.3-D against the measured loss</text><text x="24.0" y="48.0" font-size="11" font-weight="400" fill="#5b6b78" text-anchor="start">B2 MDF to campus core · 1.20 km indoor-outdoor OS2 at 0.5 dB/km · 2 mated connector pairs at 0.75 dB · 2 fusion splices at 0.3 dB · budget 2.70 dB at 1310 and 1550 nm · measured 1.26 dB at 1310 nm, 1.42 dB at 1550 nm</text><text x="32.0" y="622.0" font-size="10" font-weight="700" fill="#2d6a4f" text-anchor="start">WHAT TO PROVE</text><text x="32.0" y="638.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">• Budget = 1.20 x 0.5 + 2 x 0.75 + 2 x 0.3 = 0.60 + 1.50 + 0.60 = 2.70 dB; measured 1.26 dB at 1310 nm passes with 1.44 dB margin.</text><text x="32.0" y="653.0" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">• Loss at 1550 nm (1.42 dB) is higher than at 1310 nm (1.26 dB) although fibre loss is lower at 1550 nm: this points to a bend, which the OTDR trace F26-6 locates at 1.00 km.</text><rect x="24" y="686" width="1352" height="44" rx="0" fill="#f6f8fa" fill-opacity="1" stroke="#5b6b78" stroke-width="1"/><text x="32.0" y="700.0" font-size="11" font-weight="700" fill="#172b3a" text-anchor="start">F26-3  ·  Loss budget of an OS2 campus link: maximum values of ANSI/TIA-568.3-D against the measured loss</text><text x="1368.0" y="700.0" font-size="10" font-weight="400" fill="#5b6b78" text-anchor="end">Chapter 26 · §26.5</text><text x="32.0" y="713.0" font-size="9" font-weight="400" fill="#5b6b78" text-anchor="start">Data Centre Commissioning Field Manual R01 EN · October 2026 · educational reference, not to scale · project and OEM documents govern</text><text x="32.0" y="725.0" font-size="9" font-weight="400" fill="#5b6b78" text-anchor="start">Symbols: QElectroTech EN 60617 and P&amp;ID collections, CC-BY 3.0, native geometry · instrument bubbles per ISA 5.1 · states per IEC 60617 / IEEE C37.2 practice</text></svg>