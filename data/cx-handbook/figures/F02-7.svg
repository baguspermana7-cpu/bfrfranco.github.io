 days for L2 to L4 in one hall.</text><text x="32.0" y="763.8" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">• The UPS block needs 2 + 1 + 2 = 5 days for L2 to L4; eight blocks per hall repeat this ladder.</text><rect x="24" y="796.84" width="952" height="44" rx="0" fill="#f6f8fa" fill-opacity="1" stroke="#5b6b78" stroke-width="1"/><text x="32.0" y="810.8" font-size="11" font-weight="700" fill="#172b3a" text-anchor="start">F02-7  ·  Six level ladders compared: durations from L1 to L4</text><text x="968.0" y="810.8" font-size="10" font-weight="400" fill="#5b6b78" text-anchor="end">Chapter 02 · §02.7.5</text><text x="32.0" y="823.8" font-size="9" font-weight="400" fill="#5b6b78" text-anchor="start">Data Centre Commissioning Field Manual R01 EN · October 2026 · educational reference, not to scale · project and OEM documents govern</text><text x="32.0" y="835.8" font-size="9" font-weight="400" fill="#5b6b78" text-anchor="start">Symbols: QElectroTech EN 60617 and P&amp;ID collections, CC-BY 3.0, native geometry · instrument bubbles per ISA 5.1 · states per IEC 60617 / IEEE C37.2 practice</text></svg>