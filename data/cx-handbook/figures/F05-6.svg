th="1"/><line x1="228.5" y1="120" x2="228.5" y2="160" stroke="#334155" stroke-width="2"/><line x1="459.5" y1="118" x2="459.5" y2="162" stroke="#475569" stroke-width="2.4"/><circle cx="459.5" cy="140.0" r="4" fill="#475569"/><line x1="228.5" y1="180" x2="228.5" y2="220" stroke="#b91c1c" stroke-width="2"/><line x1="806.0" y1="178" x2="806.0" y2="222" stroke="#475569" stroke-width="2.4"/><circle cx="806.0" cy="200.0" r="4" fill="#475569"/><line x1="498.0" y1="238" x2="498.0" y2="282" stroke="#b91c1c" stroke-width="2.4"/><circle cx="498.0" cy="260.0" r="4" fill="#b91c1c"/><rect x="40" y="354" width="920" height="75.825" rx="4" fill="#fffbe6" fill-opacity="1" stroke="#b7791f" stroke-width="1.2"/><text x="48.0" y="144.0" font-size="11" font-weight="700" fill="#172b3a" text-anchor="start">RFI-B2-ELE-0142</text><text x="48.0" y="204.0" font-size="11" font-weight="700" fill="#172b3a" text-anchor="start">ISS-B2-0410</text><text x="48.0" y="264.0" font-size="11" font-weight="700" fill="#172b3a" text-anchor="start">Programme</text><text x="190.0" y="304.0" font-size="10" font-weight="400" fill="#5b6b78" text-anchor="middle">2 Jun</text><text x="382.5" y="304.0" font-size="10" font-weight="400" fill="#5b6b78" text-anchor="middle">7 Jun</text><text x="575.0" y="304.0" font-size="10" font-weight="400" fill="#5b6b78" text-anchor="middle">12 Jun</text><text x="767.5" y="304.0" font-size="10" font-weight="400" fill="#5b6b78" text-anchor="middle">17 Jun</text><text x="960.0" y="304.0" font-size="10" font-weight="400" fill="#5b6b78" text-anchor="middle">22 Jun</text><text x="233.5" y="144.0" font-size="10" font-weight="400" fill="#172b3a" text-anchor="start">open, P2</text><text x="466.5" y="144.0" font-size="10" font-weight="400" fill="#475569" text-anchor="start">closed 09 Jun</text><text x="233.5" y="204.0" font-size="10" font-weight="400" fill="#172b3a" text-anchor="start">open: replace CTs, test ratio</text><text x="813.0" y="204.0" font-size="10" font-weight="400" fill="#475569" text-anchor="start">closed 18 Jun</text><text x="505.0" y="264.0" font-size="10" font-weight="400" fill="#b91c1c" text-anchor="start">required by 10 Jun</text><text x="50.0" y="367.8" font-size="11.5" font-weight="700" fill="#b7791f" text-anchor="start">Link rules (05.10.2)</text><text x="50.0" y="383.9" font-size="11.5" font-weight="400" fill="#172b3a" text-anchor="start">The RFI &quot;linked items&quot; field holds ISS-B2-0410; the issue record holds RFI-B2-ELE-0142.</text><text x="50.0" y="399.4" font-size="11.5" font-weight="400" fill="#172b3a" text-anchor="start">An answer that changes a sequence, setpoint or alarm priority goes to the CxA within 3 working days.</text><text x="50.0" y="414.9" font-size="11.5" font-weight="400" fill="#172b3a" text-anchor="start">Each week the CxM compares open Cx RFIs with open Cx issues and corrects any unlinked item.</text><text x="24.0" y="30.0" font-size="17" font-weight="700" fill="#172b3a" text-anchor="start">F05-6  One RFI and its linked Cx issue: RFI-B2-ELE-0142 and ISS-B2-0410</text><text x="24.0" y="48.0" font-size="11" font-weight="400" fill="#5b6b78" text-anchor="start">RFI opened 03 Jun · answered 08 Jun · closed 09 Jun · required by 10 Jun · Cx issue closed 18 Jun after CT change and ratio test</text><text x="32.0" y="465.8" font-size="10" font-weight="700" fill="#2d6a4f" text-anchor="start">WHAT TO PROVE</text><text x="32.0" y="481.8" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">• The RFI was answered on 08 Jun 2026, 2 days before its required-by date of 10 Jun 2026 (3 working days after it opened).</text><text x="32.0" y="496.8" font-size="11" font-weight="400" fill="#172b3a" text-anchor="start">• The Cx issue ISS-B2-0410 closed on 18 Jun 2026, 9 days after the RFI closed on 09 Jun 2026.</text><rect x="24" y="529.825" width="952" height="44" rx="0" fill="#f6f8fa" fill-opacity="1" stroke="#5b6b78" stroke-width="1"/><text x="32.0" y="543.8" font-size="11" font-weight="700" fill="#172b3a" text-anchor="start">F05-6  ·  One RFI and its linked Cx issue: RFI-B2-ELE-0142 and ISS-B2-0410</text><text x="968.0" y="543.8" font-size="10" font-weight="400" fill="#5b6b78" text-anchor="end">Chapter 05 · §05.10.1</text><text x="32.0" y="556.8" font-size="9" font-weight="400" fill="#5b6b78" text-anchor="start">Data Centre Commissioning Field Manual R01 EN · October 2026 · educational reference, not to scale · project and OEM documents govern</text><text x="32.0" y="568.8" font-size="9" font-weight="400" fill="#5b6b78" text-anchor="start">Symbols: QElectroTech EN 60617 and P&amp;ID collections, CC-BY 3.0, native geometry · instrument bubbles per ISA 5.1 · states per IEC 60617 / IEEE C37.2 practice</text></svg>