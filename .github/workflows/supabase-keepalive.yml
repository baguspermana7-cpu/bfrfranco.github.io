name: Supabase keep-alive

# Free-tier Supabase projects auto-pause after ~7 days of inactivity, which breaks login
# (auth returns NetworkError). This pings the project every 3 days so it never goes idle.
# Runs on GitHub's infrastructure — no local machine needed.
#
# Uses the PUBLISHABLE (anon) key only — the same key already shipped publicly in
# js/rz-config.js. It grants no privileged access; it just makes the request count as activity.
# To override without editing this file, set repo Variables SUPABASE_URL / SUPABASE_ANON
# (Settings -> Secrets and variables -> Actions -> Variables).

on:
  schedule:
    - cron: '17 6 */3 * *'   # every 3 days, 06:17 UTC
  workflow_dispatch: {}        # manual "Run workflow" button

permissions:
  contents: read

concurrency:
  group: supabase-keepalive
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping Supabase (auth + REST) to keep the free project active
        env:
          SB: ${{ vars.SUPABASE_URL != '' && vars.SUPABASE_URL || 'https://kffjaqkqwhvbqxdumyll.supabase.co' }}
          AK: ${{ vars.SUPABASE_ANON != '' && vars.SUPABASE_ANON || 'sb_publishable_pALlKKusg565V6UFgLDmIA_yrbfUyZU' }}
        run: |
          set -u
          fail=0
          hit () {
            local name="$1" url="$2"
            local code
            code=$(curl -sS -o /dev/null -w '%{http_code}' -m 25 -H "apikey: $AK" "$url" || echo 000)
            echo "$name -> HTTP $code"
            # 2xx/3xx/4xx all prove the project answered (not paused). 000/5xx = unreachable.
            case "$code" in
              000|5??) fail=1 ;;
            esac
          }
          hit "auth/health"   "$SB/auth/v1/health"
          hit "auth/settings" "$SB/auth/v1/settings"
          hit "rest/root"     "$SB/rest/v1/?apikey=$AK"
          if [ "$fail" = "1" ]; then
            echo "::warning::Supabase did not answer on at least one endpoint — it may be paused/restoring."
            # Do not fail the run for a transient blip; the next scheduled ping retries.
          fi
          echo "keep-alive ping complete"
