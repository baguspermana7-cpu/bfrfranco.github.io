  # ============================================================
  osm_way_1173363412:    # GI KCIC Karawang
    confidence_override: high
    # year stays 1996 (original construction); KCIC traction integration was 2023, see notes
    notes: |
      Gardu Induk KCIC Karawang — 150 kV traction-feeding substation; one of 4
      KCIC LAA (Listrik Aliran Atas) traction substations powering the Jakarta–
      Bandung high-speed rail at 27.5 kV AC overhead catenary. Traction-energized
      May 2023. The same substation also serves the Karawang industrial cluster
      (KIIC, Suryacipta, Bukit Indah city, Toyota Karawang plant). Aliases:
      "GI 150 kV Karawang", "GI KCIC Karawang Stage 2".
      Sources: KCIC press 2023-05 (kcic.co.id), PLN 2023-05 (web.pln.co.id),
      Antara news 2023-05 (antaranews.com).
    served_areas:
      - "KIIC Karawang"
      - "Suryacipta industrial"
      - "Bukit Indah city"
      - "Karawang Toyota plant"
      - "KCJB traction (Karawang substation)"

  osm_way_1194972513:    # GI KCIC Tegalluar
    mva: 80
    year: 2023
    cod: 2023
    confidence_override: high
    notes: |
      Gardu Induk KCIC Tegalluar — 150 kV GIS traction substation, eastern
      terminus feeder for the KCJB high-speed rail (27.5 kV AC overhead
