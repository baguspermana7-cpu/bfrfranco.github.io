      Kiaracondong–Ujungberung. Operational May 2023 for KCJB launch.
      Located near Bandung Regency final stop. Aliases: "GIS 150 kV Tegalluar",
      "Tegalluar TSS".
      Sources: PLN press 2023-05, Tempo 2023-05 (tempo.co), KCIC.co.id press.
    served_areas:
      - "KCJB traction (Tegalluar terminus)"
      - "Tegalluar surrounding industrial"
      - "Bandung Regency east edge"

  osm_way_1249943031:    # GI KCIC Walini
    mva: 80
    year: 2023
    cod: 2023
    confidence_override: high
    notes: |
      Gardu Induk KCIC Walini — 150 kV GIS traction substation, mid-line
      feeder for the KCJB high-speed rail (27.5 kV AC overhead catenary).
      Fed via new ~28.4 km SUTT 150 kV Cirata – Padalarang Baru II –
      KCIC Walini – Padalarang line. Operational May 2023.
      NOTE: the originally-planned Walini PASSENGER STATION was canceled
      pre-launch for ridership reasons, but the traction substation is built
      and operational — Walini remains a critical electrical mid-section feeder
      even though no train stops there. Aliases: "GIS 150 kV Walini",
      "Walini TSS".
      Sources: PLN press 2023-05, en.wikipedia.org/wiki/Kereta_Cepat_Indonesia_China,
      KCIC.co.id press, redigest.web.id 2023-05.
    served_areas:
      - "KCJB traction (Walini mid-section)"
      - "West Bandung Regency, Padalarang area"

  osm_way_734815592:    # GI Margakarya / KIIC II
    confidence_override: high
    # year/cod intentionally omitted — Elsewedy extension is 2024 (see notes), but
    # the underlying GI Margakarya predates that and the OSM-side year is unknown
    notes: |
      Gardu Induk Margakarya — also known officially as "GI 150 kV KIIC II /
      Margakarya". 150 kV substation feeding KIIC industrial estate Karawang.
      Designated transmission lines: JKT 09 and JKT 02. Recent extension built
      by PLN and Elsewedy Electric Indonesia (Rp 188.5 B contract) supports
      surge in DC campus and EV-supply-chain manufacturing demand in the
      Karawang corridor. Aliases: "GI KIIC II", "GI Margakarya".
      Sources: SWA 2025 (swa.co.id/read/392655), Infobanknews 2025
      (infobanknews.com), PLN 2025 press release.
    served_areas:
      - "KIIC Karawang industrial"
      - "Suryacipta industrial"
      - "Karawang EV-supply-chain manufacturing cluster"

