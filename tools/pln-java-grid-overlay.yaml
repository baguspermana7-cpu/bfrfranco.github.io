    year: 2021
    cod: 2021
    confidence_override: high
    notes: |
      GIS Poncol Baru II — 150 kV gas-insulated substation in Margahayu, Bekasi
      Timur, on PLN ULTG Bekasi land. Energized 2021-09-22, Rp 165 B investment.
      Built specifically to FEED KCIC TRACTION AT GI HALIM (one of the SUTT
      150 kV bay-line connections to Traksi Halim). Also supplies Bekasi City.
      DISTINCT FROM GIS BEKASI II / SUMMARECON (osm_way_1314376180): both share
      the PLN ULTG Bekasi facility footprint, but are separate substations
      serving different functions. Bekasi II/Summarecon (2018) is the Asian
      Games supply for Kota Bekasi + Summarecon developer area; Poncol Baru II
      (2021) is the KCIC traction feeder. Together, the two GIS substations
      provide the user's "2 sumber gardu" — Bekasi (the bulk + Asian Games path)
      and Summarecon-area (the KCIC path).
      Sources: PLN Nusantara Power Construction (plnnpc.com/?p=3291), PLN press
      2023-05, IDNFinancials 2021 (idnfinancials.com/id/news/40721), KCIC.co.id
      press 2021.
    served_areas:
