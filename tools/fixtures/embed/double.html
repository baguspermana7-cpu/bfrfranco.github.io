<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>embed fixture: y = 2x</title></head>
<body data-rz-calc-fixture="double">
<!-- Fixture for tools/test-embed-compute.mjs: the result follows the input through the input event only. -->
<input id="x" type="number" value="1">
<output id="y">2</output>
<script>
  document.getElementById('x').addEventListener('input', function (e) {
    document.getElementById('y').textContent = String(2 * parseFloat(e.target.value));
  });
</script>
</body></html>
