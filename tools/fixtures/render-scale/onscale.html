<!doctype html><html lang="en"><head><meta charset="utf-8"><title>render scale fixture: ongrid</title>
<style>body{margin:0;font:16px/1.5 sans-serif}div{margin:0;padding:0}</style></head><body>
<!-- the same three boxes on the scale -->
<div id="f1" style="font-size:14px">on-scale font</div>
<div id="s1" style="display:flex;column-gap:8px;width:100px;height:20px"><span style="width:10px;height:10px;display:block"></span></div>
<div id="r1" style="border-top-left-radius:4px;width:100px;height:40px;background:#ccc"></div>
<!-- skipped by rule: each would be off-scale if it were counted -->
<div style="display:none;font-size:17.3px;padding:7px">hidden</div>
<div style="visibility:hidden;font-size:17.3px;padding:7px">invisible</div>
<svg width="40" height="20"><text x="0" y="12" style="font-size:17.3px">svg</text><foreignObject width="40" height="20"><div style="padding:7px">in svg</div></foreignObject></svg>
<i class="fa fa-bolt" style="font-size:17.3px;padding:7px">i</i>
<iframe title="frame" style="padding:7px;width:40px;height:20px;border:0" srcdoc="<p style='font-size:17.3px'>inside</p>"></iframe>
<span style="column-gap:7px;row-gap:7px">gap on an inline box</span>
<a href="#" style="margin-top:7px;margin-bottom:7px">vertical margin on an inline box</a>
</body></html>
