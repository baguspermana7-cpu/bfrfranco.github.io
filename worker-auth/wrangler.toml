name = "rz-auth-gateway"
main = "src/index.js"
compatibility_date = "2026-05-22"
compatibility_flags = ["nodejs_compat"]

kv_namespaces = [{ binding = "RZ_AUTH_KV", id = "PLACEHOLDER_REPLACE_VIA_SETUP_MD" }]

# Secrets to set via `wrangler secret put` (NOT here, NEVER committed):
#   ADMIN_SESSION_SECRET    — HMAC pepper for session tokens (32+ bytes random)
#   BOOTSTRAP_ROOT_EMAILS   — comma-separated seed root emails for one-time
#                             /admin/__seed endpoint (bagus@..., admin@...)
